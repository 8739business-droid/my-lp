<title>Core Bloom AI Video Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: fixed left rail, single reading column near 68ch, sticky section index on wide screens.
   Dark-first, graded like a colour suite. Ice-blue accent from the Niseko locale; each week carries its own hue. */
:root{
  --bg:#0E1218; --bg-2:#0B0E13; --surface:#151A22; --surface-2:#1C232D; --surface-3:#242E3A;
  --line:#28313D; --line-strong:#3A4654;
  --fg:#E8ECF2; --fg-dim:#AEB9C8; --fg-mute:#7C8799;
  --accent:#8CB9E0; --accent-strong:#A9CDEC; --accent-ink:#0E1218; --accent-soft:#15283A;
  --ok:#74B08C; --ok-soft:#15271D;
  --warn:#C9A14E; --warn-soft:#292213;
  --alert:#C9776C; --alert-soft:#2B1917;
  --w1:#8CB9E0; --w2:#D9A368; --w3:#7FBFAE; --w4:#B29CDC; --w5:#A3B389; --w6:#D98E88;
  --f-img:#7FBFAE; --f-vid:#D9A368; --f-slot:#B29CDC; --f-doc:#9AA7B8;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.5);
  --font-display:"Zen Old Mincho",'Hiragino Mincho ProN',"Yu Mincho",serif;
  --font-body:"Zen Kaku Gothic New",'Hiragino Sans',"Yu Gothic",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --rail:252px;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#F5F7FA; --bg-2:#EDF1F6; --surface:#FFFFFF; --surface-2:#EFF3F8; --surface-3:#E3E9F1;
    --line:#DBE2EB; --line-strong:#BDC8D6;
    --fg:#161F2D; --fg-dim:#475569; --fg-mute:#6B7891;
    --accent:#2B6392; --accent-strong:#1C4C75; --accent-ink:#FFFFFF; --accent-soft:#E5EFF8;
    --ok:#3C7A57; --ok-soft:#E2F0E7;
    --warn:#87631A; --warn-soft:#F6EFDC; --alert:#A2443A; --alert-soft:#F8E7E4;
    --w1:#2B6392; --w2:#8C5A1E; --w3:#2E7566; --w4:#5E4B93; --w5:#566B38; --w6:#A1483F;
    --f-img:#2E7566; --f-vid:#8C5A1E; --f-slot:#5E4B93; --f-doc:#5A6676;
    --shadow:0 1px 2px rgba(16,30,54,.06), 0 10px 28px -16px rgba(16,30,54,.22);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F5F7FA; --bg-2:#EDF1F6; --surface:#FFFFFF; --surface-2:#EFF3F8; --surface-3:#E3E9F1;
  --line:#DBE2EB; --line-strong:#BDC8D6;
  --fg:#161F2D; --fg-dim:#475569; --fg-mute:#6B7891;
  --accent:#2B6392; --accent-strong:#1C4C75; --accent-ink:#FFFFFF; --accent-soft:#E5EFF8;
  --ok:#3C7A57; --ok-soft:#E2F0E7;
  --warn:#87631A; --warn-soft:#F6EFDC; --alert:#A2443A; --alert-soft:#F8E7E4;
  --w1:#2B6392; --w2:#8C5A1E; --w3:#2E7566; --w4:#5E4B93; --w5:#566B38; --w6:#A1483F;
  --f-img:#2E7566; --f-vid:#8C5A1E; --f-slot:#5E4B93; --f-doc:#5A6676;
  --shadow:0 1px 2px rgba(16,30,54,.06), 0 10px 28px -16px rgba(16,30,54,.22);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:auto}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.95;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-feature-settings:"palt" 1}
.prose{max-width:43em}
.prose p+p{margin-top:1.15em}
.prose ul{margin:1em 0;padding-inline-start:0;list-style:none;display:flex;flex-direction:column;gap:.6em}
.prose ul li{display:flex;gap:.7em}
.prose ul li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);flex:none;margin-top:.72em;opacity:.8}
.prose ol{margin:1em 0;padding-inline-start:1.4em;display:flex;flex-direction:column;gap:.6em}
.prose ol li{padding-inline-start:.3em}
.prose ol li::marker{font-family:var(--font-mono);font-size:.82em;color:var(--accent)}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;text-wrap:balance;margin:0;line-height:1.42}
p{margin:0}
::selection{background:var(--accent-soft);color:var(--fg)}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100%}
.rail{position:fixed;inset-block:0;inset-inline-start:0;width:var(--rail);background:var(--bg-2);border-inline-end:1px solid var(--line);overflow-y:auto;z-index:30;padding-top:env(safe-area-inset-top,0px);display:flex;flex-direction:column}
.brand{padding:22px 20px 17px}
.brand-mark{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.26em;color:var(--accent);text-transform:uppercase}
.brand-name{font-family:var(--font-display);font-size:18px;line-height:1.34;margin-top:8px}
.brand-sub{font-size:10.5px;color:var(--fg-mute);margin-top:6px;letter-spacing:.05em}
.railprog{padding:0 20px 16px;border-bottom:1px solid var(--line)}
.railprog .pr{display:flex;justify-content:space-between;align-items:baseline;font-size:10.5px;color:var(--fg-mute);margin-bottom:6px;font-family:var(--font-mono);letter-spacing:.08em}
.search-wrap{padding:13px 12px 0}
.search-wrap input{width:100%;font:inherit;font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 11px;color:var(--fg)}
.search-wrap input::placeholder{color:var(--fg-mute)}
.nav{padding:10px 12px 16px;display:flex;flex-direction:column;gap:1px}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 12px;border-radius:7px;color:var(--fg-dim);text-decoration:none;font-size:13px;font-weight:500}
.nav a:hover{background:var(--surface-2);color:var(--fg)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-strong)}
.nav .ico{width:16px;flex:none;opacity:.8;font-family:var(--font-mono);font-size:12px;text-align:center}
.rail-foot{margin-top:auto;padding:14px 20px 20px;border-top:1px solid var(--line);font-size:10.5px;color:var(--fg-mute);line-height:1.7}
.themebar{display:flex;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:3px;margin-bottom:12px}
.themebar button{flex:1;font:inherit;font-size:10.5px;padding:4px 2px;border:0;background:transparent;color:var(--fg-mute);border-radius:5px;cursor:pointer;font-family:var(--font-mono)}
.themebar button[aria-pressed="true"]{background:var(--surface-3);color:var(--fg)}
.main{flex:1;min-width:0;margin-inline-start:var(--rail)}
.wrap{max-width:1460px;margin:0 auto;padding-inline:44px;padding-block:52px 120px;display:grid;grid-template-columns:minmax(0,1fr);gap:64px}
.wrap.has-index{grid-template-columns:minmax(0,1fr) 216px}
.col{min-width:0;max-width:900px}
@media (max-width:1300px){ .wrap.has-index{grid-template-columns:minmax(0,1fr)} .sideindex{display:none} }
@media (max-width:1100px){ .wrap{padding-inline:32px} }
@media (max-width:900px){
  .rail{position:static;width:auto;border-inline-end:0;border-bottom:1px solid var(--line)}
  .shell{flex-direction:column}
  .main{margin-inline-start:0}
  .brand{padding:16px 16px 12px}
  .railprog{padding:0 16px 12px}
  .search-wrap{padding:10px 12px 0}
  .nav{flex-direction:row;overflow-x:auto;padding:8px;gap:4px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav a{white-space:nowrap;padding:7px 11px;font-size:12.5px}
  .nav .ico{display:none}
  .rail-foot{display:none}
  .wrap{padding-inline:18px;padding-block:28px 88px;gap:0}
}

/* ---------- type ---------- */
.eyebrow{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--fg-mute)}
.page-title{font-size:38px;margin-top:14px;letter-spacing:.01em;line-height:1.36}
.page-lede{color:var(--fg-dim);margin-top:16px;max-width:40em;font-size:16.5px;line-height:1.85}
h2.sec{font-size:21px;margin:0;letter-spacing:.01em}
.sec-head{display:flex;align-items:baseline;gap:16px;margin:58px 0 22px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.sec-head .n{font-family:var(--font-mono);font-size:11px;color:var(--accent);letter-spacing:.16em;flex:none;font-weight:600}
@media (max-width:900px){.page-title{font-size:27px}.sec-head{margin:42px 0 18px}h2.sec{font-size:18px}body{font-size:15.5px}}

/* ---------- parts ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:24px}
.card.lift{transition:border-color .18s ease, transform .18s ease}
.card.lift:hover{border-color:var(--line-strong);transform:translateY(-1px)}
.grid{display:grid;gap:13px}
.g2{grid-template-columns:repeat(auto-fit,minmax(310px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11.5px;letter-spacing:.05em;padding:5px 11px;border-radius:6px;background:var(--surface-2);color:var(--fg-dim);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.alert{background:var(--alert-soft);color:var(--alert);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent-strong);border-color:transparent}
.chip.wk{background:transparent;color:var(--wk);border-color:var(--wk)}
.btn{font:inherit;font-size:13px;font-weight:500;padding:9px 16px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--fg);cursor:pointer;transition:background .15s}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}
.btn.primary:hover{background:var(--accent-strong)}
.btn.sm{padding:5px 11px;font-size:11.5px}
.meter{height:5px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.meter>i{display:block;height:100%;background:var(--bar,var(--accent));border-radius:99px;transition:width .5s cubic-bezier(.3,1,.4,1)}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.stat .k{font-size:10.5px;color:var(--fg-mute);letter-spacing:.08em;font-family:var(--font-mono)}
.stat .v{font-family:var(--font-mono);font-size:27px;font-variant-numeric:tabular-nums;margin-top:5px;line-height:1.15;font-weight:500}
.stat .u{font-size:12px;color:var(--fg-mute);margin-inline-start:3px}
.muted{color:var(--fg-mute)} .dim{color:var(--fg-dim)} .small{font-size:12.5px}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:
  radial-gradient(120% 140% at 88% -20%, var(--accent-soft) 0%, transparent 55%), var(--surface);
  padding:28px;display:flex;gap:28px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}
.hero .hb{flex:1;min-width:230px}
.ring{flex:none;display:grid;place-items:center;position:relative;width:118px;height:118px}
.ring svg{transform:rotate(-90deg)}
.ring .rv{position:absolute;text-align:center;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.ring .rv b{font-size:27px;font-weight:500;display:block;line-height:1.1}
.ring .rv span{font-size:9.5px;color:var(--fg-mute);letter-spacing:.14em}

/* ---------- week / lesson lists ---------- */
.week{background:var(--surface);border:1px solid var(--line);border-radius:13px;overflow:hidden;margin-bottom:15px;position:relative}
.week::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:3px;background:var(--wk)}
.week-head{padding:19px 22px 19px 24px;display:flex;gap:17px;align-items:flex-start;flex-wrap:wrap}
.week-no{font-family:var(--font-mono);font-size:10.5px;color:var(--wk);letter-spacing:.16em;flex:none;padding-top:5px}
.week-title{font-size:21px;line-height:1.45}
.week-theme{color:var(--fg-dim);font-size:15px;margin-top:8px;line-height:1.75}
.week-meter{flex:none;min-width:124px;margin-inline-start:auto;text-align:end}
.week-meter .lbl{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-mute);margin-bottom:6px}
.lesson-row{display:flex;gap:16px;align-items:center;padding:16px 24px 16px 26px;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.lesson-row:hover{background:var(--surface-2)}
.tick{width:19px;height:19px;border-radius:50%;border:1.5px solid var(--line-strong);flex:none;display:grid;place-items:center;font-size:10px;color:transparent}
.tick.on{background:var(--ok);border-color:transparent;color:#fff}
.tick.part{border-color:var(--wk,var(--accent));border-style:dashed}
.lesson-row .d{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-mute);flex:none;width:42px}
.lesson-row .t{flex:1;min-width:0;font-size:15.5px;font-weight:500;line-height:1.5}
.lesson-row .s{font-size:13.5px;color:var(--fg-mute);margin-top:4px;font-weight:400;display:block;line-height:1.6}
.lesson-row .m{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-mute);flex:none}
@media (max-width:640px){.lesson-row .m{display:none}.week-head{padding-inline:16px 16px;padding-inline-start:18px}.lesson-row{padding-inline:16px 16px;padding-inline-start:18px}}

/* ---------- setup strip ---------- */
.setup{border:1px solid var(--line-strong);border-radius:14px;background:var(--surface-2);margin-top:26px;overflow:hidden}
.setup-h{display:flex;gap:12px;align-items:center;padding:14px 20px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.setup-h b{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.18em;color:var(--accent);font-weight:600}
.setup-lead{padding:16px 20px;display:flex;gap:16px;align-items:baseline;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--surface)}
.setup-lead .k{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;color:var(--fg-mute);text-transform:uppercase;flex:none;padding-top:3px}
.setup-lead .v{flex:1;min-width:220px;font-size:15px;font-weight:500;line-height:1.7}
.setup-pills{display:flex;flex-wrap:wrap;gap:0;background:var(--surface)}
.setup-pills div{padding:13px 20px;min-width:0;border-inline-end:1px solid var(--line);flex:1 1 auto}
.setup-pills div:last-child{border-inline-end:0}
.setup-pills .k{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.12em;color:var(--fg-mute);text-transform:uppercase;white-space:nowrap}
.setup-pills .v{font-size:15px;font-weight:600;margin-top:5px;line-height:1.5;white-space:nowrap}
.setup-pills .v.wrap{white-space:normal}
.setup-note{padding:14px 20px;font-size:14px;color:var(--fg-dim);display:flex;gap:12px;border-top:1px solid var(--line);line-height:1.8}
.setup-note b{flex:none;font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;color:var(--ok);padding-top:4px;font-weight:600}
@media (max-width:700px){.setup-pills div{flex:1 1 42%;border-bottom:1px solid var(--line)}}

/* ---------- lesson detail ---------- */
.lesson-hero{border-bottom:1px solid var(--line);padding-bottom:24px}
.theory h3{font-size:18px;margin-bottom:14px;color:var(--fg);letter-spacing:.01em;padding-inline-start:13px;border-inline-start:3px solid var(--accent)}
.theory .blk{margin-bottom:42px;max-width:43em}
.theory .blk p{color:var(--fg-dim);font-size:16px;line-height:1.95}
.theory .blk li{color:var(--fg-dim);font-size:15.5px}
.theory strong{color:var(--fg);font-weight:700}
.step{display:flex;gap:20px;padding:22px 0;border-top:1px solid var(--line)}
.step .sn{font-family:var(--font-mono);font-size:11px;color:var(--accent);flex:none;width:28px;padding-top:6px;font-weight:600}
.step .sb{flex:1;min-width:0;max-width:44em}
.step .sa{font-weight:700;font-size:17px;line-height:1.5}
.step .sd{color:var(--fg-dim);font-size:15.5px;margin-top:9px;line-height:1.9}
.step .sc{font-size:14px;margin-top:13px;color:var(--ok);display:flex;gap:10px;line-height:1.7}
.step .sc b{flex:none;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;padding-top:3px;font-weight:600}
.ulist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px;max-width:44em}
.ulist li{display:flex;gap:13px;font-size:15.5px;color:var(--fg-dim);line-height:1.85}
.ulist li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);flex:none;margin-top:12px;opacity:.85}
.ulist.check li::before{content:"✓";width:auto;height:auto;background:none;color:var(--ok);font-size:12px;margin-top:0;font-weight:700}

.prompt{border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-bottom:14px;background:var(--surface)}
.prompt-h{display:flex;gap:9px;align-items:center;padding:11px 14px;background:var(--surface-2);flex-wrap:wrap}
.prompt-h .pt{font-size:15px;font-weight:700;flex:1;min-width:0}
.prompt-b{padding:17px 19px;font-family:var(--font-mono);font-size:13.5px;line-height:1.85;color:var(--fg-dim);white-space:pre-wrap;word-break:break-word;border-top:1px solid var(--line)}
.prompt-n{padding:0 19px 17px;font-size:14px;color:var(--fg-mute);line-height:1.8}
.prompt-n b{color:var(--fg-dim);font-weight:500}
/* 工程表示 */
.flow{border-top:1px solid var(--line);background:var(--surface-2);padding:11px 15px}
.flow-h{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
.flow-badge{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:10.5px;font-weight:600;letter-spacing:.08em;padding:4px 10px;border-radius:6px;color:var(--fc);border:1px solid var(--fc);white-space:nowrap}
.flow-badge .jp{font-family:var(--font-body);font-weight:700;letter-spacing:0;font-size:11.5px}
.flow-step{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-mute)}
.flow-rows{display:grid;grid-template-columns:auto 1fr;gap:9px 14px;font-size:14px;align-items:baseline;line-height:1.75}
.flow-rows dt{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;color:var(--fc);white-space:nowrap;padding-top:2px;font-weight:600}
.flow-rows dd{margin:0;color:var(--fg-dim);min-width:0}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:9px;margin:18px 0 24px}
.legend div{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:11px 13px}
.legend .lc{font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:.06em;color:var(--fc);border:1px solid var(--fc);border-radius:5px;padding:2px 7px;flex:none;margin-top:1px}
.legend .ll{font-weight:700;font-size:12.5px}
.legend .ld{color:var(--fg-mute);font-size:12px;margin-top:2px;line-height:1.6}

table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th,table.t td{text-align:start;padding:14px 18px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.75}
table.t th{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-mute);font-weight:500;white-space:nowrap;background:var(--surface-2)}
table.t td{color:var(--fg-dim)}
table.t td.ax{white-space:nowrap;font-weight:500;color:var(--fg)}
table.t td.n{font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr:last-child td{border-bottom:0}
.scroll-x{overflow-x:auto;border:1px solid var(--line);border-radius:11px}

.pit{border-inline-start:2px solid var(--alert);padding:2px 0 2px 16px;margin-bottom:19px}
.pit{max-width:44em}

<script type="application/json" id="cb-data">{"weeks":[{"week":1,"title":"Higgsfieldと映像表現の基礎","theme":"「偶然いい映像が出た」を「狙って出せる」に変える","objective":"Higgsfieldの制作フローを一通り通し、カメラ・光・構図という3つの変数を意図的に操作して、同じ被写体から異なる印象の映像を作り分けられる状態にする。","hours":"6.5時間（60〜90分 × 5日）","weekDeliverables":["同一被写体・異なる演出の動画5本","7スロット形式のプロンプト集（5本分＋派生）","制作条件と結果の比較記録シート（生成回数・採用率・所要時間つき）"],"outcome":"出てきた映像を見て「何が原因でこうなったか」「次に何を変えれば直るか」を言葉で説明できる。","lessons":[{"id":"w1d1","day":1,"title":"制作環境の把握とコスト構造の設計","subtitle":"機能を覚える前に、1本あたりいくら・何分かかるかの土台を作る","why":"広告運用の経験がある人ほど、AI動画で最初につまずくのは操作ではなくコスト構造の読み違いです。生成AIは「1回で当たる前提」で設計すると破綻します。実務では1本の採用カットの裏に3〜10回の失敗生成があり、これを原価に織り込んでいないと、受注した瞬間に赤字になります。初日は作品を作らず、使う道具の棚卸しと、1カットあたりのクレジット消費・所要時間を実測する土台づくりに充てます。ここを飛ばすと、Week 6の価格設計がすべて推測になります。","goals":["Higgsfieldの主要な制作画面と、画像生成・動画生成・編集系機能の役割を区別して説明できる","自分のプランで1動画生成あたり何クレジット消費するかを実測して記録できる","案件・素材・プロンプトのファイル命名規則とフォルダ構成を決めて運用を開始する","「採用率」と「1採用カットあたり原価」を記録する台帳を作る"],"duration":"75分","timeBreakdown":[{"label":"機能の棚卸し","min":25},{"label":"実測（テスト生成）","min":30},{"label":"台帳・命名規則の設定","min":20}],"tools":["Higgsfield（アカウント／プラン確認、画像生成、image-to-video）","スプレッドシート（Googleスプレッドシート等）","クラウドストレージ（素材保管用）"],"prereq":["Higgsfieldのアカウントを作成済みであること","課金プランとクレジット残量を確認できること"],"theory":[{"heading":"AI動画制作の3層構造","body":"Higgsfieldに限らず、現在のAI動画制作はほぼ例外なく3つの層に分かれます。\n\n- **第1層：静止画の生成・用意**　被写体、構図、質感、ブランドの色をここで決める。動画より圧倒的に安く速く、やり直しが効く。\n- **第2層：静止画から動画への変換（image-to-video）**　第1層の絵を起点に、カメラの動きと被写体の動きを与える。コストの大半はここで発生する。\n- **第3層：編集・仕上げ**　複数カットの接続、尺調整、字幕、音、書き出し。Higgsfieldの外（CapCut等）で行う工程も含む。\n\n初心者が失敗するほぼすべてのケースは、**第1層を飛ばしてテキストからいきなり動画を作ろうとすること**に起因します。テキストから直接動画を作ると、構図も質感もブランドカラーも運任せになり、気に入らなければ高いコストを払って引き直すしかありません。静止画で納得いくまで詰めてから動かす。これが全6週間を通じた基本方針です。"},{"heading":"クレジットは「素材費」ではなく「試行回数」で考える","body":"飲食店の原価計算に置き換えると理解が早いはずです。生成1回分のクレジットは食材原価ではなく、**仕込みの歩留まり**に近い概念です。10個仕込んで3個しか商品にならないなら、実質原価は3倍以上になります。\n\n実務で記録すべき指標は3つです。\n\n- **採用率** = 採用カット数 ÷ 生成回数。初期は10〜30%程度から始まり、プロンプトの型ができると上がっていきます。\n- **1採用カットあたりクレジット** = 総消費クレジット ÷ 採用カット数。見積の基礎になる唯一の数字です。\n- **1採用カットあたり実作業時間** = 作業時間 ÷ 採用カット数。外注化・自動化の判断材料になります。\n\nこの3つを今日から記録し始めてください。Week 5の原価計算表、Week 6の価格設計は、すべてこの実測値の上に組み立てます。推測値で価格を決めた事業は、受注が増えるほど苦しくなります。"},{"heading":"UIは変わる、設計思想は変わりにくい","body":"Higgsfieldは更新頻度が高く、画面名やメニュー構成は変わります。本カリキュラムでは、特定のボタン名を暗記させるのではなく、**どの機能カテゴリを探せばよいか**を身につけてもらいます。\n\n探すべき機能カテゴリは次のとおりです。\n\n- 画像を作る機能（テキストから画像、参照画像つき画像）\n- 画像を動かす機能（image-to-video、使用モデルの選択）\n- カメラの動きを指定する機能（カメラモーションのプリセット、または프롬プト内指定）\n- 一貫性を保つ機能（参照画像、キャラクター／商品の固定）\n- 広告・商品向けのテンプレート群（商品カット、UGC風、ポスター等）\n- 既存素材を加工する機能（高解像度化、アスペクト比変更、背景処理）\n\n画面を開いたら、まずこの6カテゴリがそれぞれどこにあるかを自分のメモに書き出してください。名前が違っても、役割で引けるようになれば更新に強くなります。"},{"heading":"最初に決めるべき命名規則","body":"動画制作は素材点数が爆発的に増えます。1本30秒のPR動画でも、採用カット8本＋不採用30本＋参照画像10枚＋書き出し3種類で50ファイルを超えます。顧客が3社になれば150、修正が入れば倍。命名規則がないと、1ヶ月後の自分が「どのファイルが納品版か」を判別できなくなります。\n\n推奨する命名規則は次の形式です。\n\n`[顧客コード]_[案件コード]_[カット番号]_[バージョン]_[用途].[拡張子]`\n\n例：`SHIBUYA1_WINTER25_C03_v2_9x16.mp4`\n\n- 顧客コードは英数4〜8文字で固定する（表記ゆれを防ぐ）\n- カット番号は C01 から振り、編集順ではなく**撮影（生成）順**で固定する\n- バージョンは v1, v2 と上げ、最終版だけ `_FINAL` を付ける（日付を入れると判別が遅くなる）\n- 用途は書き出し仕様（9x16 / 16x9 / 1x1）を入れる\n\nこの規則はWeek 5の納品テンプレート、Week 6の外注指示書にそのまま流用します。"}],"steps":[{"n":1,"action":"プランとクレジット残量を確認する","detail":"アカウント設定またはプラン表示に相当する画面を開き、現在のプラン名、月間クレジット付与量、現在の残量、クレジットの繰越可否を確認してメモします。生成モデルごとに消費量が異なる場合は、その表も探してスクリーンショットを残してください。","check":"「月間◯クレジット、現在残◯」と数字で言える状態になっている"},{"n":2,"action":"機能カテゴリの所在をマッピングする","detail":"本文で挙げた6カテゴリ（画像生成／動画化／カメラ制御／一貫性／広告テンプレート／既存素材加工）が、現在のUIでどのメニューにあるかを1枚のメモに書き出します。見つからないカテゴリは「未発見」と書いて残します。後日見つかったら追記します。","check":"6カテゴリすべてに対して、メニュー名または「未発見」が記入されている"},{"n":3,"action":"テスト用の静止画を1枚生成する","detail":"後の課題で使う被写体を1つ決めます（例：自分が扱いやすい料理1皿、または商品1点）。これを題材に、テキストから静止画を1枚生成します。凝った指定は不要です。ここでの目的は画質ではなく、消費クレジットと所要時間の実測です。","check":"画像が1枚生成され、消費クレジットと生成にかかった秒数を記録できている"},{"n":4,"action":"同じ画像から動画を1本生成する","detail":"生成した静止画を起点に image-to-video に相当する機能で5秒前後の動画を1本作ります。モデル選択がある場合は、最も標準的・低コストなものを選びます。プロンプトは「slow push in」程度の簡単な指定で構いません。","check":"動画が1本生成され、消費クレジット・所要時間・選択したモデル名が記録されている"},{"n":5,"action":"高品質モデルでも同じ動画を1本生成する","detail":"モデルを切り替えられる場合、上位モデル（高解像度対応や高品質を謳うもの）で同一画像・同一プロンプトから1本生成します。クレジット消費の差と、画質・動きの差を比較します。差が価格差に見合うかの判断基準を自分の中に作ることが目的です。","check":"標準モデルと上位モデルの消費クレジット比（例：1:4）が数字で出ている"},{"n":6,"action":"制作台帳スプレッドシートを作る","detail":"列を次のとおり作成します：日付 / 案件 / カット番号 / 目的 / 使用モデル / プロンプト要約 / 生成回数 / 採用可否 / 消費クレジット / 所要分 / 不採用理由。今日の実測4件をここに入力します。この台帳はWeek 6まで使い続けます。","check":"台帳に本日の生成がすべて記録され、合計消費クレジットが計算されている"},{"n":7,"action":"命名規則とフォルダ構成を確定する","detail":"クラウドストレージに `01_案件 / 02_参照画像 / 03_生成素材 / 04_編集 / 05_納品` の5階層を作り、命名規則をテキストファイルで同じ場所に保存します。今日生成した4ファイルをこの規則でリネームして保存します。","check":"ルールに沿った名前のファイルが実際に保存されている"},{"n":8,"action":"利用規約の商用利用条件を確認する","detail":"Higgsfieldの利用規約・FAQで、生成物の商用利用可否、権利帰属、プランによる差があるかを確認し、該当箇所のURLと確認日をメモに残します。顧客に納品する事業である以上、ここは推測で進められません。不明点は「要確認」として残し、Week 3のレッスンで再度扱います。","check":"商用利用に関する記述の所在（URL）と確認日がメモされている"}],"prompts":[{"label":"実測用ベースライン画像（料理）","text":"A single plated dish on a dark wooden table, natural window light from the left, shallow depth of field, photorealistic, 35mm lens look, neutral color grading","note":"計測の基準にするための意図的に素朴なプロンプト。被写体を自分の扱う料理名に置き換える。凝った指定を入れないことで、後のレッスンで指定を足したときの差分が見える。","status":"未検証","flow":{"code":"T2I","step":"工程1 / 2","input":"新規生成。参照画像は使わない。料理名だけを自分が扱う1皿に置き換え、他は1語も足さずに送る","output":"静止画1枚。画質ではなく、消費クレジットと所要秒数が実測値として残る","next":"この1枚を『実測用ベースライン動画』の起点画像として渡し、同じ被写体で動画側の原価を測る"}},{"label":"実測用ベースライン動画","text":"Slow push in toward the dish, subtle steam rising, camera movement is smooth and minimal, no cuts","note":"image-to-videoの最小構成。カメラ1動作＋被写体の微細な動き1つだけ。ここから複雑にしていったときのコスト増と品質変化を比較する基準になる。","status":"未検証","flow":{"code":"I2V","step":"工程2 / 2","input":"工程1で作った静止画1枚。新しく画像は作らない。標準モデルと上位モデルの両方に同じ画を渡す","output":"5秒前後の動画が標準・上位モデルで1本ずつ。モデル間のクレジット比が出る","next":"ここで完結。結果を制作台帳に記録し、Week 6 の価格設計の初期実測値として残す","where":"生成画面でモデルを選ぶ（image-to-video）","whereNote":"最も安く、Seedance 2.0 系・Kling 3.0・Wan 2.7 なら Unlimited 対象"}}],"expected":"見栄えのする作品は出来ていなくて構いません。この時点で手元にあるべきなのは、静止画1枚・動画2本と、それらにかかったクレジットと時間の実数値、そして命名規則どおりに保存されたファイルです。上位モデルと標準モデルのコスト比が「だいたい何倍か」を数字で答えられれば十分です。","assignment":{"title":"制作環境マップと原価台帳の初期構築","brief":"Higgsfieldの機能配置を自分の言葉でマッピングし、実測データに基づく原価台帳の運用を開始します。作品制作ではなく事業基盤の構築が目的です。生成するのは計測用の最小限の素材のみに留め、凝り始めないよう時間を区切ってください。","deliverables":["機能カテゴリ対応表（6カテゴリ × 現UIのメニュー名）","制作台帳スプレッドシート（本日分4行以上の記録）","命名規則ドキュメントとフォルダ構成","利用規約の商用利用条件メモ（URL・確認日つき）"],"constraints":["消費クレジットは本日分で上限を決めてから着手する","作業時間は90分以内","画質の追求は行わない"]},"success":["6つの機能カテゴリすべてについて所在またはカテゴリ未発見が記録されている","標準モデルと上位モデルのクレジット消費量が数値で比較されている","台帳に生成1件ごとの行が存在し、消費クレジット合計が算出されている","保存済みファイル名が命名規則に完全に従っている"],"rubric":[{"axis":"映像の品質","pass":"3点＝生成が完了し内容が判別できる。5点は本レッスンでは評価対象外。"},{"axis":"動きの自然さ","pass":"3点＝動画が破綻せず再生できる。5点は本レッスンでは評価対象外。"},{"axis":"ブランド整合性","pass":"3点＝今後使う被写体を1つに決めている。5点＝被写体選定の理由を顧客像と結びつけて説明できる。"},{"axis":"マーケ目的整合性","pass":"3点＝原価を記録する意味を説明できる。5点＝採用率が価格設計にどう効くかを数式で説明できる。"},{"axis":"再現性","pass":"3点＝命名規則が文書化されている。5点＝他人に渡してそのまま運用できる粒度になっている。"},{"axis":"時間とコスト","pass":"3点＝本日の消費クレジットと時間が記録されている。5点＝モデル別の単価差を把握し使い分け方針を書いている。"}],"pitfalls":[{"problem":"初日から高品質な作品を作ろうとしてクレジットを使い切る","cause":"計測が目的であることを忘れ、出力品質に反応して再生成を繰り返す","fix":"着手前に本日使用する上限クレジットを決め、台帳に「予算」行を作る。上限到達で強制終了する運用にする。"},{"problem":"台帳をあとでまとめて書こうとして記録が消える","cause":"生成直後の数値（消費量・秒数）は画面を離れると確認が難しくなる","fix":"生成ごとにその場で1行書く運用にする。スプレッドシートを別タブで開きっぱなしにしておく。"},{"problem":"命名規則が途中で崩れる","cause":"急ぎの作業で一時ファイルを無造作に保存し、それが最終版になる","fix":"一時ファイル専用の `99_tmp` フォルダを作り、そこ以外では必ず規則に従う。tmp のファイルは納品に使わないルールを明文化する。"},{"problem":"商用利用の確認を後回しにする","cause":"学習段階では不要に見える","fix":"顧客提案の直前に確認すると、条件次第で商品設計をやり直すことになる。初日に所在を押さえ、Week 3とWeek 6で再確認する前提でメモを残す。"}],"resourceIds":["hf-help-top","hf-help-plans","hf-help-credits","hf-terms","hf-academy-top","hf-academy-courses","hf-youtube","hf-discord","hf-blog","jp-miralab-hf","yt-hf-beginner","hf-pricing","nfs-cinematic"],"nextHint":"明日は、なぜ「画像を先に作る」のかを実験で確かめます。テキストから直接作った動画と、画像を経由した動画の差を自分の目で比較します。","setup":{"tag":"単価の実測","model":"静止画 手持ちのツールで可（ChatGPT / Gemini / Soul 2.0） ／ 動画 Seedance 2.0（基準）と Seedance 2.5（比較用に1本だけ）","seconds":"4秒","res":"720p","aspect":"9:16","outputs":"1（バッチは各々課金されるので必ず1に）","cap":"静止画4枚・動画2本","credits":"約 45 cr（$2.23）","unlimited":"約 26 cr（$1.30）","save":"Seedance 2.5 は Unlimited の対象外で、2.0 の約1.4倍かかる。今日その差を自分の画面で確認し、以後は 2.0 を既定にする。生成ボタンに消費クレジットが表示されるので、押す前に必ず読む癖をつける。"}},{"id":"w1d2","day":2,"title":"画像経由ワークフローの優位性を実験で確かめる","subtitle":"text-to-video と image-to-video を同条件で比較し、制作方針を数字で決める","why":"「画像を作ってから動かすほうがいい」と説明されても、納得していない手順は現場で省略されます。省略した結果、構図もブランドカラーも安定せず、顧客修正のたびに作り直しになります。今日は方針を鵜呑みにせず、同じ条件で2つの経路を比較し、自分のデータで優劣を確認します。広告運用でA/Bテストをしてきた人にとって、これは最も納得の早い学び方のはずです。同時に、アスペクト比と解像度という、あとから直すと最も高くつく設定を先に固めます。","goals":["text-to-video と image-to-video の出力差を、構図・色・被写体忠実度の観点で比較して説明できる","採用率とクレジット効率の観点から、自分の制作フローの基本経路を決定できる","配信先に応じたアスペクト比と解像度を、制作開始前に決める手順を身につける","静止画段階で何を確定させ、動画段階で何を足すかを切り分けられる"],"duration":"85分","timeBreakdown":[{"label":"比較実験の設計","min":15},{"label":"生成と比較","min":45},{"label":"結果の記録と方針決定","min":25}],"tools":["Higgsfield（テキストから動画、画像生成、image-to-video）","制作台帳スプレッドシート（Day1で作成）"],"prereq":["Day1の制作台帳と命名規則が運用開始されていること","被写体（料理または商品）が1つ決まっていること"],"theory":[{"heading":"制御点がどこにあるか","body":"text-to-video は、構図・被写体・色・カメラ・動きのすべてを1回の生成で同時に決めます。変数が多すぎるため、気に入らない部分が1つあっても、再生成すると気に入っていた部分まで変わります。これは広告クリエイティブのA/Bテストで、複数要素を同時に変えて「どれが効いたか分からない」状態になるのと同じ構造です。\n\nimage-to-video は、静止画の段階で構図・被写体・色・質感を**固定**し、動画生成では動きとカメラだけを変数にします。変数が減るぶん、狙った方向に修正しやすくなります。\n\n実務上の意味はコストに出ます。静止画の生成は動画より大幅に安く速いため、「気に入る絵が出るまで」の試行を安い層で済ませられます。気に入らない方向に進んでいることを、高い動画生成を回す前に検知できる。これが最大の利点です。"},{"heading":"静止画で確定させるもの／動画で足すもの","body":"切り分けを明確にしておくと、プロンプトが整理されます。\n\n**静止画で確定させる（動画段階で変えない）**\n- 被写体そのもの（皿、料理、商品、建物、部屋）\n- 構図とフレーミング（被写体の位置、余白、水平）\n- 光の方向と質（どこから、硬いか柔らかいか）\n- 色調（ブランドカラー、彩度、コントラストの方向性）\n- 質感（照り、マット、湿り、粗さ）\n\n**動画で足す（静止画では決めない）**\n- カメラの動き（寄る、引く、回る、パンする）\n- 被写体の動き（湯気、液体の流れ、布の揺れ、人物の所作）\n- 時間変化（光の移ろい、焦点の移動）\n\nこの区分を守ると、動画プロンプトは短くなります。短いプロンプトのほうが破綻しにくい、というのは現在の動画生成モデルにおおむね共通する傾向です。動画プロンプトに「beautiful」「high quality」のような画質形容詞を並べても、静止画ですでに決まっている要素には影響しにくく、むしろ指示が散漫になります。"},{"heading":"アスペクト比は最初に決める","body":"後工程で最も高くつく失敗が、アスペクト比の決め忘れです。横長16:9で作った映像を縦型9:16に切り出すと、画面の左右44%が失われます。料理の皿が切れ、建物が収まらず、字幕の居場所がなくなります。逆も同様です。\n\n配信先と比率の対応は次のように考えます。\n\n- Instagram / TikTok のフィード・リール、YouTube Shorts → **9:16（縦型）**を主軸にする\n- Instagramフィードのみ、または一覧性重視 → 4:5 または 1:1\n- 公式サイトのヒーロー動画、YouTube通常枠、施設内モニター → 16:9\n- 宿泊OTAの施設ページ → 媒体の仕様を事前確認（16:9が多いが指定がある場合がある）\n\n実務での推奨は、**主要配信先の比率で作り、副次用途はトリミング前提で構図に余白を残す**ことです。縦型主軸なら、被写体を中央寄りに配置して上下に情報帯の余白を取っておくと、横型への転用時に破綻しにくくなります。両方を本気で使うなら、同じプロンプトで比率違いを別個に生成するほうが結果的に安くつく場合があります。これも今日の実験で確かめます。"}],"steps":[{"n":1,"action":"比較実験の条件を紙に書く","detail":"被写体1つ、狙う印象1つ（例：温かい・高級・素朴のうち1つ）、尺5秒、比率9:16に固定します。この3つを固定したうえで、経路だけを変えます。条件を先に書き出すことで、途中で目的がぶれるのを防ぎます。","check":"被写体・印象・尺・比率の4項目が決まり、メモに書かれている"},{"n":2,"action":"経路A：テキストから直接動画を3本作る","detail":"同一プロンプト・同一設定で3本生成します。シード値を指定できる場合は未指定（ランダム）にします。3本作る理由は、ばらつきの幅を見るためです。1本だけでは偶然の良し悪しと区別できません。","check":"3本の動画が生成され、台帳に3行記録されている"},{"n":3,"action":"経路B：静止画を3枚生成して1枚を選ぶ","detail":"同じ内容を静止画として3枚生成し、最も狙いに近い1枚を選びます。選定理由を1行メモします（例：皿の位置と光の方向が狙いどおり）。選ばなかった2枚の不採用理由も記録します。この「選ぶ」工程が image-to-video の本質です。","check":"静止画3枚が生成され、採用1枚と不採用理由が記録されている"},{"n":4,"action":"経路B：選んだ画像から動画を3本作る","detail":"採用した静止画を起点に、同一の動画プロンプトで3本生成します。経路Aと同じ尺・比率にします。動画プロンプトはカメラ1動作＋被写体の動き1つに絞ります。","check":"3本の動画が生成され、台帳に記録されている"},{"n":5,"action":"6本を並べて評価する","detail":"評価軸は4つです。(1)狙った構図に近いか (2)狙った色・光に近いか (3)被写体が崩れていないか (4)このまま広告素材として使えるか。各本を○△×で採点し、経路ごとの○の数を集計します。主観で構いませんが、必ず4軸に分けて付けてください。全体印象だけで判断すると、どの工程を改善すべきかが分かりません。","check":"6本すべてに4軸の評価が付き、経路ごとに集計されている"},{"n":6,"action":"クレジットと時間のコストを経路ごとに算出する","detail":"経路Aの総消費（動画3本）と、経路Bの総消費（静止画3枚＋動画3本）を比較します。そのうえで「使える素材1本あたりのコスト」を計算します。経路Bは工程が多い分だけ総消費が増える場合がありますが、採用率が高ければ1本あたりでは安くなります。この逆転があるかどうかが今日の核心です。","check":"経路A・Bそれぞれの「採用1本あたりクレジット」が算出されている"},{"n":7,"action":"アスペクト比の転用テストを行う","detail":"採用した動画1本を、横型16:9に切り出してみます（編集ソフトでのトリミングで構いません）。どこが失われるかを確認し、「縦型で作るとき、構図のどこに余白を残すべきか」を1行で言語化します。","check":"トリミング後の問題点と、次回の構図方針が1行で書かれている"},{"n":8,"action":"自分の基本フローを決定して明文化する","detail":"実験結果をもとに、今後の基本経路を決めます。多くの場合は経路Bになりますが、「ラフ案の方向性確認だけは経路Aで速く回す」といったハイブリッドも有効です。決めた方針を1〜3行でドキュメント化します。","check":"基本フローが文書として存在し、根拠となる数字が添えられている"}],"prompts":[{"label":"経路A：text-to-video（比較用）","text":"A warm close-up of [dish] on a rustic ceramic plate, soft window light from the left, gentle steam rising, slow push in, shallow depth of field, photorealistic, vertical 9:16 framing","note":"構図・光・動き・比率をすべて1本のプロンプトで指定している状態。比較対象として意図的にこの形にする。[dish] を自分の被写体名に置き換える。","status":"未検証","flow":{"code":"T2V","step":"単発","input":"新規。画像を一切経由せず、構図・光・動き・比率を1本のプロンプトに詰めて3本生成する","output":"5秒・9:16の動画3本。狙いからのばらつき幅が経路Aの実力として見える","next":"ここで完結。経路Bの3本と並べて4軸評価し、採用1本あたりクレジットを比較する","where":"生成画面でモデルを選ぶ（image-to-video）","whereNote":"最も安く、Seedance 2.0 系・Kling 3.0・Wan 2.7 なら Unlimited 対象"}},{"label":"経路B-1：静止画（構図と光を確定）","text":"A warm close-up of [dish] on a rustic ceramic plate, soft window light from the left, shallow depth of field, photorealistic, centered composition with headroom above and space below, vertical 9:16","note":"動きに関する語を一切含めない。上下に余白を指定しているのは、後で字幕とロゴの居場所を確保するため。","status":"未検証","flow":{"code":"T2I","step":"工程1 / 2","input":"新規。参照なし。動きの語を一切入れずに静止画を3枚生成し、狙いに最も近い1枚だけを選ぶ","output":"9:16の静止画3枚と採用1枚。構図・光・字幕余白がこの1枚で確定する","next":"採用した1枚を『経路B-2：動画化（動きだけ指定）』に渡す。不採用2枚は理由を記録する"}},{"label":"経路B-2：動画化（動きだけ指定）","text":"Slow push in. Gentle steam rising from the dish. Camera movement is smooth and continuous, no cuts.","note":"静止画で決まっている構図・光・色には触れない。カメラ1動作＋被写体の動き1つだけに絞ることで破綻率を下げる。","status":"未検証","flow":{"code":"I2V","step":"工程2 / 2","input":"工程1で採用した静止画1枚。これを起点にする。構図と光は画が持っているので書かない","output":"5秒・9:16の動画3本。構図のばらつきが消え、動きの当たり外れだけが残る","next":"ここで完結。経路Aの3本と並べて評価し、自分の基本フローをどちらにするか決める","where":"生成画面でモデルを選ぶ（image-to-video）","whereNote":"最も安く、Seedance 2.0 系・Kling 3.0・Wan 2.7 なら Unlimited 対象"}}],"expected":"6本の動画と、経路ごとの採用率・1本あたりコストの比較表が手元にある状態です。多くの場合、経路Bのほうが狙った構図・色に近い結果になり、採用率が高くなります。ただし被写体や狙いによっては差が小さいこともあります。重要なのは結論の正解ではなく、自分のデータで判断したという事実です。","assignment":{"title":"制作経路のA/B比較と基本フローの決定","brief":"text-to-video と image-to-video を同一条件で比較し、採用率とコスト効率のデータを取ります。そのうえで、今後6週間使う基本制作フローを自分で決定し、根拠とともに文書化します。広告運用のA/Bテストと同じ厳密さで、変数を1つだけ変えて比較してください。","deliverables":["動画6本（経路A×3、経路B×3）と静止画3枚","4軸評価表と経路別集計","採用1本あたりクレジットの比較","基本制作フロー方針書（根拠の数字つき）","縦型構図における余白ルール（1行）"],"constraints":["被写体・狙う印象・尺・比率は全条件で同一にする","作業時間は90分以内","気に入らなくても追加生成せず、ばらつきを含めて記録する"]},"success":["経路Aと経路Bで変えた変数が経路のみであり、他条件が揃っている","6本すべてに4軸の評価が記録されている","採用1本あたりコストが両経路で数値化されている","基本フローの決定が、感想ではなく数字を根拠に書かれている"],"rubric":[{"axis":"映像の品質","pass":"3点＝被写体が判別でき大きな破綻がない。5点＝選んだ静止画の狙いが動画でも維持されている。"},{"axis":"動きの自然さ","pass":"3点＝不自然な変形が致命的でない。5点＝カメラの動きが等速で、加減速が映像的に自然。"},{"axis":"ブランド整合性","pass":"3点＝色調が3本間でおおむね揃っている。5点＝狙った印象（温かい等）が第三者にも伝わる。"},{"axis":"マーケ目的整合性","pass":"3点＝配信先を想定して比率を選んでいる。5点＝余白設計まで配信面に合わせられている。"},{"axis":"再現性","pass":"3点＝使用プロンプトが保存されている。5点＝同じ手順で別被写体でも再現できる形に手順化されている。"},{"axis":"時間とコスト","pass":"3点＝両経路のコストが記録されている。5点＝採用率を織り込んだ実質単価で比較できている。"}],"pitfalls":[{"problem":"経路Bの静止画選びに時間をかけすぎる","cause":"静止画は安いため、際限なく生成してしまう","fix":"静止画は3枚生成して必ずその中から選ぶ、と回数を先に固定する。選べないときは狙い自体が曖昧なサインなので、プロンプトではなく狙いを書き直す。"},{"problem":"比較なのに条件が揃っていない","cause":"経路Bのほうが良く見せたい心理が働き、無意識にプロンプトを改善してしまう","fix":"プロンプトを先に全部書き出し、確定してから生成に入る。生成中にプロンプトを変えない。"},{"problem":"動画プロンプトに画質形容詞を盛り込んで破綻する","cause":"静止画生成の癖で cinematic, 8k, masterpiece 等を足してしまう","fix":"動画プロンプトは動きの記述のみに限定する。画質は静止画の段階と使用モデルで決まる、と割り切る。"},{"problem":"アスペクト比を途中で変える","cause":"縦型で作り始めたあとに横型も欲しくなる","fix":"トリミングで対応できる範囲を先に確認し、無理なら最初から別生成として計画・見積りに入れる。"}],"resourceIds":["hf-help-seedance","hf-help-marketing-studio","yt-hf-overview"],"nextHint":"明日は、今日「なんとなく」書いていたプロンプトを7つの要素に分解します。どの語がどの結果に効いているかを特定できるようになります。","setup":{"tag":"比較実験","model":"静止画 手持ちのツールで可（ChatGPT / Gemini / Soul 2.0） ／ 動画 Seedance 2.0 に固定（モデルを変えると比較が壊れる）","seconds":"4秒","res":"720p","aspect":"9:16","outputs":"1","cap":"静止画6枚・動画6本（経路A3本・経路B3本）","credits":"約 109 cr（$5.44）","unlimited":"0 cr","save":"ここは6本必要。比較のための支出なので削らない。Seedance 2.0 は Unlimited 対象なので、ウィンドウが有効な期間にこの日を当てれば実費はゼロになる。"}},{"id":"w1d3","day":3,"title":"プロンプトの7スロット構造","subtitle":"書き方の型を作り、結果の原因を特定できる状態にする","why":"プロンプトが長文の散文になっていると、結果が悪かったときにどの語が悪かったのか永遠に分かりません。原因が特定できなければ改善もできず、毎回ゼロから書き直すことになります。これは制作時間が縮まらない最大の原因です。今日はプロンプトを7つのスロットに分解し、スロット単位で差し替えられる形にします。構造化しておくと、Week 5でテンプレート化するとき、Week 6で外注するときに、そのまま指示書として機能します。プロンプト集が資産になるか、使い捨てのメモで終わるかはここで決まります。","goals":["プロンプトを7スロット（被写体・動作・環境・カメラ・光・質感・スタイル）に分解して書ける","1スロットだけを変えた比較生成を行い、各スロットの効き方を把握できる","日本語で考えた演出意図を、曖昧さの少ない英語プロンプトに変換できる","再利用可能なプロンプトテンプレートを自分の案件向けに1つ完成させる"],"duration":"80分","timeBreakdown":[{"label":"7スロットの理解と分解演習","min":20},{"label":"スロット単変量テスト","min":40},{"label":"テンプレート化","min":20}],"tools":["Higgsfield（画像生成、image-to-video）","テキストエディタまたはスプレッドシート（プロンプト管理）"],"prereq":["Day2で基本制作フローを決定済みであること","採用した静止画が1枚手元にあること"],"theory":[{"heading":"7つのスロット","body":"プロンプトを次の順序のスロットに分けます。順序は固定し、使わないスロットは空欄にします。\n\n1. **被写体（Subject）**　何が写っているか。具体名詞＋状態。「a bowl of miso ramen with chashu and soft-boiled egg」\n2. **動作（Action）**　被写体が何をしているか。静止画では空欄でよい。「steam rising, broth rippling slightly」\n3. **環境（Environment）**　どこか、背景に何があるか。「on a dark walnut counter, blurred izakaya interior behind」\n4. **カメラ（Camera）**　ショットサイズ、アングル、レンズ、動き。「medium close-up, slight high angle, 50mm, slow push in」\n5. **光（Light）**　方向、質、色温度。「warm key light from upper left, soft falloff, subtle rim light on the egg」\n6. **質感（Texture）**　表面の性質。「glossy broth surface, matte ceramic bowl, visible condensation」\n7. **スタイル（Style）**　全体の映像的方向性。「photorealistic, muted warm grade, slight film grain」\n\nこの順で書く理由は、**モデルが前方の語を重く扱う傾向があるため**です。最も重要な被写体を先頭に置き、全体の雰囲気を決めるスタイルを最後に置きます。順序を入れ替えると結果が変わることがあるので、順序も含めてテンプレートとして固定します。"},{"heading":"曖昧語を禁止し、観測可能な語に置き換える","body":"広告のコピーライティングと逆の発想が必要です。コピーは情緒を喚起する語が強いですが、プロンプトは**観測可能な語**が強い。\n\n- ×「美味しそうな」→ ○「glossy surface, visible steam, melted cheese stretching」\n- ×「高級感のある」→ ○「low key lighting, dark background, polished surface with specular highlights」\n- ×「あたたかい雰囲気」→ ○「warm 3200K light, soft shadows, wooden textures」\n- ×「東京の路地らしい」→ ○「a narrow alley outside the window, daylight falling from a thin strip of sky between buildings, overcast and diffused」\n\n「高級感」のような抽象語は、モデルの学習データ上の平均的な解釈に委ねることになり、ブランドごとの差が出ません。顧客に「他社と同じに見える」と言われる映像は、ほぼ例外なく抽象語で書かれています。\n\n変換のコツは、**その印象を成立させている物理的条件は何かを1段階掘る**ことです。高級感は暗さとコントラストと反射で出来ており、温かさは色温度と影の柔らかさで出来ています。これは照明の知識そのもので、Day4とDay5で体系的に扱います。"},{"heading":"否定指定は当てにしない","body":"「人を入れないで」「文字を入れないで」といった否定指定は、モデルによって効き方が大きく異なり、むしろその語に反応して出現確率が上がることすらあります。ネガティブプロンプト欄が別にある場合はそちらを使い、本文での否定は最小限にします。\n\n実務的な回避策は3つです。\n\n- **肯定形で埋める**：「no people」ではなく「empty dining room at dawn」と書き、人がいない状態を積極的に描写する\n- **フレームで制御する**：余計なものが入るなら、ショットサイズを寄せて物理的に画角から外す\n- **後処理で消す**：生成後に不要物を除去する機能があればそちらで対応し、プロンプトでの格闘をやめる\n\n特に**文字・ロゴの崩れ**は現在の生成モデル共通の弱点です。看板やメニュー、商品パッケージの文字は高確率で破綻します。対策は「文字が小さく写る構図にする」「ボケの中に置く」「生成後に実物のロゴを編集で重ねる」のいずれかです。ロゴは生成させず合成する、が実務の原則になります。"},{"heading":"単変量テストという考え方","body":"広告運用でクリエイティブテストを設計するときと同じです。一度に1スロットだけを変えます。\n\nベースプロンプトを1つ固定し、カメラスロットだけを3通り、光スロットだけを3通り変えて生成する。これだけで、自分の被写体に対してどのスロットがどれだけ効くかの感覚ができます。多くの場合、**光スロットの影響が最も大きく、スタイルスロットの影響が最も読みにくい**という結果になりますが、被写体によって変わります。\n\nこのテスト結果を記録しておくと、顧客から「もう少し高級感を」と言われたときに、どのスロットを触れば最短で届くかが分かります。修正指示を受けてから探索を始める制作者と、どこを触るか分かっている制作者とでは、修正対応の所要時間が数倍変わります。これは直接利益率に効きます。"}],"steps":[{"n":1,"action":"既存プロンプトを7スロットに分解する","detail":"Day2で使ったプロンプトを7つのスロットに割り振り、スプレッドシートの7列に入れます。空のスロットが見つかるはずです。それが今まで運任せにしていた要素です。","check":"7列の表に分解され、空欄のスロットが特定されている"},{"n":2,"action":"空欄スロットを埋めてベースプロンプトを作る","detail":"空欄を観測可能な語で埋め、ベースプロンプトを完成させます。この時点で抽象語（beautiful, amazing, professional 等）があれば物理的記述に置き換えます。","check":"7スロットすべてが埋まり、抽象語が1つも残っていない"},{"n":3,"action":"ベースで静止画を1枚生成する","detail":"比較の基準になる1枚です。これを「基準画像」として命名規則に従い保存します。以降の比較はすべてこの画像との差分で語ります。","check":"基準画像が保存され、使用プロンプトが紐づいて記録されている"},{"n":4,"action":"カメラスロットのみを3通り変える","detail":"ショットサイズとアングルを変えた3パターン（例：wide shot / medium close-up / extreme close-up、または eye level / high angle / low angle）を生成します。他の6スロットは1語も変えません。","check":"3枚が生成され、変更したのはカメラスロットのみであることがプロンプト記録から確認できる"},{"n":5,"action":"光スロットのみを3通り変える","detail":"方向（左から／逆光／真上から）、または質（硬い直射／柔らかい拡散）を3通り変えて生成します。印象の変化量をカメラスロットの場合と比較します。","check":"3枚が生成され、カメラ変更時との印象変化の大きさを比較できている"},{"n":6,"action":"効き方を記録する","detail":"スロットごとに「印象変化の大きさ」を5段階で採点し、どの語がどの変化を起こしたかを1行でメモします。これが自分専用の操作辞書になります。","check":"スロット別の効き方が表に記録されている"},{"n":7,"action":"テンプレートを作る","detail":"7スロット構造のテンプレートを作り、可変部分を [ ] で囲みます。例：`[subject], [action], [environment], [camera], [light], [texture], [style]`。自分の主要案件（飲食店の料理／宿泊施設の客室）向けに2種類作ります。","check":"可変部を明示したテンプレートが2種類保存されている"},{"n":8,"action":"テンプレートで別被写体を生成して検証する","detail":"作ったテンプレートの [ ] を別の被写体に差し替えて1枚生成し、テンプレートが汎用的に機能するかを確認します。機能しない場合は、固定部分に被写体特有の語が混ざっています。","check":"別被写体でも破綻せず生成でき、テンプレートの汎用性が確認されている"}],"prompts":[{"label":"7スロット・テンプレート（料理）","text":"[SUBJECT: a bowl of miso ramen with chashu, menma and a halved soft-boiled egg], [ACTION: steam rising slowly, broth surface rippling faintly], [ENVIRONMENT: on a dark walnut counter, softly blurred warm izakaya interior behind], [CAMERA: medium close-up, slight high angle, 50mm equivalent, shallow depth of field], [LIGHT: warm key light from upper left, soft falloff, subtle rim light separating the egg from background], [TEXTURE: glossy broth surface, matte ceramic bowl, fine condensation on the counter], [STYLE: photorealistic, muted warm color grade, slight film grain]","note":"実際に送信する際は [SLOT: ] のラベルを外して本文だけを連結する。ラベルは管理用。料理名・器・背景だけを差し替えれば別案件に転用できる。","status":"未検証","flow":{"code":"T2I","step":"単発","input":"新規。料理名・具材・器・背景の語だけを実メニューに置き換え、ラベルを外して本文を連結して送る","output":"静止画1枚。7スロットすべてが埋まった基準画像で、以降の比較の原点になる","next":"カメラ・光スロットだけを差し替える単変量テストの基準にし、効き方を操作辞書に記録する"}},{"label":"7スロット・テンプレート（宿泊施設の客室）","text":"[SUBJECT: a corner guest room in a city hotel with a low bed, linen bedding and a wide picture window], [ACTION: sheer curtain drifting slightly], [ENVIRONMENT: a dense low-rise cityscape visible through the window, the glass face of a neighbouring building reflecting daylight back into the room, minimal wooden interior], [CAMERA: wide shot, eye level, 24mm equivalent, deep focus], [LIGHT: overcast daylight from the window as the only source, soft shadows, cool 6000K outside and warm 3000K practical lamp inside], [TEXTURE: matte plaster walls, raw oak floor, soft linen weave], [STYLE: photorealistic architectural photography, restrained contrast, neutral grade]","note":"窓外の街並みと時間帯、室内の素材名を差し替えるだけで時間帯違いの素材が作れる。色温度を外光と室内灯で分けて指定しているのは、宿の映像で最も印象を左右する要素だから。","status":"未検証","flow":{"code":"T2I","step":"単発","input":"新規。窓外の街並み・時間帯と室内の素材名を差し替える。外光と室内灯の色温度は分けて指定したまま使う","output":"静止画1枚。宿泊案件用の基準画像で、時間帯違いの素材もこの型から展開できる","next":"ここで完結。飲食用テンプレートと合わせ、自分の2本柱として命名規則どおりに保存する"}},{"label":"カメラスロット差し替え例（3通り）","text":"A) wide shot, eye level, 24mm equivalent, deep focus  /  B) medium close-up, slight high angle, 50mm equivalent, shallow depth of field  /  C) extreme close-up, low angle, 85mm equivalent, very shallow depth of field","note":"他スロットを固定してここだけ入れ替える単変量テスト用。A→C の順で被写体の情報量が減り、質感の情報量が増える。","status":"未検証","flow":{"code":"SLOT","step":"単発","input":"単体では送らない。上の7スロット・テンプレートの [CAMERA: ] の中身だけをA/B/Cに入れ替える","output":"他6スロットを固定した静止画3枚。情報量が被写体から質感へ移る度合いが見える","next":"ここで完結。どのカメラ語がどれだけ印象を動かしたかを5段階で採点し、表に残す"}}],"expected":"静止画7枚（基準1＋カメラ3＋光3）と、スロット別の効き方を記録した表、そして可変部を明示した自分用テンプレート2種類が手元にある状態です。「高級感を出したい」と言われたときに触るべきスロットが1つ以上言えるようになっていれば到達です。","assignment":{"title":"7スロット分解と単変量テスト、テンプレート化","brief":"プロンプトを構造化し、スロット単位で効き方を検証します。最終的に、自分の主要2業態（飲食・宿泊）向けの再利用テンプレートを完成させます。このテンプレートはWeek 5のプロンプトライブラリ、Week 6の外注指示書の原型になるため、他人が読んで使える粒度で書いてください。","deliverables":["7スロット分解表","静止画7枚（基準1、カメラ3、光3）","スロット別の効き方記録（5段階評価つき）","再利用テンプレート2種類（飲食・宿泊）","テンプレート汎用性の検証結果1枚"],"constraints":["単変量テストでは1スロット以外を一切変更しない","抽象的な形容詞を最終テンプレートに残さない","作業時間は90分以内"]},"success":["すべての生成について、使用した7スロットの内容が記録されている","カメラ変更群・光変更群それぞれで、変更したスロット以外が完全に同一である","テンプレートの可変部が [ ] で明示され、固定部に被写体固有語が混入していない","抽象語を物理的記述に変換した例を3つ以上挙げられる"],"rubric":[{"axis":"映像の品質","pass":"3点＝7枚すべてが使用可能な品質。5点＝スロット指定どおりの画が意図的に得られている。"},{"axis":"動きの自然さ","pass":"本レッスンは静止画中心のため、3点＝動画化を試した場合に破綻がない。5点は評価対象外。"},{"axis":"ブランド整合性","pass":"3点＝7枚の色調が揃っている。5点＝スタイルスロットでブランドトーンを固定できている。"},{"axis":"マーケ目的整合性","pass":"3点＝テンプレートが実案件の業態に即している。5点＝顧客の修正要望をスロットに翻訳する対応表がある。"},{"axis":"再現性","pass":"3点＝テンプレートが保存されている。5点＝第三者が同じ結果を再現できる記述粒度になっている。"},{"axis":"時間とコスト","pass":"3点＝7枚を予定クレジット内で完了。5点＝テンプレート化により次回の試行回数削減の見込みを数値で示せる。"}],"pitfalls":[{"problem":"テンプレートに被写体固有の語が残り、流用すると破綻する","cause":"固定部と可変部の切り分けが甘い","fix":"別業態の被写体を入れて1回テストする。破綻したら、その原因になった語を可変部に移す。"},{"problem":"長く書けば精度が上がると思い込む","cause":"静止画生成の経験から、語数と品質を混同する","fix":"スロットあたり1〜2要素に制限する。語を足す前に、既存の語のうち効いていないものを削る。"},{"problem":"ロゴや看板の文字が崩れて修正に時間を取られる","cause":"文字を生成させようとしている","fix":"構図上、文字を小さく／ボケの中に配置する。実ロゴは生成せず編集工程で合成する前提にする。"},{"problem":"否定指定を重ねるほど狙いから外れる","cause":"本文での否定が意図と逆に作用している","fix":"否定を肯定形の情景描写に書き換える。ネガティブ専用欄がある場合のみそちらに記述する。"},{"problem":"スロットの効き方を記録せず感覚で済ませる","cause":"その場では覚えている気がする","fix":"生成直後に5段階採点を入力する。1週間後に見返して使える形にしておかないと、修正対応の高速化につながらない。"}],"resourceIds":["hf-prompt-bank","hf-academy-ad-3step","jp-bunka-checklist"],"nextHint":"明日は、7スロットのうち最も専門性が要る『カメラ』を深掘りします。ショットサイズ・アングル・移動・レンズの語彙を、顧客に説明できるレベルまで揃えます。","setup":{"tag":"静止画のみ","model":"手持ちのツールで可（ChatGPT / Gemini / Soul 2.0）。動画は作らない","seconds":"—","res":"2K","aspect":"9:16","outputs":"1","cap":"静止画12枚","credits":"約 1.5 cr（$0.08）","unlimited":"0 cr","save":"Soul 2.0 は1枚0.125クレジット。12枚でも1.5クレジットで、Seedance 2.0 の4秒動画1本（18クレジット）の12分の1。プロンプト構造の学習はすべてここで回すのが正しい。"}},{"id":"w1d4","day":4,"title":"カメラワークと構図の語彙","subtitle":"ショットサイズ・アングル・移動・レンズを意図と結びつける","why":"カメラの語彙は、プロンプトの精度を上げるためだけのものではありません。顧客との会話で「ここは引きで、ここは寄りで」と話せるかどうかが、制作者として信頼されるかの分かれ目になります。また、ショットサイズは心理的距離に直結します。引きの画は状況を説明し、寄りの画は感情を喚起する。この原則を外すと、15秒の広告で情報が伝わらない、あるいは情緒が出ないという事故が起きます。今日は映像制作の共通言語を身につけ、それをプロンプトの語に接続します。この語彙はHiggsfieldに限らず、どのツールに移っても使えます。","goals":["主要なショットサイズとアングルを、使う目的とセットで説明できる","代表的なカメラ移動を区別し、狙う心理効果に応じて選択できる","焦点距離と被写界深度の関係を理解し、背景処理を意図的にコントロールできる","1つの被写体に対して情報量の異なるショットを設計できる"],"duration":"85分","timeBreakdown":[{"label":"語彙の整理","min":25},{"label":"ショットサイズ・アングルの生成検証","min":35},{"label":"カメラ移動の動画検証","min":25}],"tools":["Higgsfield（画像生成、image-to-video、カメラ制御に相当する機能）","プロンプト管理シート"],"prereq":["Day3の7スロットテンプレートが完成していること","基準画像が1枚あること"],"theory":[{"heading":"ショットサイズと心理的距離","body":"ショットサイズは被写体がフレームに占める割合です。人物基準の呼称が標準ですが、料理や建物にも同じ考え方を使います。\n\n- **ワイド／エスタブリッシング（WS）**　全体と状況を見せる。宿の外観、店の全景。広告の冒頭で「どこの話か」を一瞬で伝える役割。\n- **フル／ミディアム（MS）**　被写体の全体像。皿全体、客室全体。情報量と親密さのバランスが取れる。\n- **クローズアップ（CU）**　被写体の一部に寄る。麺を持ち上げる、湯気、布の質感。感情と欲求を喚起する。\n- **エクストリーム・クローズアップ（ECU）**　質感そのもの。スープの表面、氷の粒、木目。情報は少ないが強度が高い。\n\n実務の原則は**「引きで説明し、寄りで欲しがらせる」**です。15秒の飲食広告なら、最初の1〜2秒で寄り（食欲喚起）、中盤で引き（店の様子）、終盤でまた寄り（決定打）＋情報という構成が機能しやすい。宿泊施設の30秒なら、冒頭に引き（立地・景観）を置いて舞台を示し、中盤で寄り（体験の質感）を重ねる構成が合います。業態によって「引きが先か寄りが先か」が変わるのは、顧客が買っているものが違うからです。料理は欲求、宿は体験と場所。"},{"heading":"アングルが作る力関係","body":"- **アイレベル**　被写体と同じ高さ。中立。信頼感、ドキュメンタリー的。\n- **ハイアングル（俯瞰）**　上から見下ろす。被写体を小さく、状況を把握しやすく見せる。料理の俯瞰（真上＝フラットレイ）は盛り付け全体を見せるのに有効だが、立体感と湯気は出にくい。\n- **ローアングル**　下から見上げる。被写体を大きく、威厳あるものに見せる。建物の外観、ボトル、グラスに有効。\n- **斜め45度**　料理撮影の定番。人が食卓で見る視点に近く、立体感と皿の全体像を両立する。\n\n飲食の実務では、**料理の種類でアングルの最適解が変わります**。丼もの・麺類は具材が上面に並ぶため俯瞰か高めの斜めが効き、層のあるもの（バーガー、パフェ、ケーキ）は低めの水平に近い角度で層を見せる。汁物は表面の照りを拾える角度が必要になるため、光源の位置とセットで決めます。アングル単独ではなく、光とセットで考える癖をつけてください。"},{"heading":"カメラ移動と、その指示がAIに通る形","body":"主要な移動は限られています。プロンプトで使う英語表現とセットで覚えます。\n\n- **プッシュイン / プルアウト（dolly in / out）**　被写体に近づく／遠ざかる。最も失敗が少なく、広告で最も使われる。\n- **トラック / パン（truck, pan）**　横に移動する／その場で左右に振る。空間の広がりを見せる。\n- **ティルト（tilt up / down）**　上下に振る。建物の高さ、料理の層を見せる。\n- **オービット / アーク（orbit, arc around）**　被写体の周りを回る。商品に強い。ただしAI生成では背景の整合が崩れやすい。\n- **クレーン / ブーム（crane up）**　上昇しながら引く。締めのカットに使われる。\n\nAI動画生成における実務的な注意が3つあります。第一に、**1カットに移動は1つ**。複数の移動を同時指定すると高確率で破綻します。第二に、**移動量は控えめな指定のほうが安定する**（slow, subtle, slight を付ける）。第三に、**オービットや複雑な移動は背景の破綻率が高い**ため、背景が単純な構図でのみ使う。\n\nまた、カメラ制御が専用のプリセット機能として提供されている場合は、プロンプトに文章で書くよりプリセットを使うほうが安定する傾向があります。両方を試して、自分の環境でどちらが安定するかを今日確かめます。"},{"heading":"焦点距離と被写界深度","body":"焦点距離（mm）は画角と圧縮効果を決めます。被写界深度はピントの合う奥行きの範囲です。\n\n- **広角（16〜28mm）**　画角が広い。空間が広く見え、遠近が強調される。客室・店内を広く見せたいときに使う。ただし歪みが出るため料理には不向き。\n- **標準（35〜55mm）**　人の見た目に近い。汎用。料理の斜めカットに適する。\n- **望遠（85〜135mm）**　画角が狭く、背景が圧縮されてボケやすい。料理の寄り、商品の切り取りに適する。\n\n被写界深度を浅くする（背景をぼかす）条件は、望遠寄り・絞り開放・被写体に近い、の3つです。プロンプトでは `shallow depth of field`、`85mm`、`f/1.8` のような語で近い効果が得られます。\n\n**宿泊施設の室内は深い被写界深度（deep focus）が基本**です。奥までピントが合っていないと「部屋の広さ」という最も重要な情報が伝わりません。一方で**料理は浅い被写界深度**で背景を整理するのが定石です。業態で初期設定が逆になる、と覚えてください。顧客の修正要望で「もっと広く見せて」と言われたら広角＋深い被写界深度、「もっと美味しそうに」なら望遠寄り＋浅い被写界深度、と翻訳できます。"}],"steps":[{"n":1,"action":"ショットサイズ4段階を生成する","detail":"Day3のテンプレートのカメラスロットだけを変え、WS / MS / CU / ECU の4枚を生成します。被写体・光・環境は固定です。4枚を並べて、それぞれが「何を伝えているか」を1行ずつ書きます。","check":"4枚が生成され、各ショットが伝える情報が言語化されている"},{"n":2,"action":"アングル3種を生成する","detail":"アイレベル / ハイアングル（または真俯瞰） / ローアングル の3枚を生成します。被写体が料理なら、どのアングルが食欲を喚起するかを判断し、理由を書きます。","check":"3枚が生成され、業態に対する最適アングルとその理由が書かれている"},{"n":3,"action":"被写界深度を2通り試す","detail":"浅い（shallow depth of field, 85mm）と深い（deep focus, 24mm）で各1枚生成します。背景の情報量がどう変わるかを確認し、飲食と宿泊でどちらを初期設定にするか決めます。","check":"2枚の比較から、業態別の初期設定方針が1行で書かれている"},{"n":4,"action":"カメラ移動をプロンプト指定で3本生成する","detail":"採用した静止画1枚から、push in / pan right / orbit の3本を動画生成します。それぞれ slow や subtle を付けた控えめな指定にします。破綻の有無と、移動の正確さを記録します。","check":"3本が生成され、どの移動が最も安定したかが記録されている"},{"n":5,"action":"カメラ制御機能（プリセット）があれば同じ移動を試す","detail":"カメラモーションのプリセット機能に相当するものがある場合、同じ3種をそちらで生成し、プロンプト指定との安定性・正確性を比較します。ない場合はこの手順を飛ばし、メモに「未提供」と記録します。","check":"プリセットとプロンプト指定の優劣が記録されている、または機能の有無が記録されている"},{"n":6,"action":"移動量の大小を比較する","detail":"最も安定した移動種（多くの場合 push in）について、控えめ（slow, subtle）と大きめ（fast, dramatic）の2本を生成し、破綻率の差を確認します。以後の既定値を決めます。","check":"移動量の既定方針が決まっている"},{"n":7,"action":"カメラ語彙の自分用対照表を作る","detail":"日本語の演出意図（例：広く見せたい、美味しそうに、高級に、動きを出したい）と、対応する英語のカメラ記述を対照表にします。10行以上作ります。これは顧客の修正要望を即座にプロンプトに翻訳するための辞書です。","check":"10行以上の日英対照表が作成されている"}],"prompts":[{"label":"ショットサイズ4段階（カメラスロット差し替え）","text":"WS: wide establishing shot, eye level, 24mm equivalent, deep focus | MS: medium shot, 45-degree angle, 50mm equivalent, moderate depth of field | CU: close-up, 45-degree angle, 85mm equivalent, shallow depth of field | ECU: extreme close-up on surface texture, 100mm equivalent macro look, very shallow depth of field","note":"他6スロットを固定して、この行だけを入れ替える。4枚の情報量の差を体感するための教材。","status":"未検証","flow":{"code":"SLOT","step":"単発","input":"単体では送らない。w1d3のテンプレートのカメラ行だけをWS/MS/CU/ECUの4通りに入れ替える","output":"被写体・光・環境を固定した静止画4枚。各ショットが伝える情報の差が並ぶ","next":"4枚から動画化する1枚を選び、『安定しやすいカメラ移動（動画）』の起点画像にする"}},{"label":"安定しやすいカメラ移動（動画）","text":"Slow dolly in toward the subject, subtle and continuous, constant speed, no cuts, no camera shake","note":"最も破綻率が低い構成。constant speed と no cuts を明示することで、途中でのカット挿入や急加速を抑える狙い。","status":"未検証","flow":{"code":"I2V","step":"単発","input":"前の工程で採用した静止画1枚。新しく画像は作らない。移動種を1つだけ指定して渡す","output":"動画1本。破綻率が最も低い既定の移動で、等速かつ途中カットが入らない","next":"ここで完結。fast・dramatic版と比べて既定の移動量を決め、日英対照表に書き足す","where":"生成画面でモデルを選ぶ（image-to-video）","whereNote":"最も安く、Seedance 2.0 系・Kling 3.0・Wan 2.7 なら Unlimited 対象"}},{"label":"商品向けオービット（背景が単純な場合のみ）","text":"Slow orbit around the subject, 30 degrees of rotation only, subject stays centered, background remains simple and consistent, no cuts","note":"回転量を明示的に小さく制限するのがポイント。背景が複雑な構図では使わない。宿泊施設の室内では背景破綻が起きやすいため非推奨。","status":"未検証","flow":{"code":"I2V","step":"単発","input":"背景が単純な静止画1枚のみ。新規生成はしない。宿の室内など背景が複雑な画には使わない","output":"30度だけ回り込む動画1本。被写体は中央に留まり、背景は一定に保たれる","next":"ここで完結。dolly in版と破綻率を比べ、オービットを使える構図条件を記録する","where":"生成画面でモデルを選ぶ（image-to-video）","whereNote":"最も安く、Seedance 2.0 系・Kling 3.0・Wan 2.7 なら Unlimited 対象"}}],"expected":"静止画9枚前後（ショットサイズ4、アングル3、被写界深度2）と動画4〜5本、そして日英のカメラ語彙対照表が手元にある状態です。「もっと広く見せて」という顧客の一言を、カメラスロットの具体的な記述に即座に変換できれば到達です。","assignment":{"title":"カメラ語彙の体系化と安定条件の特定","brief":"ショットサイズ・アングル・被写界深度・移動の4要素を、それぞれ比較生成によって検証します。同時に、自分の環境でどのカメラ移動が安定するかという実務上きわめて重要な情報を特定します。最終成果物の対照表は、Week 4以降の顧客対応で毎回使うことになります。","deliverables":["ショットサイズ4枚＋各ショットの役割メモ","アングル3枚＋業態別最適アングルの判断","被写界深度2枚＋業態別初期設定方針","カメラ移動の検証動画3〜5本と安定性ランキング","日英カメラ語彙対照表（10行以上）"],"constraints":["カメラスロット以外を変更しない","カメラ移動は1カットにつき1種類のみ指定する","作業時間は90分以内"]},"success":["ショットサイズ4段階が明確に異なる画として得られている","カメラ移動の安定性が順位づけされ、既定値が決まっている","被写界深度について飲食／宿泊の初期設定が言語化されている","日英対照表が10行以上あり、顧客の言葉から引ける形になっている"],"rubric":[{"axis":"映像の品質","pass":"3点＝各ショットサイズが意図どおり得られている。5点＝ECUでも質感が破綻していない。"},{"axis":"動きの自然さ","pass":"3点＝移動が指定方向に発生している。5点＝速度が一定で、加減速やブレが不自然でない。"},{"axis":"ブランド整合性","pass":"3点＝カメラ変更後も色調が維持されている。5点＝ショットサイズを変えてもトーンが一貫している。"},{"axis":"マーケ目的整合性","pass":"3点＝ショットごとの役割が言語化されている。5点＝業態別の構成方針に落とし込めている。"},{"axis":"再現性","pass":"3点＝対照表が存在する。5点＝対照表を見れば他人が同じ画を出せる。"},{"axis":"時間とコスト","pass":"3点＝予定内で完了。5点＝不安定な移動を避ける判断により再生成回数を抑えられている。"}],"pitfalls":[{"problem":"複数のカメラ移動を1カットで指定して破綻する","cause":"実写の感覚で複合移動を書いてしまう","fix":"1カット1移動を原則にする。複合的な動きが必要なら2カットに分割して編集でつなぐ。"},{"problem":"オービットを多用して背景が崩れる","cause":"回り込みは背景の整合性維持が難しい","fix":"回転角を小さく明示する。背景が複雑な場合は push in に置き換える。"},{"problem":"料理を広角で撮って歪む","cause":"広い画角＝情報量が多いと考えてしまう","fix":"料理は50mm以上を既定にする。皿の縁の楕円が不自然なら焦点距離の指定を長くする。"},{"problem":"客室を浅い被写界深度で撮って広さが伝わらない","cause":"料理の癖でボケを入れてしまう","fix":"宿泊施設の室内は deep focus を既定にする。ボケを使うのは寝具の質感など部分の寄りだけ。"},{"problem":"対照表が英語の単語帳になり実務で引けない","cause":"英語起点で作っている","fix":"必ず顧客が言う日本語（『広く』『高級に』『あたたかく』）を左列に置く。引く方向を実務に合わせる。"}],"resourceIds":["sb-sizes","sb-movement","sb-focal","sb-dof","hf-prompt-bank","hf-help-dop","hf-help-cinema-studio","asc-distortion"],"nextHint":"明日は光を扱います。カメラ以上に印象を左右する変数で、ここまでの5パターン課題もここで仕上げます。","setup":{"tag":"カメラ検証","model":"静止画 手持ちのツールで可（ChatGPT / Gemini / Soul 2.0） ／ 動画 Kling 3.0（カメラ移動が安定し、単価も最安級）","seconds":"5秒","res":"720p","aspect":"9:16","outputs":"1","cap":"静止画9枚・動画5本","credits":"約 51 cr（$2.56）","unlimited":"0 cr","save":"Kling 3.0 は5秒720pで10クレジット。Seedance 2.5 の同条件（約33クレジット）の3分の1で、カメラの挙動を見る目的には十分。DoP のプリセットも試す場合、DoP は単価が公開されていないので、生成ボタンの表示を必ず確認してから押すこと。"}},{"id":"w1d5","day":5,"title":"ライティングと評価基準、Week 1課題の仕上げ","subtitle":"光で印象を作り分け、5パターンを記録シートとして完成させる","why":"同じ料理でも、光の方向と色温度を変えるだけで「家庭的」から「高級店」まで印象が動きます。カメラが情報の量を決めるのに対し、光は情報の意味を決めます。そして顧客の修正要望の多くは、実は光の要望です。「もっと美味しそうに」「高級感を」「あたたかい感じに」はすべて、ほぼ光の問題として解決できます。今日は光の3要素を整理し、Week 1課題である5パターンを完成させて、制作条件と結果を突き合わせる記録シートを作ります。この記録シートの形式は、以後6週間すべての課題で使います。","goals":["光の方向・質・色温度の3要素を独立して指定し、印象を作り分けられる","生成結果を6軸で評価し、改善すべき変数を特定できる","同一被写体の5パターンを完成させ、条件と結果を対応づけて記録できる","自分の制作における現在の採用率とカット単価を把握している"],"duration":"90分","timeBreakdown":[{"label":"光の3要素","min":20},{"label":"5パターンの仕上げ生成","min":45},{"label":"記録シート作成と週次振り返り","min":25}],"tools":["Higgsfield（画像生成、image-to-video）","制作台帳・記録シート（スプレッドシート）"],"prereq":["Day1〜4の成果物が揃っていること","カメラ語彙対照表があること"],"theory":[{"heading":"光の3要素","body":"光は3つの独立した変数で記述できます。混ぜずに1つずつ指定するのが要点です。\n\n**1. 方向**　どこから当たっているか。\n- 順光（front）：陰影が消え、平板になる。情報は伝わるが魅力は出にくい。\n- サイド（side, from the left/right）：陰影が出て立体感が生まれる。料理・商品の基本。\n- 逆光・半逆光（backlight, rim light）：輪郭が光り、湯気や液体が映える。食品撮影で最も劇的な効果を生む。\n- トップ（from above）：真上。俯瞰の料理カットと相性がよいが、手前が暗くなりやすい。\n\n**2. 質**　硬いか柔らかいか。影の縁の鋭さで決まる。\n- 硬い光（hard light, direct sunlight）：影がくっきり。シャープ、力強い、夏、昼。\n- 柔らかい光（soft light, diffused, overcast）：影がなだらか。上品、落ち着き、曇天、朝夕の室内。\n\n**3. 色温度**　暖色か寒色か。ケルビン（K）で表す。\n- 2700〜3200K：電球色。温かい、くつろぎ、夜、居酒屋、客室。\n- 4000〜4500K：中間。自然、清潔。\n- 5500〜6500K：昼光色。クリア、朝、曇天、ビルのガラス面からの反射光、清涼感。\n\nこの3要素は掛け算です。「柔らかい・サイドからの・3000Kの光」と書けば、ほぼ狙った空気感に収束します。抽象語を一切使わずに雰囲気を指定できるようになるのが今日のゴールです。"},{"heading":"食品と宿泊で効く光が違う","body":"**食品**で最も効くのは半逆光です。被写体の奥側から光を当てると、湯気が光を透過して見え、液体の表面に反射が生まれ、食材の縁が光ります。シズル感と呼ばれるものの物理的な正体はこの透過光と反射です。「美味しそうに」という要望に対する最短の操作は、光源を被写体の奥に回すことです。\n\n**宿泊施設**で最も効くのは窓光です。客室の映像において、窓から入る自然光が主光源になっていると「現実の部屋」として信用されます。逆に、天井照明が主光源の室内カットは、カタログ的で没個性になりがちです。東京の都市型ホテルでは、向かいのビルのガラス面が巨大なレフ板として働き、直射の届かない時間帯でも6000K前後の柔らかい反射光が室内に入ります。西向きの部屋なら夕方に低い西日が深く差し込み、床と壁に長い光の帯を作ります。この「ビル面の反射光」と「西日」は東京固有の光なので、プロンプトで明示的に指定する価値があります。\n\n夜の宿泊施設は逆に、室内の暖色（2700K前後）と窓外の青い残照（7000K以上）に街明かりと看板のネオンが混ざる色温度差が映像的な見どころになります。この対比を意図的に指定できると、ありきたりでない画になります。"},{"heading":"6軸の評価を習慣にする","body":"本カリキュラムの全課題で使う評価軸は次の6つです。毎回、5段階で採点します。\n\n1. **映像の品質**　解像感、破綻の有無、ノイズ、質感の説得力\n2. **動きの自然さ**　カメラと被写体の動きが物理的に妥当か、変形がないか\n3. **ブランド整合性**　色調・トーンが想定ブランドと合っているか、他カットと揃うか\n4. **マーケ目的整合性**　誰に何を伝える映像か、その目的に照らして適切か\n5. **再現性**　同じものをもう一度作れるか、手順と条件が残っているか\n6. **時間とコスト**　所要時間と消費クレジットが想定内か\n\n重要なのは、**「きれいにできた」を合格にしない**ことです。1と2が5点でも、4が2点なら商品として不合格です。逆に1が3点でも、4と5が5点なら、事業としては十分に機能します。顧客が払うのは映像美ではなく、課題解決に対してです。\n\n毎回の採点で最も低い軸が、次に取り組むべき課題です。6週間を通して、どの軸が自分の弱点として繰り返し現れるかを観察してください。"}],"steps":[{"n":1,"action":"光スロットを4方向で生成する","detail":"Day3のテンプレートの光スロットだけを変え、順光 / サイド / 半逆光 / トップ の4枚を生成します。食品が被写体なら、半逆光がどれだけ効くかを確認してください。","check":"4枚が生成され、どれが最も被写体の魅力を引き出したか判定できている"},{"n":2,"action":"色温度を3段階で生成する","detail":"3000K / 4500K / 6000K の3枚を生成します。他は固定です。同じ被写体がどこまで違う文脈に見えるかを確認します。","check":"3枚が生成され、それぞれが想起させる場面を言語化できている"},{"n":3,"action":"Week 1課題の5パターンを設計する","detail":"ここまでの検証をもとに、同一被写体で明確に異なる5パターンを設計します。カメラ・光・構図のどれをどう変えるかを、生成前に表に書き出します。『なんとなく5本』ではなく『説明できる5本』にすることが条件です。例：(1)引き・順光・標準、(2)寄り・半逆光・望遠、(3)俯瞰・トップ光・標準、(4)ロー・サイド硬質光・広角、(5)寄り・窓光柔らか・望遠。","check":"5パターンの設計表が、生成前に完成している"},{"n":4,"action":"5パターンの静止画を生成する","detail":"設計表に従って5枚生成します。狙いから外れたものは1回だけ再生成し、2回目も外れたら『外れた』という事実ごと記録します。都合のよい結果だけを残すと、採用率の実態が分からなくなります。","check":"5枚が揃い、生成回数がすべて台帳に記録されている"},{"n":5,"action":"5パターンを動画化する","detail":"各静止画から、その画に合うカメラ移動を1つ選んで動画化します。5本すべて同じ移動にしないこと。ショットサイズと移動の相性（寄り＋大きな移動は酔う、引き＋微速プッシュインは安定）を体感します。","check":"5本の動画が完成し、各カットの移動選択理由が記録されている"},{"n":6,"action":"6軸評価を5本すべてに行う","detail":"各動画に6軸5段階で採点し、合計点と最低点の軸を記録します。最低点の軸について、次回どう改善するかを1行書きます。","check":"5本×6軸の採点が完了し、改善方針が書かれている"},{"n":7,"action":"記録シートを完成させる","detail":"列構成：パターン番号 / 狙い / カメラ指定 / 光指定 / 使用プロンプト / 生成回数 / 採用可否 / 消費クレジット / 所要分 / 6軸スコア / 気づき。この形式が以後の標準フォーマットになります。","check":"5行すべてが埋まった記録シートが完成している"},{"n":8,"action":"週次の数値を集計する","detail":"Week 1全体の総生成回数、採用数、採用率、総消費クレジット、1採用カットあたりクレジット、総作業時間を集計します。この数字がWeek 6の価格設計の最初の実測値になります。","check":"週次集計の6つの数値が出ている"}],"prompts":[{"label":"半逆光のシズル表現（食品）","text":"Backlight from behind and slightly above the dish, strong rim light on the rising steam, warm 3000K key, soft fill from the front left at low intensity, specular highlights on the broth surface, dark background for separation","note":"食品で最も効く光の構成。背後からの光が湯気を透過させ、スープ表面に反射を作る。背景を暗くすることで輪郭が際立つ。fill を弱く指定して手前が潰れないようにしている。","status":"未検証","flow":{"code":"SLOT","step":"単発","input":"単体では送らない。w1d3テンプレートの [LIGHT: ] の中身を、この記述に丸ごと差し替える","output":"湯気が透過しスープ面に反射が乗った静止画1枚。輪郭が背景から分離する","next":"この1枚を動画化の起点にし、Week 2 のフックカットの既定構成としてそのまま持ち越す"}},{"label":"ビル面の反射光の客室（宿泊・昼）","text":"Soft overcast daylight entering through a large window, the glass facade of the building across the street acting as a natural reflector, cool 6000K ambient fill with no harsh shadows, one warm 2700K practical lamp in the corner for contrast, deep focus","note":"東京の都市型ホテルに実在する光条件。向かいのビルのガラス面が巨大なレフ板になる現象を言語化している。室内灯を1灯だけ暖色で残すと画面に奥行きが出る。","status":"未検証","flow":{"code":"SLOT","step":"単発","input":"単体では送らない。宿泊用テンプレートの光スロットをこの記述に差し替える。昼のカット専用","output":"静止画1枚。隣棟のガラス面が巨大なレフ板として働き、影の硬さが消えた昼の客室になる","next":"夜版と並べて色温度の使い分けを言語化し、Week 1 課題の5パターンの1枚に組み込む"}},{"label":"夜の色温度コントラスト（宿泊・夜）","text":"Interior lit only by warm 2700K practical lamps, deep blue 8000K twilight over the city visible through the window, scattered window lights and a faint neon colour cast from the street below, strong color temperature contrast between inside and outside, soft shadows, no overhead ceiling light","note":"夜の宿カットで最も効く構成。天井照明を明示的に排除することで、カタログ的な平板さを避ける。外の青と街明かり・ネオンの色かぶり、そして室内の橙の対比が画の主役になる。","status":"未検証","flow":{"code":"SLOT","step":"単発","input":"単体では送らない。宿泊用テンプレートの光スロットを差し替える。天井照明の排除指定を含む","output":"静止画1枚。外の青と街明かり、室内の橙の対比が主役になり、平板さが消える","next":"昼版と対にして宿泊案件の既定2パターンとし、課題5本の設計表に反映する"}}],"expected":"静止画7枚（光方向4、色温度3）に加えて、課題である5パターンの静止画5枚と動画5本が完成している状態です。さらに、設計表・記録シート・週次集計が揃い、自分の現在の採用率と1カットあたりコストが数字で言える状態になっています。映像の出来よりも、この数字が揃っていることのほうが重要です。","assignment":{"title":"【Week 1 総合課題】同一被写体・5パターン制作と記録シート","brief":"同じ料理または商品を使い、カメラワーク・照明・構図の異なる映像を5パターン制作します。重要なのは5本の見栄えではなく、5本それぞれについて『何を狙い、どの変数をどう設定し、結果どうなったか』を説明できることです。生成前に設計表を作り、生成後に6軸評価と記録シートを完成させてください。設計なしに作った5本は、本課題では不合格とします。","deliverables":["5パターンの動画（各5秒前後）","5パターンの設計表（生成前に作成したもの）","7スロット形式のプロンプト集（5本分）","制作条件と結果の比較記録シート（6軸評価を含む）","Week 1 週次集計（生成回数・採用率・総クレジット・1カット単価・総時間）"],"constraints":["被写体は5本すべて同一にする","各パターンの再生成は1回までとし、結果を記録する","1本あたりのカメラ移動は1種類のみ","総作業時間は90分以内"]},"success":["5パターンが、カメラ・光・構図の指定として明確に異なっている","設計表が生成前に作られており、結果との差分が記録されている","6軸評価が5本すべてに付いており、最低点の軸に対する改善方針がある","週次集計の6つの数値がすべて算出されている","各パターンについて『誰に何を伝える画か』を1行で説明できる"],"rubric":[{"axis":"映像の品質","pass":"3点＝5本すべてが視聴に耐える。5点＝半逆光カットで湯気や反射の質感が説得力を持っている。"},{"axis":"動きの自然さ","pass":"3点＝致命的な変形がない。5点＝ショットサイズと移動量の相性が適切で、見ていて疲れない。"},{"axis":"ブランド整合性","pass":"3点＝5本の色調に統一感がある。5点＝意図的に変えた箇所と揃えた箇所を説明できる。"},{"axis":"マーケ目的整合性","pass":"3点＝各パターンの狙いが書かれている。5点＝どのパターンをどの配信面で使うかまで決まっている。"},{"axis":"再現性","pass":"3点＝プロンプトと条件が保存されている。5点＝記録シートを見れば1ヶ月後の自分が完全に再現できる。"},{"axis":"時間とコスト","pass":"3点＝90分以内に完了。5点＝採用率と単価を算出し、Week 2の目標値を設定できている。"}],"pitfalls":[{"problem":"5パターンが似通ってしまう","cause":"変数を1つずつしか変えていない、または変化量が小さい","fix":"設計表の段階で、5本のカメラ・光・構図の組み合わせが重複していないか確認する。少なくとも2変数は大きく変える。"},{"problem":"うまくいかなかった生成を記録から外す","cause":"成果物を良く見せたい意識","fix":"失敗こそが採用率の分母。台帳には失敗も必ず記録する。採用率を正しく知らないまま見積を作ると事業が傷む。"},{"problem":"料理を順光で撮って平板になる","cause":"明るく撮れば美味しそうになると考えている","fix":"光源を被写体の奥に回す。半逆光＋弱い前方フィルが食品の基本構成。"},{"problem":"客室の画に天井照明を入れて没個性になる","cause":"明るさを優先している","fix":"窓光を主光源にし、天井照明を明示的に排除する。暖色の間接照明を1灯だけ残す。"},{"problem":"6軸評価が全部4点になり改善点が出ない","cause":"自己評価が甘い、または軸の意味が曖昧","fix":"各軸で必ず1つは3点以下を付けるルールにする。相対評価として5本の中で順位をつけてから点数化する。"}],"resourceIds":["sb-3point","sb-thirds","hf-blog-cinema4","hf-academy-seedance-eval","asc-ad"],"nextHint":"Week 2では、ここで身につけた変数操作を飲食店の実案件に適用します。15秒の広告を1本、企画書と絵コンテつきで完成させます。","setup":{"tag":"Week 1 総合課題","model":"静止画 手持ちのツールで可（ChatGPT / Gemini / Soul 2.0） ／ 動画 Seedance 2.0","seconds":"5秒","res":"720p","aspect":"9:16","outputs":"1","cap":"静止画14枚・動画5本（再生成は各1回まで）","credits":"約 114 cr（$5.71）","unlimited":"0 cr","save":"5パターンは設計表を書いてから生成する。設計なしだと平均3本が無駄になり、その分がそのまま原価に乗る。"}}]},{"week":2,"title":"商品・料理の広告動画","theme":"「きれいな料理の映像」を「売る目的を持った15秒」に変える","objective":"料理を被写体にした広告映像の構図・質感・破綻対処・世界観統一を一通り身につけ、飲食店向け15秒広告を企画書・絵コンテ・原価試算とセットで1本納品できる状態にする。","hours":"7時間（80〜90分 × 5日）","weekDeliverables":["飲食店向け15秒広告の完成動画1本（9:16・音あり・書き出し済み）","企画書1枚（対象客・目的・訴求1点・禁止事項・測定方法）","絵コンテ（カット番号・尺・ショットサイズ・動き・音・字幕まで記入済み）","使用プロンプト一式（7スロット形式・静止画と動画を分離して記録）","制作時間と品質評価の記録（6軸評価＋採用率を織り込んだ実質原価の試算）"],"outcome":"完成した15秒広告について「どのカットが何を担い、どこを何回やり直し、実質いくらかかったか」を数字と工程で説明できる。","lessons":[{"id":"w2d1","day":1,"title":"食品ビジュアルの原則と皿の構図設計","subtitle":"料理種別ごとの最適アングルを決め、1.5クレジットの静止画段階で勝負を終わらせる","why":"料理の映像で失敗する最大の原因は、動かし方ではなく最初の1枚の構図です。皿の置き方と光の角度を外した絵は、どんなカメラワークを足しても美味しそうになりません。そして動画生成は静止画生成の数十倍のコストがかかります。執筆時点の公開値では Product Shot 2K が1.5クレジット（約$0.075）、Marketing Studio の15秒720p動画が89.2クレジット（約$4.46）で、約59倍の差です。つまり動画を1本やり直すコストで静止画を59枚試せます。構図の迷いを動画段階に持ち込むのは、金額換算で59倍の無駄を払う行為になります。今日はその「安い層」で意思決定を終わらせる技術を固めます。","goals":["料理を皿・器・背景の三層に分解し、どの層を変えれば何が変わるかを指定できる","丼・麺類／層のあるもの／汁物／皿盛りの4類型について最適アングルを選び、理由を説明できる","字幕とロゴの居場所を確保した余白設計を、生成前のプロンプトに書き込める","Product Shots に相当する機能で静止画を量産し、動画換算の原価差を数値で示せる","採用1枚と次善1枚のショートリストを作り、翌日の動画化に引き渡せる"],"duration":"80分","timeBreakdown":[{"label":"原則の理解とアングル判定","min":25},{"label":"静止画の比較生成","min":35},{"label":"選定・余白検証・原価記録","min":20}],"tools":["Higgsfield（Marketing Studio の Product Shots に相当する機能／Studio・Lifestyle）","Higgsfield（画像生成モデル：Soul 2.0、Nano Banana、Seedream、MS Image など選択可能なもの）","画像編集または資料作成ツール（字幕帯の重ね検証用）","制作台帳スプレッドシート（Week 1 で作成したもの）"],"prereq":["Week 1 の7スロットテンプレートと制作台帳が運用されていること","対象にする飲食店を1店（実在・架空どちらでもよいが設定は固定）決めていること","その店の実際のメニューから、被写体にする料理を1皿選べる状態であること"],"theory":[{"heading":"料理の画は三層でできている","body":"料理カットは、変えられる層が3つあります。混ぜて考えると修正の当たりどころが分からなくなるので、分けて指定します。\n\n- **第1層：料理そのもの**　具材の配置、量、盛りの高さ、色の面積比。ここは店の商品そのものなので、勝手に変えてはいけない層です。\n- **第2層：器と接地面**　皿・碗・グラスの形状、素材（白磁／粉引き／黒釉／木）、カウンターやテーブルの素材と色。印象の半分はここで決まります。\n- **第3層：背景**　奥に何があるか、どれだけボケているか、明るいか暗いか。文脈（居酒屋／カフェ／立ち飲み）を伝える唯一の層です。\n\n実務での使い分けはこうなります。顧客が「もっと高級に」と言ったら第2層（器を黒釉や漆に、接地面を暗い木に）と光を触ります。「もっと親しみやすく」なら第3層（背景に店内の生活感を入れる、明るくする）。「料理が違う」と言われたら第1層の指定不足です。\n\n東京の案件では第3層の設計が特に効きます。競合密度が高いため、課題は「人が来ない」ではなく「選ばれない」です。窓外に路地、奥に古いタイル壁やカウンター越しの厨房、という背景は、その店だけの固有性を画に乗せられます。逆に無国籍な白背景のスタジオカットは、どの店でも成立してしまうため差別化に寄与しません。**第2層を詰めてブランドを作り、第3層で店の固有性を乗せる**。これが本週の基本線です。"},{"heading":"料理種別でアングルの最適解が変わる","body":"アングルは好みではなく、料理の物理構造で決まります。4類型で覚えてください。\n\n- **丼もの・麺類（ラーメン、つけ麺、親子丼、カレー）→ 俯瞰寄り（真上〜斜め70度）**　具材が器の上面に平面的に並ぶ構造なので、真上に近いほど情報量が最大になります。ただし真俯瞰は立体感と湯気が消えるため、**斜め60〜70度**が実務の中心です。真俯瞰は盛り付けの美しさが主訴求のときだけ使います。\n- **層のあるもの（バーガー、パフェ、ケーキ、サンド）→ 低め〜水平（アイレベル〜15度）**　価値が垂直方向の積層にあるため、見下ろすと層が消えます。カメラを皿と同じ高さまで落とします。\n- **汁物（スープ、鍋、茶碗蒸し）→ 斜め30〜45度＋光源を奥へ**　液面の照りと湯気が主訴求です。角度だけでは決まらず、**反射が見える位置に光源が来る角度**を探す作業になります。アングルと光をセットで動かします。\n- **皿盛り・一品料理（前菜、刺身、ステーキ）→ 斜め45度**　人が食卓で見る視点に最も近く、立体感と皿全体を両立します。迷ったらここが既定値です。\n\nこの対応は Week 1 で学んだショットサイズとは独立です。斜め45度のクローズアップも、斜め45度のミディアムも成立します。**アングルで料理の構造を見せ、ショットサイズで情報量を決める**と覚えると混ざりません。"},{"heading":"余白は装飾ではなく字幕とロゴの用地","body":"広告映像の構図で最も多い事故は、生成した絵が美しすぎて字幕を置く場所がないことです。縦型9:16の場合、実際に使える領域は見た目より狭くなります。\n\n- 上端およそ10〜12%：媒体のUI（アカウント名、音源表示）が重なりうる\n- 下端およそ15〜20%：キャプション、CTAボタン、媒体のUIが重なりうる\n- 残る中央約70%が、実質的な作画領域\n\nしたがって生成段階で意図的に空ける場所を指定します。プロンプトに `centered composition with clear negative space in the lower third for caption text` のように書き、空けた領域には**質感のある単色に近い面**（暗い木目、無地の布、ボケた壁）を置きます。真っ白や真っ黒にすると字幕が乗せにくく、逆に細かい柄があると字幕が読めません。\n\n視線誘導は3つの手段で設計します。**(1) 明度のピーク**　画面内で最も明るい点に視線が行きます。訴求したい部位（溶けるチーズ、照りのある表面）をそこに置きます。**(2) 線の収束**　カウンターの縁、箸、湯気の立ち上がりが視線を導きます。**(3) ボケの境界**　ピントの合っている面積が小さいほど視線が固定されます。\n\n字幕を置く余白と、明度のピークは**分離させる**のが原則です。同じ場所に重なると、どちらも読めなくなります。"},{"heading":"静止画で詰める経済合理性を数字で押さえる","body":"執筆時点で公開されている生成あたりの実費（確認日2026-10-11、1ドル=20クレジット換算）で比較します。\n\n| 生成物 | クレジット | 概算USD |\n|---|---|---|\n| Product Shot 2K 1枚 | 1.5 | $0.075 |\n| Marketing Studio 動画 8秒 720p | 47.62 | $2.38 |\n| Marketing Studio 動画 15秒 720p | 89.2 | $4.46 |\n\n比率で言うと、**15秒動画1本 ≒ 静止画59枚、8秒動画1本 ≒ 静止画31枚**です。この差が意思決定のルールを決めます。\n\n- 構図・器・背景・光の方向の検討は**すべて静止画で終わらせる**。動画で試す価値があるのは「動き」だけ。\n- 静止画30枚（45クレジット＝約$2.25）を使って構図を確定させたとしても、15秒動画の再生成を1回減らせれば回収できる。\n- 逆に、構図が曖昧なまま動画を4本回せば約357クレジット（約$17.8）が飛ぶ。\n\nなお Marketing Studio には**バッチ生成機能がありません**（執筆時点）。変種は再生成で作ることになるため、「1回の生成で複数案が出てくる」前提の見積は立てられません。静止画側で案を絞り込む重要性はここでも効きます。一方、静止画の一括生成が必要なら Ads Studio が1商品あたり最大20案を出せますが、こちらは**静止画広告のみ**で1点4クレジット（約$0.20）と単価が高いので、純粋な料理カットの比較検討には Product Shots のほうが適します。\n\nこの数字は Week 5 の原価管理、Week 6 の価格設計に直接持ち込みます。今日から静止画枚数と動画本数を別の列で記録してください。"}],"steps":[{"n":1,"action":"対象店と被写体の1皿を確定する","detail":"東京の飲食店1店を設定し（業態・客単価・主要客層・営業時間を1行ずつ書く）、その店の**実在するメニューから**被写体を1皿選びます。業態はラーメン、居酒屋、立ち飲み、寿司、焼鳥、焼肉、カフェ、ベーカリー、ビストロ、定食などから1つ選び、立地も駅徒歩分数と路地裏／ビルの地下・空中階／商店街のどれかまで決めます。架空の料理や、その店が出していない料理を描かせると、広告として虚偽表示のリスクを負います。この時点で「この皿は実在する」と確認したことをメモに残してください。","check":"店の設定5項目（業態・客単価・主要客層・営業時間・立地）と、実在確認済みの料理名1つがメモに書かれている"},{"n":2,"action":"料理種別を判定しアングル候補を2つに絞る","detail":"選んだ料理を4類型（丼・麺類／層のあるもの／汁物／皿盛り）のどれかに当てはめ、第一候補のアングルと、比較用の第二候補を決めます。例：味噌ラーメンなら第一候補「斜め65度」、第二候補「真俯瞰」。判定理由を1行書きます。好みではなく構造から決めることが要点です。","check":"類型・第一候補・第二候補・判定理由が記録されている"},{"n":3,"action":"Product Shots の Studio カテゴリで基準カットを1枚生成する","detail":"Marketing Studio の Product Shots に相当する機能のうち、背景を作り込まない Studio 系のカテゴリを選び、第一候補アングルで1枚生成します。ここでの目的は料理そのものの描写精度を確認することです。器と背景は後で詰めるので、この時点で気に入らなくても進めます。","check":"料理の具材構成が指定どおりに描かれた1枚が得られ、消費クレジットが記録されている"},{"n":4,"action":"Lifestyle カテゴリで文脈つきのカットを1枚生成する","detail":"同じ料理を、店内の文脈が入る Lifestyle 系のカテゴリで1枚生成します。Studio 版と並べ、どちらが対象客に効くかを判断します。一般に、競合が密集するなかで知名度のない個人店では**文脈のある絵のほうが「行ける店」として認識されやすい**傾向がありますが、これは検証対象であって断定できる法則ではありません。自分の案件で確かめる前提で記録します。","check":"Studio 版と Lifestyle 版が並び、どちらを主軸にするかの判断と理由が書かれている"},{"n":5,"action":"アングル2候補を同条件で比較生成する","detail":"主軸に決めた系統で、第一候補アングルと第二候補アングルを各1枚、他のスロットを完全に固定して生成します。比較の観点は3つです。(a) 具材の情報量 (b) 立体感と湯気の見え方 (c) 字幕余白の取りやすさ。類型のセオリーが自分の被写体で成立するかをここで確認します。","check":"2枚が生成され、3観点での比較結果が表に記録されている"},{"n":6,"action":"器と接地面を3通り差し替える","detail":"採用アングルを固定し、第2層だけを3通り変えて生成します。例：(A) 白磁＋明るい木のカウンター (B) 黒釉＋暗いウォルナット (C) 粉引き＋ざらついた石。料理と光の指定は1語も変えません。3枚を並べ、店の客単価と内装に合うものを選びます。この選択が翌日以降の全カットの基礎になります。","check":"3枚が生成され、採用1枚とその選択理由（店の客単価・内装との整合）が書かれている"},{"n":7,"action":"余白指定ありのバージョンを生成する","detail":"採用した構図に、下部1/3の字幕余白を明示的に指定したバージョンを9:16で生成します。余白に置く面は「暗い木目」「ボケた無地の壁」など、質感はあるが柄のない面を指定します。真っ白・真っ黒・細かい柄は避けます。","check":"下部に字幕を置ける面を持つ9:16の静止画が得られている"},{"n":8,"action":"字幕帯を実際に重ねて可読性を検証する","detail":"生成画像を資料作成ツールに貼り、上端12%と下端20%にグレーの帯を重ね、その上に実際の訴求コピー（例：店名＋一言）を置きます。コピーが読めるか、料理の主要部が帯に隠れないかを確認します。隠れる場合は構図側を直します。字幕側を小さくして逃げると、配信面で読めない広告になります。","check":"帯を重ねた検証画像があり、料理の主要部が隠れていないことを確認できている"},{"n":9,"action":"ショートリストを作って翌日に引き渡す","detail":"本日生成した静止画から、**採用1枚と次善1枚**を選び、命名規則に従って保存します。次善を残す理由は、翌日の動画化で採用枚が動かしにくい絵だと判明したときに、構図検討をやり直さずに済ませるためです。それぞれ使用プロンプトを7スロット形式で紐づけて記録します。","check":"採用1枚・次善1枚が規則どおりの名前で保存され、プロンプトが紐づいている"},{"n":10,"action":"静止画工程の原価と動画換算を算出する","detail":"本日の総生成枚数 × 単価で静止画工程の消費クレジットを出し、それが15秒動画（89.2クレジット）の何本分に相当するかを計算します。例：静止画18枚＝27クレジット＝15秒動画0.3本分。この「静止画工程は動画0.3本分で済んでいる」という感覚が、今後の工程配分の判断基準になります。","check":"静止画工程の総クレジットと、15秒動画換算の本数が算出されている"}],"prompts":[{"label":"汁物・麺類の基準カット（斜め65度）","text":"[SUBJECT] a bowl of miso ramen with two slices of chashu, menma, chopped scallion and a halved soft-boiled egg, broth filled to two centimeters below the rim [ACTION] faint steam rising from the surface, no movement of the ingredients [ENVIRONMENT] placed on a dark walnut counter, softly defocused warm wooden interior behind, a single small window edge visible at the far right [CAMERA] medium close-up from a 65 degree elevated angle, 50mm equivalent, moderate depth of field, vertical 9:16 framing, bowl positioned in the upper two thirds [LIGHT] key light from behind and slightly above the bowl at 3000K, weak fill from the front left, specular highlights on the broth surface, background two stops darker than the subject [TEXTURE] glossy broth with visible oil droplets, matte stoneware bowl, fine grain on the walnut surface [STYLE] photorealistic food photography, muted warm grade, no text, no logo","note":"丼・麺類の既定値。65度という数値を明示しているのは「俯瞰」だけでは真上と斜めのどちらに振れるか不定になるため。bowl positioned in the upper two thirds で下部1/3を字幕用に空けている。背景を2段暗くする指定が輪郭を立てる。料理名と具材だけを店の実メニューに差し替えて使う。","status":"未検証","flow":{"code":"T2I","step":"単発","input":"新規。料理名と具材だけを店の実在メニューに置き換える。架空の料理や未提供の料理は書かない","output":"9:16の静止画1枚。下部1/3が字幕用に空き、構図・光・器がここで確定する","next":"採用1枚を w2d2 の『湯気のみ（最も安定する既定カット）』に渡して動かす"}},{"label":"層のあるもの（水平アングル）","text":"[SUBJECT] a tall double cheeseburger with visible layers of brioche bun, melted cheddar, charred patty, pickles and lettuce, held together by a wooden pick [ACTION] a single slow drip of melted cheese on the near side, everything else static [ENVIRONMENT] on a matte black slate board, blurred dark brick wall behind, one amber pendant lamp out of focus in the upper left [CAMERA] close-up at eye level with the board, zero degrees of tilt, 85mm equivalent, shallow depth of field, vertical 9:16 framing [LIGHT] hard side light from the right at 3200K creating defined shadows on the layers, thin rim light from behind separating the bun from the wall, no frontal fill [TEXTURE] crisp sesame crust, glossy melted cheese, charred and slightly wet patty surface, matte slate [STYLE] photorealistic, high contrast warm grade, no text, no logo","note":"zero degrees of tilt を明示するのは、カメラがわずかでも見下ろすと層が潰れるため。層のあるものは柔らかい光より硬い側光のほうが段が読めるので、意図的に hard side light を指定し frontal fill を排除している。","status":"未検証","flow":{"code":"T2I","step":"単発","input":"新規。層が見える被写体のときだけ使う。傾き0度と硬い側光は崩さず、具材名だけ差し替える","output":"9:16の静止画1枚。硬い側光で層の段が読め、チーズの照りが残る","next":"この1枚を w2d2 の『遅い落下』に渡し、チーズが垂れる短尺カットに仕上げる"}},{"label":"文脈つき Lifestyle カット（店の固有性を乗せる）","text":"[SUBJECT] a plated charcoal-grilled chicken skewer dish on a hand-thrown kohiki ceramic plate, three skewers with charred edges and a light tare glaze [ACTION] nothing moving, a thin wisp of steam at the edge of frame [ENVIRONMENT] on a raw oak counter beside a narrow window, a rain-wet back alley and a weathered tiled wall visible outside, blurred interior of a small eight-seat restaurant behind [CAMERA] medium shot from a 45 degree angle, 50mm equivalent, moderate depth of field, vertical 9:16 framing, clear negative space in the lower third [LIGHT] overcast daylight falling from a thin strip of sky between buildings at 6000K as the main source, the glass facade across the alley acting as a large natural reflector, one warm 2700K practical lamp far in the background, soft shadows [TEXTURE] glossy tare glaze, matte kohiki surface with visible throwing marks, raw oak grain, condensation on the window edge [STYLE] photorealistic editorial food photography, restrained contrast, neutral to slightly cool grade, no text, no logo","note":"東京の路地裏の店に実在する光条件（狭い空から落ちる拡散光と、向かいのビルのガラス面が巨大なレフ板になる現象）を背景と光に同時に書き込んでいる。clear negative space in the lower third が字幕用地の指定。no text, no logo はすべての料理プロンプトに入れる固定句で、文字生成の破綻を構図段階で避けるための予防策。","status":"未検証","flow":{"code":"T2I","step":"単発","input":"新規。窓外の路地の描写と料理名を、案件の立地と実在メニューに置き換える。人は画角に入れない","output":"9:16の静止画1枚。店の文脈と立地の固有性が乗り、下部1/3が字幕用に空く","next":"Studio版と並べて主軸を判定し、採用側を w2d5 の文脈カットの参考構図として持ち越す"}}],"expected":"静止画15〜20枚程度と、そのうち採用1枚・次善1枚が規則どおりに保存された状態です。加えて、料理類型とアングルの対応判断、器3通りの比較結果、字幕帯を重ねた可読性検証、静止画工程の原価（動画換算つき）が記録されています。絵の完成度は翌日以降に動かすことを前提にした「動かしやすい絵」であれば十分で、仕上がりの美しさ自体は今日の評価対象ではありません。","assignment":{"title":"飲食店1皿の構図確定と静止画ショートリスト","brief":"東京の飲食店1店を設定し、その店の実在メニュー1皿について、15秒広告の主役カットになる静止画を確定させます。料理類型からアングルを決め、器と背景を3通り比較し、字幕余白を含む構図で仕上げます。動画化は行いません。静止画段階で意思決定を終わらせる工程設計そのものが課題です。","deliverables":["店の設定メモ（業態・客単価・主要客層・営業時間・立地）と被写体の実在確認記録","料理類型とアングル判定の記録（第一候補・第二候補・理由）","アングル比較2枚＋3観点の比較表","器・接地面の比較3枚と採用理由","字幕帯を重ねた可読性検証画像","採用1枚・次善1枚（7スロットプロンプト紐づけ）","静止画工程の消費クレジットと15秒動画換算本数"],"constraints":["動画生成は本日行わない","比較生成では指定した1層以外を一切変更しない","被写体はその店が実際に提供している料理に限定する","作業時間は90分以内"]},"success":["料理類型からアングルを決めた理由が、好みではなく料理の構造として書かれている","器3通りの比較で、料理と光の指定が完全に同一である","下部1/3に字幕を置ける面があり、実際にコピーを重ねて読めることを確認している","採用静止画のプロンプトが7スロットすべて埋まっており、抽象的な形容詞が残っていない","静止画工程の原価が15秒動画の本数換算で言える"],"rubric":[{"axis":"映像の品質","pass":"3点＝料理が判別でき具材の破綻がない。5点＝器の素材感と接地面の質感が描き分けられ、料理の照りが物理的に説得力を持っている。"},{"axis":"動きの自然さ","pass":"3点＝静止画中心のため、動かしやすい構図（被写体が端で切れていない、背景が単純）になっている。5点＝どこを動かすかを想定した余地が構図に残されている。"},{"axis":"ブランド整合性","pass":"3点＝器と背景が店の客単価・内装と矛盾しない。5点＝器と接地面の選択が、店の価格帯と客層から逆算して説明できる。"},{"axis":"マーケ目的整合性","pass":"3点＝字幕余白が確保されている。5点＝明度のピークと字幕余白が分離され、視線誘導の設計を言語化できている。"},{"axis":"再現性","pass":"3点＝採用プロンプトが保存されている。5点＝同じテンプレートで別メニューの静止画を1枚出せることを確認済み。"},{"axis":"時間とコスト","pass":"3点＝静止画枚数とクレジットが記録されている。5点＝静止画工程の原価を15秒動画換算で示し、工程配分の方針を書いている。"}],"pitfalls":[{"problem":"真俯瞰で撮って湯気と立体感が消える","cause":"「丼は俯瞰」というセオリーを真上と解釈している","fix":"斜め60〜70度を既定値にする。真俯瞰は盛り付けの平面構成そのものが主訴求のときだけに限定し、その場合は湯気表現を諦めて別カットで補う。"},{"problem":"絵が完成しすぎて字幕を置く場所がない","cause":"静止画としての完成度を基準に選んでいる","fix":"選定の時点で9:16のガイド帯（上12%・下20%）を重ねて見る。画像単体での美しさではなく、帯を乗せた状態での成立を基準にする。"},{"problem":"器や背景を変えるたびに料理も変わってしまい比較にならない","cause":"差し替え時にプロンプト全体を書き直している","fix":"7スロットのうち第2層・第3層に当たる語だけを別セルで管理し、他スロットはコピーで固定する。比較用プロンプトは生成前に3本まとめて書き切る。"},{"problem":"店が出していない料理や設備が映った絵を採用してしまう","cause":"見栄えの良い生成結果を優先し、実在性の確認を飛ばしている","fix":"採用判定の前に「この皿・この器・この内装は実在するか」を1項目チェックする運用にする。実在しないものを広告の主役にすると、来店時の体験と乖離して顧客の信用を損なう。細かい表示上の論点は Week 3 で扱うが、制作判断としては今日から外さない。"},{"problem":"静止画が安いので延々と生成を続けて時間が溶ける","cause":"単価が低いためコスト意識のブレーキが効かない","fix":"コストではなく**枚数と時間**で上限を切る。アングル2枚・器3枚・余白1枚＋予備で合計20枚、35分を上限にする。安い層で詰めるのは試行回数のためであり、無制限に迷うためではない。"}],"resourceIds":["hf-help-marketing-studio","hf-blog-marketing-studio","ind-food-commercial"],"nextHint":"明日は確定した静止画を動かします。湯気・液体・溶ける・伸びるといった食品特有の質感表現が、どのモデルでどこまで安定するかを比較します。","setup":{"tag":"静止画のみ","model":"手持ちのツールで可（ChatGPT / Gemini / Soul 2.0）。Higgsfield で作るなら素のモデルを使う（Marketing Studio の Product Shots は12倍かかる）","seconds":"—","res":"2K","aspect":"9:16 と 1:1","outputs":"1","cap":"静止画16枚","credits":"約 2.0 cr（$0.10）","unlimited":"0 cr","save":"料理の構図は静止画で完全に決める。16枚試しても2クレジット。テンプレート経由ではなく素のモデルを使うことが、この週で最も効く節約。"}},{"id":"w2d2","day":2,"title":"湯気・液体・溶けるの物理表現","subtitle":"食品特有の動きをモデル別に検証し、安定して出せる表現の範囲を確定する","why":"飲食の広告映像で視聴者の手を止めるのは、料理の形ではなく動きです。湯気が立つ、スープに波紋が走る、チーズが伸びる、氷が溶ける。これらは静止画では絶対に出せない価値であり、動画生成にコストを払う唯一の理由です。しかし食品の動きは流体と重力の表現であり、現在の動画生成モデルが最も破綻しやすい領域でもあります。安定して出せる表現と、何回回しても出ない表現を区別できていない制作者は、出ない表現に時間とクレジットを溶かし続けます。今日は自分の環境で「出る動き」の範囲を確定させ、見積可能な武器にします。","goals":["湯気・液体・反射・溶ける／伸びる・スローモーションの5表現について、安定条件と破綻条件を区別できる","表現と使用モデルの対応を自分の環境で検証し、既定の組み合わせを決定できる","スローモーションを言語で指定し、過剰指定による破綻を避けられる","1カットに動きを1つだけ置く設計で、同一静止画から複数カットを作り分けられる","動画生成の採用率を表現別に記録し、翌日以降の見積に使える数字を持つ"],"duration":"85分","timeBreakdown":[{"label":"表現別の物理と安定条件","min":20},{"label":"モデル別の比較生成","min":45},{"label":"採用率記録と既定値の決定","min":20}],"tools":["Higgsfield（image-to-video、モデル選択ができる画面）","Higgsfield（Marketing Studio の Motion 系カテゴリに相当する機能／Hypermotion・2D Product Motion）","Higgsfield DoP（image-to-video 専用のカメラ動作プリセット、3秒または5秒）","制作台帳スプレッドシート"],"prereq":["w2d1 の採用静止画1枚・次善1枚が保存されていること","Week 1 でカメラ移動の安定性ランキングを作成していること","動画生成1本あたりの消費クレジットを自分のプランで把握していること"],"theory":[{"heading":"食品の動きは5種類しかない","body":"料理の広告で使う動きは、実質的に次の5つに収束します。それぞれ物理的な難易度が違います。\n\n- **湯気（蒸気）**　温度差による上昇気流。最も安定して出やすい。輪郭が曖昧なため、形状が崩れても視聴者が破綻と認識しにくいという生成上の利点があります。背後からの光で透過させると強度が上がります。\n- **液体の表面変化**　波紋、揺れ、注ぐ。難易度は中。表面の微小な揺れは安定しますが、**注ぐ・流れる**は液体の体積保存が破綻しやすく、量が増える・途中で消える・逆流するといった失敗が起きます。\n- **反射とハイライトの移動**　光源またはカメラの移動で生じる鏡面反射の動き。難易度は低〜中。被写体を動かさずカメラだけ動かすため、形状破綻のリスクが小さく、質感の説得力を最も安く稼げます。\n- **溶ける／伸びる**　チーズ、バター、アイス、餅。難易度は高。粘性のある物体の連続変形であり、形状の同一性が保てずに別物に化ける失敗が頻発します。\n- **人の所作（箸で持ち上げる、手でちぎる）**　難易度は最高。手指と箸は現在の生成モデル共通の弱点で、指が増減し、箸が1本になり、麺が途中で生成されます。詳細は明日扱います。\n\n実務の判断基準は明快です。**湯気と反射で尺の大半を作り、液体と溶けるは短く差し込み、人の所作は本当に必要なときだけ挑む**。この優先順位を守るだけで採用率が大きく変わります。"},{"heading":"表現とモデルの対応（執筆時点・要検証）","body":"執筆時点（2026-10-11）の公開情報から読み取れる、モデルごとの得意領域です。UIと提供モデルは変わるため、必ず自分の環境で確認してください。\n\n- **Wan 2.6**　**流体・重力の物理表現を伴う商品カット**が得意領域として挙げられています。注ぐ・垂れる・溶けるといった、まさに食品の難所に第一候補として当てる価値があります。尺は15秒、ネイティブ同期音声あり。first/last フレームの精密な制御が可能とされています。\n- **Seedance 2.5**　リアルな動きと人物の表情が得意。尺は**4〜30秒**、解像度は**1080pまで**（4Kは 2.0 系のみ、という記述がヘルプセンター側にあり、そちらを正とします）。**ネイティブ音声と多言語リップシンクに対応し、音声をONにしてもクレジットは増えません**。長めの尺を1回で通したいとき、人物の所作を含むときの本命です。\n- **Kling 3.0**　1回の生成で**最大6カット**、物理的リアリティと商品広告が得意領域に挙げられています。尺15秒。15秒広告のカット割りを1回の生成で試すという使い方が検討できます。\n- **Veo 3.1**　尺が**4 / 6 / 8秒**に固定で、720p / 1080p @24fps。複雑なシーンとキャラクター一貫性に強いとされます。短い差し込みカットに向きます。\n- **Higgsfield DoP**　**image-to-video 専用**（text-to-video は不可）で、尺は**3秒または5秒**。カメラ動作がプリセット化されており、反射とハイライトの移動を安定して得るのに適します。\n- **Higgsfield Motion**　Product Motion 用として挙げられているモデルです。\n\n**食品専用のモードや機能は存在しません**。「food mode」のような設定を探しても見つからないので、上記の汎用モデルを表現別に使い分ける以外の方法はありません。"},{"heading":"スローモーションの指定と破綻条件","body":"スローモーションは食品映像で最も効く演出のひとつです。チーズが落ちる、スープに具材が沈む、氷が割れる。等速では一瞬で終わる物理現象を、見せ場に変えられます。\n\n指定の実務は3層です。\n\n- **言語指定**　`in slow motion`、`at quarter speed`、`time stretched` といった語をプロンプトの動作スロットに書く。最も簡単ですが、効き方はモデル依存で不定です。\n- **動き自体を遅く設計する**　`a single drop falls slowly`、`steam drifts upward at a very slow pace` のように、スローモーションという語を使わずに**遅い動き**として記述する。こちらのほうが安定する傾向があります。\n- **編集側で落とす**　等速で生成した素材を編集ソフトで50%等に落とす。フレーム補間が入ると質が落ちますが、確実に制御できます。\n\n破綻しやすい条件は3つです。**(1) スローモーションと大きなカメラ移動の併用**　被写体の遅い動きとカメラの速い動きが衝突し、被写体が引き伸ばされます。**(2) 複数の動きの同時スロー化**　湯気と液体と溶けるを同時にスローにすると、どれかが止まり、どれかが加速します。**(3) 短すぎる尺**　3秒のクリップを極端なスローにすると、動きがほぼ静止画になり、動画化したコストが無駄になります。\n\n実務の既定値は「**カメラは微速または固定＋被写体の遅い動き1つ＋尺は5秒以上**」です。この型から外れるときは、破綻率が上がる前提で試行回数を見積に積んでください。"},{"heading":"1カット1動きの原則とカットの作り分け","body":"Week 1 で学んだ「1カットにカメラ移動は1つ」は、食品の動きにもそのまま適用されます。**1カットに被写体の動きは1つ**です。\n\n理由はコストに出ます。湯気＋液体＋溶けるを1カットに詰め込んだ場合、どれか1つが破綻すればカット全体が不採用になります。3要素それぞれの成功率が仮に70%なら、全部成立する確率は約34%です。1要素だけなら70%。**同じ素材から3カット作って編集でつなぐほうが、採用率が倍以上になる**という単純な算術です。\n\nしたがって、w2d1 で作った1枚の静止画から、動きを変えた複数カットを作り分けます。\n\n- カットA：湯気のみ＋カメラ固定\n- カットB：反射の移動のみ＋微速プッシュイン\n- カットC：液面の揺れのみ＋わずかなティルト\n\n同一静止画が起点なので、**色・器・背景・光が完全に一致したカット群**が手に入ります。これは編集でつないだときの統一感に直結し、Week 1 で苦労した「カット間で色が変わる」問題を構造的に回避できます。\n\n15秒広告は3〜5カットで構成します。つまり**静止画2〜3枚から、動きを変えたカットを9本前後作れば足りる**。この設計を押さえておくと、明日以降の制作が計画的に進みます。"}],"steps":[{"n":1,"action":"検証する5表現を自分の被写体に割り当てる","detail":"湯気・液体の表面変化・反射の移動・溶ける／伸びる・遅い落下のうち、自分の被写体で物理的に成立するものを選びます。味噌ラーメンなら湯気・液面の揺れ・反射・（具材の沈み）。バーガーならチーズの伸び・反射・（ソースの垂れ）。成立しない表現は無理に試さず、記録に「対象外」と書きます。","check":"検証する表現が3つ以上選ばれ、成立しない表現は理由つきで除外されている"},{"n":2,"action":"湯気のみのカットを生成する","detail":"w2d1 の採用静止画を起点に、動作スロットを湯気だけに限定した動画を1本生成します。カメラは固定または微速プッシュイン。尺は5秒前後。最も安定するはずの表現を最初に通すことで、環境そのものが正常に動いているかの基準にします。","check":"湯気が上昇方向に動き、料理の形状が崩れていない1本が得られている"},{"n":3,"action":"反射の移動のみのカットを生成する","detail":"被写体の動きを指定せず、カメラの微速移動だけで鏡面反射が動くカットを作ります。DoP に相当するプリセット機能があれば、プロンプト記述とプリセットの両方で試し、安定性を比較します。DoP は image-to-video 専用・尺3秒または5秒という制約があるので、尺の扱いをメモしてください。","check":"反射またはハイライトが移動し、被写体が変形していない1本が得られている"},{"n":4,"action":"液体の表面変化を2通り試す","detail":"難易度の低い「表面のわずかな揺れ」と、難易度の高い「注ぐ／垂れる」を各1本生成します。後者では体積の破綻（量が増える、途中で消える、逆流する）を重点的に確認します。流体表現が得意とされるモデル（執筆時点では Wan 2.6）が選べる環境なら、そちらを優先的に当ててください。","check":"2本が生成され、揺れと注ぐで破綻の種類と頻度の差が記録されている"},{"n":5,"action":"溶ける／伸びるを2モデルで比較する","detail":"被写体で成立する場合、同一静止画・同一プロンプトで2つのモデルから各1本生成します。評価は「変形の連続性」です。途中で別の物体に化けていないか、粘性が物理的に妥当か。成立しない被写体の場合はこの手順を飛ばし、代わりに手順4の「注ぐ」を2モデルで比較
