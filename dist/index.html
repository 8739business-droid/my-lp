します。","check":"同条件で2モデルの出力が並び、変形の連続性の差が言語化されている"},{"n":6,"action":"スローモーションを3通りの指定方法で試す","detail":"同一静止画から、(a) `in slow motion` という語を使う (b) 語を使わず `falls slowly` のように遅い動きとして書く (c) 等速で生成して編集側で50%に落とす、の3通りを作ります。どれが自分の環境で最も安定するかを決め、既定値にします。","check":"3通りの結果が並び、既定とする指定方法が決まっている"},{"n":7,"action":"破綻条件を意図的に作って確認する","detail":"あえて破綻させる生成を1〜2本行います。例：スローモーション＋速いオービット、または湯気＋液体＋溶けるの同時指定。何が起きるかを自分の目で見ておくことが目的です。この1本が、顧客案件で同じ条件を避ける判断を支えます。","check":"破綻の実例が1本以上手元にあり、何が衝突したかを説明できる"},{"n":8,"action":"同一静止画から3カットを作り分ける","detail":"採用静止画1枚を起点に、動きだけを変えた3カット（湯気／反射／液面）を揃えます。色・器・背景・光が一致していることを並べて確認します。これが15秒広告の主役カット群になります。","check":"3カットが揃い、並べたときに色調と器の質感が一致している"},{"n":9,"action":"表現別の採用率を集計する","detail":"本日の生成すべてについて、表現（湯気／反射／液体揺れ／注ぐ／溶ける／スロー）ごとに生成回数と採用数を集計し、表現別の採用率を出します。採用率が30%を下回った表現は「見積に試行3回以上を積む表現」として印をつけます。","check":"表現別の採用率が数値で出ており、低採用率の表現に印がついている"},{"n":10,"action":"既定の表現・モデル組み合わせを文書化する","detail":"「湯気は○○モデル、反射は DoP に相当するプリセット、流体は△△モデル」という既定の組み合わせを1〜3行で文書化します。根拠として本日の採用率を添えます。UIやモデル提供は変わるため、確認日を必ず書いてください。","check":"既定の組み合わせが確認日つきで文書化され、採用率が根拠として添えられている"}],"prompts":[{"label":"湯気のみ（最も安定する既定カット）","text":"[SUBJECT] the same bowl of ramen as in the source image, unchanged [ACTION] steam rising steadily from the broth surface, drifting slightly to the upper right, the broth itself and all ingredients remain completely still [ENVIRONMENT] unchanged from the source image [CAMERA] static shot, no camera movement, no zoom [LIGHT] unchanged, backlight continues to illuminate the steam from behind [TEXTURE] steam is translucent and softly lit, broth surface stays glossy and undisturbed [STYLE] photorealistic, no cuts, no scene change","note":"unchanged を繰り返すのは、動画段階で静止画の決定事項が書き換わるのを防ぐため。remain completely still を明記して動きを湯気1つに限定している。no cuts, no scene change は途中でのカット挿入を抑える固定句で、全動画プロンプトに入れる。","status":"未検証","flow":{"code":"I2V","step":"単発","input":"w2d1 で採用した静止画1枚。新しく画像は作らない。unchanged の語は消さずに残して送る","output":"動画1本。湯気だけが上昇し、具材とスープ面は静止したまま保たれる","next":"ここで完結。採用率が最も高い既定カットとして、15秒広告の主役カットに充てる","where":"生成画面でモデルを選ぶ（image-to-video）","whereNote":"最も安く、Seedance 2.0 系・Kling 3.0・Wan 2.7 なら Unlimited 対象"}},{"label":"反射の移動（被写体を動かさず質感を稼ぐ）","text":"[SUBJECT] the same plated dish as in the source image, unchanged, no deformation [ACTION] no movement of the subject at all, only the specular highlight on the glazed surface shifts as the camera moves [ENVIRONMENT] unchanged from the source image, background remains consistent throughout [CAMERA] very slow dolly in, constant speed, approximately ten percent of frame width over five seconds, no shake, no rotation [LIGHT] unchanged, highlight travels across the sauce surface from left to right as the viewpoint changes [TEXTURE] glossy sauce catches a moving specular reflection, matte ceramic stays matte [STYLE] photorealistic, no cuts, no scene change","note":"被写体を一切動かさない代わりにカメラの微速移動だけで反射を動かす構成。移動量を frame width の10%という具体値で縛るのが破綻防止の要点。「slow」だけでは速度が不定になる。","status":"未検証","flow":{"code":"I2V","step":"単発","input":"照りのある静止画1枚。新規生成はしない。湯気が立たない料理のときの代替手段になる","output":"動画1本。被写体は一切動かず、ハイライトだけが面を移動して質感が出る","next":"ここで完結。移動量を10%で縛った結果の採用率を記録し、既定値として台帳に残す","where":"生成画面でモデルを選ぶ（image-to-video）","whereNote":"最も安く、Seedance 2.0 系・Kling 3.0・Wan 2.7 なら Unlimited 対象"}},{"label":"流体（注ぐ・垂れる／流体表現に強いモデル向け）","text":"[SUBJECT] the same dish as in the source image, with a small ceramic pitcher entering frame from the upper right [ACTION] a thin continuous stream of warm sauce pours from the pitcher onto the dish for the full duration, the stream maintains constant thickness and never reverses or disappears, the sauce pools gradually at the base [ENVIRONMENT] unchanged from the source image [CAMERA] static shot, no camera movement [LIGHT] unchanged, backlight makes the pouring stream translucent at its edges [TEXTURE] viscous glossy sauce, continuous surface tension on the stream, slight ripple where it lands [STYLE] photorealistic, no cuts, no scene change","note":"注ぐ表現の破綻（逆流・消失・太さの変動）を、maintains constant thickness / never reverses or disappears と肯定形で先に塞いでいる。pools gradually at the base は体積保存を示唆する記述。執筆時点で流体・重力の物理表現を得意とされるモデル（Wan 2.6 など）に当てるのが第一候補。","status":"未検証","flow":{"code":"I2V","step":"単発","input":"静止画1枚と、流体表現に強いモデル（Wan 2.6 など）の選択。画像の新規生成はしない","output":"動画1本。ソースが一定の太さで注がれ根元に溜まる。破綻率は高めに出る","next":"ここで完結。逆流・消失の発生率を数え、採用率が低ければ既定の表現から外す","where":"生成画面でモデルを選ぶ（image-to-video）","whereNote":"最も安く、Seedance 2.0 系・Kling 3.0・Wan 2.7 なら Unlimited 対象"}},{"label":"遅い落下（スローモーションを語に頼らず作る）","text":"[SUBJECT] the same burger as in the source image, with one strand of melted cheese on the near side [ACTION] a single drop of melted cheese detaches and falls very slowly toward the board, taking the entire duration of the clip to travel a short distance, nothing else in frame moves [ENVIRONMENT] unchanged from the source image [CAMERA] static shot, no camera movement, no zoom [LIGHT] unchanged, hard side light continues to define the layers [TEXTURE] cheese remains viscous and glossy throughout the fall, surface tension visible at the drop [STYLE] photorealistic, no cuts, no scene change","note":"in slow motion という語を使わず「短い距離をクリップ全体の時間をかけて落ちる」と記述する方式。語に依存しないため、モデルを変えても効き方が安定しやすい。カメラを固定しているのは、スローと大きなカメラ移動の併用が破綻の主要因だから。","status":"未検証","flow":{"code":"I2V","step":"単発","input":"w2d1『層のあるもの』の静止画1枚。slow motion の語は足さない。カメラは固定のまま渡す","output":"動画1本。1滴がクリップ全体をかけて短い距離を落ちる、語に頼らない遅さ","next":"ここで完結。モデルを変えても効き方が安定するか確認し、既定の指定方法を決める","where":"生成画面でモデルを選ぶ（image-to-video）","whereNote":"最も安く、Seedance 2.0 系・Kling 3.0・Wan 2.7 なら Unlimited 対象"}}],"expected":"動画10〜14本程度と、表現別採用率の集計表、既定の表現・モデル組み合わせの文書が手元にある状態です。多くの場合、湯気と反射の採用率が高く、注ぐ・溶ける・人の所作が低く出ます。重要なのは順位そのものではなく、自分の環境での数値を持っていることです。加えて、同一静止画から作り分けた3カットが色調と器の質感まで一致していることを目で確認できていれば到達です。","assignment":{"title":"食品の動き5表現の安定条件の特定とカット群の作成","brief":"w2d1 の採用静止画を起点に、食品特有の動き表現をモデル別・指定方法別に検証します。目的は美しい1本を作ることではなく、自分の環境で「安定して出せる表現の範囲」を確定させることです。最終的に、同一静止画から動きだけを変えた3カットを揃え、翌日以降の15秒広告の主役カット群として引き渡します。","deliverables":["表現別の検証動画（湯気・反射・液体揺れ・注ぐ／溶ける・スローの各1本以上）","溶けるまたは注ぐの2モデル比較結果","スローモーション3通りの指定方法の比較と既定値","意図的に破綻させた実例1本と、衝突要因の説明","同一静止画から作り分けた3カット","表現別採用率の集計表（低採用率表現への印つき）","既定の表現・モデル組み合わせの文書（確認日つき）"],"constraints":["1カットに被写体の動きは1つだけ指定する","モデル比較では静止画・プロンプト・尺を完全に同一にする","本日の動画生成本数の上限を着手前に決め、台帳に予算行を作る","作業時間は90分以内"]},"success":["検証した各表現について、生成回数と採用数が台帳に記録されている","モデル比較において、変えた変数がモデルのみであることがプロンプト記録から確認できる","スローモーションの既定の指定方法が決まり、その根拠が結果として残っている","同一静止画から作り分けた3カットが、並べたときに色調・器・背景で一致している","採用率30%未満の表現が特定され、見積に試行回数を積む対象として印がついている"],"rubric":[{"axis":"映像の品質","pass":"3点＝被写体の形状が維持され、質感が静止画から劣化していない。5点＝湯気の透過や反射の移動が物理的に説得力を持ち、静止画より明確に価値が増している。"},{"axis":"動きの自然さ","pass":"3点＝指定した動きが発生し、指定していない動きが混入していない。5点＝速度が一定で、液体の体積が保存され、変形の連続性が途切れていない。"},{"axis":"ブランド整合性","pass":"3点＝動画化後も静止画の色調が維持されている。5点＝作り分けた3カットが編集でつないでも色が飛ばないレベルで揃っている。"},{"axis":"マーケ目的整合性","pass":"3点＝選んだ動きが料理の訴求点と一致している。5点＝どの動きを15秒のどの位置に置くかまで想定できている。"},{"axis":"再現性","pass":"3点＝表現別のプロンプトが保存されている。5点＝既定の表現・モデル組み合わせが文書化され、他人が同じ結果を再現できる。"},{"axis":"時間とコスト","pass":"3点＝生成本数とクレジットが予算内に収まっている。5点＝表現別採用率から、表現ごとの実質単価（単価÷採用率）を算出できている。"}],"pitfalls":[{"problem":"湯気・液体・溶けるを1カットに詰め込んで毎回不採用になる","cause":"実写の撮影感覚で、1カットに見せ場を複数置こうとしている","fix":"1カット1動きに分割し、編集でつなぐ。各要素の成功率が70%でも3要素同時なら約34%に落ちるという算術を、着手前に台帳の横に書いておく。"},{"problem":"注ぐ・流れる表現で液体の量が増減し、何度回しても直らない","cause":"体積保存はモデル側の物理理解に依存しており、プロンプトの言い換えでは解決しない場合がある","fix":"まず流体表現を得意とするモデルに切り替える。それでも出ないなら、流れる瞬間を画角から外す構図（着地点だけを見せる、器の縁で切る）に変更するか、注ぐカット自体を企画から落とす。3回試して出ない表現は構図で回避する。"},{"problem":"スローモーションを指定したら被写体が引き伸ばされた","cause":"スロー指定と大きなカメラ移動を併用している","fix":"スローのカットはカメラを固定または微速に限定する。カメラの見せ場とスローの見せ場は別カットに分ける。"},{"problem":"3秒のクリップを強いスローにして、ほぼ静止画になった","cause":"尺の制約を確認せずにスローを掛けている","fix":"モデルごとの尺制約を先に確認する。DoP に相当する機能は3秒または5秒、Veo 3.1 は4/6/8秒など固定値がある。スローを使うカットは5秒以上を確保できるモデルで作る。"},{"problem":"モデルを変えながらプロンプトも直してしまい、どちらが効いたか分からない","cause":"良い結果を出したい意識が比較の設計を壊している","fix":"比較用のプロンプトを生成前に確定し、テキストファイルに保存してから生成に入る。生成中に本文を編集しない。"},{"problem":"音声つきモデルで生成したが、編集時に使えなかった","cause":"生成された環境音・BGMが、広告の尺や編集方針と合わない","fix":"Seedance 2.5 は音声ONでもクレジットが増えないため、生成時はONで取得しておき、採否は編集段階で決める。音の設計そのものは w2d5 で扱う。"}],"resourceIds":["hf-help-seedance","hf-help-dop","ind-food-commercial"],"nextHint":"明日は、今日見た破綻を体系的に潰します。検出チェックリストを作り、「再生成・構図回避・部分編集・編集で切る」の4択をどう選ぶかの判断表を作ります。","setup":{"tag":"物理表現の検証","model":"静止画 手持ちのツールで可（ChatGPT / Gemini / Soul 2.0） ／ 流体・湯気は Wan 2.7、それ以外は Seedance 2.0","seconds":"5秒（Wan）/ 4秒（Seedance）","res":"720p","aspect":"9:16","outputs":"1","cap":"静止画6枚・動画7本（Wan 4本・Seedance 3本）","credits":"約 87 cr（$4.34）","unlimited":"0 cr","save":"Wan 2.7 は流体と重力の表現に強く、5秒720pで8クレジットと最安。液体と湯気の検証はここに寄せる。1つの表現に3回までと決め、超えたら構図を変えて逃げる。"}},{"id":"w2d3","day":3,"title":"AI特有の破綻の検出と4択の対処","subtitle":"10項目のチェックリストで破綻を見つけ、再生成・回避・部分編集・カットの切り落としを判断する","why":"AI動画で顧客の信用を失う経路は決まっています。制作者本人が気づかなかった破綻が、納品後に顧客や来店客に見つかることです。指が6本ある、箸が途中で1本になる、看板の文字が別言語になっている。こうした破綻は制作者の目には「全体の雰囲気」に埋もれて見えず、第三者には一瞬で見えます。だから感覚で見るのをやめ、チェックリストで機械的に潰す工程を工程表に組み込む必要があります。さらに重要なのは、見つけた破綻すべてを再生成で直そうとしないことです。再生成は最も高いコストの選択肢であり、構図変更や編集で尺を切るほうが安く確実な場面が多い。今日は検出と判断の両方を仕組みにします。","goals":["最低10項目の破綻検出チェックリストを自分の案件向けに作成し、運用できる","破綻の種類ごとに「再生成／構図で回避／部分編集／編集で切る」の4択を選ぶ判断表を作れる","ロゴ・文字を生成させず編集工程で合成する前提で、構図とカット設計を組める","同一カットの検出作業を再現可能な手順（倍速・コマ送り・第三者確認）として固定できる","破綻対処にかかったクレジットと時間を記録し、対処方法別のコストを比較できる"],"duration":"85分","timeBreakdown":[{"label":"破綻の分類とチェックリスト作成","min":25},{"label":"検出作業と対処の実践","min":40},{"label":"判断表の作成とコスト記録","min":20}],"tools":["Higgsfield（image-to-video、再生成）","Higgsfield（Seedance 2.5 Edit / Cinema Studio 4.0 の Edit Video に相当する部分編集機能）","動画プレーヤー（コマ送り・倍速再生ができるもの）","編集ソフト（CapCut、DaVinci Resolve など。尺の切り落としとロゴ合成用）","制作台帳スプレッドシート"],"prereq":["w2d2 で作成した動画群（採用・不採用とも）が手元にあること","意図的に破綻させた実例1本が残っていること","店のロゴ画像（またはそれに相当するテキストロゴ）が画像ファイルとして用意できること"],"theory":[{"heading":"破綻は5系統に分類できる","body":"現在の動画生成モデルに共通して現れる破綻は、おおむね次の5系統です。系統ごとに対処の定石が違うため、まず分類してから手を打ちます。\n\n- **形状変化（モーフィング）**　同一のはずの物体が、クリップの進行中に別の形へ連続的に変形する。具材の数が変わる、器の縁の形が変わる、背景の小物が別の物に化ける。原因は被写体の同一性をフレーム間で保持しきれないことで、**動きが大きいほど、尺が長いほど発生率が上がります**。\n- **人体・手指・道具の破綻**　指の本数、関節の方向、箸やフォークの本数と接触点。食品広告は手が映る頻度が高いため、最も遭遇しやすい系統です。\n- **文字・ロゴの崩壊**　看板、メニュー、パッケージ、Tシャツのプリント。実在のロゴが別のロゴに化けるのは、見栄えの問題ではなく権利と表示の問題になります。\n- **物理法則の破れ**　麺が増える、液体が逆流する、湯気が下に降りる、影の方向が光源と合わない、箸が料理を貫通する。視聴者が「何か変だ」と感じるが言語化できない違和感の多くはここです。\n- **カット間の不整合**　編集でつないだとき、カットAとカットBで器の色・具材の量・光の方向・背景の小物が違う。単カットでは破綻がないので、**編集段階まで発見が遅れる**のが厄介な点です。\n\n実務では、1〜4は単カット検査で、5はつないだ後の検査で見つけます。**検査を2段階に分ける**ことが検出率を大きく左右します。"},{"heading":"検出チェックリスト（10項目・最低限の雛形）","body":"次の10項目を、全カットに対して機械的に通します。自分の案件に合わせて項目を追加してください。**感覚で「大丈夫そう」と判断するのを禁止するためのリスト**です。\n\n1. **具材・物体の個数**　開始フレームと終了フレームで、具材・器・小物の個数が一致しているか。\n2. **器と皿の輪郭**　縁の形、楕円の歪み、途中での変形がないか。\n3. **手指と道具**　指の本数、関節の方向、箸・カトラリーの本数と持ち方が終始一貫しているか。\n4. **文字とロゴ**　画面内の全文字を一つずつ読む。読めない文字、崩れた文字、実在しないロゴがないか。\n5. **液体の体積**　増えていないか、減りすぎていないか、逆流していないか。\n6. **影と光源の整合**　影の方向が光源の位置と一致しているか。途中で影の方向が変わっていないか。\n7. **湯気・蒸気の方向**　上昇しているか。横に流れる場合、その風を説明する要素があるか。\n8. **背景の恒常性**　背景の小物、窓外の景色、壁の模様が途中で変化していないか。\n9. **カメラの等速性**　速度が一定か、途中で急加速・逆進・意図しないカット切り替えがないか。\n10. **周縁部の処理**　フレームの端で被写体が不自然に切れていないか、端に生成ノイズや溶けがないか。\n11. **（つないだ後）カット間の色と器の一致**　隣接カットで器の色・具材量・光の方向が揃っているか。\n12. **（つないだ後）時間軸の整合**　湯気の量、液体の減り、溶け具合がカット順で矛盾していないか。\n\n検出の手順も固定します。**(a) 等速で1回通して全体印象を見る → (b) 0.25倍速で1回通す → (c) 開始・中間・終了の3フレームを静止で見比べる → (d) 文字がある場合は拡大して読む**。この4ステップで1カット2〜3分です。15秒広告が5カットなら検査に15分。これを工程表に必ず計上してください。"},{"heading":"破綻を直す4つの選択肢","body":"破綻を見つけたときの選択肢は4つです。コストと確実性が違います。\n\n- **(1) 再生成**　同じプロンプトで引き直す。コストは動画1本分がそのまま乗る（15秒720pなら89.2クレジット＝約$4.46）。確実性は低く、同じ破綻が再発することもあります。**同一破綻が2回続いたら、再生成を打ち切る**のが実務の線引きです。\n- **(2) 構図で回避**　破綻する部位を画角から物理的に外す、またはボケの中に置く。静止画の作り直しから入るのでコストは安く（Product Shot 2K で1.5クレジット＝約$0.075）、確実性は最も高い。手指の破綻、文字の崩壊はほぼこれで解決します。\n- **(3) 部分編集**　Seedance 2.5 Edit や Cinema Studio 4.0 の Edit Video に相当する機能で、ラベル・顔・物体・衣装などを全体再生成せずに差し替えます。既存動画の部分編集としては Genjutsu（Motion Transfer と Object Swap、入力4〜30秒・参照最大30点・出力最大1080p）もあります。**カット全体は良くて1要素だけが壊れている場合に最も効率がよい**選択です。\n- **(4) 編集で尺を切る**　破綻が発生するのはクリップの後半であることが多いため、破綻前のフレームまでで切り落とします。コストはゼロ。ただし尺が足りなくなるので、**15秒の構成に余剰尺を持たせておく**ことが前提条件になります。\n\nそれぞれの確実性は破綻の種類に依存します。どの破綻にどれを当てるかの判断表は、次のブロックで作ります。"},{"heading":"4択の判断表と打ち切り条件","body":"判断の優先順位は、基本的に **(4) → (2) → (3) → (1)** です。安い順です。ただし条件で変わります。\n\n| 破綻の種類 | 第一選択 | 理由 |\n|---|---|---|\n| 文字・ロゴの崩壊 | (2) 構図で回避＋編集で合成 | 生成で文字を当てるのは期待値が低い |\n| 手指・箸の破綻 | (2) 構図で回避 | 手を画角から外す、または寄りで部位を限定する |\n| 形状変化（後半で発生） | (4) 編集で切る | 破綻前のフレームで足りるなら無料で解決 |\n| 形状変化（全編で発生） | (1) 再生成（1回のみ）→ (2) | 動きが大きすぎるサイン。動きを小さく再設計する |\n| 液体の体積破綻 | (2) 構図で回避 | 流れる区間を画角外に出す |\n| 背景の小物が化ける | (3) 部分編集 | 主要被写体が無事なら部分差し替えが最短 |\n| カット間の不整合 | (2) 同一静止画から作り直す | そもそも別静止画起点にしたのが原因 |\n\nこの表を自分の案件で埋め直し、修正のたびに参照する運用にしてください。**修正方法を毎回考える制作者と、表を引く制作者では、修正の所要時間が数倍変わります**。利益率に直接効く差です。"},{"heading":"ロゴは生成させず合成する、を原則にする","body":"文字・ロゴの生成は、現在のモデル共通の弱点です。文字の正確な描画に強いとされる画像モデル（執筆時点では GPT Image 2）もありますが、**動画のフレーム間で文字の同一性を保つのは静止画より格段に難しい**。1フレーム目で正しく出たロゴが、30フレーム後には別の字形になります。\n\nしたがって原則はこうなります。\n\n- **プロンプトに `no text, no logo` を固定句として入れる**　生成段階で文字を出させない。否定指定は効き方が不定ですが、文字については入れておく価値があります。同時に、構図側で文字が入る場所を作らない（看板を画角外に出す、パッケージの文字面を奥に向ける）ほうが確実です。\n- **実在のロゴは画像ファイルとして編集工程で重ねる**　店から受領したロゴのPNG（背景透過）を、編集ソフトで固定位置に合成します。これなら字形は完全に正確で、ブランドガイドの指定色もそのまま使えます。\n- **ロゴの居場所を静止画段階で空けておく**　w2d1 で作った下部1/3の余白が、そのままロゴとCTAの用地になります。生成後に「置く場所がない」と気づくと、構図からやり直しになります。\n- **実在しないロゴや他社に似たロゴを生成物に残さない**　崩れた文字が偶然他店の商標に近い字形になることがあります。見栄えの問題ではなく権利の問題なので、チェックリスト項目4で必ず全文字を読んで確認します。\n\n同じ論理が**実在しない設備や料理**にも及びます。生成の過程で、店に存在しない暖炉、存在しないテラス席、メニューにない料理が画に入り込むことがあります。見栄えが良いので残したくなりますが、広告として来店前の期待を作る映像に実在しないものを置くと、来店時の体験と乖離します。チェックリストに「画面内の設備・料理はすべて実在するか」を店ごとの項目として追加してください。表示上の論点は Week 3 で扱いますが、制作判断としてはここで固定します。"}],"steps":[{"n":1,"action":"自分の案件用チェックリストを作る","detail":"本文の12項目を自分のスプレッドシートに転記し、案件固有の項目を追加します。追加例：「器は店で実際に使っているものか」「画面内の設備・料理はすべて実在するか」「窓外の街並みや時間帯の描写が、店の立地と営業時間と矛盾していないか」。合計で最低10項目、カットごとに○×を入れられる形式にします。","check":"10項目以上のチェックリストが、カット列×項目行の表として存在している"},{"n":2,"action":"検出手順の4ステップを実際に通す","detail":"w2d2 で採用した3カットそれぞれに、(a) 等速1回 (b) 0.25倍速1回 (c) 開始・中間・終了の3フレーム静止比較 (d) 文字の拡大確認 を実施し、チェックリストに記入します。1カット2〜3分を目安にします。感覚で飛ばさず全項目に○×を入れてください。","check":"3カット分のチェックリストが全項目埋まっており、所要時間が記録されている"},{"n":3,"action":"不採用にした動画を破綻の教材として分類する","detail":"w2d2 で不採用にした動画を全部見直し、5系統（形状変化／手指・道具／文字・ロゴ／物理法則／カット間不整合）のどれに当たるかラベルを付けます。自分がどの系統で落としているかの偏りが見えます。偏りが分かれば、予防すべき工程が特定できます。","check":"不採用動画すべてに系統ラベルが付き、系統別の件数が集計されている"},{"n":4,"action":"4択の判断表を自分の言葉で作る","detail":"本文の判断表を自分のシートに写し、手順3で見つかった自分の頻出破綻について行を追加します。各行に「第一選択」「第二選択」「打ち切り条件」の3列を持たせます。打ち切り条件の例：「再生成は2回まで、2回目も同一破綻なら構図変更に移る」。","check":"自分の頻出破綻を含む判断表が存在し、各行に打ち切り条件が書かれている"},{"n":5,"action":"「編集で切る」で1件直す","detail":"破綻が後半で発生しているクリップを1本選び、破綻の直前フレームまでで切り落とします。残った尺を秒数で記録します。この手法が使えるかどうかは余剰尺に依存するので、「15秒の構成に対してどれだけ余裕が必要か」を1行メモしてください。","check":"切り落とし後のクリップが保存され、使える尺と必要な余剰尺が記録されている"},{"n":6,"action":"「構図で回避」で1件直す","detail":"手指・箸・文字のいずれかが破綻しているカットを選び、その部位を画角から外した静止画を作り直して動画化します。静止画の作り直しは Product Shot 2K なら1.5クレジット（約$0.075）なので、動画の再生成より圧倒的に安いことを消費クレジットで確認します。","check":"回避版のカットが完成し、再生成との消費クレジット差が数値で記録されている"},{"n":7,"action":"「部分編集」で1件直す","detail":"主要被写体は無事で1要素だけが壊れているカットを選び、Seedance 2.5 Edit や Cinema Studio 4.0 の Edit Video に相当する部分編集機能で該当要素を差し替えます。機能が見つからない場合は Genjutsu の Object Swap に相当するものを探します。いずれも利用できない場合は「未提供」と記録し、全体再生成との品質・コスト差を推定で書きます。","check":"部分編集の結果または機能の有無が記録され、全体再生成との比較が書かれている"},{"n":8,"action":"ロゴを編集工程で合成する","detail":"採用カット1本の下部余白に、店のロゴ画像（背景透過PNG）を編集ソフトで合成します。位置・サイズ・不透明度を決め、以後の全カットで同じ数値を使う前提で記録します。生成でロゴを出そうとしないこと、を実際の手作業で確認するのが目的です。","check":"ロゴが合成されたカットが存在し、位置・サイズ・不透明度が数値で記録されている"},{"n":9,"action":"3カットをつないでカット間不整合を検査する","detail":"3カットを編集ソフトで並べ、チェックリストの「つないだ後」項目（色と器の一致、時間軸の整合）を確認します。同一静止画起点のカット群なので一致しているはずですが、動画生成が色調を動かしている場合があります。差が出た場合は、どのカットが動いたかを記録します。","check":"つないだ状態での検査結果が記録され、色調の差があればどのカットかが特定されている"},{"n":10,"action":"第三者の目を1回入れる","detail":"つないだ映像を、制作に関わっていない人（家族・従業員でよい）に1回だけ見せ、「変なところはあるか」とだけ聞きます。何も言わずに見せるのが要点です。制作者が見落とした破綻は、第三者が数秒で見つけます。指摘された項目は、チェックリストに新規項目として追加します。","check":"第三者の指摘が記録され、該当する項目がチェックリストに追加されている"},{"n":11,"action":"対処方法別のコストを集計する","detail":"本日の4つの対処（切る／構図回避／部分編集／再生成）について、消費クレジットと所要分を集計し、1件直すのにいくら・何分かかったかを出します。この数字が、今後の修正対応の見積と顧客への修正回数の設定根拠になります。","check":"対処方法別の単価（クレジット・分）が表として算出されている"}],"prompts":[{"label":"手指の破綻を構図で回避する（手を外す）","text":"[SUBJECT] the same bowl of ramen as in the source image, no hands, no people, no chopsticks in frame [ACTION] steam rising steadily, broth surface completely still, nothing enters or leaves the frame [ENVIRONMENT] unchanged from the source image, the frame is cropped tight so that only the bowl and the counter surface are visible [CAMERA] static close-up, no camera movement, the bowl fills the central two thirds of the frame [LIGHT] unchanged, backlight on the steam [TEXTURE] glossy broth, matte stoneware, visible grain on the counter [STYLE] photorealistic, no text, no logo, no cuts, no scene change","note":"手指の破綻は「手を上手く描かせる」のではなく「手を画角から外す」で解決する。no hands という否定指定だけに頼らず、cropped tight so that only the bowl and the counter are visible と肯定形で画角を縛っているのが要点。箸での持ち上げカットがどうしても必要なら、Week 4 以降に別工程として見積に積む。","status":"未検証","flow":{"code":"I2V","step":"単発","input":"手や箸が破綻した動画の元になった静止画1枚。画像は作り直さず、画角を締めて動画を再生成する","output":"動画1本。手・人・箸が画角の外に出て、破綻の原因そのものが消える","next":"ここで完結。全体再生成との消費クレジット差を記録し、判断表の『構図で回避』行に書く","where":"生成画面でモデルを選ぶ（image-to-video）","whereNote":"最も安く、Seedance 2.0 系・Kling 3.0・Wan 2.7 なら Unlimited 対象"}},{"label":"文字・ロゴを画角から外す（看板を背景から消す）","text":"[SUBJECT] the same plated dish as in the source image, unchanged [ACTION] a faint wisp of steam at the edge, dish completely still [ENVIRONMENT] background reduced to an out-of-focus warm wooden wall only, no signage, no menu boards, no packaging, no printed surfaces anywhere in frame, background blurred to the point where no shape could be read as a character [CAMERA] static medium close-up, 85mm equivalent, shallow depth of field so the background is strongly defocused [LIGHT] unchanged from the source image [TEXTURE] glossy sauce, matte plate, smooth defocused background with no detail [STYLE] photorealistic, no text, no logo, no cuts, no scene change","note":"文字が崩れるなら文字を生成させない。blurred to the point where no shape could be read as a character という記述で、看板らしい形そのものを排除している。実ロゴは編集工程で合成する前提。この型は全案件の既定として使える。","status":"未検証","flow":{"code":"I2V","step":"単発","input":"背景に看板や文字が崩れて写った動画の元の静止画1枚。85mmで背景を強く溶かして再生成する","output":"動画1本。文字と読める形が背景から消え、ロゴを合成する余地だけが残る","next":"実ロゴは編集工程で合成する。この型は全案件の既定として判断表に登録しておく","where":"生成画面でモデルを選ぶ（image-to-video）","whereNote":"最も安く、Seedance 2.0 系・Kling 3.0・Wan 2.7 なら Unlimited 対象"}},{"label":"形状変化を抑える低リスク構成（動きを最小化）","text":"[SUBJECT] the same dish as in the source image, identical ingredients, identical count, identical arrangement, no new objects appear at any point [ACTION] the only motion in the clip is steam drifting upward, every solid object remains fixed in place for the entire duration [ENVIRONMENT] unchanged from the source image, background remains byte-for-byte consistent, no objects move in the background [CAMERA] static shot, no movement, no zoom, no rotation, no shake [LIGHT] unchanged, light direction and intensity constant throughout [TEXTURE] unchanged from the source image [STYLE] photorealistic, no text, no logo, no cuts, no scene change, no morphing of any object","note":"形状変化が全編で起きるカットの再設計用。identical count / no new objects appear / every solid object remains fixed と、個数・出現・固定を三重に縛っている。動きを湯気1つに落とすことで破綻の余地を最小化する構成で、採用率を優先する場面の既定値。","status":"未検証","flow":{"code":"I2V","step":"単発","input":"全編で形が崩れたカットの元の静止画1枚。動きを湯気1つに落として同じ画から再生成する","output":"動画1本。個数・出現・固定を三重に縛った結果、変形の余地がほぼ残らない","next":"ここで完結。採用率を優先する場面の既定値とし、残りのカットにも同じ縛りを適用する","where":"生成画面でモデルを選ぶ（image-to-video）","whereNote":"最も安く、Seedance 2.0 系・Kling 3.0・Wan 2.7 なら Unlimited 対象"}}],"expected":"10項目以上のチェックリストと、自分の頻出破綻を反映した4択判断表が完成している状態です。加えて、4つの対処方法を各1件以上実際に試し、その単価（クレジット・分）が表になっています。第三者の指摘が1件以上チェックリストに追加されていることも重要です。自分では気づけない破綻があるという事実を、作業として体験できていれば到達です。","assignment":{"title":"破綻検出チェックリストと4択判断表の構築","brief":"w2d2 で生成した動画群を教材に、AI特有の破綻を機械的に検出する仕組みと、見つけた破綻をどう直すかの判断基準を作ります。美しい映像を作る課題ではなく、品質管理の工程を自分の制作フローに組み込む課題です。作成したチェックリストと判断表は、Week 5 の品質管理ゲート、Week 6 の外注品質基準にそのまま流用します。他人が読んで運用できる粒度で書いてください。","deliverables":["破綻検出チェックリスト（10項目以上、カット列×項目行の表形式）","検出手順の4ステップと1カットあたり所要時間の実測","不採用動画の系統別分類と件数集計","4択判断表（第一選択・第二選択・打ち切り条件の3列つき）","4つの対処を各1件以上実施した結果（切る／構図回避／部分編集／再生成）","ロゴを編集合成したカット1本と、位置・サイズ・不透明度の数値","第三者による指摘の記録とチェックリストへの反映","対処方法別の単価表（クレジット・分）"],"constraints":["チェックリストは全項目に○×を入れ、感覚での省略を行わない","同一破綻に対する再生成は2回を上限とする","ロゴは生成させず、必ず編集工程で合成する","作業時間は90分以内"]},"success":["チェックリストが10項目以上あり、画面内の文字と実在性の確認が項目として含まれている","不採用動画が5系統に分類され、自分の頻出系統が特定されている","判断表の各行に打ち切り条件が数値または回数で書かれている","4つの対処方法を実際に試し、それぞれの消費クレジットと所要分が記録されている","第三者の指摘が1件以上あり、チェックリストに新規項目として反映されている"],"rubric":[{"axis":"映像の品質","pass":"3点＝採用カットにチェックリスト上の致命的破綻が残っていない。5点＝0.25倍速とフレーム比較でも破綻が見つからない。"},{"axis":"動きの自然さ","pass":"3点＝物理法則の破れ（逆流・増殖・貫通）が採用カットにない。5点＝影の方向と湯気の向きまで光源と整合している。"},{"axis":"ブランド整合性","pass":"3点＝実在しない設備・料理・ロゴが採用カットに含まれていない。5点＝ロゴの位置・サイズ・不透明度が数値で固定され、全カットで一致している。"},{"axis":"マーケ目的整合性","pass":"3点＝破綻対処が訴求点を損なわない形で行われている。5点＝対処による尺の削減が15秒の構成に織り込まれている。"},{"axis":"再現性","pass":"3点＝チェックリストと判断表が文書として存在する。5点＝第三者がそれを読んで同じ品質判定を下せる粒度になっている。"},{"axis":"時間とコスト","pass":"3点＝対処にかかったクレジットと時間が記録されている。5点＝対処方法別の単価から、最も安い対処を選ぶ運用が判断表に反映されている。"}],"pitfalls":[{"problem":"自分では気づかない破綻が納品後に顧客から指摘される","cause":"制作者は全体の雰囲気で見るため、局所の破綻が認知から落ちる","fix":"0.25倍速での通し見と、第三者に一度見せる工程を工程表に固定する。検査時間を工数に計上し、「時間がないから飛ばす」余地をなくす。"},{"problem":"同じ破綻を直そうとして再生成を10回繰り返す","cause":"再生成すれば直るという期待が、打ち切り条件なしで走り続ける","fix":"再生成は2回で打ち切る。2回目も同一破綻なら、その動きがモデル側で安定しないサインとして、構図回避または企画変更に移る。"},{"problem":"文字を正しく出そうとプロンプトを何十回も書き直す","cause":"静止画で一度うまく出た経験から、動画でも可能だと考えている","fix":"動画のフレーム間で文字の同一性を保つ難易度は静止画より格段に高い。文字は生成対象から外し、構図で画角外に出して編集で合成する。"},{"problem":"カットをつないだ段階で色と器が合わず、全部作り直しになる","cause":"別々の静止画を起点にカットを作っている","fix":"主役カット群は同一静止画を起点にする。別構図が必要な場合は、器・背景・光のスロットを完全にコピーした静止画から作る。検査を単カットとつないだ後の2段階に分ける。"},{"problem":"見栄えが良いので実在しない設備や料理を採用してしまう","cause":"映像としての完成度を優先している","fix":"チェックリストに店ごとの実在性項目を入れ、採用判定の必須項目にする。来店前の期待を作る映像に実在しないものを置くと、来店時の体験との乖離が顧客の信用に跳ね返る。"},{"problem":"部分編集機能を探すのに時間を使い、見つからず工程が止まる","cause":"UIが変更され、記憶していた画面名が存在しない","fix":"機能カテゴリ（部分編集／物体差し替え／動きの移植）で探し、5分で見つからなければ「未提供」と記録して構図回避に切り替える。機能探索に上限時間を設ける。"}],"resourceIds":["hf-help-seedance","hf-academy-cinematic-ad-e2e"],"nextHint":"明日は、カット間で色とトーンが揃う理由を仕組みにします。参照画像と Elements、カラーパレット、生成後のカラーグレーディングで、1店舗分の簡易ブランドガイドを作ります。","setup":{"tag":"破綻の検出","model":"静止画 手持ちのツールで可（ChatGPT / Gemini / Soul 2.0） ／ 動画 Seedance 2.0（部分修正は Edit 系の機能）","seconds":"4秒","res":"720p","aspect":"9:16","outputs":"1","cap":"静止画4枚・動画6本","credits":"約 109 cr（$5.43）","unlimited":"0 cr","save":"同一の破綻に対する再生成は2回が上限。3回目は構図変更か編集で切る。全体の作り直しより部分編集のほうが安い。"}},{"id":"w2d4","day":4,"title":"ブランドの世界観を固定する","subtitle":"色・光・質感を参照とパレットで固定し、1店舗分の簡易ブランドガイドを作る","why":"1本の広告が良くできても、2本目の色調が違えば顧客にとっては資産になりません。SNS運用は継続が前提であり、月4本を1年続ければ48本になります。48本がバラバラな色調なら、視聴者の記憶に店のイメージは蓄積しません。逆に色と光が揃っていれば、ロゴが映っていなくても「あの店の投稿だ」と認識されるようになります。これは広告運用でブランドリフトを扱ってきた人には馴染みのある構造です。問題は、生成AIは放っておくと毎回違う色を出すということです。だから仕組みで固定する必要があります。今日は参照画像・Elements・カラーパレット・生成後グレーディングという4つの固定手段を使い分け、顧客に渡せる形のブランドガイドまで作ります。","goals":["カラーパレット・照明トーン・質感の方向性を、観測可能な語と数値で定義できる","参照画像（スタイル参照 に相当するタグ）を使って、別構図でも色調を引き継げる","Elements に相当する機能に器・店内・小道具を登録し、案件横断で再利用できる","Cinema Studio 4.0 の Color Palette と生成後 Color Grading を使い分けられる","1店舗分の簡易ブランドガイド（色・光・質感・禁止事項）を1枚で作成できる"],"duration":"80分","timeBreakdown":[{"label":"ブランド変数の定義","min":20},{"label":"参照・パレット・グレーディングの検証","min":40},{"label":"ブランドガイドの作成","min":20}],"tools":["Higgsfield（参照画像入力、スタイル参照 / キャラクター参照 などの参照タイプ）","Higgsfield（Elements に相当する機能：Characters / Locations / Props、Assets からの作成）","Higgsfield（Cinema Studio 4.0 の Director's Panel：Color Palette、Lighting、生成後の Color Grading）","カラーピッカー（画像から色を抽出できるもの）","資料作成ツール（ブランドガイド1枚の作成）"],"prereq":["w2d1〜w2d3 の採用静止画と採用カットが揃っていること","対象店の内装・器の情報（写真または設定メモ）があること","店のロゴ画像と、ロゴに使われている色が分かること"],"theory":[{"heading":"ブランドの世界観は4変数で記述できる","body":"「世界観」という言葉を、生成に使える4つの変数に分解します。抽象のまま扱うと毎回違う結果になります。\n\n- **カラーパレット**　主色1・副色1〜2・背景色1・アクセント1の4〜5色。HEXで固定します。重要なのは**料理そのものの色を主色にしない**こと。料理はメニューごとに変わるので、器・接地面・壁の色をパレットにします。例：器の黒（#1C1A18）／カウンターのウォルナット（#3E2B20）／壁の生成り（#D8CFC2）／アクセントの銅（#9A6B3F）。\n- **照明トーン**　色温度の範囲（例：2800〜3200K に固定）、主光源の方向（例：被写体の奥上方からの半逆光）、光の質（柔らかい拡散）、コントラストの強度（背景を被写体より2段暗く）。この4つを決めると、どのメニューを撮っても同じ空気感になります。\n- **質感の方向性**　マット寄りかグロス寄りか、粗い素材か滑らかな素材か、乾いているか湿っているか。例：「器はマットな石物、接地面は粗い木目、料理の表面のみグロス」。この指定が店の価格帯を一番正確に伝えます。\n- **禁止事項**　やらないことのリスト。これが最も実務で効きます。例：天井照明を主光源にしない／真っ白な背景を使わない／彩度を上げない／人物の顔を映さない／手を映さない／文字を生成させない。禁止事項があると、生成の迷いが減り、外注時の指示が一行で済みます。\n\n4変数を1枚にまとめたものが**簡易ブランドガイド**です。これは顧客への納品物にもなり、Week 6 で営業資料として機能します。「色と光のルールを設計して納品する」のは、単発の動画制作より明らかに単価を上げやすい提供形態です。"},{"heading":"物とトーンを固定する2手段","body":"執筆時点で確認できる固定手段を、効く層の順に整理します。\n\n- **参照画像（スタイル参照）**　**Cinema Studio 4.0 / Seedance 2.5 は1回の生成で最大50点のマルチモーダル入力**に対応し（2.5 は画像30・動画10・音声10、2.0 は画像9・動画3・音声3）、参照タイプとして **キャラクター・スタイル・モーション・音声の参照** が使えます。色調とトーンの引き継ぎには スタイル参照 を使います。効く層は**色・光・質感の全体トーン**。構図や被写体は引き継がれません。\n- **Elements（Characters / Locations / Props）**　Assets から Create Element で作成し、**プロジェクト横断で再利用**できます。効く層は**具体物の同一性**。店で実際に使っている器、カウンター、店内の一角を Props / Locations として登録しておくと、メニューが変わっても同じ器・同じ店に見えます。宿泊施設の客室・外観の一貫性確保に使える中核機能とされていますが、飲食でも器と店内に同じ使い方ができます。\n\nこの2つは**上流の固定**です。生成に入る前に物とトーンを縛るため、効果が最も大きい。残る2手段は生成時と生成後の調整であり、次のブロックで扱います。"},{"heading":"生成時と生成後の色の調整","body":"- **Cinema Studio 4.0 の Color Palette**　Director's Panel の一部で、**50以上のパレット**が選べます。さらに Lighting は Auto＋6プリセット（Silhouette, Practicals, Window, Overhead Fall, Contre-jour, Soft Cross）と、色・明るさ・拡散・角度の手動調整があります。効く層は**生成時の色と光の方向性**。言語指定より再現性が高いのが利点です。\n- **生成後の Color Grading**　色温度・コントラスト・彩度・シャープ・グレイン・ハイライト・露出を生成後に調整できます。効く層は**最終的な色の微調整**。カット間で色が0.5段ずれている、といった最後の揃え込みに使います。\n\n実務の順序は **Elements で物を固定 → スタイル参照 でトーンを引き継ぐ → Color Palette と Lighting で生成時に方向を決める → 生成後 Color Grading で揃える** です。上流で固定すればするほど、下流の調整量が減ります。"},{"heading":"Soul ID と Elements の限界を知っておく","body":"固定機能には限界があり、知らずに顧客に約束すると納品で破綻します。\n\n**Soul ID** は20〜80枚の写真から人物の同一性を学習し、数分で学習が完了します。ただし公式に明記されているとおり、**同一人物として認識できるレベルであり、ピクセル単位の同一ではありません**。1 Soul ID = 1人で、ファイルとして書き出すことはできません。Seedance では @ Elements → My Elements に出現します。店主やスタッフを出す場合、「写真と完全に同じ顔」を期待すると外れます。顧客に見せる前に、この性質を言葉で説明しておくほうが安全です。\n\n**Elements** は具体物の同一性を保ちますが、角度や光が大きく変わると揺らぎます。器の形は保てても、釉薬の微妙な色むらが毎回同じとは限りません。\n\n**「前のカットの続き」専用機能は存在しません**。Cinema Studio 4.0 の **Forward/Backward Extend**（アップロードした動画を最大30秒まで前後に延長）か、「クリップAの最終フレームとクリップBの先頭フレームを参照にして間を生成する」という回避策で実現します。ワンクリックで前のカットが続く機能があるものとして工程を組むと、工数が合わなくなります。\n\nしたがって実務の方針はこうなります。**一貫性は機能だけに任せず、同一静止画起点・Elements・スタイル参照・ブランドガイドの4重で担保する**。どれか1つが揺らいでも、他で吸収できる設計にしておく。これが48本を揃える唯一の現実的な方法です。"},{"heading":"検証なしに「ブランドが伝わった」と言えない","body":"色と光を揃えることは手段であり、目的は視聴者の記憶に店が残ることです。ここを混同すると、揃えること自体が自己目的化します。\n\n揃った結果が効いているかを見る方法は、映像制作側だけでは完結しません。広告運用の経験がある前提で、確認できる指標を挙げます。\n\n- **同一クリエイティブの反復視聴率**　同じトーンのシリーズを複数本配信したとき、後発の本数の視聴完了率が上がるか。上がるなら認知の蓄積が起きている可能性があります。\n- **ブランド名を含む検索・指名流入**　店名での検索やマップ閲覧が、配信期間と連動して動くか。\n- **保存・共有率**　トーンが確立した投稿は保存されやすい傾向がありますが、これは料理の魅力や投稿文の影響も受けます。\n\nいずれも**単独では因果を証明しません**。来店数や売上は、天候、競合、イベント、価格、口コミなど複数の要因で動きます。映像のトーンを揃えたから予約が増えたと言い切ることはできません。言えるのは「配信期間とこの指標が連動した」という事実と、「他の要因として何があったか」の列挙までです。\n\n顧客への説明もこの粒度で行うのが誠実で、かつ継続につながります。断定して外したときの信用の落ち方は、慎重に話して継続する場合の機会損失より大きい。Week 4 ではこの検証設計をもう一段詳しく扱います。"}],"steps":[{"n":1,"action":"採用カットからカラーパレットを抽出する","detail":"w2d1〜w2d3 の採用静止画から、カラーピッカーで主色・副色・背景色・アクセントの4〜5色をHEXで抽出します。料理そのものの色は含めません。器・接地面・壁・光のハイライトから取ります。店のロゴ色と衝突していないかも確認します。","check":"4〜5色のHEXが決まり、料理の色が含まれていないことを確認している"},{"n":2,"action":"照明トーンを4項目で定義する","detail":"色温度の範囲（例：2800〜3200K）、主光源の方向（例：被写体の奥上方からの半逆光）、光の質（柔らかい拡散／硬い直射）、コントラスト強度（例：背景を被写体より2段暗く）を数値と方向で書き切ります。「あたたかい」のような抽象語を残さないことが条件です。","check":"4項目すべてが数値または方向として記述され、抽象語が残っていない"},{"n":3,"action":"質感の方向性を3軸で決める","detail":"マット／グロス、粗い／滑らか、乾いた／湿った の3軸について、器・接地面・料理表面・背景のそれぞれで方向を決めます。例：器=マット・粗い・乾いた／料理表面=グロス・滑らか・湿った。この対比が画の見どころを作ります。","check":"4つの対象×3軸の方向が表として埋まっている"},{"n":4,"action":"禁止事項を6項目以上書く","detail":"この店の映像でやらないことを列挙します。例：天井照明を主光源にしない／真っ白な背景を使わない／彩度を+10以上上げない／人物の顔を映さない／手と箸を映さない／文字とロゴを生成させない／店の立地と矛盾する窓外（地下の店なのに窓の外が見える、低層の店なのに高層からの見晴らしになっているなど）を使わない。やらないことが明確なほど生成の迷いが減ります。","check":"6項目以上の禁止事項が、判定可能な文として書かれている"},{"n":5,"action":"参照画像（スタイル参照）でトーンを引き継ぐ","detail":"採用静止画1枚を参照画像として スタイル参照 に相当するタグで指定し、**別のメニュー**の静止画を生成します。構図は変わってよく、色調と光のトーンが引き継がれているかだけを見ます。引き継がれない場合、参照の指定方法か参照画像の選択を見直します。","check":"別メニューの静止画が生成され、パレットのHEXに近い色が出ていることを確認できている"},{"n":6,"action":"Elements に器・店内・小道具を登録する","detail":"Assets から Create Element に相当する操作で、器（Props）、店内の一角（Locations）を登録します。登録後、登録した Element を指定して1枚生成し、同一性が保たれるかを確認します。揺らぐ要素（釉薬の色むら等）があれば、その限界を記録します。","check":"Element が1件以上登録され、それを使った生成で同一性の程度が確認されている"},{"n":7,"action":"Color Palette と Lighting プリセットを試す","detail":"Cinema Studio 4.0 の Director's Panel に相当する画面で、Color Palette から自分のパレットに近いものを選び、Lighting プリセット（Window, Contre-jour, Practicals などが該当）を当てて生成します。言語指定だけで出した結果と、プリセットを使った結果の再現性を比較します。","check":"プリセット使用版と言語指定版が並び、再現性の差が記録されている"},{"n":8,"action":"生成後 Color Grading でカット間を揃える","detail":"w2d2 で作った3カットのうち、色調が最も外れているものを選び、生成後の Color Grading（色温度・コントラスト・彩度・ハイライト・露出）で他カットに合わせます。調整した数値を記録します。この数値が今後の既定補正値になります。","check":"3カットの色調が揃い、適用した調整値が数値で記録されている"},{"n":9,"action":"別メニューで一貫性を検証する","detail":"ブランドガイドに従って、最初の被写体とは別のメニュー1皿の静止画を生成し、1本の動画カットまで作ります。既存カットと並べて、同じ店の映像に見えるかを確認します。見えない場合、ガイドのどの項目が守られていないかを特定します。","check":"別メニューのカットが既存カットと並び、同一店に見えるかの判定とその理由が書かれている"},{"n":10,"action":"簡易ブランドガイドを1枚にまとめる","detail":"色（HEX 4〜5色）／光（4項目）／質感（3軸×4対象）／禁止事項（6項目以上）を1枚のシートにまとめ、参考画像を2〜3点添えます。加えて、固定に使う手段（Element ID、参照画像ファイル名、Color Palette 名、既定の Color Grading 値）を記載します。顧客に見せられる体裁にしてください。","check":"1枚のブランドガイドが完成し、固定手段の具体名まで記載されている"}],"prompts":[{"label":"ブランドガイド準拠の静止画（パレットと光を数値で固定）","text":"[SUBJECT] a single plated dish from the restaurant menu, served on a matte black stoneware plate with visible throwing marks [ACTION] static, a faint wisp of steam only [ENVIRONMENT] on a dark walnut counter, a plain unbleached plaster wall far behind, strongly defocused, no signage and no printed surfaces [CAMERA] medium close-up at a 45 degree angle, 50mm equivalent, moderate depth of field, vertical 9:16 framing, clear negative space in the lower third [LIGHT] key light from behind and above the dish at 3000K, soft diffusion, weak fill from the front left, background rendered two stops darker than the subject, no overhead ceiling light [TEXTURE] matte coarse stoneware, matte plaster wall, coarse walnut grain, only the food surface is glossy and moist [STYLE] photorealistic food photography, restrained contrast, warm neutral grade dominated by near-black #1C1A18, walnut brown #3E2B20, unbleached off-white #D8CFC2 and a copper accent #9A6B3F, no text, no logo","note":"ブランドガイドの4変数すべてをプロンプトに織り込んだ形。パレットをHEXで書き込むのは、色名だけでは解釈幅が大きいため。no overhead ceiling light は禁止事項をプロンプトに反映した例。料理名だけを差し替えれば、同じトーンで全メニューを展開できる。","status":"未検証","flow":{"code":"T2I","step":"工程1 / 2","input":"新規。料理名だけを差し替える。パレットのHEX4色と色温度、禁止事項の記述は1語も変えない","output":"9:16の静止画1枚。全メニューに展開できるトーンの基準画像になる","next":"この1枚を『参照画像（スタイル参照）でトーンを引き継ぐ』の参照画像として添付する"}},{"label":"参照画像（スタイル参照）でトーンを引き継ぐ","text":"[SUBJECT] a different dish from the same restaurant menu, grilled vegetables on a shallow bowl [ACTION] static, no movement [ENVIRONMENT] same restaurant interior as the style reference, dark counter and defocused plaster wall [CAMERA] close-up at a 45 degree angle, 85mm equivalent, shallow depth of field, vertical 9:16 framing [LIGHT] match the lighting direction, colour temperature and contrast of the style reference exactly [TEXTURE] match the surface qualities of the style reference, matte vessel against a glossy food surface [STYLE] match the colour grade and tonal range of the style reference image, photorealistic, no text, no logo","note":"参照画像を スタイル参照 に相当するタグで添付した前提のプロンプト。match ... of the style reference と明示的に書くことで、参照が色調に効くよう誘導する。被写体と構図は新しく指定し、トーンだけを引き継ぐ設計。参照は最大50点まで入力できる環境なら、器の参照と店内の参照を分けて添付するとさらに安定しやすい。","status":"未検証","flow":{"code":"I2I","step":"工程2 / 2","input":"工程1で作った基準画像1枚を スタイル参照 に添付する。被写体と構図だけを新しく書き、トーンは渡す","output":"別メニューの静止画1枚。色調と光の方向が参照に揃い、同一店に見える","next":"抽出したHEXとの一致を確認し、ずれていれば生成後 Color Grading でカット間を揃える"}},{"label":"禁止事項を肯定形に翻訳した指定","text":"[SUBJECT] the restaurant's signature dish on its own plate, no people, no hands, no utensils held by anyone [ACTION] static, steam only [ENVIRONMENT] interior lit entirely by one window and one practical lamp, the ceiling is out of frame, the background is a continuous wooden surface with no white walls and no printed material [CAMERA] static medium close-up, 50mm equivalent, vertical 9:16 framing with the lower third left as a plain dark surface [LIGHT] window light from the rear left at 3000K as the only key, one warm practical lamp far behind as a background accent, soft shadows, no light source above the subject [TEXTURE] matte vessel, coarse wood, glossy food surface, dry background [STYLE] photorealistic, desaturated warm grade with saturation kept at or below the reference level, no text, no logo, no cuts","note":"禁止事項リスト（天井照明を使わない／白背景を使わない／彩度を上げない／人と手を映さない／文字を出さない）を、否定語に頼らず情景の肯定的記述に書き換えた例。the ceiling is out of frame のように物理的な画角で縛るほうが、no ceiling light よりも通りやすい。","status":"未検証","flow":{"code":"T2I","step":"単発","input":"新規。否定語を使わず情景で縛る書き方の見本。自分の禁止6項目をこの形に書き換えて使う","output":"9:16の静止画1枚。天井照明・白背景・人・文字が構図の段階で入らない","next":"この書き換え方をブランドガイドに転記し、w2d5 の全カットのプロンプトに適用する"}}],"expected":"静止画6〜10枚と動画1〜2本、そして1枚の簡易ブランドガイドが完成している状態です。ガイドには色のHEX、光の4項目、質感の3軸、禁止事項6項目以上、固定手段の具体名（Element ID、参照画像名、パレット名、既定グレーディング値）が入っています。最も重要な到達は、最初の被写体とは別メニューで作ったカットが、既存カットと並べて同じ店の映像に見えることです。","assignment":{"title":"1店舗分の簡易ブランドガイド作成と一貫性の検証","brief":"対象店の色・光・質感・禁止事項を観測可能な語と数値で定義し、1枚のブランドガイドにまとめます。そのうえで、ガイドに従って別メニューのカットを作り、既存カットと並べて同一店に見えるかを検証します。このガイドは顧客に見せられる体裁で作ってください。Week 6 では、ガイド設計自体を単発制作より上の単価で提供する商品として扱います。","deliverables":["カラーパレット（HEX 4〜5色、料理の色を除外したもの）","照明トーンの定義4項目（色温度範囲・方向・質・コントラスト強度）","質感の方向性（3軸×4対象の表）","禁止事項リスト（6項目以上、判定可能な文）","参照画像（スタイル参照）でトーンを引き継いだ別メニュー静止画","Elements の登録1件以上と、同一性の限界に関する記録","Color Palette / Lighting プリセットと言語指定の再現性比較","生成後 Color Grading でカット間を揃えた結果と適用数値","簡易ブランドガイド1枚（固定手段の具体名を含む）"],"constraints":["パレットに料理そのものの色を含めない","照明トーンと質感に抽象的な形容詞を残さない","別メニューの検証では、ガイドに書いた指定以外を追加しない","作業時間は90分以内"]},"success":["パレットがHEXで固定され、料理の色が除外されている","照明トーンの4項目が数値または方向で記述され、抽象語が残っていない","禁止事項が6項目以上あり、それぞれ守れたかを判定できる文になっている","別メニューのカットが既存カットと並べて同一店の映像として成立している","ブランドガイドに固定手段（Element、参照画像、パレット、グレーディング値）の具体名が記載されている"],"rubric":[{"axis":"映像の品質","pass":"3点＝ガイド準拠のカットが使用可能な品質。5点＝質感の3軸の対比（マットな器×グロスな料理表面）が明確に描き分けられている。"},{"axis":"動きの自然さ","pass":"3点＝ガイド適用後も動きに破綻がない。5点＝生成後グレーディングを掛けても動きの質感が劣化していない。"},{"axis":"ブランド整合性","pass":"3点＝別メニューのカットが既存カットと同系の色調になっている。5点＝ロゴなしでも同一店の映像と判別でき、その根拠をパレットと光で説明できる。"},{"axis":"マーケ目的整合性","pass":"3点＝ガイドが店の客単価と客層に矛盾しない。5点＝一貫性の効果をどう検証するか（指標と交絡要因）まで書けている。"},{"axis":"再現性","pass":"3点＝ガイドが1枚の文書として存在する。5点＝固定手段の具体名が記載され、第三者がガイドだけで同系のカットを出せる。"},{"axis":"時間とコスト","pass":"3点＝検証生成が予定内に収まっている。5点＝上流固定（Elements・スタイル参照）により生成後調整の手数が減ったことを数値で示せている。"}],"pitfalls":[{"problem":"パレットに料理の色を入れてしまい、メニューが変わると崩れる","cause":"採用カットから最も目立つ色を抽出している","fix":"抽出対象を器・接地面・壁・ハイライトに限定する。料理はメニューごとに変わる変数であり、ブランドの固定要素にはならない。"},{"problem":"スタイル参照 の参照で構図まで引き継がれると期待して外す","cause":"参照タイプの効く層を理解していない","fix":"スタイル参照 は色・光・質感のトーンに効き、構図と被写体は引き継がない。具体物の同一性が必要なら Elements、構図の固定が必要なら同一静止画起点に切り替える。"},{"problem":"Soul ID で店主の顔を「写真と同一」に出すと顧客に約束してしまう","cause":"一貫性機能の精度を過大評価している","fix":"Soul ID は同一人物として認識できるレベルであり、ピクセル単位の同一ではない。顧客に見せる前にこの性質を説明し、人物を使うカットは代替案（手元のみ、後ろ姿、実写差し込み）も提示する。"},{"problem":"「前のカットの続き」をワンクリックで作れる前提で工程を組む","cause":"専用機能があると思い込んでいる","fix":"その専用機能は存在しない。Forward/Backward Extend による延長か、クリップAの最終フレームとクリップBの先頭フレームを参照にして間を生成する回避策で工数を見積る。"},{"problem":"禁止事項が抽象的で守れたか判定できない","cause":"「安っぽくしない」のような主観的な書き方をしている","fix":"判定可能な文に書き換える。「安っぽくしない」→「彩度を基準より上げない」「真っ白な背景を使わない」「天井照明を主光源にしない」。○×が付けられる形が条件。"},{"problem":"色を揃えること自体が目的化し、訴求が弱い映像を量産する","cause":"手段と目的の混同","fix":"ガイドは訴求を通すための土台であり、訴求そのものではない。カットごとに「このカットは何を伝えるか」を先に書き、ガイドはその上に乗せる。Week 4 で訴求設計を扱う。"}],"resourceIds":["hf-academy-brand-visuals","hf-help-marketing-studio"],"nextHint":"明日は仕上げです。15秒の構成とカット尺を決め、企画書と絵コンテを書き、音をつけて書き出します。採用率を織り込んだ実質原価の試算もここで出します。","setup":{"tag":"ブランド統一","model":"静止画 手持ちのツールで可（ChatGPT / Gemini / Soul 2.0）・参照画像つき／ 動画 Seedance 2.0","seconds":"4秒","res":"720p","aspect":"9:16","outputs":"1","cap":"静止画12枚・動画2本","credits":"約 38 cr（$1.88）","unlimited":"0 cr","save":"トーンの統一を生成で粘らない。最終的には編集のカラーグレーディングで合わせる前提にしておけば、生成回数は半分で済む。"}},{"id":"w2d5","day":5,"title":"15秒広告の完成と原価試算","subtitle":"構成とカット尺を設計し、企画書・絵コンテ・書き出し・実質原価までを1本に通す","why":"ここまでの4日で、構図・質感・品質管理・世界観という部品は揃いました。しかし部品が揃っていることと、15秒の商品として成立することは別の話です。15秒は短く、入れられる情報は1つか2つです。何を捨てるかを決める作業が構成設計であり、これを企画書として書けないと顧客と合意が取れません。また、絵コンテなしで生成に入ると、必要なカットが分からず、結果的に使わないカットを生成してクレジットを無駄にします。そして最後に原価です。15秒720pの生成が89.2クレジット（約$4.46）であることは分かっていても、採用率を掛けた実質原価を知らなければ、Week 6 で価格を付けられません。今日はこの3つ（構成・設計書類・原価）を同時に仕上げます。","goals":["15秒を3〜5カットに分解し、各カットの役割と尺を秒数で設計できる","企画書1枚（対象客・目的・訴求1点・禁止事項・測定方法）を書ける","絵コンテを、生成に必要な情報（プロンプトID・生成元画像ID）まで含めて書ける","音の設計と書き出し仕様を決め、配信可能な状態で納品できる","採用率を織り込んだ実質原価を算出し、人件費と生成実費の比率を把握している"],"duration":"90分","timeBreakdown":[{"label":"構成設計と企画書・絵コンテ","min":25},{"label":"不足カットの生成と編集","min":45},{"label":"書き出しと原価試算・6軸評価","min":20}],"tools":["Higgsfield（Marketing Studio の UGC Videos / Motion 系、または image-to-video）","Higgsfield（Higgsfield Audio、またはモデルのネイティブ音声）","編集ソフト（CapCut、DaVinci Resolve など。カット編集・字幕・ロゴ合成・音量調整・書き出し）","資料作成ツール（企画書・絵コンテ）","制作台帳スプレッドシート（原価試算）"],"prereq":["w2d1 の採用静止画、w2d2 の3カット、w2d3 のチェックリストと判断表、w2d4 のブランドガイドが揃っていること","店のロゴ画像（背景透過PNG）があること","訴求に使える事実（実在するメニュー名、価格、営業時間、立地など）が手元にあること"],"theory":[{"heading":"15秒の構成とカット尺の設計","body":"15秒を4カット前後に分解します。各カットの役割を先に決め、尺を秒数で割り当てます。\n\n標準型（飲食・縦型SNS想定）\n\n- **カット1（0.0〜3.0秒）フック**　最も強い質感カット。寄りで湯気・照り・溶けるのどれかを見せる。**ここで何を見せるかが全体の成否を左右しますが、フックの設計そのものは Week 4 で深掘りします**。今週は「最も強い質感カットを先頭に置く」というルールだけ守ってください。\n- **カット2（3.0〜7.5秒）主役**　料理の全体像。何を売っているかが分かる画。ミディアムで器と盛りを見せる。\n- **カット3（7.5〜11.5秒）文脈**　店・場所・雰囲気。どこで食べられるのかを伝える。引きまたは店内の一角。\n- **カット4（11.5〜15.0秒）締め**　情報とロゴ。店名・場所・一言。ここだけは動きを最小にして字が読める状態を作る。\n\nカット尺の原則は3つです。**(1) 1カット2秒未満は情報が読めない**　視聴者が画を認識するのに0.5〜1秒、内容を理解するのにさらに1秒前後かかります。**(2) 1カット4秒超は飽きが出る**　縦型SNSでは2.5〜4秒が中心帯になります。**(3) 締めのカットは3秒以上確保する**　文字を読ませるカットは短くできません。\n\n4カット構成だとカットあたり平均3.75秒です。これが15秒広告の既定値になります。カットを増やして5〜6カットにすると1カット2.5秒になり、質感を見せる余裕がなくなります。**飲食の15秒は4カットが上限**と考えてください。\n\nなお、w2d3 で学んだ「編集で尺を切る」対処を使う余地を残すため、**各カットの素材は目標尺より1〜2秒長く生成する**のが実務です。3.0秒必要なら5秒で生成しておく。この余剰が品質管理の自由度になります。"},{"heading":"企画書と絵コンテのフォーマット","body":"顧客と合意を取り、生成の無駄をなくすための2枚です。どちらも1枚に収めます。\n\n**企画書（1枚・9項目）**\n\n1. 店名・業態・客単価・立地（最寄り駅と徒歩分数、路地裏／ビルの地下・空中階／商店街のどれか、周辺の競合密度）\n2. 対象客（1つに絞る。例：最寄り駅で乗り換える30〜40代の会社員、退勤後に夕食の店を当日スマホで探している。インバウンド客を狙うなら都市観光の短期滞在・食目的として書き、多言語表示とキャッシュレスの可否も添える）\n3. 配信面と比率（例：Instagram リール、9:16、音あり前提）\n4. 目的（**1つだけ**。認知／来店／予約のどれか。複数書くと構成が崩れる）\n5. 訴求（**1点だけ**。例：備長炭で焼いた一本焼きの焼鳥。競合密度が高い立地では「他店と比べて何が違うか」が言える1点を選ぶ）\n6. 禁止事項（w2d4 のブランドガイドから転記）\n7. 尺・納品物（15秒／9:16・1080p・音あり／サムネイル1点）\n8. 実在確認（画面に出る料理・器・設備・情報がすべて実在することの確認欄）\n9. 測定方法（何をいつ見るか。視聴完了率、保存数、プロフィール遷移率など。**来店数との因果は断定しない**前提で、交絡要因も列挙する）\n\n**絵コンテ（カット数×9列）**\n\nカット番号／尺（秒）／ショットサイズとアングル／被写体と動き1つ／音（SE・BGM・ナレーション）／字幕テキスト／生成元静止画のファイル名／使用プロンプトID／備考（破綻リスクと対処方針）\n\n絵コンテに**生成元静止画名とプロンプトID**を入れるのが実務上の要点です。これがあると、修正依頼が来たときに「どのカットを、どの画像から、どのプロンプトで作ったか」を即座に引けます。Week 6 で外注する際も、この2列があれば指示が成立します。絵柄の上手さは不要で、ラフなスケッチか参考画像の貼り込みで十分です。"},{"heading":"音と編集の基礎、書き出し仕様","body":"音は15秒広告の体感品質を大きく動かしますが、作り込みすぎると工数が合いません。最小構成を決めておきます。\n\n**音の3層（最小構成）**\n- **BGM 1本**　15秒に収まる尺で、店のトーンに合うもの。権利が明確なものを使う。音量は最終段で-18〜-14 LUFS 程度を目安にし、ピークは-1dBTP を超えないようにする。\n- **効果音（SE）2〜3点**　シズル音、グラスの音、炭の音。フックのカットに1つ、締めに1つが基本。**SEが1つあるかないかで体感の質が変わる**割に工数が小さいので、費用対効果が高い。\n- **ナレーション**　15秒では入れないほうが成立しやすい。入れる場合は字幕と内容を重複させない。\n\nモデル側のネイティブ音声については、執筆時点で Seedance 2.5（ネイティブ音声・多言語リップシンク、**音声ONでもクレジット増なし**）、Wan 2.6（ネイティブ同期音声）、Kling 3.0（台詞・SFX・環境音、Voice Binding、日本語対応）が該当します。生成時に音声を取得しておき、採否は編集段階で決めるのが無駄がありません。ただし**広告のBGMは編集側で統一するほうが制御しやすい**ため、生成音声は環境音・SE素材として使う前提で考えてください。\n\n**書き出し仕様（既定）**\n- 9:16、1080×1920、H.264、30fps、音声AAC\n- 字幕はセーフエリア内（上12%・下20%を避ける）\n- ロゴは w2d3 で決めた位置・サイズ・不透明度で固定\n- サムネイル用に静止画1点を同時書き出し\n- ファイル名は Week 1 の命名規則に従い `_FINAL` を付ける\n\n配信面によって仕様が変わる可能性があるため、納品前に媒体の現行仕様を1回確認する工程を入れてください。これは5分の作業で、入稿リジェクトによる1日の遅れを防ぎます。"},{"heading":"生成実費と採用率の掛け算","body":"執筆時点の公開値（確認日2026-10-11、1ドル=20クレジット）で、15秒広告1本の原価を組み立てます。\n\n**生成実費（4カット構成・想定）**\n- 静止画工程：Product Shot 2K × 30枚 = 45クレジット = **$2.25**\n- 動画工程：ここが支配項です。Marketing Studio の公開値は 8秒720p = 47.62クレジット（$2.38）、15秒720p = 89.2クレジット（$4.46）の2点のみで、**短尺の単価は公開されていません**。線形補間は推測になるため、見積では**8秒枠の47.62クレジットを1カットの単価として置く**保守的な方法を取ります。\n- 4カット × 47.62 = 190.5クレジット = **$9.52**（採用率100%の場合）\n\n**採用率を掛ける**\n- 採用率50%なら：190.5 ÷ 0.5 = 381クレジット = **$19.05**\n- 採用率33%なら：190.5 ÷ 0.33 = 577クレジット = **$28.9**\n- 採用率25%なら：190.5 ÷ 0.25 = 762クレジット = **$38.1**\n\n**15秒を1本で通す場合（カット割りをモデル側に任せる）**\n- 89.2クレジット ÷ 採用率25% = 356.8クレジット = **$17.84**\n- ただしこの方式では、1カットだけ破綻しても全体を引き直すことになるため、採用率が下がりやすい。**カット分割のほうが総額は高くても採用率が上がるなら逆転しうる**。どちらが安いかは自分の採用率次第です。\n\nこの生成実費に人件費を足した構造が、価格設計の土台になります。"},{"heading":"人件費比率と原価構造の読み方","body":"**人件費を足す**\n- 作業時間：本週の実測（企画30分＋生成90分＋検査20分＋編集40分＋書き出し10分 ≒ 3.2時間）\n- 自分の時間単価を仮に5,000円/時とすれば **16,000円**\n- 生成実費は採用率33%で約$29。為替は当日レートを自分で入れてください。\n\n**構造の読み方**　15秒広告1本の原価の大半は**人件費**です。生成実費は全体の2割以下に収まることが多い。つまり**クレジットを節約しても原価はほとんど下がらず、作業時間を縮めることが唯一の効く手**ということになります。採用率を上げる（=再生成を減らす）ことは、クレジット節約以上に**時間の節約**として効きます。この構造が、Week 5 の効率化と Week 6 の価格設計の出発点です。\n\n注意点を2つ。**Unlimited モデルや無料生成は higgsfield.ai のサイト上でのみ適用され、MCP・CLI・Canvas・Supercomputer 経由の生成は常にクレジットを消費します**。自動化を組むときは原価が変わります。また**サブスクのクレジットは毎サイクルでリセットされ繰越されません**（Enterprise を除く）ので、月内の消費計画を立てる必要があります。"}],"steps":[{"n":1,"action":"企画書9項目を埋める","detail":"対象客を1つに絞り、目的を1つ、訴求を1点だけ書きます。複数書きたくなったら、それは15秒に入らないというサインです。禁止事項は w2d4 のブランドガイドから転記します。実在確認欄には、画面に出る料理・器・設備・価格表示がすべて実在することを確認した記録を書きます。","check":"9項目が埋まり、目的と訴求がそれぞれ1つに絞られている"},{"n":2,"action":"4カットの役割と尺を秒数で割り当てる","detail":"フック／主役／文脈／締めの4カットに、合計15.0秒になるよう秒数を割ります。締めは3秒以上を確保します。各カットについて「このカットが伝える1つのこと」を1行書きます。書けないカットは不要なカットです。","check":"4カットの尺の合計が15.0秒で、各カットの伝達内容が1行ずつ書かれている"},{"n":3,"action":"絵コンテ9列を全カット分書く","detail":"カット番号／尺／ショットサイズとアングル／被写体と動き1つ／音／字幕／生成元静止画名／プロンプトID／備考（破綻リスクと対処方針）を埋めます。既に手元にある w2d2 の3カットを割り当て、足りないカットを特定します。備考欄に w2d3 の判断表から第一選択を書き込んでおきます。","check":"全カットの9列が埋まり、不足カットが特定されている"},{"n":4,"action":"不足カットの静止画を作る","detail":"文脈カットと締めカットの静止画が不足しているはずです。w2d4 のブランドガイドに従って生成します。締めカットは字幕とロゴの用地が主目的なので、動きの少ない引きの画、または余白の大きい画にします。Product Shot 2K なら1枚1.5クレジットなので、ここは枚数を惜しまず詰めます。","check":"不足分の静止画が揃い、すべてブランドガイドのパレットと光に準拠している"},{"n":5,"action":"不足カットを動画化する（目標尺＋2秒で生成）","detail":"絵コンテの尺より1〜2秒長く生成します。3.0秒必要なら5秒。この余剰が、w2d3 の「編集で尺を切る」対処の原資になります。1カットに動きは1つだけ。使用モデルは w2d2 で決めた既定の組み合わせに従います。","check":"全カットの素材が目標尺より長く揃っており、生成回数が台帳に記録されている"},{"n":6,"action":"チェックリストで全カットを検査する","detail":"w2d3 のチェックリストを全カットに適用します。等速→0.25倍速→3フレーム比較→文字拡大の4ステップです。破綻が見つかったら判断表の第一選択で対処します。再生成は2回まで。検査にかかった時間を記録してください。工数として計上する必要があります。","check":"全カットのチェックリストが埋まり、対処した破綻と方法が記録されている"},{"n":7,"action":"編集でつなぎ、尺を15.0秒に詰める","detail":"絵コンテの順でつなぎ、各カットを設計尺に切り詰めます。カットの切り替えは基本的にカット（ディゾルブは使わない）。つないだ状態で、w2d3 のカット間不整合の項目（色・器・光の方向・時間軸）を確認します。色が合わなければ生成後 Color Grading または編集側の補正で揃えます。","check":"15.0秒につながり、カット間の色と器が揃っている"},{"n":8,"action":"字幕とロゴを入れる","detail":"字幕はセーフエリア内（上12%・下20%を避ける）に収めます。文字数は1カットあたり全角15字程度を上限に。ロゴは w2d3 で決めた位置・サイズ・不透明度の数値をそのまま使います。情報（店名・場所・営業時間など）は締めカットに集約し、読める時間を確保します。","check":"字幕がセーフエリア内に収まり、ロゴが規定の数値で配置されている"},{"n":9,"action":"音をつける","detail":"BGM 1本＋SE 2〜3点の最小構成で組みます。SEはフックと締めに置きます。生成時に取得したネイティブ音声があれば、環境音として使えるか確認します。最終の音量は-18〜-14 LUFS 程度、ピークは-1dBTP 以下を目安にします。音を切った状態でも成立するか（無音再生される配信面があるため）も確認してください。","check":"BGMとSEが入り、音量が目安範囲に収まり、無音でも成立することを確認している"},{"n":10,"action":"書き出して媒体仕様を確認する","detail":"9:16・1080×1920・H.264・30fps・音声AAC で書き出し、命名規則に従って `_FINAL` を付けます。サムネイル用静止画1点も書き出します。配信予定の媒体の現行入稿仕様を1回確認し、合致していることをメモします。","check":"書き出し済みファイルとサムネイルが規則どおりの名前で保存され、媒体仕様の確認日が記録されている"},{"n":11,"action":"実質原価を試算する","detail":"本週の台帳から、静止画枚数・動画生成本数・採用本数・総消費クレジットを集計し、(a) 生成実費 (b) 採用率 (c) 採用率を掛けた実質生成原価 (d) 総作業時間 × 自分の時間単価 (e) 原価合計と人件費比率 を算出します。短尺の単価が公開されていない部分は、8秒枠の47.62クレジットを置く保守的な方法を使い、推定であることを明記します。","check":"5つの数値が算出され、人件費が原価の何割かが数字で言える"},{"n":12,"action":"6軸評価とWeek 2の振り返りを行う","detail":"完成した15秒広告に6軸評価（映像の品質・動きの自然さ・ブランド整合性・マーケ目的整合性・再現性・時間とコスト）を5段階で付け、最低点の軸と改善方針を1行書きます。加えて、Week 1 の採用率と比較して改善したかを確認します。改善していない場合、どの工程がボトルネックかを特定してください。","check":"6軸の採点と最低点の軸の改善方針があり、Week 1 との採用率比較ができている"}],"prompts":[{"label":"文脈カット（店と場所を伝える引き）","text":"[SUBJECT] the interior of a small eight-seat restaurant seen from inside, a counter with three empty stools in the foreground and a narrow window onto the alley beyond [ACTION] fine rain falling steadily in the alley outside the window, a thin curtain of steam drifting from an unseen kitchen at the left edge, nothing else moves [ENVIRONMENT] dark walnut counter, unbleached plaster wall, a rain-wet alley and a weathered tiled wall of the neighbouring building visible through the window, no signage, no menu boards, no printed surfaces, the ceiling is out of frame [CAMERA] static wide shot, eye level, 24mm equivalent, deep focus, vertical 9:16 framing with clear negative space in the lower third [LIGHT] overcast daylight falling from a thin strip of sky between buildings at 6000K as the main source, diffused reflection off the wet pavement outside, one warm 2700K practical lamp at the right edge, soft shadows, no overhead ceiling light [TEXTURE] coarse walnut grain, matte plaster, condensation at the lower edge of the window glass [STYLE] photorealistic, restrained contrast, warm neutral grade matching the brand palette, no text, no logo, no cuts, no scene change","note":"15秒の3カット目（文脈）用。人を入れずに「人の気配」を湯気と空いた席で表現している。濡れた路地と隣棟のタイル壁で立地の固有性を出し、deep focus で狭い店の奥行きを伝える。w2d4 の禁止事項（天井照明・白背景・文字）をすべて反映済み。晴天や夜の案件では窓外の描写を西日やネオンの色かぶりに差し替える。","status":"未検証","flow":{"code":"T2I","step":"単発","input":"新規。15秒の3カット目用に不足している静止画を作る。窓外の描写は案件の立地と時間帯に合わせる","output":"9:16の静止画1枚。店と立地が伝わる引きの画で、下部1/3が字幕用に空く","next":"この1枚を起点に、動きを雨と湯気だけに絞った I2V で目標尺＋2秒の動画にする"}},{"label":"締めカット（字幕とロゴの用地を作る）","text":"[SUBJECT] the signature dish placed at the upper edge of frame on its matte black plate, deliberately small in the composition [ACTION] a single faint wisp of steam, absolutely no other movement [ENVIRONMENT] the lower two thirds of the frame is an unbroken dark walnut counter surface with no objects on it, background above is a strongly defocused warm interior [CAMERA] static shot, slight high angle, 50mm equivalent, vertical 9:16 framing, the dish occupies only the top third [LIGHT] single soft key from the upper rear at 3000K, the empty counter area falls off gently to near-black without becoming pure black [TEXTURE] matte stoneware, coarse walnut grain still readable in the darker area, glossy food surface only [STYLE] photorealistic, low contrast in the lower area so overlaid text stays legible, warm neutral grade matching the brand palette, no text, no logo, no cuts","note":"締めカットは「絵」ではなく「字幕とロゴの台」として設計する。下部2/3を物のないカウンター面にし、near-black without becoming pure black と指定しているのは、真っ黒だと字が浮きすぎ、質感があると読みやすくなるため。動きを湯気1つに落として字を読む時間を確保している。","status":"未検証","flow":{"code":"T2I","step":"単発","input":"新規。15秒の4カット目用。料理を上1/3に小さく置き、下2/3を物のないカウンター面にする","output":"9:16の静止画1枚。字幕とロゴを置ける近黒の面が下2/3に確保される","next":"湯気1つだけ動く3秒以上の動画にしてから、編集工程で字幕とロゴをこの面に重ねる"}},{"label":"フックカット（最も強い質感を先頭に）","text":"[SUBJECT] an extreme close-up of the signature dish surface, filling the entire frame, the glaze of the sauce and the charred edge of the main ingredient clearly visible [ACTION] steam rising densely through the backlight for the full duration, the food itself completely still, no new elements appear [ENVIRONMENT] background is entirely out of focus and two stops darker, no recognisable objects [CAMERA] extreme close-up, 100mm equivalent macro look, very shallow depth of field, static shot with no movement, vertical 9:16 framing [LIGHT] strong backlight from behind and above at 3000K making the steam glow, weak fill from the front left only, specular highlights on the glaze [TEXTURE] glossy wet sauce, charred and slightly crisp edge, translucent lit steam, everything else matte and dark [STYLE] photorealistic, high local contrast, warm grade matching the brand palette, no text, no logo, no cuts, no scene change","note":"15秒の先頭に置く質感カット。カメラを静止させ、動きを湯気のみに限定することで採用率を優先している。半逆光で湯気を透過させるのが食品カットで最も効く構成（Week 1 Day5 の知見）。フックで何を見せるべきかという訴求設計自体は Week 4 で扱うため、ここでは「最も強い質感を先頭に置く」という構成ルールの実装に留めている。","status":"未検証","flow":{"code":"T2I","step":"単発","input":"新規。15秒の先頭用に、主役カットより寄った100mmマクロの質感カットを作り直す","output":"9:16の静止画1枚。ソースの照りと焦げ目が画面全体を埋め、湯気が透過する","next":"動きを湯気のみに絞って動画化し、0.0〜3.0秒のフックとして編集で先頭に置く"}}],"expected":"15秒・9:16・1080p・音ありの完成動画1本と、企画書1枚、絵コンテ（全カット9列記入済み）、プロンプト一式、原価試算、6軸評価が揃っている状態です。完成動画は、第三者が見て「何の店の何を売っているか」が15秒で分かり、チェックリスト上の致命的破綻がなく、4カットの色調が揃っていることが条件です。加えて、実質原価のうち人件費が何割かを数字で言え、Week 1 からの採用率の変化を把握している状態を目指します。","assignment":{"title":"【Week 2 総合課題】飲食店向け15秒広告の完成と原価試算","brief":"東京の飲食店1店向けに、15秒の広告動画を1本完成させます。企画書で目的と訴求を1つに絞り、絵コンテで4カットの尺と内容を確定させてから生成に入ってください。生成してから構成を考える順序では、使わないカットにクレジットを払うことになります。完成動画に加えて、採用率を織り込んだ実質原価と人件費比率の算出までが課題です。この原価が Week 6 の価格設計の基礎になるため、都合のよい数字に丸めず実測で出してください。","deliverables":["完成動画1本（15秒・9:16・1080p・音あり・命名規則準拠で `_FINAL` つき）","サムネイル用静止画1点","企画書1枚（9項目・目的と訴求が各1つ・実在確認欄記入済み）","絵コンテ（全カット×9列、生成元静止画名とプロンプトIDを含む）","使用プロンプト一式（7スロット形式、静止画と動画を分離）","全カットのチェックリスト結果と対処記録","実質原価の試算（生成実費・採用率・実質生成原価・作業時間×時間単価・人件費比率）","6軸評価と最低点の軸の改善方針、Week 1 との採用率比較"],"constraints":["尺は15.0秒、比率は9:16に固定する","カット数は4カットを上限とする","目的と訴求はそれぞれ1つに絞る","各カットの素材は目標尺より1〜2秒長く生成する","生成前に企画書と絵コンテを完成させ、生成中に構成を変更しない","ロゴは生成させず編集工程で合成する","画面に出る料理・器・設備・情報はすべて実在するものに限定する","作業時間は90分以内（それ以前の工程で作った素材の再利用は可）"]},"success":["完成動画が15.0秒・9:16・1080p で書き出され、音が入っている","企画書の目的と訴求がそれぞれ1つに絞られており、実在確認欄が記入されている","絵コンテの全カットに生成元静止画名とプロンプトIDが記載されている","全カットにチェックリストが適用され、致命的破綻が残っていない","4カットの色調と器がブランドガイドに準拠して揃っている","実質原価が算出され、人件費が原価の何割かを数字で言える"],"rubric":[{"axis":"映像の品質","pass":"3点＝4カットすべてが視聴に耐え、チェックリスト上の致命的破綻がない。5点＝フックカットの質感（湯気の透過・照り）が静止画より明確に強く、15秒全体で画質が落ちない。"},{"axis":"動きの自然さ","pass":"3点＝各カットで指定した動きだけが発生している。5点＝カット間で動きの速度感が揃い、15秒を通して見て疲れない。"},{"axis":"ブランド整合性","pass":"3点＝4カットの色調が揃っている。5点＝ロゴを外しても同一店の映像と判別でき、ブランドガイドの全項目に準拠していることを確認できる。"},{"axis":"マーケ目的整合性","pass":"3点＝目的と訴求が1つに絞られ、15秒で何の店の何かが伝わる。5点＝対象客の視聴文脈（当日スマホで店を探している等）に構成とカット尺が合わせられ、測定方法と交絡要因まで企画書に書かれている。"},{"axis":"再現性","pass":"3点＝企画書・絵コンテ・プロンプトが揃っている。5点＝絵コンテとプロンプトIDだけで、別メニューの2本目を他人が同じ品質で作れる。"},{"axis":"時間とコスト","pass":"3点＝実質原価と作業時間が記録されている。5点＝人件費比率を把握し、どの工程を縮めれば原価が下がるかを工程別の実測時間から特定できている。"}],"pitfalls":[{"problem":"15秒に情報を詰め込みすぎて何も伝わらない","cause":"訴求と目的を複数書いている","fix":"企画書の目的と訴求を各1つに物理的に制限する。入れたい要素が3つあるなら、15秒を3本作る。1本に詰めるのは常に失敗する。"},{"problem":"絵コンテなしで生成に入り、使わないカットに払う","cause":"手元の素材から構成を逆算しようとしている","fix":"絵コンテを先に全カット書き切り、不足カットだけを生成する。手元の素材に構成を合わせると、必要なカットが欠けたまま完成させることになる。"},{"problem":"素材を目標尺ぴったりで生成し、破綻部分を切れない","cause":"クレジットを節約しようとして最短尺で生成している","fix":"目標尺＋1〜2秒で生成する。切る余地がないと、破綻したカットは再生成しか選べなくなり、結果的に高くつく。"},{"problem":"締めカットの字幕が読めない","cause":"絵として成立する画に後から字を乗せている","fix":"締めカットは字幕の台として設計する。下部2/3を物のない面にし、動きを最小にして3秒以上確保する。真っ黒にはせず質感を残す。"},{"problem":"音を切った状態で再生され、何も伝わらなかった","cause":"BGMとSEに情報を担わせている","fix":"無音で1回通して確認する工程を入れる。情報は字幕で完結させ、音は体感品質の上乗せとして扱う。"},{"problem":"原価試算を都合よく丸めて、実際より安く見積る","cause":"採用率を実測ではなく希望値で入れている","fix":"台帳の実測採用率をそのまま使う。不採用生成を記録から外すと分母が小さくなり、原価が過小評価される。短尺の単価が非公開な部分は8秒枠を置く保守的な方法を使い、推定であることを明記する。"}],"resourceIds":["hf-academy-ad-3step","hf-academy-cinematic-ad-e2e","hf-blog-marketing-studio","hf-terms"],"nextHint":"Week 3 では被写体を宿泊施設・観光施設に移します。客室と外観の一貫性という、料理より難易度の高い課題に Elements を本格的に使います。表示や景観描写の扱いもそこで整理します。","setup":{"tag":"Week 2 総合課題","model":"下書き Seedance 2.0 Fast ／ 採用カットのみ Seedance 2.5","seconds":"4秒 × 4カット（目標尺より1〜2秒長く生成して編集で詰める）","res":"720p","aspect":"9:16","outputs":"1","cap":"静止画4枚・下書き8本・本番4本","credits":"約 217 cr（$10.83）","unlimited":"約 104 cr（$5.20）","save":"15秒を Marketing Studio で1本生成すると89.2クレジット。4秒×4カットを Seedance 2.0 Fast で下書きし、採用分だけ Seedance 2.5 に上げれば、品質を上げながら撮り直しの損失を4分の1に抑えられる。なお Seedance 2.5 は Unlimited 対象外なので、この4本だけは必ずクレジットを消費する。"}}]},{"week":3,"title":"宿泊施設・観光施設の映像制作","theme":"実在する宿を、誇張せずに魅力的に見せる","objective":"東京の宿泊施設を想定した30秒PR動画を1本完成させ、同じ宿・同じ部屋の一貫性を機能で担保し、実在施設の広告として事実と表示方法を確認する工程を制作に組み込んだ状態にする。","hours":"7.4時間（85〜90分 × 5日）","weekDeliverables":["30秒PR動画 1本（配信先仕様を満たした書き出し）","絵コンテ8枠（運動方向・明暗欄つき）","ショットリスト14列（確認必要事実・採否・生成回数つき）","ブランドガイド5章（色・光・質感・声のトーン・禁止表現）","使用プロンプト一覧と改善記録（採用率・所要時間・クレジット実消費）","確認チェックリスト12項目と表現確認シート（宿の確認欄つき）"],"outcome":"30秒の構成を1カットずつ理由を添えて説明でき、映像が主張している事実のどれを誰が確認したかを書面で示せる。","lessons":[{"id":"w3d1","day":1,"title":"宿が売るものの構造と素材の棚卸し","subtitle":"部屋単体ではなく滞在体験と立地を売るための素材設計と30秒の尺配分","why":"飲食店の映像は単価1,000〜5,000円の即決購買を後押しする道具ですが、宿泊は単価が一桁上がり、検討期間が数週間から数ヶ月あり、意思決定者が家族やグループで複数います。見る人は映像を見て買うのではなく、映像で期待値を作り、OTAの写真と口コミで検証し、価格と比較して決めます。つまり映像の役割は衝動の喚起ではなく期待値の形成です。ここを飲食と同じ発想で作ると、刺激は強いのに予約に繋がらない、あるいは期待値が実物を超えて到着後の評価が下がるという二方向の失敗が起きます。今日は宿の訴求構造を分解し、30秒に何を入れ何を捨てるかを先に決めます。","goals":["宿泊施設の訴求要素を外観・客室・食事・体験・周辺環境の5カテゴリに分解し、棚卸し表として書き出せる","顧客の宿のタイプと主要客層から、5カテゴリの比重を数値で割り振れる","東京の季節性と曜日による客層の入れ替わり、予約リードタイムを素材制作スケジュールに反映できる","30秒を8カット前後に割り、各カットの尺と生成モデルの候補を割り当てられる","設計段階でクレジット原価の概算を出せる"],"duration":"90分","timeBreakdown":[{"label":"訴求構造の理解と分解","min":25},{"label":"棚卸し表と尺配分の作成","min":45},{"label":"原価見積りと記録","min":20}],"tools":["スプレッドシート（棚卸し表・尺配分表）","Higgsfield（この日は設計中心。生成は確認用の静止画のみ）","顧客の宿の既存素材（公式サイト・OTA掲載写真・館内図・料金表）"],"prereq":["Week 1で7スロット構造のプロンプトテンプレートを作成済みであること","Week 2で商品単体カットの制作と記録のサイクルを一度回し終えていること","想定顧客となる宿を1件決めてあること（実在施設を想定してよいが、公開時は必ずWeek 3 Day 4の確認手順を通すこと）"],"theory":[{"heading":"宿は部屋ではなく時間を売っている","body":"客室の写真を並べた映像が刺さらない理由は単純で、見る人が買おうとしているものが部屋ではないからです。買おうとしているのは**チェックインから翌朝までの時間の過ごし方**であり、その時間を成立させるのが立地です。\n\n東京なら、平日のビジネス客が払っているのは「駅から濡れずに歩ける距離」「6時台に出られる朝食」「夜遅く戻っても静かに眠れること」です。部屋の広さはその次です。週末の観光客なら「目的地まで乗り換えなしで出られる立地」「荷物を置いて手ぶらで街に出られること」「歩き回った後に湯に浸かれること」になります。同じ宿で平日と週末に客層が入れ替わるのが東京の特徴で、売っている時間の中身も入れ替わります。\n\n設計の実務上の帰結は2つあります。\n\n- **時間軸でカットを並べる**と、カテゴリ別に並べるより理解が速い。夕方着→街で夕食→翌朝の出発、という流れは説明なしで伝わる\n- **時間軸の跳びは30秒で2回まで**。夜→朝→夜→昼のように往復すると、同じ宿の映像だと認識されにくくなる\n\n5カテゴリ（外観・客室・食事・体験・周辺環境）は素材を漏らさないための棚卸しの軸であって、並べる順序ではありません。棚卸しはカテゴリで、構成は時間軸で行います。この分担を混同すると、要素は揃っているのに流れが死んだ映像になります。"},{"heading":"5カテゴリの棚卸し表と宿タイプ別の比重","body":"棚卸し表は次の列で作ります。カテゴリ / ショット名 / 訴求している便益 / 既存実写の有無 / 生成で作るか / 確認が必要な事実 / 優先度（A〜C）。\n\n各カテゴリの最低確保本数の目安は、外観2・客室4・食事3・体験3・周辺環境3の計15本です。30秒に入るのは8本前後なので、**2倍の候補を作ってから落とす**のが前提です。候補が足りないと、構成の都合で弱いカットを使う羽目になります。\n\n比重は宿のタイプで変わります。\n\n- **都市型ホテル**：客室と周辺環境が重い。価格の正当化がテーマなので、素材の質感（石・木・ファブリック）の解像度と、高層階の抜けた眺望が効く\n- **ビジネスホテル**：デスクと椅子、電源とWi-Fi、大浴場やサウナ、朝食の提供時間が決め手。滞在が短く仕事が前提の客層に対して、客室の意匠よりも設備の実用性が刺さる\n- **サービスアパートメント**：キッチン・洗濯機・収納・人数あたりの寝床。長期滞在で自炊が前提なので、ビジネスホテルとはまた別の実用性の軸になる\n- **町家風の小規模旅館**：食事と主人の人柄、建物の意匠。ただし人物を扱うとDay 4の肖像と同意の論点が直撃するので、扱うかどうかを設計段階で決める\n- **ゲストハウス／ドミトリー**：共用部の雰囲気と立地の数字（駅まで徒歩何分、どの路線が使えるか）\n\n東京では、駅からの動線、エレベーターの待ち時間、大浴場の有無、朝食の開始時刻という地味なカットが、意匠のカットより強く効く場合があります。宿側が見せたいものと客が見たいものがずれているときは、OTAの口コミで言及されている語を数えて判断材料にします。"},{"heading":"東京の季節性と曜日サイクルを素材計画に落とす","body":"東京の宿の需要は季節と曜日の2軸で振れます。季節軸では、桜（3月下旬〜4月上旬）、GW、夏休み、紅葉、年末年始が繁忙で、1〜2月と6月、9月が閑散という構造です。曜日軸では、**平日はビジネス客、週末は観光客で客層が入れ替わります**。この2軸が独立して動くので、「繁忙期」という1語では計画が組めません。桜の時期の平日はビジネス客と観光客が重なって最も埋まり、1月の週末は観光需要も出張需要も薄い、という具合に濃淡が出ます。\n\n映像制作の計画に効くのは需要そのものより**予約リードタイム**です。ビジネス出張は直前化しやすく、桜やGWの観光需要は数ヶ月前から動く、という傾向が一般に言われます。ただし宿ごとの実数は必ず違うので、**顧客の予約データ（予約日と宿泊日の差の分布）を出してもらい、それを基準に逆算**してください。他人の記事の数字で計画を組むと外します。\n\n実務の段取りはこうです。\n\n- 配信開始したい時期から、顧客の平均リードタイム＋制作期間を引いた日付を素材完成の締切にする\n- ビジネス客向け素材と観光客向け素材を**同じ構成で2セット**設計する。カット割りと尺を共通にしておけば、差し替えは客室の使い方と周辺環境のカットだけで済み、2本目の制作時間が大幅に減る\n- 閑散期（1〜2月・6月・9月）は、映像を配信する時期ではなく**撮影と制作をする時期**として宿に提案する。繁忙期に宿側の確認作業を頼むと止まります\n\n季節は「桜」「紅葉」の2値ではありません。同じ春でも3月中旬の蕾と4月上旬の満開、そして散った後の葉桜は見た目が別物です。生成素材でも並木の開花状況と街路の様子を指定し、宿の実際の周辺環境と矛盾しないようにします。"},{"heading":"30秒をどう割るか","body":"基準は**1カット3〜4秒、8カット前後**です。合計30秒に対して、3.5秒×8＝28秒＋クロージング2秒という配分が扱いやすい。\n\n3秒を下限にする理由は、見る人が被写体を認識して意味を取るのに最低1.5〜2秒かかり、それを下回ると情報が通過するだけで残らないからです。4〜5秒を上限にする理由は逆で、AI生成クリップは秒数が伸びるほど被写体の形が揺れ、手や布や湯気の挙動が破綻しやすくなるためです。**破綻は尺に比例して目立ちます**。\n\nモデルの尺制約が構成に直接効きます（執筆時点）。\n\n- **Higgsfield DoP** は image-to-video 専用で**3秒または5秒**。3秒カットを素直に作れる\n- **Veo 3.1** は**4／6／8秒**。3.5秒は作れないので、4秒生成して前後を切る\n- **Seedance 2.5** は4〜30秒。Cinema Studio 4.0 は最長30秒\n- **Kling 3.0** は15秒で、**1回の生成で最大6カット**\n- **Marketing Studio** の動画は最長15秒\n\nここから出る実務ルールは「**生成尺は使用尺より1秒以上長く取る**」です。4秒生成して3.2秒使う、頭0.4秒と尻0.4秒を捨てる。生成開始直後と終了直前は動きが不安定になりやすいので、捨て代を最初から見込んで尺を決めます。この余裕がないと、使えるのに使えないテイクが大量に出ます。\n\n縦9:16と横16:9を両方出す場合は、**被写体を中央寄りに置く構図**で生成し、トリミングで両対応させるのが生成回数を最小にする作り方です。"}],"steps":[{"n":1,"action":"宿のタイプと主要客層を1行で定義する","detail":"「台東区浅草、駅徒歩4分、客室48室のビジネスホテル、平日は国内の出張客が7割、週末はインバウンドの短期滞在客が6割」のように、タイプ・立地・平日と週末の客層構成を1行で書きます。ここが曖昧だと以降の比重配分がすべて勘になります。構成比が分からない場合は宿に実数を聞き、分からないという事実も記録します。","check":"宿のタイプ・立地・平日と週末の客層が1行で書かれ、数値の根拠（宿の実データか推定か）が明示されている"},{"n":2,"action":"滞在の時間軸を書き出す","detail":"到着から出発までを時刻の列として書きます。15:00着→16:00大浴場→18:30街で夕食→21:00ロビーで作業→翌6:30朝食→7:30駅へ、のように宿の実際の運用時間に合わせます。平日客と週末客で時間軸が違うなら、どちらを主に設計するかを決めます。この列が後の構成の骨になります。","check":"到着から出発までの時間軸が、宿の実際の運用時刻で6〜10項目書かれている"},{"n":3,"action":"5カテゴリの棚卸し表を作る","detail":"外観・客室・食事・体験・周辺環境の5カテゴリで、カテゴリ／ショット名／訴求便益／既存実写の有無／生成で作るか／確認が必要な事実／優先度の7列の表を作ります。目安は合計15本以上。各行の訴求便益は「広い」ではなく「スーツケースを開いたままでもベッドと机の間を通れる」のように、客の困りごとに対応する形で書きます。","check":"15行以上の棚卸し表ができ、全行に訴求便益と優先度が入っている"},{"n":4,"action":"既存実写と突き合わせて欠落を特定する","detail":"宿の公式サイトとOTA掲載写真を棚卸し表に突き合わせ、既存実写で足りる行・解像度や季節が合わず使えない行・そもそも素材が無い行の3つに分類します。生成で埋めるのは3つ目が中心です。既存実写があるものを生成で作り直すのは、原則として無駄で、かつDay 4の捏造リスクを自分から増やす行為です。","check":"全行が3分類のいずれかに振り分けられ、生成対象の行数が確定している"},{"n":5,"action":"季節カレンダーに配信時期を置く","detail":"12ヶ月の表を作り、宿の繁忙・閑散、配信したい時期、顧客の平均予約リードタイム（宿の実データ）を並べます。東京では曜日の軸も効くので、平日と週末を分けた列を持たせます。配信開始日からリードタイムと制作期間を引いた日を素材完成の締切として記入します。宿のリードタイムデータが得られない場合は、仮値を置いた上で「要確認」と明記します。","check":"素材完成の締切日が根拠つきで1つ決まっている"},{"n":6,"action":"30秒を8カットに割る","detail":"時間軸に沿ってカット1〜8を並べ、各カットの使用尺を書きます。3.5秒×8＝28秒＋クロージング2秒を出発点に、強いカットに4秒、つなぎのカットに3秒と差をつけます。合計が30秒を超えないことを計算で確認します。","check":"カット番号・使用尺・内容が8行の表になり、合計が30.0秒以下になっている"},{"n":7,"action":"カットごとに生成モデルと生成尺を割り当てる","detail":"使用尺に対して生成尺を1秒以上長く設定し、モデルを割り当てます。3秒使用なら DoP の3秒では捨て代が取れないので DoP の5秒か Veo 3.1 の4秒、4秒使用なら Veo 3.1 の6秒か Seedance 2.5 の6秒、という考え方です。画像から動かすカットは image-to-video 前提で、先に静止画を作る工程を表に入れます。","check":"8カットすべてにモデル・生成尺・使用尺・静止画工程の有無が記入されている"},{"n":8,"action":"クレジット原価を概算する","detail":"1ドル＝20クレジット（1クレジット＝$0.05）で換算します。公開されている単価の例として Marketing Studio の動画は8秒720pで47.62クレジット（約$2.38）、15秒720pで89.2クレジット（約$4.46）、Product Shot 2Kが1.5クレジット（$0.075）です。各モデルの単価が画面で確認できる場合はその値を使い、確認できないものは実測して表に追記します。採用率の想定（1カットあたり3テイク生成して1本採用など）を掛けて、8カット分の総額を出します。","check":"8カット分の生成クレジット概算と、採用率の想定が数値で記録されている"},{"n":9,"action":"確認が必要な事実を抽出して宿に渡す質問票にする","detail":"棚卸し表の「確認が必要な事実」列を抜き出し、宿に聞く質問票にまとめます。客室の窓の方角と階数、隣棟との距離と採光、大浴場かユニットバスか、サウナの有無と宿泊者が使えるか、朝食の内容と提供形式と開始時刻、駅からの実測徒歩分数と使える路線。この質問票がDay 4で作る表現確認シートの原型になります。","check":"宿への質問が10項目以上の質問票になり、Day 4に引き継げる形で保存されている"},{"n":10,"action":"基準となる静止画を1枚だけ生成する","detail":"設計の妥当性を確認するため、最も重要なカット（多くの場合は客室か夜のエントランス）の静止画を1枚だけ生成します。ここで大量に作らないのは、Day 2で Elements に登録する基準画像を決める前に素材を散らすと、一貫性の管理ができなくなるためです。","check":"基準候補の静止画1枚と使用プロンプトが保存されている"}],"prompts":[{"label":"都市型ホテルの客室（基準画像候補・静止画）","text":"A compact corner guest room on a mid-level floor of a city hotel, low platform bed with crisp white linen and a folded grey throw, a narrow work desk against the right wall, a floor-to-ceiling window filling the left wall; outside the window the flank of a neighbouring building close by, its glass curtain wall bouncing soft reflected daylight back into the room, a sliver of street visible far below, no sky and no horizon in view; interior lit only by that reflected light plus one warm practical lamp on the desk; wide shot, eye level, 24mm equivalent, deep focus, camera static; matte plaster walls, pale oak veneer, crisp cotton weave, a faint smear of city dust on the lower glass; photorealistic architectural interior photography, restrained contrast, neutral grade with a slight cool shift outside and warm shift inside.","note":"7スロット順（被写体／動作／環境／カメラ／光／質感／スタイル）で書いている。外光を6000K系・室内灯を3000K系に分けているのが宿の客室で最も印象を左右する要素。東京の客室では隣棟のガラス面からの反射光が主光源になることが多く、直射ではなく拡散した反射として書くのが要点。可変部は窓外の隣棟の距離と素材、寝具の色、室内灯の数。窓から特定の眺望を見せていないのは意図的で、眺望はDay 4の確認が済むまで描かない方針。","status":"未検証","flow":{"code":"T2I","step":"単発","input":"新規。テキストのみで生成し、参照画像も既存実写も一切渡さない。Day 1の棚卸し表で決めた客室カットの条件を7スロットに書き下ろす","output":"客室の静止画1枚。部屋のレイアウト、窓の位置、反射光と室内灯の色温度がここで確定する","next":"Day 2の「基準客室の別角度（Location登録用・静止画）」（I2I）に参照画像として渡し、Location登録に使う"}},{"label":"早朝の路地（フック候補・静止画）","text":"A narrow back street in an old Tokyo neighbourhood just after sunrise, wet asphalt still dark from an early cleaning, a row of shuttered low-rise shopfronts receding down the frame, potted plants set out along the kerb, overhead cables crossing the strip of pale sky between the buildings; no people, no readable signage and no brand marks in shot; low morning sun striking only the upper floors at the end of the street so the near foreground stays in cool shade, the lit facades glowing warm against the blue shadow; wide shot, low angle close to the road surface, 35mm equivalent, deep focus; wet asphalt with specular streaks, weathered painted steel shutters, chipped tile plinths; photorealistic outdoor photography, cool blue shadows against warm highlights, clean grade, no lens flare artifacts.","note":"30秒の冒頭2秒に置くフック。人物と読める看板を入れていないのは、人物はDay 4の肖像の論点、看板は他店の商標が写り込む論点を避けるため。路地の狭い空から落ちる限られた光と、上層階だけが陽を受ける東京特有の明暗差を光の主役にしている。可変部は太陽高度（just after sunrise／mid morning）と路面の濡れ具合。","status":"未検証","flow":{"code":"T2I","step":"単発","input":"新規。テキストのみで生成し、参照画像は渡さない。30秒構成の冒頭2秒に置くフック候補として、太陽高度と路面の濡れ具合を振って数枚作る","output":"路地の静止画1枚。冒頭2秒のフックに使える引きの構図と、上層階だけが陽を受ける明暗差が決まる","next":"Day 3の展開部カット6のfirst frame指定、またはDay 5の冒頭カットを動かす起点画像にする"}},{"label":"夜のエントランスの灯り（クロージング候補・静止画）","text":"The entrance of a small urban hotel at blue hour, set back one step from a quiet side street, a recessed lobby glowing warm through full-height glass and spilling light across the wet pavement in front of it; the building's dark tiled facade rising out of frame above, the flank of a neighbouring building close on the right, a few distant window lights and the faint colour cast of street lighting further down the road; no signage, no shop names and no logos anywhere in frame; wide shot, slightly low eye level, 28mm equivalent, deep focus, camera static; dark glazed tile, brushed steel door frame, rain-wet pavement with long specular reflections of the interior light; photorealistic architectural photography at blue hour, deep blue ambient against warm 2700K interior light, restrained contrast, fine grain.","note":"ブルーアワーの外（青）と室内の灯り（暖色）の混在が、東京の宿の外観で最も情緒が出る条件。濡れた路面が室内光を縦に反射するので、これが夜の画で明部を作る装置になる。看板とロゴを入れないよう明示しているのは、生成モデルが文字を崩すため、かつ実在施設名を生成で描かせないため。ロゴは編集工程で実物を合成する前提。可変部は路面の濡れ具合、街灯の色かぶりの強さ、外壁の素材。","status":"未検証","flow":{"code":"T2I","step":"単発","input":"新規。テキストのみで生成する。宿の看板やロゴの画像は渡さない。ロゴは生成させず、あとの編集工程で実物を合成する前提で作る","output":"外観の静止画1枚。ロゴのない外観と、濡れた路面に室内光が反射する明るさが決まる","next":"Day 5の「クロージング差し替え用：夜のエントランスの引き」（I2V）の起点画像にして引きの動きを付ける"}}],"expected":"15行以上の素材棚卸し表、12ヶ月の季節カレンダーと素材完成締切、カット1〜8の尺配分表（モデル・生成尺・使用尺つき）、クレジット原価の概算、宿への質問票10項目以上、基準候補の静止画1枚が揃っている状態です。この時点で「30秒に何を入れないか」を3つ以上言えるようになっていれば設計は機能しています。逆に、入れたいカットが8本に収まらないまま進めると、Day 3の構成で必ず破綻します。","assignment":{"title":"宿泊施設の素材棚卸しと30秒の尺設計","brief":"東京の宿泊施設1件を想定顧客として、30秒PR動画の素材設計を完成させます。宿のタイプと平日・週末別の客層を定義し、5カテゴリで15本以上のショット候補を棚卸しし、そこから8カット前後に絞って尺とモデルを割り当ててください。既存実写で足りるものを生成で作り直さないこと、確認が必要な事実を質問票として分離することが評価の中心です。この設計がWeek 3の全日の土台になるため、途中で宿を変更しないでください。","deliverables":["宿の定義（タイプ・立地・平日と週末の客層・根拠）","5カテゴリ素材棚卸し表（15行以上・7列）","既存実写との突き合わせ結果（3分類）","12ヶ月季節カレンダーと素材完成締切","カット1〜8の尺配分表（モデル・生成尺・使用尺）","クレジット原価概算（採用率想定つき）","宿への質問票（10項目以上）","基準候補の静止画1枚とプロンプト"],"constraints":["使用尺の合計を30.0秒以内に収めること","生成尺は使用尺より1秒以上長く設定すること","カット数は6〜10本の範囲に収めること","この日は静止画生成を3枚以内に抑えること（素材の散逸を防ぐため）","作業時間は90分以内"]},"success":["棚卸し表の全行に訴求便益と優先度が入り、既存実写との突き合わせが3分類で完了している","尺配分表の使用尺合計が30.0秒以下で、全カットに生成尺と使用尺の差が1秒以上ある","全カットにモデル名と静止画工程の有無が割り当てられている","素材完成締切が、宿の予約リードタイムと制作期間からの逆算で算出されている（データが無い場合は仮値であることが明記されている）","宿への質問票に、窓の方角と階数・大浴場の有無と利用条件・朝食の提供形式と開始時刻・駅からの実測徒歩分数が含まれている"],"rubric":[{"axis":"映像の品質","pass":"3点＝基準候補の静止画が宿の実態と矛盾しない品質で生成できている。5点＝その1枚を見せれば宿側が映像全体の方向性を理解できる水準。"},{"axis":"動きの自然さ","pass":"本レッスンは設計中心のため動画生成は対象外。3点＝各カットにカメラ動作の方針が1語以上書かれている。5点＝カット間で動きの方向が衝突しない配置になっている。"},{"axis":"ブランド整合性","pass":"3点＝棚卸し表のショットが宿のタイプと客層に合っている。5点＝宿が見せたいものと客が見たいもののずれを口コミ等の根拠で指摘でき、競合が密集する立地で何を差として押すかが言語化されている。"},{"axis":"マーケ目的整合性","pass":"3点＝配信時期と素材締切が逆算されている。5点＝平日のビジネス客向けと週末の観光客向けを同一構成で2セット設計し、2本目の制作時間削減を数値で見込めている。"},{"axis":"再現性","pass":"3点＝棚卸し表と尺配分表が第三者に読める粒度で保存されている。5点＝別の宿に差し替えてもそのまま使えるテンプレートになっている。"},{"axis":"時間とコスト","pass":"3点＝8カット分のクレジット概算が出ている。5点＝採用率の想定を置いて総額のレンジ（最良／想定／最悪）を出している。"}],"pitfalls":[{"problem":"客室の意匠カットばかり集まり、立地と動線のカットが入らない","cause":"宿側の要望をそのまま棚卸しに写している。宿は自分が投資した内装を見せたいが、客が検討しているのは滞在の成立条件である","fix":"棚卸し表の訴求便益列を客の困りごと起点で書き直す。OTAの口コミで言及頻度の高い語（駅からの距離、大浴場、朝食の開始時刻、隣室の音など）を数え、言及の多い要素に優先度Aを付ける。"},{"problem":"候補カットを8本しか作らず、構成段階で弱いカットを使う","cause":"候補＝採用と考えている。生成素材は採用率が安定しないため、候補が足りないと妥協が発生する","fix":"候補は採用数の2倍（15本以上）を棚卸し段階で確保する。生成は後でよいが、設計上の候補リストはこの日に埋める。"},{"problem":"生成尺と使用尺を同じにして、頭と尻の不安定なフレームを使わざるを得なくなる","cause":"AI生成クリップの開始直後と終了直前は動きが不安定になりやすいという前提を見込んでいない","fix":"生成尺を使用尺＋1秒以上にする。モデルの選べる尺が離散値（Veo 3.1 は4／6／8秒、DoP は3／5秒）であることを尺配分表に注記し、使用尺から逆算して選ぶ。"},{"problem":"季節の指定が「春」だけで、並木の状態が宿の実際と合わない","cause":"春を1つの状態として扱っている","fix":"プロンプトで並木の状態（蕾／満開／葉桜）と路面の花びらの有無、街路樹の葉の量を指定する。配信時期の実際の植生に合わせ、3月配信素材と4月下旬配信素材を分ける。"},{"problem":"既存実写があるカットまで生成で作り直す","cause":"生成の方が早いと感じている","fix":"突き合わせの3分類を先に行い、既存実写で足りる行は生成対象から外す。実写が使えるものを生成に置き換えると、制作費が増えるだけでなくDay 4の事実確認の対象が無駄に増える。"},{"problem":"繁忙期に宿側の確認作業を依頼して制作が止まる","cause":"制作側のスケジュールだけで逆算している","fix":"季節カレンダー上で宿の繁忙期を確認工程の禁止期間として塗り、確認が必要な工程を閑散期（1〜2月・6月・9月）に寄せる。締切の逆算にこの制約を組み込む。"}],"resourceIds":["hf-academy-cinematic-ad-e2e","ind-hotel-video","jp-ryokan","hf-academy-mix-real"],"nextHint":"設計が決まると、次は同じ宿・同じ部屋が複数カットで別物に見えないようにする作業になります。Day 2では Elements への登録と参照画像の使い方、そして「前のカットの続き」を作る実際の手順を扱います。","setup":{"tag":"設計のみ","model":"手持ちのツールで可（ChatGPT / Gemini / Soul 2.0）。構図検討用の静止画のみ","seconds":"—","res":"2K","aspect":"9:16","outputs":"1","cap":"静止画6枚（この日は動画を作らない）","credits":"約 0.8 cr（$0.04）","unlimited":"0 cr","save":"棚卸しと構成設計の日。ここで30秒の設計を固めないと Day 5 で作り直すことになり、6週間で最も高い失敗になる。"}},{"id":"w3d2","day":2,"title":"同じ宿に見せる一貫性のワークフロー","subtitle":"Elements登録と参照画像で客室と外観の同一性を保ち、連続カットの回避策を習得する","why":"宿の映像で信用を失う最速の方法は、カット2とカット5の客室が別の部屋に見えることです。見る人は「どの部屋に泊まれるのか分からない」と判断し、その疑念は到着後の落胆への警戒に直結します。飲食の単品カットでは一貫性の破綻は1カット内で済みますが、宿は同じ空間を何度も見せる構造なので、破綻が必ず露出します。さらに厄介なのは、生成AIは「同じ部屋」を指示しただけでは同じ部屋を出さないという点です。一貫性は機能で担保するもので、プロンプトの言葉で頼み込むものではありません。今日はその機能の実体と限界を手で確かめます。","goals":["Elements（Characters / Locations / Props）に客室・外観・小道具を登録し、複数カットで呼び出せる","参照画像の キャラクター参照 / スタイル参照 タグと入力点数の上限を踏まえて参照セットを組める","Soul ID が同一性を学習する仕組みであり、ピクセル単位の同一ではないことを前提に人物の扱い方を判断できる","「前のカットの続き」専用機能が存在しないことを理解し、Forward/Backward Extend と最終フレーム参照の2つの回避策を実行できる","同一性が崩れたカットを、全体再生成せず部分編集で直す判断ができる"],"duration":"90分","timeBreakdown":[{"label":"一貫性機能の理解と限界の整理","min":25},{"label":"Elements登録と同一客室の複数カット生成","min":45},{"label":"連続カットの回避策の検証と記録","min":20}],"tools":["Higgsfield（Assets → Create Element に相当する機能、Cinema Studio、image-to-video）","画像編集ソフト（最終フレームの書き出し用）","スプレッドシート（参照セットと同一性の判定記録）"],"prereq":["Day 1の棚卸し表と8カットの尺配分表が完成していること","Day 1で生成した基準候補の静止画が1枚以上あること","Week 1でカメラ・光のスロット操作を一度試していること"],"theory":[{"heading":"一貫性は機能で担保する。言葉では担保できない","body":"「カット2と同じ部屋で」とプロンプトに書いても、モデルは前回の生成を覚えていません。同じ語から似た分布のものが出るだけで、家具配置も窓の位置も毎回変わります。宿の映像における一貫性は、以下の3層で作ります。\n\n**第1層：Elements への登録**（Assets → Create Element に相当）。Characters / Locations / Props の3種をプロジェクト横断で再利用できます。宿泊施設の場合、客室と外観とラウンジを **Locations**、ブランドのカップや寝具や館内着を **Props** として登録します。宿の映像で一貫性確保の中核になるのはここです。\n\n**第2層：参照画像のマルチモーダル入力**。執筆時点で Cinema Studio 4.0 と Seedance 2.5 は1回の生成で**最大50点**の入力を受けます（Seedance 2.5 の内訳は画像30・動画10・音声10、Seedance 2.0 は画像9・動画3・音声3）。参照タイプは **キャラクター・スタイル・モーション・音声の参照**。客室の同一性には キャラクター参照 ではなく **Locations に登録した要素の呼び出しと スタイル参照 の併用**が中心になります。\n\n**第3層：始点・終点フレームの指定**。Seedance は first/last frame、Veo 3.1 は first + last image、Wan 2.6 は精密な first/last 制御に対応します（執筆時点）。\n\n重要なのは、第1層だけでは足りないということです。Locations を登録しても、カメラ位置とレンズが変われば同じ部屋だと認識されにくくなります。登録＋参照＋フレーム指定を併用して初めて実務水準になります。"},{"heading":"参照セットの組み方と入力点数の使い方","body":"50点入るからといって50枚入れるのは逆効果になりがちです。参照は**役割ごとに束ねる**と管理できます。宿の客室カットなら次の構成が扱いやすい。\n\n- **空間の同一性**：同じ部屋を異なる角度から撮った（または生成した）3〜5枚。窓の位置、ベッドの向き、床材が一致していること\n- **素材と質感**：壁・床・ファブリックのクローズアップ2〜3枚\n- **色と光のトーン**：スタイル参照 として渡す1〜2枚。ここに他の宿の写真を入れてはいけません（Day 4の論点に直撃します）\n- **小道具**：Props で登録済みのものは参照から外し、登録呼び出しに任せる\n\n合計8〜10枚程度から始め、同一性が出なければ空間の同一性カテゴリの枚数を増やします。\n\n参照枚数を増やすほど良くなるわけではない理由は、矛盾する情報が混ざると平均化されるためです。**窓の位置が違う2枚**を同時に渡すと、どちらでもない窓が出ます。参照を追加する前に、既存の参照同士が矛盾していないかを確認してください。これが実務で最も時間を節約する習慣です。\n\n参照セットは必ずフォルダとスプレッドシートで管理します。どのカットにどの参照セットを使ったかの記録が無いと、1週間後に同じ部屋を追加生成できません。Week 5の効率化とWeek 6の外注は、この記録が存在することを前提にしています。"},{"heading":"Soul ID の正体を誤解しない","body":"人物を扱う場合、Soul ID が候補になります。仕様は執筆時点で次のとおりです。\n\n- **20〜80枚**の写真から人物の同一性を学習する。学習は数分で完了する\n- 1 Soul ID = 1人。ファイルとして書き出すことはできない\n- Seedance では **@ Elements → My Elements** に出現する\n\n誤解が多いのはここです。Soul ID は「**同一人物として認識できるレベル**」の同一性を再現するもので、**ピクセル単位で同じ顔が出るわけではありません**。鼻の形や目の間隔は生成ごとに微妙に揺れます。写真の同一性を期待して顧客に「同じ人が出せます」と約束すると、確認段階で揉めます。約束の文言は「同一人物として自然に見える範囲で再現できる」が正確です。\n\n宿の映像における人物の扱いについては、技術以前の判断が先に来ます。実在の従業員や宿泊客を参照素材として使うには**肖像権と本人の同意**が必要で、Higgsfield の利用規約でもアップロードする人物の肖像・音声について権利と同意が必要と定められています。生成した架空の人物を使う場合も、既存の俳優やインフルエンサーに似た人物を狙うのは別の問題を生みます。\n\n実務上の推奨は、**Week 3の課題では人物を主役にしない**ことです。後ろ姿、手だけ、遠景のシルエットで滞在の様子は十分伝わります。東京の宿は共用部と周辺の街が画に入るので、通行人が写り込む構図を避ける判断も設計段階で必要になります。顔が映る人物を入れる判断は、Day 4の確認手順を通した上で、顧客と書面で合意してから行ってください。"},{"heading":"「前のカットの続き」専用機能は存在しない","body":"ここは誤解が最も多く、営業段階で安易な約束をしやすい箇所です。**クリップAの続きをワンクリックで生成する機能は、執筆時点の Higgsfield には存在しません**。SNSで「続きを作る機能」として紹介されているものは、以下のいずれかの運用です。\n\n**回避策1：Forward / Backward Extend**（Cinema Studio 4.0）\nアップロードした動画を前方または後方に**最大30秒まで延長**します。既にあるクリップの続きを作る用途にはこれが最も近い。制約は、延長なので構図とカメラ動作が元クリップの流れを引き継ぐこと、カットを切り替える用途には向かないことです。同じカット内で尺を伸ばしたいときに使います。\n\n**回避策2：最終フレーム＋先頭フレームの参照**\nクリップAの**最終フレームを静止画として書き出し**、クリップBで作りたい状態の**先頭フレームを別に用意**して、この2枚を first/last frame として指定し、その間を生成させます。Seedance の first/last frame、Veo 3.1 の first + last image、Wan 2.6 の first/last 制御が使えます（執筆時点）。\n\nこの回避策2が、宿の映像で実際に効く場面は限定的です。「廊下を歩いて客室のドアを開ける→室内が見える」のような**空間の連続**を作るときには有効ですが、「夜の街→翌朝の駅への動線」のような時間の跳躍には不要です。むしろ時間が跳ぶカット間は、**連続させずに意図的に切る**方が自然に見えます。\n\nつまり実務では、Day 1で作った8カットのうち連続性を作る必要があるのは多くて2組です。どの組に回避策を使うかを先に決め、残りはDay 3のつなぎ方（マッチカット、明暗のつなぎ）で処理します。全カットを繋げようとすると、生成回数が倍増して原価が壊れます。"},{"heading":"崩れたカットは部分編集で直す","body":"8カット生成すると、必ず1〜2本に部分的な破綻が出ます。多いのは、客室の窓の桟の本数が違う、ベッドのリネンの折り返しが別物、ロビーのクッションの色がずれる、といった局所の不一致です。\n\nここで全体を再生成するのが、時間とクレジットを最も浪費する行動です。執筆時点で **Seedance 2.5 Edit** と **Cinema Studio 4.0 の Edit Video** は、ラベル・顔・物体・衣装などを全体再生成せずに差し替えられます。局所の不一致はこちらで処理します。\n\n判断の基準を先に決めておきます。\n\n- **部分編集で直すもの**：物の色、小物の有無、ラベルや文字、局所の質感\n- **再生成するもの**：カメラ動作そのものが意図と違う、空間のレイアウト（窓やドアの位置）が違う、光の方向が違う\n\n前者は被写体の差し替えで済みますが、後者は画の設計そのものが違うので、編集で追いかけると結局時間が掛かります。**空間と光は再生成、物と表面は部分編集**と覚えておくと判断が速くなります。\n\n編集で直した場合も、記録シートには「編集で修正した箇所」を1行書き残してください。Day 5のブランドガイドで「どの崩れが頻発するか」を集計するときに必要になります。"}],"steps":[{"n":1,"action":"基準客室の静止画を3角度で揃える","detail":"Day 1の基準候補をもとに、同じ客室を3角度（窓側から室内／ベッド側から窓／入口からの引き）で生成します。この時点で窓の位置とベッドの向きが一致するまで作り直します。ここが揃っていないと、以降のすべての一貫性作業が土台から崩れます。参照として最初の1枚を渡しながら残り2枚を生成するのが近道です。","check":"同じ客室と認識できる3枚が揃い、窓の位置・ベッドの向き・床材が一致している"},{"n":2,"action":"客室をLocationとしてElementsに登録する","detail":"Assets → Create Element に相当する機能から、Locations として客室を登録します。名称は「宿名_客室タイプ_昼」のように、時間帯と部屋タイプが識別できる規則にします。参照画像として手順1の3枚と、素材のクローズアップ2枚を添えます。UI名称は変わりうるので、見つからない場合はアセット管理からエレメント作成に相当する項目を探してください。","check":"Locations に客室が登録され、命名規則に沿った名前が付いている"},{"n":3,"action":"外観とロビーも同様に登録する","detail":"外観（ブルーアワーのエントランス）とロビーまたは朝食会場を Locations として追加登録します。外観は昼と夕の2つを別Locationとして登録するか、1つに統合して光を可変にするかを決め、その判断を記録します。登録数が増えすぎると管理が破綻するため、Week 3の課題では Locations は3〜4点までに抑えます。","check":"Locations が合計3〜4点登録され、昼夜の扱いの方針が記録されている"},{"n":4,"action":"Propsを2点登録する","detail":"宿のブランドを担保する小道具を2点（例：館内のマグカップ、館内着、ルームキーのホルダー）を Props として登録します。小道具が複数カットに繰り返し登場すると、空間が変わっても同じ宿だという認識が維持されます。ロゴ入りのものは生成させず、無地のものを登録してロゴは編集工程で合成する前提にします。","check":"Props が2点登録され、ロゴを生成に含めない方針が記録されている"},{"n":5,"action":"参照セットを役割別に組んで表に記録する","detail":"空間の同一性3〜5枚／素材と質感2〜3枚／色と光のトーン1〜2枚（スタイル参照）の3カテゴリで参照セットを組み、合計8〜10枚にします。表の列はカット番号／使用Location／使用Props／参照ファイル名／参照タイプ（キャラクター参照・スタイル参照等）。参照同士で窓の位置やレイアウトが矛盾していないかを目視で確認してから登録します。","check":"参照セットが8〜10枚で組まれ、カット別の使用記録表ができている"},{"n":6,"action":"登録済みLocationで同一客室の別カットを生成する","detail":"Day 1の尺配分表のうち、客室に属するカット（通常2〜3本）を登録済み Location を呼び出して生成します。カメラ指定だけを変え、空間の記述は Location に任せます。ここでプロンプト本文に空間の詳細を書き重ねると、Location の情報と競合して別の部屋が出ます。空間は Location、カメラと光はプロンプト、という役割分担を守ります。","check":"客室カットが2〜3本生成され、手順1の3枚と同じ部屋だと判定できる"},{"n":7,"action":"同一性を5段階で判定して記録する","detail":"生成した全カットについて、基準3枚との同一性を5段階で採点します。採点軸は窓の位置／家具レイアウト／床と壁の素材／色のトーンの4つ。3点未満の軸があるカットは、原因（参照不足か、プロンプトとの競合か、カメラ変更の幅が大きすぎたか）を1行で書きます。","check":"全カットに4軸の採点と、低評価軸の原因メモが入っている"},{"n":8,"action":"Soul IDの仕様を確認し、人物の扱いを決める","detail":"Soul ID は20〜80枚から人物の同一性を学習し、同一人物として認識できるレベルを再現する機能で、ピクセル単位の同一ではないという前提を記録します。Week 3の課題で顔が映る人物を使うかどうかを決め、使う場合は素材の出所と同意の状況をDay 4の確認シートに持ち込む項目として書き出します。推奨は後ろ姿・手元・遠景シルエットでの処理です。","check":"人物を使うか使わないかの判断が理由つきで記録され、使う場合の確認項目が書き出されている"},{"n":9,"action":"Forward/Backward Extendを1回試す","detail":"生成済みクリップ1本を Cinema Studio 4.0 の Forward/Backward Extend に相当する機能で延長します（アップロードした動画を前後に最大30秒まで延長する機能）。元クリップの構図とカメラ動作が引き継がれることを目で確認し、どういう場面に使えてどういう場面に使えないかを1行で記録します。","check":"延長後のクリップが1本でき、使える場面と使えない場面が記録されている"},{"n":10,"action":"最終フレーム参照による連結を1組だけ作る","detail":"連続性が必要な1組（例：廊下から客室に入る）を選びます。クリップAの最終フレームを静止画として書き出し、クリップBの先頭に置きたい状態の静止画を別に用意して、この2枚を first/last frame として指定し間を生成します。Seedance の first/last frame、Veo 3.1 の first + last image、Wan 2.6 の first/last 制御のいずれかを使います。1組に限定するのは、全カットで試すと生成回数が倍増するためです。","check":"1組の連結クリップができ、使用した機能名と生成回数が記録されている"},{"n":11,"action":"崩れた箇所を部分編集で1箇所直す","detail":"同一性採点で低評価だった箇所のうち、物や表面の不一致を1つ選び、Seedance 2.5 Edit または Cinema Studio 4.0 の Edit Video に相当する機能で全体再生成せずに差し替えます。空間レイアウトや光の方向の違いは編集では追いかけず再生成対象として分類し、その判断も記録します。","check":"部分編集で1箇所が修正され、編集対象と再生成対象の分類基準が記録されている"},{"n":12,"action":"一貫性ワークフローを手順書にする","detail":"ここまでの流れを「新しい宿の案件が来たときに最初の90分でやること」として手順書化します。登録するLocationの数、Propsの数、参照の枚数と内訳、同一性採点の4軸、編集と再生成の切り分け基準を数値で書きます。Week 6で外注するときの指示書になるため、自分の記憶に頼る記述を残さないでください。","check":"数値を含む一貫性ワークフロー手順書が1枚でき、第三者が読んで実行できる粒度になっている"}],"prompts":[{"label":"基準客室の別角度（Location登録用・静止画）","text":"The same compact corner guest room seen from the opposite side: camera placed beside the floor-to-ceiling window looking back into the room, the low platform bed on the right with crisp white linen, the narrow work desk and its warm practical lamp in the mid ground, the room door and a built-in pale oak wardrobe on the far wall; nothing is moving; matte plaster walls, pale oak veneer floor running toward the window, crisp cotton weave; medium wide shot, eye level, 28mm equivalent, deep focus, camera static; the window behind the camera is the only daylight source, soft reflected light off the neighbouring building falling across the floor, the warm 3000K lamp adding a second pool of light; photorealistic architectural interior photography, restrained contrast, neutral grade.","note":"Location登録に必要な3角度のうちの1枚。カメラ位置を反転させ、ベッド・デスク・ドア・ワードローブの相対位置を明示的に書くことで、空間レイアウトの同一性を参照から再現しやすくする。可変部はカメラ位置と焦点距離のみで、家具の配置語は固定部として扱う。窓外からの反射光という光源の性質も固定部に入れている。","status":"未検証","flow":{"code":"I2I","step":"単発","input":"Day 1の「都市型ホテルの客室（基準画像候補・静止画）」1枚を参照画像として添付し、カメラ位置だけを反転させた2枚目を作る。家具の配置語は固定して渡す","output":"同じ客室を窓側から見た静止画1枚。3角度のうちの1枚が揃い、空間レイアウトの同一性が確認できる","next":"3角度と素材のクローズアップを合わせてElementsのLocationに登録し、step6の客室カット生成で呼び出す"}},{"label":"大浴場の湯気（Location登録用・image-to-video）","text":"An indoor communal bath in a city hotel, a rectangular tiled pool set into a dark stone floor, a plain tiled wall behind it with a horizontal clerestory slot near the ceiling; thick steam rising continuously from the water surface and drifting slowly to the right, the water surface moving only with the steam, a slow trickle of water entering from a plain spout at the left edge; no people in frame, no signage and no readable text; medium shot, slightly high angle looking down at the water, 35mm equivalent, shallow depth of field on the far wall; lit from the right by the narrow clerestory so the steam is bright against the dark tile; wet dark stone, matte ceramic tile, water with a soft specular sheen; photorealistic, cool ambient against warm practical light, restrained contrast, fine grain, camera static for the full duration.","note":"湯気は動きの主役になるため image-to-video 向きの題材。湯気の流れる方向を右と指定しているのは、Day 3でカット間の動きの方向を揃えるため。人物を入れないのは肖像と入浴シーンの扱いを避ける判断。可変部は高窓の位置、タイルの色、湯口の形状。大浴場があるか、宿泊者が無料で使えるか、男女入替制かは宿への確認事項なので、この素材を実在施設の広告に使う前にDay 4の確認を通すこと。","status":"未検証","flow":{"code":"I2V","step":"単発","input":"大浴場の静止画1枚を起点にする。この文は新しく画像を作る指示ではなく、その1枚を動かすための動きの指定として渡す","output":"湯気が右へ流れる数秒のクリップ1本。運動方向が右に揃った大浴場の素材になる","next":"ElementsのLocationに大浴場として登録し、Day 3のマッチカット前半と展開部カット3に使う","where":"生成画面でモデルを選ぶ（image-to-video）","whereNote":"最も安く、Seedance 2.0 系・Kling 3.0・Wan 2.7 なら Unlimited 対象"}},{"label":"廊下から客室へ（最終フレーム参照による連結の後半・image-to-video）","text":"Interior of a narrow hotel corridor with dark carpet and a low warm cove light running along the wall, the camera moving forward slowly toward a closed guest room door at the end; the door handle turns and the door swings open away from the camera, revealing the daylit interior of the guest room beyond, the cool reflected daylight from the room's floor-to-ceiling window spilling into the warm corridor; slow forward dolly at walking pace, eye level, 28mm equivalent, deep focus, no handheld shake; fabric wall panels, patterned carpet, brushed metal handle, no room numbers and no readable text in frame; photorealistic, warm 2700K corridor against cool 6000K room light, restrained contrast, fine grain.","note":"クリップAの最終フレーム（ドア前）とクリップBの先頭フレーム（室内）を first/last frame に指定して間を生成する運用の、後半側の記述。ワンクリックの『続き生成』機能は存在しないため、2枚の静止画を自分で用意することが前提。可変部は廊下の長さと色温度差。廊下の暖色と客室の寒色の対比が、空間が切り替わったことを無言で伝える装置になる。室番号を描かせないのは、文字が崩れるうえ実在の部屋割りと矛盾しうるため。","status":"未検証","flow":{"code":"I2V","step":"単発","input":"2枚のフレーム（クリップAの最終フレームとクリップBの先頭フレーム）をfirst/last frameに指定する。間の動きだけを生成し、新しく画像は作らない","output":"廊下から客室へ入る連結クリップ1本。AとBの間が埋まり、空間の切り替わりが途切れずつながる","next":"クリップAとBの間に挟んで3本を1連として仮編集に渡し、同一性採点（step7）の対象にする","where":"生成画面でモデルを選ぶ（image-to-video）","whereNote":"最も安く、Seedance 2.0 系・Kling 3.0・Wan 2.7 なら Unlimited 対象"}},{"label":"Props登録用の無地マグ（静止画）","text":"A single unmarked matte ceramic mug in a warm off-white glaze, completely blank with no text, no logo and no pattern anywhere on the surface, standing on a pale oak desk edge; a faint wisp of steam above the rim; no other objects in frame; close-up, slightly above eye level, 85mm equivalent, very shallow depth of field with the background falling off to a soft blur of a bright window and the grey wall of a neighbouring building beyond; matte unglazed rim, fine ceramic surface texture, soft specular highlight along the handle; photorealistic product photography, neutral grade, soft reflected window light from the left, restrained contrast.","note":"Props として登録する小道具は必ず無地で生成する。生成モデルは文字とロゴを高確率で崩すため、ブランドロゴは編集工程で実物を合成する前提にする。可変部は釉薬の色と器の形状。この無地マグが複数カットに登場することで、空間が変わっても同じ宿だという認識が維持される。背景に隣棟の壁をぼかして置いているのは、小道具カットでも東京の客室の光の性質を揃えるため。","status":"未検証","flow":{"code":"T2I","step":"単発","input":"新規。テキストのみで生成する。宿の実物マグの写真やロゴ画像は渡さない。無地であることを条件に書き、ロゴは編集工程で合成する前提にする","output":"無地マグの静止画1枚。文字もロゴもない小道具が1点確保できる","next":"ElementsのPropsに登録し、空間の違う複数カットに繰り返し登場させて同じ宿だという認識を保つ"}}],"expected":"同じ客室と認識できる静止画3枚、Locations 3〜4点とProps 2点の登録、カット別の参照セット記録表、同一性4軸の採点表、Forward/Backward Extend で延長したクリップ1本、最終フレーム参照で連結したクリップ1組、部分編集で修正したカット1本、そして数値を含む一貫性ワークフロー手順書が揃っている状態です。「同じ部屋に見えない」と言われたときに、参照不足かプロンプト競合かカメラ変更幅かを切り分けて答えられれば到達です。","assignment":{"title":"客室と外観の一貫性確保ワークフローの構築","brief":"Day 1で設計した宿の素材について、Elements への登録と参照セットの設計を行い、同じ客室が複数カットで同一に見える状態を作ります。あわせて「前のカットの続き」を作る2つの回避策（Forward/Backward Extend と最終フレーム参照）を各1回実行し、それぞれが使える場面と使えない場面を記録してください。この回避策は顧客への説明でも誤解されやすい箇所なので、自分の言葉で説明できる状態にすることが目的です。人物を扱うかどうかの判断もこの日に確定させ、Day 4に引き継ぎます。","deliverables":["基準客室の静止画3角度","Elements登録一覧（Locations 3〜4点・Props 2点、命名規則つき）","カット別参照セット記録表（参照タイプ明記）","同一性4軸の採点表（低評価軸の原因メモつき）","Forward/Backward Extend で延長したクリップ1本と使用条件メモ","最終フレーム参照で連結したクリップ1組と生成回数記録","部分編集で修正したカット1本と編集／再生成の切り分け基準","人物の扱いに関する判断記録","一貫性ワークフロー手順書（数値を含む1枚）"],"constraints":["Locations の登録は3〜4点、Props は2点に抑えること（管理破綻を防ぐため）","参照セットは8〜10枚から始め、増やす前に参照同士の矛盾を確認すること","最終フレーム参照による連結は1組のみとすること","Props はすべて無地で生成し、ロゴを生成に含めないこと","作業時間は90分以内"]},"success":["基準客室の3角度で窓の位置・家具レイアウト・床材が一致している","Locations と Props が命名規則に沿って登録され、季節と部屋タイプが名前から判別できる","参照セット記録表に、カット番号・使用Location・参照ファイル名・参照タイプがすべて記入されている","Forward/Backward Extend と最終フレーム参照の違いを、使える場面の具体例つきで説明できる","Soul ID が同一性の学習でありピクセル単位の同一ではないことを記録し、人物の扱いの判断理由を書いている","編集で直す対象（物・表面）と再生成する対象（空間・光）の切り分け基準が数値または具体語で書かれている"],"rubric":[{"axis":"映像の品質","pass":"3点＝全カットが使用可能な品質で、空間の破綻がない。5点＝参照セットの設計により1カットあたりの生成回数が3回以内に収まっている。"},{"axis":"動きの自然さ","pass":"3点＝湯気・カーテン・ドアなどの動きに不自然な加速や消失がない。5点＝連結クリップのつなぎ目でカメラ速度が連続している。"},{"axis":"ブランド整合性","pass":"3点＝Locations と Props が複数カットで一貫して呼び出されている。5点＝Props の反復によって空間が変わっても同じ宿だと認識できる。"},{"axis":"マーケ目的整合性","pass":"3点＝一貫性の破綻が宿の信用に直結する理由を説明できる。5点＝顧客に対して『続き生成』の回避策の制約を正確に説明できる文面を用意している。"},{"
