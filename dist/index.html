io 20点バッチ | 80 | $4.00 |\n| Marketing Studio 動画 8秒 720p | 47.62 | $2.38 |\n| **Marketing Studio 動画 15秒 720p** | **89.2** | **$4.46** |\n| Product Shot 2K | 1.5 | $0.075 |\n| Poster 2K | 7.5 | $0.38 |\n| AI Influencer キャラクター | 1.12 | $0.06 |\n| Ad Multiplier（フック＋CTA、720p） | 最大140 | 約$7 |\n| Ad Multiplier（CTAのみ、720p） | 最大35 | 約$1.75 |\n\nここから読み取るべき構造は、**静止画と動画で単価が約30〜60倍違う**ことです。Product Shot 2K が1.5クレジット、Marketing Studio 動画15秒が89.2クレジット。つまり動画を1回失敗する代わりに、静止画を59回試せます。Week 1 で学んだ「静止画で詰めてから動かす」という方針は、好みの問題ではなくこの単価差から導かれる経済的な結論です。\n\n計算表には必ず **算出日と換算レート** を書きます。クレジット単価もプラン料金も為替も変わります。日付のない原価表は、半年後には誤った意思決定を導く資料になります。"},{"heading":"採用率で割り戻さない原価は全部嘘","body":"1カット分の実質クレジット原価は次の式で出ます。\n\n**実質クレジット原価 = 生成1回の単価 ÷ 採用率**\n\n採用率30%で Marketing Studio 動画15秒を作るなら、89.2 ÷ 0.3 = **297.3クレジット = 約$14.87**。採用率50%なら 178.4クレジット = 約$8.92。採用率が20ポイント変わると原価が約1.7倍動きます。価格に効く変数としては、モデル選択より採用率のほうが大きいということです。\n\n1本の動画が6カットで構成されるなら、カットごとに積みます。\n\n- 静止画段取り（Product Shot 2K、採用率40%）：1.5 ÷ 0.4 = 3.75クレジット × 6カット = 22.5クレジット\n- 動画化（Marketing Studio 15秒 720p、採用率30%）：89.2 ÷ 0.3 = 297.3 × 6 = 1,783.8クレジット\n- エンドカード（Poster 2K、採用率50%）：7.5 ÷ 0.5 = 15クレジット\n- 合計：約1,821クレジット ≒ **$91**\n\nこの数字を見て高いと感じたら、それが正しい反応です。そして打ち手は2つしかありません。**採用率を上げる**か、**カット数を減らす**か。採用率はプロンプトの型（Week 1の7スロット）と参照アセット（Elements）の整備で上がります。つまり資産への投資は、品質向上ではなく原価低減の投資として評価すべきものです。\n\n自分の台帳から実際の採用率を工程別（静止画／動画化／編集）に算出してください。全体の平均値ではなく工程別に出すことが重要です。どこで無駄が出ているかが、平均では見えません。"},{"heading":"自動化を進めるほどクレジットが効いてくる","body":"これは見落とすと計画が崩れる、最重要の注意点です。\n\n**Unlimited モデルおよび無料生成は higgsfield.ai のサイト上でのみ適用されます。MCP・CLI・Canvas・Supercomputer 経由の生成は常にクレジットを消費します。**\n\nサイト上で手作業していたときは Unlimited 枠や無料生成で実質ゼロ円だった生成が、効率化のために MCP や API に移した瞬間、1本ごとに課金対象になります。2〜4枚のバッチも各々課金です。つまり**自動化によって作業時間は下がるが、クレジット原価は上がる**という逆方向の動きが同時に起きます。\n\n計算表には経路の列を作ります。\n\n`経路（site / MCP / CLI / Canvas / Supercomputer）/ 課金（Unlimited枠適用あり or 常にクレジット消費）/ 1回単価 / 採用率 / 実質単価`\n\n判断の仕方はこうです。ある工程を自動化したときに、\n\n- 削減できる人件費 = 削減時間 × 自分の時間単価\n- 増える直接費 = その工程でサイト上の無料枠に依存していた生成回数 × 実質単価\n\n前者が後者を上回るときだけ自動化が黒字になります。例えば時間単価5,000円で、自動化により月10時間削減できるなら削減額は50,000円。一方で、サイト上で無料だった動画生成が月100回 MCP 経由になると 100 × 89.2クレジット = 8,920クレジット = $446（1ドル150円なら約67,000円）。この場合、自動化すると赤字です。\n\n結論としては、**自動化は「生成そのもの」ではなく「生成の前後の作業」から着手する**のが合理的です。素材の整理、命名、書き出し、台帳記録、納品物の組み立て。これらは人件費だけが削減され、クレジットは増えません。5日目でこの切り分けを設計します。\n\nなお生成失敗はほぼ自動返却され、Seedance 2.5 は音声ONでもクレジット増がないため、この2点は原価上の安心材料として計算表の前提欄に書いておきます。"},{"heading":"固定費の配分と損益分岐","body":"ツール月額は固定費で、本数で割るため単価が本数に反比例します。執筆時点の公式ブログ記載のプランは **Starter $15/月、Plus $49/月（年額なら$39/月）、Ultra $129/月（年額なら$99/月）** です。ただし料金ページ自体がJS描画で直接確認できず、ページのメタ情報には別の階層名も含まれるため、**プラン名は実際の画面で要確認**です。計算表には「確認日」と「画面で確認済みか」の列を持たせます。\n\nまたサブスクのクレジットは**毎サイクルでリセットされ繰越されません**（Enterpriseを除く）。使い残したクレジットは消え、月の後半に尽きれば追加購入か翌サイクル待ちで納期に影響します。**月間の生成計画をクレジット付与量に対して組む**必要があります。なお第三者情報（Layer3Labs）ではプラン別クレジットを約200／1,000／3,000としていますが、これは**一次情報未確認**です。計算表では「第三者情報・未確認」と明記し、実際の付与量は自分の画面で確認した数値に置き換えてください。\n\n固定費の配分式と損益分岐はこうなります。\n\n- 1本あたり固定費 = 月額固定費合計 ÷ 月間納品本数\n- 1本あたり総原価 = 実質クレジット原価 + 人件時間原価 + 1本あたり固定費\n- 1本あたり粗利 = 単価 − 1本あたり総原価\n- **損益分岐本数 = 月額固定費合計 ÷（単価 − 1本あたり変動費）**\n\n月額固定費が合計25,000円、単価80,000円、1本あたり変動費が40,000円（クレジット＋人件）なら、損益分岐は 25,000 ÷ 40,000 = 0.63本。月1本で固定費は回収できます。\n\n注意すべきは、**人件時間原価を変動費に入れること**です。自分の時給を0円で計算すると全部黒字に見え、実態は自分の時間を無償で投入しているだけになります。時間単価の基準は「その時間を他の仕事に使ったら得られる金額」です。"},{"heading":"人件時間の内訳を工程別に持つ","body":"AI動画制作の原価の大半は、実はクレジットではなく時間です。計算表には工程別の時間列を持ちます。\n\n- **ディレクション時間**：顧客ヒアリング、訴求の設計、カット割、絵コンテ、確認のやり取り。1本あたり何分かを実測します。受注1件目は長く、型ができると短くなります。この短縮分がノウハウの価値です。\n- **生成時間**：プロンプト作成、生成、選別。待ち時間は並行作業できるため、実作業時間と経過時間を別列で持ちます。待ち時間を原価に入れると過大になります。\n- **編集時間**：2日目で実測した6工程（字幕台本／字幕実装／音とライセンス記録／テンポ調整／エンドカード／3比率書き出し）の合計。\n- **品質判定時間**：3日目で実測したチェックリスト適用時間 × 納品尺・比率の本数。\n- **修正対応時間**：修正1回あたりの実測分数 × 契約上の回数。これを原価に入れていない見積は必ず赤字になります。3日目で定義した修正1回の範囲が、ここの見積精度を決めます。\n- **管理時間**：納品物の組み立て、台帳記録、請求。1本あたり20〜40分程度を見込み、実測で置き換えます。\n\n各工程の分数に自分の時間単価を掛けて金額化します。重要なのは、**どの工程が時間を食っているか**を金額で見ることです。編集が全体の50%を占めるなら、5日目で最初に外注を検討すべき工程はそこです。ディレクションが50%なら、それは外注できない（判断だから）ので、型を作って短縮する以外に手がありません。時間の内訳は、そのまま外注設計の入力値になります。"}],"steps":[{"n":1,"action":"計算表の前提欄を作る","detail":"表の最上部に前提ブロックを置きます。項目は `算出日 / 為替レート（1ドル=◯円）/ レート参照元 / クレジット換算（1クレジット=$0.05）/ 契約プランと月額 / 月間クレジット付与量（画面確認済みか）/ 自分の時間単価（円/時）`。プラン名は実画面で確認し、確認済みかどうかの列に印を付けます。","check":"前提欄が全項目埋まり、未確認の項目に「要確認」の印が付いている"},{"n":2,"action":"台帳から工程別の採用率を算出する","detail":"Week 1 から蓄積した制作台帳を使い、静止画生成／動画化／エンドカードの3工程それぞれについて、採用カット数 ÷ 生成回数 を計算します。全体平均ではなく工程別に出します。サンプル数が10件未満の工程は「暫定」と記し、以後の案件で更新する前提にします。","check":"3工程すべてに採用率の数値が入り、サンプル数が併記されている"},{"n":3,"action":"生成単価表を作成して経路列を付ける","detail":"公開単価（Product Shot 2K 1.5、Poster 2K 7.5、Marketing Studio 動画15秒720p 89.2、同8秒720p 47.62、Ads Studio 静止画1点 4、Ad Multiplier 最大140）を行として入れ、各行に経路列（site / MCP / CLI / Canvas / Supercomputer）と課金条件列を付けます。サイト上以外は常にクレジット消費と明記します。","check":"全行に経路と課金条件が入り、サイト以外の経路でUnlimited適用なしと記録されている"},{"n":4,"action":"実質クレジット原価を計算する","detail":"各生成物について `実質単価 = 公開単価 ÷ 採用率` を計算します。次に自分の標準的な1本の構成（例：6カット＋エンドカード）に対して、工程ごとの実質単価 × 必要点数を積み上げ、1本あたりの総クレジットとUSD、円換算を出します。","check":"1本あたりの総クレジット・USD・円が算出され、計算式がセル内に残っている"},{"n":5,"action":"工程別の人件時間を実測値で埋める","detail":"ディレクション／生成（実作業と待ち時間を分離）／編集6工程／品質判定／修正対応／管理の各工程に、2日目・3日目の実測値と台帳の記録から分数を入れます。実測がない工程は見込み値を入れ、「見込み」と印を付けて次案件で置き換えます。","check":"全工程に分数が入り、実測と見込みが区別されている"},{"n":6,"action":"時間を金額化して変動費を確定する","detail":"各工程の分数 × 自分の時間単価 ÷ 60 で金額を出し、合計を人件時間原価とします。これに実質クレジット原価を足したものが1本あたり変動費です。待ち時間は原価に算入せず、別列で経過時間として保持します。","check":"1本あたり変動費が円で確定し、クレジット分と人件分の比率が出ている"},{"n":7,"action":"固定費を列挙して月額合計を出す","detail":"Higgsfield のプラン月額（年額契約なら月換算）、編集ソフト、クラウドストレージ、音源・効果音サービス、フォントライセンス、通信費など、制作に必要な固定費を列挙し月額合計を出します。年額契約は月換算した値と、途中解約時の扱いを備考に書きます。","check":"固定費が項目別に列挙され、月額合計が円で出ている"},{"n":8,"action":"月間本数シナリオ別に単価を計算する","detail":"月間納品本数を1本／3本／5本／10本の4シナリオで置き、各シナリオの `1本あたり固定費 = 月額固定費 ÷ 本数` と `1本あたり総原価 = 変動費 + 1本あたり固定費` を計算します。本数が増えるほど固定費負担が下がる曲線を数値で確認します。","check":"4シナリオすべてで1本あたり総原価が算出されている"},{"n":9,"action":"クレジット付与量に対する生成計画の上限を確認する","detail":"月間クレジット付与量を、1本あたりの総クレジットで割り、月に何本まで付与枠内で作れるかを計算します。クレジットは毎サイクルでリセットされ繰越されないため、上限を超える月は追加購入かプラン変更が必要になります。上限本数を計算表に明記します。","check":"付与枠内で制作可能な月間本数の上限が数値で出ている"},{"n":10,"action":"自動化による原価変動を試算する","detail":"現在サイト上で生成している工程のうち、Unlimited枠や無料生成に依存している回数を台帳から拾います。これを MCP・CLI 経由に移した場合の追加クレジット費を計算し、同時に削減できる作業時間 × 時間単価と比較します。黒字になる工程と赤字になる工程を分けて記録します。","check":"自動化が黒字になる工程と赤字になる工程が、金額差つきで区別されている"},{"n":11,"action":"損益分岐本数を算出する","detail":"仮の単価を1つ置き（Week 6 で確定するため暫定値でよい）、`損益分岐本数 = 月額固定費合計 ÷（単価 − 1本あたり変動費）` を計算します。単価を3水準で置き、それぞれの分岐本数と、月5本受注時の粗利額・粗利率を出します。","check":"単価3水準それぞれの損益分岐本数と粗利率が算出されている"},{"n":12,"action":"感度分析で原価を最も動かす変数を特定する","detail":"採用率を±10ポイント、カット数を±2、修正回数を±1、為替を±10円動かしたとき、1本あたり総原価が何%変わるかを計算します。最も影響の大きい変数を特定し、改善の優先順位を決めます。この結果を5日目の標準化・外注設計の入力にします。","check":"4変数の感度が%で出て、影響の大きい順に並べられている"}],"prompts":[{"label":"原価計算表の前提ブロック記述形式","text":"[COST MODEL | VER: 3 | CALCULATED: ----/--/-- | CURRENCY ASSUMPTION: 1 USD = {{JPY_RATE}} JPY | RATE SOURCE: {{SOURCE}}]\nCREDIT RATE: 1 credit = 0.05 USD (1 USD = 20 credits) | source: official, checked 2026-10-11\nPLAN: {{PLAN_NAME}} | {{MONTHLY_USD}} USD/month | screen-verified: {{YES_NO}} | note: plan names must be verified in the live account screen\nMONTHLY CREDIT GRANT: {{CREDITS}} | screen-verified: {{YES_NO}} | third-party figures (approx 200 / 1000 / 3000) are UNVERIFIED and must not be used as fact\nCREDIT ROLLOVER: none (resets each cycle, Enterprise excepted)\nFAILED GENERATION: refunded automatically in most cases\nAUDIO ON (Seedance 2.5): no additional credit cost\nUNLIMITED / FREE GENERATION: applies on higgsfield.ai site only. MCP / CLI / Canvas / Supercomputer always consume credits.\nMY HOURLY RATE: {{JPY_PER_HOUR}} JPY/hour | basis: {{BASIS}}","note":"原価計算表の最上部に置く前提ブロックの固定書式。為替・クレジット単価・プラン・付与量・繰越なし・失敗時返却・音声追加費なし・経路による課金差・自分の時間単価の9点を必ず持つ。screen-verified 列を置くのが要点で、一次情報で確認していない数値がどれかが一目で分かる。第三者情報は UNVERIFIED と明記し、断定して使わない。この表を半年後に見た自分が、どの前提が古いかを判断できるようにするための書式。","status":"未検証","flow":{"code":"DOC","step":"工程1 / 3","input":"アカウント画面で実際に目視確認したプラン名・月額・クレジット付与量、当日の為替レート、自分の時間単価","output":"9点の前提が埋まり、未確認値が screen-verified 列で判別できる前提ブロック","next":"この下に生成単価表を接続する。UNVERIFIED の値は断定して使わない"}},{"label":"生成単価と実質原価の行形式","text":"ASSET TYPE | ROUTE | BILLING | UNIT CREDITS | UNIT USD | ADOPT RATE | EFFECTIVE CREDITS | QTY PER VIDEO | SUBTOTAL CREDITS\nProduct Shot 2K | site | unlimited may apply | 1.5 | 0.075 | 0.40 | 3.75 | 6 | 22.5\nProduct Shot 2K | MCP | always billed | 1.5 | 0.075 | 0.40 | 3.75 | 6 | 22.5\nMarketing Studio video 15s 720p | site | always billed | 89.2 | 4.46 | 0.30 | 297.3 | 6 | 1783.8\nPoster 2K | site | unlimited may apply | 7.5 | 0.38 | 0.50 | 15.0 | 1 | 15.0\nAd Multiplier CTA only 720p | site | always billed | 35 | 1.75 | 0.60 | 58.3 | 0 | 0","note":"実質原価の計算行の形式。EFFECTIVE CREDITS = UNIT CREDITS ÷ ADOPT RATE をセルの数式として残すこと。同じ生成物を site と MCP の2行で持つのは、自動化したときの原価変動を同じ表の中で比較できるようにするため。BILLING 列の always billed と unlimited may apply の区別が、5日目の自動化判断の根拠になる。ADOPT RATE は自分の台帳の実測値で置き換え、サンプル数10件未満は暫定と印を付ける。","status":"未検証","flow":{"code":"DOC","step":"工程2 / 3","input":"前提ブロックのクレジット単価と、自分の生成台帳から算出した素材種別ごとの実測採用率・単位クレジット数","output":"素材種別ごとの実質クレジット原価と1本あたり小計が入った単価表","next":"Day 5 の自動化判断と Week 6 Day 2 の原価積み上げに数値を渡す"}},{"label":"工程別時間と金額化の行形式","text":"PHASE | MEASURED_MIN | SOURCE (measured/estimated) | HOURLY_JPY | COST_JPY | SHARE_OF_LABOR\nDirection (hearing, cut plan, storyboard) | {{MIN}} | measured | {{RATE}} | {{COST}} | {{PCT}}%\nGeneration - active work only | {{MIN}} | measured | {{RATE}} | {{COST}} | {{PCT}}%\nGeneration - waiting (not costed) | {{MIN}} | measured | 0 | 0 | excluded\nEdit: subtitle script | {{MIN}} | measured | {{RATE}} | {{COST}} | {{PCT}}%\nEdit: subtitle implementation | {{MIN}} | measured | {{RATE}} | {{COST}} | {{PCT}}%\nEdit: audio and license log | {{MIN}} | measured | {{RATE}} | {{COST}} | {{PCT}}%\nEdit: pacing | {{MIN}} | measured | {{RATE}} | {{COST}} | {{PCT}}%\nEdit: end card | {{MIN}} | measured | {{RATE}} | {{COST}} | {{PCT}}%\nEdit: 3-aspect export | {{MIN}} | measured | {{RATE}} | {{COST}} | {{PCT}}%\nQC checklist application x {{N_FILES}} | {{MIN}} | measured | {{RATE}} | {{COST}} | {{PCT}}%\nRevision handling x {{N_ROUNDS}} | {{MIN}} | estimated | {{RATE}} | {{COST}} | {{PCT}}%\nAdmin (assembly, ledger, invoice) | {{MIN}} | estimated | {{RATE}} | {{COST}} | {{PCT}}%","note":"人件時間を工程別に金額化するための行形式。待ち時間を別行にして0円で扱うのが要点で、ここを原価に入れると過大になる。SHARE_OF_LABOR 列が5日目の外注設計の優先順位を決める。シェアの大きい工程から順に、判断か作業かを切り分けて外注候補にする。SOURCE 列で実測と見込みを区別し、見込みの行は次案件で必ず実測に置き換える。修正対応は3日目で定義した1回の範囲に対応した分数を入れる。","status":"未検証","flow":{"code":"DOC","step":"工程3 / 3","input":"ストップウォッチで実測した工程別の所要分数（待ち時間は0円の別行）と、前提ブロックで決めた自分の時間単価","output":"工程別の金額と人件時間シェアが入った、1本あたりの変動費の表","next":"シェアの大きい工程から順に Day 5 の外注・自動化の候補に並べる"}}],"expected":"1枚の計算表に、前提（算出日・為替・クレジット単価・プラン・付与量・時間単価）、工程別採用率、生成単価と実質原価、工程別人件時間と金額、固定費、月間本数4シナリオの1本あたり総原価、付与枠内の月間上限本数、自動化による原価変動、単価3水準の損益分岐本数、4変数の感度分析が入っています。すべてのセルに計算式が残り、前提を1箇所変えれば全体が再計算される状態になっています。原価が最も動く変数を1つ名指しできれば合格です。","assignment":{"title":"実測ベースの制作原価・時間計算表の完成","brief":"Week 1 から蓄積した台帳と、2日目・3日目の実測時間を入力にして、1本あたりの原価を円で確定させます。推測値を使った箇所には必ず「見込み」「暫定」「要確認」の印を付け、どこが不確かかを明示してください。対象は自分が今後標準商品にしようとしている構成（例：宿泊施設向け30秒＋15秒＋6秒の3尺、3比率展開）です。この表はWeek 6の価格設計で単価の根拠として使うため、前提を1箇所変えたら全体が再計算される構造にしてください。数式を手打ちの固定値で潰すと、表の寿命が1回で終わります。","deliverables":["原価計算表の前提ブロック（算出日・為替・レート参照元・クレジット単価・プランと月額・付与量・画面確認済みか・時間単価）","工程別採用率（静止画／動画化／エンドカード、サンプル数併記）","生成単価・実質原価表（経路列と課金条件列つき、EFFECTIVE = 単価÷採用率の数式残し）","工程別人件時間と金額化の表（待ち時間を別行で除外、実測／見込みの区別つき）","固定費一覧と月額合計","月間本数4シナリオ（1／3／5／10本）別の1本あたり総原価","クレジット付与枠内で制作可能な月間上限本数","自動化による原価変動の試算（黒字工程と赤字工程の区別、金額差つき）","単価3水準別の損益分岐本数と月5本時の粗利率","感度分析（採用率±10pt／カット数±2／修正回数±1／為替±10円）"],"constraints":["為替レートと算出日を明記しない計算表は未完成として扱う","自分の時間単価を0円として計算しない","一次情報で確認していない数値には「要確認」または「第三者情報・未確認」と明記する","セル内の計算式を固定値に置き換えない","作業時間は90分以内。新規の映像生成は行わない"]},"success":["前提ブロックに算出日・為替レート・レート参照元・時間単価がすべて記入されている","実質原価がすべて `公開単価 ÷ 採用率` の数式としてセルに残っている","サイト上とMCP・CLI経由で課金条件が異なることが経路列に反映されている","月間本数4シナリオで1本あたり総原価が算出され、本数増による単価低下が数値で確認できる","感度分析の結果、原価を最も動かす変数が特定され順位付けされている"],"rubric":[{"axis":"映像の品質","pass":"3点＝品質水準（モデル・解像度）の選択が原価表の行として表現されている。5点＝品質を1段上げた場合の原価増を数値で示し、単価への転嫁可否を判断している。"},{"axis":"動きの自然さ","pass":"3点＝動画生成の採用率を実測で持っている。5点＝動きの破綻による不採用と、構図・色による不採用を分けて集計し、原因別に改善余地を金額化している。"},{"axis":"ブランド整合性","pass":"3点＝ブランド固有の資産（Elements・プロンプト）の作成コストが表に入っている。5点＝顧客別に資産の回収状況を計算し、2件目以降の原価低下を数値で示している。"},{"axis":"マーケ目的整合性","pass":"3点＝尺別・比率別の本数が原価表に反映されている。5点＝配信面ごとの必要本数から原価を逆算し、どの面への展開が費用対効果で優先されるかを判断している。"},{"axis":"再現性","pass":"3点＝計算式がセルに残り前提変更で再計算される。5点＝他人が前提ブロックの数値だけを自分の値に差し替えて、そのまま自分の原価表として使える構造になっている。"},{"axis":"時間とコスト","pass":"3点＝1本あたり総原価が円で確定し、クレジット分と人件分の比率が出ている。5点＝感度分析から改善優先順位を決め、自動化の黒字・赤字工程を金額差つきで区別している。"}],"pitfalls":[{"problem":"原価を公開単価そのままで計算し、受注後に赤字になる","cause":"採用率で割り戻していない。1回で採用カットが出る前提になっている","fix":"実質単価 = 公開単価 ÷ 採用率 を数式としてセルに入れる。採用率は台帳から工程別に実測し、サンプル数10件未満は暫定と印を付ける。採用率30%なら Marketing Studio 動画15秒の実質単価は89.2ではなく297.3クレジットになることを表の上で確認する。"},{"problem":"自動化したら作業は楽になったのに利益が減った","cause":"サイト上の Unlimited枠や無料生成に依存していた生成を MCP・CLI 経由に移し、全件が課金対象になった","fix":"生成単価表に経路列と課金条件列を置き、サイト以外は常にクレジット消費と明記する。自動化判断は「削減時間 × 時間単価」対「増える直接費」の比較で行う。自動化は生成そのものではなく、素材整理・命名・書き出し・台帳記録・納品物組み立てといった生成の前後の作業から着手する。"},{"problem":"月の後半にクレジットが尽きて納期が守れない","cause":"クレジットが毎サイクルでリセットされ繰越されないため計画が必要なのに、月間生成計画を付与量に対して組んでいない","fix":"月間クレジット付与量 ÷ 1本あたり総クレジット で付与枠内の上限本数を算出し、計算表に明記する。上限を超える受注が入る月は、着手前にプラン変更か追加購入の判断をする。付与量は第三者情報を使わず、自分のアカウント画面で確認した値を使う。"},{"problem":"全部黒字に見えるのに現金が増えない","cause":"自分の時間単価を0円として計算しており、人件時間原価が変動費に入っていない","fix":"時間単価を「その時間を他の仕事に使ったら得られる金額」で設定し、工程別の実測分数に掛けて金額化する。待ち時間は別行で0円扱いにして過大計上を避ける。管理時間と修正対応時間を入れ忘れると、ここでも実態より良く見えるため必ず行を作る。"},{"problem":"半年後に原価表を見たら数字が合わず作り直しになる","cause":"算出日・為替レート・レート参照元を書いていない。プラン料金やクレジット単価の変更に追随できない","fix":"前提ブロックに算出日・為替レート・参照元・クレジット単価・プラン・付与量・画面確認済みかを持たせる。プラン名は実画面で確認し、未確認項目には要確認の印を付ける。前提ブロックの数値を変えれば全体が再計算される構造を維持し、固定値での上書きを禁止する。"},{"problem":"修正対応で原価が見積の倍になる","cause":"修正1回あたりの実測時間を持っておらず、契約回数分の工数が原価に入っていない","fix":"修正1回あたりの実測分数を記録し、3日目で定義した修正回数を掛けて変動費に算入する。実測前は見込み値を入れて「見込み」と印を付け、1案件目の実績で置き換える。感度分析で修正回数±1の影響を%で出し、回数の契約条件が原価にどれだけ効くかを把握する。"}],"resourceIds":["hf-help-credits","hf-help-plans","hf-mcp","hf-pricing"],"nextHint":"明日は今日出した感度分析と工程別の時間シェアを使って、どの工程を手放し、どの工程を自分に残すかを設計します。制作マニュアルの目次を完成させて週を締めます。","setup":{"tag":"生成なし","model":"—（原価と時間の計算表）","seconds":"—","res":"—","aspect":"—","outputs":"—","cap":"生成なし","credits":"クレジット消費なし","unlimited":"—","save":"Week 1 から記録してきた台帳をここで集計する。MCP・CLI・Canvas・Supercomputer に加え、Marketing Studio などの Studio 系も Unlimited の対象外で常に課金される。自動化の試算にこれを必ず織り込む。"}},{"id":"w5d5","day":5,"title":"標準化・外注化・自動化の設計と制作マニュアルの完成","subtitle":"判断は自分に残して作業は渡す。渡せる形の文書に落として週を締める","why":"ここまでの4日で素材管理・編集手順・品質判定・原価が文書になりました。残っているのは、それを「自分がやらなくても回る形」に組み替える作業です。飲食店で店長が全シフトに入っている状態は、売上が立っていても事業としては脆い。映像制作も同じで、あなたが毎本に手を入れている限り、受注上限は自分の稼働時間で決まり、価格も時間単価の延長から抜け出せません。今日やるのは、工程を判断と作業に切り分け、作業側を他人かツールに渡せる指示書にすることです。これが週の成果物である制作マニュアルの本体になります。","goals":["全工程を判断工程と作業工程に切り分け、切り分けの基準を自分の言葉で定義できる","4日目の時間シェアと感度分析から、外注・自動化の優先順位を金額根拠つきで決められる","W1の7スロットテンプレートとW5の品質チェックリストを組み合わせた外注指示書を作成できる","自動化候補を課金経路の観点で選別し、黒字になる工程だけを対象に設計できる","品質ゲートを段階ごとに設置し、不合格時の差し戻し手順を規定できる","制作マニュアルの目次を完成させ、各章にWeek 1〜5の成果物を割り当てられる"],"duration":"90分","timeBreakdown":[{"label":"理解","min":25},{"label":"切り分けと指示書作成","min":40},{"label":"マニュアル目次の完成","min":25}],"tools":["スプレッドシート（工程切り分け表・外注指示書）","4日目の原価計算表（時間シェアと感度分析）","3日目の品質チェックリストと納品テンプレート","Higgsfield（MCP／API コンソールの確認。自動化候補の技術的可否の判定）"],"prereq":["4日目の原価計算表に工程別の時間シェアと感度分析が入っていること","3日目の品質チェックリスト（致命／軽微の重みつき）が完成していること","Week 1 の7スロットプロンプトテンプレートが手元にあること","1日目のプロンプトライブラリの管理形式が運用されていること"],"theory":[{"heading":"判断は残す、作業は渡す","body":"切り分けの基準は1つです。**その工程の出力が、同じ入力から誰がやっても同じになるか**。同じになるなら作業、ならないなら判断です。\n\n- **判断工程**（自分に残す）：顧客の課題の特定、訴求軸の決定、カット割の設計、致命項目の最終判定、価格の決定、表現の事実確認の責任。これらは入力が同じでも、経験と文脈によって出力が変わります。渡すと品質が落ちるのではなく、**責任が渡らない**ので事故が起きます。\n- **作業工程**（渡す）：命名とファイル配置、プロンプトテンプレートへの値の埋め込み、生成の実行と一次選別、字幕の実装、音の尺合わせ、3比率の書き出し、台帳への記録、納品物の組み立て。手順書と判定基準があれば出力が揃います。\n- **境界にある工程**：生成物の一次選別は、致命項目のチェックリストがあれば作業に落ちます。基準がなければ判断です。つまり**基準を書くことで判断を作業に変換できる**。これが標準化の実体です。\n\n厨房のオペレーションと同じ構造です。味の設計とメニュー決定は店長の仕事で、仕込みと盛り付けはレシピと盛り付け写真があれば渡せます。渡せないのは、レシピがない料理です。映像制作で渡せないのは、基準が言語化されていない工程です。\n\n切り分け表の列はこれです。`工程 / 入力 / 出力 / 判断or作業 / 判定基準の文書名 / 現在の所要分 / 時間シェア% / 外注可否 / 自動化可否 / 優先順位`。4日目で出した時間シェアをここに持ってきて、シェアの大きい作業工程から順に手放します。"},{"heading":"優先順位は時間シェアと感度で決める","body":"手放す順番を感覚で決めると、楽になった気はするのに原価が下がらないという結果になります。順番は4日目の数字で決めます。\n\n**判定式**：期待削減額 = その工程の時間シェア% × 1本あたり人件時間原価 × 月間本数 − 外注費または自動化の追加直接費\n\n例えば1本あたり人件時間原価が40,000円、月5本、編集6工程の時間シェアが合計45%なら、編集工程の月間人件費は 40,000 × 0.45 × 5 = **90,000円**。これを外注して月60,000円で済むなら、月30,000円の改善です。一方、ディレクションの時間シェアが30%でも、判断工程なので外注対象から外れます。削減手段は型を作って短縮することだけです。\n\n4日目の感度分析も使います。原価を最も動かす変数が採用率だった場合、優先すべきは外注ではなく**プロンプトライブラリと Elements の整備**です。採用率が30%から50%に上がれば、Marketing Studio 動画15秒の実質単価は 297.3クレジットから178.4クレジットへ、つまり**40%下がります**。これは外注による人件費削減より大きい効果になることがあります。\n\n順位付けのルールはこうします。①感度の高い変数に直接効く施策を最優先 ②時間シェアの大きい作業工程の外注 ③作業工程の自動化（ただし課金経路を確認してから） ④判断工程の型化による短縮。この順で並べると、金額の大きい改善から着手できます。"},{"heading":"外注指示書は既存の成果物の組み立てで作る","body":"外注指示書を白紙から書く必要はありません。すでに作ってあるものを組み合わせるだけです。\n\n**外注指示書の構成（6部）**\n1. **案件情報**：顧客コード、案件コード、納品尺と比率、納期、連絡経路。1日目の顧客コード台帳から引く。\n2. **プロンプト指示**：Week 1 の7スロットテンプレート（被写体／動作／環境／カメラ／光／質感／スタイル）に値を埋めた完成形を、カット単位で渡す。1日目のプロンプトライブラリ管理ヘッダ（ID・版・エンジン・比率・依存アセット・最終検証日・採用率）を付けたまま渡すと、外注者がどの面で何に使うプロンプトかを判断なしに理解できます。**プロンプトを書かせるのではなく、埋めた完成形を渡す**。プロンプトの設計は判断工程です。\n3. **使用アセット指定**：Elements の資産ID、参照画像の保管パス。1日目の資産台帳から引く。\n4. **技術仕様**：比率別の解像度・fps・コーデック・ビットレート・ラウドネス基準値・書き出しプリセット名。3日目の納品技術仕様表そのもの。\n5. **品質ゲート**：3日目の品質チェックリストの致命項目のみを抜き出した簡易版。外注者には致命項目の判定を求め、軽微項目は自分が最終確認します。\n6. **納品形式と記録義務**：ファイル命名規則、提出先フォルダ、台帳に記録すべき項目（生成回数・消費クレジット・所要時間・不採用理由）。\n\nつまり**Week 1 の7スロットテンプレートとWeek 5の品質チェックリストが、そのまま外注指示書の中核になります**。新規に書くのは案件情報と納期だけです。粒度が足りない文書は、ここで露呈します。\n\nもう1点。**外注化の前に必ず自分で10本作ってください**。採用率の実測値がないと外注者の成果が良いのか悪いのか判定できず、失敗の種類を知らないと致命項目に抜けが出て、所要時間の実測がないと外注費の妥当性が判断できず言われた金額で払うことになります。10本は、工程別の採用率がサンプル数10件を超えて暫定から実測に変わる水準です。"},{"heading":"自動化は課金経路を見てから選ぶ","body":"4日目で扱った最重要の注意点を、ここで設計に落とします。\n\n**Unlimited モデルおよび無料生成は higgsfield.ai のサイト上でのみ適用され、MCP・CLI・Canvas・Supercomputer 経由の生成は常にクレジットを消費します。** 2〜4枚のバッチも各々課金です。自動化候補を2群に分けます。\n\n**A群：クレジットを増やさない自動化（優先して着手）**\n- ファイルの命名変更と所定フォルダへの配置\n- 台帳への記録（生成履歴の転記、消費クレジットの集計）\n- 比率別の書き出しのバッチ処理（編集ソフト側の機能）\n- 納品物一式の組み立てとファイル一覧の生成\n- 品質チェックリストの判定記録フォームと集計\n- プロンプトライブラリからの値の差し込み（生成は含まない）\n\n**B群：クレジットを増やす自動化（原価を試算してから判断）**\n- MCP・CLI・API 経由のバッチ生成\n- Canvas のノード型フローによる連続生成\n- Supercomputer によるエージェント実行（有料プランのみ）\n\nB群は4日目の試算式（削減時間 × 時間単価 対 増える直接費）で黒字になる場合のみ着手します。黒字になりやすいのは、**もともと有料枠で生成していた工程**です。経路を変えても直接費が増えないため、純粋に時間削減だけが効きます。逆に Product Shot のような低単価で無料枠に入りやすい生成を大量に MCP へ移すのは、原価を増やす方向に働きます。\n\nまた Marketing Studio は**バッチ機能がなく**（再生成で変種を作る）、**MCP／Supercomputer からは未対応**です。自動化を前提にするなら、どの生成面を使うかという上流の設計から変える必要があります。この制約は制作マニュアルに明記してください。"},{"heading":"品質ゲートは段階で置き、差し戻し先を決める","body":"品質確認を納品直前の1回だけにすると、問題が見つかったときの手戻りが最大になります。生成からやり直しになれば、クレジットと時間の両方が消えます。ゲートは工程の切れ目に置きます。\n\n- **ゲート1：静止画段階**（動画化の前）　構図・被写体・ブランド色・文字の有無を判定。ここで止めれば損失は Product Shot 2K の1.5クレジットです。通してしまえば、89.2クレジットの動画生成が無駄になります。**最も費用対効果が高いゲートはここ**です。単価差が約60倍あるため、ゲート1の精度が全体の原価を決めます。\n- **ゲート2：動画カット段階**（編集の前）　映像破綻・動きの自然さ・尺を判定。不合格カットは再生成に戻します。ここで通したカットだけを編集に渡すと、編集のやり直しが消えます。\n- **ゲート3：編集完了段階**（書き出しの前）　字幕の文字数・セーフエリア・音・テンポを判定。2日目の音なし成立チェックをここで実行します。\n- **ゲート4：出荷判定**（納品の前）　3日目の全項目チェックリストを適用。致命NOが1件でもあれば停止。\n\n各ゲートには**差し戻し先**を明記します。ゲート2で映像破綻が出たら生成工程へ、尺が合わなければカット割の判断工程へ戻します。差し戻し先が書かれていないゲートは、不合格を出したあと誰が何をするかが決まらず、結果として合格扱いで流れます。\n\nゲートごとに `判定項目 / 判定者（自分or外注）/ 不合格時の差し戻し先 / 差し戻し時の想定損失（クレジット・分）` の4列を持たせてください。最後の列があると、どのゲートを厳しくすべきかが金額で判断できます。"}],"steps":[{"n":1,"action":"全工程を洗い出して切り分け表を作る","detail":"顧客ヒアリングから請求までの全工程を1行ずつ列挙し、`工程／入力／出力／判断or作業／判定基準の文書名／現在の所要分／時間シェア%／外注可否／自動化可否／優先順位` の列を作ります。時間シェアは4日目の原価計算表から転記します。工程の粒度は「1人が連続して行える単位」に揃えます。","check":"全工程に判断or作業の区分が入り、時間シェアの合計が100%になっている"},{"n":2,"action":"判定基準の文書がない工程を特定する","detail":"作業と区分したのに判定基準の文書名が空欄の行を抽出します。これらは実際には判断工程として自分に残っている工程です。基準を書けば作業に変換できるため、どの基準を書けば渡せるようになるかを行ごとにメモします。基準を書けない工程は判断工程に区分を変えます。","check":"作業区分の全行に判定基準の文書名が入っているか、判断区分に変更されている"},{"n":3,"action":"期待削減額で優先順位を算出する","detail":"作業工程について `時間シェア% × 1本あたり人件時間原価 × 月間本数` で月間人件費を出し、外注費または自動化コストを引いて期待削減額を計算します。4日目の感度分析で最も影響の大きかった変数に直接効く施策があれば、それを最優先に置きます。順位を1から振ります。","check":"全作業工程に期待削減額が円で入り、優先順位が重複なく振られている"},{"n":4,"action":"自動化候補をA群B群に分類する","detail":"自動化可否が可の工程を、クレジットを増やさないA群（命名・配置・台帳記録・書き出しバッチ・納品物組み立て・判定記録集計・テンプレート値差し込み）と、増やすB群（MCP・CLI・API経由の生成、Canvas、Supercomputer）に分けます。B群は4日目の試算で黒字だった工程のみ残し、赤字の工程は候補から外します。","check":"全自動化候補がA群・B群に分類され、B群に赤字工程が残っていない"},{"n":5,"action":"自動化の技術的制約を確認して候補を絞る","detail":"MCP やAPI コンソールの対応範囲を確認し、使おうとしている生成面が経路上で利用できるかを判定します。Marketing Studio はバッチ機能がなく MCP／Supercomputer からは未対応であるため、Marketing Studio に依存する工程は自動化候補から外すか、生成面の変更を検討します。判定結果を候補表に記録します。","check":"各自動化候補に技術的可否と根拠が記録されている"},{"n":6,"action":"4段階の品質ゲートを設計する","detail":"ゲート1静止画／ゲート2動画カット／ゲート3編集完了／ゲート4出荷判定の4段階について、`判定項目／判定者／不合格時の差し戻し先／差し戻し時の想定損失（クレジット・分）` を記述します。判定項目は3日目のチェックリストから該当するものを割り当て、重複なく配分します。","check":"4ゲートすべてに差し戻し先と想定損失が記入されている"},{"n":7,"action":"ゲート1の判定項目を厚くする","detail":"静止画（Product Shot 2K 1.5クレジット）と動画（Marketing Studio 15秒 89.2クレジット）の単価差が約60倍あるため、ゲート1の精度が原価を最も左右します。構図・被写体・ブランド色・不要な文字やロゴの有無・参照アセットとの整合を項目化し、動画化に進める静止画の条件を明文化します。","check":"ゲート1の判定項目が5項目以上あり、動画化に進める条件が文で書かれている"},{"n":8,"action":"外注指示書の6部構成を組み立てる","detail":"案件情報／プロンプト指示／使用アセット指定／技術仕様／品質ゲート／納品形式と記録義務の6部で雛形を作ります。各部の内容は既存の成果物から転記します（Week 1の7スロットテンプレート、1日目の顧客コード台帳と資産台帳とプロンプトライブラリ、3日目の技術仕様表とチェックリスト致命項目）。新規に書くのは案件情報と納期のみにします。","check":"6部すべてが埋まり、新規記述が案件情報と納期に限られている"},{"n":9,"action":"プロンプトを埋めた完成形に変換する","detail":"外注者にプロンプトを書かせない方針に従い、7スロットテンプレートの可変部分に案件の値を埋めた完成形をカット単位で作ります。1日目の管理ヘッダ（ID・版・エンジン・比率・依存アセット・最終検証日・採用率）を付けたまま渡します。採用率の列が空の行は、外注前に自分で試す対象として印を付けます。","check":"全カットに値を埋めたプロンプト完成形が存在し、管理ヘッダが付いている"},{"n":10,"action":"外注指示書を第三者視点で検査する","detail":"作成した指示書を自分の知識を使わずに読み、判断を要求している箇所を洗い出します。「適切に」「よい感じに」「必要に応じて」といった語が1つでもあれば、そこは判断工程が混入しています。該当箇所は基準を数値か例示で書き直すか、自分が実行する工程として指示書から外します。","check":"指示書内に判断を要求する語が1つも残っていない"},{"n":11,"action":"10本ルールの達成状況を確認する","detail":"外注化の前提である自己制作10本について、現在の制作本数と工程別採用率のサンプル数を確認します。サンプル数が10件未満の工程は採用率が暫定であり、外注者の成果を判定できません。達成していない工程を列挙し、外注開始前に自分で作る本数を計画します。","check":"工程別のサンプル数が確認され、10本達成までの不足本数が数値で出ている"},{"n":12,"action":"制作マニュアル第1版を目次と運用規則で確定する","detail":"Week 1〜5の成果物を章に割り当てて目次を作り、各章に `章タイトル／目的／収録する文書名／版番号／最終更新日／担当者（自分or外注）` を持たせます。続けて更新規則（誰がいつ版を上げるか）、版番号の付け方、変更履歴の記録場所、外注者への配布範囲を1ページで規定します。配布範囲は判断工程の章を外注者に渡さない設計にします。空欄の章は未整備領域が明示されたということなので、整備予定として記録します。","check":"全章に収録文書名と版番号が入り、運用規則が文書化され、第1版として版番号と日付が付いている"}],"prompts":[{"label":"外注指示書のプロンプト部（7スロット埋め込み済み完成形）","text":"[ID: CUT-TOKYO01-W25-C03 | VER: 1 | ENGINE: {{ENGINE}} | ASPECT: 9:16 | DURATION: {{SEC}}s | DEPENDS: element/{{ELEMENT_ID}} | ADOPT_RATE: {{PCT}}% | LAST_TESTED: ----/--/--]\nSUBJECT: a twin guest room interior with bedding turned down\nACTION: curtain moves slightly as warm air rises, no people entering frame\nENVIRONMENT: city hotel room interior, neighbouring buildings and street lights visible outside the window\nCAMERA: slow dolly in at constant speed, eye level, no handheld shake\nLIGHT: late afternoon window light from the west, no additional practicals\nTEXTURE: visible textile weave on bedding, matte wood surfaces, no specular blowout\nSTYLE: photorealistic, 35mm lens look, neutral white balance, no text, no logo, no on-screen graphics\nDO NOT: add people, add furniture not present in the reference element, change the window position, add lens flare","note":"Week 1 の7スロット構造（被写体／動作／環境／カメラ／光／質感／スタイル）に案件の値を埋め、1日目の管理ヘッダと DO NOT 節を足した外注配布用の完成形。外注者にプロンプトを書かせない設計なので、可変部分は {{ }} ではなく実値で埋めて渡す。DO NOT 節があると、外注者が良くしようとして要素を足す事故が防げる。ADOPT_RATE が空のカットは外注前に自分で試す対象として印を付ける。","status":"未検証","flow":{"code":"I2V","step":"工程3 / 4","input":"Day 1 で登録した Element のIDと、該当カットの7スロット（被写体・動作・環境・カメラ・光・質感・スタイル）の実値","output":"変数を残さず実値で埋まった、外注者がそのまま投げられる動画生成プロンプト1本","next":"外注指示書に綴じて配布する。ADOPT_RATE が空のカットは自分で先に試す","where":"生成画面でモデルを選ぶ（image-to-video）","whereNote":"最も安く、Seedance 2.0 系・Kling 3.0・Wan 2.7 なら Unlimited 対象"}},{"label":"工程切り分け表の行形式","text":"PHASE | INPUT | OUTPUT | TYPE (judgment/task) | CRITERIA DOC | MIN | LABOR SHARE | OUTSOURCE | AUTOMATE | ROUTE BILLING | PRIORITY | EXPECTED SAVING JPY/MONTH\nClient hearing and issue definition | brief, site data | issue statement | judgment | - | 60 | 12% | no | no | - | - | -\nCut plan and shot list | issue statement | cut plan sheet | judgment | w5d1 cut plan format | 45 | 9% | no | no | - | - | -\nStill generation and first-pass screening | filled prompts, elements | approved stills | task | w5d5 gate1 criteria | 50 | 10% | yes | partial | site: unlimited may apply | 3 | {{JPY}}\nVideo generation | approved stills | raw cuts | task | w5d5 gate2 criteria | 40 | 8% | yes | yes | MCP: always billed | 4 | {{JPY}}\nSubtitle implementation | subtitle script | timeline with subs | task | w5d2 subtitle script | 35 | 7% | yes | no | - | 2 | {{JPY}}\n3-aspect export | finished timeline | 3 files | task | w5d3 delivery spec | 20 | 4% | yes | yes | no credit impact | 1 | {{JPY}}\nShipping decision | 3 files | ship/hold | judgment | w5d3 QC checklist | 15 | 3% | no | no | - | - | -","note":"判断と作業の切り分けを1枚で保持する行形式。CRITERIA DOC 列が空の task 行は、実際には判断工程として自分に残っているという診断になる。ROUTE BILLING 列に課金条件を書き込むのが要点で、自動化候補をA群B群に分ける根拠がこの列になる。EXPECTED SAVING は時間シェア × 1本あたり人件時間原価 × 月間本数 − 外注費または追加直接費 で算出し、PRIORITY はこの金額の降順で振る。judgment 行は外注・自動化の対象外なので saving 欄を空にする。","status":"未検証","flow":{"code":"DOC","step":"工程1 / 4","input":"Day 4 の工程別時間表の人件時間シェアと、各工程に判定基準の文書があるかの判定、経路ごとの課金条件","output":"判断／作業の切り分けと、期待削減額の降順で振った優先順位の表","next":"優先順位の上位に来た工程について、品質ゲートと外注指示書を作る"}},{"label":"品質ゲート定義の行形式","text":"GATE | STAGE | JUDGED BY | ITEMS (from QC-V2) | FAIL ROUTE | LOSS IF PASSED WRONGLY\nG1 | after still generation, before video | outsource | composition, subject, brand color, unwanted text/logo, element match | back to still generation | 89.2 credits per wasted video generation\nG2 | after video generation, before edit | outsource | A1 A2 A3 (deformation), motion naturalness, duration within platform cap | back to video generation, or to cut plan if duration fails | edit rework, approx {{MIN}} min per cut\nG3 | after edit, before export | outsource | B3 B4 (subtitle chars, safe area), E1 E2 (loudness, peak), D3 (transition count), muted-playback review | back to edit | re-export and re-QC, approx {{MIN}} min\nG4 | before delivery | self only | all QC-V2 items, FATAL weighting applies | hold shipment, route to the owning phase | client-facing defect, revision round consumed","note":"品質ゲートを4段階で定義する行形式。FAIL ROUTE 列が最重要で、ここが空のゲートは不合格判定が出たあと誰が何をするか決まらず、実務では合格扱いで流れてしまう。LOSS IF PASSED WRONGLY にクレジット数や分数を入れると、どのゲートを厚くすべきかが金額で判断できる。G1 は静止画1.5クレジットに対し見逃すと動画89.2クレジットを失うため、約60倍の費用対効果を持つ最重要ゲートになる。G4 のみ判定者を自分に限定し、外注には渡さない。","status":"未検証","flow":{"code":"DOC","step":"工程2 / 4","input":"QC-V2 の24項目と、Day 4 で確定した静止画1.5クレジット・動画89.2クレジットという単価差","output":"4段階それぞれに判定者・項目・不合格時の戻し先が入ったゲート定義表","next":"G1〜G3 を外注者に配布し、G4 は自分の出荷判定として手元に残す"}},{"label":"制作マニュアル目次の管理形式","text":"[PRODUCTION MANUAL | VER: 1.0 | ISSUED: ----/--/-- | OWNER: {{NAME}} | DISTRIBUTION: ch.1-2 self only / ch.3-7 outsource]\nCH | TITLE | PURPOSE | DOCUMENTS | VER | UPDATED | RESPONSIBLE\n1 | Business and pricing basis | why the price is what it is | w5d4 cost model, w1 ledger | 3 | ----/--/-- | self\n2 | Direction and planning | turn a client issue into a cut plan | w4 message design, w5d1 cut plan format | 2 | ----/--/-- | self\n3 | Asset system | where every file and element lives | w5d1 asset ledger, naming rules, customer code ledger | 2 | ----/--/-- | shared\n4 | Prompt library | filled prompts by use case | w1 7-slot template, w5d1 prompt header format | 4 | ----/--/-- | shared\n5 | Generation and screening | produce approved stills and cuts | w5d5 gate1/gate2 criteria | 1 | ----/--/-- | outsource\n6 | Edit standard | subtitles, audio, pacing, 3-aspect export | w5d2 subtitle script, audio license log, export presets | 2 | ----/--/-- | outsource\n7 | QC and delivery | ship or hold, and what goes to the client | w5d3 QC-V2, delivery spec, delivery note template | 2 | ----/--/-- | shared (G4 self only)\n8 | Operating rules | how this manual is versioned and distributed | this page | 1 | ----/--/-- | self","note":"制作マニュアルの目次そのものを管理データとして持つ形式。DISTRIBUTION 行で配布範囲を宣言し、判断工程の章（1〜2）を外注者に渡さない設計にする。各章の DOCUMENTS 列に Week 1〜5 の成果物名を割り当てるため、空欄の章がそのまま未整備領域の一覧になる。VER 列を章単位で持つのは、全体を作り直さずに章ごとに更新できるようにするため。RESPONSIBLE 列の self / shared / outsource が、そのまま採用時の権限設計になる。","status":"未検証","flow":{"code":"DOC","step":"工程4 / 4","input":"Week 1〜5 で作った成果物の名称一覧と、各章の責任区分（self／shared／outsource）の判断","output":"章ごとに版と担当区分が入った、制作マニュアル第1版の目次1枚","next":"空欄の章が未整備領域の一覧になる。Week 6 の商品説明の裏付けに使う"}}],"expected":"工程切り分け表の全行に判断or作業の区分と判定基準の文書名が入り、作業工程には期待削減額と優先順位が円で付いています。自動化候補はA群B群に分かれ、B群には4日目の試算で黒字だった工程だけが残っています。4段階の品質ゲートに差し戻し先と想定損失が入り、外注指示書6部は既存成果物の転記で埋まっていて、判断を要求する語が1つも残っていません。制作マニュアル第1版の目次が全章埋まり、版番号と配布範囲の規定が付いています。","assignment":{"title":"制作マニュアル第1版の完成とWeek 5課題の仕上げ","brief":"Week 1〜5で作ったすべての文書を1つの制作マニュアルに統合し、他人が読んで同じ品質を出せる状態に組み立てます。同時に、どの工程を手放しどの工程を自分に残すかを金額根拠つきで決定します。対象は宿泊施設向け動画制作の標準商品です。合格基準は、マニュアルの該当章を外注者に渡したときに、その人が追加質問なしで作業を開始できるかどうかです。質問が出る箇所は、判断が言語化されていない箇所です。実際に外注者がいなくても、自分以外の誰かに読ませて質問が出るかを確認してください。Week 6ではこのマニュアルを根拠に価格と営業を設計します。","deliverables":["工程切り分け表（全工程・判断or作業・判定基準の文書名・時間シェア・外注可否・自動化可否・期待削減額・優先順位）","自動化候補のA群B群分類と技術的可否の判定記録","4段階の品質ゲート定義（判定項目・判定者・差し戻し先・想定損失）","外注指示書6部の雛形（案件情報／プロンプト指示／使用アセット指定／技術仕様／品質ゲート／納品形式と記録義務）","値を埋めたプロンプト完成形（カット単位・管理ヘッダつき）","10本ルールの達成状況と不足本数の計画","制作マニュアル第1版の目次（全章・収録文書名・版番号・最終更新日・担当者）","マニュアル運用規則（更新規則・版番号・変更履歴・配布範囲）","Week 5 の5点セット統合版（標準制作フロー／プロンプトライブラリ／品質チェックリスト／納品テンプレート／原価・時間計算表）"],"constraints":["外注指示書に「適切に」「よい感じに」「必要に応じて」といった判断を要求する語を使わない","B群の自動化候補に4日目の試算で赤字だった工程を含めない","判断工程を外注可に分類しない。基準を書いて作業に変換した場合は、その基準の文書名を必ず記載する","マニュアルの全章に版番号と最終更新日を入れる。空欄の章は整備予定として明記する","作業時間は90分以内。新規の映像生成は行わない"]},"success":["工程切り分け表の時間シェア合計が100%で、作業区分の全行に判定基準の文書名が入っている","作業工程に期待削減額が円で算出され、優先順位が金額の降順で振られている","4段階の品質ゲートすべてに差し戻し先が記入され、空欄がない","外注指示書に判断を要求する語が1つも含まれていない","制作マニュアル目次の全章に収録文書名と版番号が入り、配布範囲が規定されている","Week 5 の5点セット（標準制作フロー／プロンプトライブラリ／品質チェックリスト／納品テンプレート／原価・時間計算表）がマニュアル内で参照可能な状態で揃っている"],"rubric":[{"axis":"映像の品質","pass":"3点＝品質ゲートの判定項目がチェックリストから重複なく配分されている。5点＝ゲート1の項目が厚く、静止画段階で止めることで回避できるクレジット損失を金額で説明できる。"},{"axis":"動きの自然さ","pass":"3点＝ゲート2に動きの判定項目がある。5点＝動きの破綻による不採用を再生成に戻す手順と、尺不足をカット割の判断工程に戻す手順を区別して規定している。"},{"axis":"ブランド整合性","pass":"3点＝外注指示書に使用アセットの資産IDが指定されている。5点＝DO NOT 節で要素の追加を禁止し、ブランド規定から外れる改変が外注段階で起きない構造にしている。"},{"axis":"マーケ目的整合性","pass":"3点＝訴求軸の決定を判断工程として自分に残している。5点＝訴求の設計から納品までの工程連鎖が目次上で追え、どの章がどの意思決定を支えているかが説明できる。"},{"axis":"再現性","pass":"3点＝マニュアル全章に収録文書名と版番号が入っている。5点＝自分以外の人間に読ませて追加質問が出ず、章ごとの版更新だけで保守できる構造になっている。"},{"axis":"時間とコスト","pass":"3点＝作業工程に期待削減額が円で入っている。5点＝自動化のA群B群を課金経路で分け、B群について削減時間×時間単価と追加直接費の比較結果を金額で示している。"}],"pitfalls":[{"problem":"外注に出したら品質が落ちて、結果的に自分が全部やり直した","cause":"判断工程を作業として渡している。基準が言語化されていない工程を手順書なしで任せた","fix":"切り分け表で判定基準の文書名が空欄の作業行を抽出し、基準を書くか判断工程に戻す。外注者にはプロンプトを書かせず、値を埋めた完成形と DO NOT 節を渡す。致命項目のチェックリストを品質ゲートとして同時に渡し、合否を外注者自身が判定できる状態にする。"},{"problem":"自動化を進めたらクレジット消費が跳ね上がった","cause":"サイト上で Unlimited枠や無料生成に入っていた生成を MCP・CLI 経由に移した。2〜4枚のバッチも各々課金される","fix":"自動化候補をA群（クレジットを増やさない：命名・配置・台帳記録・書き出しバッチ・納品物組み立て）とB群（生成経路の変更）に分け、B群は4日目の試算で黒字の工程に限定する。もともと有料枠で課金されていた生成の経路変更は直接費が増えないため黒字になりやすい。低単価で無料枠に入りやすい生成の大量自動化は避ける。"},{"problem":"自動化しようとしたら使いたい生成面が経路上で使えなかった","cause":"Marketing Studio はバッチ機能がなく MCP／Supercomputer からは未対応であることを確認せずに設計した","fix":"自動化候補ごとに技術的可否を MCP／API コンソールで確認し、候補表に根拠つきで記録する。Marketing Studio 依存の工程は自動化候補から外すか、上流の生成面選択そのものを変更する。生成面の選択基準を制作マニュアルに明記し、以後の案件設計で考慮する。"},{"problem":"品質ゲートを作ったのに不合格が出たあと誰も何もしない","cause":"ゲートに判定項目は書いたが、不合格時の差し戻し先を規定していない","fix":"4ゲートすべてに差し戻し先の列を必須にし、不合格の種類ごとに戻す工程を書き分ける（映像破綻は生成へ、尺不足はカット割の判断工程へ）。差し戻し時の想定損失をクレジット数と分数で併記し、どのゲートを厚くすべきかを金額で判断できるようにする。"},{"problem":"外注費を言われた金額で払っており、妥当か判断できない","cause":"自分で10本作っておらず、工程別の採用率と所要時間の実測値がない","fix":"外注開始前に自分で10本作り、工程別採用率のサンプル数を10件以上にする。これにより外注者の成果を実測値と比較でき、所要時間から外注費の妥当性を判断できる。達成していない工程を列挙し、不足本数を計画に入れてから外注に進む。"},{"problem":"マニュアルを作ったが誰も使わず、実務と乖離していく","cause":"更新規則と版番号の付け方、変更履歴の記録場所を決めていないため、1回目の変更で実務とずれる","fix":"章単位で版番号を持たせ、誰がいつ版を上げるかを運用規則として1ページで規定する。変更履歴の記録場所を固定し、章ごとに独立更新できる構造にする。配布範囲を宣言し、判断工程の章を外注者に渡さない設計にすることで、章の役割が曖昧にならないようにする。"}],"resourceIds":["hf-academy-ad-agency","hf-mcp","hf-help-marketing-studio"],"nextHint":"Week 6 では、この制作マニュアルと原価計算表を根拠に商品を定義し、価格を決め、営業に出ます。原価が確定しているので、値付けは感覚ではなく粗利率の設計になります。","setup":{"tag":"仕組み化","model":"動画 Seedance 2.0（手順書の再現確認用に少量）","seconds":"4秒","res":"720p","aspect":"9:16","outputs":"1","cap":"静止画4枚・動画2本","credits":"約 37 cr（$1.83）","unlimited":"0 cr","save":"手順書どおりに作って同じ結果が出るかを確かめる分だけ生成する。再現できなければ、外注しても同じ品質は出ない。"}}]},{"week":6,"title":"商品化・営業・事業化","theme":"作れる人から、売れる事業者になる","objective":"東京の宿泊施設・飲食店向けAI動画マーケティングサービスを、ポートフォリオ・価格・契約・収益モデルまで含めた「売れる商品」として組み立て、実在する見込み顧客に提案できる営業資料一式を完成させる。","hours":"7.5時間（85〜95分 × 5日）","weekDeliverables":["提案型ポートフォリオ3本（1本ごとに目的・ターゲット・訴求仮説・制作意図・使用ツール・制作時間の説明文つき）","サービス紹介ページ（1枚、Webまたは配布用PDF）","料金表（3パッケージ・修正回数と二次利用範囲を明記）","顧客ヒアリングシート（15項目以上）","提案書テンプレート（現状の数字→課題仮説→打ち手→検証計画→費用→スケジュールの6章構成）","制作フロー図（受注から納品・改善サイクルまで）","収益シミュレーション（キャパシティ上限を数式で可視化したもの）と90日実行計画"],"outcome":"「誰に・何を・いくらで・どういう根拠で売るのか」と「それを続けたとき自分の時間と利益はどうなるのか」を、自分の実測値に基づく数字で説明できる。","lessons":[{"id":"w6d1","day":1,"title":"実績ゼロから信頼を作るポートフォリオ","subtitle":"作品集ではなく「仕事の見本」を3本。実在する課題への提案として組む","why":"映像の受託で最初に突き当たる壁は技術ではなく、実績がないことです。宿や店のオーナーが見たいのは綺麗な映像ではなく「この人に任せると自分の施設の何が変わるのか」です。ところが大半の新規参入者は、題材を自由に選んだ見栄えのいい作品を並べてしまい、結果として「上手だが自分には関係ない」と判断されます。東京は制作会社も映像フリーランスも大量にいるため、「AI動画を作れる人がいない」という希少性では勝てません。あなたの場合、飲食10年と広告運用の実績がすでにあるため、ポートフォリオは技術証明ではなく「課題理解の証明」として設計するほうが圧倒的に効きます。今日作る3本は、東京に実在する施設タイプが抱える具体的な課題に対する提案サンプルです。1本ごとに目的・ターゲット・訴求仮説・制作意図・使用ツール・制作時間を添え、映像そのものではなく思考過程を見せます。","goals":["想定顧客の実在する課題を3つ特定し、各課題に対応するポートフォリオ1本の企画を書ける","1本ごとに目的・ターゲット・訴求仮説・制作意図・使用ツール・制作時間の6項目を添付した説明文を作成できる","AI生成であることを隠さず、むしろ強みとして提示する説明の型を自分の言葉で書ける","実在施設を題材にする場合の許諾・表現上の線引きを判断基準として明文化できる","ポートフォリオ3本を高級感訴求／体験価値訴求／特定層向けの3方向に意図的に振り分けられる"],"duration":"90分","timeBreakdown":[{"label":"課題特定と3本の企画設計","min":30},{"label":"制作（Week 1〜5の素材を再構成して3本に仕上げる）","min":40},{"label":"説明文6項目の執筆と提示方法の設計","min":20}],"tools":["Higgsfield（Cinema Studio／Marketing Studio、Elements による施設の一貫性保持）","Week 5で作成した制作台帳・原価表（制作時間と実費の記載に使用）","スライドまたはNotion／Googleサイト（ポートフォリオ掲示用）"],"prereq":["Week 1〜5で生成した素材と制作台帳が揃っていること","Week 3で作成した宿泊施設向けの映像とプロンプトが手元にあること","Week 5の品質チェックリストと原価表が完成していること"],"theory":[{"heading":"作品集と仕事の見本は別物","body":"ポートフォリオには2種類あります。**作品集**は「自分がどれだけ上手いか」を見せるもので、審査員や同業者に向いています。**仕事の見本**は「あなたの課題にどう取り組むか」を見せるもので、発注者に向いています。受託事業で必要なのは後者だけです。\n\n両者の違いは添付情報に出ます。作品集は映像だけを並べますが、仕事の見本は1本ごとに次の6項目が必ず付きます。\n\n- **目的**：この映像は何を動かすために作ったか（例：週末の観光利用プランの検討率を上げる）\n- **ターゲット**：誰に見せる映像か（例：都内および近県在住で週末に都心泊を検討する30〜40代夫婦）\n- **訴求仮説**：なぜそれが効くと考えたか（例：出張用のビジネスホテルという認知が強すぎて、週末の滞在先として想像されていない）\n- **制作意図**：どの映像的判断がその仮説に対応しているか（例：冒頭3秒を客室の窓からの夜景にして用途の誤認を即座に壊す）\n- **使用ツール**：何で作ったか（AI生成であることを含む）\n- **制作時間**：企画から書き出しまでの実時間\n\nこの6項目が付くと、発注者は映像の上手さを判断しなくてよくなります。判断するのは「仮説が自分の施設に当てはまるか」だけになり、会話が「綺麗ですね」から「うちは逆に平日のほうが課題でね」という具体的な話に変わります。**ポートフォリオの役割は受注することではなく、具体的な会話を始めること**です。"},{"heading":"架空案件を作ってはいけない理由と、その代わりに何を作るか","body":"実績がないとき最も安易な選択は、架空のブランドを作って作品を仕上げることです。これは2つの点で機能しません。\n\n第一に、**架空だと課題が架空になる**。実在しない宿の実在しない課題に対する提案は、どんなに映像が良くても「で、うちは？」で止まります。第二に、**架空のブランドは提案者の都合がよすぎる**。都合のいい商品、都合のいいターゲット、都合のいい予算を前提にできるため、現実の制約に耐えるかが見えません。発注者はこれを直感的に見抜きます。\n\n代わりに作るのは**「提案型ポートフォリオ」**です。構造はこうなります。\n\n1. 東京に実在する**施設タイプ**を選ぶ（固有名ではなく「客室30室・ADR 1.5万円台・平日稼働9割・週末稼働5割の駅前ビジネスホテル型」のような類型）\n2. その類型が高確率で抱える課題を、公開情報と自分の現場知識から特定する\n3. 課題に対する映像の打ち手を1本作る\n4. 「このタイプの施設様へ」という宛先で説明文を書く\n\nこれなら架空ではありません。課題は実在し、ターゲットは実在し、打ち手は検証可能です。欠けているのは発注者の固有情報だけで、それは商談で埋めます。**実在施設の固有名を出さずに、実在する課題を扱う**。これが実績ゼロ期の正解です。\n\nなお、あなたの場合は飲食店運営10年の現場知識と、ROAS 300〜800%の広告運用実績があります。東京は制作者が多く、発注側から見れば「映像が作れる人」は選び放題です。だからこそ差別化は映像技術ではなく、**飲食と宿泊の数字が読めて、広告の成果で会話ができる制作者**という立ち位置に置きます。東京の施設類型と年間サイクルについて、ネットで調べた人よりも解像度の高い課題設定ができる。競合密度が高い市場では、その解像度自体が唯一の武器になります。"},{"heading":"実在施設を題材にする場合の線引き","body":"どうしても実在施設を題材にしたい場合（例：よく知っている宿にスペック提案を持ち込む）は、以下の線引きを事前に決めてから着手します。断定的な法的助言はできないので、ここは**自分の判断基準として明文化し、迷う案件は専門家に確認する**という扱いにしてください。\n\n**無許諾でやらない**\n- 施設の固有名・ロゴ・外観の特徴を特定できる形で、公開ポートフォリオに掲示すること\n- その施設の実在する客室・料理を、AI生成で「再現したもの」として提示すること（実在しない設備や景観を作ってしまうリスクがある）\n- 比較広告的な表現（他施設より優れているという示唆）\n\n**許諾なしでも比較的扱いやすい**\n- 施設名を出さず「このタイプの施設様へ」として類型で提示すること\n- その施設のオーナー本人にだけ個別に見せる1対1の提案（公開ではない）\n- 自分が運営に関わった／関わっている事業の素材\n\n**必ず表記する**\n- AI生成素材であること\n- 実在の施設・客室・料理を写したものではないこと（イメージであること）\n\n特に3点目は重要です。宿泊施設や飲食店の広告では、実際の客室や料理と異なる映像を「当館の客室」「当店の料理」として掲示すると、景品表示法上の優良誤認の論点に触れる可能性があります。実務では**「これは企画段階のイメージ映像であり、本番は実在の設備に合わせて作り直す」**という前提を提案時点で明言するのが安全です。同時にこれは営業トークとしても機能します。「本番ではお部屋の実際の家具配置と色に合わせます」と言えること自体が、相手の不安を先に潰す動きになります。"},{"heading":"AI生成を隠さないほうが強い","body":"AI生成であることを隠そうとすると、3つの損をします。\n\n**1. バレたときの損失が大きい**　宿や飲食店の経営者は同業や商店会の横のつながりを持っていて、紹介と口コミで評判が回ります。1件で崩れると紹介の経路ごと失います。隠した事実は隠した時点で弱みになります。\n\n**2. 価格の説明ができなくなる**　実写ロケ相当の制作だと思われたまま契約すると、価格が実写の相場で比較されます。実写の相場と比べて安いなら「安い理由は何か」を説明する必要があり、そこでAIを言わないと「手抜き」に見えます。逆に正直に言えば、**実写では成立しない本数と更新頻度**という本来の価値を売れます。\n\n**3. 法が求める開示に対応できない**　Higgsfield の利用規約では、法が求める場合のAI生成の開示が必要とされており、来歴表示の除去は禁止されています。隠す運用は規約運用上も安定しません。\n\nそのうえで、開示の仕方には型があります。**「AIで作りました」で終わらせず、AIだから可能になることと、人間が担保していることを並べて書く**。\n\n> 本動画はAI生成（Higgsfield）で制作しています。実写ロケを行わないため、天候・営業時間・繁忙期の制約を受けずに制作でき、繁忙期ごとに複数パターンの素材を用意して配信結果を見ながら差し替えることができます。一方で、訴求内容の設計、実際の施設仕様との整合確認、配信後の数値検証は人が行います。実在の客室・料理を写したものではなく、企画段階のイメージです。\n\nこの型の要点は、**AIを「安さ」ではなく「反復可能性」の文脈に置く**ことです。安さで売ると値下げ圧力に晒され続けますが、反復可能性で売ると広告運用の話になり、あなたの既存の強み（ROAS 300〜800%の運用経験）と接続します。"},{"heading":"3本の役割分担を先に決める","body":"ポートフォリオの本数は3本が実務上の下限かつ適量です。1〜2本では偶然との区別がつかず、5本以上は見られません。重要なのは本数より**3本が異なる方向を向いていること**です。同じ方向の3本は1本と同じ情報量しかありません。\n\n推奨する役割分担は次の3方向です。\n\n- **1本目：高級感訴求**　ADR（平均客室単価）の高い施設向け。低照度・暗い背景・反射のコントロール・動きを最小にする。訴求は「価格の正当化」。この1本は、価格を下げずに売りたい施設に対する「値引きしない集客」の提案になります。\n- **2本目：体験価値訴求**　中価格帯の施設向け。人の所作、時間の流れ、食と街の夜。訴求は「ここで何が起きるか」。宿泊は「部屋」ではなく「滞在」を売る商材なので、この方向が最も汎用性があります。\n- **3本目：特定層向け**　ターゲットを1つに絞る。例：インバウンドの短期滞在層／週末に都心泊を選ぶ国内客／出張リピーター。訴求は「あなた向けです」という宛名。**閑散期の課題に直接効くのはこの3本目**で、商談で最も反応が出やすいのもここです。\n\n3方向にすることの営業上の意味は、**相手が自分で選べる**ことです。「どれが一番近いですか」と聞くだけでヒアリングが始まります。1本だけ見せると相手は「良いか悪いか」の判断しかできませんが、3本あると「どれか」の判断になり、会話の質が変わります。"}],"steps":[{"n":1,"action":"想定顧客の施設類型を3つ書き出す","detail":"東京で、固有名ではなく類型として3つ定義します（都市型ホテル・ビジネスホテル・ゲストハウス・個人経営の飲食店などから選ぶ）。各類型に、室数（飲食なら席数）・想定ADR（飲食なら客単価）・平日稼働・週末稼働・インバウンド比率・主な予約経路の6項目を推定値で入れます。推定でよいですが、根拠（公開情報・自分の現場知識・同業からの伝聞）を併記してください。この推定値は商談で修正される前提のものです。","check":"3類型それぞれに6項目の数値と根拠が入った表ができている"},{"n":2,"action":"各類型の課題を1つに絞る","detail":"類型ごとに、映像で動かせる可能性がある課題を1つだけ選びます。「集客が弱い」は課題ではありません。「1〜2月の稼働が4割で、固定費を賄えていない」「OTA比率が8割で手数料負担が重く、公式直販の検討導線がない」のように、数字に紐づく形まで落とします。映像で動かせない課題（人手不足、設備老朽化）は除外します。","check":"3つの課題が、それぞれ数値を含む1文で書かれている"},{"n":3,"action":"3本の役割を高級感／体験価値／特定層に割り当てる","detail":"手順2の課題と、理論の3方向を対応させます。対応が不自然なら課題側を見直します。ここで決めるのは、各本の尺（15〜30秒）、アスペクト比（配信面に応じて9:16または16:9）、想定配信面（Instagramリール／OTAの施設ページ／Googleビジネスプロフィール／公式サイトのヒーロー）の3点です。","check":"3本の役割・尺・比率・配信面が表に確定している"},{"n":4,"action":"既存素材の棚卸しをして、新規生成を最小限にする","detail":"Week 1〜5で生成した素材を一覧し、3本に転用できるカットを拾います。ポートフォリオのために全部新規で作るのは時間と原価の無駄です。足りないカットだけを特定し、新規生成はそこに絞ります。宿泊施設の客室・外観の一貫性が必要な場合は、Elements（Characters / Locations / Props をプロジェクト横断で再利用する機能）に登録済みのものを使います。","check":"各本の必要カット数のうち、既存転用と新規生成の内訳が数字で出ている"},{"n":5,"action":"3本を書き出す","detail":"Week 5で作った品質チェックリストを通してから書き出します。ポートフォリオは自分の品質の天井を示すものなので、Week 5の基準を1つも妥協しないこと。書き出し時に、各本の実制作時間（企画・生成・編集・チェックの合計）と実消費クレジットを台帳から集計しておきます。この数字が説明文の「制作時間」欄と、明日の価格設計の根拠になります。","check":"3本が書き出され、各本の実制作時間と実消費クレジットが記録されている"},{"n":6,"action":"6項目の説明文を3本すべてに書く","detail":"目的／ターゲット／訴求仮説／制作意図／使用ツール／制作時間。各項目1〜3文。制作意図の欄は「どの映像的判断が仮説のどこに対応しているか」を書きます。「冒頭3秒を客室の窓からの夜景にしたのは、出張用という認知が強すぎて週末の滞在先として想像されていないという仮説に対し、用途の誤認を最初に壊す必要があるため」のような書き方です。ここが最も読まれる欄で、技術力ではなく思考力が伝わる唯一の場所です。","check":"3本×6項目=18欄がすべて埋まり、制作意図が仮説と対応づけられている"},{"n":7,"action":"AI生成の開示文を作って全本に付ける","detail":"理論の型を参考に、自分の言葉で開示文を1つ作ります。要件は4つ：(1) AI生成であること、(2) AIだから可能になること（季節・天候の制約を受けない、複数パターンの用意と差し替えが可能）、(3) 人が担保していること（訴求設計・施設仕様との整合確認・配信後の数値検証）、(4) 実在の客室・料理を写したものではないイメージであること。3本すべてに同じ文を付けます。","check":"4要件を満たす開示文が作成され、3本すべてに掲示されている"},{"n":8,"action":"許諾・表現の自己基準を明文化する","detail":"理論の線引きを踏まえ、「やらないこと」「許諾があればやること」「必ず表記すること」の3分類で自分のルールを書きます。10項目前後。迷う項目には「要専門家確認」と印を付けます。このドキュメントは Day 4 の契約条項の素材になります。","check":"3分類のルールが文書化され、要確認項目に印が付いている"},{"n":9,"action":"掲示形式を決めて1ページにまとめる","detail":"3本の動画と説明文を、1画面でスクロールして見られる形にします。Notion、Googleサイト、1枚のPDFのいずれでも構いません。要件は3つ：(1) スマートフォンで見られる、(2) 相手がアプリをインストールせずに開ける、(3) URLを1つ送れば完結する。宿のオーナーは移動中にスマートフォンで見ます。ファイルを送って「ダウンロードしてご覧ください」は開かれません。","check":"URL1つで3本と説明文が閲覧でき、スマートフォンで実機確認済み"},{"n":10,"action":"Higgsfield Academy の該当モジュールで自分の設計を点検する","detail":"Academy の `Build an AI Ad Agency with Claude + Higgsfield`（12モジュール、約22分）のうち、ニッチ発見・オファー設計・ポートフォリオ生成の3モジュールを見ます。目的は手順の模倣ではなく、自分が決めたニッチ（東京の宿泊施設・飲食店）と役割分担3本が、汎用的な型から見て漏れがないかの点検です。自分の設計と違う点があれば、どちらが自分の市場に合うかを判断して1行メモします。","check":"3モジュールを視聴し、自分の設計との差分が1行以上メモされている"}],"prompts":[{"label":"ポートフォリオ1本の企画シート（記入テンプレート）","text":"【施設類型】室数（飲食は席数）: ___ / 想定ADR（飲食は客単価）: ___円 / 平日稼働: ___% / 週末稼働: ___% / インバウンド比率: ___% / 主な予約経路: ___\n【数字に紐づく課題】（1文・必ず数値を含む）\n【この課題を映像で動かせると考える理由】（2文・因果で書く。動かせない部分も明記する）\n【ターゲット】誰（属性・居住地・来店手段と最寄り駅からの距離）／その人が今どう思っているか（現在の認知）\n【訴求仮説】「___ だと思われている」を「___ と思ってもらう」に変える\n【訴求の根拠】（公開情報 / 現場知識 / 伝聞 のいずれかを明記）\n【映像の打ち手】尺: ___秒 / 比率: ___ / 配信面: ___\n【冒頭3秒で何を壊すか】（1文）\n【カット構成】1) ___ 2) ___ 3) ___ 4) ___\n【各カットが仮説のどこに対応するか】（カットごとに1行）\n【検証方法】何を見れば効いたと言えるか（指標名と取得方法）\n【検証の限界】この指標だけでは断定できない理由（1文）","note":"3本すべてをこのシートで設計してから制作に入る。最後の2欄（検証方法と検証の限界）が最も重要。成果を保証しない代わりに「どう確かめるか」を示すことが、提案の信頼性になる。空欄のまま制作に入ったら、その本は作品集になっている。","status":"未検証","flow":{"code":"DOC","step":"工程1 / 4","input":"想定顧客3類型それぞれの室数・ADR・稼働率などの公開情報と、その類型で1つに絞り込んだ課題","output":"検証方法と検証の限界まで埋まった、ポートフォリオ1本の企画シート","next":"この設計のまま生成と編集に入る。空欄を残したまま制作を始めない"}},{"label":"ポートフォリオ説明文の6項目テンプレート","text":"■ 目的\nこの映像は「___」を動かすために制作しました。（動かす対象は行動・検討・認知のいずれか1つに限定する）\n\n■ ターゲット\n___（属性・居住地・来訪手段）。この層は現在「___」と認識していると想定しています。\n\n■ 訴求仮説\n___ という誤認または情報不足があり、___ を見せることで検討の対象に入ると考えました。根拠は ___ です。\n\n■ 制作意図\n・冒頭___秒を___にしたのは、___ のためです。\n・___ のカットを入れたのは、___ に対応します。\n・___ を意図的に入れていません。理由は ___ です。\n\n■ 使用ツール\nHiggsfield（___ Studio、使用モデル: ___）/ 編集: ___ / 素材の一貫性保持: Elements\n\n■ 制作時間\n企画 ___分 / 生成 ___分 / 編集 ___分 / 品質チェック ___分 / 合計 ___分（実測）\n\n■ AI生成に関する表記\n（Day1で作成した開示文を貼る）","note":"制作意図の3つ目「意図的に入れていないもの」が差をつける欄。入れなかった判断を説明できる人は、発注者から見ると制御できている人に見える。制作時間は実測値のみ。盛ると明日の価格設計が崩れる。","status":"未検証","flow":{"code":"DOC","step":"工程2 / 4","input":"書き出し済みのポートフォリオ映像1本と、企画シートの訴求仮説、工程別に実測した制作時間","output":"目的から制作時間までの6項目が全部埋まった、掲示用の説明文1本","next":"制作時間の実測値を Day 2 の時間単価と原価積み上げにそのまま渡す"}},{"label":"AI生成の開示文（雛形・自分の言葉に書き換える前提）","text":"本動画はAI生成（Higgsfield）で制作しています。実写ロケを行わないため、天候・営業時間・繁忙期の営業制約を受けずに制作でき、繁忙期ごとに複数パターンの素材を用意して配信結果を見ながら差し替える運用が可能です。一方で、訴求内容の設計、実際の施設仕様との整合確認、配信後の数値検証は制作者が行います。\n本動画は企画段階のイメージであり、実在する客室・料理・設備を撮影したものではありません。実際の制作では、御施設の実在する設備・内装・提供内容に合わせて作り直します。","note":"4要件（AI生成である / AIだから可能なこと / 人が担保すること / 実在物ではないイメージであること）を全部入れた最小構成。「安い」という語を一切使っていないのが要点。安さで売ると値下げ圧力が続く。反復可能性で売ると広告運用の話になり、学習者の既存の強みに接続する。","status":"未検証","flow":{"code":"DOC","step":"工程3 / 4","input":"この雛形の4要件（AI生成である／AIだから可能なこと／人が担保すること／実在物ではないこと）","output":"4要件を自分の言葉に書き換えた、全本に付ける開示文1本（2段落）","next":"説明文の末尾と、ポートフォリオ掲示ページの3本すべてに同文で貼る"}},{"label":"許諾・表現の自己基準（記入テンプレート）","text":"【やらないこと】\n1. 施設の固有名・ロゴ・特定可能な外観を、許諾なく公開ポートフォリオに掲示しない\n2. 実在しない設備・景観を「当該施設のもの」として提示しない\n3. 他施設との比較優位を示唆する表現を使わない\n4. ___\n\n【許諾があればやること】\n5. 施設名を出した実績としての公開（書面またはメールでの可否確認を残す）\n6. 施設の実在設備を参照画像として使用すること\n7. ___\n\n【必ず表記すること】\n8. AI生成であること\n9. 実在の客室・料理を撮影したものではないこと\n10. ___\n\n【要専門家確認】\n・景品表示法上の表示の考え方（宿泊施設の設備・景観の表示）→ 要確認\n・肖像・音声を含む素材を使う場合の同意取得の範囲 → 要確認\n・___","note":"法務の断定はできないので、これは自分の運用基準の宣言として作る。要確認の項目は Day 4 で契約条項として扱い、最終的には専門家に見てもらう前提。基準がないまま営業を始めると、1件目の商談で判断を迫られて場で妥協することになる。","status":"未検証","flow":{"code":"DOC","step":"工程4 / 4","input":"ポートフォリオ3本で実際に使った施設名・ロゴ・外観の扱いと、判断に迷った場面の列挙","output":"やらない／許諾があればやる／必ず表記する／要専門家確認の4区分の自己基準","next":"要確認の項目は Day 4 の契約条項に送り、商談前に判断を固めておく"}}],"expected":"動画3本が揃い、それぞれに6項目の説明文とAI生成の開示文が付き、URL1つでスマートフォンから閲覧できる状態です。3本は高級感訴求・体験価値訴求・特定層向けの3方向に明確に分かれており、各本の制作時間と消費クレジットが実測値で記録されています。映像の完成度より、説明文の「訴求仮説」「制作意図」「検証方法」の3欄が具体的に書けているかが到達判定になります。この3欄が抽象的なら、まだ作品集です。","assignment":{"title":"提案型ポートフォリオ3本と掲示ページの構築","brief":"東京に実在する施設類型3つの課題に対し、提案として機能する映像を3本制作します。固有名を使わず類型で提示し、各本に目的・ターゲット・訴求仮説・制作意図・使用ツール・制作時間の6項目を添えます。3本は高級感訴求／体験価値訴求／特定層向けに役割を分け、同方向の3本にならないようにしてください。AI生成であることは隠さず、4要件を満たす開示文を全本に付けます。新規生成は最小限にし、Week 1〜5の素材を再構成することを優先してください。","deliverables":["動画3本（高級感訴求／体験価値訴求／特定層向け、各15〜30秒）","企画シート3枚（検証方法と検証の限界の欄まで記入済み）","6項目の説明文3本分（計18欄）","AI生成の開示文（4要件を満たすもの）","許諾・表現の自己基準ドキュメント（10項目前後、要確認印つき）","掲示ページ（URL1つ・スマートフォン閲覧可）","各本の実制作時間と実消費クレジットの記録"],"constraints":["実在施設の固有名・ロゴ・特定可能な外観を公開ポートフォリオに使わない","3本の訴求方向が重複しないこと","新規生成は必要カットの半分以下に抑える（既存素材の再構成を優先）","制作時間は実測値のみを記載し、短く盛らない","作業時間は90分以内"]},"success":["3本すべてに6項目の説明文が付き、訴求仮説が数値を含む課題と対応しており、成果を断定する表現が1つもない","3本の訴求方向が高級感／体験価値／特定層に分かれており、第三者が見て区別できる","各本の説明文に検証方法と検証の限界が書かれている","AI生成の開示文が4要件を満たし、全本に掲示され、許諾・表現の自己基準が文書化されている","掲示ページがURL1つでスマートフォンから開け、各本の実制作時間と実消費クレジットが実測値で記録されている"],"rubric":[{"axis":"映像の品質","pass":"3点＝Week 5の品質チェックリストを全項目通過している。5点＝3本の中に、相手が「これはうちでも見たい」と具体的に言える説得力のあるカットが各本1つ以上ある。"},{"axis":"動きの自然さ","pass":"3点＝破綻がなく、カット間の動きの速度感が揃っている。5点＝高級感訴求の本では動きを意図的に抑え、体験価値訴求の本では人の所作で時間の流れを出す、という方向別の使い分けができている。"},{"axis":"ブランド整合性","pass":"3点＝1本の中でトーンが統一されている。5点＝3本が別施設向けなのでトーンは異なるが、Core Bloom としての品質水準（色の扱い・文字の置き方・音の有無）が共通している。"},{"axis":"マーケ目的整合性","pass":"3点＝各本の目的が1つに絞られている。5点＝課題の数値（稼働率・ADR・OTA比率のいずれか）と映像の打ち手が因果で接続しており、検証指標まで書かれている。"},{"axis":"再現性","pass":"3点＝企画シートと使用プロンプトが保存されている。5点＝同じシートで4本目を別類型向けに設計でき、その手順が外注者にも渡せる粒度になっている。"},{"axis":"時間とコスト","pass":"3点＝3本の実制作時間と実消費クレジットが記録されている。5点＝新規生成を必要カットの半分以下に抑え、1本あたりの実時間を明日の価格設計にそのまま使える形で集計している。"}],"pitfalls":[{"problem":"ポートフォリオが綺麗な映像集になり、商談で「上手ですね」で終わる","cause":"映像の完成度で勝とうとしており、課題理解を見せていない。説明文が「シネマティックな仕上がりを目指しました」のような制作者視点になっている","fix":"説明文の主語を発注者側に変える。「目指しました」ではなく「御施設の___という状況に対して___を狙いました」と書く。訴求仮説の欄に数値が1つも入っていなければ、その本は作り直すより先に企画シートを書き直す。"},{"problem":"3本が結局同じ雰囲気になり、選ばせる会話にならない","cause":"自分の得意な方向（多くは高級感・低照度・スローな動き）に全部引き寄せてしまう","fix":"制作前に3本の指定を並べて、光（方向・質・色温度）、カメラ（ショットサイズ・移動量）、人の有無の3項目で重複を確認する。重複が2項目以上あれば設計をやり直す。特定層向けの1本は、意図的に自分の得意でない方向（明るい・動きがある・人が写る）に振るとよい。"},{"problem":"AI生成であることを言えずに商談が進み、途中で説明できなくなる","cause":"開示文を用意していない、または「安いから」という文脈でしか説明できる言葉を持っていない","fix":"開示文を先に作り、ポートフォリオの冒頭に置く。商談では相手に聞かれる前に自分から言う。説明は「反復可能性」の文脈で統一し、価格の安さには触れない。触れた瞬間に値下げ交渉の土俵になる。"},{"problem":"実在施設を題材にしてしまい、公開してから相手に知られる","cause":"よく知っている宿を題材にするのが一番作りやすいため、固有情報が映像と説明文に残る","fix":"書き出し前に、映像と説明文から固有名・ロゴ・特定可能な外観の特徴（独特の屋根形状、看板、周辺の目印）を洗い出して除去する。除去できないなら、その素材はポートフォリオに使わず、その施設への個別提案にのみ使う。"},{"problem":"ポートフォリオのために新規生成を始めて、1日で終わらず原価もかさむ","cause":"Week 1〜5の素材を「練習だから使えない」と思い込んでいる","fix":"着手前に既存素材の一覧を作り、転用可能カットを数える。新規生成は必要カット数の半分以下という上限を先に決める。Week 5の品質基準を通る素材であれば、練習かどうかは発注者には関係がない。"},{"problem":"制作時間を実際より短く書いてしまう","cause":"速く作れる印象を与えたい、または試行回数と失敗分を時間に含めていない","fix":"台帳の実測値をそのまま転記する。盛った時間で価格を作ると、明日の原価積み上げが実態と乖離し、受注するほど赤字になる。速さを売りたいなら、時間を盛るのではなく「本番は実測___分で納品できます」と根拠つきで言う。"}],"resourceIds":["hf-academy-ad-agency","hf-academy-brand-visuals","jp-keihyo","hf-academy-mix-real","hf-academy-faceless"],"nextHint":"明日は、今日記録した実制作時間と実消費クレジットを原価の土台にして、3つのパッケージと価格を設計します。原価からの積み上げと、顧客にとっての価値からの逆算を両方やって、挟み撃ちで値を決めます。","setup":{"tag":"既存素材の再編集","model":"不足カットのみ Kling 3.0（1080p）／ 既存カットの再編集が中心","seconds":"5秒","res":"1080p","aspect":"9:16 と 16:9","outputs":"1","cap":"静止画8枚・動画8本（新規生成は必要カットの半分以下）","credits":"約 101 cr（$5.05）","unlimited":"0 cr","save":"Week 2〜4 で作った素材を使い回す。ポートフォリオ3本を一から作ると費用が倍になるうえ、過去の工程を見直す機会も失う。"}},{"id":"w6d2","day":2,"title":"3パッケージの商品設計と価格の決め方","subtitle":"3パッケージを作り、原価からの積み上げと価値からの逆算で挟み撃ちに値を決める","why":"映像制作で最も多い廃業理由は、受注できないことではなく「受注したのに利益が残らないこと」です。原因はほぼ例外なく値付けです。見積に修正対応の工数を入れていない、二次利用の範囲を決めていない、納期の短縮を無償で受けている。この3つで粗利が消えます。あなたは飲食店の原価管理と広告予算の運用を両方やってきているので、原価積み上げの発想は既にあるはずです。足りないのは「顧客にとっての価値からの逆算」という逆方向の計算で、受託サービス業ではこちらが上限価格を決めます。今日は両方を計算し、挟み込んで価格を決めます。さらに宿泊施設と飲食店には年度と繁忙期前という予算サイクルがあり、東京では繁忙期が年に複数回あるため、提案時期を外すと商品が良くても検討されません。","goals":["単発制作／初期構築＋月次運用／クリエイティブ供給の継続契約の3パッケージを定義できる","Week 5の原価表とDay1の実制作時間から、各パッケージの原価と粗利率を実際に計算できる","顧客にとっての価値（獲得1件あたりの粗利・削減できる他社費用）から価格の上限を逆算できる","修正回数・納期・二次利用範囲を価格条件として料金表に明記できる","宿泊施設の予算サイクルを踏まえ、3パッケージの提案時期を月単位で決められる"],"duration":"90分","timeBreakdown":[{"label":"パッケージ設計と3層構造の整理","min":25},{"label":"原価積み上げと粗利率の計算","min":35},{"label":"価値からの逆算と料金表の確定","min":30}],"tools":["Week 5で作成した原価表（1カットあたりクレジット・採用率・工程別時間）","Day1の実制作時間と実消費クレジットの記録","スプレッドシート（粗利計算と感度分析）"],"prereq":["Week 5の原価表が完成しており、採用率と1採用カットあたりクレジットが実測値で出ていること","Day1のポートフォリオ3本の実制作時間が記録されていること","Higgsfieldの現在のプラン料金とクレジット付与量を把握していること"],"theory":[{"heading":"3パッケージの役割は価格帯ではなく関係の深さ","body":"パッケージを「安い・普通・高い」で分けると失敗します。顧客は安い方を選び、安い方で手間がかかり、利益が残りません。分けるべきは**関係の深さ**です。\n\n- **A. 単発制作（スポット）**　目的は入口。1本または数本を納品して終わる。関係はそこで切れる。役割は「試してもらう」ことと、自分の実績を1件積むこと。利益率は3つの中で最も低く設計してよいが、赤字にはしない。\n- **B. 初期構築＋月次運用**　目的は定着。初月に素材基盤（施設のElements登録、ブランドトーンの確定、ベースとなる15〜30秒の本編）を構築し、翌月以降は配信面別の派生素材と数値レポートを月次で供給する。初期構築費と月額を分けるのが要点。構築費を月額に溶かすと、早期解約で回収できません。\n- **C. クリエイティブ供給の継続契約**　目的は供給。毎月一定本数の広告クリエイティブを供給し、配信結果を見て次月の方向を決める。**これが本命**です。ただし「毎月素材を納める」と定義すると素材の下請けになり、本数の値引き交渉に落ちます。「毎月仮説を1つ検証する」と定義すると改善サイクルの提供になり、継続する理由が素材の在庫ではなく学習の蓄積になります。\n\nSNSアカウントの運用代行をここに入れないこと。投稿の代行は時間が線形に増えるだけで、改善の蓄積になりません。Core Bloom が売るのは、制作・広告クリエイティブ・集客改善・成果計測です。\n\n3つを並べる営業上の意味は、**AとBとCの差額が「何を買っていないか」の説明になる**ことです。Aだけを提示すると価格の妥当性を映像の出来で判断されますが、3つ並ぶと「継続すると何が増えるのか」の話になります。"},{"heading":"原価からの積み上げ：実測値で計算する","body":"原価は3要素から成ります。推定値ではなくWeek 5とDay1の実測値を使います。\n\n**1. 生成実費（クレジット）**\n換算レートは 1ドル = 20クレジット（1クレジット = $0.05）。宿泊施設向けで主に使う公開実費は、Marketing Studio 動画 15秒720p = 89.2クレジット（≒$4.46）、同8秒720p = 47.62クレジット（≒$2.38）、Product Shot 2K = 1.5クレジット、Ads Studio 静止画1点 = 4クレジット（20点バッチ80クレジット）、Ad Multiplier はCTAのみ最大35クレジット・フック＋CTA最大140クレジットです。\n\n重要なのは**これを採用率で割る**こと。採用率25%なら採用1カットの実費は生成1回の4倍です。15秒動画を採用率25%で1本得るなら 89.2 ÷ 0.25 = 356.8クレジット ≒ $17.84。為替150円/ドルなら約2,680円。これが素材1本の実費です。\n\n**2. 自分の時間単価**\n目標年収 ÷ 年間稼働可能時間で出しますが、**請求可能時間だけで割ってはいけません**。営業・経理・学習の非請求時間が3〜4割発生します。目標年収600万円・年間稼働1,500時間でも、請求可能がその6割=900時間なら 600万 ÷ 900 = 約6,700円/時間。この差を無視すると稼働率が上がっても赤字から抜けません。\n\n**3. 固定費の配賦**\nHiggsfield のサブスク費（Plus $49/月、Ultra $129/月などと公式ブログに記載。プラン名と金額は実際の画面で要確認）、編集ソフト、ストレージ、通信の月額合計を、月間想定受注件数で割ります。クレジットは毎サイクルでリセットされ繰越されないため（Enterprise を除く）、使い残しも固定費として消えます。これを原価に入れること。\n\n**原価 = 生成実費（採用率調整後）＋ 工程別時間 × 時間単価 ＋ 固定費配賦**"},{"heading":"価値からの逆算：上限価格は顧客の経済が決める","body":"原価は下限を決めるだけで、上限は決めません。上限は**顧客にとっての価値**が決めます。受託サービス業で利益が出る人と出ない人の差は、ほぼここにあります。\n\n宿泊施設の場合、逆算は3経路あります。\n\n**経路1：獲得1件あたりの粗利から**\n仮に ADR 25,000円・平均2泊なら1予約の売上50,000円。宿泊業の変動費率を仮に35%とすると1予約の粗利は約32,500円。**ただしこれを「10予約増えます」と使ってはいけません**。映像は予約の要因の一つにすぎず、季節・価格・OTAのアルゴリズム・口コミ・競合が同時に効きます。提案では「1予約の粗利が約32,500円なので、___件の追加で費用を上回る計算になります。何件増えたかはこう測ります」という形で、損益分岐点と検証方法だけを示します。\n\n**経路2：他社費用の置き換えから**\n実写ロケは企画ごとに撮り直すたびに費用が発生し、桜の素材で年末年始を売れないのが宿泊・飲食の構造的問題です。東京は繁忙期が年に複数回あるため、撮り直しの回数そのものが多くなります。AI生成なら時期違い・訴求違いを同一フローで複数用意できるため、**「年間で何本必要か」で比較すると単価が逆転します**。提案では実写の相場を断定せず、「御施設が昨年の販促物に使った費用と本数」をヒアリングして相手の実数で比較します（Day3の項目に入れます）。\n\n**経路3：広告運用との組み合わせから**\nあなたの強みはここです。配信して数値を見る前提で提案できる。**広告費の10〜20%をクリエイティブ制作に充てる配分は、広告運用の実務では一般的な考え方**です。月30万円の広告費なら月額3〜6万円のクリエイティブ供給は予算構造上の整合性があり、新たな出費ではなく広告費の内訳の話になります。\n\n**価格 = max(原価 × 目標粗利率の逆数, 価値逆算の下限) で、価値逆算の上限を超えない範囲**"},{"heading":"値付けの失敗パターンは2方向から来る","body":"**失敗A：安すぎて修正対応で赤字になる**\n\n最も多い事故です。発生の構造はこうです。1本5万円で受注。制作は見積どおり8時間で終わる。ところが納品後に修正が4回入り、1回2時間で8時間。実稼働16時間となり、時間単価は3,125円に落ちる。さらに2件目も同じ構造なので、受注が増えるほど時間が埋まって新規営業ができず、単価も上げられない。\n\n対策は値上げではなく**条件の明記**です。修正回数を価格に織り込み、超過分を有償にします。回数の定義はDay4で詳しく扱いますが、料金表の段階で「修正2回まで込み、3回目以降は1回___円」と書いておくこと。書いていない条件は無償だと解釈されます。\n\n**失敗B：高すぎて検討が止まる**\n\nこちらは痛みが見えにくい分、気づくのが遅れます。症状は「見積を出した後に返信が来ない」です。断られたわけではなく、検討のテーブルに乗らなかった。宿泊施設の決裁は、オーナー単独でも「今季の販促予算のどこから出すか」という枠の問題で止まります。**枠に収まらない金額は、良い提案でも検討されません**。\n\n対策は値下げではなく**分割と入口の設計**です。年間契約の総額ではなく月額で示す。初期構築費を分割する。あるいは単発の小さい入口（A）を用意して、枠内で始められるようにする。これが3パッケージを作る実務上の理由です。\n\n**両方を避ける判断基準**：見積を出して「高い」と言われる割合が3割を超えていないなら、価格は低すぎます。全件が即決なら確実に安すぎます。逆に5割以上で止まるなら入口が重すぎます。この比率を記録してください。"},{"heading":"宿泊・飲食の予算サイクルと提案時期","body":"商品と価格が良くても、提案時期を外すと検討されません。東京の宿泊施設と飲食店には2つのサイクルがあります。\n\n**1. 年度**　多くの事業者が3月決算または12月決算です。年度の販促予算は決算月の2〜3ヶ月前に大枠が決まります。3月決算なら12〜1月、12月決算なら9〜10月が、年間契約（パッケージC）を持ち込む窓です。\n\n**2. 繁忙期前**　東京は一つの季節に需要が集中する構造ではなく、年間に複数の山があります。提案は各繁忙期の2〜3ヶ月前に入れます。\n\n- **飲食の山**　歓送迎会（3〜4月）と忘年会・新年会（12〜1月）。2〜3ヶ月前から逆算すると、**1月前後と9〜10月**が提案の窓になります。\n- **宿泊の山**　桜（3月下旬〜4月上旬）、GW、夏休み、紅葉、年末年始。予約は1〜3ヶ月前から入るため、**桜とGWは1〜2月、夏休みは5〜6月、紅葉と年末年始は8〜9月**までに提案を完了させる必要があります。桜の提案を3月に持ち込んでも間に合いません。\n- **繁忙期そのもの（3〜4月、7〜8月、12月）**　現場が回らないため新規の商談はほぼ成立しません。ただし**この時期の課題が最も鮮明**なので、観察して次の提案材料にする期間です。\n- **閑散期（1〜2月、6月、9月）**　売上は落ちますが現場に時間があり、**販促の相談が最も出やすい時期**です。閑散期対策の単発と、次の繁忙期に向けた仕込みの両方が通ります。\n\n結論として、**年間の商談の山は1〜2月と9〜10月の2回**です。前者は春の繁忙期（歓送迎会・桜・GW）に向けた提案、後者は年末年始の繁忙期と翌年度予算に向けた提案になります。今日決める料金表は、この2つの山に向けた2種類の提案に対応できる形にしておきます。具体的には、閑散期対策向け（1〜2月・6月・9月提案・低予算・短期）と繁忙期集客向け（9〜10月提案・継続・インバウンド訴求）で、同じパッケージを別の見せ方にできるようにします。"}],"steps":[{"n":1,"action":"自分の時間単価を計算して確定する","detail":"目標年収と年間稼働可能時間から時間単価を出します。重要なのは、請求可能時間が総稼働時間の6割程度になる前提で割ることです。例：目標年収600万円 ÷ (年間1,500時間 × 0.6 = 900時間) = 約6,700円/時間。この数字を1つに確定し、以降の全計算で使います。複数の数字を使い分けると原価が追えなくなります。","check":"時間単価が1つの数字として確定し、算出根拠（目標年収・稼働時間・請求可能比率）が記録されている"},{"n":2,"action":"1本あたりの生成実費を採用率で調整して算出する","detail":"Week 5の採用率を使います。Marketing Studio 動画 15秒 720p = 89.2クレジットを、自分の実測採用率で割ります。採用率25%なら 89.2 ÷ 0.25 = 356.8クレジット。クレジットをドル換算（1クレジット=$0.05）し、為替を1つ決めて円換算します。静止画・Ads Studio の実費も同様に算出します。","check":"動画1本・静止画1点の採用率調整後の実費が円で出ている"},{"n":3,"action":"工程別時間をDay1の実測値から集計する","detail":"Day1のポートフォリオ3本の実測値を工程別（企画・生成・編集・品質チェック）に分解し、1本あたりの平均時間を出します。これに時間単価を掛けたものが人件費相当です。ポートフォリオは試行が多めなので、本番は何割減るかの想定も併記します（根拠として、Elements登録済みの施設では生成の試行が減る等）。","check":"1本あたりの工程別時間と人件費相当額が算出されている"},{"n":4,"action":"固定費の月額合計と1件あたり配賦額を出す","detail":"Higgsfieldのサブスク費、編集ソフト、ストレージ、通信、その他を合算します。サブスクのクレジットは毎サイクルでリセットされ繰越されないため、使い残しも固定費として扱います。月間の想定受注件数（現実的に3〜5件）で割り、1件あたりの配賦額を出します。想定件数が少ないほど配賦が重くなることを数字で確認してください。","check":"月額固定費と、想定件数別（3件・5件）の1件あたり配賦額が出ている"},{"n":5,"action":"3パッケージの提供内容を具体的に定義する","detail":"A（単発制作）、B（初期構築＋月次運用）、C（クリエイティブ供給の継続契約）について、各々の納品物を具体的に列挙します。本数、尺、アスペクト比の種類数、レポートの有無、打ち合わせの回数と形式。Cは「毎月素材を納める」ではなく「毎月仮説を1つ検証する」という定義にし、納品物にレポートを必ず含めます。曖昧な項目（「随時相談」等）を1つも残さないこと。","check":"3パッケージの納品物が、数量と頻度を含む形で列挙されている"},{"n":6,"action":"各パッケージの原価を積み上げて粗利率を計算する","detail":"原価 = 生成実費（採用率調整後）＋ 工程別時間×時間単価 ＋ 固定費配賦。これを3パッケージそれぞれで計算します。次に仮価格を置いて粗利率を出します。目標粗利率を先に決めてください（受託制作で60〜70%が一つの目安ですが、自分の固定費構造で判断します）。粗利率が目標を下回るパッケージは、価格を上げるか提供内容を削るかの判断が必要です。","check":"3パッケージの原価・仮価格・粗利率が表で並んでいる"},{"n":7,"action":"価値からの逆算を3経路すべてで計算する","detail":"経路1（獲得1件あたり粗利）：想定ADR・泊数・変動費率から1予約の粗利を出し、費用を上回るために必要な追加予約件数を計算します。経路2（他社費用の置き換え）：年間で必要な素材本数で比較します。経路3（広告運用との組み合わせ）：想定広告費の10〜20%という配分から月額の上限を出します。3つの数字を並べ、最も低いものを上限の目安とします。","check":"3経路の逆算結果が数字で並び、上限の目安が決まっている"},{"n":8,"action":"原価積み上げと価値逆算を挟み込んで価格を確定する","detail":"下限（原価 ÷ (1 − 目標粗利率)）と上限（価値逆算の最小値）の間に価格を置きます。間が逆転している場合（下限 > 上限）は、そのパッケージは成立していません。提供内容を削って原価を下げるか、対象顧客をADRの高い層に変えるかの判断になります。この逆転が起きるかどうかを確認するのが今日の核心です。","check":"3パッケージの価格が確定し、下限と上限の間に収まっていることが数字で確認されている"},{"n":9,"action":"修正回数・納期・二次利用範囲を価格条件として書く","detail":"各パッケージに次の4条件を明記します。(1) 修正は何回まで含むか、超過時の単価、(2) 標準納期（営業日）と、短縮した場合の加算率、(3) 二次利用の範囲（自社サイト・OTA・SNS・有料広告・施設内モニター・印刷物のどこまで、期間は何年か）、(4) 素材の追加書き出し（アスペクト比違い・尺違い）が何種類まで含まれるか。書いていない条件は無償と解釈される前提で、漏れがないか確認します。","check":"3パッケージすべてに4条件が明記され、曖昧な表現が残っていない"},{"n":10,"action":"感度分析で価格の耐性を確認する","detail":"スプレッドシートで3つの変数を振ります。(1) 採用率が実測の半分になったら粗利率はどうなるか、(2) 修正回数が規定の2倍入ったら、(3) 受注が月3件から月1件に落ちたら。この3ケースで粗利率が何%になるかを計算します。いずれかで赤字になるなら、その条件が現実に起きる確率を考えて価格か条件を修正します。","check":"3つの悪化シナリオでの粗利率が算出され、赤字になるケースが特定されている"},{"n":11,"action":"提案時期カレンダーを作る","detail":"1〜12月の表を作り、各月に「商談可否」「主な提案パッケージ」「訴求テーマ」を入れます。1〜2月は春の繁忙期（歓送迎会・桜・GW）向け（A/Bの入口）、9〜10月は年末年始の繁忙期と翌年度予算向け（C）、3〜4月と7〜8月と12月は商談を入れず観察と既存顧客の運用に充てる。閑散期（1〜2月・6月・9月）は販促の相談が出やすいので、閑散期対策の単発も置きます。年度の予算決定時期も併記します。この表が90日計画（Day5）のアプローチ時期の根拠になります。","check":"12ヶ月分の提案時期カレンダーが完成し、商談の山が2回特定されている"},{"n":12,"action":"料金表を1枚にまとめる","detail":"3パッケージを横並びにした1枚を作ります。記載項目：パッケージ名、こういう施設向けという対象、納品物（数量つき）、価格、標準納期、修正回数、二次利用範囲、契約期間。注記として「価格は施設規模・素材点数により変動します」と「成果を保証するものではありません」を入れます。相手が社内で回覧できる体裁にすること。口頭だけの価格は検討されません。","check":"1枚の料金表が完成し、3パッケージの全条件が記載されている"}],"prompts":[{"label":"原価積み上げ計算シート（記入テンプレート）","text":"【前提値】\n時間単価: ___円/時（目標年収___万円 ÷ 請求可能___時間）\n実測採用率: ___%（Week 5より）\n為替: ___円/ドル　クレジット換算: 1クレジット = $0.05\n\n【生成実費（採用率調整後）】\n動画15秒720p: 89.2クレジット ÷ ___（採用率）= ___クレジット = $___ = ___円\n静止画（Product Shot 2K）: 1.5クレジット ÷ ___ = ___クレジット = ___円\nAds Studio 静止画1点: 4クレジット ÷ ___ = ___クレジット = ___円\n\n【工程別時間（1本あたり・Day1実測）】\n企画___分 / 生成___分 / 編集___分 / 品質チェック___分 / 合計___分\n人件費相当 = ___時間 × ___円 = ___円\n\n【固定費配賦】\n月額固定費合計: ___円（Higgsfieldサブスク___円 + 編集ソフト___円 + ストレージ___円 + その他___円）\n※使い残したクレジットは繰越されないため固定費として計上\n想定月間受注___件 → 1件あたり配賦 ___円\n\n【原価合計】\n原価 = 生成実費___円 + 人件費相当___円 + 固定費配賦___円 = ___円\n\n【価格と粗利】\n目標粗利率: ___%\n価格の下限 = 原価___円 ÷ (1 − ___) = ___円\n仮価格: ___円 → 粗利 ___円 / 粗利率 ___%","note":"採用率で割る工程を飛ばすと原価が実態の3〜4倍甘くなる。固定費配賦は想定受注件数に強く依存するので、3件と5件の2通りで計算して差を見ること。クレジットの使い残しを固定費に入れるのを忘れがちだが、繰越されない仕様なので実際に消えている費用である。","status":"未検証","flow":{"code":"DOC","step":"工程1 / 4","input":"Week 5 Day 4 の実測採用率と工程別時間、目標年収から割り出した時間単価、固定費の月額合計","output":"生成実費・人件費相当・固定費配賦を足した1本あたりの原価の内訳","next":"パッケージ別に積み直し、目標粗利率から価格の下限を割り出す（下限側）"}},{"label":"価値からの逆算シート（3経路）","text":"【経路1：獲得1件あたり粗利から】\n想定ADR: ___円 / 平均泊数: ___泊 / 1予約の売上: ___円\n宿泊業の変動費率（仮）: ___% → 1予約の粗利: ___円\n提案価格: ___円 → 費用を上回るのに必要な追加予約: ___件\n→ この件数は現実的か？（根拠: 既存の月間予約件数___件に対して___%）\n→ 【記載時の注意】「___件増えます」と書かない。「___件で費用を上回る計算になり、実測はこう行います」と書く\n\n【経路2：他社費用の置き換えから】\n御施設が昨年度の販促物に使った費用: ___円 / 本数: ___本（※ヒアリングで取得）\n1本あたり他社費用: ___円\n年間で必要な素材本数（繁忙期×訴求×配信面）: ___本\n実写での年間概算: ___円 / 本提案での年間: ___円 / 差額: ___円\n\n【経路3：広告運用との組み合わせから】\n想定月間広告費: ___円\nクリエイティブ制作への配分（広告費の10〜20%）: ___円 〜 ___円\n現在のCPA: ___円 → クリエイティブ改善で___%改善した場合の月額効果: ___円\n→ 【記載時の注意】改善率は目標値であり保証ではないと明記する\n\n【上限の決定】\n3経路の最小値 = ___円 → これを価格の上限の目安とする\n下限（原価積み上げ）___円 \u003c 価格 \u003c 上限___円 → 逆転していないか確認","note":"経路3が学習者固有の武器。広告費の10〜20%をクリエイティブに充てる配分は運用実務の一般的な考え方で、宿のオーナーに「広告費の枠内の話」として提示できる。これが最も予算の枠に乗りやすい。経路1は数字として強いが、必ず「増える」ではなく「損益分岐点」の形で書くこと。","status":"未検証","flow":{"code":"DOC","step":"工程3 / 4","input":"ヒアリングで得た想定ADR・平均泊数・過去の販促費・月間広告費と、宿泊業の変動費率の仮値","output":"3経路それぞれが示す価格上限と、その最小値である価格の上限目安","next":"原価積み上げの下限と挟み込み、逆転していないか確認して価格を確定する"}},{"label":"3パッケージ定義シート","text":"【A. 単発制作】\n対象: ___な施設（例: まず1本試したい、予算枠が小さい）\n納品物: 動画___本（尺___秒 / 比率___）、書き出し___種類、簡易レポート___\n価格: ___円 / 標準納期: ___営業日 / 修正: ___回まで（超過1回 ___円）\n二次利用: ___（自社サイト / OTA / SNS / 有料広告 / 施設内モニター / 印刷物 のどこまで・期間___年）\nこのパッケージの役割: ___\n\n【B. 初期構築＋月次運用】\n対象: ___な施設\n初期構築（初月）: Elements登録___点、ブランドトーン確定、本編___本、派生___本 → ___円\n月次運用（2ヶ月目以降）: 素材___本/月、配信面別書き出し___種、月次レポート1本、打ち合わせ___回/月 → 月額___円\n最低契約期間: ___ヶ月 / 修正: ___回/月（超過1回 ___円）\n二次利用: ___\nこのパッケージの役割: ___\n\n【C. クリエイティブ供給の継続契約】\n対象: ___な施設（広告運用を行っている、または行う意思がある）\n定義: 「毎月素材を納める」ではなく「毎月___という仮説を1つ検証する」\n月次の提供: 検証用クリエイティブ___本（訴求違い___パターン）、配信結果のレポート、次月の仮説提案\n価格: 月額___円（想定広告費___円の___%）\n最低契約期間: ___ヶ月 / 更新と解約の条件: ___\n二次利用: ___\n継続する価値の源泉: ___（素材の在庫ではなく、何の蓄積か）\n\n【共通注記】\n・価格は施設規模・素材点数により変動します\n・成果を保証するものではありません。検証方法は提案書に明記します","note":"Cの「継続する価値の源泉」欄が空欄のままなら、そのパッケージは素材の下請けになっている。入るべきは「どの訴求が効くかの学習データ」「施設固有のElements資産」「配信面別の反応の蓄積」のいずれか。素材そのものは納品したら相手の資産になるので、継続の理由にならない。","status":"未検証","flow":{"code":"DOC","step":"工程2 / 4","input":"Week 5 の納品仕様と修正1回の定義、および継続の価値の源泉として示せる蓄積の種類","output":"A単発／B初期構築＋月次／C継続契約の3パッケージの提供内容と条件","next":"各パッケージの原価を積み直し、価値逆算の上限と挟んで価格を入れる"}},{"label":"感度分析（悪化シナリオ3種）","text":"【基準ケース】採用率___% / 修正___回 / 月間受注___件 → 粗利率 ___%\n\n【シナリオ1：採用率が半減（___% → ___%）】\n生成実費が___円 → ___円に増加\n粗利率 ___% → ___%　／ 赤字か: はい・いいえ\n起きる確率と原因: ___（例: 新規施設でElements未整備、要望が抽象的）\n対策: ___\n\n【シナリオ2：修正が規定の2倍（___回 → ___回）】\n追加工数 ___時間 × ___円 = ___円\n粗利率 ___% → ___%　／ 赤字か: はい・いいえ\n起きる確率と原因: ___（例: 決裁者が複数いて指示が二転三転）\n対策: ___（有償化 / 事前の決裁者確認 / 修正の定義を契約に明記）\n\n【シナリオ3：受注が月___件 → 1件】\n固定費配賦が___円 → ___円に増加\n粗利率 ___% → ___%　／ 赤字か: はい・いいえ\n対策: ___（固定費の圧縮 / プラン変更 / 単価の見直し）\n\n【判定】赤字になるシナリオ: ___ → 価格または条件のどこを直すか: ___","note":"3シナリオのうち最も頻繁に起きるのはシナリオ2（修正超過）。これが赤字になる価格設定で営業を始めると、受注が増えるほど苦しくなる。シナリオ3は独立初期には必ず通る状態なので、受注1件でも赤字にならない固定費水準を確認しておくこと。","status":"未検証","flow":{"code":"DOC","step":"工程4 / 4","input":"確定した仮価格と原価の内訳、および採用率・修正回数・月間受注件数の基準ケースの値","output":"悪化3シナリオそれぞれの粗利率と、赤字になるシナリオの特定結果","next":"赤字シナリオが出たら、価格・修正回数・固定費のどこを直すかを決める"}}],"expected":"3パッケージの価格が、原価積み上げの下限と価値逆算の上限の間に収まる形で確定している状態です。各パッケージの粗利率が計算され、採用率半減・修正2倍・受注1件の3シナリオで赤字になるケースが特定されています。修正回数・納期・二次利用範囲が料金表に明記され、曖昧な表現が残っていません。さらに12ヶ月の提案時期カレンダーで、年間の商談の山が1〜2月と9〜10月の2回として可視化されています。価格の絶対値が正解かどうかは商談で検証するので、今日の到達判定は「どの数字を根拠に決めたか説明できるか」です。","assignment":{"title":"3パッケージの設計と料金表の確定","brief":"単発制作／初期構築＋月次運用／クリエイティブ供給の継続契約の3パッケージを定義し、Week 5の原価表とDay1の実測時間を使って原価と粗利率を実際に計算します。同時に顧客にとっての価値から3経路で上限を逆算し、挟み込んで価格を確定してください。価格には修正回数・納期・二次利用範囲を条件として織り込み、1枚の料金表にまとめます。継続契約のパッケージは「毎月素材を納める」ではなく「毎月仮説を1つ検証する」という定義にし、継続する価値の源泉を言語化してください。","deliverables":["時間単価の算出根拠（目標年収・稼働時間・請求可能比率）","原価積み上げ計算シート（3パッケージ分、採用率調整済み）","価値からの逆算シート（3経路すべて）","3パッケージ定義シート（納品物を数量つきで列挙）","粗利率の計算結果と感度分析（悪化シナリオ3種）","12ヶ月の提案時期カレンダー","1枚の料金表（4条件と注記つき）"],"constraints":["原価計算にはWeek 5とDay1の実測値のみを使い、推定値を使わない","採用率で生成実費を割る工程を省略しない","料金表に「随時相談」「応相談」などの曖昧な条件を残さない","「必ず」「確実に」といった成果を断定する表現を料金表に入れない","作業時間は90分以内"]},"success":["時間単価が請求可能時間（総稼働の6割程度）で算出され、生成実費が実測採用率で調整されている","3パッケージの原価と粗利率が計算され、目標粗利率との差が数字で示されている","価値逆算が3経路すべてで行われ、価格が原価の下限と価値の上限の間に収まっていることが確認されている（逆転時はその事実と対処が記録されている）","修正回数・納期・二次利用範囲・追加書き出しの4条件が3パッケージすべてに明記され、曖昧な表現が残っていない","感度分析で赤字になるシナリオが特定され、提案時期カレンダーに年間の商談の山が特定されている"],"rubric":[{"axis":"映像の品質","pass":"3点＝各パッケージの納品物の品質基準がWeek 5のチェックリストで定義されている。5点＝パッケージ間で品質基準を下げず、差は本数・頻度・レポートの有無で付けている。"},{"axis":"動きの自然さ","pass":"3点＝尺と動きの複雑さが各パッケージの工数見積に反映されている。5点＝複雑な動き（オービット等）を含む案件は別単価にする、といった工数差が価格に織り込まれている。"},{"axis":"ブランド整合性","pass":"3点＝料金表の体裁がCore Bloomとして統一されている。5点＝相手が社内で回覧しても意図が伝わる記述になっており、口頭の補足を必要としない。"},{"axis":"マーケ目的整合性","pass":"3点＝3パッケージが価格帯ではなく関係の深さで分かれている。5点＝継続契約の定義が改善サイクルの提供になっており、継続する価値の源泉が素材の在庫以外の言葉で書かれている。"},{"axis":"再現性","pass":"3点＝原価計算シートが数式入りで保存されている。5点＝採用率・時間単価・固定費を入れ替えるだけで別業態の価格が出せる汎用シートになっている。"},{"axis":"時間とコスト","pass":"3点＝3パッケージの粗利率が算出されている。5点＝感度分析で赤字シナリオを特定し、価格または条件を実際に修正している。"}],"pitfalls":[{"problem":"原価を甘く計算して、受注するほど時間が埋まり利益が残らない","cause":"生成実費を採用率で割っていない、修正対応の工数を入れていない、営業・経理の非請求時間を時間単価の計算から除外している","fix":"3点すべてを計算に戻す。生成実費は必ず実測採用率で割る。修正は規定回数分の工数を最初から原価に入れる。時間単価は請求可能時間（総稼働の6割程度）で割る。この3つを直すと原価が2〜3倍になることが多いが、それが実態である。"},{"problem":"価格を原価からだけ決めてしまい、相場より極端に安くなる","cause":"原価積み上げは下限しか決めないという構造を理解していない。受託サービス業で原価だけで値付けすると、技術が上がって原価が下がるほど安くなるという逆転が起きる","fix":"価値逆算を必ず3経路やる。特に経路3（広告費の10〜20%という配分）は宿のオーナーの予算構造に乗りやすい。原価が下がったときに値下げするのではなく、同じ価格で提供本数か検証回数を増やす方向に使う。"},{"problem":"修正回数を決めずに受注し、納品後に無限修正になる","cause":"料金表に書いていない。あるいは「ご満足いただけるまで」と書いてしまっている","fix":"料金表の段階で回数と超過単価を書く。「満足するまで」は価格が無限に下がる条件なので絶対に書かない。回数の定義（何をもって1回とするか）はDay4で契約条項として詰めるが、回数そのものは今日決める。"},{"problem":"二次利用の範囲を決めず、後から広告配信やOTA掲載に使われて追加請求できない","cause":"納品物の用途を「ご自由にお使いください」と口頭で済ませている","fix":"配信面を6分類（自社サイト / OTA / SNSオーガニック / 有料広告 / 施設内モニター / 印刷物）で列挙し、どこまで含むか・期間は何年かを料金表に書く。有料広告での使用を含めるかどうかは価格差が大きいので、パッケージ間の差別化要素として使える。"},{"problem":"単発制作（A）の価格を安くしすぎて、そこから抜け出せない","cause":"入口だから安くしようという発想。最初の顧客に付けた価格は、その顧客に対しては実質的に上げにくい","fix":"Aは赤字にしない範囲で設計し、安さではなく範囲の狭さ（本数・修正回数・二次利用の限定）で入口にする。値引きするなら期間限定の初回特典として理由を付け、通常価格を併記する。理由のない安値は、継続時の値上げの根拠を失わせる。"},{"problem":"提案時期を考えずに通年同じ提案を持ち込み、反応がないまま終わる","cause":"商品の良さが決まれば時期は関係ないと考えている。宿泊施設と飲食店の繁忙期と予算決定時期を把握していない","fix":"提案時期カレンダーを作り、繁忙期（3〜4月・7〜8月・12月）は新規商談を入れず観察と既存運用に充てる。1〜2月に春の繁忙期向け、9〜10月に年末年始と翌年度予算向けの提案を完了させる。宿泊の予約は1〜3ヶ月前から入るため、桜シーズンの提案を3月に持ち込んでも間に合わない。"}],"resourceIds":["hf-academy-ad-agency","hf-help-plans","hf-help-credits","jp-keihyo"],"nextHint":"明日は、今日作った料金表を出す前の工程を作ります。何を聞けば提案が具体的になるのかを15項目以上のヒアリングシートにし、成果を保証しない書き方で選ばれる提案書の構成を組みます。","setup":{"tag":"生成なし","model":"—（商品設計と価格）","seconds":"—","res":"—","aspect":"—","outputs":"—","cap":"生成なし","credits":"クレジット消費なし","unlimited":"—","save":"Week 5 の原価表と Day 1 の実測値だけで計算する。推定値を混ぜた価格表は、受注後に必ず赤字になる。"}},{"id":"w6d3","day":3,"title":"顧客ヒアリングと提案書の構成設計","subtitle":"聞く項目を15以上決め、成果を保証せずに選ばれる提案書を組む","why":"提案で負ける最大の理由は、提案書の出来ではなく、提案前に相手の数字を知らないことです。稼働率もADRもOTA比率も知らないまま出した提案は、必ず一般論になります。一般論の提案は価格でしか比較されません。逆に、相手の数字を使って書いた提案は、相手にとって「自分の話」になり、比較対象が消えます。あなたは広告運用でCPAやROASを見てきているので、数字で会話する型は既に持っています。足りないのは宿泊業固有の指標（稼働率・ADR・RevPAR・OTA比率）を聞き出す段取りです。東京には映像を作れる人が無数にいるため、ここで数字の会話ができるかどうかが、そのまま受注の分かれ目になります。もう一つの論点は、成果を保証できないという制約です。予約が増えると約束できない商材で、それでも選ばれる提案を書く。答えは「保証の代わりに検証計画を売る」ことです。","goals":["宿泊施設向けの顧客ヒアリングシートを15項目以上で作成できる","稼働率・ADR・OTA比率・繁閑差・既存広告費と媒体・予約導線・過去の販促物と結果を漏れなく聞き出す段取りを設計できる","無料で作るものと作らないものの線引きを、自分の基準として明文化できる","現状の数字→課題仮説→打ち手→検証計画→費用→スケジュールの6章構成で提案書テンプレートを作成できる","成果を保証しない表現で、それでも判断材料を提供する書き方を実際に書ける"],"duration":"90分","timeBreakdown":[{"label":"ヒアリング項目の設計","min":30},{"label":"無料サンプルの線引きと提案書6章構成の設計","min":30},{"label":"提案書テンプレートの作成と想定記入","min":30}],"tools":["Day2で確定した料金表と3パッケージ定義","Day1のポートフォリオ3本（商談で見せる素材）","スプレッドシート（ヒアリングシート）とスライドまたは文書ツール（提案書テンプレート）"],"prereq":["Day2の料金表と3パッケージの定義が確定していること","Day1の提案型ポートフォリオ3本が掲示可能な状態であること","Week 4で扱った広告指標（CPA・ROAS・CTR等）の理解があること"],"theory":[{"heading":"聞くべき数値と、なぜそれが提案を変えるか","body":"単に聞くのではなく、**聞いた数字が提案のどこを変えるのか**を理解していないと、聞いた意味がありません。\n\n- **稼働率（OCC）**　必ず月別で、かつ平日と週末を分けて。年間平均6割では、どの月とどの曜日に手を打つべきか判断できません。繁忙月9割・閑散月4割なら提案すべきは閑散月の素材、平日9割・週末5割なら提案すべきは週末の素材です。\n- **ADR（平均客室単価）**　訴求の方向を決めます。5万円台なら高級感訴求（値引きしない集客）、1.5万円台なら体験価値か特定層訴求。東京は同価格帯の競合が多いため、価格帯を外した訴求は即座に比較で負けます。ADRを知らずに「高級感のある映像を」と提案すると、価格帯に合わない映像になります。\n- **RevPAR（稼働率 × ADR）**　稼働を上げるべきかADRを上げるべきかの判断に使います。稼働9割でADRが低いなら上げるべきはADR、稼働3割でADRが高いなら上げるべきは稼働。**この2つで提案内容が正反対になります。**\n- **OTA比率**　8割なら手数料で1予約あたり10〜15%程度が抜けている計算になります（料率は媒体と契約で異なるため必ず実数を聞く）。直販に1割動かすだけで粗利が改善する。**これは「予約を増やす」ではなく「同じ予約数で利益を増やす」提案になり、増加を保証しなくても成立します**。最も価値の高い論点です。\n- **繁閑差**　閑散月の月名と稼働率。東京では1〜2月、6月、9月に落ちる施設が多いので、実際にどの月かを確認します。固定費を賄えていない月があるか。\n- **既存の広告費と媒体**　0円なら継続契約（Day2のC）は成立しません。配信する器がないためです。\n- **現在の予約導線**　予約エンジン、SNSプロフィールのリンク、Googleビジネスプロフィール。**映像を作っても導線がなければ予約になりません**。欠けている場合に先に指摘するのが誠実で、同時に信頼を得ます。\n- **過去の販促物とその結果**　多くの施設は「作ったが効果が分からない」と答えます。この答えが出たら**検証計画を売る提案の説得力が一気に上がります**。\n\n聞く順序は答えやすいものから。ADRとOTA比率は答えにくいので、前半で信頼を作ってから入ります。"},{"heading":"ヒアリングは取材ではなく、提案の下書きである","body":"ヒアリングシートを「質問リスト」として作ると、商談が尋問になります。相手は答えるだけで、こちらは情報を得るだけ。これでは次が繋がりません。\n\n機能するヒアリングには3つの特徴があります。\n\n**1. 各項目に「この数字が___なら、___を提案する」という分岐が紐づいている**\n聞きながら提案が組み上がっていくので、商談の終わりに「今伺った内容だと、おそらく___が課題で、___から始めるのが現実的だと思います」と言える。その場で方向性を返せるかどうかが、持ち帰って提案書を送るだけの人との差になります。\n\n**2. 自分の経験を開示しながら聞く**\nあなたには飲食店運営10年の経験があります。「うちも繁忙期は現場が回らなくて、販促まで手が回らなかったので」と前置きしてから聞くと、相手の答えの質が変わります。同じ側にいる人間からの質問と、業者からの質問は、返ってくる情報の量が違います。**これはテクニックではなく、実際に同じ立場を経験しているから言えることで、他の制作者が真似できない部分です。**東京には映像を作れる人は無数にいますが、飲食と宿泊の数字が読めて広告の成果で会話ができる制作者はほとんどいません。ヒアリングはその差が最もはっきり出る場面です。\n\n**3. 答えられない項目があることを前提にしている**\nADRやOTA比率を即答できる施設は多くありません。帳簿を見ないと分からない、担当者が別にいる、という状況が普通です。その場合は「後で教えていただける範囲で」と引き、代わりに推定で会話を進めます。「週末は満室近いですか」「OTAはBooking.comと楽天トラベルが中心ですか」と、Yes/Noで答えられる形に落とすと情報が取れます。\n\n**数字を1つも聞けなかった商談は、提案に入ってはいけません。**一般論の提案書を作る時間は、次の見込み客を探す時間に回したほうが期待値が高い。これは広告運用でデータがない状態で入札を組まないのと同じ判断です。"},{"heading":"無料で作るものと、作らないもの","body":"実績がない時期は「まず1本無料で作ります」が最も通りやすい入口です。しかしこれは2つの形で事業を壊します。\n\n**壊れ方1：無料で作ったものが本番になる**\n無料サンプルが気に入られると、そのまま使われて終わります。有償の話にならず、「また何かあったらお願いします」で関係が止まる。無料で作った本数だけ、自分の時間と原価が消えます。\n\n**壊れ方2：無料の相手に修正対応が発生する**\n無料なので断りにくく、修正に応じてしまう。1件で5〜10時間が溶け、その間に有償案件の営業ができません。\n\n線引きの原則は、**「判断材料は無料、使えるものは有償」**です。\n\n**無料で作るもの（判断材料）**\n- 既存のポートフォリオ3本を見せる（新規制作なし）\n- その施設の課題に対する**方向性の提案**（企画シート1枚、映像なし）\n- 既存素材を使った、15秒以下・ロゴなし・低解像度の方向性サンプル1本まで\n- 現在の予約導線の問題点の指摘（これは無料でも価値が伝わり、信頼を作る）\n\n**無料で作らないもの（使えるもの）**\n- その施設の実在設備に合わせた素材（Elements登録を伴う作業）\n- 配信可能な解像度・尺・比率で書き出した完成品\n- 複数パターンの素材\n- 修正対応（無料サンプルは修正なしの1発限りと明言する）\n\n無料サンプルを作る場合の条件も決めておきます。(1) 制作時間の上限を決める（2時間以内）、(2) 既存素材の再構成のみとし新規生成は最小限、(3) 「方向性の確認用であり、このままでは配信に使えない仕様です」と明記する、(4) **作る前に、気に入った場合の次の工程と金額を合意しておく**。4つ目が最も重要です。無料サンプルは「気に入ったらこのパッケージで進めます」という合意の上でのみ作る。合意がない無料制作は、相手にとって無リスクなので判断が先延ばしになります。\n\nこの線引きは、Day2の料金表と矛盾しないように書いてください。料金表に書いた価格の商品を無料で出すと、価格の信用がなくなります。"},{"heading":"提案書の6章構成","body":"構成は固定します。毎回考えるのは無駄で、固定されていれば中身の精度だけに集中できます。\n\n**1章：現状の数字**\nヒアリングで得た数値を相手の言葉のまま並べます。自分の解釈を混ぜないこと。「繁忙月稼働92%・閑散月41%、平日稼働88%・週末52%、ADR 18,000円、OTA比率78%」と並べるだけ。**相手がこの章を「合っている」と確認できるかが、以降の全ページの信用を決めます。**\n\n**2章：課題の仮説**\n「2月の稼働41%は、閑散期の都市滞在の価値が認知されていないことに起因する可能性があります」と書く。「原因です」と断定しない理由は2つ。実際に複数要因があるため断定が不正確であること、そして断定すると相手が反論の構えになることです。仮説として出すと「いや、2月はそもそもどこも暇だから」と補足が返り、情報が増えます。\n\n**3章：打ち手**\n提案内容と並べて、**映像で動かせないことを明記する**のが要点です。「客室の設備改善や料金設定は本提案の範囲外です」と書く。範囲を限定すると責任範囲が明確になり、かえって信頼されます。すべてを解決すると言う提案書は、それ自体が信用を落とします。\n\n**4章：検証計画**\n保証の代わりに置く、最も重要な章です。何を、いつ、どう測るか。詳細は次のブロックで扱います。\n\n**5章：費用**\nDay2の料金表から該当パッケージを引きます。総額と内訳、期間、支払い条件、「成果を保証するものではありません」の注記。\n\n**6章：スケジュール**\n契約から初回納品までを週単位で。「桜シーズンの予約の立ち上がりに間に合わせるには___月までに開始が必要です」という逆算を入れると、検討の先延ばしが起きにくくなります。これは煽りではなく事実の提示です。\n\n枚数は6〜10枚。それ以上は読まれません。各章1〜2枚が目安です。"},{"heading":"成果を保証しないのに、選ばれる提案の書き方","body":"「予約が増えます」と書けない。では何を書くのか。4要素で代替します。\n\n**1. 損益分岐点を示す（増加を約束せず、必要量を示す）**\n「費用は年間36万円です。1予約の粗利を約32,000円とすると、年間12予約の追加で費用を上回る計算になります。年間予約件数___件に対して約___%に相当します。」要点は、**約束していないのに判断材料を提供していること**です。相手は「12件なら現実的か」を自分で判断できます。増えると言われるより、自分で判断したほうが納得が深い。\n\n**2. 検証方法を具体的に示す**\n測れるのは、予約エンジンのセッション数とコンバージョン率、有料広告のCTR・CPC・CPA・ROAS、SNSの保存数とプロフィールアクセス、直販予約の件数と比率の推移、予約時アンケートの「何を見てご予約されましたか」です。\n\n重要なのは**どの指標も単独では効果を証明しないと明記すること**。「同時期に価格改定・OTAの掲載順位変動・口コミの増減が起きるため、これらは映像の効果を単独で証明するものではありません」。この注記で相手は「数字が分かっている人だ」と判断します。単一指標で効果を断言する提案は見透かされます。\n\n**3. 比較できる形で出す**\n訴求違い2〜3パターンを同条件で配信して比較する。「どれが効くかは事前に分からないので配信結果で決めます」と書けることが、**保証しないことの正当化そのものになります**。断定しないのが逃げではなく検証する姿勢だという構図に変わります。\n\n**4. 撤退条件を書く**\n「3ヶ月時点で___に改善が見られない場合は、方針変更か継続可否をご判断いただく前提で進めます」。自分で契約が切れる条件を書くのは怖いですが、**書かない提案より通ります**。\n\nあなたの経歴（広告運用でROAS 300〜800%）はこの4要素すべてに効きます。「保証はできませんが、効いたかを測る方法と、効かなかったときの打ち手の変え方は持っています」と言える。これは実績ではなく**プロセスの提示**で、これが最大の営業資産です。"}],"steps":[{"n":1,"action":"必須の数値項目を7つ書き出す","detail":"稼働率（月別）、ADR、RevPAR、OTA比率と主要媒体、繁閑差（閑散月と稼働率）、既存の月額広告費と媒体内訳、現在の予約導線。この7項目を質問文の形で書きます。いきなり「ADRは」と聞くと答えにくいので、「平日と週末で1泊あたりの単価はどれくらい差がありますか」のような会話の形に落としてください。","check":"7項目が会話として成立する質問文になっている"},{"n":2,"action":"各数値項目に提案の分岐を紐づける","detail":"項目ごとに「この数字が___なら___を提案する」を書きます。例：稼働9割でADRが低い→ADR向上（値引きしない集客）の提案／稼働3割でADRが高い→稼働向上（閑散期対策）の提案／OTA比率8割以上→直販導線の強化と「同じ予約数で利益を増やす」提案。この分岐表が商談中に方向性を返すための台本になります。","check":"7項目すべてに分岐が紐づき、商談中に方向性を1文で返せる状態になっている"},{"n":3,"action":"数値以外の項目を8つ以上追加して15項目にする","detail":"追加すべき項目：過去に作った販促物とその費用・結果、客層の内訳（国内/インバウンド、国籍、年代、人数構成）、競合と認識している施設（東京は競合密度が高いので必ず複数挙げてもらう）、予約のリードタイム、意思決定者と決裁の流れ、現場の繁忙度（いつなら対応可能か）、所有している素材（写真・動画・図面）、避けたい表現やブランド上の制約。合計15項目以上にします。","check":"合計15項目以上のヒアリングシートができている"},{"n":4,"action":"聞く順序を設計する","detail":"答えやすい項目から答えにくい項目へ並べ替えます。前半（繁閑差・予約導線・客層・過去の販促物）、中盤（広告費・媒体・競合認識）、後半（ADR・OTA比率・決裁の流れ）。各ブロックの冒頭に、自分の経験を開示する前置き文を1つ入れます（飲食店運営時の繁忙期の実感など）。答えられない場合のYes/No形式の代替質問も用意します。","check":"3ブロックに並び替えられ、前置き文と代替質問が各ブロックに入っている"},{"n":5,"action":"無料で作るもの・作らないものの線引きを書く","detail":"理論の分類をもとに、自分の基準を書きます。無料サンプルを作る場合の4条件（時間上限2時間、既存素材の再構成のみ、配信に使えない仕様であることの明記、作る前に次工程と金額を合意）を明文化します。Day2の料金表と矛盾しないか確認してください。","check":"無料/有償の線引きと4条件が文書化され、料金表と矛盾していない"},{"n":6,"action":"提案書テンプレートの6章の枠を作る","detail":"1章 現状の数字 / 2章 課題の仮説 / 3章 打ち手 / 4章 検証計画 / 5章 費用 / 6章 スケジュール。各章1〜2枚、合計6〜10枚。各章に「ここに何を書くか」の指示文を入れたテンプレートにします。毎回構成を考えないための雛形なので、指示文は具体的に書いてください。","check":"6章の枠と各章の指示文が入ったテンプレートが完成している"},{"n":7,"action":"1章の書き方ルールを決める","detail":"1章は相手の数字を相手の言葉のまま並べるだけにします。自分の解釈・評価・提案を1文も入れないというルールを明記します。数字が聞けなかった項目は「未確認」と書き、推定値を使う場合は「推定」と明記して根拠を併記します。この章の正確さが以降の信用を決めるため、送付前に相手に確認を取る運用にするのも有効です。","check":"1章のルールが明文化され、未確認・推定の表記方法が決まっている"},{"n":8,"action":"4章（検証計画）の指標セットを作る","detail":"測る指標を5つ以内に絞り、各指標に「取得方法」「測定開始時期」「比較対象（前年同月か、配信前後か）」を紐づけます。さらに「どの指標も単独では映像の効果を証明しない」という注記文を作ります。この注記は全提案書に必ず入れます。","check":"5つ以内の指標セットと取得方法・比較対象が表になり、注記文が作成されている"},{"n":9,"action":"損益分岐点の計算式を提案書に組み込む","detail":"Day2の価値逆算（経路1）を提案書の形式に落とします。「費用___円 ÷ 1予約の粗利___円 = 必要な追加予約___件」を、相手の数字で自動計算できる形にしておきます。表現は必ず「上回る計算になります」とし、「増えます」「達成できます」と書かないこと。年間予約件数に対する比率も併記して、現実的かどうかを相手が判断できるようにします。","check":"損益分岐点の計算が提案書に組み込まれ、断定表現が使われていない"},{"n":10,"action":"撤退条件とA/B設計を3章・4章に入れる","detail":"「3ヶ月時点で___に改善が見られない場合は方針変更または継続可否をご判断いただく」という撤退条件を書きます。同時に、訴求違い2〜3パターンを同条件で配信して比較するというA/B設計を打ち手に含めます。どれが効くかは事前に分からないという前提を明示し、それが検証する姿勢として機能する書き方にします。","check":"撤退条件とA/B設計が提案書に明記されている"},{"n":11,"action":"Day1の施設類型1つで提案書を実際に1本書き切る","detail":"テンプレートが機能するかを確かめるため、Day1で設定した施設類型のうち1つを選び、推定値を使って提案書を6章すべて埋めます。推定値であることを明記したうえで、6〜10枚に収めます。書けない章があれば、それはヒアリング項目が足りていないサインなので、シートに項目を追加します。","check":"提案書1本が6章すべて埋まり、6〜10枚に収まっている"},{"n":12,"action":"Academy のヒアリング設計モジュールで点検する","detail":"Academy の `Build an AI Ad Agency with Claude + Higgsfield` のうち、顧客ヒアリング設計とコールドアウトリーチの2モジュールを見ます。汎用的な型と比べて、自分のシートに抜けている観点がないかを確認します。宿泊業固有の指標（RevPAR・OTA比率）は汎用型には含まれないので、そこは自分の設計のほうが具体的であるはずです。差分を1行メモしてください。","check":"2モジュールを視聴し、自分のシートとの差分が1行以上メモされている"}],"prompts":[{"label":"顧客ヒアリングシート（15項目・分岐つき）","text":"■ ブロック1：答えやすい項目（前置き：「私も飲食を10年やっていたので、繁忙期に販促まで手が回らない感覚はよく分かります。まず全体の状況から伺えますか」）\n\n1. 月別の稼働率はどう推移していますか（特に一番高い月と低い月は）\n   → 分岐: 閑散月が3割以下 = 閑散期対策を主提案 / 通年7割以上 = ADR向上を主提案\n2. 客層の内訳は（国内/インバウンド比率、主な国籍、年代、人数構成）\n   → 分岐: インバウンド6割以上 = 多言語・都市観光の体験訴求 / 国内中心 = 立地と用途の訴求\n3. ご予約はどのくらい前に入りますか（リードタイム）\n   → 分岐: 3ヶ月以上 = 提案時期を逆算して明示 / 直前中心 = 短期配信型の提案\n4. 今の予約の流れを教えてください（何を見た人がどこで予約するか。公式サイトに予約エンジンはありますか / Instagramのプロフィールにリンクはありますか / Googleビジネスプロフィールは整っていますか）\n   → 分岐: 導線が欠けている = 映像より先に導線の指摘（無料で指摘し信頼を作る）\n5. 過去に作った販促物は何がありますか（何を、いくらで、結果はどうでしたか）\n   → 分岐: 「効果が分からない」= 検証計画を売る提案の説得力が最大化する\n6. お持ちの素材はありますか（写真・動画・図面・ロゴデータ）\n   → 分岐: 素材あり = Elements登録の工数が下がり原価が下がる\n7. 避けたい表現やブランド上の制約はありますか\n   → 分岐: 制約が明確 = 修正回数が減る見込み / 制約が曖昧 = 修正超過リスクとして見積に反映\n\n■ ブロック2：中盤（前置き：「どこにどれくらい出しているかが分かると、提案の精度が上がります」）\n\n8. 現在の月額広告費と媒体の内訳は（Meta / Google / OTA内広告 / その他）\n   → 分岐: 0円 = 継続契約は成立しない。単発制作か広告運用の立ち上げから / 月20万円以上 = クリエイティブ供給の継続契約が予算構造に乗る\n9. 広告の成果はどの指標で見ていますか（CPA / ROAS / 予約件数 / 見ていない）\n   → 分岐: 見ていない = 計測設計そのものが提案価値になる\n10. 競合だと認識している施設はどこですか（なぜそう思いますか）\n   → 分岐: 競合の訴求を分析して差分を打ち手にする。東京は競合密度が高いので、課題は「人が来ない」ではなく「選ばれない」になりやすい\n11. SNSは運用されていますか（頻度・担当者・手応え）\n   → 分岐: 【注意】運用代行を提案しない。広告クリエイティブの供給として提案する\n\n■ ブロック3：答えにくい項目（前置き：「差し支えなければで結構です。概算でも提案の精度が変わります」／即答できない場合はYes/No形式に落とす）\n\n12. 1泊あたりの平均単価は平日と週末でどれくらい差がありますか（ADR）\n   → 代替質問: 「平日は___円台、週末は___円台くらいですか」\n   → 分岐: 高ADR = 高級感訴求（値引きしない集客）/ 中ADR = 体験価値・特定層訴求\n13. ご予約のうちOTA経由はどれくらいですか。主な媒体は（手数料率は把握されていますか）\n   → 代替質問: 「Booking.comと楽天トラベルが中心ですか」「7〜8割くらいOTA経由ですか」\n   → 分岐: OTA 8割以上 = 直販導線の強化。「同じ予約数で利益を増やす」提案になり、増加を保証せずに成立する\n14. 今季の販促予算はどのくらいの枠で考えていますか。いつ決まりますか\n   → 分岐: 枠を超える提案は検討されない。月額に分割するか入口パッケージに落とす\n15. この件はどなたと決めていく話になりますか（意思決定者と決裁の流れ）\n   → 分岐: 決裁者が複数 = 修正が二転三転するリスク。修正回数の条件を強めに設定\n16. 繁忙期はいつですか。打ち合わせや確認作業はいつなら対応いただけますか\n   → 分岐: 繁忙期と制作期間が重なる = 確認待ちで納期が延びる。スケジュールに織り込む\n\n■ 商談の締め（必須）\n「今伺った内容だと、おそらく___が課題で、___から始めるのが現実的だと思います」\n→ 数字を1つも聞けなかった場合は提案に入らない。次の見込み客を探す時間に回す","note":"項目16個。各項目に分岐が紐づいているのが要点で、これがあると商談中に方向性を返せる。ブロック1の前置きは学習者の経歴そのもので、他の制作者が真似できない。項目11に「運用代行を提案しない」という注意を入れているのは、SNS運用を聞くと流れで代行を提案したくなる場面が必ず来るため。項目13（OTA比率）が最も価値が高い。予約増加を保証せずに利益改善の提案ができる唯一の経路。","status":"未検証","flow":{"code":"DOC","step":"工程1 / 4","input":"必須の数値項目7つと、各項目の回答で提案がどう分岐するかの対応、答えにくい項目の代替質問","output":"答えやすさ順の3ブロックに並べた、16項目の分岐つきヒアリングシート","next":"商談でこのまま使い、埋まった数値を提案書1章に相手の言葉のまま転記する"}},{"label":"提案書テンプレート（6章構成・指示文つき）","text":"【表紙】御施設名 / 提案タイトル（課題を1文で）/ 提案日 / Core Bloom\n\n──────────\n■ 1章：現状の数字（1枚）\n指示: ヒアリングで得た数値を相手の言葉のまま並べる。自分の解釈・評価・提案を1文も入れない。未確認の項目は「未確認」、推定値は「推定」と明記して根拠を併記する。\n\n・稼働率: 繁忙月___% / 閑散月___% / 平日___% / 週末___%（___年___月〜___月実績）\n・ADR: 平日___円 / 週末___円\n・RevPAR: 繁忙月___円 / 閑散月___円（稼働率 × ADR）\n・OTA比率: ___%（主要媒体: ___）\n・月額広告費: ___円（内訳: ___）\n・予約導線: ___\n・過去の販促物: ___（費用___円 / 結果: ___）\n\n※本章の数値に誤りがある場合はご指摘ください。以降の提案はこの数値を前提にしています。\n\n──────────\n■ 2章：課題の仮説（1〜2枚）\n指示: 断定しない。「〜に起因する可能性があります」「〜と考えられます」で書く。仮説が外れていた場合に相手が補足できる余地を残す。仮説は2つまでに絞る。\n\n仮説1: ___は、___に起因する可能性があります。\n根拠: ___（相手の数字 / 公開情報 / 同業態での一般的傾向のいずれかを明記）\n\n仮説2: ___\n根拠: ___\n\n※本仮説は現時点の情報に基づくもので、他の要因（価格設定、OTAの掲載順位、口コミ、競合の出店と撤退、天候）が同時に影響している可能性があります。\n\n──────────\n■ 3章：打ち手（2枚）\n指示: 提案内容と、本提案の範囲外を両方書く。範囲を限定することで責任範囲を明確にする。\n\n【ご提案内容】\n・素材: ___本（尺___秒 / 比率___ / 訴求パターン___種）\n・訴求の方向: ___\n・配信面: ___\n・A/B設計: 訴求違い___パターンを同条件で配信し、結果で次月の方向を決めます。どのパターンが効くかは事前には判断できないため、比較前提で設計しています。\n\n【本提案の範囲外】\n・客室設備・内装の改善、料金設定、OTAとの契約条件、人員体制については本提案の範囲外です。\n・___\n\n──────────\n■ 4章：検証計画（2枚・本提案の中核）\n指示: 指標は5つ以内。各指標に取得方法・測定開始時期・比較対象を紐づける。注記文を必ず入れる。\n\n| 指標 | 取得方法 | 測定開始 | 比較対象 |\n|---|---|---|---|\n| ___ | ___ | ___ | ___ |\n\n【損益分岐点】\n本提案の費用: 年間___円\n御施設の1予約の粗利（推定）: 売上___円 × (1 − 変動費率___%) = ___円\n費用を上回るのに必要な追加予約: ___件\n年間予約件数___件に対して約___%に相当します。\n※この件数は目標値ではなく、費用と効果が釣り合う水準の計算です。増加をお約束するものではありません。\n\n【注記】\nいずれの指標も、単独で本提案の効果を証明するものではありません。同時期に価格改定、OTAの掲載順位変動、口コミの増減、気象条件などが影響するため、複数指標を並べて傾向を判断する前提で設計しています。\n\n【撤退条件】\n3ヶ月時点で___に改善が見られない場合は、訴求方針を変更するか、契約の継続可否をご判断いただく前提で進めます。\n\n──────────\n■ 5章：費用（1枚）\n指示: Day2の料金表から該当パッケージを引く。総額・内訳・期間・支払い条件・修正回数・二次利用範囲を記載。\n\nパッケージ: ___\n初期構築: ___円 / 月額: ___円 × ___ヶ月 = 総額___円\n含むもの: ___\n修正: ___回まで（超過1回 ___円）\n二次利用: ___（期間___年）\n支払い条件: ___\n※価格は素材点数・施設規模により変動します。\n※本提案は成果を保証するものではありません。\n\n──────────\n■ 6章：スケジュール（1枚）\n指示: 週単位。提案時期の制約を逆算で示す。煽らず事実として書く。\n\n第1週: ___ / 第2週: ___ / 第3週: ___ / 第4週: 初回納品\n\n【時期に関する補足】\n御施設の予約リードタイムが___ヶ月であることを踏まえると、___シーズンの集客に反映させるには___月までの開始が必要な計算になります。","note":"6〜10枚に収める。4章が最も重要で、ここが厚い提案書は数字を見てきた相手に刺さる。1章に自分の解釈を混ぜると、相手は数字の正しさではなく解釈の妥当性を検証し始め、話が進まなくなる。3章の「範囲外」を書くのが反直感的だが、全部やると言う提案書は信用されない。5章と6章は短くてよい。長い費用説明は値引き交渉を誘発する。","status":"未検証","flow":{"code":"DOC","step":"工程3 / 4","input":"ヒアリングで埋まった施設の実数値と、Day 2 の料金表、Day 1 の企画シートの訴求仮説","output":"6〜10枚の提案書1本。4章の検証計画と損益分岐点が埋まった状態","next":"禁止表現の言い換え集で全文を通し、断定表現を消してから顧客に出す"}},{"label":"無料サンプルの線引きシート","text":"【無料で提供するもの（判断材料）】\n1. 既存ポートフォリオ3本の提示（新規制作なし）\n2. 当該施設の課題に対する方向性の提案（企画シート1枚・映像なし）\n3. 現在の予約導線の問題点の指摘（Googleビジネスプロフィール / 予約エンジン / SNSのリンク導線）\n4. 既存素材の再構成による方向性サンプル1本まで（15秒以下 / ロゴなし / 低解像度 / 透かしまたは「方向性確認用」表記つき）\n\n【無料で提供しないもの（使えるもの）】\n5. 当該施設の実在設備に合わせた素材（Elements登録を伴う作業）\n6. 配信可能な解像度・尺・比率での書き出し\n7. 複数パターンの素材\n8. 修正対応（無料サンプルは修正なしの1回限りと明言する）\n9. ___\n\n【無料サンプルを作る場合の4条件（すべて満たす場合のみ着手）】\n条件1: 制作時間の上限 2時間以内（超えたら打ち切る）\n条件2: 既存素材の再構成のみ。新規生成は___点まで\n条件3: 「方向性の確認用であり、このままでは配信に使用できない仕様です」と明記して渡す\n条件4: 【最重要】作る前に、気に入った場合の次工程と金額を合意する\n  → 合意文の例: 「方向性が合っていれば、___パッケージ（___円）で御施設の実際の設備に合わせて制作します。まずは方向性だけ確認いただく形でいかがでしょうか」\n\n【判定】\n・条件4の合意が取れない相手には無料サンプルを作らない（判断が先延ばしになるだけ）\n・Day2の料金表に載せた商品を無料で出していないか確認する（価格の信用が崩れる）\n・無料制作に使った時間の累計を記録する（月___時間を超えたら方針を見直す）","note":"条件4がすべて。合意のない無料制作は相手にとって無リスクなので、作っても判断が進まない。無料に使った時間を累計で記録するのは、気づかないうちに月20時間が溶けている状態を検知するため。その時間は有償案件の営業に回せば数件の商談になる。","status":"未検証","flow":{"code":"DOC","step":"工程2 / 4","input":"Day 2 の料金表に載せた3パッケージの内容と、無料制作に使った時間の累計記録","output":"無料で出すもの・出さないものと、着手の4条件を書いた線引きシート","next":"条件4の合意が取れない相手には作らない。合意できたら提案書に進む"}},{"label":"成果を保証しない表現の言い換え集","text":"【禁止表現 → 使う表現】\n\n× 予約が増えます\n○ 費用を上回るのに必要な追加予約は___件です。年間___件に対して約___%に相当します。現実的かどうかはご判断いただく前提です。\n\n× 閑散期の稼働が改善します\n○ 2月の稼働41%という数字に対し、___という認知の不足が一因である可能性があります。これを検証するために、訴求違い2パターンを配信して比較します。\n\n× CPAが下がります\n○ 現在のCPAが___円です。クリエイティブの訴求を変えた場合に、この数字がどう動くかを計測する設計にしています。改善幅は事前に予測できません。\n\n× 他社より効果が出ます\n○ （比較表現は使わない。自施設の前後比較と、訴求パターン間の比較のみで語る）\n\n× 必ず成果が出る方法です\n○ どの訴求が効くかは事前には判断できません。だからこそ複数パターンを作って、配信結果で決める設計にしています。\n\n× 弊社の実績では300〜800%のROASが出ています\n○ 広告運用では、業種の異なる案件でROAS 300〜800%の実績があります。御施設での同等の成果を示すものではありませんが、計測設計と改善の進め方は同じ方法で行います。\n\n【表現を変える理由】\n・保証しないことを明記したうえで判断材料を出すほうが、断定するより通る（相手は数字を見てきた経営者である）\n・断定した提案は、効かなかったときに関係が終わる。保証せず検証を売った提案は、効かなくても次の仮説に進める\n・過去実績を流用する場合は、業種が違うことを必ず明記する。流用の仕方を間違えると、提案全体の信用が落ちる","note":"最後の項目が重要。ROAS 300〜800%は強い実績だが、宿泊施設の事例ではない。これを宿の提案にそのまま出すと、相手が「じゃあうちでもそうなるのか」と期待し、ならなかったときに関係が壊れる。「成果は示さないが、方法は同じ」という切り方にすると、実績を使いつつ約束をしない形になる。","status":"未検証","flow":{"code":"DOC","step":"工程4 / 4","input":"書き上げた提案書とポートフォリオ説明文の全文、および流用する広告運用の過去実績の数字","output":"禁止表現をすべて言い換え表現に置き換えた、提案書の最終稿1本分","next":"この表現のまま商談に出る。業種の違う実績は流用時に必ず明記する"}}],"expected":"16項目前後のヒアリングシートができ、各項目に「この数字が___なら___を提案する」という分岐が紐づいている状態です。無料で作るもの・作らないものの線引きと4条件が明文化され、Day2の料金表と矛盾していません。提案書テンプレートが6章で完成し、Day1の施設類型1つについて推定値で1本書き切れています。4章（検証計画）に損益分岐点の計算と「単独では効果を証明しない」という注記、撤退条件が入っていることが到達判定です。成果を断定する表現が1つも残っていないことを、書き終えてから検索して確認してください。","assignment":{"title":"顧客ヒアリングシートと提案書テンプレートの作成","brief":"宿泊施設向けのヒアリングシートを15項目以上で作成します。稼働率・ADR・RevPAR・OTA比率・繁閑差・既存広告費と媒体・予約導線・過去の販促物とその結果を必ず含め、各項目に提案の分岐を紐づけてください。あわせて無料で作るもの・作らないものの線引きを明文化し、現状の数字→課題仮説→打ち手→検証計画→費用→スケジュールの6章構成で提案書テンプレートを作ります。最後にDay1の施設類型1つを選び、推定値で提案書を1本書き切ってテンプレートの実用性を検証してください。成果を保証する表現を一切使わずに、相手が判断できる材料を提供する書き方にすることが条件です。","deliverables":["顧客ヒアリングシート（15項目以上・各項目に提案分岐つき・3ブロックに順序設計済み）","答えられない場合の代替質問（Yes/No形式）","無料サンプルの線引きシート（4条件つき）","提案書テンプレート（6章・各章の指示文つき）","検証計画の指標セット（5つ以内・取得方法と比較対象つき）","成果を保証しない表現の言い換え集","提案書1本（Day1の施設類型・推定値・6〜10枚）"],"constraints":["ヒアリング項目は15以上とし、各項目に提案の分岐を必ず紐づける","提案書は6〜10枚に収める","「増えます」「必ず」「確実に」など成果を断定する表現を1つも使わない","広告運用の過去実績を使う場合は業種が異なることを必ず明記する","SNSアカウントの運用代行を提案内容に含めない","作業時間は90分以内"]},"success":["ヒアリング項目が15以上あり、必須7指標（稼働率・ADR・RevPAR・OTA比率・繁閑差・広告費と媒体・予約導線）がすべて含まれている","全項目に「この数字が___なら___を提案する」という分岐が紐づき、答えにくい項目にYes/No形式の代替質問がある","無料で作るもの・作らないものが分類され、4条件が明文化されている","提案書1章に自分の解釈が1文も入らず、4章に損益分岐点・5つ以内の指標セット・「単独では効果を証明しない」注記・撤退条件のすべてが入っている","提案書が6〜10枚に収まり、成果を断定する表現が0件であることを全文検索で確認している"],"r
