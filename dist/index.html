axis":"再現性","pass":"3点＝参照セットと登録内容が記録され、1週間後に同じ部屋を追加生成できる。5点＝手順書が第三者に渡せる粒度で、Locations数・参照枚数・採点軸が数値で固定されている。"},{"axis":"時間とコスト","pass":"3点＝部分編集と再生成を切り分け、不要な全体再生成を行っていない。5点＝編集で済ませたことによるクレジット削減量を概算できている。"}],"pitfalls":[{"problem":"プロンプトに空間の詳細を書き重ね、Location と競合して別の部屋が出る","cause":"登録したLocationの情報とプロンプト本文の空間記述が二重になっている","fix":"空間はLocation、カメラと光はプロンプトという役割分担に戻す。Location を使うカットでは、プロンプトから家具配置と窓の位置の記述を削る。"},{"problem":"参照を増やすほど同一性が下がる","cause":"窓の位置やレイアウトが矛盾する参照が混在し、平均化された別の空間が生成されている","fix":"参照を追加する前に既存参照を並べて目視し、矛盾する1枚を外す。参照は役割別に束ね、空間の同一性カテゴリ内では矛盾ゼロを保つ。"},{"problem":"「続きを作る機能がある」と顧客に説明してしまい、納品で破綻する","cause":"Forward/Backward Extend を汎用の続き生成機能と誤認している。専用機能は存在しない","fix":"Extend は同一カット内の尺延長、カット切替は最終フレーム＋先頭フレーム参照、という2分類を顧客説明用の文面として用意する。連続性が必要な組は設計段階で2組以内に限定する。"},{"problem":"Soul ID で『同じ人が出せる』と約束して確認段階で揉める","cause":"同一性の学習をピクセル単位の同一と誤解している","fix":"約束の文言を『同一人物として自然に見える範囲で再現できる』に置き換える。顔が映る人物を使う場合は、素材の出所と同意の状況をDay 4の確認シートに項目として立てる。"},{"problem":"局所の不一致を直すために全体を再生成し、クレジットと時間を浪費する","cause":"部分編集機能の適用範囲を把握していない","fix":"物・表面・ラベルは Seedance 2.5 Edit または Edit Video に相当する機能で差し替える。空間レイアウトと光の方向の違いのみ再生成に回す。"},{"problem":"参照セットの記録を取らず、追加カットが必要になったときに同じ部屋を再現できない","cause":"その場の生成に集中し、どの参照を使ったかを残していない","fix":"生成するたびに参照セット記録表の行を埋める。Week 5の効率化とWeek 6の外注はこの記録の存在が前提になるため、記録のない生成は資産にならない。"}],"resourceIds":["hf-help-cinema-studio","hf-help-seedance","hf-help-soul-id","hf-academy-ad-3step"],"nextHint":"同一性が担保できたら、次は並べ方の問題になります。Day 3ではカットのつなぎ方（マッチカット、動きの方向、明暗）と、絵コンテ・ショットリストの具体フォーマットを作り、30秒の構成を確定させます。","setup":{"tag":"一貫性の仕込み","model":"静止画 手持ちのツールで可（ChatGPT / Gemini / Soul 2.0） ＋ Elements（Locations / Props）登録 ／ 動画 Seedance 2.0","seconds":"4秒","res":"720p","aspect":"9:16","outputs":"1","cap":"静止画16枚・動画2本","credits":"約 38 cr（$1.90）","unlimited":"0 cr","save":"Elements への登録自体にクレジットはかからない。ここに時間をかけるほど Day 5 の生成回数が減る。参照は8〜10枚から始め、矛盾を確認してから増やす。"}},{"id":"w3d3","day":3,"title":"ショットの連続性と30秒の構成設計","subtitle":"つなぎの3原則で8カットを1本にまとめ、絵コンテとショットリストを形式として固定する","why":"カット単体が良くても、並べた瞬間に崩れる映像があります。原因はつなぎで、具体的には動きの方向の衝突、明暗の段差、被写体サイズの飛躍です。これは生成の品質とは別の問題なので、生成をやり直しても直りません。もう一つの実務上の問題は、設計を頭の中に置いたまま生成を始めると、修正指示を受けたときに何を直せばよいか自分でも分からなくなることです。絵コンテとショットリストは芸術的な作業ではなく、生成回数を減らして修正を局所化するための在庫管理票です。顧客への提示資料としても、これが無い制作者は単価を上げられません。","goals":["動きの方向・明暗・被写体サイズの3原則でカット順を検証し、衝突箇所を特定して並べ替えられる","マッチカットを1組以上設計し、生成段階で成立させるための指定を書ける","絵コンテとショットリストを指定フォーマットで作成し、顧客提示と自分の生成指示の両方に使える","各モデルの尺制約（Veo 3.1 は4／6／8秒、Kling 3.0 は1回の生成で最大6カット等）を前提にカット割りを確定できる","30秒の尺配分を、フック・展開・クロージングの比率で説明できる"],"duration":"85分","timeBreakdown":[{"label":"つなぎの3原則と尺配分の理解","min":25},{"label":"絵コンテとショットリストの作成","min":40},{"label":"つなぎ検証用の生成と記録","min":20}],"tools":["スプレッドシート（ショットリスト）","紙とペン、または Popcorn に相当する絵コンテ機能","Higgsfield（Cinema Studio、Kling 3.0、Veo 3.1、image-to-video）","動画編集ソフト（つなぎの確認用の仮編集）"],"prereq":["Day 1の8カットの尺配分表が完成していること","Day 2で Locations と Props が登録され、同一客室のカットが生成できる状態であること","Day 2の参照セット記録表が運用されていること"],"theory":[{"heading":"つなぎの3原則","body":"カットの並びが成立するかは、以下の3つで判定できます。生成の良し悪しとは独立した問題です。\n\n**1. 動きの方向の連続**\n前のカットで被写体やカメラが右に動いていたら、次のカットでも右方向の運動が残っている方が繋がります。逆方向にすると、同じ空間の別の場所ではなく「別の話」に見えます。実務ルールは、**隣接する2カットで運動方向を反転させない**。反転させたいときは、間に方向のない静止カットか、垂直方向（ティルトアップ等）のカットを1枚挟みます。\n\nDay 2で大浴場の湯気を「右に流れる」と指定したのは、この原則のためです。生成段階で方向を揃えておかないと、編集段階では直せません。\n\n**2. 明暗のつなぎ**\n明るいカットから暗いカットへ急に切ると、見る人の目が追いつかず情報が落ちます。30秒の中では**明→やや暗→暗**のように段階を踏む、あるいは明暗の切り替えを1回に限定します。宿の映像は夕景と室内が多く、暗部のカットが連続しやすいので、逆に**明るいカットを意図的に配置**して暗部が続かないようにします。東京の題材では、隣棟のガラス面に反射した光、高層階の抜けた窓、曇天の拡散光が入る朝食会場が、明部を作る素材になります。\n\n**3. 被写体サイズの飛躍を避ける**\nワイド→エクストリームクローズアップのように2段飛ばすと、空間の位置関係が分からなくなります。**ワイド→ミディアム→クローズ**のように1段ずつ動かすのが基本で、飛躍させるのは意図的な衝撃を作る1箇所だけにします。\n\n8カットの並びができたら、この3項目を列にした検証表で全隣接ペア（7組）をチェックします。違反が3組以上あるなら、並べ替えで解決するのが生成し直すより速いです。"},{"heading":"マッチカットという道具","body":"マッチカットは、**形・動き・色のいずれかを一致させて異なる空間を繋ぐ**技法です。宿の映像では、時間や場所が跳ぶ箇所を自然に処理する道具として使えます。\n\n東京の宿で実際に成立しやすい組み合わせを挙げます。\n\n- **円形の一致**：大浴場の湯面に映る円い照明 → 朝食の汁物の椀の円 → 駅の時計盤の円\n- **白の一致**：リネンの白 → 朝食の皿の白 → 窓外の曇り空の白\n- **湯気と蒸気の一致**：大浴場の立ち上る湯気 → 朝食の椀から立つ湯気（上方向の運動の一致）\n- **光の筋の一致**：カーテンの隙間から差す朝日 → 路地の狭い空から落ちる一条の光\n\n生成段階でやるべきことは単純で、**一致させたい要素の位置とサイズをフレーム内で揃えて指定する**ことです。「画面中央の下から3分の1の位置に、フレーム幅の約半分を占める円形」という具合に、両カットで同じ記述をします。これを生成後に編集で合わせようとすると、トリミングで画質を失います。\n\n注意点として、30秒にマッチカットを3組入れると技法が主役になって宿が消えます。**1組、多くて2組**です。狙う箇所は、時間が跳ぶ接合部（夜→朝など）や、館内から街へ出る接合部に置くと機能します。"},{"heading":"30秒の尺配分とモデル制約の相互作用","body":"30秒の内訳の出発点は次のとおりです。\n\n- **フック 0〜3秒**（1カット）：最も強い画を置く。SNS配信なら最初の2秒で離脱が決まるため、ここに説明的なカットを置かない\n- **展開 3〜25秒**（6カット前後）：時間軸に沿った滞在の流れ。1カット3〜4秒\n- **クロージング 25〜30秒**（1カット＋情報）：外観か引きの画に、宿名と最寄駅・徒歩分数と予約先の文字情報を重ねる\n\nモデルの尺制約がここに効きます（執筆時点）。\n\n- **Veo 3.1** は **4／6／8秒**の離散値。3.5秒使いたいカットは4秒生成して切る\n- **Higgsfield DoP** は image-to-video 専用で **3秒または5秒**。捨て代を取るなら5秒\n- **Seedance 2.5** は4〜30秒。**Cinema Studio 4.0** は最長30秒・参照最大50点\n- **Kling 3.0** は15秒で、**1回の生成で最大6カット**。Element Consistency は外見と声を保持する\n- **Marketing Studio** の動画は最長15秒で、**バッチ機能がなく再生成で変種を作る**\n\nKling 3.0 の「1回の生成で最大6カット」は構成の作り方を変えます。展開部の6カットを1回の生成でまとめて作れば、カット間の色調と光が揃いやすく、つなぎの検証工数が減ります。ただし6カットのうち1カットだけが気に入らない場合、全体を作り直すか、そのカットだけ別モデルで作って差し替えるかの判断が発生します。\n\n実務の使い分けはこうなります。**まず Kling 3.0 で展開部6カットの流れを1回で作り、構成の妥当性を確認する。その後、弱いカットを個別に Seedance 2.5 や DoP で作り直して差し替える**。この順序だと、構成の検証を1回の生成コストで済ませられます。逆順（個別生成を積み上げて最後に並べる）だと、並べた時点で構成が成立していないことが分かり、作り直しになります。"},{"heading":"絵コンテのフォーマット（そのまま使う形）","body":"絵コンテは1カット1枠で、A4横に8枠（4列×2段）。各枠に以下を必ず書きます。絵の上手さは関係ありません。**四角と矢印だけで足ります**。\n\n```\n┌─────────────────────────┐\n│ カット番号: C03          │\n│ ┌───────────────────┐   │\n│ │                   │   │\n│ │   （画の略図）     │   │\n│ │   被写体を四角で   │   │\n│ │   カメラ動きを矢印 │   │\n│ └───────────────────┘   │\n│ 内容: 大浴場の湯気       │\n│ サイズ: MS（ミディアム） │\n│ カメラ: 固定             │\n│ 運動方向: 湯気→右上      │\n│ 明暗: 中（高窓からの光） │\n│ 使用尺: 3.5s             │\n│ 音: 湯のせせらぎ         │\n│ 前カットとのつなぎ: 白一致│\n└─────────────────────────┘\n```\n\n絵の中に必ず入れる記号を3つ決めます。**実線の四角＝主要被写体**、**矢印＝カメラまたは被写体の運動方向**、**斜線＝暗部**。この3記号があれば、つなぎの3原則の検証が絵コンテを見るだけでできます。\n\n「運動方向」「明暗」の欄を枠内に置いているのが実務上の要点です。この2欄を横に読んでいけば、隣接カットの衝突が目で分かります。欄がないフォーマットだと、検証のために毎回別表を作ることになります。\n\n顧客提示では、この絵コンテに加えて**代表3カットの静止画**を添えます。略図だけでは宿側が完成形を想像できず、確認の判断ができません。逆に全8カットの静止画を先に作ると、構成が変わったときに作り直しになるので3枚に限定します。"},{"heading":"ショットリストのフォーマット（14列）","body":"ショットリストは生成の作業指示書であり、原価と進捗の管理票です。列は次の14列に固定します。\n\n| # | 列名 | 記入例 |\n|---|---|---|\n| 1 | カット番号 | C03 |\n| 2 | 使用尺 | 3.5s |\n| 3 | 生成尺 | 5s |\n| 4 | 内容 | 大浴場、湯気が右上へ |\n| 5 | ショットサイズ | MS |\n| 6 | カメラ動作 | 固定 |\n| 7 | 運動方向 | 湯気→右上 |\n| 8 | 明暗 | 中・高窓からの光 |\n| 9 | 使用Location | 宿名_大浴場_夜 |\n| 10 | 使用Props | なし |\n| 11 | モデル | DoP 5s（i2v） |\n| 12 | 静止画工程 | 要（P-03） |\n| 13 | 確認必要事実 | 大浴場が実在し宿泊者が使えるか（Day4へ） |\n| 14 | 状態 | 未生成／生成中／採用／差し替え |\n\n列4と列7と列8は絵コンテと同じ値を書きます。二重管理に見えますが、絵コンテは構成の検証用、ショットリストは生成と原価の管理用で、使う場面が違います。値がずれたら構成が変わった印なので、ずれの検出自体が機能です。\n\n列13（確認必要事実）が宿泊施設では特に重要です。「大浴場」「高層階からの眺望」「朝食付き」「駅徒歩3分」のように、**映像が事実を主張してしまう要素**をここに書き出します。Day 4でこの列をそのまま表現確認シートに転記します。列13が空のショットリストは、Day 4の作業ができません。\n\n列14の状態管理で、生成回数も併記します（「採用（3テイク）」）。この数字がWeek 5の効率化とWeek 6の見積りの根拠になります。採用率が分からないまま見積ると、原価を外します。"}],"steps":[{"n":1,"action":"フック候補を3つ挙げて1つ選ぶ","detail":"Day 1の棚卸しから、冒頭0〜3秒に置く候補を3つ挙げます。候補の判定基準は「説明なしで何の映像か分かるか」「2秒で画の意味が取れるか」の2つ。東京の宿では、夜のエントランスの灯り、早朝の路地、大浴場の湯気が強い候補になりやすい。客室の引きは情報量が多く、フックには向きません。","check":"フック候補3つと選定理由が記録され、1つに決まっている"},{"n":2,"action":"展開部6カットを時間軸で並べる","detail":"Day 1の時間軸（到着→大浴場→街で夕食→ロビー→朝食→駅へ）に沿って6カットを並べます。時間軸の跳びは2回まで。各カットに使用尺3〜4秒を割り当て、強いカットに4秒、つなぎに3秒と差をつけます。","check":"展開部6カットが時間軸順に並び、使用尺の合計がフックとクロージングを含めて30.0秒以下になっている"},{"n":3,"action":"クロージングと文字情報を設計する","detail":"最終2〜5秒のカットと、そこに重ねる文字情報（宿名・最寄駅と徒歩分数・予約先またはアカウント名）を決めます。文字は生成させず編集で入れます。生成モデルは文字を高確率で崩すため、宿名やURLを生成に含めると修正に時間を取られます。","check":"クロージングのカットと文字情報の内容が決まり、文字は編集工程で入れる方針が記録されている"},{"n":4,"action":"つなぎ検証表で全隣接ペアを点検する","detail":"隣接ペア7組について、運動方向の衝突／明暗の段差／被写体サイズの飛躍の3項目を○×で判定する表を作ります。×が付いた組は、並べ替えで解消できるか、間に1カット挟むか、生成段階で運動方向を変えるかの3択で対処方針を書きます。","check":"7組×3項目の検証表が埋まり、×の組すべてに対処方針が書かれている"},{"n":5,"action":"マッチカットを1組設計する","detail":"時間が跳ぶ接合部を1つ選び、形・動き・色のいずれかを一致させるマッチカットを設計します。一致させる要素のフレーム内の位置とサイズを、両カットで同一の文言として書きます（例：画面中央やや下、フレーム幅の約半分を占める円形）。設計は2組までに留めます。","check":"マッチカット1組の両カットに、一致要素の位置とサイズが同一文言で記述されている"},{"n":6,"action":"絵コンテを8枠で作成する","detail":"A4横に4列×2段の8枠を作り、各枠にカット番号・画の略図・内容・ショットサイズ・カメラ動作・運動方向・明暗・使用尺・音・前カットとのつなぎを記入します。略図は実線の四角（主要被写体）、矢印（運動方向）、斜線（暗部）の3記号だけで描きます。絵の上手さは評価対象外です。","check":"8枠すべてに10項目が記入され、3記号で略図が描かれている"},{"n":7,"action":"ショットリストを14列で作成する","detail":"カット番号／使用尺／生成尺／内容／ショットサイズ／カメラ動作／運動方向／明暗／使用Location／使用Props／モデル／静止画工程／確認必要事実／状態の14列で8行の表を作ります。列13の確認必要事実は、映像が事実を主張してしまう要素（大浴場やサウナの有無、眺望、駅からの距離、朝食の内容など）をすべて書き出します。この列が空だとDay 4の作業ができません。","check":"14列×8行が埋まり、列13に3項目以上の確認必要事実が記入されている"},{"n":8,"action":"Kling 3.0 で展開部の流れを1回生成する","detail":"Kling 3.0 は1回の生成で最大6カットを作れるため、展開部6カットの流れを1回の生成で作り、構成の妥当性を検証します。プロンプトにはカットの順序と各カットの内容・運動方向を明記します。目的は個々のカットの完成度ではなく、並びが成立するかの確認です。","check":"展開部の流れが1本のクリップとして生成され、構成の妥当性が判定できている"},{"n":9,"action":"弱いカットを特定して個別に作り直す","detail":"手順8の結果から、品質または意図との乖離が大きいカットを1〜2本特定し、Seedance 2.5 または DoP（image-to-video、3秒または5秒）で個別に生成して差し替えます。差し替え時はDay 2の Location と参照セットを使い、色調が他カットと揃うようにします。","check":"1〜2カットが差し替えられ、差し替え前後の違いと使用モデルが記録されている"},{"n":10,"action":"マッチカットの組を生成して成立を確認する","detail":"手順5で設計したマッチカットの2カットを生成し、仮編集で繋いで一致が成立しているか確認します。位置やサイズがずれている場合は、トリミングで合わせるのではなくプロンプトの位置記述を修正して再生成します。トリミングで合わせると画質を失います。","check":"マッチカットの組が繋いだ状態で一致しており、修正した場合はプロンプト側で修正している"},{"n":11,"action":"仮編集で30秒に並べて尺を実測する","detail":"採用クリップを編集ソフトに並べ、各カットの頭と尻を切って使用尺に合わせ、合計が30秒以内であることを実測します。音は付けずに映像だけで通して見て、つなぎの違和感が残る箇所をメモします。実測値が設計値とずれている箇所はショットリストに反映します。","check":"30秒以内の仮編集が1本でき、設計値と実測値のずれがショットリストに反映されている"},{"n":12,"action":"採用率と生成回数を集計する","detail":"ショットリストの列14から、カットごとの生成回数と採用数を集計し、全体の採用率を算出します。クレジット実消費も記録し、Day 1の概算との差分を出します。差分の原因（想定より採用率が低かった／モデル選択が合わなかった等）を1行で書きます。","check":"採用率とクレジット実消費が数値で算出され、Day 1の概算との差分の原因が記録されている"}],"prompts":[{"label":"展開部6カットの連続生成（Kling 3.0・マルチショット）","text":"A 15-second sequence of six consecutive shots inside and around a small urban hotel in Tokyo, consistent cool-daylight-plus-warm-practical color treatment across all six shots, no on-screen text, no logos, no visible brand signage, no readable shop names, no faces. SHOT 1 (medium wide, static): a guest room floor-to-ceiling window with the glass flank of a neighbouring building outside bouncing soft reflected daylight in, sheer curtain drifting slowly to the right. SHOT 2 (close-up, slow push in): folded crisp white linen on a low platform bed, soft reflected window light raking from the left. SHOT 3 (medium, static): an indoor communal tiled bath, thick steam rising and drifting to the right, lit by a narrow clerestory slot high on the dark tiled wall. SHOT 4 (close-up, slight tilt down): a steaming bowl of broth and small breakfast plates on a dark wood counter, warm practical pendant above. SHOT 5 (medium wide, slow pan right): a small hotel lobby lounge with low warm lighting, a glazed wall at the right showing the wet street and the coloured glow of street lighting outside at dusk. SHOT 6 (wide, static, low angle): an empty narrow back street at first light, wet asphalt, shuttered low-rise shopfronts, morning sun catching only the upper floors at the far end. Photorealistic throughout, restrained contrast, fine grain, no lens flare artifacts.","note":"Kling 3.0 の1回の生成で最大6カットという性質を使い、展開部の構成の妥当性を1回の生成コストで検証する用途。全6カットで運動方向を右方向に揃え（カーテン→右、湯気→右、パン→右）、つなぎの第1原則を生成段階で担保している。色処理を全カット共通と明記しているのは明暗のつなぎのため。東京の光の性質（隣棟からの反射光、高窓からの限られた光、夜の街明かりの色かぶり）を各カットの光スロットに書き分けている。可変部は6カットの内容と各カットの運動方向。顔・ロゴ・文字・読める店名を全面的に排除しているのはDay 4の論点を先回りして避けるため。","status":"未検証","flow":{"code":"T2V","step":"単発","input":"新規。テキストのみで6カット15秒を一度に生成する。静止画も参照画像も渡さない。Day 1の尺配分表の展開部6カットを1文にまとめて投げる","output":"6カット連続の15秒動画1本。展開部の構成とつなぎの妥当性が1回の生成費で確認できる","next":"弱いカットを特定する判定材料にする。採用カットはそのまま仮編集へ、不採用カットは個別に作り直す","where":"生成画面でモデルを選ぶ（image-to-video）","whereNote":"最も安く、Seedance 2.0 系・Kling 3.0・Wan 2.7 なら Unlimited 対象"}},{"label":"マッチカット前半：湯面に映る円い照明（image-to-video）","text":"The water surface of an indoor communal bath, a single circular ceiling light reflected on the water so that the circle of light occupies roughly half the frame width and is centred slightly below the middle of the frame; steam rising from the centre of the circle and drifting upward and to the right, the water surface rippling faintly; medium shot, high angle looking almost straight down, 35mm equivalent, deep focus, camera static; wet dark stone rim, water with a soft specular sheen, matte ceramic tile outside the rim; photorealistic, warm practical light from above against cool ambient, restrained contrast, fine grain.","note":"マッチカット前半。一致させる要素（円形）の位置とサイズを『フレーム幅の約半分、中央やや下』として明示し、後半のプロンプトに同一文言を入れる。この指定を生成段階で揃えておかないと、編集時にトリミングで合わせることになり画質を失う。屋内の大浴場では天井照明の反射が円形要素として使えるので、浴槽の形に依存せず成立する。可変部は照明の形状と湯気の量。","status":"未検証","flow":{"code":"I2V","step":"工程1 / 2","input":"大浴場の湯面を真上から捉えた静止画1枚を起点にする。円の位置とサイズを指定した文を添えて動かす。新しく画像は作らない","output":"湯面に映る円い照明が画面中央やや下に来るクリップ1本。マッチカットの前半側が確定する","next":"同レッスンの「マッチカット後半：朝食の皿の円」（I2V）に同一文言の円指定を渡して対になる後半を作る","where":"生成画面でモデルを選ぶ（image-to-video）","whereNote":"最も安く、Seedance 2.0 系・Kling 3.0・Wan 2.7 なら Unlimited 対象"}},{"label":"マッチカット後半：朝食の皿の円（image-to-video）","text":"A circular white ceramic bowl of clear morning miso broth, the circular rim of the bowl occupying roughly half the frame width and centred slightly below the middle of the frame; steam rising from the centre of the circle and drifting upward and to the right, the broth surface rippling faintly; close-up, high angle looking almost straight down, 50mm equivalent, shallow depth of field on the counter edge, camera static; glazed white ceramic, clear broth with a soft specular sheen, dark wood counter grain outside the rim; photorealistic, soft diffused daylight from the right through a street-level window, neutral grade with a slight warm shift, restrained contrast, fine grain.","note":"マッチカット後半。前半と一致させているのは4点：円の位置（中央やや下）、円のサイズ（フレーム幅の約半分）、湯気の方向（上→右）、カメラ角度（ほぼ真上から）。一致項目を4点に絞り、それ以外（色温度・被写体・焦点距離）は意図的に変えることで、夜から朝への時間の跳躍を成立させる。可変部は器の色と汁物の種類。","status":"未検証","flow":{"code":"I2V","step":"工程2 / 2","input":"朝食の皿を真上から捉えた静止画1枚を起点にする。工程1と同一文言の円指定（位置・サイズ・湯気の方向・カメラ角度）を渡す","output":"皿の円が工程1と同じ位置とサイズに来るクリップ1本。夜から朝への跳躍が成立する","next":"ここで完結。工程1のクリップと隣接させて仮編集に置き、マッチカットが成立しているか実測する","where":"生成画面でモデルを選ぶ（image-to-video）","whereNote":"最も安く、Seedance 2.0 系・Kling 3.0・Wan 2.7 なら Unlimited 対象"}}],"expected":"8枠の絵コンテ、14列×8行のショットリスト、7組×3項目のつなぎ検証表、Kling 3.0 による展開部の連続生成クリップ1本、個別差し替えカット1〜2本、マッチカット1組、30秒以内の仮編集1本、採用率とクレジット実消費の集計が揃っている状態です。この時点で、どのカットがなぜその位置にあるかを1カットずつ説明でき、ショットリストの確認必要事実列に3項目以上が書き出されていれば、Day 4に進める状態です。","assignment":{"title":"絵コンテ・ショットリストの作成と30秒構成の確定","brief":"Day 1の尺配分とDay 2の一貫性素材をもとに、30秒PR動画の構成を確定させます。8枠の絵コンテと14列のショットリストを指定フォーマットで作成し、つなぎ検証表で全隣接ペアを点検してください。Kling 3.0 のマルチショットで展開部の流れを1回生成して構成の妥当性を確認し、弱いカットのみ個別に差し替えます。ショットリストの確認必要事実列は翌日の表現確認シートの原材料になるため、映像が事実を主張してしまう要素を漏らさず書き出してください。","deliverables":["絵コンテ8枠（10項目記入・3記号の略図）","ショットリスト14列×8行","つなぎ検証表（7組×3項目・対処方針つき）","マッチカット設計書（一致要素の位置とサイズを同一文言で）","Kling 3.0 による展開部連続生成クリップ1本","個別差し替えカット1〜2本と使用モデル記録","マッチカット1組のクリップ","30秒以内の仮編集1本","採用率・生成回数・クレジット実消費の集計とDay 1概算との差分"],"constraints":["使用尺の合計を30.0秒以内に収めること","マッチカットは1〜2組までとすること","時間軸の跳躍は2回までとすること","宿名・最寄駅名・URL等の文字情報は生成に含めず編集工程で入れること","顧客提示用の静止画は代表3カットまでとすること","作業時間は85分以内"]},"success":["絵コンテ8枠すべてに運動方向と明暗の欄が記入され、横に読んで隣接カットの衝突を判定できる","ショットリストの14列すべてが埋まり、列13（確認必要事実）に3項目以上ある","つなぎ検証表で×が付いた組すべてに対処方針が書かれ、仮編集で解消が確認できている","マッチカットの一致要素の位置とサイズが両カットで同一文言になっており、トリミングでの調整に頼っていない","仮編集の実測尺が30.0秒以下で、設計値とのずれがショットリストに反映されている","採用率とクレジット実消費が数値で出ており、Day 1の概算との差分の原因が1行で説明されている"],"rubric":[{"axis":"映像の品質","pass":"3点＝8カットすべてが使用可能な品質で破綻がない。5点＝差し替えたカットが他カットと色調・粒状感で揃っており、どれが差し替えか見分けられない。"},{"axis":"動きの自然さ","pass":"3点＝隣接カットで運動方向が反転している箇所がない。5点＝マッチカットのつなぎ目で運動が連続し、時間の跳躍が違和感なく成立している。"},{"axis":"ブランド整合性","pass":"3点＝8カット全体で色調と光の質が揃っている。5点＝絵コンテの明暗欄が段階的に設計され、暗部のカットが3本以上連続していない。"},{"axis":"マーケ目的整合性","pass":"3点＝フックが説明なしで2秒以内に意味が取れる画になっている。5点＝クロージングの文字情報が宿の予約経路と立地の訴求（最寄駅と徒歩分数）に対応しており、配信先の仕様（縦横比・文字の安全領域）を満たしている。"},{"axis":"再現性","pass":"3点＝絵コンテとショットリストが第三者に渡せる粒度になっている。5点＝別の宿の案件にそのまま使えるフォーマットとして空欄テンプレートが分離されている。"},{"axis":"時間とコスト","pass":"3点＝採用率とクレジット実消費が集計されている。5点＝Kling 3.0 で構成を一括検証したことによる生成回数の削減量を、個別生成の場合との比較で数値化できている。"}],"pitfalls":[{"problem":"個々のカットを単体で作り込んでから並べ、構成が成立せず作り直しになる","cause":"構成の検証を最後に回している","fix":"Kling 3.0 の1回の生成で最大6カットという性質を使い、展開部の流れを先に1回で作って構成を検証する。個別の作り込みは構成が確定した後に行う。"},{"problem":"隣接カットで運動方向が反転し、同じ空間に見えない","cause":"生成時に運動方向を指定していないため、各カットの動きが偶然で決まっている","fix":"ショットリストの運動方向列を先に埋め、プロンプトに方向語（drifting to the right など）を明示する。既に生成済みで反転している場合は、間に静止カットまたは垂直方向のカットを1枚挟む。"},{"problem":"マッチカットを編集時のトリミングで合わせ、画質が落ちる","cause":"一致要素の位置とサイズを生成段階で指定していない","fix":"両カットのプロンプトに一致要素の位置とサイズを同一文言で書き、ずれていたら再生成する。トリミングで合わせるのは最後の手段。"},{"problem":"Veo 3.1 で3.5秒のカットを作ろうとして尺が合わない","cause":"モデルの尺が離散値（4／6／8秒）であることを設計に反映していない","fix":"ショットリストに生成尺列を設け、使用尺から逆算して選択可能な尺を記入する。3.5秒使用なら4秒生成、3秒使用なら DoP の5秒か Veo 3.1 の4秒。"},{"problem":"暗いカットが4本以上連続し、通して見ると重く情報が落ちる","cause":"宿の映像は夕景と室内が多く、自然に暗部が集まる","fix":"絵コンテの明暗欄を縦に読み、暗が3本以上連続している箇所に、隣棟のガラス面に反射した光が入る窓のカットや、曇天の拡散光が入る朝食会場のカットを挿入する。東京の題材では高層階の抜けた窓と反射光が最も強い明部素材になる。"},{"problem":"ショットリストの確認必要事実列が空のままDay 4に進んで手戻りする","cause":"生成作業に集中し、映像が事実を主張している要素を意識していない","fix":"各カットについて『この映像を見た人が事実だと受け取る情報は何か』を1つ以上書き出す。大浴場やサウナの有無、眺望、朝食の内容、設備の有無、駅からの距離、客室の広さがよく該当する。"}],"resourceIds":["hf-academy-cinematic-ad-e2e","hf-help-cinema-studio","hf-help-seedance","hf-academy-blockbuster"],"nextHint":"構成が確定し、映像が主張している事実が洗い出されました。Day 4は本カリキュラムで最も重要度の高いレッスンです。実在施設を扱う広告として、その主張が本当に事実かを検証する手順と法令上の論点を扱います。","setup":{"tag":"連続性の検証","model":"静止画 手持ちのツールで可（ChatGPT / Gemini / Soul 2.0） ／ 動画 Kling 3.0（始点終点フレーム指定、1回の生成で複数カットも可）","seconds":"5秒","res":"720p","aspect":"9:16","outputs":"1","cap":"静止画8枚・動画6本","credits":"約 61 cr（$3.05）","unlimited":"0 cr","save":"つなぎの検証は2カット分で十分。全カットで試すのは Day 5 に回す。Kling 3.0 は1回の生成で複数カットを作れるため、つなぎの練習に向く。"}},{"id":"w3d4","day":4,"title":"実在施設を扱う正確性と法令・倫理の実務","subtitle":"捏造リスクの12項目点検と表現確認シートで、事実と表示方法を担保する工程を制作に組み込む","why":"この1日が、Week 3で最も重要です。AI生成は、存在しない大浴場やサウナ、出していない朝食、実際より広い客室、窓から見えない眺望を、極めて説得力のある映像として平然と出力します。制作者がそれを「雰囲気素材」と思って納品し、宿が配信すると、表示の責任を負うのは広告主である宿であり、作った側も取引を失います。景品表示法の優良誤認表示は、表示内容全体から一般消費者が受ける印象で判断され、故意である必要がありません。さらに、注意書きを付ければ済むという発想も通りません。消費者庁の実態調査では、動画広告の打消し表示の42.4%が画面表示2秒以下で、ある検証動画では全部読めた人が2.4%でした。確認工程と表示仕様を持っていること自体が、AI映像を売る事業者の差別化要素になります。","goals":["AI生成で捏造されやすい要素を5類型に整理し、最低12項目の確認チェックリストで自分の成果物を点検できる","景品表示法第5条第1号の優良誤認表示が「表示内容全体から一般消費者が受ける印象・認識」で判断されることを前提に、自作から該当しうる表現を特定できる","打消し表示の実態調査の数値を踏まえ、動画における打消し表示の制作仕様（最低表示秒数・文字サイズ・音声・配置）を自分で定義できる","ステルスマーケティング規制の対象が広告主であることを理解し、動画での表示方法の不適切例を避けられる","日本にAI生成物の表示義務が存在しないことと、ソフトロー・景表法の間接的適用・Higgsfield規約の3点セットを正確に説明できる","著作権（類似性と依拠性）・商標・肖像権／パブリシティ権の観点で参照素材の使用可否を判断し、プロンプト記録を証拠性のある台帳として運用できる","宿に提出する表現確認シートを作成し、確認の責任分担を書面化できる"],"duration":"90分","timeBreakdown":[{"label":"捏造リスクと法令の論点の理解","min":30},{"label":"12項目点検と打消し表示仕様の定義","min":30},{"label":"表現確認シートの作成と宿への提出準備","min":30}],"tools":["スプレッドシート（チェックリスト・表現確認シート・制作台帳）","Day 3のショットリスト（列13 確認必要事実）","宿の一次情報（公式サイト、館内図、宿泊約款、料金表、大浴場の掲示内容、朝食の運用）","Higgsfield（部分編集。Seedance 2.5 Edit / Edit Video に相当する機能）","動画編集ソフト（打消し表示の表示秒数と文字サイズの実測）"],"prereq":["Day 3の絵コンテとショットリストが完成し、列13（確認必要事実）が3項目以上埋まっていること","Day 1で作成した宿への質問票があること","Day 2で人物を扱うかどうかの判断が済んでいること","Week 1から続けているプロンプトと生成の記録が残っていること"],"theory":[{"heading":"前提と、景表法第5条第1号の経路","body":"このレッスンは実務上の論点整理であり、**法的助言ではありません**。筆者は弁護士ではなく、個別案件がどの条文にどう当たるかの判断はできません。以下もすべて「該当しうる」「確認が必要」という水準で、「抵触する」という断定ではありません。迷う表現は入れない、グレーなら広告主である宿の判断に委ねる、媒体審査を使う、影響の大きい案件は弁護士や広告の専門家に確認する——この4つを運用ルールにします。\n\n経路は景品表示法**第5条第1号の優良誤認表示**です。商品・サービスの内容について実際より著しく優良であると示す表示が対象になります。\n\n宿泊に明示的に及ぶ公式文書の中核は、消費者庁**「メニュー・料理等の食品表示に係る景品表示法上の考え方について」**（2014-03-28策定、2014-12-01・2016-04-01改定）です。**レストラン・ホテル・百貨店のメニューや料理の表示**を対象と明記しており、押さえる点は2つ。判断基準は「**表示内容全体から一般消費者が受ける印象・認識**」であること、そして**故意である必要がない**ことです。「AIが勝手に出した」は免責の理由になりません。\n\nさらに重要なのは、**写真がメニュー全体の印象の一部を構成する**とされている点です。同文書では料理写真が誤認を招くとされた事例、風景写真と産地表記の組み合わせが誤認とされた事例が挙げられています。**映像そのものが表示を構成します**。「大浴場あり」と書かなくても、湯気の立つ広い浴槽の映像を宿のPRとして出せば、宿泊者が使える大浴場があるという表示として受け取られうる。"},{"heading":"AI生成が捏造する5類型と12項目チェックリスト","body":"生成AIは指示していない要素を補完します。宿泊施設で起きやすい捏造は5類型です。**設備**（存在しない大浴場・サウナ・バルコニー・駐車場）、**料理**（提供していない品目、実際と異なる量や皿数）、**景観**（窓から見えない眺望、実際より抜けた視界、隣接建物の消去）、**サービス**（やっていないルームサービス・荷物預かり・手配）、**規模と仕様**（実際より広い客室、多いベッド数、違う間取り）。\n\n点検は**12項目**で行います。各項目に「該当カット番号／宿の確認結果／対処」の3列を付けます。\n\n1. 窓から見える景色が実際の方角・階数・隣接建物と一致（隣棟を消して空を広く見せていないか）\n2. 客室の広さ・間取り・ベッド数・定員が該当客室タイプと一致（コンパクトな部屋を実際より広く見せていないか）\n3. 浴場が大浴場か客室内のユニットバスか、サウナがあるか、宿泊者が無料で使えるかが一致\n4. 食事の内容・品目数・提供形式・開始時刻がプランと一致\n5. 館内設備（サウナ・コインランドリー・電子レンジ・Wi-Fi・駐車場・屋上）が実在し宿泊者が使える\n6. 季節・並木の状態・天候が配信時期に実際に起こりうる状態\n7. 立地と距離（最寄駅まで徒歩何分、使える路線）が実測値と一致\n8. 近隣飲食店との連携、荷物預かり、レンタサイクル等の有無と条件が一致\n9. 人物が実在人物を参照していない、している場合に同意と権利処理がある\n10. 他社のロゴ・商標・近隣店舗の看板・ブランド商品が映り込んでいない\n11. 他施設の写真や映像を参照素材に使っていない\n12. 映像内の文字情報（宿名・料金・URL・プラン名・受賞表示）が正確で根拠がある\n\n**1〜8は宿にしか答えられず、9〜12は制作者の責任**です。この分担を明示しないまま「確認しました」と言うのが最も危険です。\n\n混同しないこと。**「おとり広告」は在庫・取引可能性の規制**（公正取引委員会告示第17号・1993年）で、映像の誇張には該当しません。不動産の運用基準も宿泊には直接及びません。"},{"heading":"打消し表示は解決策にならない","body":"条件を注記すれば済む、という発想は数値で否定されています。消費者庁**「打消し表示に関する実態調査報告書」（2017年7月）**の動画広告に関する結果です。\n\n- 打消し表示のうち**42.4%が画面表示2秒以下**\n- **99.2%が文字のみ**。**68.6%は本体表示が音声なのに打消し表示は音声なし**\n- **20.3%は本体表示より後、または別画面**に表示\n- ある検証動画では、**6つの打消し表示のうち1つ以上を見落とした人が97.6%、全部読めた人は2.4%**\n- 読まない理由の最多は「**読み終える時間がなかった**」49.8%\n\n30秒で8カットという構成は、構造的にこの問題を抱えます。1カット3〜4秒の中に条件を出せば、2秒以下の表示になりがちです。\n\nそこで**打消し表示の制作仕様を自分で定義**し、チェックリスト項目として数値で固定します。\n\n- **最低表示秒数**：文字数から音読時間を見積り、その2倍以上を目安に自分の基準値を決める\n- **文字サイズ**：配信先の最小表示環境（スマートフォン縦）で判読できる下限を実測して決める\n- **音声**：本体の訴求が音声で行われる場合、打消しも音声で入れるかを検討する\n- **配置**：末尾や別画面ではなく、**該当する本体表示と同じ画面・同じ時間帯**に置く\n- **検証**：実機のスマートフォンで再生し、第三者に1回見せて読めたかを確認する\n\n結論として、**打消し表示で救える表現は限定的**です。条件が複雑な訴求は、打消しを足すのではなくカットを差し替えるか不使用にする方が安全で、制作としても速い。"},{"heading":"ステマ規制、AI開示、Higgsfieldの規約","body":"**ステマ規制**（内閣府告示第19号、2023-03-28告示・2023-10-01施行）。**規制対象は広告主のみで、インフルエンサーや第三者は対象外**です。運用基準は不適切な例として「**動画で表示時間が短すぎる**」「末尾にのみ表示」「ハッシュタグに埋没」「小さすぎる」を列挙。Q&Aは動画について**冒頭のみの表示では不十分な場合があり、継続的な画面表示が望ましい**としています。事業者自身のサイト・SNSアカウントは原則対象外です。\n\n**AI生成の開示**。2026-10-11時点で、**広告にAI生成であることを表示せよという法的義務は日本に存在しません**。法律・政令・告示のいずれにもなく、JARO・JIAA・JAA もAI生成広告の基準を出していません。あるのは**非拘束のソフトロー**だけで、日本広告業協会のAIポリシーも「努める」という任意の立て付けです。**AI事業者ガイドライン第1.2版**（総務省・経産省、2026-03-31）は自身を非拘束的なソフトローと明記し、電子透かし等の来歴確認手段やラベル・注記を**推奨**するにとどまります。顧客には次の3点で説明します。\n\n- **①表示義務はない**。ただし表示の有無にかかわらず誤認させれば景表法が適用されうる\n- **②知財推進計画2026でハードロー化を含め継続検討中**であり流動的\n- **③Higgsfield の規約は、法が求める場合の開示と来歴表示の非除去を課している**\n\n**Higgsfield の規約**（執筆時点）：入出力の所有権を主張せず商用利用を制限しない旨を定め、解約後も書き出し済み出力の権利は存続し顧客への移転が可能。ただし**唯一性・独占性は保証されず**、権利処理は利用者責任、**来歴表示の除去は禁止**。**各モデル提供元の規約も適用され、より厳しい方が優先**されます。**Soulページは画像の商用利用可と明記、Sora 2ページは有料プランに紐づけており記述に不整合がある**ため、どちらも普遍のルールとせず案件ごとに確認し、顧客に独占性を約束しないこと。"},{"heading":"著作権・商標・肖像権と、記録が持つ意味","body":"**著作権**。文化庁の**「AIと著作権に関するチェックリスト＆ガイダンス」**（著作権課、2024-07-31）が実務的です。侵害には**類似性と依拠性の両方**が必要で、**生成AIの仕組み上、利用者が元の作品を知らなくても類似した出力が生じうる**とされています。「生成」と「利用」は別の行為で、**ネット公開や配布は私的使用の例外から外れることが多い**。既存の作品名・キャラクター名の入力は依拠性の認定を支えます。そして同文書は**プロンプトと生成の記録を残すことを推奨**しています。これはWeek 1から続けている制作台帳と完全に一致します。記録は効率化の道具であると同時に、非依拠を説明する材料になりえます。なお「AIと著作権に関する考え方について」（文化審議会、2024-03-15）は法的拘束力がないと自ら明記しています。\n\n**商標**：映り込む他社ロゴ、ブランド商品、近隣店舗や鉄道事業者の看板は、広告での使用に許諾が必要になりえます。東京の宿は周辺の街が画に入るので、商店街の店名、駅の表示、自販機やコンビニの意匠が写り込みやすく、飲食より論点が増えます。Day 1からロゴと看板を生成に含めないのは、文字が崩れる技術的理由とこの権利的理由の両方です。\n\n**肖像権・パブリシティ権**：日本では**これらを直接定めた法律はなく、判例法理（不法行為）で形成されています**。文化庁の資料は著作権に限定しており、肖像権の根拠として引用してはいけません。知的財産推進計画2026（2026年6月）は、俳優・声優の声を模した無断生成・公開について「一定の場合にはパブリシティ権等の侵害に該当し得る」と**可能性として**述べるにとどまり、確定的なルールではありません。実務では実在の従業員や宿泊客の素材を同意なしに参照に使わず、生成人物も実在人物に似せない。人を入れないか後ろ姿・手元・遠景シルエットに留めるのが安全です。東京では街歩きや商店街のカットで通行人が写り込みやすいので、人通りのない時刻の構図か、人を描かせない指定を生成段階で入れます。"}],"steps":[{"n":1,"action":"ショットリストの列13を主張文に展開する","detail":"Day 3のショットリスト列13を、カットごとに「映像が主張している事実」として1文に書き直します。「大浴場のカット」ではなく「館内に共用の大浴場があり、宿泊者が追加料金なしで利用できる」のように、主語述語のある文にします。判断基準は表示内容全体から一般消費者が受ける印象なので、自分の意図ではなく受け取られ方で書きます。","check":"全カットについて主張文が1文ずつ書き出され、合計10行以上になっている"},{"n":2,"action":"5類型で捏造を洗い出す","detail":"設備／料理／景観／サービス／規模と仕様の5類型で8カットを総点検します。重要なのは、自分が指示していないのにフレームに入っている要素（画面の隅のサウナ扉、テーブル上の追加の皿、窓外に広がりすぎた空、廊下の奥の自販機）を探すことです。確認は「書いた要素があるか」ではなく「書いていない要素が入っていないか」で行います。","check":"5類型それぞれについて該当要素の有無とカット番号が記録されている"},{"n":3,"action":"12項目チェックリストを適用する","detail":"12項目に「該当カット番号／宿の確認結果／対処」の3列を付けた表を作り、まず該当カット番号を埋めます。項目1〜8は宿にしか答えられないため確認結果は空欄のまま残し、項目9〜12（人物・他社ロゴ・他施設参照・文字情報）は制作者の責任範囲として自分で判定して埋めます。この責任分担を表の見出しに明記します。","check":"12項目すべてに該当カット番号が入り、項目9〜12の判定が完了し、責任分担が表に明記されている"},{"n":4,"action":"参照素材の出所を全件洗い出す","detail":"Day 2の参照セット記録表を開き、使った参照画像すべてを自作生成／宿から提供／権利処理済み素材／出所不明の4分類にします。出所不明と他施設の写真に由来するものはすべて参照セットから除外し、該当カットを自作素材で再生成します。スタイル参照 の参照も同じ基準で扱います。スタイルだからいい、ということにはなりません。","check":"全参照素材が4分類に振り分けられ、出所不明と他施設由来のものが除外されている"},{"n":5,"action":"プロンプトと生成の記録を台帳として整える","detail":"文化庁のチェックリスト＆ガイダンスはプロンプトと生成の記録を残すことを推奨しています。Week 1から続けている記録を、カット番号／日時／使用モデル／プロンプト全文／参照素材とその出所／生成回数／採否の列に整え、案件単位で保存します。既存の作品名やキャラクター名をプロンプトに入れていないかもここで確認します。","check":"案件単位の制作台帳が7列で整い、プロンプトに既存作品名・キャラクター名が含まれていないことを確認済み"},{"n":6,"action":"他社ロゴ・商標・看板の映り込みをコマ送りで確認する","detail":"採用クリップを1本ずつ0.5秒程度のコマ送りで確認し、ブランド商品のパッケージ、近隣店舗や駅の看板、自販機やコンビニの意匠、読める形の崩れた文字列を検出します。該当箇所は Seedance 2.5 Edit または Edit Video に相当する部分編集で差し替えるか、構図を寄せて画角から外す形で再生成します。","check":"全クリップのコマ送り確認が完了し、検出箇所の対処方法が記録されている"},{"n":7,"action":"優良誤認になりうる表現をランク付けする","detail":"手順1の主張文のうち、実際より優良に見せている可能性があるものに高・中・低のリスクを付けます。眺望・部屋の広さ・大浴場やサウナの有無・朝食内容・駅からの距離が高リスクになりやすい。高リスクには、条件併記・カット差し替え・不使用のいずれかの対処方針を先に決めます。「抵触する」と書かず「該当しうる」と記述します。","check":"全主張にリスク3段階が付き、高リスク項目すべてに対処方針が書かれている"},{"n":8,"action":"打消し表示の制作仕様を定義し実機で検証する","detail":"動画広告の打消し表示は42.4%が2秒以下、ある検証動画では全部読めた人が2.4%という実態調査の結果を前提に、最低表示秒数（文字数からの音読時間の2倍以上など）、スマートフォン縦での判読可能な文字サイズ下限、音声の有無、該当する本体表示と同じ画面・同じ時間帯に置く配置ルールの4点を数値と条件で定義します。そのうえで条件併記が必要なカットに仮の打消し表示を入れ、実機のスマートフォンで再生して第三者に1回だけ見せ、何が書かれていたかを言わせます。読めなければ秒数か文字サイズを上げ、それでも収まらないならカットを差し替えるか不使用にします。打消しを足して解決しようとしないのが要点です。","check":"4点の仕様が数値または明確な条件で定義され、実機検証で第三者が1回の再生で内容を言えている（または該当カットを差し替え・不使用にしている）"},{"n":9,"action":"ステマ規制の観点で配信方法と表示を点検する","detail":"どのアカウントからどういう文脈で配信するかを書き出します。規制対象は広告主である宿で、宿の公式アカウントからの配信は原則対象外です。第三者の体験談風の配信や対価のある紹介は該当しうる。必要な表示を入れる場合は、運用基準が不適切とする例（表示時間が短すぎる・末尾のみ・ハッシュタグに埋没・小さすぎる）を避け、冒頭のみでなく継続的な画面表示を基本にします。","check":"配信アカウントと文脈ごとの判定が記録され、表示が必要な場合の文言・大きさ・表示時間・継続性が決まっている"},{"n":10,"action":"AI開示方針と使用モデルの規約条件を記録する","detail":"①日本に表示義務はない（AI事業者ガイドライン第1.2版は非拘束のソフトローで推奨にとどまる）②表示の有無にかかわらず誤認させれば景表法が適用されうる③Higgsfield の規約は法が求める場合の開示と来歴表示の非除去を課している、の3点を顧客説明用の文面にします。開示するかを誰がどう決めるかの手順（制作者が提案し宿が決定、配信先の媒体規約も確認日つきで記録）も書きます。あわせて使ったモデル（Kling 3.0、Seedance 2.5、DoP など）を列挙し、各モデル提供元の規約も適用されより厳しい方が優先される前提、Soul ページと Sora 2 ページで商用利用の記述に不整合がある事実、出力の独占性を約束しない方針、来歴表示を除去しない方針を記録します。","check":"3点セットの説明文面・開示判断の決定手順と決定者・媒体規約の確認日・使用モデル一覧と規約確認状況・独占性と来歴表示の方針が記録されている"},{"n":11,"action":"表現確認シートを7列で作り送付文を用意する","detail":"列は「カット番号／映像が主張している事実／根拠の要否／宿の回答（提供している・条件つき・提供していないの3択）／条件・注意／対処（そのまま使用・条件を併記・カット差し替え・不使用）／確認者名と確認日」。冒頭に、シートの目的、表示の責任が広告主である宿にあること、制作者は弁護士ではなく法的判断はできないこと、迷う項目は専門家か媒体審査に確認することを3〜4行で明記します。送付文には確認依頼内容、返送期限、未回答の項目は該当カットを削って進める旨を書きます。未回答時の扱いを先に書くのが実務上の要点で、これがないと確認待ちで案件が止まります。Day 1の季節カレンダーで宿の繁忙期を避けた日程にします。","check":"7列の表現確認シートが完成し、冒頭に目的・責任分担・弁護士ではない旨の注記があり、送付文に返送期限と未回答時の扱いが明記されている"},{"n":12,"action":"高リスク項目の対処を実行し、確認工程を納品物にする","detail":"高リスク項目を条件併記・差し替え・不使用のいずれかで処理し、処理後に手順1の主張文を更新して実態の範囲に収まったか再確認します。そのうえで、12項目チェックリスト・表現確認シート・参照素材の出所記録・制作台帳・使用モデルと規約の記録を納品物として定義し、見積書に「表現確認工程」を項目として立てられる形にします。","check":"高リスク項目がすべて処理され、更新後の主張文が実態の範囲に収まり、確認工程の成果物5点が納品物リストに定義されている"}],"prompts":[{"label":"眺望の主張を避けた客室の窓（条件が確認できるまでの代替素材）","text":"A guest room window seen from inside at dawn, the view beyond deliberately soft and non-specific: a sheer curtain fully drawn across the glass so that only a diffuse glow and the vague vertical rhythm of a nearby building come through, no identifiable skyline, no tower, no horizon, no street and no floor level cues visible; the curtain drifting slowly to the right in the air from a vent; medium wide shot, eye level, 28mm equivalent, focus on the curtain weave with everything beyond it falling into soft haze; cool blue exterior light against a warm 2700K interior lamp out of frame; matte plaster reveal, pale oak sill, soft sheer curtain weave; photorealistic interior photography, restrained contrast, fine grain, camera static.","note":"眺望が確認できていない段階で使える代替素材。カーテンを引いて遠景の視認性を落とすことで、特定の眺望や階数を主張しない画を作る。判断基準は表示内容全体から一般消費者が受ける印象なので、ビル群が薄く写っているだけでも「高層階からの抜けた眺望」の主張になりうる。東京では階数と方角で窓外が全く別物になるため、どの客室タイプで何が見えるかが宿から書面で取れた後に眺望を描く素材へ差し替える。可変部はカーテンの透け具合と外光の色温度。","status":"未検証","flow":{"code":"I2V","step":"単発","input":"この記述で先に客室の窓の静止画1枚を作り、その1枚を起点に動かす。差し替え対象の既存カットは入力しない","output":"カーテンが右へ流れるクリップ1本。遠景が透けた光だけになり、特定の眺望や階数を主張しない画になる","next":"眺望の事実が宿から書面で取れるまで既存の窓カットと差し替えて使い、取れた後に本番素材へ戻す","where":"生成画面でモデルを選ぶ（image-to-video）","whereNote":"最も安く、Seedance 2.0 系・Kling 3.0・Wan 2.7 なら Unlimited 対象"}},{"label":"浴場の規模を主張しない湯の質感カット","text":"An extreme close-up of a still water surface indoors, only the water and a narrow band of wet tiled edge in frame, no bath structure, no window, no ceiling, no scale cues and no surroundings visible; a single slow ripple crossing the frame from the left, thin steam drifting upward and to the right; macro shot, high angle looking straight down, 85mm equivalent, very shallow depth of field; wet dark tile, water with a soft specular sheen, fine grout line along the tiled edge; photorealistic, soft overhead light from out of frame, warm neutral grade, restrained contrast, fine grain, camera static.","note":"大浴場があるか、客室のユニットバスだけか、サウナが併設かが確認できていない段階の素材。浴場の構造とスケールの手がかりを一切フレームに入れないことで設備の規模と種別を主張しない。湯の質感という情緒だけを取り出す作り。確認が取れた場合のみ、種別を前提とした素材へ差し替える。可変部はタイルの質感と湯気の量。","status":"未検証","flow":{"code":"I2V","step":"単発","input":"この記述で先に湯面のマクロ静止画1枚を作り、その1枚を起点に動かす。浴場の構造が写った既存素材は使わない","output":"波紋と湯気だけが動くマクロのクリップ1本。設備の規模と種別を主張しない湯の質感素材になる","next":"大浴場の有無と利用条件の確認が取れるまで浴場カットの代替に使い、確認後に種別前提の素材へ差し替える","where":"生成画面でモデルを選ぶ（image-to-video）","whereNote":"最も安く、Seedance 2.0 系・Kling 3.0・Wan 2.7 なら Unlimited 対象"}},{"label":"打消し表示を置ける無地のクロージング（夜空と街明かりのボケ）","text":"A clean dark field for text at blue hour, the upper two thirds of the frame an even deep blue night sky with only a faint uniform gradient, the lower third a soft out-of-focus band of warm city lights reduced to gentle bokeh, completely empty with no objects, no text, no signage, no readable windows, no recognisable skyline and no people anywhere in frame; very slow upward drift of the camera; wide shot, 35mm equivalent, the sky in focus and the light band thrown far out of focus; fine atmospheric haze, smooth tonal falloff; photorealistic, deep blue hour ambient with a warm low band, low contrast, fine grain.","note":"宿名・最寄駅・予約先、および条件併記の打消し表示を編集工程で重ねるための下地。文字を生成させないのは、モデルが文字を崩すうえ実在施設名やURLの正確性を担保できないため。上部3分の2を均一な低コントラストの面にしているのは、打消し表示が判読できる背景を確保するため。街明かりを大きくぼかして識別可能なスカイラインを消しているのは、特定の場所や眺望を主張しないため。実態調査では動画の打消し表示の42.4%が2秒以下、99.2%が文字のみだったので、背景のコントラストと表示秒数を設計段階で確保しておく。","status":"未検証","flow":{"code":"I2V","step":"単発","input":"この記述で先に夜空と街明かりのボケの静止画1枚を作り、その1枚を起点にゆっくり上へ流す。文字は生成させず、下地だけを作る","output":"均一な夜空がゆっくり流れるクリップ1本。上部3分の2が打消し表示を判読できる低コントラスト面になる","next":"編集工程で宿名・最寄駅・予約先と条件併記の打消し表示を重ね、表示秒数を実機で検証する","where":"生成画面でモデルを選ぶ（image-to-video）","whereNote":"最も安く、Seedance 2.0 系・Kling 3.0・Wan 2.7 なら Unlimited 対象"}}],"expected":"12項目チェックリスト（該当カット番号と項目9〜12の判定済み）、5類型の捏造洗い出し、参照素材の出所記録（出所不明と他施設由来を除外済み）、7列の制作台帳、商標映り込みのコマ送り確認記録、優良誤認リスクの3段階評価と高リスク項目の処理、打消し表示の制作仕様4点と実機検証結果、ステマ観点の配信判定、AI開示の3点セット文面と決定手順、使用モデルと規約の記録、7列の表現確認シートと送付文が揃っている状態です。宿から「この表現は大丈夫か」と聞かれたときに、自分の法解釈を述べるのではなく、シートのどの行で誰が確認するかを示せる状態が到達点です。","assignment":{"title":"確認チェックリスト・打消し表示仕様・表現確認シートの作成","brief":"Day 3までに作った30秒分の素材について、実在施設の広告として成立する状態まで正確性を担保します。12項目チェックリストで全カットを点検し、生成が捏造した要素と優良誤認に該当しうる表現を特定して処理してください。条件併記が必要な箇所には、消費者庁の打消し表示実態調査の数値を踏まえた自分の制作仕様（最低表示秒数・文字サイズ・音声・配置）を定義し、実機で検証します。そのうえで宿に提出する表現確認シートを7列で作成し、送付文と返送期限まで用意してください。法的判断を自分で下すのではなく、宿が判断できる材料を書面にすることが目的です。","deliverables":["12項目確認チェックリスト（該当カット番号・項目9〜12の判定済み・責任分担明記）","5類型の捏造洗い出し表","参照素材の出所記録（4分類・除外履歴つき）","制作台帳（カット番号／日時／使用モデル／プロンプト全文／参照素材と出所／生成回数／採否）","コマ送りによる商標・ロゴ映り込み確認記録と対処","優良誤認リスク3段階評価表と高リスク項目の処理記録","打消し表示の制作仕様（最低表示秒数・文字サイズ下限・音声方針・配置ルール）と実機検証結果","ステマ規制の観点での配信方法判定と表示の文言・大きさ・表示時間・継続性","AI開示の3点セット説明文面と、開示判断の決定手順・決定者・媒体規約の確認日","使用モデル一覧と規約条件の記録（独占性を約束しない・来歴表示を除去しない方針を含む）","表現確認シート（7列・冒頭に目的と責任分担と弁護士ではない旨の注記）","宿への送付文（確認依頼・返送期限・未回答時の扱い）","差し替えまたは修正した代替カット"],"constraints":["確認できない事実を主張するカットは、条件併記・差し替え・不使用のいずれかで必ず処理すること","打消し表示を足すことで高リスク表現を通そうとしないこと（実機検証で読めなければ差し替えか不使用）","参照素材に他施設の写真および出所不明のものを一切使わないこと","宿名・料金・URL等の文字情報を生成に含めないこと","来歴表示（透かし・メタデータ）を除去する加工を行わないこと","文書内で法的な断定（「〜に抵触する」等）を行わず、「該当しうる」「確認が必要」と記述し、専門家・媒体審査への確認を推奨する注記を入れること","AI生成の表示について「義務である」と書かないこと（2026-10-11時点で日本に表示義務はない）","作業時間は90分以内"]},"success":["12項目すべてに該当カット番号が入り、項目1〜8は宿、9〜12は制作者という責任分担が表に明記されている","全カットについて『映像が主張している事実』が、自分の意図ではなく受け取られ方の観点で1文ずつ書き出され、合計10行以上ある","参照素材の出所が4分類で記録され、他施設由来と出所不明のものが除外されている","制作台帳にプロンプト全文と参照素材の出所が残っており、既存作品名・キャラクター名の入力がないことを確認済みである","打消し表示の制作仕様が4点とも数値または明確な条件で定義され、実機検証で第三者が1回の再生で内容を言えている（または該当カットを差し替え・不使用にしている）","AI生成の開示について「①日本に表示義務はない ②表示の有無にかかわらず誤認させれば景表法が適用されうる ③Higgsfield 規約は法が求める場合の開示と来歴表示の非除去を課す」の3点で記述され、義務であるという断定がない","表現確認シートが7列で完成し、宿側が3択で回答でき、確認者名と確認日の欄がある","送付文に未回答時の扱い（該当カットを削って進める等）が明記されている"],"rubric":[{"axis":"映像の品質","pass":"3点＝差し替えた代替カットが他カットと同等の品質になっている。5点＝眺望や設備を主張しない制約の中で、情緒の強さを落とさずに作れている。"},{"axis":"動きの自然さ","pass":"3点＝部分編集で修正した箇所に動きの不整合が生じていない。5点＝差し替えカットの運動方向が前後のカットと連続している。"},{"axis":"ブランド整合性","pass":"3点＝他社のロゴ・商標・近隣店舗の看板が1箇所も映り込んでいない。5点＝ロゴを編集で合成する運用が確立し、宿のブランド表記が正確に入っている。"},{"axis":"マーケ目的整合性","pass":"3点＝確認できない事実を主張するカットがゼロになっている。5点＝条件併記の文言が訴求を殺さない形で設計され、実機で判読できる表示仕様を満たしている。"},{"axis":"再現性","pass":"3点＝12項目チェックリストと表現確認シートが別案件に流用できる空欄テンプレートとして分離されている。5点＝宿の業態別（都市型ホテル／ビジネスホテル／ゲストハウス／小規模旅館）に確認項目を追記した版があり、打消し表示仕様が配信先別に定義されている。"},{"axis":"時間とコスト","pass":"3点＝確認工程に要した時間が記録されている。5点＝確認工程を見積り項目として立て、工数と単価を算出できている。"}],"pitfalls":[{"problem":"生成素材を「雰囲気素材」と考えて事実確認を省く","cause":"映像や写真そのものが表示を構成するという前提を持っていない。消費者庁の考え方では写真は全体の印象の一部を構成するとされ、故意である必要もない","fix":"全カットについて『見た人が事実として受け取る内容』を1文で書き出す工程を必須にする。書き出せない曖昧なカットは何を伝えているのか自分でも分かっていないということなので、構成から見直す。"},{"problem":"自分が指示していない要素の映り込みに気づかない","cause":"生成AIは指示していない要素を補完する。プロンプトに書いた要素だけを見て確認している","fix":"5類型（設備・料理・景観・サービス・規模）の観点で、フレームの隅まで0.5秒程度のコマ送りで点検する。東京の宿では窓外に空が広がりすぎている、隣棟が消えている、部屋が実際より広いという3つが特に出やすい。確認は『書いた要素があるか』ではなく『書いていない要素が入っていないか』で行う。"},{"problem":"条件を小さく短く注記して高リスク表現を通そうとする","cause":"打消し表示を入れれば足りると考えている。実態調査では動画の打消し表示の42.4%が2秒以下、全部読めた人が2.4%の検証例がある","fix":"最低表示秒数・文字サイズ下限・音声・配置の4点を数値で定義し、実機で第三者に1回見せて読めたかを確認する。読めなければ秒数と文字サイズを上げ、それでも収まらないならカットを差し替えるか不使用にする。"},{"problem":"「おとり広告」の論点と部屋が良く見える問題を混同する","cause":"おとり広告は在庫・取引可能性に関する規制（公正取引委員会告示第17号・1993年）で、不動産の運用基準は不動産取引向け。宿泊の表現の誇張には直接及ばない","fix":"映像の誇張は景表法第5条第1号の優良誤認表示の観点で検討し、根拠資料は消費者庁『メニュー・料理等の食品表示に係る景品表示法上の考え方について』を使う。満室なのに予約可能に見せる等の取引可能性の問題と区別して整理する。"},{"problem":"AI生成の開示について「義務がある」または「日本では不要」と断定して顧客に説明する","cause":"2026-10-11時点で日本に表示義務はないが、義務がないことと誤認させてよいことは別。AI事業者ガイドライン第1.2版は非拘束のソフトローで推奨にとどまる","fix":"①表示義務はない ②表示の有無にかかわらず誤認させれば景表法が適用されうる ③Higgsfield 規約は法が求める場合の開示と来歴表示の非除去を課している、の3点セットで説明する。知財推進計画2026で継続検討中である流動性も伝え、配信先の媒体規約は確認日つきで記録する。"},{"problem":"他施設の写真を「こういう雰囲気で」と参照に入れている","cause":"参照だから問題にならないと考えている。生成AIの仕組み上、利用者が元の作品を知らなくても類似した出力が生じうる","fix":"参照素材は自作生成・宿が権利を持つ素材・権利処理済み素材に限定し、出所列で機械的に除外する。文化庁のチェックリスト＆ガイダンスが推奨するとおり、プロンプトと生成の記録を制作台帳として残す。既存の作品名・キャラクター名はプロンプトに入れない。"}],"resourceIds":["jp-keihyo","jp-keihyo-menu","jp-uchikeshi","jp-stealth","jp-stealth-guide","jp-bunka-checklist","jp-bunka-ai","jp-ai-guideline","jp-otori","hf-terms","hf-privacy"],"nextHint":"正確性と表示方法が担保された素材が揃いました。Day 5では30秒PR動画を完成形に仕上げ、ここまでの判断（色・光・質感・声のトーン・禁止表現）をブランドガイドとして文書化し、改善記録とともに納品できる形にします。","setup":{"tag":"法令・倫理","model":"検証用に Seedance 2.0 を少量","seconds":"4秒","res":"720p","aspect":"9:16","outputs":"1","cap":"静止画4枚・動画2本","credits":"約 37 cr（$1.83）","unlimited":"0 cr","save":"この日の主成果はチェックリストと表現確認シート。生成は捏造リスクの実例を見るための最小限に留める。"}},{"id":"w3d5","day":5,"title":"30秒PR動画の完成とブランドガイド化","subtitle":"仕上げと書き出し、色・光・質感・声のトーン・禁止表現の文書化、改善記録の整備","why":"1本作れることと、同じ品質で次の案件を作れることは別の能力です。前者は作業、後者は資産です。東京の宿は季節と客層で素材を入れ替えるため、同じ顧客に年2〜4回納品する構造になります。1本目で何を決めたかが文書化されていないと、2本目で色調も声のトーンも変わり、顧客から「前の方が良かった」と言われて作り直しになります。ブランドガイドは顧客のためでもありますが、第一には自分の再現性のための装置です。さらに改善記録は、Week 5の効率化とWeek 6の見積り・外注の両方の根拠になります。記録がない制作は、毎回ゼロから始まる単発作業のままです。","goals":["採用クリップを30秒に仕上げ、配信先の仕様（縦横比・尺・文字の安全領域・音声）を満たして書き出せる","ブランドガイドを色・光・質感・声のトーン・禁止表現の5章で文書化できる","改善記録を生成回数・採用率・所要時間・クレジット実消費の実測値で整備できる","季節・客層差し替え版の制作手順を定義し、2本目以降の工数削減見込みを数値で示せる","Week 3の成果物5点を納品物として揃え、顧客への提出形式を決められる"],"duration":"90分","timeBreakdown":[{"label":"仕上げと書き出し","min":35},{"label":"ブランドガイドの文書化","min":35},{"label":"改善記録と納品物の整備","min":20}],"tools":["動画編集ソフト（カット編集・テロップ・色調整・書き出し）","Higgsfield（Higgsfield Audio、Lipsync Studio、部分編集。必要なカットのみ）","スプレッドシート（改善記録・納品物リスト）","文書作成ソフト（ブランドガイド）"],"prereq":["Day 3の仮編集が30秒以内で完成していること","Day 4の12項目点検と表現確認シートが完成し、高リスク項目の処理が済んでいること","Day 4の打消し表示の制作仕様が数値で定義されていること","Day 2の Elements 登録と参照セット記録表が運用されていること"],"theory":[{"heading":"仕上げで変わるのは3つだけ","body":"AI生成クリップを並べた段階で残る違和感は、ほぼ次の3つに収れんします。仕上げ工程でやることを絞ると、時間が読めます。\n\n**1. 色調の不統一**\n別々に生成したカットは、色温度とコントラストが微妙に違います。東京の宿の映像では外の寒色（反射光・ブルーアワー）と室内や看板の暖色が混在するので、ずれが目立ちます。処理は、まず**最も良いカットを基準に決め**、他のカットをそれに寄せる。全カットを個別に「良く」しようとすると統一感が失われます。Cinema Studio には生成後の Color Grading（色温度・コントラスト・彩度・シャープ・グレイン・ハイライト・露出）があり、編集ソフト側でも同じ調整ができます。どちらでやるかを決めて混在させないこと。\n\n**2. 粒状感の不統一**\nモデルによってノイズの出方が違います。差し替えカットが浮く最大の原因はこれです。全カットに**同じ量のグレインを薄く乗せる**と、生成元の違いが隠れます。乗せすぎると画質が落ちるので、スマートフォン実機で見て気づかない量に留めます。\n\n**3. 音**\n30秒に音がないと素人の映像に見えます。東京の宿の映像では、環境音（遠い電車の走行音、湯のせせらぎ、商店街のざわめき、雨が路面を打つ音、客室の静けさ）が最も効きます。音楽は主役にしない。執筆時点で Higgsfield Audio があり、Seedance 2.5 はネイティブ音声を持ち音声ONでもクレジットが増えません。Kling 3.0 は台詞・SFX・環境音に対応します。ナレーションを入れるかは、Day 4のステマ観点と誇張の観点で判断します。**音声で言うことは文字で書くのと同じ強さの表示になりえます**。\n\n逆に、仕上げでやらないことを決めます。カットの差し替え、構成の変更、プロンプトの作り直し。これらはDay 3に戻る作業で、仕上げ工程に混ぜると終わりません。"},{"heading":"書き出しは配信先の仕様から逆算する","body":"書き出し設定を「とりあえず1080p」で済ませると、配信段階で作り直しになります。先に配信先を確定し、仕様から逆算します。\n\n宿泊施設のPR動画でよくある配信先と、確認すべき項目です。\n\n- **Instagram / TikTok のフィードとリール**：縦9:16が基本。UIの要素（下部のキャプション領域、上部のアカウント名）に文字が隠れるため、**上下に安全領域**を確保する。30秒は尺としては扱いやすい\n- **YouTube（横16:9・ショート縦）**：横で作るなら同じ素材から別書き出しが必要\n- **宿の公式サイトのトップ（自動再生）**：音声なしで成立する必要がある。文字情報に依存する設計だと、音声ありの版と作りが変わる\n- **OTAの掲載動画**：媒体ごとに尺と形式の規定がある。入稿規定を事前に確認する\n- **Meta / Google の広告**：Marketing Studio の Ads カテゴリは Meta・Google の入稿サイズに対応しています（執筆時点）\n\nインバウンド比率が高い宿では、同じ素材から英語版の文字を載せた書き出しも必要になるので、テロップのレイヤーを分離して保存します。\n\n**縦横両対応を1回の生成で済ませる作り方**は、Day 1で触れたとおり被写体を中央寄りに置いて生成し、トリミングで両対応させることです。生成を2倍やるとクレジットも時間も2倍になります。\n\n文字の安全領域は実機で確認します。縦9:16なら、上12%・下20%程度を文字を置かない領域として空ける運用から始め、実機で検証して自分の基準値に調整してください。Day 4で定義した打消し表示の文字サイズ下限と配置ルールも、この安全領域の中で成立させます。\n\n書き出し設定（解像度・ビットレート・フレームレート・音声コーデック）は、案件ごとに記録します。1年後に同じ顧客の差し替え版を作るとき、設定が残っていないと見た目が変わります。"},{"heading":"ブランドガイド 色・光・質感","body":"ブランドガイドは顧客に渡す文書であり、自分の再現性のための仕様書です。宿泊施設向けには5章で足ります。各章に**必ず数値か固有名詞を入れる**こと。形容詞だけのガイドは機能しません。\n\n**第1章 色**\n- 基調色：寒色側と暖色側の色温度を数値で（外光5600〜6500K／室内灯2700〜3000K など）\n- コントラスト：restrained／standard／high のどれか、および黒の沈め方の方針\n- 彩度：リネンの白を基準にした彩度の上限（白が青や緑に転ばない範囲）\n- 禁止：オレンジ・ティールの強いルック、彩度を上げた空、ネオンの色かぶりを残したままの肌と白物\n\n**第2章 光**\n- 主光源の方向と質（隣棟からの反射光と窓からの拡散光を主、直射は西日のカットのみ）\n- 使用する照明プリセットの方針（Cinema Studio の Lighting プリセットでは Window、Practicals、Contre-jour が宿の映像に適合しやすい）\n- 暗部の扱い：暗いカットを3本以上連続させない\n- ブルーアワーの扱い：外の青と室内・看板の暖色をどこまで混在させるかの上限\n\n**第3章 質感**\n- 使う素材語の辞書（matte plaster／pale oak veneer／crisp cotton／dark glazed tile／rain-wet asphalt）\n- グレイン量の基準（スマートフォン実機で気づかない量）\n- 禁止：過剰なシャープ、プラスチック的な反射、CG的に均一なガラス面\n\n第1〜3章は、完成動画から**実測した値**で書きます。記憶や感覚で書くと、2本目で再現できません。書いた後に自分で1カット再現してみるのが検証になります。"},{"heading":"ブランドガイド 声のトーンと禁止表現","body":"**第4章 声のトーン**\n- テロップの文体：敬体か常体か、一人称の有無、文末の処理\n- 使う語と使わない語のリスト。宿泊では「贅沢」「極上」「最高級」のような最上級表現は、Day 4の優良誤認の観点から原則不使用にする\n- ナレーションを入れる場合の話速、声質、言語（インバウンド向け英語版の扱い）\n- **音声で述べる内容も文字と同じ強さの表示になりえる**ため、同じ基準で確認する\n\n**第5章 禁止表現**\n- Day 4の確認で「提供していない」と判明した事実の一覧\n- 眺望・大浴場やサウナの有無・朝食内容・駅からの距離について、条件なしで言及してはいけない表現\n- 生成に含めない要素（宿名・最寄駅名・URL・料金の文字、他社ロゴ、近隣店舗の看板、顔が映る人物と通行人）\n- 根拠が必要な断定表現（「必ず」「No.1」「日本一」は根拠がない限り不使用）\n\n第5章が最も価値があります。これは宿と制作者の間の合意事項であり、**担当者が変わっても残る記録**になります。宿の確認欄を設け、宿側に目を通してもらった記録を残してください。\n\n実務上の効用は2つです。1つは、次の案件で「この表現は使えるか」を毎回ゼロから検討しなくて済むこと。もう1つは、宿から新しい訴求の要望が来たときに、第5章と照らして即答できることです。要望を断る場合も、合意済みの文書を根拠にできるので関係が悪化しません。"},{"heading":"改善記録を数値にする","body":"改善記録は感想ではなく実測値です。次の列で1案件1シートにします。\n\n| 列 | 内容 |\n|---|---|\n| カット番号 | C01〜C08 |\n| 使用モデル | Kling 3.0 / Seedance 2.5 / DoP 5s など |\n| 生成回数 | 採用に至るまでの総テイク数 |\n| 採用テイク | 何回目を採用したか |\n| クレジット消費 | 実測値 |\n| 所要時間 | プロンプト作成から採用までの分 |\n| 失敗の型 | 空間の不一致／運動方向／文字崩れ／捏造／尺 など |\n| 次回の対処 | プロンプトのどの語を変えるか、参照を何枚増やすか |\n\nここから必ず算出する指標は4つです。\n\n- **全体採用率**（採用数÷総生成数）。1案件の原価見積りの基礎になります\n- **カット種別ごとの採用率**。客室より大浴場の湯気や街歩きのカットが低い、といった傾向が出ます。低いカット種別は、次回は生成回数を多めに見積ります\n- **1本あたりの総所要時間とクレジット実消費**。Day 1の概算との差分を必ず出す\n- **失敗の型の頻度上位3つ**。これがWeek 5の効率化で最初に手を付ける対象になります\n\n東京の宿は季節と客層で差し替えるので、**2本目の工数削減見込み**も算出します。カット割り・尺・ブランドガイド・Elements・参照セットが流用できれば、生成し直すのは周辺環境と体験のカットだけです。流用率（流用カット数÷全カット数）と所要時間削減の見込みを数値で書いてください。これが年間契約の提案根拠になります。\n\n**境界に注意**：算出できるのは制作の効率と原価です。**この動画で予約が増えるかは、この記録からは分かりません**。配信後の結果は配信面・予算・季節・価格・競合・口コミが同時に動く中で現れます。東京は競合が密集しているため、「人が来ない」のではなく「他店に流れる」形で数値が動きます。効果を見るなら、配信期間・配信面・予算を固定した上で、指名検索数や公式サイト経由の予約比率を配信していない期間と比べる設計が必要で、それはWeek 4で扱います。制作段階で言えるのは「原価と所要時間はこの数値で、再現できます」までです。"}],"steps":[{"n":1,"action":"配信先を確定して仕様を書き出す","detail":"縦9:16か横16:9か両方か、音声ありかなしか、尺の上限、文字の安全領域、入稿規定（OTAや広告媒体の場合）を書き出します。ここが決まっていないと書き出しをやり直すことになります。両対応する場合は、どちらを主として編集するかを決めます。","check":"配信先と仕様（縦横比・尺・音声・安全領域・入稿規定）が1枚に書き出されている"},{"n":2,"action":"基準カットを決めて色調を寄せる","detail":"採用クリップの中から最も意図に近い1本を基準に決め、他の7本をそれに寄せます。色温度・コントラスト・彩度を調整し、リネンや壁の白が青や緑に転んでいないか、夜のカットでネオンの色かぶりが残っていないかを確認します。Cinema Studio の Color Grading と編集ソフトのどちらで調整するかを決め、混在させないでください。","check":"8カットの色調が揃い、どのカットを基準にしたかが記録されている"},{"n":3,"action":"グレインを全カットに均一に乗せる","detail":"差し替えカットが浮く最大の原因は粒状感の違いです。全カットに同じ量のグレインを薄く乗せ、生成モデルの違いを隠します。量はスマートフォン実機で見て気づかない水準に留め、適用値を記録します。","check":"全カットに同一量のグレインが適用され、適用値が記録されている"},{"n":4,"action":"環境音を設計して入れる","detail":"遠い電車の走行音、湯のせせらぎ、商店街のざわめき、雨が路面を打つ音、室内の静けさを、カットごとに割り当てます。音楽を入れる場合は主役にせず、環境音を消さない音量にします。Higgsfield Audio を使う場合も、Seedance 2.5 のネイティブ音声を使う場合（音声ONでもクレジットは増えません）も、使用した手段を記録します。","check":"カットごとに環境音が割り当てられ、使用した音声手段が記録されている"},{"n":5,"action":"ナレーションの有無を判断する","detail":"ナレーションを入れるかを、Day 4の観点で判断します。音声で述べる内容も表示になりえるため、誇張や未確認の事実を音声で言わない。入れる場合は原稿を文字として書き出し、表現確認シートに追加して宿の確認対象に含めます。インバウンド向けに英語版を作る場合は、翻訳が原文の主張範囲を超えないか確認します。","check":"ナレーションの可否が判断され、入れる場合は原稿が表現確認シートに追加されている"},{"n":6,"action":"テロップと打消し表示を安全領域内に配置する","detail":"宿名・最寄駅と徒歩分数・予約先と、条件併記が必要な打消し表示を配置します。Day 4で定義した最低表示秒数・文字サイズ下限・配置ルールを満たすこと。縦9:16なら上12%・下20%程度を空ける運用から始め、実機で検証します。文字は生成させず編集で入れます。","check":"テロップと打消し表示が安全領域内に収まり、Day 4の仕様（秒数・サイズ・配置）を満たしている"},{"n":7,"action":"実機で通し確認する","detail":"スマートフォン実機で、音声あり・なしの両方で通して見ます。確認項目は、つなぎの違和感、色の浮いたカット、文字が読めるか、打消し表示が1回の再生で読めるか、UIに隠れる文字がないか。第三者に1回だけ見せて、何の宿の映像だったかと条件表示の内容を言わせます。","check":"実機確認が完了し、第三者が宿の訴求内容と条件表示の内容を言えている"},{"n":8,"action":"書き出して設定を記録する","detail":"確定した仕様で書き出します。解像度・ビットレート・フレームレート・音声コーデック・ファイル命名を記録します。縦横両対応の場合は2本書き出し、それぞれの設定を残します。来歴表示（透かし・メタデータ）を除去する加工は行いません。","check":"完成動画が書き出され、書き出し設定が記録されている（来歴表示を除去していない）"},{"n":9,"action":"ブランドガイド5章を書く","detail":"第1〜3章は完成動画から実測した値で書きます。色（寒色側と暖色側の色温度の数値、コントラスト方針、彩度上限、禁止ルック）、光（主光源の方向と質、使用プリセット方針、暗部は3本以上連続させない、ブルーアワーでの寒暖混在の上限）、質感（素材語の辞書、グレイン量の基準、禁止事項）。第4章は声のトーンで、テロップの文体、使う語と使わない語のリスト（「贅沢」「極上」「最高級」のような最上級表現はDay 4の優良誤認の観点から原則不使用と明記）、ナレーションの話速と声質、英語版の扱い、音声も文字と同じ基準で確認する旨。第5章は禁止表現で、Day 4の表現確認シートで「提供していない」と判明した事実、条件なしで言及してはいけない表現、生成に含めない要素、根拠が必要な断定表現を一覧にし、宿の確認欄を設けます。各章に数値か固有名詞を3つ以上入れ、形容詞だけの記述を残さないこと。","check":"5章が完成し、各章に数値または固有名詞が3つ以上含まれ、第5章にDay 4の確認結果がすべて反映され宿の確認欄がある"},{"n":10,"action":"改善記録を8列で集計する","detail":"カット番号／使用モデル／生成回数／採用テイク／クレジット消費／所要時間／失敗の型／次回の対処の8列で集計します。そこから全体採用率、カット種別ごとの採用率、1本あたりの総所要時間とクレジット実消費、失敗の型の頻度上位3つを算出します。Day 1の概算との差分と、その原因を書きます。","check":"8列の改善記録が埋まり、4つの指標とDay 1概算との差分が算出されている"},{"n":11,"action":"季節・客層差し替え版の手順と工数削減見込みを定義する","detail":"平日のビジネス客版から週末の観光客版（または桜期版・紅葉期版）に差し替える手順を書きます。流用するもの（カット割り・尺・ブランドガイド・Elements・参照セット・テロップ設計）と作り直すもの（周辺環境・体験カット）を分け、流用率と所要時間削減の見込みを数値で算出します。これが年間契約の提案根拠になります。","check":"差し替え手順が書かれ、流用率と所要時間削減の見込みが数値で算出されている"},{"n":12,"action":"Week 3の納品物を整理して提出形式を決める","detail":"絵コンテ、ショットリスト、完成動画、ブランドガイド、使用プロンプトと改善記録の5点を納品物として整理し、提出形式（PDF／スプレッドシート／動画ファイル形式）とファイル命名規則を決めます。Day 4の確認工程の成果物（12項目チェックリスト・表現確認シート・制作台帳）も添付物として含め、見積りの項目として立てられる形にします。効果の約束を含む文言が資料に残っていないかを最後に確認します。","check":"納品物5点と添付物が揃い、提出形式と命名規則が決まっており、効果を約束する文言が資料に残っていない"}],"prompts":[{"label":"不足カットの補充用：ロビーラウンジの灯り（image-to-video）","text":"A small hotel lobby lounge, a cluster of warm pendant lamps at the left of frame casting pools of light onto a low walnut table and a fabric armchair, a single candle-style flame lamp flickering gently on the table; a glazed wall at the right of frame showing the wet street outside at dusk with soft out-of-focus street lighting, no readable signage; no people, no logos, no text in frame; medium wide shot, eye level, 28mm equivalent, deep focus, camera static; walnut grain, matte brass lamp shades, coarse wool upholstery, rain-streaked glass; photorealistic interior photography, warm 2700K practicals against cool blue dusk through the glass, restrained contrast, fine grain.","note":"仕上げ段階で暗部のカットが3本以上連続していると判明した場合の補充用ではなく、逆に暖色の中間明度が足りない場合に挟むカット。揺れる灯りは動きの主役になるが、運動方向を持たないため前後どのカットの間にも挿入できる。これがつなぎの調整弁として使いやすい理由。窓外をブルーアワーの街明かりにしているので、東京の光の性質を1カットで要約する役割も兼ねる。可変部は灯りの数、窓外の時刻、家具の素材。","status":"未検証","flow":{"code":"I2V","step":"単発","input":"ロビーラウンジの静止画1枚を起点にする。新しく画像は作らず、灯りの揺らぎだけを動かす指示として渡す","output":"灯りが揺れる静止カメラのクリップ1本。暖色の中間明度を持つ、運動方向のないつなぎ素材になる","next":"ここで完結。明暗のつなぎが偏った箇所に挿入する調整弁として、仕上げの色調整工程へ渡す","where":"生成画面でモデルを選ぶ（image-to-video）","whereNote":"最も安く、Seedance 2.0 系・Kling 3.0・Wan 2.7 なら Unlimited 対象"}},{"label":"クロージング差し替え用：夜のエントランスの引き（image-to-video）","text":"A slow pull back from the entrance of a small urban hotel at night, starting on the warm glow of the recessed lobby behind full-height glass and widening to show the dark tiled facade, the step up from the pavement and the narrow side street in front of it, the interior light spilling across the rain-wet pavement in long reflections; the upper third of the frame is empty dark sky between buildings for text placement; no signage, no shop names, no logos and no text anywhere in frame; wide shot widening further, slightly low eye level, 28mm equivalent, deep focus, very slow dolly back at constant speed; dark glazed tile, brushed steel door frame, rain-wet pavement with specular streaks; photorealistic architectural photography at night, deep blue ambient against warm 2700K interior light, restrained contrast, fine grain.","note":"クロージングに使う引きのカット。上部3分の1を建物の間の暗い空として空けているのは、宿名と予約先のテロップ、および条件併記の打消し表示を判読できる背景を確保するため。ゆっくり引く動きは映像の終わりを示す定型。等速で引くと指定しているのは、加速すると最後に慌ただしく見えるため。可変部は路面の濡れ具合、街灯の色かぶり、建物の素材。","status":"未検証","flow":{"code":"I2V","step":"単発","input":"Day 1の「夜のエントランスの灯り（クロージング候補・静止画）」1枚を起点にする。新しく画像は作らず、等速で引く動きだけを指定する","output":"等速で引く夜の外観クリップ1本。上部3分の1が暗い空のまま空き、文字を置ける末尾カットになる","next":"ここで完結。末尾2秒に置き、宿名と予約先のテロップと打消し表示を安全領域内に重ねて書き出す","where":"生成画面でモデルを選ぶ（image-to-video）","whereNote":"最も安く、Seedance 2.0 系・Kling 3.0・Wan 2.7 なら Unlimited 対象"}}],"expected":"30秒の完成動画（配信先の仕様を満たした書き出し、必要なら縦横2本）、5章構成のブランドガイド、8列の改善記録と4指標の算出、季節・客層差し替え版の手順と流用率、納品物5点の整理が揃っている状態です。完成動画を見た第三者が、どの宿の何を訴求した映像かと条件表示の内容を1回の再生で言えること、そしてブランドガイドを渡された別の制作者が同じトーンの2本目を作れる粒度になっていることが到達点です。","assignment":{"title":"30秒PR動画の完成とブランドガイドの文書化","brief":"Week 3の実践課題を完成させます。東京の宿泊施設を想定した30秒PR動画を1本仕上げ、配信先の仕様を満たして書き出してください。あわせて、この1本で決めた判断を色・光・質感・声のトーン・禁止表現の5章のブランドガイドとして文書化し、改善記録を実測値で整備します。ブランドガイドは別の制作者に渡して同じトーンの2本目が作れる粒度で書いてください。禁止表現の章にはDay 4の確認結果をすべて反映し、宿の確認欄を設けます。資料と動画に、予約や売上の増加を約束する文言を一切残さないこと。","deliverables":["完成動画（30秒・配信先仕様を満たした書き出し。縦横両対応の場合は2本）","書き出し設定記録（解像度・ビットレート・フレームレート・音声コーデック・命名規則）","絵コンテ8枠（Day 3から更新版）","ショットリスト14列（Day 3から状態・生成回数を更新）","ブランドガイド5章（色・光・質感・声のトーン・禁止表現、宿の確認欄つき）","使用プロンプト一覧（7スロット構造・採否つき）","改善記録8列と4指標（全体採用率・カット種別採用率・総所要時間とクレジット実消費・失敗の型上位3つ）","Day 1概算との差分と原因","季節・客層差し替え版の手順と流用率・所要時間削減見込み","納品物リストと提出形式・命名規則"],"constraints":["完成尺を30.0秒以内に収めること","仕上げ工程でカットの差し替えと構成変更を行わないこと（必要ならDay 3に戻る）","文字情報を生成に含めず編集工程で入れること","来歴表示（透かし・メタデータ）を除去する加工を行わないこと","ブランドガイドの各章に数値または固有名詞を3つ以上入れ、形容詞だけの記述を残さないこと","資料・動画・提案文に予約増加や売上増加を約束する文言を入れないこと","作業時間は90分以内"]},"success":["完成動画が30.0秒以内で、配信先の仕様（縦横比・音声・安全領域）を満たして書き出されている","8カットの色調と粒状感が揃い、どのカットが差し替えか見分けられない","打消し表示がDay 4で定義した秒数・文字サイズ・配置の仕様を満たし、実機で第三者が1回の再生で内容を言えている","ブランドガイド5章すべてに数値または固有名詞が3つ以上含まれ、禁止表現の章にDay 4の確認結果が反映されている","改善記録から全体採用率・カット種別採用率・総所要時間・クレジット実消費が算出され、Day 1概算との差分の原因が説明されている","季節差し替え版の流用率と所要時間削減見込みが数値で示されている","納品物5点と添付物が揃い、効果を約束する文言が資料に一切ない"],"rubric":[{"axis":"映像の品質","pass":"3点＝8カットすべてが使用可能な品質で、色調と粒状感が揃っている。5点＝基準カットを明示して他カットを寄せた形跡が記録され、実機で浮くカットが1本もない。"},{"axis":"動きの自然さ","pass":"3点＝つなぎ目で違和感のある箇所がない。5点＝運動方向と速度が8カットを通して設計されており、クロージングの引きが等速で終わっている。"},{"axis":"ブランド整合性","pass":"3点＝ブランドガイド5章が完成している。5点＝別の制作者がガイドだけを見て同じトーンの2本目を作れる粒度で、禁止表現の章に宿の確認欄がある。"},{"axis":"マーケ目的整合性","pass":"3点＝配信先の仕様を満たし、条件表示が実機で読める。5点＝資料に効果を約束する文言がなく、効果検証はWeek 4の設計に委ねる旨が明記されている。"},{"axis":"再現性","pass":"3点＝書き出し設定と使用プロンプトが記録されている。5点＝季節・客層差し替え版の手順が定義され、流用率と工数削減見込みが数値で算出されている。"},{"axis":"時間とコスト","pass":"3点＝総所要時間とクレジット実消費が実測されている。5点＝全体採用率とカット種別採用率から次案件の原価見積りが算出でき、Day 1概算との差分の原因が特定されている。"}],"pitfalls":[{"problem":"仕上げ工程でカットの作り直しを始め、終わらない","cause":"仕上げと制作の境界が決まっていない","fix":"仕上げでやることを色調・粒状感・音の3つに限定する。カット差し替えと構成変更が必要と判断した時点でDay 3の工程に戻し、仕上げ工程の時間に混ぜない。"},{"problem":"差し替えたカットが明らかに浮く","cause":"色調は揃えたが粒状感が揃っていない。モデルによってノイズの出方が違う","fix":"全カットに同一量のグレインを薄く乗せる。量はスマートフォン実機で気づかない水準に留め、適用値をブランドガイドの質感の章に記録する。"},{"problem":"ブランドガイドが形容詞だけで、2本目で再現できない","cause":"「あたたかい雰囲気」「上質な質感」のような抽象語で書いている","fix":"各章に数値（色温度、グレイン量、彩度上限）または固有名詞（素材語、使用プリセット名）を3つ以上入れる。完成動画から実測した値を使い、書いた後に自分で1カット再現できるか試す。"},{"problem":"ナレーションで未確認の事実や誇張を述べている","cause":"音声は表示に含まれないと考えている","fix":"ナレーション原稿を文字として書き出し、Day 4の表現確認シートに行として追加して宿の確認対象に含める。英語版を作る場合は、翻訳が原文の主張範囲を超えていないかを別途確認する。"},{"problem":"改善記録が感想で、次案件の見積りに使えない","cause":"生成回数・採用率・所要時間・クレジットを実測していない","fix":"8列の記録を生成のたびに埋める。最後に全体採用率とカット種別採用率を算出し、採用率が低いカット種別は次回の生成回数を多めに見積る。失敗の型の頻度上位3つをWeek 5の改善対象として引き継ぐ。"},{"problem":"提案資料に「予約が増える」という表現を書いてしまう","cause":"制作の成果と事業の成果を混同している。配信後の結果は配信面・予算・季節・価格・競合・口コミが同時に動く","fix":"資料に書けるのは制作の原価・所要時間・再現性までとする。効果を語る場合は、配信期間と配信面と予算を固定した比較設計を前提にし、その設計はWeek 4で扱う旨を明記する。"}],"resourceIds":["hf-academy-cinematic-ad-e2e","hf-academy-ad-3step","hf-help-cinema-studio"],"nextHint":"30秒1本とブランドガイドが揃い、同じ品質で2本目を作れる状態になりました。Week 4では、この映像を配信してマーケティングとして機能させる側に移ります。配信面ごとの作り分け、訴求の仮説設計、そして効果を測るための比較設計を扱います。","setup":{"tag":"Week 3 総合課題","model":"下書き Kling 3.0（720p）／ 採用カット Kling 3.0（1080p）","seconds":"5秒 × 8カット前後（使用尺より1秒以上長く生成）","res":"720p → 採用分のみ1080p","aspect":"9:16","outputs":"1","cap":"静止画4枚・下書き12本・本番8本","credits":"約 221 cr（$11.03）","unlimited":"0 cr","save":"都市型ホテルのb-rollはカメラ移動が主で人物の細かい演技が要らないため、Kling 3.0 で十分。1080pでも5秒12.5クレジットで、Seedance 2.5 の同条件の約4分の1。まず全カットを720pで作り、構成が確定してから採用分だけ上げ直す。"}}]},{"week":4,"title":"マーケティングと広告クリエイティブ","theme":"制作コストが落ちた今、持っている広告の判断力をどう使い直すか","objective":"顧客のKPI構造から逆算して訴求軸を設計し、映像変数を固定したままメッセージ変数だけを変えた広告動画3本と、検証可能なテスト計画・成果計測シートを揃えられる状態にする。","hours":"7.1時間（60〜90分 × 5日）","weekDeliverables":["同一施設・訴求軸違いの広告動画3本（縦9:16、各8〜15秒）","ターゲット設定と訴求仮説シート（3軸分）","CTA文言・配置とUTM命名規約を含む予約導線設計書","テスト計画書（仮説・変数・配信期間・必要到達数・判断基準・判断日）","成果計測シート（指標と判断の対応表つき）","顧客ヒアリング用の数値項目リスト"],"outcome":"「この動画は効いたのか」という問いに対して、何を変数として固定し、何を測り、どの数値でどう判断するかを、アトリビューションが完全には解けない前提のまま顧客に説明できる。","lessons":[{"id":"w4d1","day":1,"title":"顧客のKPI構造から逆算して動画を決める","subtitle":"稼働率・ADR・手数料差・閑散期の限界利益から、作るべき動画を特定する","why":"映像制作者が受注を落とす最大の原因は、顧客が抱えている問題と、提案している成果物がずれていることです。東京の宿の支配人が困っているのは「動画がないこと」ではなく、1〜2月と6月の空室、OTA手数料で削られる粗利、徒歩圏に何十軒も並ぶ同価格帯の宿の中で選ばれないこと、販促にかかる自分の工数、そして広告費に対する回収の不確かさです。あなたは広告運用でROASを作ってきた人間なので、ここは本来得意領域です。ただし宿泊業のKPIは飲食とは別の構造をしており、稼働率とADRとRevPARの関係、OTA経由と直販の手数料差を数字で扱えないと、「どの動画をどこに出すか」という最も重要な判断ができません。今日はヒアリングで取るべき数値を確定させ、動画の企画をその数値から逆算する手順を作ります。","goals":["稼働率・ADR・RevPARの関係を使って、施設の現状を1枚に要約できる","OTA経由と直販の手数料差を年間金額に換算し、直販強化の価値を提示できる","閑散期の空室を限界利益ベースで評価し、値引き以外の打ち手を数値で説明できる","ヒアリングで取得する数値項目を15項目以上のリストとして持ち、取得できない場合の代替推定ができる","取得した数値から、制作すべき動画の本数・配置先・優先順位を決定できる"],"duration":"80分","timeBreakdown":[{"label":"宿泊・飲食のKPI構造の整理","min":25},{"label":"実在施設を想定した数値分解と逆算","min":35},{"label":"ヒアリングシートの確定と記録","min":20}],"tools":["スプレッドシート（KPI分解・逆算計算）","Higgsfield（画像生成 → image-to-video。企画検証用の仮カット作成）"],"prereq":["Week 2・Week 3で飲食および宿泊施設の映像を各1本以上完成させていること","想定顧客（東京の宿泊施設1件）を仮でも特定していること"],"theory":[{"heading":"宿泊のKPIは掛け算で動く","body":"宿泊事業の売上は、ざっくり **客室数 × 日数 × 稼働率 × ADR** で決まります。\n\n- **稼働率（OCC）**：販売可能客室のうち実際に売れた割合\n- **ADR（平均客室単価）**：販売客室1室あたりの平均単価\n- **RevPAR**：販売可能客室1室あたりの収益。**RevPAR = 稼働率 × ADR**\n\n重要なのは、稼働率とADRが**しばしばトレードオフになる**ことです。値引きすれば稼働率は上がりますが、ADRが落ちてRevPARは改善しないことがあります。たとえば ADR 40,000円・稼働率60%なら RevPAR は 24,000円。これを値引きで ADR 32,000円・稼働率70%にすると RevPAR は 22,400円で、売上は落ちます。\n\nここが映像の出番です。**値引きなしで稼働率を動かす手段**、つまり選ばれる側に回ることに寄与するのが広告動画の役割です。だから提案の言葉は「かっこいい動画を作ります」ではなく「ADRを維持したまま稼働率を何ポイント動かす試みをします」になります。\n\n東京で特に意識すべきなのは、**稼働率の不足が「人が来ない」ではなく「他店に流れる」として現れる**ことです。浅草や上野、新宿の駅周辺には同価格帯の宿が徒歩圏に数十軒あり、OTAの検索結果では同じ条件で横並びに表示されます。需要そのものは存在していて、その中で選ばれていない。だから値引きが最も手軽な打ち手として選ばれ、ADRが下がってRevPARが改善しないという悪循環に入ります。映像の役割は、価格以外の選択理由を作ることです。ただし後述するとおり、稼働率は季節・価格・競合の価格改定や新規開業・OTAの表示順位・大型イベントや連休・為替で動くため、動画単独の効果として断定はできません。だからこそ検証設計が必要になります。"},{"heading":"OTA手数料と直販の差額を金額にする","body":"宿泊施設の多くは予約の大半をOTA（予約サイト）経由で受けています。OTAには送客手数料が発生するため、同じ単価で売っても**手残りが違います**。手数料率は契約・プラン・サイトによって幅があるため、必ず顧客に実際の率を聞いてください（推測で資料に書くと信用を失います）。\n\n仮に手数料率を r、年間のOTA経由売上を S とすると、年間手数料額は S × r です。このうち何パーセントかを直販に置き換えられたときの増益は **S × 置換率 × r** になります。\n\n- 例：OTA経由年商 8,000万円、手数料率を顧客申告で15%とすると、年間手数料は1,200万円\n- そのうち10%を公式サイト直販に置き換えられれば、増益は 8,000万 × 10% × 15% = **120万円/年**\n\nこの120万円が、あなたが提案する「公式サイト・SNS経由の直販導線用の動画」の経済的な上限根拠になります。制作費が年20万円なら、必要な置換率は1.7%程度まで下がる。**顧客が意思決定に使える形の数字**とはこういうものです。なお直販には決済手数料・広告費・自社工数が乗るため、手数料差の全額が利益にはなりません。そこも明示したうえで提示します。"},{"heading":"閑散期の空室は限界利益で評価する","body":"東京は年間を通して需要がありますが、それでも月による濃淡は明確です。桜（3月下旬〜4月上旬）、GW、夏休み、紅葉、年末年始に需要が集中し、1〜2月と6月、9月は落ちます。さらに曜日の軸があり、平日はビジネス出張、週末は国内観光とインバウンドの都市観光で客層が入れ替わります。閑散月の、特に平日のビジネス需要も薄い週末の空室が、映像制作の最大の商機です。\n\n理由は**限界利益の構造**にあります。建物・人員などの固定費は空室でも発生します。追加の1室が売れたときに増えるコストは、清掃・アメニティ・リネン・光熱の変動分だけです。つまり閑散期に1室売るときの限界利益率は、繁忙期より高く見えることが多い。\n\n- 閑散期ADR 18,000円、変動費 3,500円 → 限界利益 14,500円/室泊\n- 空室が 1日 12室 × 60日 = 720室泊 あるなら、理論上の未回収限界利益は約1,044万円\n\nこの規模の穴があるなら、月数万円の広告費と制作費は検討に値する、という話に自然に接続できます。\n\nそして閑散期訴求は、繁忙期訴求とは**別の映像素材が必要**です。桜の時期の素材しかない施設は、1〜2月や6月の訴求ができません。冬の澄んだ空気と夜景、雨の日に濡れずに動ける立地、梅雨時の屋内で完結する過ごし方、初夏の緑の街路、大浴場やサウナ、朝食、周辺の街歩き——この時期の素材が手元にないこと自体が、顧客にとっての明確な欠落です。これは「動画がない」より具体的で、受注につながる指摘になります。\n\nさらに東京では、閑散期の訴求軸が「来る理由を作る」だけでなく「同じ条件で並ぶ競合の中で選ばれる理由を作る」になります。1月の浅草で空室を埋めたい宿は、客が浅草に来ないから困っているのではなく、同じ価格で並ぶ20軒の中から選ばれないから困っている。この違いが訴求軸の設計を変えます。"},{"heading":"飲食のKPIと、東京の客層構造","body":"飲食は **客数 × 客単価 − 原価 − 人件費 − 固定費** で、映像が触れるのは主に客数と客単価です。\n\n- **客単価**：セットやコース、ドリンクの追加で動く。映像は「何を頼むか」の事前決定に効きうる\n- **回転率**：ピーク帯の席効率。映像で予約を分散させる（アイドル帯への誘導）という使い方がある\n- **原価率**：映像で最も見せたい皿が、必ずしも利益率の高い皿ではない。**粗利の高い看板メニューを主役にする**という判断が要る\n- **来店頻度**：近隣の勤務者・住民とインバウンド客で全く別の構造。インバウンドは原則一度きり、近隣客は頻度商売\n\n東京の宿の客層構造は、**平日と週末で入れ替わる**という前提で設計します。平日は国内のビジネス出張、週末は国内の都市観光とインバウンドの短期滞在。インバウンドはスキーのような長期滞在型ではなく、**都市観光・食目的・買い物目的の短期滞在**が中心で、浅草・上野・銀座・新宿・渋谷といったエリアごとに比率も国籍も変わります（正確な構成比は施設ごとに異なるので必ずヒアリングで取ります）。ここから出てくる実務上の論点は3つです。\n\n1. **言語**：日本語のみの動画ではインバウンド層に届かない。英語と中国語の表示、字幕・言語別配信をどうするか\n2. **検索経路**：Googleマップ、OTA、Instagram、宿のフロントでの紹介、どこから来ているか\n3. **決済・予約手段**：キャッシュレス非対応や電話予約が前提の店は、言語の壁と決済の壁でインバウンドを取り逃している可能性がある\n\nそして東京では、**平日と週末で訴求すべき内容が逆**になります。平日のビジネス客には駅からの距離とデスク環境と朝食の開始時刻、週末の観光客には街歩きの起点としての立地と大浴場。1本の動画で両方を狙うと、どちらにも刺さらないものができます。動画以前に導線が壊れている場合もあり、そこを指摘できるかどうかが単価を左右します。"},{"heading":"ヒアリングで取る数値と、取れないときの代替","body":"初回打ち合わせで取りに行く数値です。全部は出てきません。**出てこなかった項目は「不明」と記録する**のが重要で、推測値を事実として扱うと後の検証が壊れます。\n\n宿泊施設から取る項目:\n\n- 客室数、月別稼働率（直近12か月）、月別ADR、月別RevPAR\n- **平日と週末それぞれの稼働率とADR**（東京では曜日で客層が入れ替わるため、月次平均では実態が見えない）\n- 予約チャネル構成比（OTA別／公式サイト／電話／代理店／法人契約）\n- OTAの実手数料率、公式サイト予約エンジンの手数料\n- 国籍・言語別の構成比、平均泊数、リードタイム（予約から宿泊までの日数）\n- 出張需要と観光需要の比率、法人契約の有無\n- 閑散期と判断している月、その月の目標稼働率\n- 徒歩圏の同価格帯の競合数と、直近1年の新規開業の有無\n- OTAの検索結果で自施設が何番目に出るか（手動観測でよい）\n- 現在の広告費（媒体別・月額）、過去に効いた施策と効かなかった施策\n- 公式サイトのセッション数とアクセス解析の設置状況、予約完了の計測有無\n- 既存の写真・動画素材の有無と撮影年、使用可否、閑散期の素材があるか\n- 意思決定者と承認の流れ、繁忙期に連絡が取れる時間帯\n\n取れないときの代替:\n\n- 稼働率が出てこない → OTAの空室カレンダーを数週間分観測して販売状況を推定する（精度は低いと明記する）\n- 手数料率が出てこない → 一般的な幅をレンジで示し、計算は幅のまま提示する\n- リードタイムが出てこない → 計測の起点がないので、テスト期間を長めに設計する\n\nこのリストを渡すと、たいてい「そんな数字で考えたことがなかった」と言われます。**その反応自体が、あなたが映像の外側で価値を出せている証拠**です。"}],"steps":[{"n":1,"action":"対象施設を1件確定する","detail":"東京の宿泊施設を1件選びます（浅草・上野・新宿・渋谷・銀座などエリアを明示する）。実在の見込み客でも、公開情報だけで追える施設でも構いません。客室数・価格帯・最寄駅と徒歩分数・OTA掲載状況、そして徒歩圏の同価格帯の競合数を調べ、1行プロフィールにします。実在施設を扱う場合、公開情報以外の数値を推測で埋めず、推測箇所には印をつけます。","check":"施設のエリア・客室数・価格帯・最寄駅と徒歩分数・主要OTA掲載先・徒歩圏の競合数が1枚に記録されている"},{"n":2,"action":"月別のRevPARを推定して年間カレンダーにする","detail":"12か月分の稼働率とADRを行に取り、RevPAR = 稼働率 × ADR を計算します。可能なら平日と週末を分けた列も持たせます。実数が取れない場合はOTAの公開料金と空室状況から推定し、推定であることを列に明記します。繁忙月と閑散月の RevPAR 比を出します。","check":"12か月のRevPAR表ができ、最繁忙月と最閑散月の比が数値で言える"},{"n":3,"action":"閑散期の未回収限界利益を計算する","detail":"閑散月の空室数（客室数 × 日数 × (1 − 稼働率)）に、閑散期ADRから変動費を引いた限界利益を掛けます。変動費が不明なら複数シナリオ（ADRの15%／20%／25%）で幅を出します。これが提案の金額的な天井です。","check":"閑散期の未回収限界利益が、幅を伴った金額として出ている"},{"n":4,"action":"直販置換のインパクトを計算する","detail":"OTA経由売上 × 置換率 × 手数料率 で増益額を出します。置換率は 3% / 5% / 10% の3シナリオ。手数料率は顧客申告値、なければレンジ。ここから決済手数料・広告費・自社工数を控除した純増も併記します。","check":"3シナリオの増益額が算出され、控除項目も明記されている"},{"n":5,"action":"顧客の悩みを数字つきの文に書き換える","detail":"「動画がない」ではなく「1〜2月と6月に合計約720室泊の空室があり、限界利益ベースで約1,000万円が未回収」「OTA比率82%で年間手数料が約1,200万円」「徒歩5分圏に同価格帯が18軒あり、OTAの検索結果で平均11番目に表示されている」という形に書き換えます。3〜5個作ります。東京では「人が来ない」ではなく「選ばれない」形で課題を書くと、打ち手が具体化します。","check":"数値を含む課題文が3個以上あり、どれも映像とは独立した言い方になっている"},{"n":6,"action":"各課題に対して動画の役割を1行で割り当てる","detail":"課題ごとに「どの動画を、誰に、どこで見せ、何をさせるか」を1行で書きます。閑散期の週末の空室→冬の街歩きと大浴場の滞在体験動画→首都圏近郊の30〜40代夫婦→Instagram/Meta広告→公式サイトの空室検索。この時点で配置先が決まらない課題は、動画で触れない課題として外します。","check":"動画の役割が課題と1対1で対応し、配置先の決まらない課題が除外されている"},{"n":7,"action":"ヒアリング数値シートを完成させる","detail":"理論ブロックの項目リストをスプレッドシートにし、「必須／あれば良い」「取得済／不明」「出典（顧客申告・公開情報・推定）」の3列を付けます。出典列があることで、後の検証で数値の信頼度を区別できます。","check":"15項目以上のシートができ、各項目に出典列が付いている"},{"n":8,"action":"動画の効果を断定しない説明文を用意する","detail":"「動画を出せば稼働率が上がる」ではなく、「稼働率は季節・大型イベントや連休・価格・競合の価格改定や新規開業・OTAの表示順位・天候・為替とインバウンド需要で動くため、動画単独の効果は切り出せない。だから期間を区切り、他の施策を止めた状態で、到達数とクリック率とサイト内の空室検索数を測って判断する」という説明を200字以内で書きます。","check":"効果を断定せず、かつ検証手順を含む説明文が200字以内で書けている"},{"n":9,"action":"閑散期素材の不足を仮カットで可視化する","detail":"閑散期訴求に必要な素材が手元にないことを示すため、閑散期（冬の夜景や梅雨時の屋内）の仮カットを1〜2枚生成します。これは納品物ではなく、顧客に「この季節の素材がないこと」を気づかせるための提案用です。生成物を実写と誤認させないよう、提案時はAI生成であることを明示します。","check":"閑散期の仮カットが1枚以上でき、提案資料に「AI生成イメージ」の表記が入っている"},{"n":10,"action":"優先順位を決めて1枚にまとめる","detail":"課題ごとに「金額インパクト（大中小）」「検証しやすさ（大中小）」の2軸で並べ、最初に作る動画を1本決めます。金額が大きくても検証できないものは後回しにします。Week 4の課題で作る3本の対象施設はここで確定します。","check":"優先順位表ができ、Week 4で扱う施設と最初の1本が確定している"}],"prompts":[{"label":"冬の夜の客室カット（閑散期訴求の素材不足を示す提案用）","text":"A compact corner guest room with a low platform bed and crisp white linen, sheer curtain half drawn and drifting slightly in the air from a vent, a floor-to-ceiling window framing a winter night view of scattered city lights and the dark flanks of neighbouring buildings, a narrow desk with a warm 3000K practical lamp, minimal oak-and-plaster interior, wide shot at eye level, 24mm equivalent, deep focus, the city glow through the glass and the desk lamp as the only sources, matte plaster walls, pale oak veneer floor, crisp cotton weave, no readable signage or window text outside, photorealistic architectural photography, restrained contrast, neutral grade with cool exterior against warm interior","note":"Week 1の7スロット構造をそのまま使用。窓外スロットを冬の夜景に差し替えるだけで季節違いが作れることを顧客に見せる用途。識別できるランドマークを描かせないのは、実在しない眺望の主張を避けるため。1〜2月は空気が澄んで夜景が最も見える時期なので、閑散期こそ訴求できる素材があるという話に繋げられる。実写と誤認させないため提案資料には必ずAI生成の表記を入れる。","status":"未検証","flow":{"code":"T2I","step":"単発","input":"新規。テキストのみで生成する。Week 3 Day 1の「都市型ホテルの客室」プロンプトの窓外スロットだけを冬の夜景に書き換え、画像は参照させない","output":"冬の夜の客室の静止画1枚。季節違いが窓外の書き換えだけで作れることが示せる","next":"提案資料にAI生成の表記を付けて並べ、閑散期素材が宿に無いことを顧客に示す材料にする"}},{"label":"閑散期の街歩きカット（滞在理由の提示）","text":"Two adults in their thirties walking slowly down a narrow shopping street in an older Tokyo neighbourhood on a clear winter afternoon, seen from behind so no faces are visible, low-rise shopfronts with awnings on both sides and bare plane trees along the kerb, no readable shop names and no brand marks anywhere in frame, medium wide shot from a low tracking position behind them, 35mm equivalent, moderate depth of field, low late afternoon sun down the length of the street creating warm rim light on the couple and long shadows on the pavement, dry asphalt texture and painted steel shutters at the roadside, photorealistic, warm but desaturated grade, slight film grain","note":"閑散期に「来る理由」を作るカット。被写体の年齢・人数・活動内容が、d3で設計するターゲット変数そのものになる。ここを street walking / sauna / rooftop at dusk / morning market に差し替えると別ターゲット向けの変種になる。後ろ姿にして顔を入れないのは肖像の論点を避けるため。読める店名を排除しているのは近隣店舗の商標が映り込む論点を避けるため。人物を出す場合、実在人物に見える出力の扱いには肖像・同意の論点があるため、顧客納品時の取り扱いを確認する。","status":"未検証","flow":{"code":"T2I","step":"単発","input":"新規。テキストのみで生成する。参照画像も実写も渡さない。被写体の年齢・人数・活動内容を書き分けてターゲット変数を可視化する","output":"冬の街歩きの静止画1枚。閑散期に来る理由を示す提案用の仮カットになる","next":"d3の訴求軸マトリクスでターゲット変数の候補にし、活動内容を差し替えて別層向けの変種を検討する"}}],"expected":"12か月のRevPAR表、閑散期の未回収限界利益、直販置換の増益額が幅つきの数値で出ており、それぞれに対応する動画の役割が1行で割り当てられた1枚ができている状態です。あわせて15項目以上のヒアリング数値シート（平日・週末別の稼働率と競合密度を含む）と、効果を断定しない説明文が手元にあります。数値が推定である箇所に印が付いていれば到達です。","assignment":{"title":"想定施設のKPI分解と、動画の役割割り当て","brief":"東京の宿泊施設1件を対象に、稼働率・ADR・RevPARの12か月分、予約チャネル構成、閑散期の未回収限界利益、直販置換の増益額を算出します。そのうえで、顧客の悩みを数値つきの文として3つ以上書き出し、各々に対して「どの動画を、誰に、どこで見せ、何をさせるか」を1行で割り当ててください。動画で解決できない課題は外す判断も含めて記録します。この施設が、Week 4の実践課題（訴求軸違い3本）の対象になります。","deliverables":["12か月のRevPAR表（推定箇所の明記つき）","閑散期の未回収限界利益の算出（3シナリオ）","直販置換インパクトの算出（3シナリオ、控除項目つき）","数値つきの課題文3つ以上と、対応する動画の役割割り当て","ヒアリング数値シート（15項目以上、出典列つき）","効果を断定しない説明文（200字以内）","閑散期の仮カット1〜2枚"],"constraints":["推測値を事実として扱わない。推定箇所には必ず印をつける","動画の役割は「どこで見せて何をさせるか」まで書く。見せ場所が決まらないものは外す","作業時間は90分以内","AI生成画像を提案資料に載せる場合はAI生成であることを明記する"]},"success":["RevPARが12か月分計算され、繁忙月と閑散月の比が数値で言える","閑散期の未回収限界利益が、変動費の複数シナリオを伴う金額幅として出ている","直販置換の増益額が算出され、決済手数料・広告費・自社工数の控除が明記されている","数値つきの課題文が3つ以上あり、いずれも「動画がない」という形になっていない","ヒアリングシートの各項目に出典（顧客申告／公開情報／推定）が記録されている"],"rubric":[{"axis":"映像の品質","pass":"3点＝提案用の仮カットが客室・季節の情報を正しく伝えている。5点＝そのまま閑散期訴求の素材候補として使える品質。"},{"axis":"動きの自然さ","pass":"3点＝仮カットを動画化した場合にカーテンや植生の動きが破綻していない。5点＝動きの速度が施設のトーン（静けさ／活動的）と一致している。"},{"axis":"ブランド整合性","pass":"3点＝仮カットの色調が施設の既存素材と大きく外れていない。5点＝施設の価格帯に見合う質感（素材・光）が再現されている。"},{"axis":"マーケ目的整合性","pass":"3点＝課題文が数値を含み、動画の役割が対応している。5点＝金額インパクトと検証しやすさの2軸で優先順位が付き、動画で触れない課題を外す判断が記録され、課題が「人が来ない」ではなく「競合の中で選ばれない」形で定義されている。"},{"axis":"再現性","pass":"3点＝ヒアリングシートが別施設にも使える形になっている。5点＝出典列と必須／任意の区別があり、第三者が同じ手順で同じ表を埋められる。"},{"axis":"時間とコスト","pass":"3点＝分析と仮カットを90分以内で完了。5点＝提案1件あたりの分析工数を実測し、営業活動の原価として記録できている。"}],"pitfalls":[{"problem":"数字が出てこないので全部推測で埋めてしまう","cause":"提案書の空欄を嫌って、推定と事実を混ぜる","fix":"出典列を作り、推定は「推定」と書く。推定のまま提示して顧客に訂正させるほうが、正しい数字が早く手に入る。"},{"problem":"値引きによる稼働率改善を成果として扱ってしまう","cause":"稼働率だけを見てRevPARを見ていない","fix":"評価指標を必ずRevPARに置く。稼働率とADRを同時に表に出し、値引き施策とテスト期間が重なっていないかを確認する。"},{"problem":"繁忙期の映像を作って喜ばれたが、売上には効かない","cause":"桜の時期は放っておいても埋まる施設に、桜の素材を作った","fix":"最初にRevPARの月別カレンダーを見る。東京では曜日の軸もあるので、平日と週末のどちらが空いているかまで見る。すでに稼働率が高い時期の素材は、ADRを上げる用途かブランド維持用途に限定して提案する。"},{"problem":"動画を出す場所が決まっていないまま企画が進む","cause":"成果物が動画であることに引っ張られ、配信面を後回しにした","fix":"企画の1行に「どこで見せるか」を必須項目として入れる。縦横比・尺・音の有無は配信面で決まるため、ここが空だと作り直しになる。"},{"problem":"インバウンド客に日本語だけの動画を出してしまう","cause":"国籍・言語別の構成比を聞いていない","fix":"ヒアリング必須項目に言語別構成比を入れる。週末のインバウンド比率が高い場合、英語と中国語の字幕・言語別配信をd4の導線設計に組み込む。"}],"resourceIds":["hf-academy-ad-agency","ind-hotel-video"],"nextHint":"明日は、その動画が「見られる前に消される」問題を扱います。最初の1〜3秒で離脱を止める設計と、AI動画特有の冒頭破綻リスクへの品質配分です。","setup":{"tag":"生成なし","model":"—（顧客KPIの分析とヒアリング設計）","seconds":"—","res":"—","aspect":"—","outputs":"—","cap":"生成なし","credits":"クレジット消費なし","unlimited":"—","save":"この日は1クレジットも使わない。どの動画を作るかを決める日で、ここを飛ばすと作る必要のない動画を作ることになる。"}},{"id":"w4d2","day":2,"title":"最初の1〜3秒の設計と品質配分","subtitle":"スクロールを止める要因を分解し、AI動画の冒頭破綻リスクに予算を寄せる","why":"広告運用の経験があるなら、3秒再生率が落ちた瞬間にCPAが崩れることは体感で知っているはずです。問題は、AI生成動画には実写にない固有のリスクがあることです。冒頭0.5秒で手指や文字、水の流れが破綻すると、視聴者は「安い広告だ」と判断して即座に離脱し、その施設のブランドまで安く見えます。しかも生成モデルは尺の後半よりも冒頭の破綻率が低いとは限らず、どのカットが壊れるかを事前に制御しきれません。だから予算と生成回数の配分を意識的に冒頭へ寄せる必要があります。今日はフックのパターンを型として持ち、冒頭1秒だけを別工程として作る手順を確立します。","goals":["スクロールを止める5要因を使って、冒頭1秒の候補を8案以上出せる","1フレーム目とサムネイル、静止状態での成立を確認する手順を実行できる","冒頭カットに生成回数とクレジットを集中配分する判断ができる","音声オフ・縦画面・小さい画面という視聴条件を前提に冒頭を設計できる","宿泊・飲食それぞれでフックのパターンを具体化し、3案まで絞り込める"],"duration":"80分","timeBreakdown":[{"label":"フックの構造とパターンの整理","min":20},{"label":"冒頭カットの集中生成と選抜","min":40},{"label":"静止・無音チェックと記録","min":20}],"tools":["Higgsfield（画像生成で1フレーム目を確定 → image-to-video、Marketing Studio に相当する広告用カテゴリ）","スマートフォン（実機での無音・小画面チェック）","スプレッドシート（フック案と選抜記録）"],"prereq":["w4d1で対象施設と最初の1本の役割が確定していること","Week 1の7スロット・プロンプトテンプレートが使える状態であること"],"theory":[{"heading":"止まる理由は5つしかない","body":"スクロール中の視聴者が指を止める要因は、実務上この5つに整理できます。複数を重ねるほど強くなりますが、重ねすぎると情報過多で逆効果です。**2つまで**が目安です。\n\n1. **動き**：フレーム内で何かが動いている。静止画的な冒頭は最弱。ただし「動きすぎ」も素通りされる。視線を一点に集める動き（湯気が立つ、雨が窓を流れる、湯が溢れる、カーテンが開いて街が現れる）が強い\n2. **顔**：人間の顔は注意を引く。目線がカメラを向いているとさらに強い。宿泊なら「窓の外を見ている人物が振り向く」など\n3. **意外性**：予測が外れる。雑踏の路地から一転して静かな客室、暗い廊下から眩しい高層階の窓へ。前後のコントラストで作る\n4. **テキスト**：画面内の短い文字。音声オフ前提では事実上必須。ただし3〜7語程度。長文は読まれない\n5. **音**：鉄板の音、遠い電車の走行音、湯の音。**音声オフで自動再生される面では効かない**ため、音に依存した設計は面によって無効になる\n\n広告運用者にとって重要な注意点は、**プラットフォームによって「止まる」の意味が違う**ことです。自動再生の面では3秒再生率が指標になり、タップ再生の面ではサムネイルとテキストで決まります。配信面を決めずに冒頭を設計すると、どの要因に賭けるかを選べません。"},{"heading":"1フレーム目はサムネイルである","body":"動画の1フレーム目は、多くの面でそのままサムネイル（カバー画像）として使われます。つまり冒頭フレームには2つの仕事があります。\n\n- **静止状態で内容が伝わる**：再生される前の時点で「これは東京の宿の広告だ」と分かる\n- **動き出した瞬間に裏切らない**：静止画として綺麗でも、動き出した途端に破綻すると逆効果になる\n\n実務手順としては、**1フレーム目を静止画として先に確定させる**のが最も確実です。Week 1で扱った画像経由ワークフロー（画像生成 → image-to-video）の最大の実利はここにあります。冒頭フレームを静止画として何度も作り直し、納得した1枚を first frame として指定して動画化する。Seedance は first/last frame の指定が可能で、Veo 3.1 も first + last image を扱えると公開情報にあります（執筆時点）。\n\n静止チェックの具体手順は3つです。\n\n1. 動画の1フレーム目を書き出し、**スマートフォンの画面サイズで**見る\n2. 画面を縮小して親指サイズで見る。それでも主役が判別できるか\n3. テキストを載せる予定の領域に主役が重なっていないか。縦9:16では上下に**UI要素とキャプションの被り**が発生するため、中央帯に主役を置く\n\nサムネイル指定が可能な面では別画像を指定できますが、**指定できない面がある前提で1フレーム目を作る**のが安全側の設計です。"},{"heading":"AI動画は冒頭に品質を寄せる","body":"AI生成動画の品質は尺の中で均一ではありません。手指、文字、水や湯気の流体、人物の歩行、群衆、動物——破綻しやすい要素があり、**どのフレームで壊れるかを完全に制御することはできません**。\n\nここから出てくる実務原則が3つあります。\n\n- **原則1：冒頭1〜2秒は独立したカットとして作る**。15秒を一度に生成して冒頭が壊れたら全部作り直しになります。冒頭を別カットにしておけば、壊れたときの再生成コストが数分の一になります\n- **原則2：生成回数を冒頭に偏らせる**。冒頭カットは3〜5回生成して選抜し、中盤は1〜2回で通す。15秒動画1本を Marketing Studio 相当で作ると公開情報では 89.2クレジット（約$4.46）ですが、短い冒頭カットを複数試すほうが、同じ予算で冒頭の品質を確実に上げられます\n- **原則3：破綻しやすい要素を冒頭に置かない**。冒頭に手元のクローズアップ、看板の文字、顔の大写しを置くのは賭けです。東京の題材では、路地の看板や駅の表示、雑踏の群衆が特に崩れやすい。代わりに、湯気・雨粒・布・光の変化といった**破綻しても気づかれにくい要素**を冒頭に置き、人物や料理の寄りは2秒目以降に回す\n\n逆に言うと、**冒頭に顔を出すフックは強いがリスクも高い**。顔を使うなら生成回数を倍に見込みます。これはクリエイティブの判断ではなく、原価計算に組み込む変数です。"},{"heading":"フックのパターン8種（宿泊・飲食の具体例）","body":"冒頭1〜2秒の型です。宿泊（東京の宿）と飲食（東京の店）で具体化しています。\n\n1. **転換型**（暗→明、外→内）：宿＝暗い廊下から扉が開き、高層階の窓の明るさへ露出が飛ぶ／飲＝暗い店内から炭火の赤へ寄る\n2. **動き起点型**（視線を集める単一の動き）：宿＝大浴場の湯面に湯が注がれて波紋が広がる／飲＝鉄板にバターが落ちて滑る\n3. **顔・振り向き型**：宿＝窓際の人物が街を見ていて、振り向いて微笑む／飲＝カウンターの職人が顔を上げる\n4. **数字提示型**（画面内テキスト）：宿＝「駅の改札から、徒歩3分」／飲＝「朝6時に開く」。※数値は事実のみ。優位性の表示は景品表示法上の裏付けが必要\n5. **問い型**：宿＝「1月の浅草、何があると思う？」／飲＝「このラーメン、何が入ってる？」\n6. **逆張り型**（常識の否定）：宿＝「東京で、観光しない休日」／飲＝「観光客が来ない時間に行く」\n7. **一人称型**（UGC風）：宿＝手持ちカメラで客室に入る視点、生活音／飲＝席に着いて最初の一口。※第三者に依頼した体験談を広告に使う場合は広告であることの明示が必要（ステルスマーケティング規制）\n8. **スケール型**（引きの意外性）：宿＝客室の窓から始まり、引くと建物が路地の奥に一軒／飲＝皿の寄りから引くと満席の店内\n9. **プロセス型**：宿＝ベッドメイクで真っ白なリネンが広がる／飲＝蕎麦を打つ手元から湯気へ\n10. **比較型**：宿＝同じ窓の昼と夜を1秒ずつ／飲＝閉店前の静けさとピークの喧騒\n\n東京では**4と6が特に効きます**。競合が横並びで表示される環境では、「選ぶ理由になる具体的な事実」（駅からの分数、朝食の開始時刻、大浴場の有無）が最も強い差になるからです。情緒だけの訴求は、同価格帯の20軒が同じことを言っている中で埋没します。\n\nこの10案から、**配信面と訴求軸に合うものを3つに絞って作る**のが今日の作業です。10本作るのではなく、3本に絞ってそれぞれに生成回数を割く。これはd3の変数分離テストの前段にあたります。"},{"heading":"音とテキストの冗長設計","body":"音声オフで再生される可能性があるなら、**音がなくても成立し、音があれば強くなる**という冗長設計にします。\n\n- **必須**：画面内テキストだけで主旨が伝わる。テキストは3〜7語、冒頭1秒で読み切れる長さ\n- **推奨**：音声ナレーションの内容を字幕で重複させる。Seedance 2.5 や Wan 2.6 はネイティブ同期音声を持ち、Seedance は多言語リップシンクに対応と公開情報にあります（執筆時点）が、音が聞かれる保証はありません\n- **禁止**：オチが音にしかない構成。「このBGMが来た瞬間に気持ちよくなる」は、無音再生面では何も起きません\n\n東京の文脈では**言語の冗長性**も設計対象です。週末の客層にインバウンドの短期滞在者が相当数いるなら、日本語テキストだけの冒頭は機能しません。平日のビジネス客向けには日本語で足りるのに、週末向けには英語や中国語が要る、という面と曜日による作り分けが発生します。実務的な選択肢は3つです。\n\n1. **言語別に書き出す**：映像は同一、テキストだけ差し替える。これはd3で扱うAd Multiplier相当の使い方（映像変数を固定しメッセージ変数だけ変える）とそのまま同じ構造です\n2. **テキストを最小化する**：文字に依存せず、映像と数字（「3 min」「6:00」）だけで伝える。駅からの徒歩分数や朝食の開始時刻は数字だけで通じるので、東京の宿では特に有効です\n3. **英語を基本にする**：日本語を補助に回す\n\nなお、画面内に生成で文字を描かせると高確率で崩れます。**文字は生成させず、編集工程で載せる**のが原則です。文字の正確な描画に強いとされる画像モデル（GPT Image 2）が存在しますが、動画の文字は別問題として扱い、オーバーレイで処理します。"}],"steps":[{"n":1,"action":"配信面と視聴条件を先に確定する","detail":"対象施設の1本目について、配信面（例：Meta広告の縦9:16、リール面）、音声の初期状態（オフ想定）、想定視聴デバイス（スマートフォン）を書き出します。ここが決まらないと、どのフック要因に賭けるかを選べません。","check":"縦横比・尺・音声の初期状態・デバイスが明記されている"},{"n":2,"action":"フック案を8案以上出す","detail":"理論ブロックの10パターンを使い、対象施設向けに8案以上の冒頭1秒を書きます。各案は「何が画面に写り、何が動き、どんなテキストが載るか」を1行で。案出し段階で生成はしません。","check":"8案以上が1行ずつ書かれ、それぞれどのパターンに該当するか印が付いている"},{"n":3,"action":"3案に絞る","detail":"絞る基準を明文化します。(a) 配信面で機能するか（音依存でないか）、(b) 破綻しやすい要素が冒頭にないか、(c) 訴求軸と矛盾しないか。落とした案は理由を1行で記録します。記録しておくと、テストで負けたときの次の打ち手になります。","check":"3案が選抜され、落とした案に理由が付いている"},{"n":4,"action":"各案の1フレーム目を静止画で作る","detail":"3案それぞれの冒頭フレームを静止画として生成します。Week 1の7スロットテンプレートを使い、カメラ・光スロットで差を付けます。1案あたり2〜3枚生成して1枚選びます。この静止画が後の first frame 指定になります。","check":"3案分の冒頭フレーム静止画が選抜済みで、使用プロンプトが記録されている"},{"n":5,"action":"親指サイズと実機でチェックする","detail":"選んだ3枚を縮小表示し、主役が判別できるかを確認します。さらにスマートフォンに転送して実機の明るさで見ます。暗い画はスマートフォンの屋外輝度では潰れます。東京の題材は夜景・路地・ブルーアワーといった暗い画になりやすいので、ここで落ちる案が出やすい。潰れる場合は光スロットを明るく作り直します。","check":"3枚すべてが親指サイズで主役が判別でき、実機で潰れていない"},{"n":6,"action":"テキスト領域を確保する","detail":"縦9:16では上部のUI、下部のキャプション領域に被りが出ます。安全領域を仮の枠として重ね、主役が中央帯にあるか、テキスト予定地が空いているかを確認します。被る場合は構図（カメラスロット）で逃がします。","check":"安全領域の枠を重ねた確認画像があり、主役とテキスト領域が衝突していない"},{"n":7,"action":"冒頭カットを集中生成する","detail":"3案の冒頭1〜2秒を、静止画を first frame に指定して動画化します。1案あたり3回生成し、冒頭0.5秒の破綻（手指・文字・流体の乱れ、不自然な加速、看板や群衆の崩れ）を基準に選抜します。中盤・終盤はまだ作りません。","check":"3案分の冒頭カットが各3回生成され、冒頭0.5秒に破綻のないテイクが各1本確保されている"},{"n":8,"action":"無音で3秒だけ見せて判定する","detail":"選抜した3本を音声オフで3秒だけ再生し、自分以外の人（1人以上）に「何の広告か」「続きを見たいか」を聞きます。主旨が伝わらない案は、テキストか構図を直します。身内の評価は甘く出るので、「何の広告か」の正答率だけを信用します。","check":"3本について第三者の回答が記録され、主旨の正答・誤答が判別できている"},{"n":9,"action":"生成回数とクレジットを記録する","detail":"案ごとに生成回数、消費クレジット、採用までの所要時間を記録します。冒頭に回数を寄せた結果、1本あたりの冒頭原価がいくらになったかを出します。この数値はd3のテスト本数の上限計算に使います。","check":"案別の生成回数・クレジット・時間が記録され、冒頭カット1本あたりの原価が出ている"},{"n":10,"action":"冒頭設計シートに確定版を書く","detail":"採用した3案について「パターン名／1フレーム目の内容／動く要素／テキスト文言／音の有無／破綻リスクのある要素」を表にします。これがd3で訴求軸を掛け合わせるときの固定部分になります。","check":"3案分の冒頭設計が表として確定し、d3で再利用できる形になっている"}],"prompts":[{"label":"転換型フック（暗い廊下から明るい窓へ）","text":"Interior of a dark hotel corridor with fabric wall panels and a low warm cove light, a door at the far end beginning to open and flooding the frame with bright window light from the room beyond, no room numbers and no readable text anywhere in frame, slow push in along the corridor, 28mm equivalent, medium depth of field, extreme contrast between the 2700K corridor practicals and the 6500K daylight bursting through the doorway, patterned carpet and brushed steel hardware, photorealistic, high dynamic range, cool exterior light and warm interior coexisting, slight film grain","note":"意外性と動きを同時に使う型。露出の飛びが「意外性」を作る。文字や手指を冒頭に置かないため破綻リスクが低い。可変部は廊下の素材（fabric panel / plaster / stone）と扉の先の光（bright window light / blue-hour city glow / low west sun）。時刻違いの変種がここで作れる。室番号を描かせないのは、文字が崩れるうえ実在の部屋割りと矛盾しうるため。","status":"未検証","flow":{"code":"I2V","step":"単発","input":"step4で選んだこの案の1フレーム目の静止画1枚をfirst frameに指定する。新しく画像は作らず、既存の動画も入力しない","output":"暗い廊下から明るい窓へ露出が飛ぶ1〜2秒のクリップ。転換型フックの候補1本が得られる","next":"無音3秒で他2案と見比べて1案に絞り、残った1案をd3のマスター動画の冒頭に接続する","where":"生成画面でモデルを選ぶ（image-to-video）","whereNote":"最も安く、Seedance 2.0 系・Kling 3.0・Wan 2.7 なら Unlimited 対象"}},{"label":"動き起点型フック（大浴場の湯面に広がる波紋）","text":"Close-up of the surface of an indoor communal bath, a thin stream of water entering from out of frame at the left and sending slow concentric ripples across the steaming surface, steam rising and curling in still air, static shot slightly above the water line, 85mm equivalent, very shallow depth of field, a single warm 2800K ceiling lamp reflected on the water against the cool ambient of a narrow clerestory above, glossy rippling water surface, wet dark tiled rim with fine grout lines, no signage and no readable text, photorealistic, cool desaturated grade with a single warm accent, fine grain","note":"視線を一点に集める単一の動きで止める型。波紋と湯気は破綻しても気づかれにくい要素なので、冒頭向き。静止状態でも「大浴場のある宿」と判別できるためサムネイルとしても機能する。東京のビジネスホテルでは大浴場の有無が選択理由になりやすく、競合との差として最も分かりやすい素材。ただし実在と利用条件はWeek 3 Day 4の確認を通すこと。流体表現が崩れる場合は、Wan 2.6（流体・重力の物理表現が得意とされる、執筆時点）での再生成を検討。","status":"未検証","flow":{"code":"I2V","step":"単発","input":"step4で選んだこの案の1フレーム目の静止画1枚をfirst frameに指定する。新しく画像は作らず、既存の動画も入力しない","output":"湯面に波紋が広がる1〜2秒のクリップ。単一の動きで視線を止めるフック候補1本になる","next":"無音3秒で他2案と見比べて1案に絞り、静止状態でも成立するためサムネイル候補としても残す","where":"生成画面でモデルを選ぶ（image-to-video）","whereNote":"最も安く、Seedance 2.0 系・Kling 3.0・Wan 2.7 なら Unlimited 対象"}},{"label":"スケール型フック（客室の窓から引いて街の只中へ）","text":"Starting tight on a rain-streaked guest-room window with warm light inside, camera pulling back steadily through the glass to reveal the slim facade of a small hotel wedged between taller neighbours at the end of a narrow street, the wet road below catching the glow of scattered windows, no signage, no shop names and no readable text anywhere in frame, steady pullback, 24mm equivalent, deep focus, blue-hour ambient with the hotel windows as the only warm source, wet asphalt with specular streaks and dark tiled cladding, photorealistic, muted cool grade, minimal contrast","note":"引きの意外性で止める型。1フレーム目が窓の寄りなので静止でも成立し、動き出すと情報が増える。引いた先で「街の只中に建っている」ことが分かるのが東京版の意外性で、立地の訴求とフックが同時に成立する。カメラ移動が強いため生成の当たり外れが大きい。3回で当たらなければ pullback の速度指定を slow に落とすか、DoP のプリセット（image-to-video 専用、3秒または5秒）で試す。","status":"未検証","flow":{"code":"I2V","step":"単発","input":"step4で選んだこの案の1フレーム目の静止画1枚をfirst frameに指定する。新しく画像は作らず、既存の動画も入力しない","output":"窓の寄りから街の只中の建物へ引く1〜2秒のクリップ。引きの意外性で止めるフック候補1本になる","next":"無音3秒で他2案と見比べて1案に絞る。3回で当たらなければ引きの速度を落として作り直す","where":"Higgsfield DoP（プリセットのカメラ動作）","whereNote":"尺は3秒か5秒のみ。単価が非公開なので生成ボタンで確認する"}},{"label":"テキスト前提の余白設計カット（飲食・鉄板）","text":"A pat of butter sliding across a hot iron griddle and melting into a thin golden film, visible sizzle and fine smoke, tight overhead shot with the subject held in the lower third of a vertical 9:16 frame leaving the upper half dark and empty for overlaid text, 50mm equivalent, shallow depth of field, hard directional light from the right edge raking across the griddle surface, seasoned black iron texture with specular highlights on the melting butter, photorealistic, warm grade, deep shadows in the empty upper area","note":"文字を載せる前提で構図を設計する例。主役を下三分の一に置き、上半分を暗く空ける。文字は生成させずオーバーレイで載せる。縦9:16でテキストが主役に被る失敗は、ここを設計していないときに起きる。可変部は食材と光の方向。","status":"未検証","flow":{"code":"I2V","step":"単発","input":"この記述で先に鉄板の静止画1枚を作り、その1枚を起点に動かす。既存の動画は入力しない。主役を下三分の一に置いた構図のまま動かす","output":"バターが溶け広がる縦9:16のクリップ1本。上半分が暗い余白として空いた状態になる","next":"ここで完結。step6のテキスト領域の確保が成立しているかを、この1本で実機確認する","where":"生成画面でモデルを選ぶ（image-to-video）","whereNote":"最も安く、Seedance 2.0 系・Kling 3.0・Wan 2.7 なら Unlimited 対象"}}],"expected":"3案の冒頭カットが、冒頭0.5秒に破綻のないテイクとして各1本確保され、1フレーム目が親指サイズと実機で判別可能であることを確認済みの状態です。第三者に無音3秒で見せたとき「何の広告か」の回答が記録されており、冒頭カット1本あたりの原価が算出されていれば到達です。","assignment":{"title":"冒頭1〜3秒の3案制作と無音テスト","brief":"w4d1で確定した施設の1本目について、冒頭1〜2秒を3案制作します。フック案を8案以上出してから3案に絞り、落とした案には理由を記録してください。各案は1フレーム目を静止画として確定させてから動画化し、冒頭カットには1案あたり3回の生成回数を割きます。完成した3本を音声オフ・3秒で第三者に見せ、「何の広告か」の正答率を記録します。中盤・終盤はまだ作りません。","deliverables":["フック案8案以上のリスト（パターン名つき）","選抜3案と、落とした案の理由","3案の1フレーム目静止画（採用版、プロンプト記録つき）","3案の冒頭カット動画（各1〜2秒、採用テイク）","親指サイズ・実機チェックの記録と安全領域の確認画像","無音3秒テストの第三者回答記録（1人以上）","案別の生成回数・クレジット・時間と、冒頭カット1本あたりの原価"],"constraints":["冒頭カットは1案あたり3回まで生成し、回数を記録する","冒頭に看板の文字・手元の寄り・顔の大写しを置く案は、破綻リスクを承知のうえで生成回数を倍に見込む","画面内の文字は生成させず、オーバーレイ前提で余白を設計する","作業時間は90分以内"]},"success":["フック案が8案以上あり、採用3案と落選案の理由が書かれている","3案すべてで1フレーム目が静止画として確定しており、動画の first frame に使われている","3案の冒頭0.5秒に、手指・文字・流体・加速の破綻がない","縦9:16の安全領域において、主役とテキスト予定地が衝突していない","無音3秒で第三者が「何の広告か」を答えた結果が、案ごとに記録されている"],"rubric":[{"axis":"映像の品質","pass":"3点＝冒頭0.5秒に目立つ破綻がない。5点＝親指サイズでも主役が判別でき、実機の屋外輝度で潰れない。"},{"axis":"動きの自然さ","pass":"3点＝冒頭の動きが不自然に加速・停止しない。5点＝視線が意図した一点に集まる動きになっており、動きの量が2要因以内に抑えられている。"},{"axis":"ブランド整合性","pass":"3点＝3案の色調とトーンが同一施設のものとして成立している。5点＝フックの刺激の強さが施設の価格帯と矛盾していない（高単価施設で過剰な煽りになっていない）。"},{"axis":"マーケ目的整合性","pass":"3点＝配信面・音声条件・縦横比が事前に確定している。5点＝無音3秒の第三者正答率が記録され、不正解案への修正方針が書かれている。"},{"axis":"再現性","pass":"3点＝採用プロンプトと first frame が保存されている。5点＝冒頭設計シートが表になっており、訴求軸を差し替えても冒頭だけ再利用できる形になっている。"},{"axis":"時間とコスト","pass":"3点＝生成回数とクレジットが案別に記録されている。5点＝冒頭カット1本あたりの原価が算出され、冒頭偏重配分の是非を数値で評価できている。"}],"pitfalls":[{"problem":"15秒を一度に生成し、冒頭が破綻して全部作り直しになる","cause":"冒頭を独立カットとして分けていない","fix":"冒頭1〜2秒を別カットとして先に確定させる。確定後に中盤・終盤を作り、編集で繋ぐ。再生成コストが数分の一になる。"},{"problem":"画面内の文字を生成させて崩れ、修正に時間を取られる","cause":"文字をAIに描かせようとしている","fix":"構図設計の段階で文字用の余白を作り、文字はオーバーレイで載せる。生成プロンプトには文字を含めない。"},{"problem":"音ありで作り込んだのに、配信面では無音で再生されて何も伝わらない","cause":"配信面の音声初期状態を確認していない","fix":"設計の最初に音声オフ前提と明記する。ナレーション内容を字幕で重複させ、無音で3秒だけ見せる検証を必ず通す。"},{"problem":"縦9:16でテキストが主役に被り、編集段階で構図を作り直す","cause":"安全領域を確認せずに構図を決めた","fix":"生成前に安全領域の枠を用意し、主役を中央帯に寄せる構図指定（カメラスロット）を入れる。"},{"problem":"自分には刺さるが、第三者には何の広告か伝わらない","cause":"施設の文脈を知っている状態で判断している","fix":"無音3秒で「何の広告か」を第三者に答えさせ、正答率だけを採用基準にする。感想や好みは採用判断に使わない。"},{"problem":"冒頭に顔を入れて破綻し、予定の生成回数を大幅に超過する","cause":"顔や手の破綻リスクを原価に織り込んでいない","fix":"顔・手を冒頭に使う案は生成回数の見込みを倍にする。超過が許容できないなら、顔は2秒目以降に回し、冒頭は湯気・雪・布・光に置き換える。"}],"resourceIds":["hf-academy-ad-3step","hf-help-marketing-studio","jp-keihyo","jp-stealth"],"nextHint":"明日はこの週の中核です。冒頭を固定したまま訴求軸・ターゲット・CTAだけを変える変数分離テストを設計し、Ad Multiplier でそれを現実的なコストで実行する方法を扱います。","setup":{"tag":"フック検証","model":"静止画 手持ちのツールで可（ChatGPT / Gemini / Soul 2.0）（冒頭フレーム）／ 動画 Seedance 2.0 Fast","seconds":"4秒","res":"720p","aspect":"9:16","outputs":"1","cap":"静止画12枚・動画6本（1案あたり3回まで）","credits":"約 86 cr（$4.28）","unlimited":"0 cr","save":"冒頭だけを4秒で作って比べる。15秒の完成形で比較すると1案あたり5〜6倍かかり、同じ判断にその費用を払うことになる。"}},{"id":"w4d3","day":3,"title":"訴求軸の設計と変数を分離したテスト","subtitle":"映像を固定しメッセージだけ変える。撮影コストが消えた今だけ可能な検証設計","why":"あなたが広告運用でやってきたクリエイティブテストには、ずっと制約がありました。映像の撮り直しに数十万円かかるため、「映像は1本しか作れないから、コピーとターゲットだけ変える」あるいは「映像ごと別案で勝負するが、何が効いたのか分からない」のどちらかになっていたはずです。変数が交絡した状態での勝敗判定は、運用者なら誰でも嫌だったはずです。AI生成と、既存動画の構造を保ったまま要素だけ差し替える機能の登場で、この制約が外れました。映像変数を固定してメッセージ変数だけを動かす、あるいはその逆という厳密なテストが、1変種あたり数ドルで現実的に組めるようになりました。今日は訴求軸の設計と、その変数分離を実行する手順を確立します。","goals":["訴求軸 × ターゲット × CTA のマトリクスを作り、交絡のない比較対を特定できる","映像変数とメッセージ変数を区別し、どちらを固定するかを目的から選べる","Ad Multiplier に相当する機能でマスター動画から変種を作り、映像変数が保持されているか検証できる","変種1本あたりのクレジット実費から、テスト可能な本数の上限を計算できる","Ads Studio（静止画）と Marketing Studio（動画）の使い分けを、テスト目的別に判断できる"],"duration":"90分","timeBreakdown":[{"label":"訴求軸マトリクスと変数設計","min":25},{"label":"マスター動画と変種の生成","min":45},{"label":"変数保持の検証と原価記録","min":20}],"tools":["Higgsfield（Marketing Studio に相当する広告動画機能、Ads Studio 内の Ad Multiplier に相当する変種生成機能）","スプレッドシート（マトリクスと原価計算）"],"prereq":["w4d2で冒頭設計シートが確定していること","w4d1の施設プロフィールとターゲット候補が手元にあること","Week 3で宿泊施設の映像を1本以上完成させていること"],"theory":[{"heading":"訴求軸のマトリクス設計","body":"同じ施設でも、売り方は複数あります。Week 4の課題で作る3本は、この3軸の組み合わせです。\n\n**訴求軸（何を良いと言うか）**\n- A：**施設の高級感**。素材、静けさ、専有感、意匠。価格が高いことを肯定させる方向\n- B：**滞在体験と感情的価値**。朝の光、湯上がりの時間、窓の向こうの街明かり、帰りに寄った店の味。「どんな気持ちになるか」\n- C：**特定層へのメリット**。出張客なら「駅の改札から徒歩3分」「朝食が6時半から」「デスクと電源」、小さい子ども連れなら「客室内で完結する動線」「ベビーベッド常備」、長期滞在者なら「洗濯機と自炊設備」「Wi-Fiの実効速度」\n\n**東京では訴求軸Cが最も強くなりやすい**。競合が横並びで表示される環境では、AとBは同価格帯の20軒が同じことを言っています。「静かで上質な客室」も「心地よい朝」も差になりません。差になるのは検証可能な事実で、しかもそれが客の意思決定の分岐点に対応しているときです。訴求軸の設計は「何が良いか」ではなく「**何で選ばれるか**」から逆算します。\n\n**ターゲット（誰に言うか）**\n- 平日に泊まる国内の出張客／首都圏近郊の30〜40代夫婦／未就学児連れのファミリー／アジア圏からの3〜4泊の都市観光客／欧米からの短期滞在者／法人の研修利用\n\n**CTA（何をさせるか）**\n- 公式サイトの空室検索／LINE友だち追加／Instagram DM／資料請求／電話\n\n3軸を全組み合わせにすると爆発します（3 × 5 × 5 = 75）。実務では**2軸を固定して1軸だけ動かす対を作る**。たとえば訴求軸A・B・C を同一ターゲット・同一CTAで比較すれば、訴求軸の効き方だけが取り出せます。逆に訴求軸Cを固定して、ターゲットを「子連れ」と「長期滞在」で変え、文言と出すメリットを変える、という比較もできます。\n\n重要なのは、**どの比較から得た知見を次に使うか**を先に決めることです。訴求軸の勝者を知りたいのか、ターゲットの反応差を知りたいのか。目的を決めずに3本出すと、3本の数値を見ても次の意思決定に使えません。"},{"heading":"映像変数とメッセージ変数を分ける","body":"クリエイティブを2層に分けて考えます。\n\n**映像変数**：構図、カメラ移動、カット割り、尺、色、被写体の動き、ロケーション、人物の外見・服装\n**メッセージ変数**：フックの文言、ナレーション／スクリプト、画面内テキスト、CTAの文言と配置、言語\n\n従来の撮影では、メッセージを変えるだけでも**再撮影が必要になることが多かった**。ナレーションだけ差し替えるなら編集で済みますが、画面内の人物の口の動きや、商品の持ち方、服装までメッセージに合わせて変えたいとなると、撮影に戻るしかない。だから現場では「映像は1本、コピーだけ3通り」という妥協が標準でした。この構造だと、映像と相性の悪いコピーが不当に負けます。\n\nコストが落ちた今、設計の選択肢が増えます。\n\n- **映像を固定、メッセージを変える**：訴求軸・文言・CTAの効き方を純粋に測る。最も再現性が高く、学習が蓄積する\n- **メッセージを固定、映像を変える**：同じコピーで、高級感の映像と体験の映像のどちらが効くかを測る\n- **両方変える**：全体の当たりを早く引くには有効だが、**何が効いたかは分からない**。初期の探索期に限って使い、知見の蓄積には使わない\n\n広告運用の文脈で言えば、前2つが単変量テスト、最後が総当たりです。クリエイティブ予算が潤沢でなかった時代には総当たりしか現実的でなかったものが、変数を分離する選択肢を持てるようになった、というのが今週の本質です。"},{"heading":"Ad Multiplier の仕様と実費","body":"この週の中核ツールです。公開情報（確認日2026-10-11）では次のとおりです。\n\n- **Ads Studio 内の機能**。既存の動画広告を入力に取り、**動き・構図・カット・尺を保ったまま**、人物／商品／服装／ロケーションを差し替えた変種を生成する\n- **フック・スクリプト・CTAの変更も可能**\n- 入力は **4〜30秒の動画 ＋ 画像最大20点**\n\nつまり「映像変数を保ったままメッセージ変数を差し替える」という、前節で述べた最も価値の高い操作が、この機能の設計目的そのものです。\n\n**実費（公開情報、1クレジッ
