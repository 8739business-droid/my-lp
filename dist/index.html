ubric":[{"axis":"映像の品質","pass":"3点＝提案書の打ち手に、Day1のポートフォリオが参照として組み込まれている。5点＝ヒアリングで得た数字に応じて、3本のどれを見せるかを選べる判断基準が決まっている。"},{"axis":"動きの自然さ","pass":"3点＝提案する素材の尺と動きの方向が訴求に対応している。5点＝ADRの水準に応じて動きの量を変える（高ADR＝動きを抑える）という対応が提案書に書かれている。"},{"axis":"ブランド整合性","pass":"3点＝提案書とヒアリングシートの体裁がCore Bloomとして統一されている。5点＝相手が社内で回覧しても意図が伝わり、口頭の補足を必要としない。"},{"axis":"マーケ目的整合性","pass":"3点＝提案が相手の数字に基づいている。5点＝OTA比率が高い場合に「同じ予約数で利益を増やす」提案に切り替える、といった分岐が実際に書かれている。"},{"axis":"再現性","pass":"3点＝提案書テンプレートが保存され、別施設に流用できる。5点＝ヒアリングシートの回答を入れると提案書の1章と4章が自動的に埋まる形になっている。"},{"axis":"時間とコスト","pass":"3点＝無料で作るものの時間上限が決まっている。5点＝無料制作に使った時間を累計記録する運用が始まり、月の上限が決まっている。"}],"pitfalls":[{"problem":"数字を聞けないまま提案書を作り、一般論になって価格で比較される","cause":"答えにくい項目（ADR・OTA比率）を聞かずに切り上げている。あるいは聞く順序が悪く、序盤で警戒されている","fix":"答えやすい項目から入り、自分の経歴を開示しながら聞く。即答できない相手にはYes/No形式の代替質問に落とす。数字が1つも取れなかった商談では提案に入らず、次の見込み客を探す時間に回す。これは撤退ではなく期待値の判断。"},{"problem":"無料サンプルを作ったのに次の工程に進まず、時間だけ消える","cause":"作る前に次工程と金額の合意を取っていない。無料なので相手に判断する動機がない","fix":"条件4を必須にする。「方向性が合えば___パッケージ（___円）で進めます」という合意を先に取る。合意が取れない相手には作らない。無料制作に使った時間を累計で記録し、月の上限を決める。"},{"problem":"提案書1章で自分の解釈を書いてしまい、以降が全部疑われる","cause":"数字を並べるだけでは物足りなく感じ、分析を混ぜてしまう","fix":"1章は数値のみ、解釈は2章という分離を機械的に守る。1章の末尾に「数値に誤りがあればご指摘ください」と入れ、相手に確認させる。確認が取れた数字の上に立つ提案は、以降の章が強くなる。"},{"problem":"成果を保証する表現が残っていて、後で説明できなくなる","cause":"商談で押したい気持ちが文面に出る。特に「改善します」「効果が出ます」が無意識に入る","fix":"書き終えてから「増え」「向上し」「改善し」「必ず」「確実」「保証」で全文検索し、該当箇所を言い換え集の形に直す。言い換えると弱くなるように感じるが、数字を見てきた経営者には逆に通る。"},{"problem":"広告運用のROAS実績をそのまま宿の提案に出し、期待を作ってしまう","cause":"最大の実績なので使いたくなる。業種の違いを明記しないまま提示している","fix":"「業種の異なる案件での実績であり、宿泊施設での同等の成果を示すものではない」と必ず併記する。実績ではなく計測設計と改善プロセスを売る形に切り替える。成果を示さずに方法を示すほうが、約束にならないぶん安全で、かつ継続提案につながる。"},{"problem":"SNS運用の話を聞いた流れで、運用代行を提案してしまう","cause":"相手がSNSの手応えのなさを語ると、代行が解決策に見える。また相手から頼まれることもある","fix":"ヒアリング項目11に注意書きを入れておく。SNSの課題が出たら「投稿の代行ではなく、広告として配信するクリエイティブの供給と、どの訴求が効くかの検証」という形に必ず置き換えて提案する。投稿代行は時間が線形に増えるだけで改善の蓄積にならない。"}],"resourceIds":["hf-academy-ad-agency","jp-keihyo","jp-stealth"],"nextHint":"明日は、提案が通った後の話です。契約範囲と修正回数の定義、AI生成物に関する条項、そして月額契約が継続する条件を設計します。素材の供給ではなく改善サイクルの提供として継続性を作ります。","setup":{"tag":"生成なし","model":"—（ヒアリングシートと提案書）","seconds":"—","res":"—","aspect":"—","outputs":"—","cap":"生成なし","credits":"クレジット消費なし","unlimited":"—","save":"無料サンプルで作るものの範囲を先に決める。無制限に作ると、受注前に原価だけが積み上がる。"}},{"id":"w6d4","day":4,"title":"契約範囲とAI生成物の条項、継続化の設計","subtitle":"「修正1回」を定義し、AI特有のリスクを条項にし、解約されない理由を作る","why":"契約は受注した後の利益を決めます。同じ価格でも、修正1回の定義が曖昧な契約は実質単価が半分になります。AI生成の受託には実写にない論点が3つあります。出力の唯一性が保証されないこと、権利処理の責任分担、法が求める場合のAI開示です。これを契約に書かずに受注すると、「他の宿と似た映像が出てきた」「この素材はうちのものか」という場面で根拠がなくなります。もう一つの論点が継続です。月額契約を「毎月素材を納める」と定義すると、素材が溜まった時点で解約されます。継続する契約は、納品物ではなく改善サイクルを提供しています。最後に、顧客獲得コストとLTVの関係を把握しないと、営業にいくらまで使えるかが判断できません。なお以下は弁護士による法的助言ではなく、実務上の論点整理です。契約書は必ず専門家の確認を受けてください。","goals":["契約範囲と「修正1回」の定義を、争いが起きない粒度で書ける","素材の権利・二次利用範囲・再販の可否を契約条項として整理できる","AI生成物に関する3つの論点（唯一性の非保証・権利処理の責任分担・AI開示）を条項に落とせる","月額契約の継続価値を「素材の供給」ではなく「改善サイクルの提供」として設計し、解約パターンへの運用対策を定義できる","顧客獲得コスト（CAC）とLTVを自分の数字で計算し、営業に使える上限額を出せる"],"duration":"90分","timeBreakdown":[{"label":"契約範囲と修正定義の設計","min":25},{"label":"AI生成物条項と権利の整理","min":25},{"label":"継続設計とCAC・LTVの計算","min":40}],"tools":["Day2の料金表と3パッケージ定義","Day3の提案書テンプレート","Day1の許諾・表現の自己基準ドキュメント","Higgsfield 利用規約（https://higgsfield.ai/terms-of-use-agreement）","スプレッドシート（CAC・LTV計算）"],"prereq":["Day2の修正回数・二次利用範囲の条件が料金表に明記されていること","Day3の提案書テンプレートが完成していること","Day1の許諾・表現の自己基準で「要専門家確認」の項目が洗い出されていること"],"theory":[{"heading":"「修正1回」とは何か","body":"受託制作で最も頻繁に揉めるのがここです。定義しないと、相手は「言った修正が全部終わるまでが1回」と考え、こちらは「1回のやり取り」と考えます。この差が埋まらないまま進むと、どちらかが不満を抱えて関係が終わります。\n\n> 修正1回とは、納品物に対して**まとめて提出された修正指示1通に対する1回の対応**を指します。修正指示は箇条書きで、対象カットと変更内容を特定した形でご提出ください。1通に含める項目数の上限は___項目とします。\n\n要点は3つです。\n\n**1. 「1通」を単位にする**　時間を単位にすると見積が崩れ、項目を単位にすると小さな指示の回数が増えます。「まとめて1通」にすると、相手に整理する動機が生まれます。\n\n**2. 項目数の上限を置く**　1通に30項目入ってきたら1回ではありません。上限を設け（例：10項目）、超過分は次回に繰り越すか有償にします。\n\n**3. 修正に当たらないものを列挙する**　最も重要です。\n\n- **やり直し**：訴求の方向転換、被写体の変更、カット自体の差し替え、尺の変更、アスペクト比の追加。再制作として別途見積もります。\n- **範囲外**：施設側の設備変更・メニュー変更に伴う作り直し、OTAや広告媒体の仕様変更に伴う作り直し。\n- **無償対応**：こちらの作業ミス（誤字、指示との不一致、書き出し設定の誤り）。回数に数えません。明記しておくと、相手が「ミスの修正に回数を使われる」心配をしなくなり、余計な緊張がなくなります。\n\nさらに**修正指示の提出期限**を決めます。「納品後___営業日以内にご提出ください。期限経過後は検収完了とみなします」。これがないと3ヶ月後に修正依頼が来ます。\n\nここまで細かく書く理由は、Day2の感度分析で確認したとおり**修正超過が粗利を最も壊す変数**だからです。価格を2割上げるより、修正の定義を明確にするほうが利益への効果が大きい場面が多くあります。"},{"heading":"素材の権利と二次利用の整理","body":"権利の論点は3層に分かれます。それぞれ別に決めます。\n\n**第1層：Higgsfield との関係**\n利用規約では、Higgsfield は入力・出力の所有権を主張せず、商用利用を制限しない旨を定めています。解約後も書き出し済み出力の権利は存続し、顧客への移転・サブライセンスが可能。有料限定とは書かれておらず、無料・有料の差は利用上限・保存期間・クレジットの範囲です。\n\nただし注意点が複数あります。**出力の唯一性・独占性は保証されません**。権利処理の責任は利用者にあり、人物の肖像・音声には権利と同意が必要。法が求める場合のAI開示が必要で、来歴表示の除去は禁止。サービスの再販や競合モデルの学習利用は不可。そして**各モデル提供元の規約も適用され、より厳しい方が優先されます**。\n\nさらに不整合があります。Soul のページは画像の商用利用可と明記する一方、Sora 2 のページは商用利用を有料プランに紐づけています。**どちらかを普遍のルールとせず、モデルごとに確認する**のが実務的な態度で、顧客に「全モデルで商用利用可能です」と断定しないこと。\n\n**第2層：顧客との関係**\n- **完成物の使用権**：顧客に許諾。範囲（配信面6分類）と期間を明記する。\n- **中間素材**（未採用カット、プロンプト、Elements、プロジェクトデータ）：原則渡さない。ノウハウであり、渡すと再現されます。渡す場合は別料金。\n- **再販の禁止**：顧客が第三者に販売・再許諾することを禁止する。\n- **実績使用**：ポートフォリオに使用する権利を確保する（公開はDay1の自己基準どおり別途確認）。\n\n**第3層：第三者の権利**\n施設の実写写真を参照に使う場合、権利の所在を確認します。過去にカメラマンに依頼した写真は、契約次第で施設に二次利用の権利がないことがある。**「お持ちの素材をAI生成の参照として使用する権利があることをご確認ください」という条項**で責任分担を明確にします。\n\n以上は論点整理であり法的助言ではありません。文面は専門家の確認を受けること。"},{"heading":"AI生成物に関する3つの条項","body":"実写の受託契約の雛形には存在しない条項です。入れていない契約は、問題が起きたときに根拠がありません。\n\n**条項1：出力の唯一性を保証しない**\n\n> 生成AIの出力は唯一性・独占性が保証されず、類似した出力が第三者によって生成される可能性があります。乙は、納品物が他のいかなる映像とも類似しないことを保証しません。\n\n同じ「夜景の見える客室」を同じツールで作る人が他にいれば似た映像が出ます。東京のように制作者が多い市場では、同業他施設が同じツールと同じ定番構図を使う可能性が高くなります。**事前に書けば説明で済み、書いていなければ信用の問題になります。**\n\nあわせて類似リスクを下げる運用（施設固有の設備を Elements に登録する、訴求の言語を施設独自のものにする）を併記すると、条項が言い訳ではなく方針になります。\n\n**条項2：権利処理の責任分担**\n\n> 甲は、提供する参照素材を本件制作に使用する権利を有することを表明し保証します。第三者の権利に関する問題が生じた場合の対応は、当該素材の提供者が負うものとします。\n> 乙は生成AIサービスの規約を遵守して制作しますが、各モデル提供元の規約変更により制作手法の変更が必要となる場合があります。\n\n後半は、提供元側の変更で使えるモデルや用途が変わりうるために入れます。\n\n**条項3：AI生成の開示**\n\n> 法令等によりAI生成であることの開示が求められる場合、甲は配信・掲示に際して適切な表示を行うものとします。乙は納品時に、開示に必要な情報を甲に提供します。\n> 納品物に含まれる来歴情報を除去してはなりません。\n\n来歴表示の除去禁止は規約に定められた事項です。顧客が意図せず除去する可能性があるため契約に書いて伝えます。\n\nまた宿泊施設や飲食店の広告では**実在しない設備・景観・メニューを当該施設のものとして表示すると、景品表示法上の優良誤認の論点に触れる可能性**があります。「納品物が実在する設備・提供内容と整合していることを掲示前にご確認ください」という確認条項で双方のリスクが下がります。専門家に確認すべき項目として印を付けてください。"},{"heading":"月額契約が継続する条件","body":"月額契約の解約は、不満ではなく**惰性の終わり**で起きます。「もう素材は十分ある」と思われた時点で終わる。だから継続する契約は納品物を増やしているのではなく、**毎月何かが分かる状態**を作っています。\n\n**素材の供給（解約される設計）**\n- 毎月5本の動画を納品する\n- 顧客の手元に素材が溜まり、6ヶ月目には30本あって「しばらく使えるので一旦止めます」となる\n- 継続の価値が在庫なので、在庫が満ちると不要になる\n\n**改善サイクルの提供（継続する設計）**\n- 毎月1つ仮説を立て、訴求違いの素材で検証し、結果をレポートし、次月の仮説を決める\n- 顧客の手元に溜まるのは**どの訴求が自施設に効くかという知見**\n- 6ヶ月目には6つの検証結果があり、7つ目の仮説が存在する\n- 継続の価値が学習なので、止めると学習が止まる\n\n後者で月次に提供すべきものは4点です。\n\n1. **先月の配信結果のレポート**（指標の推移と、前月の仮説が支持されたか否か）\n2. **今月の仮説**（なぜそれを次に検証するのか）\n3. **検証用クリエイティブ**（訴求違い2〜3パターン）\n4. **蓄積の更新**（施設固有の Elements、効いた訴求の一覧、効かなかった訴求の一覧）\n\n4点目が解約の抑止力になります。Elements に登録された施設固有の客室・外観・料理のデータ、どの訴求が効いたかの記録は、継続するほど制作の効率と精度が上がる資産です。これを毎月の成果物として可視化すると、**解約すると蓄積が止まる構造**になります。ただし囲い込みの仕掛けではなく、実際に継続のほうが成果が出やすい構造を作ること。囲い込みだけの仕掛けは見抜かれます。\n\nこの設計は Academy の `Build an AI Ad Agency with Claude + Higgsfield` の「納品のサブスク化」「品質管理ゲート」のモジュールに対応します。該当モジュールで型を確認し、自分の設計の漏れを点検してください。"},{"heading":"解約されるパターンとCAC・LTVの関係","body":"**解約の主なパターン**は5つです。A素材が溜まった（前述の設計で対応）、B成果が見えない（レポートに必ず「だから次はこうする」を書く）、C閑散期に予算が消えた（**閑散期（1〜2月・6月・9月）は月額と本数を下げ、繁忙期前に戻す**季節対応型にする。解約されるより低額で継続するほうが双方に合理的）、D担当者が変わった（意思決定者が複数なら両方と関係を持ち、蓄積を文書で残す）、E確認工数が重い（確認を1回・1形式に固定する）。\n\n**CACとLTVの計算**\n\n顧客獲得コスト（CAC）は1件の受注に使った費用と時間です。独立初期は広告費がほぼ0でも、**時間がコストです**。\n\n> CAC = (営業に使った時間 × 時間単価 + 実費) ÷ 獲得件数\n\n例：営業活動に月40時間、時間単価6,700円、交通費2万円。1件受注なら (40 × 6,700 + 20,000) ÷ 1 = 288,000円。2件なら144,000円。**受注率が2倍になればCACは半分**なので、CACを下げる最も効く手段は価格ではなく受注率です。\n\n> LTV = 月額 × 粗利率 × 平均継続月数 + 初期構築の粗利\n\n例：月額50,000円・粗利率65%・平均継続10ヶ月・初期構築150,000円（粗利率60%）なら LTV = 325,000 + 90,000 = 415,000円。\n\n**判断基準**：LTV / CAC が 3 を超えることが健全性の一つの目安とされます。上の例では 415,000 ÷ 288,000 = 1.44 で届いていません。手段は3つ。継続月数を伸ばす（20ヶ月でLTV 740,000円・比率2.57）、受注率を上げてCACを下げる（月2件で比率2.88）、月額か粗利率を上げる。最も効くのは前2つで、継続月数は今日の設計、受注率はDay3の精度で決まります。\n\nこの計算の価値は**営業に使える上限が出ること**です。CACの上限を LTV/3 = 138,000円と置くなら、1件獲得に使える時間は約17時間。これを超えて追いかけている見込み客は採算が合っていません。"}],"steps":[{"n":1,"action":"契約範囲を納品物ベースで列挙する","detail":"Day2の3パッケージそれぞれについて、契約に含まれるものを数量つきで列挙します。本数、尺、アスペクト比の種類数、書き出し形式、レポートの有無と頻度、打ち合わせの回数と形式、納品方法。同時に「含まれないもの」を列挙します。含まれないものを書くほうが揉め事を防ぎます。","check":"3パッケージの「含むもの」「含まないもの」が数量つきで列挙されている"},{"n":2,"action":"「修正1回」を定義する","detail":"理論の定義を自分の言葉で書きます。必須要素は4つ：(1) 1通の修正指示に対する1回の対応という単位、(2) 1通に含める項目数の上限、(3) 修正に当たらないもの（やり直し・範囲外・無償対応するミス）の列挙、(4) 修正指示の提出期限と検収完了のみなし規定。この4つが揃っていない定義は実務で機能しません。","check":"4要素すべてを含む修正の定義が文章として完成している"},{"n":3,"action":"やり直しと修正の境界線を具体例で10個書く","detail":"抽象的な定義だけでは現場で判断できません。「冒頭カットの明るさを上げる＝修正」「冒頭カットを別のカットに差し替える＝やり直し」のように、実際に来そうな指示を10個挙げて、どちらに分類されるかを決めます。この一覧を契約の別紙にすると、商談でも説明が早くなります。","check":"10例が修正／やり直しに分類され、境界の判断基準が言語化されている"},{"n":4,"action":"権利と二次利用の3層を整理する","detail":"第1層（Higgsfieldとの関係）：規約の該当箇所をURLと確認日つきで引用し、商用利用の条件・唯一性非保証・各モデル提供元の規約も適用されること・Soul と Sora 2 の記述に不整合があることをメモします。第2層（顧客との関係）：使用権の範囲と期間、中間素材を渡さないこと、再販禁止、実績使用の可否。第3層（第三者の権利）：顧客提供素材の権利確認条項。","check":"3層それぞれの整理が文書化され、第1層には規約のURLと確認日が付いている"},{"n":5,"action":"AI生成物に関する3条項を書く","detail":"条項1（唯一性の非保証）、条項2（権利処理の責任分担とモデル提供元の規約変更への対応）、条項3（AI開示と来歴情報の除去禁止）を文章として書きます。あわせて、宿泊施設固有の確認条項として「納品物が実在する設備・提供内容と整合していることを掲示前に確認いただく」旨を入れます。","check":"3条項と宿泊施設固有の確認条項が文章として完成している"},{"n":6,"action":"類似リスクを下げる運用方針を書く","detail":"唯一性を保証しない条項が言い訳に見えないよう、こちら側の対策を併記します。施設固有の設備・内装を参照画像として使いElementsに登録する、訴求の言語を施設独自のものにする、同一エリア・同一沿線の複数施設で同じ訴求軸を使わない、など3つ以上。東京は制作者も施設も多く、定番構図が被りやすいので、この対策は実際に必要になります。この方針は提案書の打ち手にも転記します。","check":"類似リスク低減の運用方針が3つ以上書かれ、提案書にも反映されている"},{"n":7,"action":"弁護士ではない旨の注記と専門家確認の方針を書く","detail":"自分が作成する契約書の雛形に、次の注記を入れます。「本書は実務上の論点を整理したものであり、法的助言ではありません。契約の締結にあたっては、弁護士等の専門家の確認を受けてください。」さらに、自分の運用方針として「初回の顧客との契約前に、雛形を一度専門家に確認してもらう」「景品表示法上の表示の考え方について確認する」「税務上の処理（継続契約の売上計上時期）について確認する」の3項目を予定として書きます。Day1で洗い出した要確認項目もここに統合します。","check":"注記文が作成され、専門家に確認する項目が一覧になっている"},{"n":8,"action":"月額契約の月次提供物を4点で定義する","detail":"(1) 先月の配信結果レポート（指標の推移と仮説の支持/不支持）、(2) 今月の仮説とその理由、(3) 検証用クリエイティブ（訴求違い2〜3パターン）、(4) 蓄積の更新（Elements、効いた訴求の一覧、効かなかった訴求の一覧）。各項目の具体的な形式と分量を決めます。「毎月素材を納める」という表現が契約書と料金表のどこにも残っていないことを確認してください。","check":"4点が形式と分量つきで定義され、素材供給型の表現が残っていない"},{"n":9,"action":"解約パターン5つに対する運用対策を書く","detail":"A素材が溜まった／B成果が見えない／C季節で予算が消えた／D担当者が変わった／E現場の確認工数が重い。それぞれに対策を1〜2行で書きます。特にCについては、閑散期に月額を下げて本数を減らし繁忙期前に戻す季節対応型の契約条項を実際に書いてください。東京の年間サイクルでは、1〜2月・6月・9月の閑散期にこれが継続率に最も効きます。","check":"5パターンに対策が付き、季節対応型の契約条項が文章になっている"},{"n":10,"action":"CACを自分の数字で計算する","detail":"CAC = (営業時間 × 時間単価 + 実費) ÷ 獲得件数。営業時間にはリスト作成・アプローチ・商談・提案書作成・無料サンプル制作のすべてを含めます。時間単価はDay2で確定した数字を使います。獲得件数は想定値（初期は月0〜1件が現実的）で、1件・2件の2通りで計算します。","check":"CACが獲得1件・2件の2通りで算出されている"},{"n":11,"action":"LTVを計算してLTV/CAC比を出す","detail":"LTV = 月額 × 粗利率 × 平均継続月数 + 初期構築の粗利。平均継続月数は実績がないので仮定値を置き（6ヶ月・12ヶ月・24ヶ月の3通り）、それぞれでLTVとLTV/CAC比を計算します。比率が3を超える条件を特定してください。「継続何ヶ月なら成立するか」が分かると、継続設計の目標値が決まります。","check":"継続月数3通りのLTVとLTV/CAC比が算出され、比率3を超える条件が特定されている"},{"n":12,"action":"1件獲得に使える時間の上限を出す","detail":"CACの上限を LTV ÷ 3 と置き、そこから実費を引いて時間単価で割ります。これが1件獲得に投入できる時間の上限です。この数字を出す目的は、見込みの薄い相手を手放す判断基準を持つことです。「この相手にすでに何時間使ったか」を記録する運用もあわせて決めてください。","check":"1件獲得に使える時間の上限が時間数で出ており、投入時間の記録方法が決まっている"}],"prompts":[{"label":"修正の定義と境界線シート","text":"【修正1回の定義】\n修正1回とは、納品物に対してまとめて提出された修正指示1通に対する1回の対応を指します。修正指示は箇条書きで、対象カットと変更内容を特定した形でご提出ください。1通の指示に含める項目数の上限は___項目とします。上限を超える場合、超過分は次回の修正回に繰り越すか、別途お見積りとなります。\n\n【修正指示の提出期限】\n納品後___営業日以内にご提出ください。期限経過後は検収完了とみなします。\n\n【修正に含まれるもの（回数を消費する）】\n・色調・明るさ・コントラストの調整\n・テロップの文言・位置・サイズの変更\n・カットの前後関係の入れ替え\n・尺の数秒単位の調整（___秒以内）\n・BGM・効果音の差し替え（既存のライブラリ内）\n・___\n\n【やり直しに当たるもの（修正ではなく別途お見積り）】\n・訴求の方向転換（例: 高級感訴求 → 体験価値訴求）\n・被写体の変更（例: 客室カット → 料理カット）\n・カット自体の差し替え（順序変更ではなく、カットの再生成）\n・尺の大幅変更（___秒を超える増減）\n・アスペクト比の追加（9:16 に 16:9 を追加する等）\n・訴求パターンの追加\n・___\n\n【本契約の範囲外（別案件）】\n・御施設の設備変更・メニュー変更に伴う作り直し\n・配信媒体（OTA・広告プラットフォーム）の仕様変更に伴う作り直し\n・___\n\n【無償で対応するもの（修正回数に数えない）】\n・乙の作業ミス（誤字、ご指示との不一致、書き出し設定の誤り、ファイル形式の誤り）\n・納品データの破損・不足\n\n【境界線の具体例10】\n1. 「冒頭カットをもう少し明るく」→ 修正\n2. 「冒頭カットを別の部屋のカットに変えて」→ やり直し\n3. 「テロップの文言を変えて」→ 修正\n4. 「テロップを英語版も作って」→ やり直し（言語追加）\n5. 「カットの順番を2番と3番で入れ替えて」→ 修正\n6. 「2番のカットを削って別のを入れて」→ やり直し\n7. 「15秒を13秒に詰めて」→ 修正（___秒以内の調整）\n8. 「15秒版から30秒版も作って」→ やり直し\n9. 「全体をもう少し落ち着いたトーンに」→ 修正（色調調整の範囲なら）\n10. 「全体をもう少し高級感のある感じに作り直して」→ やり直し（訴求の方向転換）\n\n※9と10の違いが最も揉める。9は既存素材の色調調整で対応できる範囲、10は素材自体の再生成が必要。商談時にこの2例を使って説明すると、相手も境界を理解しやすい。","note":"項目9と10の例が実務上の核心。相手は両方を同じ要望として言うので、受けた側が「これは色調で対応できる範囲ですか、素材から作り直す話ですか」と確認する習慣が必要。10例の一覧を契約の別紙にすると、商談中の説明も早くなる。無償対応の列挙を入れておくと、相手が「ミスの修正に回数を使われる」心配をしなくなり、関係が穏やかになる。","status":"未検証","flow":{"code":"DOC","step":"工程1 / 4","input":"Day 2 で決めた修正回数と納期、および Week 5 の工程別時間から見た修正1回の実作業分数","output":"修正／やり直し／範囲外／無償の4区分と、境界線の具体例10件","next":"契約書の別紙にして商談で提示する。9番と10番の例で境界を説明する"}},{"label":"AI生成物に関する条項（雛形・専門家確認前提）","text":"【前提注記 — 契約書の冒頭または社内メモに記載】\n本書は実務上の論点を整理したものであり、法的助言ではありません。契約の締結にあたっては、弁護士等の専門家の確認を受けてください。\n\n──────────\n第__条（生成AIの使用と出力の性質）\n1. 乙は本件制作において生成AIサービスを使用する。\n2. 生成AIの出力は唯一性・独占性が保証されず、類似した出力が第三者により生成される可能性がある。乙は、納品物が他のいかなる映像・画像とも類似しないことを保証しない。\n3. 乙は前項のリスクを低減するため、甲固有の設備・内装・提供内容を参照素材として使用し、訴求表現を甲固有のものとして設計する。\n\n第__条（参照素材の権利）\n1. 甲が乙に提供する参照素材（写真・動画・ロゴ・音声・図面等）について、甲は当該素材を本件制作に使用する権利を有することを表明し保証する。\n2. 前項の素材に関し第三者の権利（著作権・肖像権・商標権等）について問題が生じた場合、当該素材の提供者がその対応を負う。\n3. 人物が写っている素材については、甲は当該人物の同意を取得済みであることを保証する。\n\n第__条（納品物の権利と使用範囲）\n1. 乙は甲に対し、納品物を次の範囲で使用する権利を許諾する。\n   使用可能な配信面: □自社サイト □OTA掲載 □SNSオーガニック投稿 □有料広告配信 □施設内モニター □印刷物\n   使用期間: ___年（期間満了後の取扱い: ___）\n2. 甲は納品物を第三者に販売・再許諾してはならない。\n3. 制作過程で生じた中間素材（未採用の生成物、プロンプト、生成AI上のプロジェクトデータ、Elements等の登録データ）は乙に帰属し、本契約による納品の対象には含まれない。\n4. 乙は納品物を自己の実績として使用できる。ただし甲の名称・ロゴ・特定可能な外観を公開する場合は、事前に甲の確認を得る。\n\n第__条（生成AIであることの開示）\n1. 本件納品物は生成AIを用いて制作されたものである。\n2. 法令等により生成AIによる制作であることの開示が求められる場合、甲は配信・掲示に際して適切な表示を行う。乙は納品時に開示に必要な情報を甲に提供する。\n3. 甲は納品物に含まれる来歴情報（生成AIによる制作であることを示すメタデータ等）を除去してはならない。\n\n第__条（表示内容の整合性確認）\n1. 甲は、納品物の内容が甲の実在する設備・提供内容・景観と整合していることを、配信・掲示の前に確認する。\n2. 乙は納品時に、納品物に含まれる表現のうち実在の設備と対応しない可能性がある箇所を甲に明示する。\n※本条は景品表示法上の表示に関する論点を含むため、専門家の確認を推奨する。\n\n第__条（生成AIサービスの規約変更）\n乙が使用する生成AIサービスおよび各モデル提供元の利用規約の変更により、制作手法の変更が必要となる場合、乙は甲に通知のうえ、同等の品質を維持する範囲で手法を変更できる。","note":"4つ目の「表示内容の整合性確認」が宿泊施設固有で最も重要。実在しない設備・景観を当該施設のものとして表示すると優良誤認の論点に触れる可能性があるため、確認の責任分担を明記しておく。ただし条文の妥当性は専門家確認が必須。「中間素材は納品対象に含まれない」を書いておかないと、プロンプトやElementsの提供を求められたときに断る根拠がなくなる。これはノウハウそのもので、渡すと再現される。","status":"未検証","flow":{"code":"DOC","step":"工程2 / 4","input":"Day 1 の許諾・表現の自己基準の要専門家確認項目と、二次利用を認める配信面の範囲の判断","output":"生成AIの使用・参照素材・権利・開示・表示整合性の5条項の雛形","next":"弁護士等の専門家に確認を依頼する。中間素材を渡さない根拠にも使う"}},{"label":"月額契約の継続設計シート","text":"【継続の定義】\n本契約は「毎月___本の素材を納品する契約」ではなく、「毎月1つの仮説を検証し、結果を次月の判断に反映する契約」である。\n（※料金表・提案書・契約書のどこにも「毎月素材を納める」という表現を残さない）\n\n【月次の提供物4点】\n1. 先月の配信結果レポート\n   形式: ___（A4___枚 / スプレッドシート）\n   内容: 指標___の推移 / 前月の仮説が支持されたか否か / 想定外だった点\n   必須: 数字の羅列で終わらせず「だから次はこうする」を必ず書く\n\n2. 今月の仮説\n   形式: 1文 + 根拠2〜3行\n   例: 「平日の滞在価値は朝食ではなく、駅からの近さと夜の静けさで訴求したほうが反応する」\n\n3. 検証用クリエイティブ\n   本数: ___本（訴求違い___パターン）\n   配信条件: 同条件で配信して比較する前提\n\n4. 蓄積の更新\n   ・Elements（施設固有の客室・外観・料理・備品）の登録点数: 今月___点 → 累計___点\n   ・効いた訴求の一覧: 今月___件追加 → 累計___件\n   ・効かなかった訴求の一覧: 今月___件追加 → 累計___件\n   ・配信面別の反応の記録\n   → この蓄積を毎月の成果物として可視化する。継続するほど制作の精度と速度が上がる構造になっていることを数字で示す\n\n【季節対応条項（東京の年間サイクルに対応）】\n繁忙期（3〜4月 / 7〜8月 / 12月のうち該当する___月〜___月）: 月額___円 / 検証___回/月\n閑散期（1〜2月 / 6月 / 9月のうち該当する___月〜___月）: 月額___円 / 検証___回/月\n※閑散期の減額は値引きではなく、検証回数と提供本数を連動させた契約設計である\n※閑散期に解約されるより低額で継続するほうが双方に合理的であることを提案時に説明する\n\n【解約パターンと対策】\nA. 素材が溜まった → 継続の価値を在庫から学習に移す（上記4点の設計）\nB. 成果が見えない → レポートに必ず「だから次はこうする」を書く。数字だけのレポートを出さない\nC. 季節で予算が消えた → 季節対応条項で対応。年間契約にして総額で合意する選択肢も用意\nD. 担当者が変わった → 意思決定者が複数の場合は両方と関係を持つ。蓄積を文書で残し引き継げる形にする\nE. 現場の確認工数が重い → 確認を月1回・1形式に固定。確認待ち時間の上限を決め、超過時は先行して進める運用にする\n\n【継続率の記録】\n契約開始月 / 現在の継続月数 / 解約時の月数と理由（上記A〜Eのどれか）\n→ 3件以上の解約が出た時点で、最頻出のパターンに対する設計を見直す","note":"4点目の蓄積の可視化が継続の鍵。ただし囲い込みの仕掛けとしてやると見抜かれるので、実際に継続のほうが成果が出やすい構造を作ること。Elements に施設固有の素材が溜まると生成の試行回数が減り、採用率が上がって制作時間が短くなる。これは実際に起きる効率化なので、数字で示せる。季節対応条項は東京の年間サイクルに対応した必須項目で、これがないと閑散期（1〜2月・6月・9月）に解約が集中する。","status":"未検証","flow":{"code":"DOC","step":"工程3 / 4","input":"Day 2 のパッケージCの月次提供内容と、東京の年間サイクルにおける繁忙期・閑散期の月と各期の月額の判断","output":"月次提供物4点・季節対応条項・解約5パターンの対策が入った継続設計","next":"契約書と提案書に反映する。蓄積の点数を毎月の成果物として示す"}},{"label":"CAC・LTV計算シート","text":"【CAC（顧客獲得コスト）】\n営業活動の時間内訳（月次）:\n・見込み客リスト作成: ___時間\n・アプローチ（連絡・訪問）: ___時間\n・商談・ヒアリング: ___時間\n・提案書作成: ___時間\n・無料サンプル制作: ___時間\n合計: ___時間\n\n時間単価（Day2で確定）: ___円/時\n実費（交通費・通信・資料印刷等）: ___円\n\n獲得1件の場合: CAC = (___時間 × ___円 + ___円) ÷ 1 = ___円\n獲得2件の場合: CAC = 同額 ÷ 2 = ___円\n→ 受注率が2倍になるとCACは半分になる。CACを下げる最も効く手段は価格ではなく受注率\n\n【LTV（顧客生涯価値）】\n月額: ___円 / 月額の粗利率: ___% / 初期構築: ___円 / 初期構築の粗利率: ___%\n\n継続6ヶ月: LTV = ___ × ___ × 6 + ___ × ___ = ___円\n継続12ヶ月: LTV = ___円\n継続24ヶ月: LTV = ___円\n\n【LTV / CAC 比】\n          獲得1件(CAC ___円)  獲得2件(CAC ___円)\n継続6ヶ月:      ___              ___\n継続12ヶ月:     ___              ___\n継続24ヶ月:     ___              ___\n\n→ 比率が3を超える条件: ___（継続___ヶ月 かつ 月___件受注）\n→ この条件が現実的かどうかの判断: ___\n\n【1件獲得に使える時間の上限】\nCACの上限 = LTV ÷ 3 = ___円\n実費を差し引く: ___円 − ___円 = ___円\n時間に換算: ___円 ÷ ___円/時 = ___時間\n→ 1件の見込み客に投入できる時間の上限は ___時間\n\n【投入時間の記録運用】\n見込み客ごとに累計投入時間を記録する。上限の___%に達した時点で、受注確度を再評価する。\n上限を超えた見込み客は、追わずに次に回す判断をする。\n→ この基準がないと、見込みの薄い相手に時間を吸われて新規開拓が止まる","note":"LTV/CAC が 3 を超えることが健全性の一つの目安とされるが、独立初期はほぼ確実に下回る。重要なのは「継続何ヶ月なら成立するか」を数字で知ることで、それが継続設計の目標値になる。1件獲得に使える時間の上限を出すのは、見込みの薄い相手を手放す判断基準を持つため。この基準がない人は、反応のいい1社に何十時間も使って、その間に他の商談を作れない状態になる。","status":"未検証","flow":{"code":"DOC","step":"工程4 / 4","input":"営業活動の工程別の実測時間と実費、Day 2 で確定した時間単価、月額と初期構築の粗利率","output":"継続月数ごとのLTV/CAC比と、1件の見込み客に使える時間の上限","next":"Day 5 の90日計画で、この上限を超えた見込み客を手放す基準にする"}}],"expected":"3パッケージの契約範囲が「含むもの」「含まないもの」の両方で列挙され、「修正1回」が4要素を含む定義として完成している状態です。修正とやり直しの境界が具体例10個で判断できるようになっています。権利の3層が整理され、AI生成物に関する3条項と宿泊施設固有の整合性確認条項が文章になっています。弁護士ではない旨の注記と専門家確認項目の一覧があります。月額契約が改善サイクルの提供として4点で定義され、季節対応条項が書かれています。CACとLTVが自分の数字で計算され、LTV/CAC比が3を超える条件と、1件獲得に使える時間の上限が数字で出ていることが到達判定です。","assignment":{"title":"契約条項の整備と継続設計、CAC・LTVの算出","brief":"3パッケージの契約範囲を列挙し、「修正1回」を4要素を含む形で定義します。修正とやり直しの境界を具体例10個で示してください。権利を3層（Higgsfieldとの関係・顧客との関係・第三者の権利）で整理し、AI生成物に関する3条項（唯一性の非保証・権利処理の責任分担・AI開示と来歴情報）を文章化します。弁護士ではない旨の注記と専門家に確認する項目の一覧を必ず付けてください。あわせて月額契約を改善サイクルの提供として4点で定義し、季節対応条項を書きます。最後にCACとLTVを自分の数字で計算し、LTV/CAC比が3を超える条件と1件獲得に使える時間の上限を算出します。","deliverables":["3パッケージの契約範囲（含むもの・含まないもの）","「修正1回」の定義（単位・項目上限・修正に当たらないものの列挙・提出期限）","修正／やり直しの境界線の具体例10個","権利の3層整理（第1層にはHiggsfield規約のURLと確認日つき）","AI生成物に関する3条項と表示内容の整合性確認条項","弁護士ではない旨の注記と専門家確認項目の一覧","類似リスクを下げる運用方針（3つ以上）","月額契約の月次提供物4点の定義と季節対応条項","解約パターン5つに対する運用対策","CAC・LTV計算シート（継続月数3通り・獲得件数2通り）と1件獲得に使える時間の上限"],"constraints":["契約書の雛形には必ず「法的助言ではない」旨と専門家確認を推奨する一文を入れる","料金表・提案書・契約書のどこにも「毎月素材を納める」という表現を残さない","Higgsfield規約を引用する際はURLと確認日を必ず併記し、断定しない記述（不整合がある事項）はそのように書く","CAC計算には営業の全工程（リスト作成・アプローチ・商談・提案書作成・無料サンプル制作）の時間を含める","作業時間は90分以内"]},"success":["修正1回の定義に4要素（1通単位・項目上限・修正に当たらないものの列挙・提出期限と検収みなし）が含まれ、境界が具体例10個で示されている","権利の3層が整理され、Higgsfield規約の該当箇所がURLと確認日つきで記録されている","AI生成物の3条項が文章として完成し、唯一性非保証に対する低減策が併記されている また弁護士ではない旨の注記と、専門家に確認する項目の一覧がある","月額契約が改善サイクルの提供として定義され、月次提供物4点に蓄積の可視化と季節対応条項が含まれている","CACとLTVが自分の数字で計算され、LTV/CAC比が3を超える条件と1件獲得に使える時間の上限が出ている"],"rubric":[{"axis":"映像の品質","pass":"3点＝契約に品質基準（Week 5のチェックリスト）が参照されている。5点＝品質の判定基準が契約に明記され、検収の可否が主観で決まらない形になっている。"},{"axis":"動きの自然さ","pass":"3点＝尺や動きの変更が修正／やり直しのどちらかに分類されている。5点＝尺の調整幅（何秒以内なら修正か）が数値で定義されている。"},{"axis":"ブランド整合性","pass":"3点＝契約書の体裁がCore Bloomとして統一されている。5点＝相手が顧問税理士や専門家に見せても恥ずかしくない文書水準になっている。"},{"axis":"マーケ目的整合性","pass":"3点＝月額契約が素材供給型になっていない。5点＝継続の価値が蓄積（Elements・効いた訴求の記録）として数字で可視化され、顧客にも説明できる形になっている。"},{"axis":"再現性","pass":"3点＝契約雛形が保存され、次の顧客にも使える。5点＝修正境界の10例とAI条項が別紙として独立し、商談中の説明資料としても機能する。"},{"axis":"時間とコスト","pass":"3点＝CACとLTVが算出されている。5点＝LTV/CAC比が3を超える条件を特定し、1件獲得に使える時間の上限を営業の判断基準として運用し始めている。"}],"pitfalls":[{"problem":"修正の定義を書いたが、現場で判断できず毎回揉める","cause":"定義が抽象的で、具体例がない。特に「全体をもう少し落ち着いたトーンに」のような指示がどちらか判断できない","fix":"境界線の具体例10個を別紙にする。受けた指示が判断できないときは「これは色調調整で対応できる範囲ですか、素材から作り直す話ですか」と相手に確認する習慣をつける。確認せずに作業を始めると、やり直しを修正の回数で処理することになる。"},{"problem":"中間素材（プロンプト・Elements）の提供を求められて断れない","cause":"契約に「中間素材は納品対象に含まれない」と書いていない。顧客は制作物一式が自分のものだと考えている","fix":"契約条項に明記する。説明の仕方としては「完成物の使用権は御施設のものです。制作の工程で使っている設定データは当方のノウハウなので納品対象外とさせていただいています」と伝える。提供する場合は別料金として設定する。渡すと再現されて次回以降の受注がなくなる。"},{"problem":"AI生成の類似リスクを条項に書いただけで、言い訳に見える","cause":"保証しないことだけを書き、低減策を書いていない","fix":"条項3項として低減策を併記する。施設固有の設備を参照素材にしてElementsに登録する、訴求表現を施設独自のものにする、同一エリアの複数施設で同じ訴求軸を使わない。この3つを提案書の打ち手にも転記すると、条項が方針として機能する。"},{"problem":"法務・税務について自分で判断して進め、後で問題になる","cause":"専門家に確認するコストを避けている。契約書の雛形がネットで手に入るため、確認なしで使ってしまう","fix":"初回の顧客との契約前に一度専門家に確認する予定を立て、確認項目を一覧にしておく。景品表示法上の表示の考え方、継続契約の売上計上時期、AI生成物に関する条項の妥当性の3点は特に確認する。雛形には必ず「法的助言ではない」旨の注記を残す。"},{"problem":"月額契約が素材納品型になっていて半年で解約される。あるいは閑散期に解約が集中する","cause":"契約書と料金表に「毎月___本納品」と書いてあり、顧客も本数で価値を測るため本数が溜まると不要になる。加えて東京の年間サイクルを契約に織り込まず、繁忙期と同じ月額を閑散期にも請求している","fix":"契約の定義を「毎月1つの仮説を検証する」に書き換え、月次提供物に必ずレポートと次月の仮説を含める。「毎月素材を納める」という表現を全文検索で探して消す。蓄積（Elements点数・効いた訴求の件数）を毎月の成果物として数字で示す。季節対応条項として、閑散期は月額と検証回数を連動させて下げ、繁忙期前に戻す。閑散期に解約されて次の繁忙期前に再度営業するより、低額で継続するほうがCACの観点でも有利。"},{"problem":"反応のいい1社に何十時間も使い、その間に新規開拓が止まる","cause":"1件獲得に使える時間の上限を知らない。手応えのある相手に時間を投入するのが合理的に見える","fix":"LTV ÷ 3 をCACの上限と置き、1件獲得に使える時間を計算する。見込み客ごとに累計投入時間を記録し、上限の8割に達したら受注確度を再評価する。上限を超えた相手は追わずに次に回す。この判断ができないと、Day5で作る90日計画の件数に届かない。"}],"resourceIds":["hf-academy-ad-agency","hf-terms","jp-keihyo","jp-stealth"],"nextHint":"最終日は、ここまでの価格と契約を数式に入れて、顧客数×単価×継続月数の収益モデルを作ります。自分の時間が上限になる点を計算で出し、そこから逆算した90日計画と、事業が成立しない場合の判断基準を決めます。","setup":{"tag":"生成なし","model":"—（契約範囲と継続設計）","seconds":"—","res":"—","aspect":"—","outputs":"—","cap":"生成なし","credits":"クレジット消費なし","unlimited":"—","save":"修正回数の定義が曖昧なままだと、1件の修正対応で粗利が消える。ここは文章だけで利益率が変わる工程。"}},{"id":"w6d5","day":5,"title":"収益シミュレーションと90日計画","subtitle":"キャパシティの壁を数式で出し、到達可能な目標と撤退基準を決める","why":"「月100万円」という目標が機能しないのは、根拠がないからです。顧客単価5万円なら20社必要で、1社の月次対応に8時間かかるなら160時間、営業と経理を入れると月の稼働が200時間を超えます。つまりその目標は達成不可能であり、努力の問題ではなく算術の問題です。逆に、顧客単価と制作キャパから逆算した目標なら、達成に必要な行動量が確定します。今日やるのは、顧客数×単価×継続月数のモデルを作り、自分の時間が上限になる点を数式で可視化することです。そして外注を入れる損益分岐点を計算します。最後に、90日で誰に何件アプローチし、何件の商談と受注を目指すのかを決め、同時に事業が成立しない場合の判断基準も決めます。撤退基準を先に決めておかないと、成立しない事業に時間を注ぎ続けることになります。","goals":["顧客数 × 単価 × 継続月数の収益モデルを数式で作り、スプレッドシートで動かせる","自分の時間が上限になるキャパシティの壁を数式で算出し、月商の上限を数字で言える","外注を投入する損益分岐点を計算し、何件目から外注が成立するかを特定できる","顧客単価と制作キャパから逆算した目標を設定し、90日の実行計画をアプローチ・商談・受注の数値目標つきで作成できる","事業が成立しない場合の判断基準を、指標と期限を含む形で先に決められる"],"duration":"95分","timeBreakdown":[{"label":"収益モデルとキャパシティの壁の計算","min":35},{"label":"外注の損益分岐点と目標設定","min":25},{"label":"90日計画と撤退基準の作成","min":35}],"tools":["Day2の料金表（3パッケージの価格・原価・粗利率）","Day4のCAC・LTV計算シート","Week 5の原価表と工程別時間","スプレッドシート（収益モデル・感度分析・90日計画）"],"prereq":["Day2で3パッケージの価格と粗利率が確定していること","Day4でCAC・LTVとLTV/CAC比が算出されていること","Week 5の工程別時間（1本あたりの制作時間）が実測で出ていること"],"theory":[{"heading":"収益モデルの3変数","body":"受託サービス業の月商は3つの変数で決まります。\n\n> **月商 = 稼働中の顧客数 × 顧客あたり月額 × （継続している比率）**\n\nそして年商は継続月数が効いてきます。\n\n> **年間売上 = 新規獲得件数 × 顧客あたり月額 × 平均継続月数 + 初期構築費 × 新規獲得件数 + 単発案件の売上**\n\nこの式を見ると、伸ばせる変数が4つあることが分かります。新規獲得件数、月額、継続月数、単発の件数。このうち**継続月数が最も効率がよい**理由は、Day4で計算したとおり、新規獲得にはCACがかかるのに継続には追加のCACがかからないからです。\n\n具体的な数字で見ます。月額50,000円、初期構築150,000円、平均継続12ヶ月とします。\n\n- 顧客1件の年間売上 = 50,000 × 12 + 150,000 = 750,000円\n- 月商で見ると、継続顧客が5社あれば 250,000円／月\n- 10社なら 500,000円／月\n\nこれに単発案件（1本10万円が月1件）を足すと、10社＋単発で月商60万円。粗利率65%なら粗利39万円。ここから固定費（Higgsfieldのサブスク、ソフト、通信、その他で月3〜5万円程度）を引いて、残りが自分の所得の元になります。\n\n重要なのは、**この計算が「10社獲得できれば」という仮定に立っていること**です。10社を獲得するのに何件のアプローチが必要で、10社の月次対応に何時間かかるのか。それを計算しないと、この数字は願望にとどまります。次のブロックでそこを計算します。"},{"heading":"キャパシティの壁：自分の時間が上限になる点","body":"受託事業の収益を止めるのは需要ではなく自分の時間です。これは数式で出せます。\n\n**使える時間**　1日8時間 × 月22日 = 176時間。ただし全部を制作に使えません。Day2で確認したとおり営業・経理・学習の非請求時間が3〜4割発生します。\n\n> 制作に充てられる時間 = 176 × 0.6 = 約106時間/月\n\n**1顧客あたりの月次所要時間**　継続契約1社の月次対応をWeek 5の実測値から積み上げます。検証用クリエイティブ制作（訴求違い3本 × 1本あたり時間）、配信結果の集計とレポート作成、次月の仮説設計、打ち合わせと確認対応、修正対応（規定回数分）。仮に合計8時間とします。\n\n**キャパシティの壁**\n\n> 受け入れ可能な顧客数の上限 = 制作可能時間 ÷ 1顧客あたり月次所要時間 = 106 ÷ 8 = **13.25 → 13社**\n> 月商の上限 = 13社 × 50,000円 = **650,000円**\n\nこれが壁です。単発案件はこの外側に積めません（同じ時間を取り合うため）。**月商65万円が自分の時間だけで到達できる上限**ということになります。粗利率65%なら粗利42万円。\n\n月100万円を単独で目指すなら、条件は次のいずれかです。\n\n1. **月額を上げる**：20社分の時間（160時間）は確保できないので、13社で100万円なら月額76,900円が必要。Day2の価値逆算（広告費の10〜20%）に照らすと月の広告費が40〜77万円規模の施設が対象で、候補はあるが狭まります。\n2. **1顧客あたり所要時間を下げる**：8時間→5時間で上限21社、月商105万円。手段はテンプレート化、Elementsの蓄積（継続するほど生成の試行が減る）、レポートの自動化。\n3. **外注を入れる**：次のブロックで計算します。\n\n**この計算の意味は、目標が達成可能かを事前に判定できることです。**決めずに掲げた目標は、未達の原因が努力不足に見えてしまいますが、実際は設計の問題です。"},{"heading":"外注投入の損益分岐点","body":"外注は「忙しくなったら頼む」ものではありません。**投入すると粗利率が下がる**ので、下がった粗利率でも総粗利が増える条件を満たしてから入れます。\n\n**工程の切り分け**　出せるのは、生成の試行（プロンプトが確立している部分）、書き出し、派生制作、素材の整理・命名、レポートの数値入力。出せないのは、訴求の設計、仮説立案、顧客との会話、品質の最終判断、提案書作成です。\n\n仮に月次8時間のうち外注に出せるのが4時間、外注単価2,500円/時間なら外注費は1顧客あたり月10,000円。\n\n**粗利への影響**\n- 外注なし：月額50,000円、原価（生成実費+固定費配賦）を仮に7,000円とすると粗利 = 43,000円\n- 外注あり：原価7,000円 + 外注費10,000円 = 17,000円。粗利 = 33,000円\n\n1社あたり粗利は10,000円減りますが、空いた4時間で新規顧客を受けられます。\n\n**損益分岐点**\n\n> 外注後の顧客数上限 = 106 ÷ 4 = **26社** → 月粗利 26 × 33,000 = 858,000円\n> 外注なしの月粗利 = 13 × 43,000 = 559,000円\n> 外注が成立する顧客数 = 559,000 ÷ 33,000 = **16.9 → 17社**\n\nつまり**17社を超えて獲得できる見込みがなければ、外注を入れると粗利が減ります**。13社の段階で入れると、1社あたり粗利が下がった分だけ損をする。「忙しいから外注」で判断すると売上は増えても粗利が減る。飲食店で人を入れる判断と同じ構造です。\n\nなお**品質管理の工数が追加で発生する**点も織り込みます。チェックと手直しに1社あたり1時間かかるなら自分の時間は5時間になり、上限は21社に下がります。Week 5の品質チェックリストを渡せる形にすると減ります。Academy の品質管理ゲートのモジュールが参考になります。"},{"heading":"到達可能な目標の立て方","body":"目標は願望ではなく3つの制約から逆算します。制約1はキャパシティ（前述の顧客数上限）、制約2は市場の規模、制約3は受注率です。\n\n**制約2：市場の規模**　東京全体では宿泊施設も飲食店も数千軒規模になるため、母数をそのまま使うと計画が立ちません。**先にエリア（区・沿線）と業態で絞り、その範囲の実数**を東京都や区市の統計、旅館業の施設一覧などの公開情報で確認します（推定で進めず必ず実数を調べてください）。そこからさらに次の条件で絞ります。広告を出している／出す意思がある（Day3の項目8で判定）、ADRと規模がパッケージの価格帯に合う、連絡先が特定できる。\n\n仮に絞り込んだ母数300軒で条件を満たすのが25%なら75軒。**この数字が出ると目標の性質が変わります**。13社獲得は75軒に対して17%の受注率ということになり、現実性を制約3で判定できます。\n\n**制約3：受注率の実務的な数字感**　紹介のない完全な新規開拓では、アプローチ→反応が1〜2割、反応→商談が半分程度、商談→提案が半分程度、提案→受注が3割程度。掛けると**アプローチ100件から受注1〜2件**という計算になります。\n\nこの数字は厳しく見えますが、**紹介があると桁が変わります**。東京は競合が多く、飛び込みの新規開拓は他社の提案と並べて比較されるため、紹介の価値がさらに大きくなります。あなたは飲食店運営10年で培った取引先と同業の関係があるため、完全な新規開拓だけで進める必要はありません。紹介経由なら商談到達率と受注率が大きく上がります。紹介の有無でアプローチ先を2つのリストに分け、歩留まりを別々に記録してください。\n\n**到達可能な目標の形**　「月100万円」ではなく次の形で立てます。\n\n> 90日で、紹介経由___件・新規開拓___件にアプローチし、商談___件、提案___件、受注___件を目指す。受注内訳は単発___件・継続契約___件。90日後の月商は___円、うち継続分は___円。\n\nこれなら達成・未達の原因が特定できます。アプローチ数が足りなかったのか、商談化しなかったのか、提案で落ちたのか。広告運用でファネルを見るのと同じ構造です。"},{"heading":"事業が成立しない場合の判断基準","body":"撤退基準を先に決めるのは悲観ではなく資源配分の管理です。基準がないと、成立しない事業に時間を注ぎ続けて他の選択肢を取る余力がなくなります。基準は**指標と期限の組み合わせ**で決めます。「うまくいかなければやめる」では判断できません。\n\n**層1：行動量**　90日でアプローチ___件を実行したか。未達ならまだ事業の成否は判定できません。行動量が足りていないだけです。判断は撤退ではなく「期間延長して行動量を確保する」。行動していないのに市場のせいにするのが最も避けるべき誤判断です。\n\n**層2：反応率**　___%を下回る場合、アプローチの方法か対象が間違っています。撤退ではなく対象リストと訴求文の見直し。2回見直して改善しないなら対象業種そのものを再検討します。\n\n**層3：商談での反応**　「価格が高い」が___%を超えるなら価格設計か対象施設の規模を見直します。逆に全件即決なら安すぎます。提案に進まないケースが___%を超えるなら、ヒアリングで数字が取れていないか、課題が映像で動かせない領域にあります。\n\n**層4：成立性**\n- 90日で受注0件 **かつ** 層1の行動量を達成。この組み合わせが最も重要です。十分に行動して受注0なら、商品・価格・対象のいずれかに構造的な問題がある。選択肢は対象を変える、商品を変える、事業を止めるの3つ。\n- 180日時点で月の粗利が生活必要額の___%未達。自分の必要額から決める資金的な基準です。\n- LTV/CAC が 1 を下回り続ける。獲得するたびに損をしている状態で、価格・継続率・CACのどれかを変えないと受注が増えるほど悪化します。\n\n**運用**　基準を決めても、その時が来たら「もう少し」と思うのが普通です。**判定日をカレンダーに入れ、判定に使う数字を毎週記録する**。記録していれば判定日に数字が揃い、感情ではなく数字で判断できます。\n\nこの基準は「やめる理由」を探すためではなく、**続ける根拠を数字で持つため**のものです。受注1件でも、行動量を達成して反応率が想定内ならそれは継続の根拠になります。"}],"steps":[{"n":1,"action":"収益モデルをスプレッドシートで作る","detail":"入力セル：継続顧客数、月額、初期構築費、平均継続月数、単発件数と単価、粗利率、月額固定費。出力セル：月商、月粗利、年間売上、年間粗利。入力を変えると出力が動く形にします。Day2の料金表の数字を初期値として入れてください。","check":"入力を変えると月商と粗利が自動計算されるシートができている"},{"n":2,"action":"月間の可処分稼働時間を算出する","detail":"1日の稼働時間 × 月の稼働日数を出し、非請求時間（営業・経理・学習）の比率を引きます。比率はDay2で使った数字（請求可能6割程度）と整合させてください。例：8時間 × 22日 × 0.6 = 106時間。この数字が以降の全計算の分子になります。","check":"制作に充てられる月間時間が1つの数字で出ている"},{"n":3,"action":"1顧客あたりの月次所要時間を実測ベースで積み上げる","detail":"検証用クリエイティブ制作（本数×1本あたり時間）、配信結果の集計とレポート、次月の仮説設計、打ち合わせと確認対応、修正対応（規定回数分）。Week 5の工程別実測時間とDay1のポートフォリオ制作実測を使います。推定で膨らませず、実測値から出してください。","check":"1顧客あたり月次所要時間が内訳つきで算出されている"},{"n":4,"action":"キャパシティの壁を計算する","detail":"受け入れ可能顧客数 = 制作可能時間 ÷ 1顧客あたり月次所要時間。小数は切り捨てます。次に 月商の上限 = 顧客数上限 × 月額。この2つの数字を、スプレッドシートに「キャパシティの壁」として明示的に表示させます。単発案件はこの時間を取り合うことを注記してください。","check":"顧客数の上限と月商の上限が数字で出ており、シート上に明示されている"},{"n":5,"action":"月商100万円に必要な条件を3通りで計算する","detail":"(1) 単価を上げる場合：必要な月額 = 1,000,000 ÷ 顧客数上限。その単価が成立する施設規模（Day2の価値逆算・広告費の10〜20%から逆算）を特定します。(2) 所要時間を下げる場合：必要な1顧客あたり時間 = 制作可能時間 ÷ (1,000,000 ÷ 月額)。削減手段を具体的に書きます。(3) 外注を入れる場合：次の手順で計算します。","check":"3通りの条件が数字で出て、それぞれの現実性が1行で判定されている"},{"n":6,"action":"外注の工程を切り分け、損益分岐点を計算する","detail":"まず工程を分けます。外注に出せるのは生成の試行（プロンプト確立済み部分）、書き出し、派生制作、素材整理、レポートの数値入力。出せないのは訴求設計、仮説立案、顧客との会話、品質の最終判断、提案書作成です。1顧客あたりの外注可能時間を算出し、外注単価を設定して外注費を出します。次に外注ありの1社あたり粗利を計算し、品質管理工数（外注品のチェックと手直し）を自分の時間に加算します。そのうえで「外注が成立する顧客数 = 外注なしの月粗利 ÷ 外注ありの1社あたり粗利」を算出してください。","check":"外注可能時間・外注費・品質管理工数を含めた上で、外注が成立する顧客数が数字で出ている"},{"n":7,"action":"アプローチ対象の母数を実数で調べる","detail":"対象エリア（区・沿線）と業態を先に決め、その範囲の宿泊施設数・飲食店数を東京都や区市の統計、旅館業の施設一覧、商店会の名簿などの公開情報から確認します。東京全体の数字をそのまま母数にしないこと。推定で進めないこと。そこから条件（広告を出している/出す意思がある、価格帯が合う、連絡先が特定できる）で絞り込み、実際のアプローチ対象件数を出します。絞り込み率は根拠つきの想定でよいですが、母数は実数を使ってください。","check":"母数が公開情報の実数で確認され、アプローチ対象件数が算出されている"},{"n":8,"action":"アプローチ先を紹介経由と新規開拓の2リストに分ける","detail":"飲食店運営10年で培った取引先・同業・業者との関係から、紹介が得られる可能性のある先をリスト化します。紹介経由と完全新規では歩留まりが大きく違うため、別リストにして歩留まりを別々に記録する設計にします。紹介の依頼先（取引先、同業者、商工会、既存の人的つながり）も列挙してください。","check":"2つのリストに分かれ、紹介の依頼先が列挙されている"},{"n":9,"action":"ファネルの目標数値を設定する","detail":"アプローチ → 反応 → 商談 → 提案 → 受注の各段階に、件数と転換率の目標を置きます。紹介経由と新規開拓で別の転換率を設定します。初期は実績がないので想定値ですが、週次で実績を記録して更新する前提にしてください。受注目標は、キャパシティの壁の範囲内に収めること。","check":"5段階のファネルに件数と転換率の目標が入り、受注目標がキャパシティ内に収まっている"},{"n":10,"action":"90日計画を週単位で作る","detail":"13週に分割し、各週の行動を書きます。Day2の提案時期カレンダーと整合させてください（商談期かどうかで動きが変わります）。各週に：アプローチ件数、商談件数、提案件数、制作稼働、その他（資料改善・学習）の時間配分を入れます。第1〜2週はリスト作成と資料の仕上げ、第3週からアプローチ開始という組み方が現実的です。既存顧客が増えた週は営業時間が減ることを織り込んでください。","check":"13週分の計画に週次の行動件数と時間配分が入っている"},{"n":11,"action":"判断基準を4層で決め、判定日を登録する","detail":"層1（行動量）：90日でアプローチ___件を実行したか。未達なら撤退ではなく期間延長。層2（反応率）：___%を下回ったら対象と訴求文を見直す。層3（商談での反応）：価格が高いという反応が___%超なら価格設計を見直し、提案に進まないケースが___%超ならヒアリングを見直す。層4（成立性）：90日で受注0かつ行動量達成なら対象・商品・継続の3択、180日で粗利が必要額の___%未達なら資金的判断、LTV/CACが1未満なら設計変更。各基準に数値を入れたうえで、90日後と180日後の判定日を具体的な日付でカレンダーに登録し、週次記録の項目（アプローチ・反応・商談・提案・受注の件数、受注金額、制作稼働、営業稼働、見込み客ごとの累計投入時間）を決めます。","check":"4層すべてに数値基準が入り、判定日が日付で登録され、週次記録項目が9項目前後決まっている"},{"n":12,"action":"Week 6の成果物を1つのパッケージにまとめる","detail":"ポートフォリオ3本（Day1）、サービス紹介ページ、料金表（Day2）、ヒアリングシート・提案書テンプレート（Day3）、契約雛形（Day4）、制作フロー図、収益シミュレーションと90日計画（Day5）。制作フロー図は受注から納品・改善サイクルまでを1枚にします。これらを1つのフォルダまたは共有リンクに集約し、商談時にすぐ出せる状態にしてください。","check":"7つの成果物が1箇所に集約され、商談時にすぐ参照できる状態になっている"}],"prompts":[{"label":"収益モデルとキャパシティの壁 計算シート","text":"【入力】\n顧客あたり月額: ___円\n初期構築費: ___円\n平均継続月数（想定）: ___ヶ月\n月額の粗利率: ___%\n単発案件: 月___件 × ___円\n月額固定費: ___円\n\n【時間の制約】\n1日の稼働時間: ___時間 / 月の稼働日数: ___日\n総稼働時間: ___ × ___ = ___時間/月\n請求可能比率（営業・経理・学習を除く）: ___%\n制作に充てられる時間: ___ × ___ = ___時間/月　…… (A)\n\n【1顧客あたり月次所要時間（Week 5・Day1の実測値から）】\n検証用クリエイティブ制作: ___本 × ___時間/本 = ___時間\n配信結果の集計とレポート作成: ___時間\n次月の仮説設計: ___時間\n打ち合わせ・確認対応: ___時間\n修正対応（規定回数分）: ___時間\n合計: ___時間/月　…… (B)\n\n【キャパシティの壁】\n受け入れ可能顧客数の上限 = (A) ÷ (B) = ___ ÷ ___ = ___社（小数切り捨て）\n月商の上限 = ___社 × ___円 = ___円\n月粗利の上限 = ___社 × (月額 × 粗利率) − 固定費___円 = ___円\n※単発案件はこの時間を取り合うため、上限の外側には積めない\n\n【月商100万円に必要な条件（3通り）】\n条件1: 単価を上げる\n  必要な月額 = 1,000,000 ÷ ___社 = ___円\n  この単価が成立する施設規模 = 月間広告費___円以上（広告費の10〜20%という配分から逆算）\n  → 現実性の判定: ___\n\n条件2: 1顧客あたり所要時間を下げる\n  必要な顧客数 = 1,000,000 ÷ ___円 = ___社\n  必要な1顧客あたり時間 = (A) ÷ ___社 = ___時間\n  現在の___時間から___時間削減が必要\n  削減手段: テンプレート化（___時間）/ Elements蓄積による試行削減（___時間）/ レポート自動化（___時間）\n  → 現実性の判定: ___\n\n条件3: 外注を入れる（下記シートで計算）\n  → 現実性の判定: ___\n\n【判定】\n到達可能な月商の上限（現在の条件）: ___円\n6ヶ月後に現実的な目標: ___円（顧客___社 + 単発___件）\n→ 根拠: ___","note":"キャパシティの壁の計算が本日の核心。(A) ÷ (B) で顧客数の上限が出た時点で、月100万円が到達可能かが判定できる。多くの場合、単独では月60〜70万円程度が壁になる。この数字を知らずに「月100万円」を目標に掲げると、未達の原因が努力不足に見えてしまうが、実際は算術の問題である。単発案件を上限の外に積めないことを注記しているのは、ここを混同すると計画が破綻するため。","status":"未検証","flow":{"code":"DOC","step":"工程1 / 4","input":"Week 5 Day 4 の実測値から積んだ1顧客あたり月次所要時間と、1日の稼働時間・月の稼働日数・請求可能比率","output":"受け入れ可能な顧客数の上限と、そこから出る月商・月粗利の上限額","next":"月商100万円に必要な3条件の現実性を判定し、外注の計算に進む"}},{"label":"外注投入の損益分岐点 計算シート","text":"【工程の切り分け】\n外注に出せる工程:\n・生成の試行（プロンプト確立済み部分）: ___時間\n・書き出し・アスペクト比違いの派生制作: ___時間\n・素材の整理・命名: ___時間\n・レポートの数値入力: ___時間\n小計: ___時間/顧客/月　…… (C)\n\n外注に出せない工程:\n・訴求の設計・仮説立案: ___時間\n・顧客との会話（打ち合わせ・確認）: ___時間\n・品質の最終判断: ___時間\n・提案書作成: ___時間\n小計: ___時間/顧客/月\n\n外注品の品質管理工数（チェック・手直し）: ___時間/顧客/月　…… (D)\n※これを忘れると計算が甘くなる。Week 5の品質チェックリストを渡せる形にすると減る\n\n外注後に自分が使う時間 = (B) − (C) + (D) = ___時間/顧客/月　…… (E)\n\n【コストと粗利】\n外注単価: ___円/時間\n1顧客あたり外注費 = (C) ___時間 × ___円 = ___円/月\n\n外注なし: 月額___円 − 原価___円 = 1社あたり粗利 ___円　…… (F)\n外注あり: 月額___円 − 原価___円 − 外注費___円 = 1社あたり粗利 ___円　…… (G)\n\n【顧客数上限の変化】\n外注なし: (A) ÷ (B) = ___社\n外注あり: (A) ÷ (E) = ___社\n\n【損益分岐点】\n外注なしの月粗利 = ___社 × (F) ___円 = ___円　…… (H)\n外注が成立する顧客数 = (H) ÷ (G) = ___ ÷ ___ = ___社\n\n【判定】\n・現在の顧客数: ___社\n・外注が成立する顧客数: ___社\n・判定: 現時点で外注を入れると粗利が【増える / 減る】\n・外注を入れるタイミング: 顧客___社に到達した時点、または受注見込みが___社分ある時点\n\n【外注先の準備（投入前にやること）】\n・Week 5の品質チェックリストを外注用に書き直す\n・プロンプトテンプレートのうち、渡すものと渡さないものを分ける（Day4の中間素材の扱いと整合させる）\n・1本あたりの作業手順書を作る\n・試験発注を___本行い、品質管理工数の実測値を取る","note":"「忙しいから外注」で判断すると、売上は増えて粗利が減る状態になる。損益分岐点の顧客数を超える見込みがあるかを先に確認すること。品質管理工数 (D) を計算に入れるのが要点で、これを忘れると外注の効果が過大に見える。試験発注で実測を取るまでは、外注前提の計画を立てないほうが安全。飲食店で人を入れるタイミングの判断と構造は同じ。","status":"未検証","flow":{"code":"DOC","step":"工程2 / 4","input":"キャパシティ計算の(A)可処分時間と(B)1顧客あたり時間、外注単価、試験発注で実測した品質管理工数","output":"外注あり・なしの1社あたり粗利と、外注が成立する顧客数の分岐点","next":"現在の顧客数が下回るなら外注を入れない。超えてから試験発注に動く"}},{"label":"90日実行計画シート（週単位・ファネル目標つき）","text":"【アプローチ対象の母数（公開情報で実数確認）】\n対象エリア（___区 / ___沿線）と業態（___）: 宿泊施設___軒 / 飲食店___軒（出典: ___／確認日: ___）\n絞り込み条件:\n・広告を出している/出す意思がある: 想定___%（根拠: ___）\n・ADRと規模がパッケージの価格帯に合う: 想定___%\n・連絡先が特定できる: 想定___%\nアプローチ対象件数: ___軒\n\n【2つのリスト】\nリストA（紹介経由の可能性あり）: ___件\n  紹介の依頼先: 取引先___件 / 同業者___件 / 商店会・組合___件 / その他人的つながり___件\nリストB（完全な新規開拓）: ___件\n\n【ファネル目標（90日）】\n            リストA(紹介)      リストB(新規)      合計\nアプローチ:    ___件             ___件           ___件\n反応:          ___件(___%)       ___件(___%)     ___件\n商談:          ___件(___%)       ___件(___%)     ___件\n提案:          ___件(___%)       ___件(___%)     ___件\n受注:          ___件(___%)       ___件(___%)     ___件\n\n受注内訳: 単発___件 / 初期構築+月次___件 / 継続契約___件\n90日後の月商: ___円（うち継続分___円）\n→ キャパシティの壁（___社）の範囲内か: 【はい / いいえ】\n\n【週次計画】（Day2の提案時期カレンダーと整合させる）\n週  | 主な行動                      | アプローチ | 商談 | 提案 | 制作時間 | その他時間\n1   | リスト作成・資料の最終仕上げ   |   0    |  0  |  0  |   ___   |   ___\n2   | 紹介の依頼・リストA着手準備     |  ___   |  0  |  0  |   ___   |   ___\n3   | アプローチ開始（リストA）       |  ___   | ___ |  0  |   ___   |   ___\n4   | 商談・ヒアリング                |  ___   | ___ | ___ |   ___   |   ___\n5   | 提案・リストB着手               |  ___   | ___ | ___ |   ___   |   ___\n6   | ___                             |  ___   | ___ | ___ |   ___   |   ___\n7   | ___（1件目の受注想定・制作開始） |  ___   | ___ | ___ |   ___   |   ___\n8〜13 | ___                           |  ___   | ___ | ___ |   ___   |   ___\n※既存顧客が増えた週は営業時間が減る。その分を織り込む\n\n【週次記録項目（毎週入力）】\n1. アプローチ件数 / 2. 反応件数 / 3. 商談件数 / 4. 提案件数 / 5. 受注件数 / 6. 受注金額\n7. 制作稼働時間 / 8. 営業稼働時間 / 9. 見込み客ごとの累計投入時間（Day4の上限と照合）","note":"完全な新規開拓の歩留まりは、アプローチ100件から受注1〜2件程度と見ておく。これが厳しく見えるのでリストAを分けている。飲食店運営10年で培った取引先・同業の関係は、紹介経由の歩留まりを大きく変える最大の資産。東京は飛び込みが比較にさらされやすいので、紹介の価値はさらに大きい。リストAとBの転換率を別々に記録すると、どちらに時間を配分すべきかが2ヶ月目で判断できるようになる。第7週に1件目の受注を想定しているのは、制作が始まると営業時間が減るという現実を計画に織り込むため。","status":"未検証","flow":{"code":"DOC","step":"工程3 / 4","input":"公開情報で実数確認したエリアの施設軒数と絞り込み条件、紹介経由の可能性がある人的つながり","output":"2リスト別のファネル目標と、週単位の行動量が入った90日計画","next":"毎週の実績を記録し、キャパシティの壁の範囲内かを確認し続ける"}},{"label":"判断基準シート（4層・判定日つき）","text":"【判定日】\n第1判定: ___年___月___日（開始から90日）\n第2判定: ___年___月___日（開始から180日）\n→ カレンダーに登録済み: 【はい / いいえ】\n\n──────────\n【層1：行動量（自分でコントロールできる）】\n基準: 90日でアプローチ___件を実行する\n未達の場合の判断: 撤退ではなく「期間延長して行動量を確保する」\n→ 行動していないのに市場や商品のせいにするのは最も避けるべき誤判断\n\n【層2：反応率（市場の初期シグナル）】\n基準: アプローチに対する反応率 ___%以上\n下回った場合: 対象リストと訴求文を見直す（撤退ではない）\n2回見直して改善しない場合: 対象業種そのものを再検討する\n\n【層3：商談での反応（商品の適合性）】\n基準3-1: 「価格が高い」という反応が___%以下\n  超えた場合: 価格設計または対象施設の規模を見直す\n  逆に全件即決の場合: 価格が安すぎる。値上げを検討\n基準3-2: 商談に至ったが提案に進まないケースが___%以下\n  超えた場合: ヒアリングで数字が取れていない、または課題が映像で動かせない領域にある\n\n【層4：成立性（事業として続けるかの判断）】\n基準4-1: 90日で受注0件 かつ 層1の行動量を達成\n  → 構造的な問題。選択肢: ①対象を変える（宿泊施設以外の業種）②商品を変える（映像以外の提供内容）③事業を止める\n  → 判断の期限: ___年___月___日までに決める\n基準4-2: 180日時点で月の粗利が生活必要額___円の___%未達\n  → 資金的な判断。並行して別の収入源を確保するか、事業を縮小する\n基準4-3: LTV/CAC が 1 を下回り続ける\n  → 顧客を獲得するたびに損をしている状態。価格・継続率・CACのどれかを変えなければ、受注が増えるほど悪化する\n  → 見直す順序: ①継続率（Day4の設計）②受注率（Day3の提案精度）③価格（Day2）\n\n──────────\n【続ける根拠の確認（判定日に必ず見る）】\n・行動量を達成しているか: 【はい / いいえ】\n・反応率が想定範囲内か: 【はい / いいえ】\n・LTV/CAC が改善方向に動いているか: 【はい / いいえ】\n→ 受注が1件でも、上記3つが揃っていればそれは継続の根拠である\n→ 受注が2件あっても、CACがLTVを超えているなら設計を直す必要がある\n\n【記録の運用】\n週次記録を毎週入力する。判定日に数字が揃っていれば、感情ではなく数字で判断できる。\n記録していなければ、判定日に「もう少し続けてみよう」以外の判断ができない。","note":"層1と層4の組み合わせが最も重要。「十分に行動して受注0」と「行動していなくて受注0」は全く違う状態なのに、どちらも同じ結果に見える。行動量を記録していないと、この区別がつかない。このシートは「やめる理由」を探すためではなく、続ける根拠を数字で持つためのもの。受注1件でも行動量と反応率が想定内なら継続の根拠になる、という読み方を最初に決めておくこと。","status":"未検証","flow":{"code":"DOC","step":"工程4 / 4","input":"90日計画のファネル目標値と、生活に必要な月額、Day 4 で出した LTV/CAC 比の計算結果","output":"4層それぞれの判定基準と、カレンダーに登録した第1・第2判定日","next":"判定日に週次記録を見て、感情ではなく数字で継続か見直しかを決める"}}],"expected":"収益モデルがスプレッドシートで動く状態になり、キャパシティの壁（顧客数の上限と月商の上限）が数字で出ています。月商100万円に必要な条件が3通り計算され、それぞれの現実性が判定されています。外注の損益分岐点が品質管理工数を含めて算出され、何社から外注が成立するかが特定されています。アプローチ対象の母数が公開情報の実数で確認され、紹介経由と新規開拓の2リストに分かれています。90日計画が13週分の行動件数と時間配分つきで完成し、判断基準が4層すべてに数値で入り、判定日がカレンダーに登録されています。到達判定は、「6ヶ月後の現実的な月商はいくらで、その根拠は何か」を数字と数式で説明できることです。","assignment":{"title":"【Week 6 総合課題】収益シミュレーションと90日実行計画","brief":"顧客数×単価×継続月数の収益モデルをスプレッドシートで作り、自分の時間が上限になるキャパシティの壁を数式で算出します。月商100万円に必要な条件を単価・所要時間・外注の3通りで計算し、外注の損益分岐点を品質管理工数を含めて出してください。アプローチ対象の母数は推定ではなく公開情報の実数で確認し、紹介経由と新規開拓の2リストに分けてファネル目標を設定します。90日計画は13週分の週単位で作り、Day2の提案時期カレンダーと整合させてください。最後に事業が成立しない場合の判断基準を4層で数値化し、判定日をカレンダーに登録します。根拠のない目標を1つも含めないことが条件です。","deliverables":["収益モデルのスプレッドシート（入力を変えると月商・粗利が動く形）","キャパシティの壁の計算（顧客数の上限・月商の上限・1顧客あたり月次所要時間の内訳）","月商100万円に必要な条件3通りの計算と現実性の判定","外注投入の損益分岐点（品質管理工数を含む）と投入タイミングの判断","アプローチ対象の母数（公開情報の実数・出典と確認日つき）と絞り込み後の件数","リストA（紹介経由）とリストB（新規開拓）、紹介の依頼先一覧","ファネル目標（5段階・リスト別の転換率つき）","90日実行計画（13週・週次の行動件数と時間配分）","週次記録項目（9項目前後）","判断基準シート（4層・数値基準つき・判定日をカレンダーに登録済み）","制作フロー図（受注から納品・改善サイクルまで1枚）","Week 6成果物7点を集約したパッケージ"],"constraints":["すべての目標数値に算出根拠を付け、根拠のない数字を1つも含めない","1顧客あたり月次所要時間はWeek 5とDay1の実測値から積み上げる（推定で膨らませない）","アプローチ対象の母数は推定ではなく公開情報の実数を使い、出典と確認日を記載する","受注目標はキャパシティの壁の範囲内に収める","判定日を具体的な日付でカレンダーに登録する","作業時間は95分以内"]},"success":["収益モデルが数式で組まれ、入力値を変えると月商・粗利・年間売上が自動で動く","キャパシティの壁が (制作可能時間 ÷ 1顧客あたり月次所要時間) として計算され、所要時間が5項目以上の実測内訳から積み上げられている","月商100万円に必要な条件が3通り計算され、外注の損益分岐点が品質管理工数を含めて算出されている","アプローチ対象の母数が公開情報の実数（出典・確認日つき）で確認され、ファネル目標がリストA・B別に設定され受注目標がキャパシティ内に収まっている","90日計画が13週分あり、各週にアプローチ・商談・提案の件数と時間配分が入っている 判断基準が4層すべてに数値で入り、判定日がカレンダーに登録されている"],"rubric":[{"axis":"映像の品質","pass":"3点＝収益モデルの1顧客あたり所要時間に品質チェック工程の時間が含まれている。5点＝品質を落とさずに所要時間を削る手段（テンプレート化・Elements蓄積）が時間数で見積もられている。"},{"axis":"動きの自然さ","pass":"3点＝制作時間の見積に、尺や動きの複雑さによる差が反映されている。5点＝検証用クリエイティブの本数と複雑さを所要時間と連動させ、月次の工数が読める形になっている。"},{"axis":"ブランド整合性","pass":"3点＝Week 6の成果物7点の体裁がCore Bloomとして統一されている。5点＝商談で初見の相手に出しても、7点が一貫した事業の資料として見える水準になっている。"},{"axis":"マーケ目的整合性","pass":"3点＝90日計画のアプローチ先が、Day3のヒアリングで判定した対象条件に合っている。5点＝提案時期カレンダー（Day2）と90日計画が整合し、商談期に行動が集中する設計になっている。"},{"axis":"再現性","pass":"3点＝収益モデルのシートが数式入りで保存され、数値を入れ替えて再計算できる。5点＝実績が入り始めたら週次で更新され、転換率の実測値でモデルが補正される運用になっている。"},{"axis":"時間とコスト","pass":"3点＝キャパシティの壁と外注の損益分岐点が算出されている。5点＝到達可能な月商の上限を把握し、6ヶ月後の目標を根拠つきで設定し、判断基準の判定日まで決めている。"}],"pitfalls":[{"problem":"根拠のない目標（月100万円など）を掲げて、未達の原因が努力不足に見える","cause":"キャパシティの壁を計算していない。顧客数の上限と単価の積が目標に届くかを確認していない","fix":"(制作可能時間 ÷ 1顧客あたり月次所要時間) × 月額 で上限を出す。目標がこの上限を超えているなら、単価・所要時間・外注のどれを変えるかを先に決める。決めずに掲げた目標は設計の失敗であり、努力の問題ではない。"},{"problem":"1顧客あたり月次所要時間を少なく見積もり、受注後に時間が足りなくなる","cause":"レポート作成、打ち合わせ、確認待ちの対応、修正対応を見積に入れていない。制作時間だけを数えている","fix":"Week 5とDay1の実測値から5項目以上で積み上げる。特に修正対応（規定回数分）と打ち合わせ・確認対応は必ず入れる。実測がない項目は多めに置き、3ヶ月後に実測で補正する前提にする。"},{"problem":"外注を「忙しくなったら」で判断して、売上は増えたが粗利が減る","cause":"損益分岐点を計算していない。外注で1社あたり粗利が下がることを織り込んでいない。品質管理工数を計算に入れていない","fix":"外注が成立する顧客数 = 外注なしの月粗利 ÷ 外注ありの1社あたり粗利 を計算する。この社数を超える受注見込みがあるまで外注は入れない。投入前に試験発注で品質管理工数の実測を取る。"},{"problem":"アプローチ対象の母数を推定で進めて、計画の前提が崩れる","cause":"「東京には宿も飲食店も無数にある」という感覚で計画している。実際にエリア・業態・価格帯・連絡先の条件で絞ると、対象が数十軒しかない可能性がある","fix":"対象エリアと業態を先に決め、東京都や区市の統計・旅館業の施設一覧など公開情報で実数を確認し、出典と確認日を記録する。絞り込み後の件数が受注目標に対して少なすぎる場合は、エリアを広げる（隣接区や別の沿線）か、業種を広げる（飲食店・その他の中小事業者）かを判断する。"},{"problem":"90日計画が営業一色になり、受注後に制作時間が確保できない","cause":"受注すると制作が始まり営業時間が減るという現実を計画に織り込んでいない","fix":"週次計画に制作時間とその他時間の列を作り、受注想定週以降は営業時間を減らす。1件目の受注を第7週前後に置いて、以降の週の時間配分を変える。これを織り込まないと、受注した月に新規開拓が完全に止まり、翌月の商談がゼロになる。"},{"problem":"撤退基準を決めたのに判断できない。あるいは行動量不足を市場のせいにして方針転換を繰り返す","cause":"判定日を決めておらず、週次の記録がないため判定日に数字が揃っていない。また層1（行動量）と層4（成立性）を区別しておらず、アプローチ30件の段階で「反応がないから対象を変える」と判断している","fix":"判定日を具体的な日付でカレンダーに登録し、週次記録を9項目で毎週入力する。記録がなければ「もう少し続けてみよう」以外の判断ができない。あわせて、層1の基準（90日でアプローチ___件）を達成するまでは事業の成否を判定しないというルールを明記する。行動量未達時の判断は「期間延長して行動量を確保する」であり、撤退や方針転換ではない。対象や商品を変えるのは、行動量を達成した上で受注0だった場合のみ。"}],"resourceIds":["hf-academy-ad-agency","hf-help-plans","hf-help-credits"],"nextHint":"6週間の課程はここで終わりです。ここからは週次記録を回し、判定日に数字で判断する運用に入ります。実績が入り始めたら、Day2の価格とDay5の収益モデルを実測値で上書きしてください。推測で作った数字が実測に置き換わるほど、提案も価格も強くなります。","setup":{"tag":"生成なし","model":"—（収益シミュレーションと90日計画）","seconds":"—","res":"—","aspect":"—","outputs":"—","cap":"生成なし","credits":"クレジット消費なし","unlimited":"—","save":"ツールの月額とクレジット実費を固定費として計算に入れる。受注がゼロの月にも発生する費用であることを忘れない。"}}]}],"prompts":{"note":"すべてのプロンプトは本環境で生成検証を行っていないため『未検証』です。実際に使用して結果を確認し、自分の環境での採用率と併せて記録してください。モデルや機能の仕様は変更されるため、使用モデルの欄は執筆時点（2026-10-11）の想定です。","slots":["被写体","動作","環境","カメラ","光","質感","スタイル"],"categories":[{"id":"food","label":"料理広告","desc":"飲食店の料理カット。シズル感と食欲喚起が目的。"},{"id":"hotel","label":"宿泊施設広告","desc":"客室・外観・体験。滞在のイメージと信用の獲得が目的。"},{"id":"product","label":"商品広告","desc":"物販・土産物・ドリンク等のパッケージ商品。"},{"id":"cinematic","label":"シネマティック映像","desc":"ブランドの世界観を示す映像的なカット。"},{"id":"camera","label":"カメラワーク","desc":"カメラスロットの差し替え部品。他のプロンプトに組み込んで使う。"},{"id":"light","label":"ライティング","desc":"光スロットの差し替え部品。印象を最も大きく動かす。"},{"id":"hook","label":"広告のフック","desc":"冒頭1〜3秒で視線を止めるための開始カット。"},{"id":"brand","label":"ブランドの世界観","desc":"複数カットのトーンを揃えるための共通指定。"},{"id":"reference","label":"参照画像を使った生成","desc":"一貫性を保つための参照つきワークフロー。"}],"prompts":[{"id":"p-food-01","category":"food","title":"半逆光のラーメン（湯気を主役にする）","purpose":"湯気と汁の照りで食欲を喚起する、飲食店広告の基本カット。","input":"料理の静止画（または料理名）。器と背景の色を先に決めておく。","model":"静止画：Soul 2.0 等 / 動画化：image-to-video（Seedance 2.5 など）","text":"A bowl of miso ramen with chashu, menma and a halved soft-boiled egg, steam rising slowly from the surface, on a dark walnut counter with a softly blurred warm interior behind, medium close-up at a 45-degree angle, 50mm equivalent, shallow depth of field, backlight from behind and slightly above with strong rim light on the steam and a weak soft fill from the front left, glossy broth surface with specular highlights and a matte ceramic bowl, photorealistic with a muted warm grade and slight film grain","effect":"湯気が背後からの光を透過して白く浮き上がり、スープ表面に反射が生まれる。暗い背景で輪郭が分離し、料理が立体的に見える。","caution":"手前が暗く潰れやすいので、フィル光を弱く入れる指定を外さないこと。湯気は動画化したときに不自然に増殖することがあるため、動画側では『subtle』を付けて量を抑える。","status":"未検証","flow":{"code":"T2I","step":"工程1 / 2","input":"新規。何も参照せず文章だけで作る。料理名・器・背景の色を自分の店のものに置き換える","output":"9:16 の静止画1枚。構図・光の方向・器の質感がここで確定する","next":"気に入った1枚を「最も安定するカメラ移動（微速プッシュイン）」に渡して動かす"}},{"id":"p-food-02","category":"food","title":"層を見せる（バーガー・パフェ・ケーキ）","purpose":"積層構造のある料理で、断面と素材の重なりを伝える。","input":"層のある料理。器は低く、背景は無地に近いもの。","model":"静止画生成 → image-to-video","text":"A tall cheeseburger with visible layers of brioche bun, melted cheese, seared patty and fresh lettuce, on a slate plate against a clean dark background, eye-level shot at the height of the burger, 85mm equivalent, shallow depth of field, soft side light from the right with a subtle rim light on the left edge, glossy melted cheese and a matte toasted bun with visible texture, photorealistic food photography, neutral warm grade","effect":"カメラを被写体と同じ高さに置くことで層が重ならずに見える。側光で各層の境界に影が出て、素材の区別がつく。","caution":"俯瞰で撮ると層が完全に潰れる。アングル指定の『eye-level at the height of the subject』を外さないこと。溶けたチーズの伸びは動画で破綻しやすいため、静止画で表現して動きは最小限にする。","status":"未検証","flow":{"code":"T2I","step":"工程1 / 2","input":"新規。層のある料理名と器を置き換える。参照画像は使わない","output":"層の境界が見える静止画1枚。カメラ高さと側光がここで決まる","next":"動画化するなら動きは最小限に。溶けるチーズの伸びは破綻しやすいので静止画で見せ切る"}},{"id":"p-food-03","category":"food","title":"液体を注ぐ（スローモーション）","purpose":"注ぐ・かける・垂らすという動作で、瞬間的な注目を作る。","input":"液体を伴う料理・飲料の静止画。","model":"動画：流体表現に強いモデル（Wan 2.6 など）を優先して試す","text":"Dark soy-based broth being poured in a thin continuous stream into a ceramic bowl, slow motion, the stream stays unbroken and the surface ripples outward in concentric rings, 85mm equivalent, shallow depth of field, backlight catching the falling liquid, no splashing beyond the bowl, photorealistic","effect":"注ぐ動作は視線を強く引きつけ、冒頭フックとして機能しやすい。逆光で液体の流れが光る。","caution":"液体は現在の生成モデルが最も苦手とする表現のひとつ。流れが途中で消える、逆流する、量が増えるといった破綻が頻発する。採用率が低い前提で生成回数を見込むこと。『unbroken』『no splashing beyond the bowl』のような制約を明示すると歩留まりが上がることがある。","status":"未検証","flow":{"code":"I2V","step":"工程2 / 2","input":"すでに作ってある料理の静止画1枚。新しく画像は作らない。流体に強い Wan 2.7 を選ぶ","output":"5秒前後の動画1本。注ぐ動作が主役になる","next":"冒頭フックとして15秒広告の1カット目に使う。破綻率が高いので3回で見切る","where":"生成画面でモデルを選ぶ（image-to-video）","whereNote":"最も安く、Seedance 2.0 系・Kling 3.0・Wan 2.7 なら Unlimited 対象"}},{"id":"p-food-04","category":"food","title":"俯瞰のテーブル全景（品数と価値を伝える）","purpose":"コース全体や品数の多さを一度に伝える。宴会プラン・朝食ビュッフェの訴求に使う。","input":"複数の皿の構成を先に決める（主菜1・副菜3・汁物1など）。","model":"静止画生成 → image-to-video（微速のプルアウト）","text":"A full table setting seen from directly above, one main dish surrounded by small side plates, a bowl of soup and a rice bowl, arranged on a dark wooden table with linen napkins, top-down flat lay, 35mm equivalent, deep focus so every plate is sharp, soft diffused overhead daylight with gentle shadows, varied textures of ceramic, lacquer and linen, photorealistic, restrained natural color grade","effect":"品数と彩りが一目で伝わる。深い被写界深度で全皿が判別できる。","caution":"俯瞰は立体感と湯気が出ないため、単体では食欲喚起が弱い。寄りのカットと組み合わせて使う。実際に提供していない品数・内容を並べると景品表示法上の問題になりうるので、提供内容と一致させること。","status":"未検証","flow":{"code":"T2I","step":"単発","input":"新規。皿の構成（主菜1・副菜3・汁物1など）を先に決めてから書く","output":"真俯瞰の静止画1枚。品数と彩りが一目で伝わる","next":"単体では食欲喚起が弱い。寄りのカットと組み合わせて編集で使う"}},{"id":"p-hotel-01","category":"hotel","title":"ビル反射光の客室（東京・高層階の昼）","purpose":"都市型ホテルの客室を、現実の光条件に忠実に、かつ最も魅力的に見せる。","input":"客室の参照画像（実在施設の場合は必須）。","model":"静止画生成（参照画像つき） → image-to-video","text":"A corner guest room on a high floor with a low bed, white linen bedding and a wide picture window, a sheer curtain drifting slightly, a dense city skyline of mid-rise buildings visible through the window, minimal wooden interior, wide shot at eye level, 24mm equivalent, deep focus, soft daylight entering only through the window as indirect bounce off the glass facade of the building opposite, cool 6000K ambient with no harsh shadows and one warm 2700K table lamp in the corner, matte plaster walls, raw oak floor, soft linen weave, photorealistic architectural photography with restrained contrast","effect":"向かいのビルのガラス面が反射板として働く実際の光条件を再現する。高層階の抜けた光と、室内灯の暖色の対比で画面に奥行きが出る。","caution":"客室は深い被写界深度（deep focus）が必須。背景をぼかすと部屋の広さという最重要情報が失われる。低層階や隣棟が近い部屋では、窓からの採光がこれほど入らない。実在施設の場合、窓からの眺望・階数・家具・設備が実物と異なると優良誤認のリスクがあるため、必ず施設側に確認する。","status":"未検証","flow":{"code":"I2I","step":"工程1 / 2","input":"実在施設なら客室の参照画像を必ず添付する。架空の施設でも、部屋のレイアウトがわかる1枚を渡したほうが安定する","output":"9:16 の静止画1枚。部屋の広さ・窓の位置・窓外の街並み・光の性質がここで確定する","next":"この画像を Kling 3.0 の image-to-video に渡し、カーテンの揺れ程度の微細な動きだけを足す"}},{"id":"p-hotel-02","category":"hotel","title":"夜の色温度コントラスト","purpose":"夜の宿を、カタログ的でない映像にする。","input":"客室またはラウンジの参照画像。","model":"静止画生成 → image-to-video（ごく微速のプッシュイン）","text":"A hotel lounge interior lit only by warm 2700K practical lamps and a single table candle, deep blue 8000K twilight visible through large windows with city lights and the lit windows of surrounding buildings outside, strong color temperature contrast between the warm interior and the cold blue exterior, no overhead ceiling light, soft shadows, wide shot at eye level, 28mm equivalent, deep focus, leather and wool textures, photorealistic, cinematic but restrained grade","effect":"天井照明を明示的に排除することで、宿泊施設の映像にありがちな平板さを避ける。外の街明かりとブルーアワーの青、室内の暖色という色温度差が画の主題になる。","caution":"暖色が強すぎると料理や寝具の色が転ぶ。生成後のカラーグレーディングで補正する前提で撮る。実在しない夜景や設備を出すのは明確な虚偽表示になるため、窓外の眺望も設備も実在するものだけを指定する。","status":"未検証","flow":{"code":"I2I","step":"工程1 / 2","input":"ラウンジまたは客室の参照画像1枚。実在しない眺望や設備を足さないこと","output":"夜の室内の静止画1枚。内外の色温度差が画の主題になる","next":"動画化してごく微速のプッシュインを足す。暖色が強すぎる場合は編集のグレーディングで戻す"}},{"id":"p-hotel-03","category":"hotel","title":"大浴場の湯気（都市型ホテルの浴場）","purpose":"大浴場やサウナという訴求資産を、湯気と光の対比で見せる。","input":"浴場の参照画像。人物を入れる場合は肖像権の同意が必要。","model":"静止画生成 → image-to-video","text":"An indoor hotel bath with a dark stone tub, dense steam rising and drifting slowly to the right, a high horizontal window along the upper wall letting in soft daylight from a narrow gap between buildings, medium wide shot slightly above water level, 35mm equivalent, moderate depth of field, flat soft light with the steam catching a faint backlight from the window, wet dark stone, tiled floor and a still water surface with subtle reflections, photorealistic, cool neutral grade with a slight blue cast","effect":"湯気と、濡れた黒い石・タイルの明度差が画面を作る。動画化すると湯気の流れが主な動きになり、カメラをほぼ固定しても間が持つ。","caution":"湯気は動画化で最も増殖しやすい要素。『drifting slowly』など速度と方向を限定する。人物を含める場合、実在の宿泊客に見える描写は避け、AI生成であることの扱いを含めて施設と事前に合意する。","status":"未検証","flow":{"code":"I2I","step":"工程1 / 2","input":"浴場の参照画像1枚。人物を入れる場合は本人の同意が前提","output":"湯気と濡れた石のコントラストが出た静止画1枚","next":"動画化する。湯気の流れが主な動きになるため、カメラはほぼ固定でも間が持つ"}},{"id":"p-hotel-04","category":"hotel","title":"外観のエスタブリッシングショット","purpose":"冒頭で立地と施設の性格を一瞬で伝える。","input":"外観の参照画像。周辺環境（路地・商店街・大通り・駅からの経路）の情報。","model":"静止画生成 → image-to-video（微速のプッシュインまたは上昇）","text":"The facade of a small urban hotel at dusk, a warm-lit entrance set back from a narrow side street, tiled and concrete exterior walls, neighbouring buildings pressing in on both sides with deep blue twilight in the strip of sky above, wide establishing shot from slightly below eye level, 24mm equivalent, deep focus, ambient blue hour light outside with warm 2700K interior spill from the entrance and ground floor windows, damp asphalt reflecting the entrance light, photorealistic, cinematic wide, muted cool grade","effect":"青い外光と暖色の室内光という、宿の外観で最も信頼されやすい時間帯（ブルーアワー）の条件。路地の入口とエントランスの灯りで、見つけにくい立地を「隠れ家」として反転させられる。","caution":"ドローン風の大きな移動は背景が崩れやすい。微速のプッシュインに留めるのが安全。実在施設の外観を扱う場合、建物の形状や隣接する建物が実物と異なると誤認につながるため、参照画像を使い、生成結果を施設側に確認してもらう。","status":"未検証","flow":{"code":"I2I","step":"工程1 / 2","input":"外観の参照画像1枚と、周辺環境（路地・商店街・大通り・駅からの経路）の情報。建物の形は実物と変えない","output":"ブルーアワーの外観カット1枚。30秒PR動画の冒頭に置く","next":"微速のプッシュインで動画化する。ドローン風の大きな移動は背景が崩れるので避ける"}},{"id":"p-product-01","category":"product","title":"スタジオ商品カット（土産物・加工食品）","purpose":"ECサイト・OTAのプラン画像・チラシに使える清潔な商品カット。","input":"商品の実写画像（パッケージの文字は生成させず合成する前提）。","model":"Marketing Studio の Product Shots（Studio）に相当する機能","text":"A single packaged food product standing upright at the center of a seamless light gray backdrop, product-only composition with generous margin on all sides, straight-on eye-level shot, 85mm equivalent, moderate depth of field with the full product in focus, soft large diffused key light from the upper left and a white bounce from the right, subtle gradient shadow beneath the product, matte paper packaging with a slight sheen on the sealed edge, clean commercial product photography, neutral white balance","effect":"背景が無地で余白があるため、後からテキスト・価格・ロゴを載せやすい。各媒体の入稿サイズへのトリミングにも耐える。","caution":"パッケージの文字は高確率で崩れる。ロゴ・商品名は生成させず、編集工程で実物のデータを合成する。静止画の生成は動画に比べ大幅に安いので、ここで納得いくまで詰めること。","status":"未検証","flow":{"code":"I2I","step":"工程1 / 2","input":"商品の実写画像1枚を参照として渡す。パッケージの文字は生成させない前提","output":"無地背景・余白つきの商品カット1枚。後からテキストを載せられる状態","next":"ロゴと商品名は編集工程で実物のデータを合成する。動かすなら「回り込み」へ"}},{"id":"p-product-02","category":"product","title":"ライフスタイルカット（使用シーン）","purpose":"商品単体ではなく、使われている文脈で価値を伝える。","input":"商品画像と、使用シーンの設定（場所・時間・誰が）。","model":"Marketing Studio の Product Shots（Lifestyle）に相当する機能","text":"A glass bottle of local craft beer placed on a weathered wooden counter by a window on a rooftop terrace, condensation beading on the glass, a blurred skyline of mid-rise buildings in the background, medium close-up at a slight low angle, 85mm equivalent, shallow depth of field, late afternoon warm backlight from the low west sun rimming the bottle with a soft fill from the front, cold wet glass and rough timber grain, photorealistic lifestyle product photography, warm golden grade","effect":"背景のボケで商品が主役として分離しつつ、場所の情報が残る。西日の逆光とビルのシルエットで、東京の夕方という文脈を帯びた商品カットになる。","caution":"背景に実在の建物やランドマークを想起させる要素を入れる場合、実際の景観と大きく異なると誤認につながる。酒類の広告は媒体ごとの規定（年齢表示等）があるため、配信面の規定を事前に確認すること。","status":"未検証","flow":{"code":"I2I","step":"単発","input":"商品の実写画像1枚と、使用シーンの設定（場所・時間・誰が）","output":"背景のボケで商品が分離したライフスタイルカット1枚","next":"ここで完結。広告の中盤カットとして編集に渡す"}},{"id":"p-product-03","category":"product","title":"回り込み（オービット）の商品カット","purpose":"商品の立体形状を短時間で伝える。","input":"背景が単純な商品静止画。","model":"image-to-video。カメラ移動プリセットがある場合はそちらを優先。","text":"Slow orbit around the product, 30 degrees of rotation only, the product stays centered in frame, background remains simple and consistent throughout, constant speed, no cuts","effect":"短い回転でも立体感が伝わる。角度を制限することで破綻率を下げる。","caution":"背景が複雑な構図では、回り込みの途中で背景が別物に変わる。背景が無地のスタジオカットでのみ使う。回転角を明示しないと一周しようとして破綻することがある。","status":"未検証","flow":{"code":"I2V","step":"工程2 / 2","input":"工程1で作った背景が単純な商品静止画1枚。新しく画像は作らない","output":"5秒前後の回り込み動画1本。立体形状が伝わる","next":"ここで完結。背景が複雑な素材には使わない","where":"生成画面でモデルを選ぶ（image-to-video）","whereNote":"最も安く、Seedance 2.0 系・Kling 3.0・Wan 2.7 なら Unlimited 対象"}},{"id":"p-cinematic-01","category":"cinematic","title":"早朝の商店街（ブランドの世界観カット）","purpose":"商品でも施設でもなく、土地の魅力そのものを示すカット。冒頭または締めに使う。","input":"なし（完全生成）。実在の特定の商店街や駅として提示しないこと。","model":"静止画生成 → image-to-video","text":"A quiet shopping street at first light before the shutters open, long shadows from the buildings stretching across the wet asphalt, no people and no cars, wide shot from a low angle looking down the street, 35mm equivalent, deep focus, cold directional sunrise light raking in from the right along the street with the damp road surface reflecting the sky, worn asphalt, tiled shopfronts and dark utility pole silhouettes, photorealistic, cool blue grade with a warm highlight on the upper facades","effect":"人も車も入れないことで静寂が出る。否定語ではなく『quiet』『before the shutters open』『first light』という肯定的な情景描写で無人の状態を指定している。濡れた路面の反射が、東京の朝の固有の光になる。","caution":"特定の商店街や駅の名前を出して提示すると、実際の景観と異なる場合に誤認を招く。イメージ映像であることを明示するか、実在施設の映像と混在させない。","status":"未検証","flow":{"code":"T2I","step":"工程1 / 2","input":"新規。参照画像なし。特定の商店街名・駅名は入れない","output":"無人の早朝の街の静止画1枚。イメージカットとして使う","next":"微速のプッシュインまたはティルトで動画化し、冒頭か締めに置く"}},{"id":"p-cinematic-02","category":"cinematic","title":"手元の所作（人の気配を入れる）","purpose":"顔を映さずに人の存在を感じさせる。肖像権の問題を避けつつ温度を出す。","input":"なし。手だけのカットにする。","model":"静止画生成 → image-to-video","text":"A pair of hands pouring hot tea from an iron kettle into a small ceramic cup, only the hands and forearms are visible, no face in frame, on a dark wooden table, close-up at a slight high angle, 50mm equivalent, shallow depth of field, warm low-key side light from the left with the steam catching the light, rough iron surface and smooth glazed ceramic, photorealistic, warm muted grade","effect":"顔を入れないため肖像の問題が生じにくく、同時に人の気配と所作の温度が出る。宿・飲食どちらでも使える汎用カット。","caution":"手と指は現在の生成モデルが最も破綻しやすい部位。指の本数、関節の向き、持ち方の物理的整合を必ず確認する。破綻した場合は構図を寄せて指を画角から外すか、手の動きを止めた構図にする。","status":"未検証","flow":{"code":"T2I","step":"工程1 / 2","input":"新規。顔を画角に入れない構図で、手元だけを指定する","output":"手元の所作の静止画1枚。人の気配は出るが肖像の問題が生じにくい","next":"動画化する。指の本数と関節の向きを必ず確認し、破綻したら構図を寄せて指を画角から外す"}},{"id":"p-camera-01","category":"camera","title":"最も安定するカメラ移動（微速プッシュイン）","purpose":"破綻率を最小にしながら動きを付ける。迷ったらこれを使う。","input":"任意の静止画。","model":"image-to-video 全般","text":"Slow dolly in toward the subject, subtle and continuous, constant speed, no cuts, no camera shake","effect":"ほとんどの被写体で安定する。『constant speed』『no cuts』を入れることで、途中でのカット挿入や急加速を抑える。","caution":"寄りの構図に対して大きなプッシュインをかけると被写体が破綻する。ショットサイズが寄るほど移動量を小さくする。","status":"未検証","flow":{"code":"I2V","step":"単発","input":"すでにある静止画1枚。どの画にも使える。画像は新しく作らない","output":"指定した静止画が微速で寄っていく動画1本","next":"ここで完結。迷ったらこれを使う。寄りの構図ほど移動量を小さくする","where":"生成画面でモデルを選ぶ（image-to-video）","whereNote":"最も安く、Seedance 2.0 系・Kling 3.0・Wan 2.7 なら Unlimited 対象"}},{"id":"p-camera-02","category":"camera","title":"ショットサイズ4段階（差し替え部品）","purpose":"同一被写体で情報量の異なるカットを作り分ける。","input":"7スロットプロンプトのカメラスロットに挿入する。","model":"静止画生成","text":"WS: wide establishing shot, eye level, 24mm equivalent, deep focus | MS: medium shot, 45-degree angle, 50mm equivalent, moderate depth of field | CU: close-up, 45-degree angle, 85mm equivalent, shallow depth of field | ECU: extreme close-up on surface texture, 100mm equivalent macro look, very shallow depth of field","effect":"引きで状況を説明し、寄りで欲求を喚起する。この4段階を揃えておくと編集で構成を組み替えられる。","caution":"4段階すべてを毎回作る必要はない。15秒広告なら3カット、30秒なら6〜8カットが目安。カット数を先に決めてから生成すること。","status":"未検証","flow":{"code":"SLOT","step":"部品","input":"7スロットプロンプトのカメラスロットに、この4行のどれかを差し込む","output":"それ自体は何も生成しない。差し込んだ先の静止画プロンプトの画角が変わる","next":"他の6スロットを固定したまま、ここだけを入れ替えて比較生成する"}},{"id":"p-camera-03","category":"camera","title":"ティルトアップ（高さ・層を見せる）","purpose":"建物の高さ、料理の層、積み上がったものを下から上へ辿る。","input":"縦方向に情報のある静止画。","model":"image-to-video","text":"Slow tilt up from the base of the subject to the top, constant speed, the camera stays in place and only rotates upward, no cuts","effect":"縦型9:16と相性がよい。縦の画角を使い切れる。","caution":"カメラが移動せず回転のみであることを明示しないと、上方向に移動（ブーム）してしまい、被写体が画面外に出る。","status":"未検証","flow":{"code":"I2V","step":"単発","input":"縦方向に情報のある静止画1枚（建物、層のある料理、積み上げたもの）","output":"下から上へ辿る動画1本。縦型9:16と相性がよい","next":"ここで完結。カメラが移動せず回転のみであることを明示しないと被写体が画面外に出る","where":"生成画面でモデルを選ぶ（image-to-video）","whereNote":"最も安く、Seedance 2.0 系・Kling 3.0・Wan 2.7 なら Unlimited 対象"}},{"id":"p-light-01","category":"light","title":"食品の基本光（半逆光＋弱いフィル）","purpose":"「もっと美味しそうに」という要望に対する最短の操作。","input":"光スロットに挿入する。","model":"静止画生成","text":"Backlight from behind and slightly above the subject, strong rim light on the rising steam, warm 3000K key, soft fill from the front left at low intensity, specular highlights on the liquid surface, dark background for separation","effect":"湯気が透過光で白く浮き、液体表面に反射が出る。シズル感の物理的な正体はこの透過光と反射。","caution":"フィル光を強くしすぎると立体感が失われて順光に近づく。『low intensity』を保つこと。","status":"未検証","flow":{"code":"SLOT","step":"部品","input":"静止画プロンプトの光スロットに差し込む。他のスロットは変えない","output":"それ自体は何も生成しない。差し込んだ先の画の光が変わる","next":"「もっと美味しそうに」という要望に対する最短の操作。食品カットの既定値にする"}},{"id":"p-light-02","category":"light","title":"窓光のみ（宿泊施設の基本光）","purpose":"客室を「現実の部屋」として信用させる。","input":"光スロットに挿入する。","model":"静止画生成","text":"Soft daylight entering only through the window as the single light source, no overhead ceiling light, gentle falloff toward the far side of the room, one warm 2700K practical lamp for contrast, soft shadows","effect":"天井照明を排除することで、不動産広告的な平板さを避けられる。窓光は部屋の方向感を作る。東京では、この窓光の正体は直射ではなく向かいのビルのガラス面や壁からの反射光であることが多い。","caution":"窓から遠い側が暗くなりすぎる場合は、反対側に弱いバウンスを指定する。ただし光源を2つ以上足すと窓光の方向感が消える。隣棟が近い低層階や北向きの部屋では光量が足りないため、その場合は曇天の拡散光として指定したほうが実物に近い。","status":"未検証","flow":{"code":"SLOT","step":"部品","input":"宿泊施設の静止画プロンプトの光スロットに差し込む","output":"それ自体は何も生成しない。室内が現実の部屋として信用される光になる","next":"客室カットの既定値にする。天井照明を排除する記述を外さないこと"}},{"id":"p-light-03","category":"light","title":"高級感を出す（ローキー）","purpose":"「高級感を」という抽象的な要望を物理条件に翻訳する。","input":"光スロットに挿入する。","model":"静止画生成","text":"Low key lighting, a single hard key light from a steep angle, deep shadows occupying most of the frame, dark background, controlled specular highlights on polished surfaces only, no fill light","effect":"暗部の面積とコントラストが高級感の正体。ハイライトを限定することで素材の質が強調される。","caution":"飲食店の訴求では、暗くしすぎると料理の内容が判別できなくなる。価格帯の高い店でのみ有効で、ファミリー層向けの訴求では逆効果になる。ターゲットと合わせて選ぶこと。","status":"未検証","flow":{"code":"SLOT","step":"部品","input":"静止画プロンプトの光スロットに差し込む","output":"それ自体は何も生成しない。暗部の面積が増え、高級感が出る","next":"価格帯の高い店でのみ有効。ファミリー層向けの訴求では逆効果になる"}},{"id":"p-hook-01","category":"hook","title":"動きで止める（注ぐ・切る・湯気）","purpose":"冒頭0.5秒以内に動きを置いてスクロールを止める。","input":"動作のある料理カット。","model":"image-to-video","text":"The action is already in progress at the first frame, hot broth being poured into the bowl, slow motion, the motion fills the center of the frame, no establishing pause before the action starts","effect":"1フレーム目から動きが始まっているため、静止画と誤認されず視線が止まりやすい。","caution":"動画生成では冒頭に静止した数フレームが入ることがある。編集で頭を切り落として、動きの最中から始まるようにする。","status":"未検証","flow":{"code":"I2V","step":"単発","input":"動作の途中を描いた静止画1枚。静止した状態の画ではなく、すでに動きが始まっている画を選ぶ","output":"1フレーム目から動きが始まっている4〜5秒の動画1本","next":"編集で頭の静止部分を切り落としてから広告の冒頭に置く","where":"生成画面でモデルを選ぶ（image-to-video）","whereNote":"最も安く、Seedance 2.0 系・Kling 3.0・Wan 2.7 なら Unlimited 対象"}},{"id":"p-hook-02","category":"hook","title":"意外性で止める（スケール・対比）","purpose":"見慣れない画で0.5〜1秒の注意を得る。","input":"対比のある構図。","model":"静止画生成 → image-to-video","text":"An extreme close-up of raindrops running down a dark glass pane filling the entire frame, then the camera pulls back rapidly to reveal the lit street outside the window behind it, single continuous shot, no cuts","effect":"極端な寄りから引きへの変化は、情報の更新が速く、離脱しにくい。","caution":"1カット内での急激なスケール変化は破綻率が高い。安定しない場合は2カットに分けて編集でつなぐほうが確実。採用率が低い前提で回数を見込む。","status":"未検証","flow":{"code":"I2V","step":"単発","input":"極端な寄りの静止画1枚。ここから引いていく","output":"寄りから引きへ変化する動画1本。破綻率は高い","next":"安定しない場合は2カットに分け、編集でつなぐほうが確実で安い","where":"生成画面でモデルを選ぶ（image-to-video）","whereNote":"最も安く、Seedance 2.0 系・Kling 3.0・Wan 2.7 なら Unlimited 対象"}},{"id":"p-hook-03","category":"hook","title":"音なし視聴前提のフック","purpose":"SNSの既定である音声オフ状態で成立させる。","input":"冒頭カットと、画面に載せる短いテキスト。","model":"静止画生成 → image-to-video ＋ 編集でテキスト合成","text":"Composition leaves the upper third of the vertical frame empty for a text overlay, the subject occupies the lower two thirds, the empty area has a simple dark uniform background so white text remains readable, vertical 9:16","effect":"テキストの居場所を構図段階で確保しておくと、編集でテキストが被写体に被らない。","caution":"テキストは生成させず編集で載せる。生成に文字を含めると崩れる。セーフエリア（上下の UI に隠れる領域）を考慮して、画面端ぎりぎりに配置しない。","status":"未検証","flow":{"code":"SLOT","step":"部品","input":"静止画プロンプトの構図に関する記述として差し込む。これ単体では生成しない","output":"それ自体は何も生成しない。テキストを載せる余白が構図に確保される","next":"テキストは生成させず、編集工程で載せる。セーフエリアを考慮して配置する"}},{"id":"p-brand-01","category":"brand","title":"ブランド共通のスタイル指定（全カットに付与）","purpose":"複数カットのトーンを揃え、同じブランドの映像に見せる。","input":"ブランドガイドで決めた色・コントラスト・質感の方向性。","model":"全生成のスタイルスロットに共通で挿入","text":"Photorealistic, muted natural color grade with slightly lifted shadows, low saturation in the midtones, warm highlights and cool shadows, soft contrast, fine film grain, consistent across all shots","effect":"個々のカットが別の日に撮られたように見えるのを防ぐ。スタイルスロットを共通化するのが最も簡単な統一手段。","caution":"モデルやバージョンを変えるとスタイル指定が同じでもトーンがずれる。1案件内ではモデルを固定すること。最終的な統一は編集工程のカラーグレーディングで行う前提にしておく。","status":"未検証","flow":{"code":"SLOT","step":"部品","input":"1案件のすべての静止画プロンプトのスタイルスロットに、同じ文言で差し込む","output":"それ自体は何も生成しない。カット間のトーンが揃う","next":"1案件内ではモデルを固定する。最終的な統一は編集のカラーグレーディングで担保する"}},{"id":"p-brand-02","category":"brand","title":"禁止事項を含むブランド指定","purpose":"ブランドとして避けたい表現を制作時点で排除する。","input":"顧客と合意した禁止事項。","model":"全生成に共通で挿入","text":"Natural and restrained, no oversaturated colors, no lens flare, no heavy vignette, no artificial-looking gloss, no stock-photo styling, muted palette limited to warm wood tones, off-white and deep charcoal","effect":"色の範囲を明示的に限定すると、ブランドらしさが安定する。","caution":"否定指定は効き方にばらつきがあるため、肯定形の指定（限定した色名を挙げる）と併用する。最終的には生成後のグレーディングで担保する。","status":"未検証","flow":{"code":"SLOT","step":"部品","input":"顧客と合意した禁止事項を反映させ、全生成に共通で差し込む","output":"それ自体は何も生成しない。避けたい表現が出にくくなる","next":"否定指定は効き方にばらつきがあるため、肯定形の色指定と併用する"}},{"id":"p-ref-01","category":"reference","title":"参照画像で場所を固定する","purpose":"同じ客室・同じ店内が、カットごとに別の場所に見えるのを防ぐ。","input":"対象となる場所の参照画像（複数角度あると精度が上がる）。Elements に Location として登録しておく。","model":"参照画像を受け付ける生成機能（スタイル参照 / キャラクター参照 等の参照タグ）","text":"Use the attached reference as the location. Keep the same room layout, the same window position, the same furniture and the same wall and floor materials. Change only the camera angle to a medium shot from the opposite corner. Lighting conditions stay identical to the reference.","effect":"変える要素を1つ（カメラ角度）に限定し、それ以外は参照を維持すると明示することで、場所の同一性が保たれやすい。","caution":"「同じにして」とだけ書くと何を同じにするのか伝わらない。維持する要素を具体的に列挙する。それでも完全な一致は保証されないため、重要な設備（浴室、眺望）は参照を変えて複数回生成し、最も近いものを選ぶ。","status":"未検証","flow":{"code":"I2I","step":"工程1 / 2","input":"対象となる場所の参照画像1枚以上（複数角度あると精度が上がる）。Elements に Location として登録しておく","output":"同じ場所を別角度から見た静止画1枚。レイアウトと素材が維持される","next":"この画像を image-to-video に渡して動かす。重要な設備は複数回生成して最も近いものを選ぶ"}},{"id":"p-ref-02","category":"reference","title":"カット間をつなぐ（終点フレーム→始点フレーム）","purpose":"「前のカットの続き」を作る。専用のワンクリック機能は存在しないため、参照で代替する。","input":"クリップAの最終フレームと、クリップBの先頭フレームの2枚。","model":"始点・終点フレーム指定に対応するモデル（Seedance、Veo 3.1、Wan 2.6 など）","text":"Generate the transition between the two attached frames. The first image is the starting frame and the second image is the ending frame. Motion is continuous and physically plausible, constant speed, no cuts, no additional objects appearing.","effect":"2つのカットの間を補間することで、連続した1つの動きとしてつながる。","caution":"2枚のフレームの差が大きすぎると補間が破綻する。カメラ位置・光・被写体の配置が近い2枚を選ぶこと。Cinema Studio 4.0 の Forward/Backward Extend で動画を前後に延長する方法もある。","status":"未検証","flow":{"code":"I2V","step":"工程2 / 2","input":"2枚のフレーム。クリップAの最終フレームと、クリップBの先頭フレーム。新しく画像は作らない","output":"2枚の間を補間した動画1本。2つのカットが1つの動きとしてつながる","next":"編集でクリップAとBの間に挿入する。2枚の差が大きすぎると破綻するので、近い2枚を選ぶ","where":"生成画面でモデルを選ぶ（image-to-video）","whereNote":"最も安く、Seedance 2.0 系・Kling 3.0・Wan 2.7 なら Unlimited 対象"}},{"id":"p-ref-03","category":"reference","title":"既存の広告から変種を作る","purpose":"映像の構造を固定したまま、訴求メッセージだけを変えた比較検証用の広告を作る。","input":"採用済みの動画広告1本（4〜30秒）と、差し替える要素の画像。","model":"Ad Multiplier に相当する機能","text":"Keep the motion, framing, cut timing and total duration of the reference video exactly as they are. Replace only the on-screen hook text and the closing call to action. The visual content of each shot stays unchanged.","effect":"映像変数を完全に固定したまま、メッセージ変数だけを変えられる。広告テストとして正しい比較が成立する。","caution":"差し替える要素を欲張ると、何が効いたか分からなくなる。1回の検証で変える変数は1つに限定する。フック＋CTAの変更とCTAのみの変更ではクレジット消費が大きく異なるため、検証設計の段階でコストを見積もること。","status":"未検証","flow":{"code":"V2V","step":"単発","input":"すでに採用済みの動画広告1本（4〜30秒）と、差し替える要素の画像。新しく映像は作らない","output":"映像の構造を保ったまま、文言だけが変わった動画1本","next":"配信してA/Bテストにかける。1回の検証で変える変数は1つに限定する","where":"Ads Studio の Ad Multiplier","whereNote":"Unlimited 対象外。常にクレジットを消費する"}}],"flowLegend":[{"code":"T2I","label":"テキスト → 画像","desc":"何も参照せず、文章から新しく静止画を作る"},{"code":"I2I","label":"画像 → 画像","desc":"既存の画像を参照として渡し、新しい静止画を作る"},{"code":"I2V","label":"画像 → 動画","desc":"すでにある静止画を動かして動画にする。画像は新しく作らない"},{"code":"T2V","label":"テキスト → 動画","desc":"画像を経由せず、文章から直接動画を作る"},{"code":"V2V","label":"動画 → 動画","desc":"既存の動画を入力にして、変種や部分修正を作る"},{"code":"SLOT","label":"プロンプト部品","desc":"単体では使わない。他のプロンプトの該当スロットに差し込む"},{"code":"DOC","label":"文書テンプレート","desc":"生成AIに投げるものではなく、自分で埋める書類や表"}]},"resources":{"checkedOn":"2026-10-11","note":"リンクの確認は 2026-10-11 に自動取得で実施。Higgsfield の Academy は無効なスラッグでも404にならずトップが表示されるため、タイトル・モジュール数・所要時間を照合して確認した。UI・機能名・価格は変更されうるため、重要な判断の前には必ず現物を確認すること。","categories":[{"id":"official-course","label":"Higgsfield 公式講座","kind":"official"},{"id":"official-doc","label":"Higgsfield 公式ドキュメント","kind":"official"},{"id":"official-blog","label":"Higgsfield 公式ブログ（更新情報）","kind":"official"},{"id":"official-legal","label":"Higgsfield 規約","kind":"official"},{"id":"craft","label":"映像技術の参考資料","kind":"third-party"},{"id":"industry","label":"飲食・宿泊の映像マーケティング","kind":"third-party"},{"id":"tutorial-3p","label":"第三者のチュートリアル","kind":"third-party"},{"id":"jp-law","label":"日本の法令・公的情報","kind":"public"},{"id":"image-tools","label":"画像生成ツール（Higgsfield以外）","kind":"official"}],"items":[{"id":"hf-academy-top","category":"official-course","title":"Higgsfield Academy（トップ）","provider":"Higgsfield","url":"https://higgsfield.ai/academy","lang":"en","status":"確認済み","checkedOn":"2026-10-11","duration":"—","summary":"公式の学習ハブ。講座のほか、クイズ、ダウンロード可能なスキル・アセット、カメラ移動のプロンプト例46件が置かれている。","useFor":"カメラ移動の語彙を増やしたいとき。Week 1 Day 4 の対照表づくりの参照元として使う。"},{"id":"hf-academy-courses","category":"official-course","title":"Higgsfield Academy 講座一覧","provider":"Higgsfield","url":"https://higgsfield.ai/academy/courses","lang":"en","status":"確認済み","checkedOn":"2026-10-11","duration":"—","summary":"全16講座の一覧。Movie making / UGC & Social Content / Automate & Agents の3分類。ログイン不要で各講座の詳細とシラバスが閲覧できる。","useFor":"新しい講座が追加されていないかを月1回確認する起点。"},{"id":"hf-academy-ad-3step","category":"official-course","title":"The 3-Step Realistic AI Ad Workflow","provider":"Higgsfield Academy","url":"https://higgsfield.ai/academy/courses/ai-ad-3-step","lang":"en","status":"確認済み","checkedOn":"2026-10-11","duration":"16モジュール / 36分（Intermediate）","summary":"商品シート→キャラクター→ロケーションの順に素材を固定し、ショットリストに従って全シーンを生成してコマーシャルを完成させる手順。顔を1枚のキャラクターシートに固定する方法、衣装や小道具の差し替え、ショットリストの作り方を扱う。","useFor":"Week 2〜3 の中核。「素材を先に固定してから撮る」という本カリキュラムの基本方針と同じ構造なので、自分の制作フローと照合しながら視聴する。ショットリストの作り方は Week 3 Day 3 の課題にそのまま使える。"},{"id":"hf-academy-ad-agency","category":"official-course","title":"Build an AI Ad Agency with Claude + Higgsfield","provider":"Higgsfield Academy","url":"https://higgsfield.ai/academy/courses/claude-higgsfield-ai-ad-agency","lang":"en","status":"確認済み","checkedOn":"2026-10-11","duration":"12モジュール / 22分（Beginner）","summary":"ニッチ選定、オファー設計、ポートフォリオ生成、顧客ヒアリングの設計、アウトリーチ、バックオフィス構築、納品のサブスク化、品質管理ゲート、営業サイト、ローンチ、収支の検証までを扱う事業構築の講座。","useFor":"Week 6 と完全に対応する。ただし前提は英語圏の市場なので、東京の宿泊施設・飲食店という日本の市場に翻訳して受け取ること。特に「納品のサブスク化」と「収支の検証」の回は Week 6 Day 4・Day 5 の前に見ておく価値が高い。"},{"id":"hf-academy-brand-visuals","category":"official-course","title":"Build a Brand's Visuals with AI","provider":"Higgsfield Academy","url":"https://higgsfield.ai/academy/courses/brand-visuals-ai","lang":"en","status":"確認済み","checkedOn":"2026-10-11","duration":"9モジュール / 26分（Intermediate）","summary":"1つのブランドについて、商品画像・試着・モーション広告・SNS動画・TVスポット・サイト用画像・パッケージまで、ビジュアル一式を作る流れ。Marketing Studio の使い方が実例で出てくる。","useFor":"Week 2 Day 4 のブランド世界観の統一。1ブランドで何種類の素材が必要になるかの全体像を掴むのに適している。"},{"id":"hf-academy-cinematic-ad-e2e","category":"official-course","title":"Make a Cinematic Ad End-to-End","provider":"Higgsfield Academy","url":"https://higgsfield.ai/academy/courses/cinematic-ad-e2e","lang":"en","status":"確認済み","checkedOn":"2026-10-11","duration":"10モジュール / 46分（Intermediate）","summary":"再利用可能なアセットの構築から、プロンプトのフレームワーク、12シーンの物語、最後のパックショットまで。最終回のテーマは「反復こそが技術である」。","useFor":"Week 3 の30秒PR動画の前に視聴する。複数シーンを一貫した品質で並べるための段取りが具体的に見える。所要46分と長いので2日に分けてよい。"},{"id":"hf-academy-seedance-eval","category":"official-course","title":"How to evaluate AI filmmaking demos","provider":"Higgsfield Academy","url":"https://higgsfield.ai/academy/courses/seedance-25-ai-filmmaking","lang":"en","status":"確認済み","checkedOn":"2026-10-11","duration":"11モジュール / 20分（Beginner）","summary":"AI映像を、カメラの動き・演技・連続性・仕上がりの観点で評価する見方を扱う。作る側ではなく見る側の目を養う内容。","useFor":"Week 1 Day 5 の6軸評価と相性がよい。自分の出力を甘く評価してしまう人は早めに見ておくとよい。"},{"id":"hf-academy-mix-real","category":"official-course","title":"Mix AI with Real Footage","provider":"Higgsfield Academy","url":"https://higgsfield.ai/academy/courses/mix-ai-real-footage","lang":"en","status":"確認済み","checkedOn":"2026-10-11","duration":"10モジュール / 5分（Intermediate）","summary":"実写素材にAI編集を組み合わせる方法。不要物の除去、衣装や背景の変更、高解像度化。","useFor":"実在の宿や店舗を扱う案件で極めて実用的。顧客が既に持っている写真・動画を活かす提案ができるようになる。Week 3・Week 6 の提案の幅が広がる。"},{"id":"hf-academy-vfx","category":"official-course","title":"Add AI VFX to Real Footage","provider":"Higgsfield Academy","url":"https://higgsfield.ai/academy/courses/ai-vfx-real-footage","lang":"en","status":"確認済み","checkedOn":"2026-10-11","duration":"11モジュール / 12分（Advanced）","summary":"スマートフォン等で撮った普通の映像に、映画的なVFXを加える手順。","useFor":"優先度は低い。余力があるときに。"},{"id":"hf-academy-faceless","category":"official-course","title":"Build a Faceless Channel","provider":"Higgsfield Academy","url":"https://higgsfield.ai/academy/courses/faceless-channel","lang":"en","status":"確認済み","checkedOn":"2026-10-11","duration":"7モジュール / 14分（Beginner）","summary":"Claude と Higgsfield をつないで、顔出しなしの動画を台本から生成・パッケージ化するまで。","useFor":"本事業ではSNS運用代行を主軸にしないため優先度は低いが、自社Core Bloomの発信を自動化する際には使える。"},{"id":"hf-academy-blockbuster","category":"official-course","title":"Blockbuster 4K: The AI Filmmaking Pipeline","provider":"Higgsfield Academy","url":"https://higgsfield.ai/academy/courses/blockbuster-4k","lang":"en","status":"確認済み","checkedOn":"2026-10-11","duration":"10モジュール / 40分（Intermediate）","summary":"脚本、アセット制作、ショットごとのプロンプト設計という映画制作のパイプライン全体。","useFor":"広告制作に直結はしないが、カット設計の考え方は転用できる。Week 3 の構成設計で詰まったときに。"},{"id":"hf-help-top","category":"official-doc","title":"Higgsfield ヘルプセンター","provider":"Higgsfield","url":"https://higgsfield.ai/creator-hub/help-center","lang":"en","status":"確認済み","checkedOn":"2026-10-11","duration":"—","summary":"12カテゴリ（Getting Started / Plans / Credits / Billing / Refunds / Integrations / Troubleshooting / Tools / Models / Account / Business / Community）。機能仕様の一次情報としては、マーケティング用のページより正確。","useFor":"機能の仕様で迷ったときの最優先の参照先。マーケページと記述が食い違う場合はこちらを正とする。"},{"id":"hf-help-cinema-studio","category":"official-doc","title":"Cinema Studio の使い方","provider":"Higgsfield ヘルプセンター","url":"https://higgsfield.ai/creator-hub/help-center/tools/how-do-i-use-cinema-studio","lang":"en","status":"確認済み","checkedOn":"2026-10-11","duration":"15分","summary":"Cinema Studio の各バージョン（2.5 / 3.0 / 3.5 / 4.0）の違いと Director's Panel の設定項目。カメラボディ、レンズ、絞り、30以上のカメラ移動プリセット、6種の照明プリセット、50以上のカラーパレット。","useFor":"Week 1 Day 4（カメラ）と Day 5（光）の実機操作。プリセット名を自分のカメラ語彙対照表に転記しておくと、以後の制作が速くなる。"},{"id":"hf-help-marketing-studio","category":"official-doc","title":"Marketing Studio で動画広告を作る","provider":"Higgsfield ヘルプセンター","url":"https://higgsfield.ai/creator-hub/help-center/tools/how-do-i-use-marketing-studio-to-create-video-ads","lang":"en","status":"確認済み","checkedOn":"2026-10-11","duration":"15分","summary":"テンプレート先行型に刷新された Marketing Studio の全体像。Product Shots / Ads / Marketplace / Posters / UGC Videos / Motion / Ref→Video の各カテゴリ、入力方法（商品画像・商品ページURL・参照広告・プロンプト）、動画は最長15秒、バッチ機能なし。","useFor":"Week 2 の商品・料理カットと Week 4 の広告制作で最も使う機能群。先にここを読んでからツールを開くと迷わない。"},{"id":"hf-help-seedance","category":"official-doc","title":"Seedance の使い方とモデル別仕様","provider":"Higgsfield ヘルプセンター","url":"https://higgsfield.ai/creator-hub/help-center/ai-models/how-do-i-use-seedance","lang":"en","status":"確認済み","checkedOn":"2026-10-11","duration":"10分","summary":"Seedance 2.5 / 2.0 / Fast / Mini / Edit の解像度・尺・参照入力数の違い。2.5 は 1080p・4〜30秒、4K に対応するのは 2.0 のみという点が重要。始点終点フレーム指定についても記載。","useFor":"モデル選択の判断基準。マーケティングページの4K表記と食い違うので、こちらの記述を正として覚えること。"},{"id":"hf-help-dop","category":"official-doc","title":"DoP（image-to-video）の使い方","provider":"Higgsfield ヘルプセンター","url":"https://higgsfield.ai/creator-hub/help-center/ai-models/how-do-i-use-dop","lang":"en","status":"確認済み","checkedOn":"2026-10-11","duration":"8分","summary":"画像を起点にプリセット化されたカメラ動作を適用する機能。Basic / Epic / Effects などのカテゴリ、尺は3秒または5秒、シードとステップの指定。テキストからの動画生成はできない。","useFor":"Week 1 Day 4 で、カメラ移動をプロンプトで書く場合とプリセットを使う場合の安定性を比較する際に使う。"},{"id":"hf-help-soul-id","category":"official-doc","title":"Soul ID でキャラクターを固定する","provider":"Higgsfield ヘルプセンター","url":"https://higgsfield.ai/creator-hub/help-center/ai-models/how-do-i-create-and-use-a-soul-id-character","lang":"en","status":"確認済み","checkedOn":"2026-10-11","duration":"10分","summary":"20〜80枚の写真から人物の同一性を学習させる機能。同一人物として認識できる水準であり、ピクセル単位の一致ではない。1つのSoul IDにつき1人。書き出し不可。","useFor":"Week 3 Day 2 の一貫性ワークフロー。人物を使う案件では必須。実在の人物を使う場合は本人の同意が前提になる点に注意。"},{"id":"hf-help-credits","category":"official-doc","title":"何にクレジットが使われるか","provider":"Higgsfield ヘルプセンター","url":"https://higgsfield.ai/creator-hub/help-center/credits/what-uses-my-credits","lang":"en","status":"確認済み","checkedOn":"2026-10-11","duration":"8分","summary":"クレジット消費のルール。Unlimited や無料生成が適用されるのは higgsfield.ai のサイト上のみで、MCP・CLI・Canvas・Supercomputer 経由の生成は常にクレジットを消費する。バッチは各出力が個別に課金。生成失敗はほぼ自動返却。","useFor":"Week 5 Day 4 の原価計算で必読。自動化を進めるほどコスト構造が変わるため、外注・自動化の設計前に必ず確認すること。"},{"id":"hf-help-plans","category":"official-doc","title":"プランの仕組み","provider":"Higgsfield ヘルプセンター","url":"https://higgsfield.ai/creator-hub/help-center/plans/how-do-higgsfield-plans-work","lang":"en","status":"確認済み","checkedOn":"2026-10-11","duration":"8分","summary":"無料枠はクレジットなし・モデル制限あり。サブスクのクレジットは毎サイクルでリセットされ繰り越されない（Enterprise を除く）。アカウントにつき有効なサブスクは1つ。アップグレードは日割り即時。","useFor":"Week 5 Day 4・Week 6 Day 2 の固定費の見積り。繰越不可のため、月内に使い切る前提で制作計画を組む必要がある。"},{"id":"hf-pricing","category":"official-doc","title":"料金ページ","provider":"Higgsfield","url":"https://higgsfield.ai/pricing","lang":"en","status":"未確認","checkedOn":"2026-10-11","duration":"—","summary":"ページはJavaScriptで描画されるため自動取得では本文を確認できなかった。公式ブログ上の記載では Starter $15/月、Plus $49/月（年額$39/月）、Ultra $129/月（年額$99/月）、1ドル=20クレジット。ただしページのメタ情報には別の階層名も含まれており、プラン名は実画面での確認が必要。","useFor":"価格を提案書や原価計算に使う前に、必ずブラウザで開いて現在のプラン名・金額・クレジット数を自分の目
