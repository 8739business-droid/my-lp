ト = $0.05 換算）**\n\n| 操作 | クレジット | 概算USD |\n|---|---|---|\n| Ad Multiplier（フック＋CTA、720p） | 最大140 | 約$7 |\n| Ad Multiplier（CTAのみ、720p） | 最大35 | 約$1.75 |\n| Marketing Studio 動画 15秒 720p | 89.2 | 約$4.46 |\n| Ads Studio 静止画広告 1点 | 4 | $0.20 |\n| Ads Studio 20点バッチ | 80 | $4.00 |\n\nここから出る実務的な結論は明確です。**CTAだけを変える変種は約$1.75**。CTAの文言テストを3通りやっても$5.25です。従来これをやるには編集作業とレンダリングの人件費がかかっていました。一方、フックとCTAを両方変える変種は約$7で、15秒動画を新規に作る$4.46より高くなります。つまり**「新規に作るか変種にするか」はコストだけでは決まらない**。変種を選ぶ理由は安いからではなく、**映像変数が保持されるから**です。比較の厳密さに金を払っている、という理解で使います。\n\nなお数値は「最大」表記であり、実際の消費は条件で変わります。必ず最初の数回で実測し、自分の原価表を作ってください。"},{"heading":"2つのスタジオの使い分け","body":"テストの目的別に使い分けます。公開情報（確認日2026-10-11）に基づく前提は次のとおりです。\n\n- **Ads Studio**（2026-10-01新設）：**静止画広告のみ**。ブランドキット（ロゴ／色／フォント／トーン／訴求軸）を登録でき、商品カタログを取り込み、訴求軸ベースでコンセプトを生成。**1商品あたり最大20案を一括生成**\n- **Marketing Studio**：広告・商品・UGC用。1,500以上のテンプレート。**動画は最長15秒**。**バッチ機能がない**ため、変種は再生成で作る\n- **Ad Multiplier**：Ads Studio 内。既存動画からの変種生成\n\n使い分けの判断は3つです。\n\n1. **文言・訴求軸の方向性を安く広く探るなら、まず静止画**。Ads Studio の20案バッチが80クレジット（$4.00）、1案$0.20です。動画1本を作る前に、どの訴求軸の言い方が反応を取るかを静止画で当たりを付ける。宿泊の場合、静止画広告と動画広告で勝つ訴求軸が一致しないことがあるので、静止画の結果を動画の結論として扱わないこと。あくまで候補の絞り込みです\n2. **動画の新規制作は Marketing Studio、変種は Ad Multiplier**。Marketing Studio にバッチがないため、変種を再生成で量産すると映像変数がぶれます。映像を固定した比較をしたいなら変種生成を使う\n3. **ブランドキットの登録は早い段階でやる**。訴求軸をブランドキットに登録しておくと、静止画の一括生成が訴求軸ベースで回せます。東京の施設なら、平日のビジネス需要向けと週末の観光需要向けでトーンも訴求軸も変わるため、客層ごとに別キットとして扱うほうが混ざらない\n\n注意：Marketing Studio は MCP／Supercomputer からは未対応と公開情報にあります（執筆時点）。自動化を前提にワークフローを組む場合、ここが制約になります。"},{"heading":"テスト本数の上限はコストでなく到達数で決まる","body":"変種が$1.75〜$7で作れるなら、10本でも作れます。しかし**作れる本数とテストできる本数は別物**です。上限を決めるのは制作費ではなく、**配信予算と必要到達数**です。\n\n宿泊予約のコンバージョン率は低く、クリックから予約完了までの間に検討期間が挟まります。仮にクリック率1.5%、クリックから予約完了への遷移率1%とすると、1予約には約6,700インプレッションが必要です。月の配信予算が15万円でCPM1,500円なら、総インプレッションは10万。これを5本に分散すると1本2万インプレッション、予想予約数は**1本あたり3件**です。3件対2件で勝敗を判定するのは、ほぼコイン投げです。\n\nだから実務の順序はこうなります。\n\n1. 配信予算と想定CPMから**総到達数**を出す\n2. 判定に使う指標を、コンバージョンより**上流の指標**に置く（3秒再生率、完視聴率、クリック率）。これらは分母が大きいので、少ない予算でも差が見える\n3. 上流指標で足切りし、**生き残った少数だけを下流指標で評価する**\n4. 同時配信本数は、1本あたりの到達数が上流指標の判定に足りる範囲に抑える。実務では**同時3本程度**が扱いやすい\n\nつまりWeek 4の課題が3本であることには理由があります。5本10本作る能力があっても、判定できないテストを増やすのは原価の無駄です。詳しい判定基準とサンプルサイズの話はd5で扱います。"}],"steps":[{"n":1,"action":"訴求軸を3つに確定して文章化する","detail":"対象施設について、高級感／滞在体験と感情的価値／特定層へのメリットの3軸を、各80字程度の文に書きます。特定層メリットは層を明示し、具体的な設備・運用（朝食の開始時刻、駅からの徒歩分数、大浴場やサウナ、自炊設備、Wi-Fi実効速度など）を1つ以上含めます。確認できない設備は書きません。各軸について「徒歩圏の競合も同じことを言えるか」を1行で書き添えると、競合密度の高い東京で差になる軸がどれかが見えます。","check":"3軸が各80字程度で文章化され、特定層メリットに検証可能な事実が含まれている"},{"n":2,"action":"ターゲットを1つに固定する","detail":"3本の比較で訴求軸の差を取り出すため、ターゲットとCTAを固定します。ターゲットは「平日に泊まる国内の出張客」「首都圏近郊の30〜40代夫婦」「未就学児連れファミリー」などから1つ選び、年齢・同行者・滞在目的・予算感・予約リードタイムを書きます。平日客と週末客は意思決定の基準が別なので、どちらかに固定します。","check":"ターゲットが1つに固定され、5項目の記述がある"},{"n":3,"action":"マトリクスを作って比較対を特定する","detail":"訴求軸3 × ターゲット × CTA の表を作り、今回配信する3セルに印を付けます。残りのセルは次フェーズの候補として残します。動かす変数が1つだけであることを、表の上で確認します。","check":"マトリクスができ、配信する3セルで変動している変数が訴求軸のみであることが確認できる"},{"n":4,"action":"マスター動画を1本作る","detail":"w4d2の冒頭カットに中盤・終盤を足し、8〜15秒のマスター動画を1本完成させます。この1本が映像変数の基準になるため、構図・カット割り・尺・色を記録します。訴求軸は3つのうち最も中立なもの（通常は体験軸）で作ります。","check":"8〜15秒のマスター動画が完成し、構図・カット数・尺・色の記録がある"},{"n":5,"action":"変種のメッセージ差分を書き出す","detail":"マスターの映像構造を1フレームも変えない前提で、訴求軸A・Cのメッセージ差分を書きます。差し替える対象は、冒頭フックの文言／ナレーションのスクリプト／画面内テキスト／CTAの4つのみ。映像に関わる語は一切書きません。","check":"2つの差分表ができ、映像に関する指示が1つも含まれていない"},{"n":6,"action":"Ad Multiplier 相当機能で変種を生成する","detail":"マスター動画（4〜30秒の範囲内）を入力し、フックとCTA、スクリプトを差し替えた変種を2本生成します。入力画像を添える場合は最大20点まで。生成前に消費クレジットの表示を確認し、予算上限を超えないことを確認してから実行します。","check":"変種2本が生成され、各々の消費クレジットが記録されている"},{"n":7,"action":"映像変数が保持されているか検証する","detail":"マスターと変種を並べ、カット数・各カットの尺・構図・カメラ移動・色が一致しているかをフレーム単位で確認します。一致していない箇所があればリスト化します。保持されていない変数があるなら、その変数は比較から外すか、再生成します。","check":"マスターと変種の差分リストができ、意図せず変動した映像変数が特定されている"},{"n":8,"action":"静止画で訴求軸の言い方を広く当たる","detail":"Ads Studio 相当の静止画広告機能で、3つの訴求軸それぞれの言い方を複数案バッチ生成します。1商品（この場合は1施設・1プラン）あたり最大20案。80クレジット（$4.00）前後の想定。静止画の結果は動画の結論とせず、文言候補の絞り込みにのみ使います。","check":"静止画案が生成され、訴求軸ごとに文言候補が2案以上残っている"},{"n":9,"action":"原価表を実測値で作る","detail":"マスター制作、変種2本、静止画バッチの実消費クレジットを記録し、USD換算（1クレジット=$0.05）します。公開情報の「最大」値との差を見て、自分の条件での実費を確定させます。これが見積の根拠になります。","check":"操作別の実消費クレジットとUSD換算が表になり、公開情報の最大値との差が分かる"},{"n":10,"action":"テスト可能本数を到達数から計算する","detail":"配信予算・想定CPM・想定クリック率から総到達数と1本あたり到達数を計算し、3本で上流指標（3秒再生率・クリック率）の判定が可能かを確認します。足りない場合は本数を減らすか期間を延ばします。","check":"1本あたりの到達数見込みが算出され、3本という本数が判定可能であることが数値で確認されている"},{"n":11,"action":"交絡要因を記録する","detail":"テスト期間中に動く可能性のある要因（宿泊料金の変更、OTAのセール、天候、大型イベントや連休、近隣ホテルの新規開業、競合の価格改定、為替とインバウンド需要、OTAの表示順位、他媒体の広告）を列挙し、統制可能なものと不可能なものに分けます。東京では競合の価格改定と新規開業が最も効く交絡要因で、しかも自分では止められません。統制可能なものは期間中は固定するよう顧客に依頼します。","check":"交絡要因が列挙され、統制可／不可の区別と顧客への依頼事項が書かれている"}],"prompts":[{"label":"マスター動画（体験軸・中立ベース）","text":"A quiet city hotel guest room at first light, linen duvet slightly rumpled, steam rising from a cup on the windowsill, sheer curtain moving faintly, a floor-to-ceiling window showing the glass flank of a neighbouring building bouncing soft blue-hour light back into the room, no identifiable skyline and no readable signage outside, slow dolly in from the doorway toward the window, 35mm equivalent, moderate depth of field, cool 6500K reflected daylight from the window as the only key source with one warm 2700K practical lamp on the left, matte plaster walls, pale oak veneer floor, crisp cotton weave, faint condensation on the glass, photorealistic, muted cool grade with a single warm accent, slight film grain","note":"3本の比較の映像基準。意図的に中立な体験軸で作る。高級感に寄せすぎると訴求軸Aとの差が出ず、生活感に寄せすぎると訴求軸Aが成立しない。識別できるスカイラインを描かせないのは、特定の眺望を主張しないため、かつ3本の変種で窓外が映像変数として固定され続けるようにするため。カット数・尺・カメラ移動を記録し、以降の変種では一切変更しない。","status":"未検証","flow":{"code":"I2V","step":"工程1 / 4","input":"w4d2で絞った冒頭カットの静止画1枚をfirst frameに指定し、中盤と終盤を足して1本にまとめる。既存の動画は入力しない","output":"8〜15秒のマスター動画1本。構図・カット割り・尺・色がここで確定し、以降は一切変更しない","next":"同レッスンの「訴求軸差分A（高級感）— 映像は変えずメッセージのみ」（V2V）に入力して変種を作る","where":"生成画面でモデルを選ぶ（image-to-video）","whereNote":"最も安く、Seedance 2.0 系・Kling 3.0・Wan 2.7 なら Unlimited 対象"}},{"label":"訴求軸差分A（高級感）— 映像は変えずメッセージのみ","text":"KEEP IDENTICAL: all motion, framing, cut structure, duration, color grade, location, and on-screen subjects of the master clip. CHANGE ONLY: hook text, voiceover script, on-screen text, CTA. / Hook text (0.0-1.5s): \"Twelve rooms. One quiet street.\" / Voiceover: \"Twelve rooms on a back street in Asakusa. Hand-finished plaster, solid oak, and mornings you can hear. Tokyo, two streets off the crowd.\" / On-screen text (mid): \"12 rooms / private bath\" / CTA (last 2s): \"Check availability — direct only\"","note":"Ad Multiplier 相当機能への指示の書き方。冒頭に「映像変数は一切変えない」ことを明示し、変更対象を4つに限定する。これが変数分離の実行形。客室数や設備は事実のみ記載する（景品表示法上、根拠のない優位性表示は不可）。エリア名は出すが実在ホテル名は出さない。高級感軸は競合も言える内容になりやすいので、「静けさ」のような情緒語ではなく客室数と立地の具体で差を作っている。公開情報では フック＋CTA の変種で最大140クレジット＝約$7。","status":"未検証","flow":{"code":"V2V","step":"工程2 / 4","input":"工程1で完成させたマスター動画1本（4〜30秒）をAd Multiplier相当機能に入力する。映像は作り直さず、フック・ナレーション・画面内テキスト・CTAの4つだけ差し替える","output":"映像が同一でメッセージだけ違う変種動画1本。高級感軸の言い方が1本の形になる","next":"同レッスンの「訴求軸差分C（特定層メリット・未就学児連れ）」（V2V）に同じマスター動画を入力する","where":"Ads Studio の Ad Multiplier","whereNote":"Unlimited 対象外。常にクレジットを消費する"}},{"label":"訴求軸差分C（特定層メリット・未就学児連れ）— 映像は変えずメッセージのみ","text":"KEEP IDENTICAL: all motion, framing, cut structure, duration, color grade, location, and on-screen subjects of the master clip. CHANGE ONLY: hook text, voiceover script, on-screen text, CTA. / Hook text (0.0-1.5s): \"Breakfast at 6:30. Bath in the room.\" / Voiceover: \"Breakfast opens at half six, so you are out before the trains fill up. The bath is in your room, so nobody has to queue in a corridor. Three minutes from the ticket gate, with a cot that is already there.\" / On-screen text (mid): \"breakfast 06:30 / in-room bath / cot included\" / CTA (last 2s): \"Ask on LINE — rooms for 4\"","note":"同じ映像で層別メリットに差し替えた例。駅からの徒歩分数と朝食の開始時刻という、競合と横並びで比較される数値を前面に出している。CTAも LINE に変えているが、この比較では訴求軸だけを動かしたいので、厳密なテストではCTAをマスターと揃える。CTAまで変えるなら、それは訴求軸とCTAの2変数を動かした総当たり案だと記録する。記載した設備・時間・徒歩分数は必ず施設の事実と一致させる。","status":"未検証","flow":{"code":"V2V","step":"工程3 / 4","input":"工程1のマスター動画1本（4〜30秒）を同じく入力する。映像は作り直さない。未就学児連れ向けにメッセージ4点を差し替える","output":"映像が同一の変種動画1本。層別メリットの言い方が3本目として揃う","next":"同レッスンの「CTAのみ差分（最安の変種テスト）」（V2V）へ進み、CTAだけを動かす比較を追加する","where":"生成画面でモデルを選ぶ（image-to-video）","whereNote":"最も安く、Seedance 2.0 系・Kling 3.0・Wan 2.7 なら Unlimited 対象"}},{"label":"CTAのみ差分（最安の変種テスト）","text":"KEEP IDENTICAL: everything in the master clip including hook, voiceover, on-screen text, motion, framing, cut structure, duration and grade. CHANGE ONLY the final 2 seconds CTA. / Variant 1: \"Check availability\" / Variant 2: \"See February rates\" / Variant 3: \"Ask on LINE\"","note":"公開情報では CTAのみの変種で最大35クレジット＝約$1.75。3通りで約$5.25。CTA文言は導線（公式サイト直販／LINE／電話）とセットで決める必要があるため、d4の導線設計と合わせて確定させる。数値（February rates など）を出す場合は実際の料金表と一致させる。閑散月の料金ページに直接着地させるのが、東京の閑散期訴求では摩擦が最も低い。","status":"未検証","flow":{"code":"V2V","step":"工程4 / 4","input":"工程1のマスター動画1本（4〜30秒）を入力し、末尾2秒のCTA文言だけを3通りに差し替える。フックもナレーションも映像も変えない","output":"末尾2秒だけ違う変種3本。CTA1変数のみを動かした最安の比較対が揃う","next":"ここで完結。d4の導線設計とUTM命名に紐づけ、文言ごとの配信URLを決めてから配信する","where":"生成画面でモデルを選ぶ（image-to-video）","whereNote":"最も安く、Seedance 2.0 系・Kling 3.0・Wan 2.7 なら Unlimited 対象"}}],"expected":"マスター動画1本と、映像変数を保持したままメッセージ変数のみを差し替えた変種2本が揃い、マスターと変種のカット数・尺・構図・色の一致がフレーム単位で確認されている状態です。あわせて操作別の実消費クレジット表と、到達数から逆算したテスト可能本数の計算が手元にあれば到達です。","assignment":{"title":"訴求軸マトリクスと、変数を分離した3本の設計・生成","brief":"w4d1の施設について、訴求軸3つ（高級感／滞在体験と感情的価値／特定層へのメリット）を文章化し、ターゲットとCTAを固定したマトリクスを作ります。そのうえでマスター動画を1本作り、Ad Multiplier に相当する機能で映像変数を保持したままメッセージ変数のみを差し替えた変種を2本生成してください。生成後、マスターと変種の映像変数が実際に保持されているかをフレーム単位で検証し、意図せず動いた変数をリスト化します。最後に実消費クレジットから原価表を作り、配信到達数からテスト可能本数を計算します。","deliverables":["訴求軸3つの文章化（各80字程度、特定層メリットは検証可能な事実を含む）","訴求軸 × ターゲット × CTA のマトリクスと、配信3セルの指定","マスター動画1本（8〜15秒、構図・カット数・尺・色の記録つき）","メッセージ差分表2件（映像に関する指示を含まないこと）","変種動画2本と、各々の消費クレジット記録","マスターと変種の映像変数一致検証リスト","操作別の実消費クレジット・USD換算の原価表","到達数からのテスト可能本数の計算","交絡要因リスト（統制可／不可の区別つき）"],"constraints":["3本のうち変動させる変数は訴求軸のみ。ターゲットとCTAは固定する","差分表に映像に関する指示を書かない（映像変数の固定を破らない）","生成実行前に消費クレジットの見込みを確認し、予算上限を事前に決める","記載する設備・時間・料金・客室数は施設の事実と一致させる。根拠のない優位性表示をしない","作業時間は90分以内"]},"success":["配信する3セルにおいて、変動している変数が訴求軸のみであることがマトリクス上で確認できる","差分表に映像に関する指示が1つも含まれていない","マスターと変種のカット数・各カットの尺・構図・カメラ移動・色が一致しているか、不一致箇所がリスト化されている","操作別の実消費クレジットが記録され、公開情報の最大値との差が把握されている","1本あたりの到達数見込みが算出され、3本で上流指標の判定が可能かどうかが数値で判断されている"],"rubric":[{"axis":"映像の品質","pass":"3点＝マスターと変種3本すべてが配信可能な品質。5点＝変種でも破綻が増えておらず、冒頭0.5秒の品質がマスターと同等。"},{"axis":"動きの自然さ","pass":"3点＝変種で動きが崩れていない。5点＝カット間の繋ぎと動きの速度がマスターと一致しており、並べて見ても同一構造と分かる。"},{"axis":"ブランド整合性","pass":"3点＝3本の色とトーンが同一施設のものとして揃っている。5点＝訴求軸が違っても施設の価格帯と世界観が矛盾しない範囲に収まっている。"},{"axis":"マーケ目的整合性","pass":"3点＝訴求軸以外の変数が固定されている。5点＝この比較から得る知見を次にどう使うかが先に書かれており、交絡要因の統制依頼まで用意され、各訴求軸が徒歩圏の競合と差になるかの検討が記録されている。"},{"axis":"再現性","pass":"3点＝差分表とマスターの記録が保存されている。5点＝第三者が同じマスターと差分表から同じ変種を作れる粒度で書かれている。"},{"axis":"時間とコスト","pass":"3点＝実消費クレジットが操作別に記録されている。5点＝変種と新規制作の原価を比較し、どちらを選ぶかの判断基準を自分の数値で言語化できている。"}],"pitfalls":[{"problem":"3本の映像も訴求軸も違い、何が効いたか分からない","cause":"変数を分離せず総当たりで作った","fix":"マトリクスを先に書き、動かす変数が1つであることを表の上で確認する。総当たりで作る場合は「探索目的、知見蓄積には使わない」と明記する。"},{"problem":"変種のつもりが映像まで変わっており、比較が壊れる","cause":"差分指示に映像に関する語が混ざった／生成後の検証をしていない","fix":"差分表から映像に関する語を全削除する。生成後にマスターと並べ、カット数・尺・構図・色をフレーム単位で確認し、不一致があれば再生成する。"},{"problem":"変種が安いと思って本数を増やし、1本あたりの到達数が足りなくなる","cause":"制作コストでテスト本数を決めている","fix":"テスト本数は配信予算と必要到達数から決める。1本あたり到達数が上流指標の判定に足りる範囲（実務では同時3本程度）に抑える。"},{"problem":"静止画テストで勝った訴求軸を、動画の結論として扱ってしまう","cause":"媒体と形式が違えば勝つ訴求軸も変わりうることを無視した","fix":"静止画の結果は文言候補の絞り込みにのみ使い、動画の勝敗は動画の数値で判定する。両方の結果を別の列に記録する。"},{"problem":"クレジット消費が想定を超えて予算を食う","cause":"公開情報の「最大」表記を無視し、見込みを確認せずに実行した","fix":"生成前に消費見込みの表示を確認する。最初の数回で実測して自分の原価表を作り、以降はその実測値で見積る。"},{"problem":"特定層メリットに、確認していない設備や数値を書いてしまう","cause":"訴求を強めたい意図で、施設に確認していない内容を入れた","fix":"差分表の各項目に出典列（顧客確認済／公式サイト記載／未確認）を付ける。駅からの徒歩分数、朝食の開始時刻、大浴場の利用条件は競合比較で前面に出やすいのに未確認のまま書かれがちなので、特に注意する。未確認の項目は配信前に削除するか施設に確認する。"}],"resourceIds":["hf-blog-ad-multiplier","hf-blog-ads-studio","hf-help-marketing-studio","hf-academy-ad-3step","jp-keihyo"],"nextHint":"明日はCTAと予約導線、そして計測です。再生数とビジネス成果は別物であることを、どの指標をどの判断に使うかの対応表として整理します。","setup":{"tag":"Ad Multiplier","model":"元動画 Kling 3.0（1080p）／ 変種は Ad Multiplier（CTAのみ差し替え）","seconds":"5秒","res":"1080p","aspect":"9:16","outputs":"1","cap":"動画2本 ＋ 変種2回","credits":"約 95 cr（$4.76）","unlimited":"約 70 cr（$3.50）","save":"3本を一から作ると映像変数が揃わず、テストとして成立しない。1本作って変種を2つ出せば、映像を完全に固定したまま訴求だけ比較できる。ただし Ad Multiplier は Ads Studio の機能で Unlimited の対象外なので、ここは必ずクレジットを消費する。フックまで変えると1回140クレジットに跳ねるため、まずCTAのみ（最大35クレジット）で試す。"}},{"id":"w4d4","day":4,"title":"CTAと予約導線、計測の設計と限界","subtitle":"再生数は成果ではない。どの指標をどの判断に使うかの対応表を作る","why":"広告運用の経験者が映像制作に入ったときに最も価値を出せるのが、ここです。多くの映像制作者は再生数とエンゲージメントを成果として報告し、顧客は「で、予約は増えたのか」と聞いて会話が止まります。宿泊予約の計測は実際に難しい。検討期間が数十日に及び、スマートフォンで見て後日PCで予約し、OTAに流れた瞬間に計測が切れ、電話予約は追えません。だからアトリビューションは完全には解けません。重要なのは、解けないことを隠さずに、それでも何をもって「効いた」と判断するかの基準を事前に決めて顧客と合意することです。この合意があるかどうかが、継続契約になるか単発で終わるかを分けます。","goals":["CTAの文言と配置を、導線ごとの手数料と計測可能性のトレードオフから選べる","UTMパラメータの命名規約を作り、訴求軸・変種・配信面を事後に判別できる状態にする","コンバージョンを階層で定義し、計測可能なものと不可能なものを棚卸しできる","指標と判断の対応表を作り、再生数を意思決定に使わない運用ができる","アトリビューションが解けない前提で「効いた」と判断する実務基準を3つ以上持てる"],"duration":"85分","timeBreakdown":[{"label":"導線と計測の構造整理","min":30},{"label":"CTA制作とUTM・CV定義の作成","min":30},{"label":"指標対応表とベースライン取得","min":25}],"tools":["Higgsfield（CTA部分の変種生成に相当する機能、文字描画に強い画像モデルでのCTAカード試作）","スプレッドシート（UTM規約・指標対応表・計測シート）","アクセス解析ツール（顧客のサイトに設置されているもの）"],"prereq":["w4d3でマスター動画と変種2本が完成していること","w4d1で予約チャネル構成比と手数料率（または推定レンジ）が記録されていること"],"theory":[{"heading":"導線の選択は手数料と計測可能性のトレードオフ","body":"動画を見た人をどこへ送るかで、手残りと計測精度が同時に変わります。宿泊施設の主要導線を整理します。\n\n| 導線 | 手数料・コスト | 計測の可否 | 離脱リスク |\n|---|---|---|---|\n| 公式サイト直販（予約エンジン） | 予約エンジン手数料＋決済手数料のみ | **計測しやすい**（UTM＋予約完了の計測が可能） | 予約エンジンのUIが弱いと離脱する |\n| OTA | 送客手数料（施設申告の実率を使う） | **ほぼ不可**。遷移した時点で計測が切れる | 低い（UIが洗練されている） |\n| 電話 | 手数料なし | **原則不可**。専用番号かコード提示で代替 | 営業時間と言語の壁 |\n| LINE | 友だち追加は計測可、予約転換は運用次第 | **中間**。追加数は測れるが予約が人力管理になりがち | 追加のハードルは低い |\n| Instagram DM | なし | **弱い**。件数は見えるが広告との紐付けが困る | 低いが対応工数が重い |\n\n実務の判断はこうなります。**計測精度が最も高い導線を主にしてテスト期間を回し、手数料が最も低い導線を事業の本線にする**。この2つはしばしば一致します（どちらも公式サイト直販）。ただし東京のインバウンド客層は OTA からの流入が強く、公式サイトの英語・多言語対応が弱い施設では、直販導線に送っても落ちます。しかもOTA上では同価格帯の競合が同じ画面に並んでいるため、OTAに送った客は比較の只中に置かれます。直販導線は手数料だけでなく、**比較画面を経由させないという意味でも価値があります**。導線の整備状況を確認せずにCTAを「公式サイトへ」にすると、広告の数値が悪いのではなく着地が悪いのに、クリエイティブを作り直す無駄が発生します。\n\n**だからCTAを決める前に、着地ページをスマートフォンで自分で予約完了まで通してみる**。これは15分で終わる作業で、やらないと数週間を無駄にします。"},{"heading":"CTAの文言と配置","body":"CTAには3つの要素があります。**文言／配置／摩擦の低さ**。\n\n**文言**：「予約する」より具体的な行動と得られるものを示す語のほうが機能しやすい、というのは運用者の常識です。宿泊の文脈では3系統あります。\n\n- **即時行動型**：「空室を見る」「2月の料金を見る」。検討初期の人には重い場合がある\n- **情報取得型**：「料金表を見る」「LINEで聞く」。摩擦が低く、リードタイムが長い商材に合う\n- **期限型**：「2月末まで」。使えるのは**実際に期限がある場合のみ**。架空の期限は景品表示法上の問題になりうる\n\n**配置**：終盤に置くのが基本ですが、尺が15秒以内なら**冒頭にも軽いCTAを置く**設計が成立します。音声オフ前提なら画面内テキストが主で、音声CTAは補助です。\n\n**摩擦**：CTAのクリック先が検索フォームの入力から始まるなら、**日付をあらかじめ入れたリンク**を用意します。閑散期訴求なら「2月の空室一覧」に直接着地させる。この一手間でクリックから次の行動への遷移率が変わります。\n\n**言語**：東京の文脈では、CTAの言語が導線の言語と一致している必要があります。英語CTAで日本語のみの予約フォームに着地させるのは、離脱を作る典型です。\n\nCTAだけを変える変種は、公開情報では最大35クレジット＝約$1.75 で作れます（720p）。3通りで約$5.25。**最も安く、最も検証価値が高い変数**なので、ここを先にテストする価値があります。"},{"heading":"UTM命名規約とコンバージョンの階層定義","body":"事後に「どの訴求軸のどの変種が効いたか」を判別するには、**配信前に命名規約を決める**しかありません。後から足すことはできません。\n\n規約の例（小文字・ハイフン区切りで統一、日本語と全角文字は使わない）:\n\n- `utm_source` = 媒体（meta / google / instagram / line）\n- `utm_medium` = 形式（paid-video / paid-image / organic-video）\n- `utm_campaign` = 案件と期間（asakusa-hotelA-2026-02-lowseason）\n- `utm_content` = **訴求軸と変種**（appeal-luxury-v1 / appeal-experience-v1 / appeal-family-v1）\n- `utm_term` = CTA（cta-availability / cta-rates / cta-line）\n\nキャンペーン名にエリア名を入れておくと、同じ顧客で別エリアの施設を扱うときに混ざりません。実在ホテル名は資料に残すとしても、パラメータには施設の識別子（hotelA）を使います。\n\n訴求軸を `utm_content`、CTAを `utm_term` に分けて入れるのが要点です。これで d3 の変数分離がそのまま計測側に対応します。両方を1つのパラメータに詰めると、集計時に分解できません。\n\n**コンバージョンは階層で定義する**。1つだけ定義すると、数が少なすぎて判断できません。\n\n1. **マクロCV**：予約完了（最も価値が高いが、最も少ない）\n2. **ミドルCV**：空室検索の実行、料金ページ到達、LINE友だち追加、問い合わせ送信\n3. **マイクロCV**：着地ページ到達、滞在30秒以上、ギャラリー閲覧\n\nテスト期間が短い、または予算が小さい場合、**ミドルCVを主判定に使い、マクロCVは期間を通した参考値として見る**。この設計を顧客と事前に合意しておかないと、「予約が何件増えたか」だけを問われて答えに窮します。"},{"heading":"宿泊予約の計測はどこで切れるか","body":"正直に構造を把握しておきます。切れる箇所は5つです。\n\n1. **検討期間の長さ**：宿泊は予約リードタイムが長く、数十日に及ぶこともあります（施設ごとに実測が必要）。クッキーの保持期間やプラットフォームのアトリビューション期間を超えると、**動画を見た人の予約が広告の成果として記録されません**。だから広告管理画面のCV数は、実際の寄与より少なく出る傾向があります\n2. **デバイス間**：スマートフォンで動画を見て、後日PCで予約する。ログインベースの紐付けがなければ別人として計測されます\n3. **OTAへの流出**：動画で興味を持ち、施設名で検索し、OTAで予約する。この経路は**計測上は完全に消えます**。しかも手数料が発生するため、事業上は最も損な経路です。東京ではさらに悪いことが起きます。OTAの検索結果に飛んだ客は、自施設の隣に同価格帯の競合が並んだ画面を見ることになり、**自分の広告費で競合に送客する**形になりえます\n4. **電話予約**：追えません。代替手段は、広告専用の電話番号を用意する、または「動画を見た」と伝えると何かがある形にする、予約時に流入経路を聞く運用を入れる\n5. **指名検索の増加**：動画の効果が「施設名での検索増」として現れることがあります。これは広告のCVには計上されませんが、実際には動画が効いています。検索コンソールの指名クエリのインプレッション推移を併せて見る必要があります\n\nこの5つを顧客に先に説明しておくと、報告時に「数字が出ていない」という話にならず、「この経路は測れないので別の見方をします」という会話になります。**計測の限界を先に共有することが、信頼の前提条件**です。"},{"heading":"指標と判断の対応表","body":"再生数は意思決定に使いません。指標ごとに、答えられる問いは1つだけです。\n\n| 指標 | 答えられる問い | 使う判断 |\n|---|---|---|\n| インプレッション | 到達したか | テストの判定可能性（分母が足りているか） |\n| 3秒再生率 | 冒頭が止めたか | **フックの採否**（d2の設計の評価） |\n| 完視聴率 | 尺と構成が持ったか | 尺の短縮、中盤の構成の見直し |\n| クリック率（CTR） | 訴求とCTAが行動を促したか | **訴求軸とCTAの採否** |\n| 着地ページ直帰率 | 広告と着地が一致したか | 着地ページの改善（クリエイティブではない） |\n| ミドルCV率 | 検討に入ったか | **訴求軸の主判定**（分母が確保できる） |\n| マクロCV（予約）件数 | 売上になったか | 期間を通した投資判断（単発の勝敗には使わない） |\n| 予約単価・ADR | 質の高い客が来たか | 訴求軸が価格耐性のある層を引けたかの評価 |\n| RevPAR（期間比較） | 事業が改善したか | 契約更新の判断 |\n| 再生数・いいね | **何も答えない** | 使わない |\n\n**「効いた」と判断する実務基準**は、アトリビューションを解かずに成立するものを3つ使います。\n\n1. **増分で見る**：配信期間と非配信期間を比べ、ミドルCVの増分を見る。配信を止める期間を1〜2週間作るだけで、ベースラインとの差が見えます\n2. **前年同月で取る**：宿泊は季節性が強く前月比はほぼ無意味です。東京では連休とイベントの位置が年によってずれるので、前年同月比を基準にしつつ、前年との違い（価格、競合の価格改定と新規開業、連休の配置、大型イベント、為替）を注記します\n3. **他施策を統制する**：期間中はOTAのセール、料金改定、他媒体の出稿を止めるか固定するよう依頼します。止められない場合は、その事実と解釈の幅を報告に明記します\n\nそして必ず付ける一文：**動画以外の要因（季節、天候、大型イベントや連休、価格、近隣ホテルの新規開業、競合の価格改定、OTAの表示順位、為替とインバウンド需要）が同時に動くため、観測された変化のすべてを動画の効果として扱わない**。"}],"steps":[{"n":1,"action":"着地ページを自分で予約完了まで通す","detail":"対象施設の公式サイトを、スマートフォンで実際に予約完了直前まで操作します。日付入力、人数選択、プラン選択、言語切替、決済手段（クレジットカード以外のキャッシュレス対応を含む）を確認し、詰まった箇所を記録します。英語表示が途中で日本語に戻る箇所があれば、インバウンド訴求の致命的な欠陥です。","check":"予約フローの詰まり箇所がリスト化され、多言語対応の破綻箇所が特定されている"},{"n":2,"action":"導線のトレードオフ表を埋める","detail":"公式直販／OTA／電話／LINE／Instagram DM について、手数料（施設申告値または推定レンジ）、計測可否、離脱リスクを埋めます。そのうえで「テスト期間の主導線」と「事業の本線導線」を別々に指定します。","check":"5導線の表が埋まり、テスト用と事業用の主導線が指定されている"},{"n":3,"action":"CTA文言を3案作る","detail":"即時行動型／情報取得型／期限型から3案作ります。期限型を使う場合は実在する期限であることを施設に確認します。各案について、クリック先URLと着地ページを具体的に指定します。日付を事前入力したリンクを用意できるかも確認します。","check":"CTA3案とそれぞれの着地先URLが確定し、期限型を使う場合は期限の根拠が記録されている"},{"n":4,"action":"CTAのみの変種を生成する","detail":"w4d3のマスター動画に対し、最終2秒のCTAだけを差し替えた変種を作ります。公開情報ではCTAのみの変種が最大35クレジット（約$1.75）。文字が崩れる場合は生成に頼らず、CTAカードは文字描画に強い画像モデルで作ってオーバーレイするか、編集工程で載せます。","check":"CTA3案分の末尾が用意され、文字が崩れていない"},{"n":5,"action":"UTM命名規約を作る","detail":"source / medium / campaign / content / term の5つについて、使用する値の一覧を確定させます。content に訴求軸と変種番号、term にCTAを入れる構造にします。小文字・ハイフン区切りで統一し、日本語・全角・スペースを禁止します。","check":"5パラメータの値一覧が確定し、訴求軸とCTAが別パラメータに分離されている"},{"n":6,"action":"配信するURLを全て生成して一覧にする","detail":"3訴求軸 × 使用CTAの組み合わせ分のURLを作り、一覧表にします。各URLを実際にブラウザで開いて、着地が正しいこととパラメータが欠落していないことを確認します。リンク短縮を使う場合、パラメータが保持されるかを確認します。","check":"配信URL一覧ができ、全URLの着地とパラメータ保持が実機で確認されている"},{"n":7,"action":"コンバージョンを3階層で定義する","detail":"マクロ（予約完了）／ミドル（空室検索実行、料金ページ到達、LINE追加、問い合わせ送信）／マイクロ（着地到達、滞在30秒）を定義し、各々が現状の計測環境で実際に取得できるかを「取得可／設定が必要／不可」で分類します。主判定に使う指標を1つ指定します。","check":"3階層のCV定義ができ、取得可否が分類され、主判定指標が1つ指定されている"},{"n":8,"action":"計測できない経路の代替手段を決める","detail":"電話予約には広告専用番号か口頭ヒアリング、OTA流出には指名検索の推移観測とOTA上の自施設の表示順位の手動観測、デバイス間には期間を長く取る、という代替を割り当てます。代替が用意できない経路は「計測不能」として報告書に明記する前提にします。","check":"計測不能な経路ごとに代替手段か明記方針が決まっている"},{"n":9,"action":"指標と判断の対応表を自分の案件版で作る","detail":"理論ブロックの対応表を、この案件の実際の数値目標を入れて作り直します。各行に「現状値（ベースライン）」「判定に必要な分母」「この指標で決めること」を入れます。再生数の行は「使わない」と明記して残します。","check":"案件版の対応表ができ、各指標にベースライン値と判定用途が入っている"},{"n":10,"action":"ベースライン期間のデータを取得する","detail":"配信前の2〜4週間について、公式サイトのセッション数、ミドルCV数、指名検索のインプレッション、予約件数とADRを記録します。前年同月の同数値も取れるなら取ります。これがないと増分の判断ができません。","check":"配信前ベースラインが期間を明記して記録され、可能な範囲で前年同月の値も揃っている"},{"n":11,"action":"計測の限界を説明する顧客向け文を作る","detail":"検討期間の長さ、デバイス間、OTA流出、電話予約、指名検索の5点について、なぜ測れないかと代わりに何を見るかを300字程度で書きます。これを提案書と報告書の両方に入れる定型文にします。","check":"計測の限界と代替の見方を説明する300字程度の定型文ができている"}],"prompts":[{"label":"CTAカード用の静止画（文字はオーバーレイ前提の背景）","text":"An empty composition for an end card: the dark tiled facade of a small urban hotel at dusk occupying the lower third of a vertical 9:16 frame, the upper two thirds filled with the soft out-of-focus glow of distant city lights against a deep blue sky with no recognisable skyline, no text and no signage anywhere in the frame, static shot, 35mm equivalent, shallow depth of field thrown onto the background lights, single warm 2700K window light at the lower left as the only accent, rain-wet tile texture, photorealistic, cool desaturated grade, high clean negative space in the upper area","note":"CTAの文字を生成させず、載せるための余白を作る背景カット。プロンプトで no text and no signage と書いても文字が出ることはあるため、出たら構図を寄せて画角から外すか再生成する。街明かりを大きくぼかして識別可能なスカイラインを消しているのは、特定の眺望や立地を主張しないため。文字は編集工程で載せる前提。","status":"未検証","flow":{"code":"T2I","step":"単発","input":"新規。テキストのみで生成する。マスター動画や既存カットは入力しない。文字は生成させず、載せるための余白だけを作る","output":"縦9:16の静止画1枚。上部3分の2が文字を判読できる低コントラストの余白になる","next":"編集工程でCTA文字を重ね、変種生成で文字が崩れたときの差し替え用末尾カードとして保持する"}},{"label":"CTAのみ差し替えの指示（最安の変種テスト）","text":"KEEP IDENTICAL: all motion, framing, cut structure, duration, color grade, hook, voiceover and mid-roll on-screen text of the master clip. CHANGE ONLY the final 2 seconds end card text and the spoken CTA line. / Variant 1 (immediate): on-screen \"Check February availability\" / spoken \"See which rooms are open in February.\" / Variant 2 (information): on-screen \"See February rates\" / spoken \"The February rate sheet is on the site.\" / Variant 3 (low friction): on-screen \"Ask on LINE\" / spoken \"Message us on LINE.\"","note":"公開情報ではCTAのみの変種が最大35クレジット＝約$1.75。3通りで約$5.25。文言と着地URLはセットで管理し、UTMの utm_term に cta-availability / cta-rates / cta-line を対応させる。料金に言及する文言は、実際の料金表の公開状況と一致させる。","status":"未検証","flow":{"code":"V2V","step":"単発","input":"w4d3で完成させたマスター動画1本（4〜30秒）と、差し替える3通りのCTA文言。映像は作り直さず、末尾2秒の表示と読み上げだけを変える","output":"末尾2秒だけ違う変種3本。即時・情報・低摩擦の3タイプのCTAが比較できる形になる","next":"文言と着地URLをセットで管理し、utm_termにcta-availability／cta-rates／cta-lineを対応させる","where":"生成画面でモデルを選ぶ（image-to-video）","whereNote":"最も安く、Seedance 2.0 系・Kling 3.0・Wan 2.7 なら Unlimited 対象"}},{"label":"多言語CTAの差分（映像は固定、言語のみ変更）","text":"KEEP IDENTICAL: all motion, framing, cut structure, duration, color grade and on-screen subjects of the master clip. CHANGE ONLY the language of the hook text, the voiceover script and the end card CTA. / Japanese: hook \"2月の東京に、泊まる理由\" / CTA \"2月の空室を見る\" / English: hook \"A reason to stay in February\" / CTA \"Check February availability\" / Traditional Chinese: hook per approved translation / CTA per approved translation","note":"言語だけを変えた変種。映像変数を固定するという原則がそのまま多言語展開に使える。東京は週末のインバウンド比率が高く、エリアによって主要言語が変わるため、この使い方の価値が大きい。中国語・韓国語などは必ず人による監修を通す（生成された訳をそのまま配信しない）。着地ページがその言語で予約完了まで通ることを確認してから配信する。","status":"未検証","flow":{"code":"V2V","step":"単発","input":"w4d3で完成させたマスター動画1本（4〜30秒）と、人による監修を通した各言語の訳文。映像は固定し、フックとナレーションとCTAの言語だけを変える","output":"映像が同一で言語だけ違う変種。日本語・英語・繁体字の3本が同一仕様で揃う","next":"各言語の着地ページが予約完了まで通ることを自分で確認したうえで、言語別に配信面へ割り当てる","where":"生成画面でモデルを選ぶ（image-to-video）","whereNote":"最も安く、Seedance 2.0 系・Kling 3.0・Wan 2.7 なら Unlimited 対象"}}],"expected":"CTA3案と対応する着地URL、UTM命名規約、3階層のCV定義、案件版の指標・判断対応表、配信前ベースラインのデータが揃っている状態です。あわせて計測の限界を説明する定型文ができ、着地ページを自分で予約完了直前まで通した記録があれば到達です。","assignment":{"title":"予約導線とCTA、計測設計の確定","brief":"w4d3の3本を配信するための導線と計測を設計します。まず対象施設の公式サイトを自分のスマートフォンで予約完了直前まで操作し、詰まり箇所と多言語対応の破綻を記録してください。そのうえでCTA3案を作り、UTM命名規約を確定させ、配信する全URLを生成して実機で着地を確認します。コンバージョンを3階層で定義し、現状の計測環境で取得できるかを分類し、主判定に使う指標を1つ指定します。最後に配信前ベースラインを記録し、計測の限界を説明する顧客向け定型文を作ります。","deliverables":["着地ページの予約フロー確認記録（詰まり箇所・多言語破綻箇所）","5導線のトレードオフ表（手数料・計測可否・離脱リスク）とテスト用／事業用主導線の指定","CTA3案と着地URL（期限型を使う場合は根拠の記録）","CTA差し替え版の末尾カット3案（文字が崩れていないこと）","UTM命名規約と配信URL一覧（実機確認済み）","3階層のCV定義と取得可否分類、主判定指標の指定","計測不能経路ごとの代替手段","案件版の指標・判断対応表（ベースライン値つき）","配信前ベースラインデータ（2〜4週間、可能なら前年同月）","計測の限界を説明する顧客向け定型文（300字程度）"],"constraints":["UTMは小文字・ハイフン区切り。訴求軸とCTAを別パラメータに分ける","全配信URLを実機で開いて着地とパラメータ保持を確認する","期限型CTAは実在する期限のみ使用する。架空の期限は使わない","多言語CTAを使う場合、着地ページがその言語で予約完了まで通ることを確認する","対応表に再生数・いいねの行を残し、「使わない」と明記する","作業時間は90分以内"]},"success":["着地ページを実機で予約完了直前まで通した記録があり、詰まり箇所が特定されている","UTMの utm_content に訴求軸、utm_term にCTAが分離して入っており、全URLの着地が実機確認されている","CVが3階層で定義され、各々に取得可／設定が必要／不可の分類が付いている","指標と判断の対応表に、各指標のベースライン値と判定用途が入っており、再生数が「使わない」と明記されている","計測不能な経路（OTA流出・電話・デバイス間）に対して代替手段か明記方針が決まっている"],"rubric":[{"axis":"映像の品質","pass":"3点＝CTA末尾カットの文字が読める。5点＝末尾カットが本編と同一トーンで、文字のコントラストがスマートフォン実機で確保されている。"},{"axis":"動きの自然さ","pass":"3点＝CTA差し替えによって末尾の動きが破綻していない。5点＝CTA挿入のタイミングが映像のリズムと合い、最後のカットが唐突に切れていない。"},{"axis":"ブランド整合性","pass":"3点＝CTAの言葉遣いが施設のトーンと矛盾しない。5点＝価格帯に見合った語（煽らない、値引きを前面に出さない）が選ばれている。"},{"axis":"マーケ目的整合性","pass":"3点＝CTAの着地が訴求内容と一致している。5点＝テスト用の主導線と事業用の本線導線が区別され、主判定指標が分母の確保可能性から選ばれている。"},{"axis":"再現性","pass":"3点＝UTM規約が文書化されている。5点＝第三者が規約だけを見て新しい配信URLを正しく作れ、集計時に訴求軸とCTAを分解できる。"},{"axis":"時間とコスト","pass":"3点＝CTA変種の実消費クレジットが記録されている。5点＝CTA差し替えの原価（約$1.75／本の公開値に対する実測）から、CTAテストの投資判断ができている。"}],"pitfalls":[{"problem":"数字が出ないのでクリエイティブを作り直したが、原因は着地ページだった","cause":"配信前に着地ページを自分で通していない","fix":"CTAを決める前に、スマートフォンで予約完了直前まで操作する。直帰率とクリック後の遷移率を見れば、クリエイティブと着地のどちらが原因かは分離できる。"},{"problem":"集計時に訴求軸とCTAのどちらが効いたか分解できない","cause":"UTMの1パラメータに複数の情報を詰め込んだ","fix":"utm_content に訴求軸と変種、utm_term にCTAを入れる構造に分ける。配信後に規約を変更すると過去データと繋がらないため、配信前に確定させる。"},{"problem":"再生数とエンゲージメントを成果として報告し、会話が止まる","cause":"指標と判断の対応を決めていない","fix":"対応表を先に作り、再生数の行に「使わない」と書く。報告はミドルCVの増分と期間比較を主軸に構成する。"},{"problem":"予約が増えたか分からず、動画の効果を説明できない","cause":"配信前ベースラインを取っていない","fix":"配信開始の2〜4週間前からセッション・ミドルCV・指名検索・予約件数を記録する。前年同月も取る。取れていない場合は、配信開始を遅らせてベースラインを作る。"},{"problem":"英語CTAで日本語のみのフォームに着地させ、クリックが予約にならない","cause":"導線の言語整合を確認していない","fix":"多言語CTAを配信する前に、その言語で予約完了まで通す。通らない場合はCTAを情報取得型（LINE・問い合わせ）に落とすか、言語別配信を止める。"},{"problem":"観測された予約増をすべて動画の成果として報告し、翌月に説明できなくなる","cause":"交絡要因の留保を書いていない","fix":"報告書に、季節・天候・大型イベントや連休・価格・近隣ホテルの新規開業・競合の価格改定・OTA表示順位・為替が同時に動く旨の留保を定型文として入れる。期間中に動いた要因は実際に記録して併記する。"}],"resourceIds":["hf-blog-ad-multiplier","hf-academy-ad-agency","jp-keihyo","jp-stealth"],"nextHint":"最終日は課題の仕上げです。3本を完成させ、テスト計画書と成果計測シートを埋めます。サンプルサイズが足りないまま勝敗を決めることの危険性もここで扱います。","setup":{"tag":"生成なし","model":"—（計測設計。UTM・CV定義・導線の実機確認）","seconds":"—","res":"—","aspect":"—","outputs":"—","cap":"生成なし","credits":"クレジット消費なし","unlimited":"—","save":"計測設計に費用はかからない。これを作らないまま配信すると、使ったクレジットのすべてが判断材料にならなくなる。"}},{"id":"w4d5","day":5,"title":"3本の仕上げとテスト計画の確定","subtitle":"判断基準と判断日を先に決める。足りない分母で勝敗を決めないために","why":"広告運用の現場で最も多い事故は、数が足りていないデータで勝者を決め、負けたほうを止めてしまうことです。クリック率5%対3%という差を見ると勝ったように見えますが、分母が200なら偶然の範囲です。この誤判定が怖いのは、間違った知見が蓄積して以降の判断すべてを汚染するからです。宿泊予約はコンバージョン率が低く検討期間も長いため、この問題が最も起きやすい領域です。今日は3本を仕上げると同時に、判断基準と判断日を配信前に文書化します。先に決めておくことだけが、数値を見てから基準を動かしてしまう人間の性質に対する唯一の防御です。","goals":["訴求軸違いの広告動画3本を、配信可能な形式で書き出せる","仮説・変数・配信期間・必要到達数・判断基準・判断日を含むテスト計画書を完成させられる","判定に必要な分母を概算し、足りない場合の対処（期間延長・本数削減・上流指標への切替）を選べる","成果計測シートを列設計から作り、配信後に埋めるだけの状態にできる","動画以外の交絡要因を記録する枠を計画書に組み込める"],"duration":"90分","timeBreakdown":[{"label":"判断基準とサンプルサイズの設計","min":15},{"label":"3本の仕上げと書き出し","min":50},{"label":"テスト計画書と計測シートの完成","min":25}],"tools":["Higgsfield（変種生成と末尾CTAの差し替えに相当する機能）","動画編集ツール（テキストオーバーレイ、書き出し）","スプレッドシート（テスト計画書・成果計測シート）"],"prereq":["w4d3でマスター動画と変種2本が生成済みであること","w4d4でCTA・UTM規約・CV定義・ベースラインが確定していること"],"theory":[{"heading":"テスト計画書は6項目で足りる","body":"配信前に埋める項目は6つです。これ以上増やすと誰も書かなくなります。\n\n1. **仮説**：「誰に、何を言うと、何が起きると考えるか」を1文で。「未就学児連れの首都圏世帯に対して、朝食6時半開始と客室内入浴を前面に出すと、高級感訴求よりも料金ページ到達率が高くなる」。**反証可能な形**であることが条件です。「高級感を伝える」は仮説ではありません\n2. **変数**：動かす変数を1つだけ書き、固定する変数を列挙します。d3のマトリクスをそのまま転記します\n3. **配信期間**：開始日と終了日。宿泊の場合、**予約リードタイムの長さを考慮して最低2週間、できれば4週間**。東京は曜日で客層が入れ替わるので、週末を少なくとも2回含む期間にします。1週間では検討期間の中にいる人が行動を完了しません\n4. **必要到達数**：主判定指標が判断に足る分母を確保できるインプレッション数。次節で概算します\n5. **判断基準**：「どの指標が、どれだけ違えば、何をするか」。「料金ページ到達率が相対で30%以上違えば、低いほうを停止し、高いほうの変種を作る。30%未満なら両方継続して期間を延ばす」\n6. **判断日**：具体的な日付。**この日まで数値を見て判断を変えない**と決めます\n\n6番目が最も守られません。3日目に数値を見て良さそうなほうに寄せたくなりますが、初期の数値は配信の学習フェーズの影響を受けており、最終的な順位と一致しないことが普通です。判断日を顧客にも共有し、中間報告は「経過の共有であり判断ではない」と明示します。"},{"heading":"分母が足りないまま勝敗を決める危険","body":"これが今日の最重要項目です。\n\nクリック率2.0%対1.5%という結果を見たとき、差が本物かどうかは分母で決まります。各群の表示回数が1,000ずつなら、クリックは20件と15件。この差は偶然で簡単に起きます。感覚的な目安として、**比率の差を判定するには各群で数十件以上のイベントが欲しい**。クリック率1.5%前後なら、各群で数千〜1万インプレッションの規模が必要になります。\n\n下流に行くほど厳しくなります。宿泊予約のコンバージョン率が仮に0.3%なら、各群で予約10件を集めるのに3,300クリックが必要で、クリック率1.5%なら22万インプレッション。3本に分けるなら総計66万。月15万円でCPM1,500円なら到達は10万程度なので、**予約件数で訴求軸の勝敗を判定することは、この予算規模では不可能**です。\n\nここから出る実務的な結論は3つです。\n\n- **主判定は上流指標に置く**。3秒再生率とクリック率は分母がインプレッションなので、数千規模で傾向が見えます。ミドルCV（料金ページ到達、空室検索実行）はその次\n- **マクロCV（予約）は勝敗判定に使わず、期間全体の投資判断に使う**。3本合計の予約件数とRevPARの推移で、この施策を続けるかを判断する\n- **差が小さいときは「差がなかった」と報告する**。これが一番難しく、一番価値があります。わずかな差を勝者として報告すると、次のテストの前提が間違ったまま積み上がります\n\n顧客に説明する言い方：「この予算規模では、予約件数での勝敗判定はできません。到達と反応の指標で絞り込み、予約は3本合計で見ます」。これを配信前に言えるかどうかが、3か月後の関係を決めます。"},{"heading":"成果計測シートの列設計","body":"配信後に埋めるだけの状態にしておきます。列は4グループに分けます。\n\n**A. 識別**\n- 日付／施設名／キャンペーン名／訴求軸（utm_content）／CTA（utm_term）／配信面（utm_source・medium）／言語／縦横比・尺\n\n**B. 配信実績**\n- 消費金額／インプレッション／3秒再生／完視聴／クリック／CPM／3秒再生率／完視聴率／CTR／CPC\n\n**C. サイト側**\n- セッション／直帰率／マイクロCV（着地到達・滞在30秒）／ミドルCV（料金ページ到達・空室検索・LINE追加・問い合わせ）／マクロCV（予約完了）／予約金額／ADR\n\n**D. 文脈と制作原価**\n- 期間中の料金改定の有無／OTAセールの有無／競合の価格改定と新規開業／大型イベントと連休の有無／天候の特記／為替の特記／OTA上の自施設の表示順位／他媒体の出稿有無／**制作に要した生成回数・消費クレジット・USD換算・制作時間**\n\nDグループが要点です。これがないと、翌月に「先月は良かったのに今月は悪い」という会話で終わります。制作原価の列を同じシートに置くのは、**クリエイティブ1本あたりの原価と、それが生んだ反応を同じ行で見られるようにする**ためです。\n\n行は「日 × 変種」で持ちます。日次で持っておけば後から週次に集約できますが、週次でしか持っていないと日次には戻れません。計測不能な項目（電話予約、OTA流出）は列を作って**空欄ではなく「計測不能」と記入**します。空欄は「ゼロ」と誤読されます。"},{"heading":"動画以外の要因を記録する枠を先に作る","body":"テスト期間中に動く要因を、計画書の中に記録枠として持ちます。配信後に思い出して書くことはできません。\n\n**統制を依頼できるもの**（顧客に止めてもらう／固定してもらう）\n- 宿泊料金の改定、プランの追加・削除\n- OTAのセール参加、タイムセールへの出稿\n- 他媒体での広告出稿\n- 公式サイトの改修、予約エンジンの変更\n\n**統制できないが記録できるもの**\n- 天候（東京では**週単位で需要が動く**。長雨や猛暑が街歩き目的の需要に直結する）\n- 大型イベントと連休の配置（ドーム公演、展示会、国際会議、祝日の並びで、特定の週だけ需要が跳ねる）\n- 為替（インバウンド需要に効く。円安局面と円高局面で反応が変わりうる）\n- **近隣ホテルの新規開業**（東京では供給が増え続けており、徒歩圏に1軒開業するだけで競合の密度と価格の分布が変わる）\n- **競合施設の価格改定**（同価格帯が横並びで表示される環境では、1軒の値下げが自施設のクリック率に効く）\n- OTA内での自施設の表示順位（手動で定期観測する）\n- 交通の運行状況、航空便の増減\n- 国際的な旅行需要の変動\n\n実務的な進め方は、**配信期間中に週1回、この項目を5分で埋める**ことです。5分の積み重ねが、報告時の説明力になります。「2月第2週にミドルCVが落ちていますが、この週は近隣に1軒が開業して開業記念の価格を出しており、同時期にOTA側で競合3施設が値下げしています」と言える制作者は、「数字が落ちました」と言う制作者と全く違う評価を受けます。\n\nそして、**統制できなかった要因があることは、テストの失敗ではありません**。失敗なのは、それを記録せずに動画の効果として断定することです。"},{"heading":"顧客に渡す1枚の体裁","body":"テスト計画書は社内資料ですが、顧客に渡す1枚は別に作ります。載せる内容は5つです。\n\n1. **何を試すか**：3本の訴求軸を各1行で。映像は同一であることを明記（「同じ映像で、言っていることだけを3通りに変えています」）。これは顧客にとって新鮮な話で、**制作手法そのものが提案の価値になる**\n2. **何を測るか**：主判定指標1つと、参考指標。測れないもの（電話予約、OTA流出）も明記\n3. **いつ判断するか**：判断日と、その日まで判断を変えない旨\n4. **何が起きたら何をするか**：判断基準を数値で。「料金ページ到達率が相対30%以上違えば低いほうを停止」\n5. **動画以外の要因**：季節・天候・大型イベントや連休・価格・近隣ホテルの新規開業・競合の価格改定・OTA表示順位・為替が同時に動くため、変化のすべてを動画の効果としては扱わないという留保。そして統制をお願いする項目（期間中の料金改定とOTAセールを止める）\n\n5番目を自分から書くことに抵抗があるかもしれません。成果を小さく見せるようで怖い。しかし逆です。**効果を断定する制作者は、翌月に数字が落ちたときに説明できず、その時点で契約が終わります**。最初から要因の多さを前提に置いて、検証の設計で応える姿勢を示したほうが、長く続きます。Week 6で扱う継続契約と単価の話は、ここでの態度の延長線上にあります。"}],"steps":[{"n":1,"action":"判断基準と判断日を先に書く","detail":"3本の仕上げに入る前に、主判定指標・差の閾値・判断日を文書に書きます。順番が重要です。映像を作ってから基準を決めると、手応えのある本に有利な基準を無意識に選びます。閾値は相対差（例：相対30%以上）で書きます。","check":"主判定指標・閾値・判断日が、3本の仕上げ着手前に文書化されている"},{"n":2,"action":"必要到達数を概算する","detail":"主判定指標の想定値（例：クリック率1.5%）から、各群で数十件のイベントを得るのに必要なインプレッションを概算し、3本分の総到達数を出します。配信予算と想定CPMから実際の到達見込みを出し、足りるかを確認します。","check":"必要到達数と到達見込みが数値で並び、足りる／足りないの判断が記録されている"},{"n":3,"action":"足りない場合の対処を1つ選ぶ","detail":"期間を延ばす／本数を3から2に減らす／主判定をより上流の指標（3秒再生率）に切り替える／予算を増やす交渉をする、のいずれかを選び、理由を1行で書きます。「足りないまま3本出す」は選択肢に含めません。","check":"対処が1つ選ばれ、理由が書かれている"},{"n":4,"action":"3本を同一仕様で仕上げる","detail":"マスターと変種2本に、w4d4で確定したCTA末尾とテキストオーバーレイを載せ、3本を同一の縦横比・尺・音量で書き出します。3本の映像変数が一致していることを、書き出し後にもう一度フレーム単位で確認します。","check":"3本が同一仕様で書き出され、書き出し後も映像変数の一致が確認されている"},{"n":5,"action":"テキストと数値の事実確認を通す","detail":"3本に含まれる全テキスト（フック、画面内テキスト、CTA、ナレーション）について、施設の事実と一致するかを1項目ずつ確認します。設備・時間・料金・客室数・優位性の表現を対象にし、根拠が確認できない項目は削除します。期限表示は実在の期限のみ。","check":"全テキスト項目に確認済みの印が付き、根拠のない記述が1つも残っていない"},{"n":6,"action":"AI生成であることの扱いを確認する","detail":"AI生成映像を広告として使う際の表示について、顧客と方針を確認します。実在しない客室・設備・景観を実写と誤認させる表現は避け、イメージである旨の表記が必要かを判断します。第三者の体験談風の構成を使う場合は、広告であることの明示が必要です。","check":"AI生成表記と広告明示の方針が顧客と合意され、必要な表記が3本に反映されている"},{"n":7,"action":"配信URLを3本に紐づける","detail":"w4d4で作ったUTM付きURLを、3本それぞれに割り当てた表を作ります。utm_content の値が訴求軸と1対1で対応し、utm_term が固定されていることを確認します（訴求軸だけを動かす設計のため）。","check":"3本とURLの対応表ができ、utm_content のみが変動している"},{"n":8,"action":"テスト計画書を完成させる","detail":"仮説・変数（動かす1つと固定する一覧）・配信期間・必要到達数・判断基準・判断日の6項目を埋めます。仮説が反証可能な形になっているかを読み返し、「伝える」「訴求する」で終わっている文は書き直します。","check":"6項目すべてが埋まり、仮説が反証可能な1文になっている"},{"n":9,"action":"成果計測シートを列設計から作る","detail":"A識別／B配信実績／Cサイト側／D文脈と制作原価の4グループで列を作り、行は「日 × 変種」で持ちます。計測不能な項目は列を作って「計測不能」と記入します。制作原価の列に、今週の実消費クレジットとUSD換算、制作時間を入れておきます。","check":"4グループの列が揃い、計測不能項目が空欄でなく明記され、制作原価が入力済み"},{"n":10,"action":"交絡要因の週次記録枠を作る","detail":"統制依頼項目（料金改定、OTAセール、他媒体出稿、サイト改修）と、記録のみの項目（天候、大型イベントと連休、為替、近隣ホテルの新規開業、競合の価格改定、OTA表示順位）を行に持つ週次シートを作ります。配信期間の週数分の列を用意します。","check":"交絡要因の週次シートができ、統制依頼と記録のみが区別されている"},{"n":11,"action":"顧客向け1枚を作る","detail":"何を試すか／何を測るか／いつ判断するか／何が起きたら何をするか／動画以外の要因と統制依頼、の5項目を1枚にまとめます。映像が同一でメッセージだけ3通りであることを明記し、効果を断定する表現を使わないことを読み返して確認します。","check":"顧客向け1枚ができ、効果を断定する表現が含まれていない"},{"n":12,"action":"Week 4の週次集計を出す","detail":"今週の総生成回数、総消費クレジットとUSD換算、採用率（採用カット数 ÷ 総生成数）、総作業時間、3本あたりの制作原価を集計します。Week 1からの推移と比べ、変種生成を使ったことで1本あたり原価がどう変わったかを1行で記録します。","check":"週次集計が出て、変種生成による1本あたり原価の変化が数値で記録されている"}],"prompts":[{"label":"3本の差分一覧（映像固定・メッセージのみ変更）","text":"MASTER (fixed for all three): identical motion, framing, cut structure, duration, color grade, location and on-screen subjects. VARY ONLY: hook text, voiceover script, mid-roll on-screen text. CTA fixed to \"Check February availability\" across all three. / A-LUXURY: hook \"Twelve rooms. One quiet street.\" | vo \"Twelve rooms, hand-finished plaster and solid oak, two streets off the main road.\" | text \"12 rooms / private bath\" / B-EXPERIENCE: hook \"The city is awake before you are.\" | vo \"Coffee on the windowsill, the first trains somewhere below, and nowhere to be until ten.\" | text \"slow mornings in Tokyo\" / C-BUSINESS: hook \"Breakfast at 6:30. Gate in 3 minutes.\" | vo \"Breakfast opens at half six, and the ticket gate is three minutes from the door.\" | text \"breakfast 06:30 / 3 min to the gate / desk and power\"","note":"課題の3本をこの1つの差分表で管理する。CTAを3本で固定しているのは、訴求軸だけを動かす設計だから。CTAも変えたくなった時点でそれは2変数の総当たりになる。Cを出張客向けにしているのは、東京では平日のビジネス需要が最も安定した客層で、かつ訴求が検証可能な事実（朝食時刻・徒歩分数・デスク）に落ちるため。記載の設備・客室数・時刻・徒歩分数は必ず施設の事実と一致させ、未確認項目は削除する。","status":"未検証","flow":{"code":"DOC","step":"単発","input":"生成AIには投げない。w4d3で確定したマスターの映像変数と、A／B／Cの3軸ぶんのフック・ナレーション・画面内テキストを1枚の表に書き写す","output":"3本の差分表1枚。何を固定し何を変えたかが1枚で追え、CTAは3本固定と明記される","next":"この表の各行をAd Multiplierへの指示文に変換し、3本の仕上げと事実確認（step5）の元票にする"}},{"label":"中盤カットの補充（マスターの構造を崩さない範囲で）","text":"Continuing the same city hotel guest room at first light with identical grade and lens character: a medium shot of linen bedding and a half-full cup on the windowsill, faint steam, then a tighter shot of rain beads running down the outside of the window glass with the grey wall of the neighbouring building thrown out of focus beyond, static framing for both, 50mm equivalent, shallow depth of field, cool 6500K reflected window light as the only key with a warm 2700K lamp spill from frame left, matte plaster and pale oak textures, photorealistic, muted cool grade with a single warm accent, slight film grain","note":"マスターの尺が足りない場合に中盤を足す用。レンズ・光・グレードの記述をマスターと完全に揃えるのが条件。足したカットは3本すべてに同じ形で入れる。片方だけ尺が変わると映像変数の固定が壊れる。","status":"未検証","flow":{"code":"I2V","step":"単発","input":"マスター動画から書き出した同じ客室の静止画1枚を起点にする。マスター動画そのものは入力しない。レンズ・光・グレードの記述はマスターと完全に揃える","output":"静止構図の中盤カット2本。マスターの尺不足を、色とレンズの描写を崩さずに埋められる","next":"ここで完結。足したカットは3本すべてに同じ形で入れ、映像変数の固定が壊れていないか再確認する","where":"生成画面でモデルを選ぶ（image-to-video）","whereNote":"最も安く、Seedance 2.0 系・Kling 3.0・Wan 2.7 なら Unlimited 対象"}},{"label":"書き出し前の最終確認用・末尾カード背景","text":"A clean end card background: the same guest-room window at first light rendered out of focus, rain beads and the soft grey bokeh of the neighbouring building filling the frame, no text and no signage, static shot, 50mm equivalent, very shallow depth of field, cool 6500K reflected daylight with a single warm 2700K accent at frame left, photorealistic, muted cool grade, large uniform negative space in the central band for overlaid text","note":"3本共通の末尾カード背景。共通にすることでCTAテキストだけを差し替えられ、d4のCTAテスト（公開情報で最大35クレジット＝約$1.75）にそのまま使える。文字は生成させず編集で載せる。","status":"未検証","flow":{"code":"T2I","step":"単発","input":"新規。テキストのみで生成する。マスター動画の末尾フレームは使わず、同じ窓・同じ光・同じグレードの記述を書き写してピントを外した1枚を作る","output":"静止画1枚。中央帯が文字を置ける均一な余白になり、3本共通の末尾カード背景になる","next":"ここで完結。編集工程でCTA文字を重ね、d4のCTA文言テストの背景としてそのまま使い回す"}}],"expected":"訴求軸違いの広告動画3本が同一仕様で書き出され、映像変数の一致が書き出し後に確認されている状態です。あわせてテスト計画書6項目、成果計測シート（4グループの列設計、制作原価入力済み）、交絡要因の週次記録枠、顧客向け1枚が揃っています。必要到達数の概算に対して到達見込みが足りるかの判断と、足りない場合の対処が記録されていれば到達です。","assignment":{"title":"【Week 4 総合課題】同一施設・訴求軸違い3本と、テスト計画・成果計測シート","brief":"w4d1で確定した東京の宿泊施設について、訴求軸の異なる広告動画3本を完成させます。3本の映像変数（構図・カット割り・尺・色・ロケーション・被写体）は完全に同一で、変えるのはフック文言・ナレーション・画面内テキストのみ。CTAも固定します。重要なのは3本の見栄えではなく、判断基準と判断日を配信前に文書化していることと、必要到達数に対して判定が可能かを数値で検討していることです。基準を後から決めた提出、分母の検討がない提出は本課題では不合格とします。配信前ベースラインと制作原価を含む成果計測シートまで揃えて提出してください。","deliverables":["広告動画3本（訴求軸：高級感／滞在体験と感情的価値／特定層へのメリット。縦9:16、各8〜15秒、同一仕様で書き出し）","ターゲット設定と訴求仮説シート（3軸分、固定変数の一覧つき、各軸が徒歩圏の競合と差になるかの検討を含む）","3本の差分表（映像に関する指示を含まない）と、書き出し後の映像変数一致検証","全テキストの事実確認記録（根拠の出典つき）とAI生成表記・広告明示の方針","CTAと予約導線の設計書（着地URL、UTM付き配信URLと3本の対応表）","テスト計画書（仮説・変数・配信期間・必要到達数・判断基準・判断日）","必要到達数の概算と到達見込みの比較、足りない場合の対処","成果計測シート（A識別／B配信実績／Cサイト側／D文脈と制作原価の4グループ、日×変種の行、計測不能項目の明記）","交絡要因の週次記録枠（統制依頼と記録のみの区別）","顧客向け1枚（5項目、効果を断定しない表現）","Week 4週次集計（総生成回数・総クレジット・USD換算・採用率・総時間・1本あたり原価）"],"constraints":["3本の映像変数は完全に同一。変えるのはフック文言・ナレーション・画面内テキストのみ。CTAも固定する","判断基準と判断日は、3本の仕上げに着手する前に文書化する","必要到達数の概算を行い、足りない場合は本数削減・期間延長・上流指標への切替のいずれかを選ぶ。足りないまま3本出さない","全テキストの設備・時間・料金・客室数は施設の事実と一致させる。根拠のない優位性表示と架空の期限表示をしない","AI生成映像を実写と誤認させる表現を避け、必要な表記を入れる。体験談風の構成を使う場合は広告であることを明示する","計測シートの計測不能項目は空欄にせず「計測不能」と記入する","総作業時間は90分以内"]},"success":["3本の映像変数（カット数・各カットの尺・構図・カメラ移動・色）が書き出し後も一致しており、検証記録がある","3本の差分が、フック文言・ナレーション・画面内テキストのみに限定されている","判断基準（主判定指標・相対差の閾値）と判断日が、仕上げ着手前の日付で文書化されている","必要到達数の概算と到達見込みが数値で並び、足りない場合の対処が1つ選ばれている","成果計測シートに制作原価（生成回数・クレジット・USD・時間）と文脈列が含まれ、計測不能項目が明記されている","顧客向け1枚に、動画以外の要因と統制依頼が書かれており、効果を断定する表現がない"],"rubric":[{"axis":"映像の品質","pass":"3点＝3本すべて配信可能な品質で、冒頭0.5秒に破綻がない。5点＝3本の品質が揃っており、どの1本を単体で見ても施設の価格帯に見合う。"},{"axis":"動きの自然さ","pass":"3点＝3本で動きの破綻がない。5点＝3本を並べて再生したとき、動きのタイミングとカットの切り替わりが完全に同期している。"},{"axis":"ブランド整合性","pass":"3点＝3本の色・トーン・テキストの書体が統一されている。5点＝訴求軸が違っても施設の世界観が一貫し、特定層訴求でも高級感を損なっていない。"},{"axis":"マーケ目的整合性","pass":"3点＝仮説が反証可能な1文で書かれ、固定変数が列挙されている。5点＝必要到達数から判定可能性を検討した結果が反映され、予約件数を勝敗判定に使わない設計になっている。"},{"axis":"再現性","pass":"3点＝差分表と計画書が保存されている。5点＝第三者がこのテスト計画書と差分表だけで、同じ3本と同じ計測設計を再現できる。"},{"axis":"時間とコスト","pass":"3点＝週次集計が出ている。5点＝変種生成を使った場合の1本あたり原価を新規制作と比較し、次回案件の見積根拠として使える数値になっている。"}],"pitfalls":[{"problem":"分母が足りないまま勝者を決め、間違った知見が以降の判断を汚染する","cause":"必要到達数を概算せず、比率の差だけを見た","fix":"各群で数十件以上のイベントが得られる分母かを配信前に概算する。足りなければ主判定を上流指標に切り替えるか、本数を減らす。差が小さいときは「差がなかった」と報告する。"},{"problem":"数値を見てから判断基準を変えてしまう","cause":"基準と判断日が文書化されていない／映像を作った後に基準を決めた","fix":"仕上げに着手する前に、主判定指標・閾値・判断日を文書化して日付を入れる。顧客にも共有し、中間報告は判断ではないと明示する。"},{"problem":"3本の尺や色が微妙に違い、比較が成立しない","cause":"書き出し設定や中盤カットの追加が1本だけに適用された","fix":"書き出し後に3本を並べてカット数・尺・色をフレーム単位で確認する。中盤を足す場合は3本すべてに同じ形で入れる。"},{"problem":"配信後に文脈を思い出せず、数値の変動を説明できない","cause":"交絡要因の記録枠を作らなかった","fix":"週次シートを配信開始前に作り、週1回5分で埋める運用にする。天候・大型イベント・為替・近隣ホテルの新規開業・競合の価格改定・OTA表示順位は手動観測の項目として明示的に入れる。"},{"problem":"計測シートの空欄をゼロと誤読して報告してしまう","cause":"計測不能な項目を空欄にした","fix":"電話予約・OTA流出などの列に「計測不能」と文字で記入する。報告時にはその列を指して、測れない経路があることを説明する。"},{"problem":"顧客向け資料で効果を断定し、翌月に説明できなくなる","cause":"受注したい意図で留保を外した","fix":"顧客向け1枚に、季節・価格・競合・OTA表示順位・天候・為替が同時に動く旨の留保と統制依頼を定型として入れる。断定表現を禁止語リストにして読み返す。"}],"resourceIds":["hf-academy-ad-3step","hf-blog-ad-multiplier","hf-academy-ad-agency","jp-keihyo","jp-stealth"],"nextHint":"Week 5では、ここで作った3本とテスト計画を回すための編集・品質管理・効率化を扱います。変種を量産できるようになった分、品質ゲートと工程管理がボトルネックになります。","setup":{"tag":"Week 4 総合課題","model":"動画 Kling 3.0（1080p）＋ Ad Multiplier","seconds":"5秒 × 必要カット","res":"1080p","aspect":"9:16","outputs":"1","cap":"動画6本 ＋ 変種1回","credits":"約 110 cr（$5.50）","unlimited":"約 35 cr（$1.75）","save":"3本の映像は完全に同一。変えるのはフック文言・ナレーション・画面内テキストだけなので、映像の生成は1本分で済む。"}}]},{"week":5,"title":"編集・品質管理・制作効率化","theme":"「自分が作れる」を「他人が同じ品質で作れる」に変える","objective":"これまでの制作工程を素材管理・編集・出荷判定・原価・標準化の5領域に分解して文書化し、他人が読んで同じ品質を再現できる制作マニュアルと、実測に基づく原価・時間計算表を完成させる。","hours":"7時間5分（80〜90分 × 5日）","weekDeliverables":["標準制作フロー（工程切り分け表と4段階の品質ゲート定義を含む）","プロンプトライブラリ（管理ヘッダ形式・版管理・採用率記録つき）","品質チェックリスト（7カテゴリ・20項目以上・致命／軽微の重みつき）","納品テンプレート一式（納品書・技術仕様表・修正回数の定義・媒体別二次利用可否表）","制作原価・時間計算表（為替前提・工程別採用率・固定費配分・損益分岐・感度分析）","外注指示書6部の雛形と制作マニュアル第1版の目次"],"outcome":"1本あたりの原価と所要時間を円と分で言い切り、どの工程を手放してどの工程を自分に残すかを金額根拠つきで説明できる。","lessons":[{"id":"w5d1","day":1,"title":"生成から編集への受け渡しとアセット管理","subtitle":"素材を「在庫」として扱い、最終版が行方不明になる構造そのものを潰す","why":"ここまでの4週間であなたは素材を作れるようになりました。ただしそれは「自分が手を動かし続ける限り回る」状態です。映像制作が事業として詰まる最大の原因は品質不足ではなく、素材の所在とバージョンが追えなくなって修正に時間が溶けることです。1案件で50ファイル、顧客3社で150ファイル、修正が1回入れば倍になります。この管理コストは売上に比例して増えるのに単価には乗せられません。今日は作る日ではなく、素材を在庫として扱う仕組みを作る日です。","goals":["手元の素材を使い捨て・案件資産・横断資産の3分類に振り分けて台帳に記録できる","Elements に相当する機能へ再利用前提の資産を登録し、再現に必要な元データの保管場所を併記できる","最終版を場所で一意に決める運用に切り替え、版番号の付け方を文書化できる","納品尺から逆算したカット割表を作り、各カットを生成面の尺上限に収めて割り当てられる","編集プロジェクトの解像度とフレームレートを先に確定し、素材側の不整合を取り込み前に検出できる"],"duration":"80分","timeBreakdown":[{"label":"理解","min":25},{"label":"整理・設定","min":35},{"label":"記録","min":20}],"tools":["Higgsfield（Elements／Assets に相当する資産管理機能、生成履歴の確認）","クラウドストレージ（素材保管）","スプレッドシート（資産台帳・カット割表）","編集ソフト（CapCut 等。プロジェクト設定の確認に使用）"],"prereq":["Week 1 で決めたファイル命名規則とフォルダ構成が運用されていること","Week 2〜4 で制作した素材（採用・不採用を含む）が手元に残っていること","制作台帳に生成回数・消費クレジット・所要時間の記録が蓄積されていること"],"theory":[{"heading":"素材は在庫、横断資産は仕込み","body":"飲食店の在庫管理とまったく同じ構造です。素材は3つに分けて扱います。\n\n- **使い捨て素材**：不採用の生成物、検証用の試し生成。価値はゼロではないが保管コストを払う価値はない。期限を決めて消す対象。\n- **案件資産**：採用カット、編集プロジェクト、納品ファイル。その顧客の案件が生きている間は必ず取り出せる状態を保つ。\n- **横断資産**：Elements に登録したキャラクター・ロケーション・小道具、Soul ID、プロンプトテンプレート、チェックリスト。作るのに金と時間がかかるが、2件目以降は追加コストなしで使える。\n\n粗利を作るのは3番目だけです。1件目で原価を払って作った横断資産を2件目で使い回せたとき、初めて利益率が上がります。逆に毎案件で素材をゼロから作り直している限り、売上が増えても作業時間が比例して増えるだけで、事業は拡大しません。\n\nHiggsfield の **Elements** は Characters / Locations / Props をプロジェクト横断で再利用する機能で、Assets から Create Element に相当する操作で作成します。宿泊施設の客室・外観の一貫性を保つ中核機能です。登録した時点で、それは制作物ではなく資産になります。"},{"heading":"資産台帳には「再現コスト」を書く","body":"横断資産の台帳で最も重要な列は、資産名でも作成日でもなく **再現に必要な元データの保管場所** です。\n\n**Soul ID** は20〜80枚の写真から人物の同一性を学習する機能ですが、**ファイルとして書き出すことができません**。つまり Higgsfield のアカウント内にしか存在せず、解約すれば消えます。元の写真20〜80枚を自分のストレージに保管していれば再構築できますが、していなければそれは資産ではなく運です。Elements も同様に、登録に使った元画像を自分側に持っているかどうかで性質が変わります。\n\n台帳の列はこの形にします。\n\n`資産ID / 種別（Character・Location・Prop・Prompt・Checklist）/ 用途 / 作成日 / 作成時の消費クレジット / 作成所要分 / 元データの保管パス / 再現可否（可・要再撮・不可）/ 使用案件リスト`\n\n「作成時の消費クレジット」と「使用案件リスト」が揃うと、その資産が何件で回収できたかが計算できます。Week 4 までに作った資産を今日ここに流し込んでください。1件しか使っていない資産が多いなら、資産設計の粒度が案件に寄りすぎているという診断になります。"},{"heading":"最終版問題はルールでなく構造で防ぐ","body":"`最終_v2_修正版_本当に最終.mp4` が生まれる条件は決まっています。締切直前、複数人が同じフォルダを触る、ファイル名の付け方が自由。この3つが揃うと必ず起きます。注意喚起や「気をつける」では防げません。守る余裕がない瞬間にこそ壊れるからです。構造を3つ入れます。\n\n- **FINAL は場所で決める**：`05_納品` フォルダに置かれたファイルだけが納品版です。ファイル名に FINAL という文字を入れません。差し替えるときは、先に旧版を `06_旧納品` へ移動し、その後で新版を置きます。手順上、同時に2つ存在できません。\n- **版番号は上げるだけ**：一度使った番号は再利用しません。v3 を直したら v4 です。変更が1文字でも v4 にします。番号が小さいほど古い、という単純な規則だけを残します。\n- **納品記録に版番号と書き出し日時を書く**：顧客が「もらったものと違う」と言ったときに照合できるのは、ファイル名ではなく記録です。\n\n修正3回の案件で版が v1 から v6 まで増えるのは正常です。異常なのは版が増えないこと、つまり上書きしていることです。"},{"heading":"尺の上限が編集設計を規定する","body":"執筆時点の生成面の尺上限を把握していないと、絵コンテの段階でやり直しが確定します。\n\n- Marketing Studio の動画：**最長15秒**\n- Cinema Studio 4.0：**最長30秒**\n- Seedance 2.5：4〜30秒（Seedance 2.0 は4〜15秒）\n- Kling 3.0：15秒。ただし**1回の生成で最大6カット**\n- Wan 2.6：15秒／Veo 3.1：**4秒・6秒・8秒の固定**／Higgsfield DoP：**3秒または5秒**\n\nしたがって30秒や60秒の納品物は、生成面が一発では出せないため「編集で足す」前提の設計になります。順序はこうです。①納品尺を決める ②カット割と各カットの尺を決める ③各カットの尺が生成面の上限に収まるか確認する ④どのカットをどの面で作るか割り当てる。\n\nまた、Cinema Studio 4.0 の **Forward/Backward Extend** はアップロードした動画を最大30秒まで前後に延長できますが、「前のカットの続きを作る」専用機能は存在しません。クリップAの最終フレームとクリップBの先頭フレームを参照にして間を生成する、という回避策で実現します。これを知らずに連続する動きを前提にした絵コンテを切ると、編集段階で接続できず作り直しになります。実務上の結論は、**15秒ブロックの連結として尺を設計する**ことです。"},{"heading":"編集ソフトに渡す前の技術整合","body":"納品後に指摘されやすく、本人が気づきにくい事故がフレームレートと解像度の混在です。\n\n執筆時点、Seedance 2.5 の最大解像度は **1080p** で、4K は Seedance 2.0 のみです。Veo 3.1 は 720p / 1080p の **24fps** と明記されています。フレームレートの異なる素材を1本のタイムラインに並べると、編集ソフト側が速度変換やフレーム補間を行い、動きがわずかにぶれます。等倍再生では気づきにくく、大画面やテレビ的な再生環境で露呈します。\n\n受け渡し前の手順を固定します。\n\n1. 編集プロジェクトの解像度と fps を先に決める（例：縦型なら 1080×1920 / 30fps）\n2. 各素材のプロパティ（解像度・fps・尺・コーデック）を確認し、カット割表に記録する\n3. プロジェクト設定と異なる素材は、取り込み時に変換するか、同条件で再生成するかを決める\n4. モデル間で色味が揃わないことは前提とし、編集側で合わせる工程を工数に入れる\n\nCapCut などの編集ソフトは、プロジェクト作成時の比率・解像度設定を後から変更しにくい作りになっています。**先に決める**。これだけで取り込み後の手戻りがほぼ消えます。"}],"steps":[{"n":1,"action":"手元の素材を3分類で棚卸しする","detail":"Week 2〜4 で生成したファイルをすべて一覧化し、使い捨て素材・案件資産・横断資産のどれかを1件ずつ判定します。判定に迷ったものは「保留」に置き、保留が全体の2割を超えたら分類基準が曖昧だということなので、自分の言葉で判定文を書き直します。件数と総容量も記録します。","check":"全ファイルが3分類＋保留のいずれかに割り当てられ、分類ごとの件数が出ている"},{"n":2,"action":"顧客コード台帳を作り命名規則を案件横断に拡張する","detail":"Week 1 の命名規則は1案件内で機能する設計でした。これを顧客コードの一覧表（顧客コード・正式名称・初回受注日・現在の案件コード一覧）として独立させ、コードの表記ゆれを物理的に不可能にします。新規顧客はこの表に行を足してからでないと案件フォルダを作れない運用にします。","check":"顧客コード台帳が存在し、既存の全案件フォルダ名が台帳のコードと一致している"},{"n":3,"action":"横断資産を Elements に登録する","detail":"分類で横断資産に入れたキャラクター・ロケーション・小道具を、Assets から Create Element に相当する操作で登録します。登録名は顧客コードを含めず、用途が読める英数名にします（例：hotel_room_twin_A）。顧客専用の資産は例外的に顧客コードを頭に付けます。","check":"Elements 一覧に登録済み資産が並び、名前から用途が判別できる"},{"n":4,"action":"再現コスト列つきの資産台帳を作る","detail":"理論で示した列構成（資産ID／種別／用途／作成日／作成時消費クレジット／作成所要分／元データ保管パス／再現可否／使用案件リスト）でシートを作り、登録済み資産を全件入力します。元データの保管場所が不明な資産は再現可否を「不可」と書き、別シートの要対応リストに移します。","check":"全資産に再現可否が入力され、「不可」の件数が把握できている"},{"n":5,"action":"FINALの場所ルールへ切り替える","detail":"既存の全案件フォルダに `05_納品` と `06_旧納品` を作り、ファイル名に FINAL や「最終」が入っているファイルを棚卸しします。最新と判断できるものだけを `05_納品` に移し、名前から FINAL 表記を外して版番号に統一します。残りはすべて `06_旧納品` に落とします。","check":"どの案件でも `05_納品` にファイルが1用途あたり1本だけ存在する"},{"n":6,"action":"納品尺からカット割表を逆算する","detail":"直近または想定の案件1件を選び、納品尺（例：30秒・15秒・6秒の3種）を決めます。次に各尺のカット割を書き、カットごとに尺・生成面（Marketing Studio／Cinema Studio 4.0 等）・使用モデル・使用 Elements を割り当てます。15秒を超える尺は15秒ブロックの連結として記述します。","check":"全カットの尺が割り当てた生成面の上限以内に収まっている"},{"n":7,"action":"編集プロジェクトの技術仕様を固定する","detail":"編集ソフトで納品尺ごとにプロジェクトを作り、解像度・fps・色空間の設定をメモに固定します。縦型 1080×1920、横型 1920×1080、正方 1080×1080 を基本とし、fps はプロジェクト全体で1つに統一します。この仕様メモは後の外注指示書にそのまま転記します。","check":"比率別のプロジェクト設定値が数値で文書化されている"},{"n":8,"action":"素材のプロパティを確認して不整合を洗い出す","detail":"カット割表に割り当てた素材について、解像度・fps・尺・コーデックを1本ずつ確認し、表に書き込みます。プロジェクト設定と異なる行に印を付け、変換で済むか再生成が必要かを判定します。再生成が必要な本数と、その消費クレジット見込みを算出します。","check":"不整合素材の本数と、対応方針（変換／再生成）が全件に記入されている"},{"n":9,"action":"編集ソフトに取り込んで並べ、接続を確認する","detail":"カット割どおりに素材をタイムラインへ並べます。この段階では字幕も音も入れません。カットの接続部で被写体の位置・明るさ・色が飛んでいないか、尺が納品尺に収まるかだけを見ます。連続する動きを想定したカットが接続できない場合は、カット割表に「要中間生成」と記録します。","check":"尺が納品尺以内に収まり、接続できないカットが特定されている"},{"n":10,"action":"書き出し前素材チェックを1本通して記録する","detail":"1つの納品尺について通しで書き出し、ファイルサイズ・実尺・解像度・fps を書き出し後の実ファイルで再確認します。設定値どおりになっていない項目があれば原因を記録します。ここで記録した確認項目は、3日目の品質チェックリストの技術仕様セクションの原型になります。","check":"書き出したファイルの実測仕様が、固定した仕様メモと一致している"}],"prompts":[{"label":"Elements 登録用：ロケーション基準カット（変数テンプレート）","text":"Interior of {{ROOM_TYPE}} in a {{PROPERTY_STYLE}} city hotel, {{TIME_OF_DAY}} light entering through {{WINDOW_DIRECTION}} window, {{KEY_FURNITURE}} in frame, 35mm lens look, eye-level static framing, neutral white balance, photorealistic, no people, no text, no logo","note":"Elements の Location として登録する基準カットを作るための雛形。{{ }} の5箇所だけを差し替える前提で固定文を崩さないのが要点。人物・文字・ロゴを除外しているのは、ロケーション資産に余計な要素が焼き付くと再利用時に差し替えられなくなるため。登録用カットは必ず静止・アイレベル・ニュートラルで撮る。","status":"未検証","flow":{"code":"T2I","step":"工程1 / 2","input":"Week 5 Day 1 の棚卸しで横断資産に分類したロケーションについて、部屋種別・建物様式・時間帯・窓の方角・主要家具の5つの実値","output":"人物・文字・ロゴが写っていない静止・アイレベルのロケーション基準画像1枚","next":"Assets から Element として登録し、資産台帳に再現コストを記入する"}},{"label":"プロンプトライブラリの管理ヘッダ形式","text":"[ID: LOC-004 | VER: 3 | ENGINE: Soul 2.0 | ASPECT: 16:9 | DEPENDS: element/hotel_room_twin_A | LAST_TESTED: ----/--/-- | ADOPT_RATE: --%]\nInterior of a twin guest room, late afternoon light from the west window, textile textures visible, 35mm lens look, eye-level static framing, photorealistic, no people, no text","note":"プロンプトを資産として管理するための記述形式。本文の上に1行のメタヘッダを置き、ID・版・想定エンジン・比率・依存アセット・最終検証日・採用率を持たせる。この6項目があると、他人が使うときに「どの面で何に使えるプロンプトか」が本文を読む前に判断できる。採用率の列が外注時の単価交渉と品質ゲートの根拠になる。","status":"未検証","flow":{"code":"DOC","step":"工程2 / 2","input":"採用率を実測し終えたプロンプト本文と、ID・版・想定エンジン・比率・依存Element名・最終検証日の6項目","output":"本文の上に1行のメタヘッダが付いた、プロンプト台帳の登録行1行","next":"Day 5 の外注指示書とプロンプトライブラリにこの形式のまま転記する"}},{"label":"中間生成用：カット間をつなぐ参照指定","text":"Continuous motion bridging two shots. Start from the provided first reference frame and end at the provided last reference frame. {{SUBJECT}} continues {{ACTION}} without cuts. Camera keeps {{CAMERA_MOVE}} at constant speed. Match lighting and color of both reference frames. No new objects enter the frame.","note":"「前のカットの続き」専用機能は存在しないため、クリップAの最終フレームとクリップBの先頭フレームを始点・終点の参照として渡し、その間を生成する回避策用の雛形。始点終点の指定は Seedance の first/last frame、Veo 3.1 の first + image、Wan 2.6 の first/last 制御で可能。新規要素の混入を禁止する一文が接続の破綻を減らす。","status":"未検証","flow":{"code":"I2V","step":"単発","input":"書き出し済みのクリップAの最終フレーム画像とクリップBの先頭フレーム画像、および被写体・動作・カメラ移動の3値","output":"2枚の参照フレームの間を埋める、カットのない接続用の動画クリップ1本","next":"編集ソフトでAとBの間に挿入し、トランジションを使わずに接続する","where":"生成画面でモデルを選ぶ（image-to-video）","whereNote":"最も安く、Seedance 2.0 系・Kling 3.0・Wan 2.7 なら Unlimited 対象"}}],"expected":"今日の終わりに手元にあるべきものは、作品ではなく表です。全素材が3分類に振り分けられ、横断資産には再現可否が入り、各案件の `05_納品` には用途ごとに1本だけファイルがある状態になります。カット割表には納品尺・カット尺・生成面・使用モデル・素材のプロパティが埋まり、不整合素材の本数とその対応コストが数字で出ています。この表を他人に渡したら、その人が同じ素材を同じ場所から取り出せる、というのが合格水準です。","assignment":{"title":"案件横断アセット体系とカット割表の構築","brief":"自分がこれまでに作った素材を、他人が引き継げる在庫に変換します。対象は Week 2〜4 で制作した全素材と、東京の宿泊施設1件を想定した案件です。新規の生成は不整合素材の再生成と Elements 登録用の基準カットに限定し、見栄えのする映像を作ろうとしないでください。成果物はすべてドキュメントと表です。判定基準は「自分が1ヶ月後に読んで同じ結論に到達できるか」ではなく「自分以外の人間が読んで同じ結論に到達できるか」です。","deliverables":["素材棚卸し表（全ファイルの3分類＋件数・容量）","顧客コード台帳","再現コスト列つき横断資産台帳（Elements 登録済み資産を全件記載）","バージョン管理規則と FINAL 場所ルールの文書","納品尺別カット割表（尺・生成面・モデル・使用 Elements・素材プロパティ・不整合判定）","比率別の編集プロジェクト技術仕様メモ"],"constraints":["新規生成は不整合素材の再生成と Elements 登録用の基準カットのみ。本日の上限クレジットを着手前に決める","作業時間は90分以内","カット割表のすべてのカット尺が、割り当てた生成面の尺上限以内であること","ファイル名に FINAL・最終・最新といった文字列を一切使わないこと"]},"success":["素材棚卸し表で保留に残ったファイルが全体の2割未満である","横断資産台帳の全行に元データ保管パスと再現可否が入力されている","すべての案件フォルダで `05_納品` に用途あたり1本だけファイルが存在する","カット割表の全カットが割り当てた生成面の尺上限以内に収まっている","書き出した1本の実測仕様（解像度・fps・尺）が仕様メモと一致している"],"rubric":[{"axis":"映像の品質","pass":"3点＝接続部で被写体位置・明るさ・色が飛んでいないことを確認済み。5点＝不整合を変換で済ませるか再生成するかの判断理由を素材ごとに書いている。"},{"axis":"動きの自然さ","pass":"3点＝接続できないカットを特定し要中間生成と記録している。5点＝始点終点参照による中間生成の回避策を実際に1箇所で試し、結果を記録している。"},{"axis":"ブランド整合性","pass":"3点＝Elements 登録カットに人物・文字・ロゴが焼き付いていない。5点＝顧客専用資産と汎用資産を命名で区別し、流用範囲を文書化している。"},{"axis":"マーケ目的整合性","pass":"3点＝納品尺を複数想定しカット割を分けている。5点＝各尺がどの配信面向けかを明記し、尺ごとに主要情報の配置を変えている。"},{"axis":"再現性","pass":"3点＝台帳と規則が文書化されている。5点＝第三者が読んで素材の所在・最新版・再現方法に迷わず到達できる粒度になっている。"},{"axis":"時間とコスト","pass":"3点＝棚卸しと再生成の所要時間を記録している。5点＝横断資産ごとに作成コストと使用案件数を並べ、回収済みか未回収かを判定している。"}],"pitfalls":[{"problem":"横断資産が実質1案件専用になっていて使い回せない","cause":"登録時に顧客固有の要素（ロゴ、固有の内装、特定の人物）を画面内に入れてしまい、他案件で差し替えられない","fix":"登録用の基準カットは人物・文字・ロゴを除外して生成する。顧客固有要素は Elements には焼き込まず、生成時に参照として足す。既存の登録済み資産を見直し、固有要素が入っているものは汎用版を作り直して資産台帳の行を差し替える。"},{"problem":"Soul ID や Elements を作ったが元データを保管しておらず再現できない","cause":"Higgsfield 内で完結する機能なので、元の写真や画像を自分側に残す必要性が意識されない。Soul ID はファイルとして書き出せない","fix":"資産台帳に元データ保管パス列を必須にする。登録作業を「元データをストレージに置く → パスを台帳に書く → Higgsfield に登録する」の順に固定し、順序を逆にしない。既存資産で元データがないものは再現可否を不可と記録し、重要なものは今のうちに元データを作り直す。"},{"problem":"30秒の納品物を1回の生成で作ろうとして詰まる","cause":"生成面ごとの尺上限（Marketing Studio 15秒、Cinema Studio 4.0 30秒、Veo 3.1 は4/6/8秒固定、DoP は3or5秒）を把握せずに絵コンテを切っている","fix":"カット割表に「割り当て生成面」と「その面の尺上限」の2列を置き、カット尺が上限を超える行を自動で検出できる形にする。15秒を超える尺は15秒ブロックの連結として設計し直す。"},{"problem":"編集タイムライン上で動きがわずかにカクつくが原因がわからない","cause":"フレームレートの異なるモデル出力（例：Veo 3.1 は24fps）を同一プロジェクトに混在させ、編集ソフト側の速度変換が入っている","fix":"素材プロパティの確認を取り込み前の必須工程にし、カット割表に fps 列を作る。プロジェクト fps と異なる素材は取り込み時に明示的に変換するか、同一モデル・同一条件で再生成する。混在が避けられない案件では、どのカットがどの fps かを納品記録に残す。"},{"problem":"締切直前に最終版がどれかわからなくなる","cause":"ファイル名による最終版表示に依存しており、急ぎの作業で名前の付け方が崩れる","fix":"最終版をフォルダの場所で一意に決める。`05_納品` に置かれたものだけが納品版とし、差し替えは旧版を `06_旧納品` へ移動してから新版を置く手順にする。ファイル名から FINAL 系の文字列を全廃し、版番号は上げるだけにする。"},{"problem":"棚卸しを始めたらキリがなく、整理だけで数日かかる","cause":"全ファイルを完璧に分類しようとして、使い捨て素材の整理に時間を使っている","fix":"使い捨て素材は個別に判定せず、フォルダ単位でまとめて期限付き保管に落とす。時間をかけるのは横断資産の台帳だけに絞る。棚卸しは90分で打ち切り、残りは保留として件数だけ記録する。"}],"resourceIds":["hf-help-marketing-studio","hf-help-cinema-studio"],"nextHint":"明日は並べただけのタイムラインに字幕と音を入れ、縦型・横型・正方の3比率で書き出します。音なし視聴を前提にした字幕設計と、BGMの権利処理をどこで切るかが論点です。","setup":{"tag":"整理が主","model":"動画 Seedance 2.0（不整合素材の差し替えのみ）","seconds":"4秒","res":"720p","aspect":"既存素材に合わせる","outputs":"1","cap":"静止画4枚・動画2本","credits":"約 37 cr（$1.83）","unlimited":"0 cr","save":"新規生成は不整合の修正と Elements 登録用の基準カットのみ。着手前に本日の上限クレジットを台帳に書く。"}},{"id":"w5d2","day":2,"title":"字幕・音・テンポと配信面ごとの書き出し","subtitle":"音なしで伝わる構造を作り、3つの比率を1素材から安全に書き出す","why":"AI生成素材の品質は上がっても、SNSの動画は多くの環境で音が鳴らない状態から再生が始まります。つまり映像の出来が良いほど「音声で言っていたことが伝わらない」損失が大きくなります。また字幕と音は編集工程の中で最も時間を食い、同時に最も外注しやすい工程です。ここの手順が固まっていないと、1本あたりの編集時間が読めず見積が作れません。今日は見た目を良くする作業ではなく、情報の伝達経路を二重化し、比率ごとの書き出しを型にする作業をします。","goals":["日本語字幕の1行文字数・行数・表示時間を計算式で決め、カットごとに割り当てられる","英語併記を併記方式と別バージョン方式のどちらで処理するか、判断基準に照らして選べる","BGM・SE・ナレーションの権利処理区分を記録様式に落とし、生成モデルのネイティブ音声をどこまで使うか線を引ける","15秒・30秒の尺に対してカット尺とカット数を算術で割り当て、トランジションの使用箇所を限定できる","縦型9:16・横型16:9・正方1:1の3比率を安全枠を守って書き出し、入稿規定の確認を手順に組み込める"],"duration":"85分","timeBreakdown":[{"label":"理解","min":25},{"label":"編集作業","min":40},{"label":"書き出しと記録","min":20}],"tools":["編集ソフト（CapCut 等。字幕・音・比率書き出し）","Higgsfield（Marketing Studio の Ads カテゴリで入稿サイズを確認、GPT Image 2 でエンドカードの文字描画）","BGM・効果音のライセンス素材サービス","スプレッドシート（字幕台本・音源権利記録・書き出し仕様表）"],"prereq":["1日目のカット割表と、並べただけのタイムラインが存在すること","比率別の編集プロジェクト技術仕様メモが確定していること","Week 4 で決めた訴求軸とメッセージ（何を言う動画か）が手元にあること"],"theory":[{"heading":"音なし視聴を前提に情報を二重化する","body":"設計の出発点は「音が鳴らない状態で成立するか」です。音声で言っている内容が画面に出ていなければ、その情報は届かなかったものとして扱います。\n\n日本語字幕の可読性は、文字数と表示時間の2つで決まります。実務で使う数値はこれです。\n\n- **1行の文字数：全角13〜15文字**。縦型では13文字を上限にすると改行位置の破綻が減ります。\n- **行数：2行まで**。3行入ると映像が見えなくなり、字幕を読ませるために映像を作った意味が消えます。\n- **表示時間の下限**：読む速度を**毎秒4文字**として計算します。26文字なら 26 ÷ 4 = 6.5秒。これを下回る尺に26文字を載せるなら、文字を削るかカットを分けます。\n- **カット尺から逆算した文字数上限** = カット尺（秒）× 4。2.5秒のカットには10文字。これが上限です。\n\nこの計算を先にやると、「このカットには入らない」という判断がプレビューを見る前に下ります。字幕を作ってから入らないことに気づく、という手戻りがなくなります。可読性の実装は、太めのゴシック、背景とのコントラスト確保、1〜2px の縁取りか半透明の帯。白文字単独は背景が明るいカットで消えます。"},{"heading":"英語併記は併記か別バージョンかを先に決める","body":"東京のようにインバウンド比率が高い市場では英語の扱いが必ず論点になります。客層は都市観光・短期滞在・食目的が中心で、滞在中に何度も参照される情報ではなく、検討の瞬間に読み切れる短さが求められます。方式は2つで、コストと効果が違います。\n\n**A. 併記方式**（日本語の下に英語を置く）\n- 1画面の文字量が2倍になり、上の計算式の13〜15文字×2行の枠に収まらなくなります。日本語を10文字以下に圧縮する前提になります。\n- 書き出しは1本で済むため、制作コストと管理コストが安い。\n- 向くのは、情報が短い用途（施設名、価格、期間、CTA）。\n\n**B. 別バージョン方式**（日本語版と英語版を別に書き出す）\n- 文字量の制約を受けないため、訴求を削らずに書けます。\n- 書き出し本数と確認工数が2倍、修正時も2本直すことになります。ファイル管理の版数も倍。\n- 向くのは、配信面を言語で分けられる場合（言語ターゲティングが使える広告、英語圏向けの OTA 掲載など）。\n\n判断基準は配信面です。**言語で配信を分けられるなら B、分けられない1本勝負なら A**。これだけで決めます。迷って両方作ると、原価が倍になるのに成果は測れません。どちらを選んだかと理由を、納品仕様の欄に1行で書き残してください。この判断は4日目の原価計算で書き出し本数の係数になります。"},{"heading":"音の権利処理と、生成音声をどこまで使うか","body":"音は3層に分けて、それぞれ権利の記録様式を持ちます。\n\n- **BGM**：ライセンス素材を使い、`音源名 / 提供元 / ライセンス種別 / 購入日 / ライセンスID / 使用可能な用途の範囲 / 使用案件`を記録します。顧客に納品する映像では、顧客が二次利用したときに契約違反にならないかまで確認が必要です。「自分が使える」と「顧客が使い回せる」は別の条件です。\n- **SE（効果音）**：BGMと同じ記録を取りますが、点数が多くなるため素材パック単位で記録します。\n- **ナレーション**：人の声か合成音声か、合成なら利用規約上の商用可否を記録します。\n\n生成モデル側のネイティブ音声については、執筆時点で Seedance 2.5 がネイティブ音声と多言語リップシンクを持ち、**音声ONでもクレジット増はありません**。Kling 3.0 は台詞・SFX・環境音と **Voice Binding**（キャラごとの声の固定）を持ち日本語に対応、Wan 2.6 もネイティブ同期音声を持ちます。\n\n実務の線引きはこうします。**環境音とSEは使う。台詞とナレーションは原則として編集側で入れる**。理由は差し替え可能性です。台詞を映像に焼き込むと、文言修正が「音声の差し替え」ではなく「映像の再生成」になります。1文字の修正で生成コストが再発生する構造を作ってはいけません。生成時の音声は常に「仮」として扱い、最終版の音は編集タイムライン上に置きます。アップロードする人物の肖像・音声には権利と同意が必要である点も、記録様式に欄を作って残します。"},{"heading":"カット尺の算術とトランジションの弊害","body":"尺は感覚ではなく割り算で決めます。15秒の動画に平均2.5秒のカットを置けば6カット、平均1.2秒なら12カットです。ここに採用率を掛けると必要な生成回数が出ます。採用率30%で6カットなら、6 ÷ 0.3 = 20回の生成が必要です。この数字が4日目の原価計算の入力になります。\n\nカット尺の使い分けの目安は2つです。\n\n- **テンポ型（0.8〜1.5秒）**：情報量を詰める、スクロールを止める、動きで注意を引く。ただしAI生成素材は1カットごとに破綻リスクがあるため、短いカットを多数使うと検査対象が増え、品質管理コストが上がります。\n- **質感型（2.5〜4秒）**：素材の質、空間の広さ、光の変化を見せる。宿泊施設や料理では、短く切るより1カットを見せたほうが伝わる場面があります。ただしこれは市場や配信面で変わるため、必ず自分の配信データで検証してください。断定できる法則はありません。\n\nトランジションは原則として使いません。理由は2つです。第一に、AI生成素材はすでに情報量が多く、効果を足すと画面が読めなくなります。第二に、**カット間の違和感を隠す目的で入れると、隠していること自体が見えます**。色や明るさが飛んでいるならトランジションではなく、素材側か色調整で直す問題です。使うのは意味の区切り（場面転換、商品から情報面への切り替え、エンドカードへの着地）に限定し、1本あたり1〜2箇所までに数を決めておきます。"},{"heading":"3比率の書き出しと入稿規定の確認習慣","body":"1素材から3比率を作る前提で設計します。要点は**安全枠（セーフエリア）の共通部分に主要情報を置く**ことです。\n\n縦型9:16で全面に使った画面を16:9に切り出すと左右が足りません。逆に16:9を基準に作ると、9:16への変換で上下が大きく空きます。実務では、**9:16を基準に生成し、中央の1:1領域に主要被写体と文字を収める**設計にすると、3比率への展開で作り直しが出にくくなります。加えて各プラットフォームのUI（画面下部のボタン類、上部のアカウント名）が重なる領域を避けるため、上下それぞれ10〜15%は文字を置かない余白として扱います。\n\n入稿規定は変わります。したがって覚えるのではなく、**納品直前に一次情報を確認する手順**をルーチンにします。Higgsfield 側では Marketing Studio の Ads カテゴリが Meta・Google の入稿サイズを持っているため、サイズの出発点として使えます。ただし最終的な規定は配信面の公式ドキュメントが正です。\n\n確認記録の様式はこれです。`配信面 / 確認した項目（比率・解像度・最大ファイルサイズ・コーデック・尺上限・字幕の扱い）/ 確認したURL / 確認日 / 担当者`。この表があると、入稿が弾かれたときに「いつ時点の規定で作ったか」が特定できます。規定変更による差し戻しは、担当者のミスではなく記録の有無の問題として処理できるようになります。"}],"steps":[{"n":1,"action":"カット尺から字幕の文字数上限を算出する","detail":"1日目のカット割表に「字幕文字数上限」列を追加し、カット尺（秒）× 4 の値を入れます。2.5秒なら10文字です。次に伝えたいメッセージをこの上限内に収まる単位へ分割します。収まらないメッセージは、カットを分けるか文言を削るかを行ごとに決めます。","check":"全カットに文字数上限が入り、各カットの字幕案が上限以内になっている"},{"n":2,"action":"英語の扱いを配信面から決定する","detail":"この案件の配信面を列挙し、言語でターゲティングや掲載を分けられるかを確認します。分けられるなら別バージョン方式、分けられないなら併記方式を選びます。併記方式の場合は日本語を10文字以下に圧縮し直します。選んだ方式と理由を1行で記録します。","check":"方式が1つに確定し、理由が配信面の性質で説明されている"},{"n":3,"action":"字幕台本シートを作って全文を確定する","detail":"列は `カット番号 / 開始秒 / 終了秒 / 尺 / 日本語本文 / 文字数 / 上限 / 英語本文 / 判定`。判定列に文字数が上限以内かの OK / NG を入れます。NG が残っている状態でタイムラインに打ち込まないルールにします。この台本が外注時の字幕作業指示書になります。","check":"判定列が全行 OK で、台本単体を読めば字幕内容が再現できる"},{"n":4,"action":"字幕をタイムラインに実装して可読性を確認する","detail":"太めのゴシック体、背景とのコントラストを確保した色、縁取りか半透明帯を設定します。スタイルは1案件で1つに固定し、カットごとに変えません。上下10〜15%には文字を置きません。実装後にスマートフォンの実機で等倍再生し、読めるかを確認します。","check":"実機で全字幕が読み切れ、安全枠から文字がはみ出していない"},{"n":5,"action":"音を3層で設計してライセンスを記録する","detail":"BGM・SE・ナレーションを選定し、音源権利記録シートに `音源名／提供元／ライセンス種別／購入日／ライセンスID／使用可能用途の範囲／使用案件` を全件入力します。顧客が二次利用した場合に範囲内かどうかの判定列も作ります。範囲外になる音源は差し替えます。","check":"使用した全音源に行があり、顧客二次利用の可否が判定されている"},{"n":6,"action":"生成モデルのネイティブ音声の扱いを決める","detail":"素材に含まれる生成音声を、使う（環境音・SE）／使わない（台詞・ナレーション）で振り分けます。台詞を含む素材は編集側で音声を切り、字幕と編集音声で代替します。Seedance 2.5 は音声ONでもクレジット増がないため、素材段階で音を付けて残しておき採否は編集で決める運用にします。","check":"台詞が映像に焼き込まれたまま納品候補に残っている素材がゼロである"},{"n":7,"action":"テンポを整えてトランジションの使用箇所を限定する","detail":"カット尺をテンポ型か質感型のどちらかの方針に揃え、1本の中で方針を混在させないようにします。トランジションは意味の区切りのみに限定し、1本あたり1〜2箇所までと決めて使用箇所を記録します。違和感を隠す目的で入れている箇所は外し、素材または色調整で対処します。","check":"トランジションの使用が2箇所以内で、各箇所の意味上の理由を説明できる"},{"n":8,"action":"エンドカードを文字に強い画像モデルで作る","detail":"施設名・CTA・連絡先を含む静止画のエンドカードを作ります。文字を正確に描画する用途には GPT Image 2 が向いているため、ここで使います。生成した文字は必ず1文字ずつ読んで確認します。文字崩れがある場合は、文字部分を編集ソフト側のテキストで載せる方式に切り替えます。","check":"エンドカードの文字に誤字・崩れがなく、CTA が1つに絞られている"},{"n":9,"action":"入稿規定を一次情報で確認して記録する","detail":"配信面ごとに公式ドキュメントを開き、比率・解像度・最大ファイルサイズ・コーデック・尺上限・字幕の扱いを確認します。確認記録シートに URL と確認日、担当者を入れます。サイズの出発点としては Marketing Studio の Ads カテゴリが持つ Meta・Google 入稿サイズも参照します。","check":"全配信面について確認URLと確認日が記録されている"},{"n":10,"action":"3比率で書き出して実ファイルを検証する","detail":"9:16・16:9・1:1 を書き出します。各比率で主要被写体と文字が安全枠内に収まっているかを確認し、はみ出す比率があれば配置を調整して再書き出しします。書き出し後は実ファイルの解像度・fps・尺・ファイルサイズを測り、書き出し仕様表に記録します。","check":"3比率すべてで文字が安全枠内にあり、実測仕様が入稿規定を満たしている"},{"n":11,"action":"編集工程の所要時間を工程別に記録する","detail":"字幕台本作成／字幕実装／音の選定とライセンス記録／テンポ調整／エンドカード作成／3比率書き出しの6工程について、実測の分数を記録します。これは4日目の原価計算で編集時間の入力値になり、5日目で「どの工程を外に出すか」の判断材料になります。","check":"6工程すべてに実測分数が入り、合計が本日の作業時間と整合している"}],"prompts":[{"label":"エンドカード（文字正確性優先・変数テンプレート）","text":"Clean end card for a hospitality video. Centered text block reading exactly: \"{{PROPERTY_NAME}}\" on the first line and \"{{CTA_LINE}}\" on the second line. Background is a soft out-of-focus {{BACKGROUND_SUBJECT}} in {{BRAND_COLOR}} tones. Generous empty margins on all sides, bottom 15 percent kept clear of any element. Flat even lighting, no gradient banding, no extra text, no watermark, no logo placeholder.","note":"文字の正確な描画に強い GPT Image 2 を想定した雛形。exactly という語と引用符で文字列を固定し、余計なテキストを禁止する。下部15%を空けるのは各配信面のUIが重なる領域を避けるため。生成された文字は必ず1文字ずつ読んで確認し、崩れていたら編集ソフト側のテキストに切り替える。文字生成は検査コストが高いので、失敗が続くなら方式を変える判断を早めにする。","status":"未検証","flow":{"code":"T2I","step":"単発","input":"確定済みの施設名とCTA文言の正式表記、背景にする被写体、Week 4 のメッセージ設計で決めたブランドカラー","output":"下部15%が空いた、文字が焼き込まれたエンドカード静止画1枚","next":"文字を1字ずつ検査し、崩れていたら編集ソフトのテキストに切り替える"}},{"label":"字幕台本の管理形式（1行1カット）","text":"[ID: SUB-TOKYO01-W25 | VER: 2 | ASPECT: 9:16 | LANG_MODE: bilingual_inline | READ_RATE: 4 chars/sec | MAX_LINE: 13]\nC01 | 0.0-2.5 | 2.5s | JA: ----------  (10/10) | EN: {{EN_LINE_1}} | OK\nC02 | 2.5-5.0 | 2.5s | JA: ----------  (10/10) | EN: {{EN_LINE_2}} | OK","note":"字幕をプロンプトではなくデータとして管理する形式。ヘッダに比率・言語方式・読み速度・1行上限を持たせ、本文は1行1カットで文字数と判定を併記する。この形式のまま外注者に渡せば、字幕実装は判断を伴わない作業になる。LANG_MODE は bilingual_inline（併記）と separate_version（別バージョン）のどちらかを必ず明記する。","status":"未検証","flow":{"code":"DOC","step":"工程1 / 2","input":"カット割表の各カットの尺と、読み速度4字/秒から逆算した1行上限文字数、および日英の併記方式の決定","output":"1行1カットで文字数と可否判定が併記された字幕台本シート1枚","next":"外注者にそのまま渡し、判断を伴わない作業として字幕を実装させる"}},{"label":"音なし成立の自己検査プロンプト（レビュー用チェック文）","text":"Review checklist, applied with audio muted:\n1. Can the viewer identify the subject within the first 2 seconds?\n2. Is every spoken claim also present as on-screen text?\n3. Does any text exceed {{MAX_LINE}} characters per line or 2 lines?\n4. Is any text inside the top 15 percent or bottom 15 percent of the frame?\n5. Is the single CTA readable at phone size without pausing?\n6. Does any transition hide a mismatch between adjacent cuts?","note":"映像プロンプトではなく、音を切った状態で自分または外注者が実行するレビュー手順の固定文。6問すべてに答えが出る形式にしてあるので、レビュー結果を YES/NO で記録できる。3日目の品質チェックリストの字幕セクションにそのまま吸収される。NG が出た項目は必ずカット番号を添えて記録する。","status":"未検証","flow":{"code":"DOC","step":"工程2 / 2","input":"字幕を実装し終えたタイムライン、または書き出し済みの動画1本と、台本で決めた1行上限文字数","output":"6問すべてにYES/NOが入った、音なし再生のレビュー記録1枚","next":"Day 3 の品質チェックリストの字幕セクションに項目として吸収する"}}],"expected":"字幕台本シートの判定列が全行 OK になり、タイムライン上の字幕がスマートフォン実機で読み切れる状態になっています。使用した全音源にライセンス記録があり、顧客が二次利用した場合の可否まで判定されています。台詞が映像に焼き込まれたまま残っている素材はありません。3比率が書き出され、各比率で主要情報が安全枠内に収まり、実測仕様が入稿規定を満たしていることが表で確認できます。6工程の所要時間が実測で記録されています。","assignment":{"title":"音なし成立の3比率セットと編集工程の時間実測","brief":"1日目に並べたタイムラインを、音を切った状態で伝わる完成形まで仕上げます。対象は東京の宿泊施設1件、配信面は少なくとも縦型SNS1面と横型1面を含めてください。見た目の作り込みではなく、字幕の文字数計算・音源の権利記録・比率ごとの安全枠という3点の再現性を作ることが目的です。同時に各工程の所要時間を実測し、どの工程が時間を食っているかを数字で把握します。この実測値がない状態では4日目の原価計算は推測になります。","deliverables":["字幕台本シート（カット別・文字数と上限の判定つき）","英語処理方式の決定記録（併記／別バージョンと配信面に基づく理由）","音源権利記録シート（顧客二次利用可否の判定列つき）","生成ネイティブ音声の採否ルール（環境音・SE／台詞・ナレーションの線引き）","9:16・16:9・1:1 の書き出しファイルと書き出し仕様表（実測値）","配信面ごとの入稿規定確認記録（URL・確認日つき）","編集6工程の所要時間実測記録"],"constraints":["字幕は1行13〜15文字以内、2行以内、表示時間は文字数÷4秒以上","トランジションは1本あたり2箇所まで","台詞を映像に焼き込んだままの素材を納品候補に含めない","作業時間は90分以内。素材の再生成は行わず、既存素材の編集のみで仕上げる"]},"success":["字幕台本シートの判定列に NG が1件も残っていない","3比率すべてで主要被写体と文字が上下15%の余白を侵していない","使用した全音源にライセンスIDと顧客二次利用可否が記録されている","音を切った状態で、訴求内容が画面上の文字だけで判別できる","編集6工程の所要時間が実測値で記録され、合計が作業時間と整合している"],"rubric":[{"axis":"映像の品質","pass":"3点＝書き出し後の実ファイルで解像度・fps・尺が仕様どおり。5点＝3比率すべてで構図が成立しており、切り出しによる見切れがない。"},{"axis":"動きの自然さ","pass":"3点＝カット接続部で動きが飛んでいない。5点＝カット尺の方針（テンポ型か質感型か）が1本の中で統一され、選んだ理由を配信面で説明できる。"},{"axis":"ブランド整合性","pass":"3点＝字幕スタイルが1案件で統一されている。5点＝書体・色・エンドカードの要素がブランド規定と一致し、他案件と混ざらない。"},{"axis":"マーケ目的整合性","pass":"3点＝CTA が1つに絞られ画面上の文字で読める。5点＝音なしで冒頭2秒に何を見せるかが設計され、比率ごとに主要情報の配置を変えている。"},{"axis":"再現性","pass":"3点＝字幕台本と音源記録が単体で読める。5点＝台本と記録を渡すだけで他人が同じ字幕・同じ音の構成を再現できる粒度になっている。"},{"axis":"時間とコスト","pass":"3点＝6工程の所要時間が実測されている。5点＝工程別の時間から外注候補と自分が残すべき工程の仮説を立てている。"}],"pitfalls":[{"problem":"字幕を作ってからカットに入らないことに気づき、やり直す","cause":"文言を先に書き、尺との整合を実装段階で初めて確認している","fix":"カット尺（秒）× 4 で文字数上限を先に算出し、台本シートの判定列が全行 OK になるまでタイムラインに打ち込まない。上限を超えるメッセージはカットを分けるか文言を削る判断を台本段階で下す。"},{"problem":"英語を併記したら日本語も英語も読めなくなった","cause":"併記方式を選んだのに日本語の文字量を圧縮していない。1画面の文字量が2倍になり13〜15文字×2行の枠を超えている","fix":"併記を選んだ時点で日本語を10文字以下に圧縮する前提を置く。圧縮で訴求が壊れるなら方式を別バージョンに切り替える。判断は配信面を言語で分けられるかどうかの一点で決め、迷って両方作らない。"},{"problem":"納品後に顧客が映像を別用途に使い、音源ライセンスの範囲を超える","cause":"「自分が使える」範囲しか確認しておらず、顧客の二次利用範囲を記録していない","fix":"音源権利記録シートに顧客二次利用可否の判定列を必須にする。範囲外の音源は納品物に使わない。二次利用の範囲は3日目の納品テンプレートに明文化し、納品書で顧客に伝える。"},{"problem":"台詞の1文字を直すために映像の再生成コストが発生する","cause":"生成モデルのネイティブ音声で台詞を映像に焼き込んでいる","fix":"生成時の音声は常に仮として扱い、環境音とSEのみ採用し、台詞とナレーションは編集タイムライン上に置く。既に焼き込まれている素材は音声を切り、字幕と編集音声で代替する。この線引きを外注指示書にも明記する。"},{"problem":"トランジションを多用して画面が読めなくなる","cause":"カット間の色や明るさの飛びを隠す目的で効果を足している。AI生成素材は既に情報量が多い","fix":"トランジションは意味の区切りのみ、1本2箇所までと数を決める。違和感がある箇所はトランジションではなく、色調整か素材の差し替えで直す。隠す目的の使用は、隠していること自体が視聴者に見えると考える。"},{"problem":"入稿時に規定違反で弾かれ、原因の特定に時間がかかる","cause":"規定を記憶や過去案件の設定に頼っており、確認した時点の記録がない","fix":"配信面ごとに比率・解像度・最大ファイルサイズ・コーデック・尺上限・字幕の扱いを一次情報で確認し、URL と確認日と担当者を記録する手順を納品直前のルーチンに入れる。記録があれば差し戻しは規定変更として処理でき、原因調査が不要になる。"}],"resourceIds":["hf-help-marketing-studio","hf-academy-vfx"],"nextHint":"明日は出荷判定を作ります。今日の字幕・音・比率の確認項目を吸収して、最低20項目の品質チェックリストと納品物一式のテンプレートに仕上げます。","setup":{"tag":"編集のみ","model":"—（CapCut 等の編集ソフト。字幕・音・書き出し）","seconds":"—","res":"9:16 / 16:9 / 1:1 の3比率で書き出し","aspect":"3比率","outputs":"—","cap":"生成なし","credits":"クレジット消費なし","unlimited":"—","save":"編集工程にクレジットはかからない。生成で直そうとしていた問題の多くは、編集で切る・重ねるほうが速く安い。"}},{"id":"w5d3","day":3,"title":"出荷判定の品質チェックリストと納品仕様","subtitle":"合否を自分の感覚から切り離し、20項目以上の機械的な判定表に移す","why":"品質を自分の目で判断している限り、仕事は自分から離れません。判断が頭の中にあると外注できず、体調や締切で基準がぶれ、顧客に「前のほうが良かった」と言われたときに反論の根拠がありません。飲食店の仕込みと同じで、出荷判定が文書になっていて初めて人に任せられます。もう一つの理由は防衛です。修正回数と二次利用範囲を定義しないまま納品すると、無限修正と無断転用の両方を自分の負担で引き受けることになります。今日作るのは作品ではなく、合否を機械的に出す表と、顧客との約束を固定する書式です。","goals":["7カテゴリ・最低20項目の品質チェックリストを、YES/NO で判定できる文に揃えて作成できる","出荷を止める致命項目と、記録して出荷する軽微項目を区別して運用できる","ラウドネス・セーフエリア・コーデック・ビットレートを数値で指定した技術仕様欄を書ける","表現の事実確認とAI生成の扱いをチェックリストに組み込み、確認者と確認日を残せる","納品物一式のテンプレート（納品書・修正回数の定義・二次利用範囲）を文書として完成できる"],"duration":"85分","timeBreakdown":[{"label":"理解","min":25},{"label":"チェックリスト作成と実適用","min":40},{"label":"納品テンプレート作成","min":20}],"tools":["スプレッドシート（チェックリスト・判定記録）","文書作成ツール（納品書・仕様書テンプレート）","編集ソフト（ラウドネス計測、セーフエリア表示、書き出し設定の確認）","Higgsfield（利用規約の商用利用条項の確認）"],"prereq":["2日目までに3比率の書き出しファイルが存在すること","Week 3 で作成した表現確認シート（施設の設備・サービスに関する表現の裏取り様式）が手元にあること","音源権利記録シートと入稿規定確認記録が揃っていること"],"theory":[{"heading":"チェックリストは判定文の形で書く","body":"機能しないチェックリストには共通点があります。項目が「品質を確認する」「違和感がないか見る」のような、評価者の判断を要求する文になっていることです。これでは人によって結果が変わるため、外注の品質ゲートになりません。\n\n項目は次の3条件を満たす文にします。\n\n1. **YES か NO で答えられる**。「字幕は読みやすいか」ではなく「全字幕が1行13文字以内かつ2行以内か」。\n2. **数値または場所で書かれている**。「音量が適切か」ではなく「統合ラウドネスが指定値の±1LU以内か」。\n3. **確認方法が項目文から読める**。どこを見れば判定できるかが書かれていれば、初見の人でも実行できます。\n\n項目数は最低20。カテゴリは7つに分けます。\n\n- A. 映像の破綻（指・手足・物体の形、背景の歪み、フレーム落ち）\n- B. 文字と字幕（文字崩れ、誤字、文字数、はみ出し、セーフエリア）\n- C. ブランド整合（色、書体、ロゴ、トーン、禁止表現）\n- D. 尺と構成（尺、冒頭2秒、CTA、トランジション数）\n- E. 音（ラウドネス、ピーク、権利記録、台詞の焼き込み）\n- F. 技術仕様（解像度、fps、コーデック、ビットレート、ファイルサイズ、入稿規定）\n- G. 表現と開示（事実確認、裏取り、AI生成の扱い、肖像・音声の同意）\n\n7カテゴリ×3項目で21項目が最低ラインです。実務では30項目前後になります。項目が増えて所要時間が10分を超えるなら、致命項目と軽微項目に分けて運用を変えます。"},{"heading":"致命項目と軽微項目を分けて止める基準を決める","body":"全項目を同じ重さで扱うと、軽微な指摘で出荷が止まり、逆に重大な欠陥が「ひとつくらい」で通ります。重みを2段階にします。\n\n**致命項目（1件でも NO なら出荷停止）**\n- 人物の手足・指の明確な破綻、物体の融合など、見た人が生成物だと気づく破綻\n- 文字の誤字・崩れ（特に施設名、価格、日付、連絡先）\n- 事実と異なる表現（存在しない設備、提供していないサービス、根拠のない数値）\n- 音源のライセンス記録欠落、肖像・音声の同意欠落\n- 入稿規定を満たさない技術仕様\n\n**軽微項目（NO でも記録して出荷可、次案件で改善）**\n- カット間の色味のわずかなばらつき\n- トランジションの箇所数が方針より1つ多い\n- 字幕スタイルの細部の不統一\n\n分け方の基準は1つです。**顧客または顧客の顧客に不利益が生じるか**。誤字と事実誤認と権利欠落は不利益が生じるので致命です。色のばらつきは生じないので軽微です。この基準を明文化しておくと、新しい項目を追加するときに自分で振り分けられます。\n\n判定記録の様式は `案件 / 納品尺 / 比率 / 判定日 / 判定者 / 致命NO件数 / 軽微NO件数 / 出荷可否 / 備考`。致命NOが1件以上あるのに出荷可になっている行が存在しない、という状態を維持します。"},{"heading":"技術仕様は数値で固定する","body":"技術仕様を感覚で扱うと、入稿で弾かれるか再生環境でトラブルが起きます。固定すべき項目と、数値を決めるときの考え方です。\n\n- **ラウドネス**：統合ラウドネス（LUFS）を1つの基準値に決め、許容幅を±1LUとします。基準値は配信面の推奨値に合わせるのが原則で、推奨値は面ごとに違い変更もされるため、確認記録シートに面ごとの値と確認日を持たせます。重要なのは、案件ごとに測って合わせる工程が手順に入っていることです。SNSの動画は面側で音量が正規化されるため、過度に大きく作ると圧縮されて痩せます。\n- **トゥルーピーク**：クリップを避けるため上限を決めます（一般に -1dBTP 前後）。これも面の規定を確認します。\n- **セーフエリア**：2日目で決めた上下10〜15%の余白を、編集ソフトのガイド表示で可視化して判定します。目視ではなくガイドで見ます。\n- **コーデックとコンテナ**：H.264 / MP4 を基本線とし、面ごとの対応を確認記録で持ちます。\n- **ビットレート**：解像度と fps に応じて決め、固定値をプリセットとして保存します。低すぎると暗部にブロックノイズが出て、せっかく作った質感が消えます。高すぎると最大ファイルサイズ制限に当たります。**両側に制約がある**ことを理解し、面ごとの最大ファイルサイズから逆算した上限を仕様表に書きます。\n- **ファイルサイズ**：書き出し後の実ファイルで測り、面の上限と比較します。\n\n書き出し設定はプリセットとして保存し、プリセット名を納品記録に書きます。「どの設定で書き出したか」が後から特定できないと、再書き出しの再現ができません。"},{"heading":"表現の事実確認とAI生成の扱い","body":"AI生成素材の最大のリスクは画質ではなく、**実在しないものを説得力のある映像として描いてしまうこと**です。宿泊施設の映像で、実際には無い最上階のラウンジや、実際とは違う客室の広さ、実際には見えない景色が映っていれば、それは誤表示です。顧客は気づかずに公開し、宿泊客が現地で落差を感じ、クレームと評価低下が顧客に発生します。制作側の責任問題になります。\n\nWeek 3 で作成した表現確認シートをここに接続します。チェックリストの G カテゴリには次を入れます。\n\n- 映像に映るすべての設備・空間・景色が実在することを、施設側の確認済み資料または担当者の確認で裏取りしているか\n- 数値表現（広さ、距離、所要時間、人数、価格、期間）に根拠資料があるか\n- 景観カットが実際にその客室から見える景色と整合しているか（別の街区の夜景、別の季節が混ざっていないか）\n- 人物が映る場合、肖像の権利と同意があるか。合成人物の場合、実在人物に見える扱いをしていないか\n- 確認者名と確認日が記録されているか\n\nAI生成であることの扱いについては、執筆時点の利用規約では、**法が求める場合のAI生成の開示が必要**であり、来歴表示の除去は禁止されています。したがって実務の運用は、①顧客に対しては生成AIを使用した旨を必ず伝え納品書に記載する、②最終的な表示義務の有無は配信面の規定と適用される法令で確認し確認記録を残す、という二段構えにします。開示が不要だと自分で判断して省略するのではなく、確認した結果として記録に残してください。なお規約には商用利用に関する記述の不整合（Soul のページは画像の商用利用可と明記、Sora 2 のページは商用利用を有料プランに紐づけている）があるため、使用したモデルごとに条件を確認する欄も作ります。"},{"heading":"納品テンプレートは約束を固定する書式","body":"納品物は映像ファイルだけではありません。一式に含めるものを決めておくと、毎回の判断が消え、顧客からの追加要求に線を引けます。\n\n**納品物一式の構成**\n1. 映像ファイル（尺別・比率別。ファイル名は命名規則準拠、版番号つき）\n2. サムネイル／エンドカードの静止画\n3. 納品書\n4. 使用素材の権利記録（音源ライセンス、肖像同意の有無）\n5. 技術仕様表（解像度・fps・コーデック・ビットレート・ラウドネス・書き出しプリセット名）\n6. 品質チェックリストの判定記録（判定者・判定日つき）\n\n**納品書に書く項目**\n- 案件名、納品日、納品版番号、ファイル一覧（用途と比率を明記）\n- 制作に生成AIを使用した旨\n- **修正回数の定義**：ここを定義しないと無限修正になります。定義すべきは3点です。（a）含まれる修正回数（例：2回）、（b）1回の範囲（例：1回につき指摘事項をまとめて1通で受け、文言・字幕・カット順・尺の調整を対象とする）、（c）**追加費用が発生する変更の例示**（新規素材の生成を伴う変更、訴求軸の変更、比率の追加、尺の追加）。回数だけ書いて範囲を書かないと「1回」の解釈で揉めます。\n- **二次利用範囲**：使用できる媒体（自社SNS、自社サイト、OTA掲載、有料広告配信、店頭サイネージ、印刷物からの切り出し）、使用期間、改変の可否、第三者への再提供の可否を列挙して可／不可を明示します。音源ライセンスの範囲を超える用途は不可として明記します。\n- 素材の保管期間と、保管期間後の再納品可否\n\n修正回数と二次利用範囲は、Week 6 の価格設計で単価の根拠になります。「安いが修正無制限」と「高いが2回まで」を比較できる形にしておくと、値付けの会話が感覚論になりません。"}],"steps":[{"n":1,"action":"7カテゴリの枠を作り既存の確認項目を流し込む","detail":"A映像の破綻／B文字と字幕／Cブランド整合／D尺と構成／E音／F技術仕様／G表現と開示の7カテゴリでシートを作ります。1日目の素材チェック項目、2日目の字幕・音・比率の確認項目、Week 3 の表現確認シートの項目を該当カテゴリへ転記します。この時点では文の形は整えません。","check":"7カテゴリすべてに1項目以上が入り、重複が除かれている"},{"n":2,"action":"全項目を YES/NO 判定文に書き換える","detail":"各項目を「〜か」で終わる疑問文に直し、数値・場所・確認方法を含めます。評価者の判断を要求する語（適切、きれい、違和感、十分）が残っていたら書き換え対象です。各カテゴリ3項目以上、合計20項目以上にします。","check":"全項目が YES/NO で答えられる文になり、判断語が1つも残っていない"},{"n":3,"action":"致命項目と軽微項目を振り分ける","detail":"各項目に重み列を付け、「顧客または顧客の顧客に不利益が生じるか」を基準に致命／軽微を決めます。誤字・事実誤認・権利欠落・入稿規定違反・明確な映像破綻は致命です。振り分けの基準文をシートの先頭に書き、後から項目を追加する人が同じ判断を下せるようにします。","check":"全項目に重みが付き、基準文がシート上に書かれている"},{"n":4,"action":"ラウドネスとピークを測って基準値を決める","detail":"編集ソフトのラウドネス計測機能で、2日目に仕上げた1本の統合ラウドネスとトゥルーピークを測ります。配信面の推奨値を一次情報で確認し、面ごとの基準値と確認日を記録します。自分の基準値と許容幅±1LUを仕様表に書き、現在の素材が範囲内かを判定します。","check":"測定値と面ごとの基準値が記録され、範囲内／範囲外が判定されている"},{"n":5,"action":"セーフエリアをガイド表示で判定する","detail":"編集ソフトのセーフエリアまたはガイド表示を有効にし、上下10〜15%の余白に文字が侵入していないかを3比率すべてで確認します。目視ではなくガイド線で判定します。侵入箇所があればカット番号を記録し、配置を修正します。","check":"3比率すべてでガイド線内に文字が収まっていることを確認済み"},{"n":6,"action":"書き出しプリセットを作成して名前を付ける","detail":"比率別・用途別にコーデック（H.264 等）・コンテナ（MP4）・ビットレート・解像度・fps を設定したプリセットを保存し、識別しやすい名前を付けます（例：`VERT_1080x1920_30p_H264_8M`）。面ごとの最大ファイルサイズから逆算したビットレート上限を仕様表に併記します。","check":"プリセットが保存され、名前から設定内容が読み取れる"},{"n":7,"action":"表現の事実確認を G カテゴリに実装する","detail":"Week 3 の表現確認シートを参照し、映る設備・空間・景色の実在、数値表現の根拠、景観の整合、肖像の同意、確認者名と確認日の記録を項目化します。実際の素材に適用し、裏取りできていない表現があれば該当カットを出荷停止として記録します。","check":"全カットについて実在性と数値根拠の判定が入り、確認者名と確認日が記録されている"},{"n":8,"action":"AI生成の開示に関する確認欄を作る","detail":"顧客への通知（納品書に記載）と、配信面および適用法令における表示義務の確認（確認URL・確認日）の2欄を作ります。使用したモデルごとに、商用利用条件を確認した記録も残します。利用規約内に商用利用の記述の不整合があるため、モデル単位で確認する前提にします。","check":"顧客通知欄と表示義務の確認記録欄が存在し、使用モデル分の確認行が埋まっている"},{"n":9,"action":"チェックリストを実素材に通して所要時間を測る","detail":"2日目に仕上げた3比率のうち1本に対して、全項目を頭から適用します。所要時間を計測します。判定に迷った項目は文が曖昧だということなので、その場で書き直します。致命NOが出た場合は出荷停止として記録し、修正してから再判定します。","check":"全項目の判定が埋まり、適用の所要時間が記録されている"},{"n":10,"action":"納品書テンプレートを作る","detail":"案件名・納品日・版番号・ファイル一覧（用途と比率）・生成AI使用の明記・修正回数の定義・二次利用範囲・素材保管期間の各欄を持つ書式を作ります。修正回数は（a）含まれる回数（b）1回の範囲（c）追加費用が発生する変更の例示の3点を必ず書きます。","check":"テンプレートに修正回数の3点と二次利用範囲の可否列がすべて記載されている"},{"n":11,"action":"二次利用範囲を媒体別の可否表にする","detail":"自社SNS／自社サイト／OTA掲載／有料広告配信／店頭サイネージ／印刷物への切り出し／第三者への再提供の各媒体について、可・不可・要相談を決めます。音源ライセンスの範囲を超える用途は不可とし、理由を併記します。使用期間と改変の可否も列として持ちます。","check":"全媒体に可否が入り、不可の行に理由が書かれている"},{"n":12,"action":"納品物一式を実際に1案件分そろえる","detail":"映像ファイル（尺別・比率別）、サムネイル／エンドカード、納品書、権利記録、技術仕様表、チェックリスト判定記録の6点を `05_納品` に配置します。欠けている書類があれば、それは納品一式の定義が運用できていないということなので、テンプレート側を修正します。","check":"`05_納品` に6点すべてが揃い、ファイル名が命名規則に準拠している"}],"prompts":[{"label":"品質チェックリストの管理形式（抜粋・判定文の書き方見本）","text":"[ID: QC-V2 | SCOPE: video delivery | ITEMS: 24 | CATEGORIES: 7 | OWNER: {{REVIEWER}} | LAST_UPDATED: ----/--/--]\nA1 | FATAL | Are all hands, fingers and limbs free of visible deformation in every cut?\nB3 | FATAL | Is every on-screen character of the property name, price and date spelled correctly against the source document?\nB4 | MINOR | Is every subtitle line within 13 characters and 2 lines?\nE1 | FATAL | Is the integrated loudness within 1 LU of the target value recorded in the delivery spec?\nF2 | FATAL | Does the exported file meet the platform spec recorded on {{SPEC_CHECK_DATE}} for aspect, resolution, codec and maximum file size?\nG2 | FATAL | Is every facility, space and view shown in the video confirmed to exist by the client's source document or named contact?","note":"チェックリストを資産として管理する形式。ヘッダに版・項目数・カテゴリ数・所有者・最終更新日を持たせ、各行は `ID | 重み | 判定文` の3要素に固定する。判定文を英語で持つのは、海外の外注者にそのまま渡せる形にしておくため。日本語版と対訳で管理し、どちらが正かをヘッダに1行で書く。FATAL が1件でも NO なら出荷停止という運用規則を同じシートの先頭に書いておく。","status":"未検証","flow":{"code":"DOC","step":"工程1 / 3","input":"Week 1〜4 で各日に書き溜めた確認項目の全件と、7カテゴリの枠、および致命／軽微の重み判定","output":"ID・重み・判定文の3要素に揃った24項目のチェックリスト1枚","next":"Day 5 の4段階の品質ゲートに項目を割り振り、外注者に配布する"}},{"label":"納品技術仕様表の記述形式","text":"[DELIVERY SPEC | PROJECT: {{PROJECT_CODE}} | VER: {{VERSION}} | DATE: ----/--/--]\nASSET: {{FILENAME}}\nASPECT: 9:16 | RESOLUTION: 1080x1920 | FPS: 30 | DURATION: 15.0s\nCODEC: H.264 | CONTAINER: MP4 | BITRATE: {{MBPS}} Mbps | FILE SIZE: {{MB}} MB\nAUDIO: integrated loudness {{LUFS}} LUFS | true peak {{DBTP}} dBTP\nEXPORT PRESET: VERT_1080x1920_30p_H264_8M\nSAFE AREA: top 15% / bottom 15% kept clear | verified with guide overlay\nPLATFORM SPEC SOURCE: {{URL}} | checked ----/--/-- by {{REVIEWER}}\nAI DISCLOSURE: generative AI used | client notified in delivery note | platform requirement checked ----/--/--","note":"納品書に添付する技術仕様の固定書式。1ファイル1ブロックで書き、ファイルが増えればブロックを足す。書き出しプリセット名を含めるのが要点で、これがないと同一条件の再書き出しが再現できない。PLATFORM SPEC SOURCE と AI DISCLOSURE の確認日を書式に埋め込んでおくと、確認を飛ばした時に空欄として露出する。空欄が残る書式は未完成として扱う。","status":"未検証","flow":{"code":"DOC","step":"工程3 / 3","input":"実際に書き出した納品ファイル1本ごとの解像度・fps・尺・コーデック・ビットレート・ラウドネスの実測値と、書き出しプリセット名","output":"空欄が1つも残っていない、1ファイル1ブロックの納品技術仕様表","next":"納品書に添付し、同一条件で再書き出しするための根拠として保管する"}},{"label":"表現の事実確認シートの行形式","text":"[FACT CHECK | PROJECT: {{PROJECT_CODE}} | CONFIRMED BY: {{CLIENT_CONTACT}} | DATE: ----/--/--]\nCUT | ON-SCREEN CLAIM | TYPE (facility/space/view/number/service) | SOURCE DOCUMENT | STATUS (confirmed/pending/rejected)\nC02 | rooftop terrace visible at dusk | facility | {{DOC_NAME}} p.{{PAGE}} | confirmed\nC05 | \"{{DISTANCE}} min walk from the station\" | number | {{DOC_NAME}} p.{{PAGE}} | pending\nC07 | city skyline view from the twin room window | view | site photo {{FILE_ID}} | confirmed","note":"Week 3 の表現確認シートを納品前の出荷判定に接続するための行形式。映像に映っている主張を1行1件で書き出し、種別と根拠資料と確認状態を持たせる。pending が1件でも残っていれば出荷停止として扱う。rejected の行は該当カットの差し替えか削除が必要で、判断を顧客に委ねずに制作側で止める。確認者は施設側の実名担当者にして、確認日を必ず入れる。","status":"未検証","flow":{"code":"DOC","step":"工程2 / 3","input":"映像に映っている施設・空間・景観・数値・サービスの主張を全件書き出したものと、施設側の一次資料","output":"全行が confirmed になった、カット単位の事実確認シート1枚","next":"pending が1件でも残っていれば出荷を止める。確認後に納品仕様へ進む"}}],"expected":"手元に20項目以上・7カテゴリの品質チェックリストがあり、全項目が YES/NO 判定文で、致命／軽微の重みが付いています。実素材1本に通した判定記録と適用所要時間が残っています。納品書テンプレートには修正回数の3点（回数・1回の範囲・追加費用が発生する変更の例示）と媒体別の二次利用可否表が入っています。`05_納品` には映像・静止画・納品書・権利記録・技術仕様表・判定記録の6点が命名規則どおりに揃っています。","assignment":{"title":"出荷判定チェックリストと納品一式テンプレートの完成","brief":"自分の目を使わずに合否が出る判定表を作り、顧客との約束を固定する書式を完成させます。対象は2日目に仕上げた東京の宿泊施設向け動画です。チェックリストは他人が初見で実行できる粒度にしてください。判定基準は、自分がいなくても同じ合否が出るかどうかです。納品書テンプレートは実際の案件名を入れて1件分を埋め、空欄が残らない状態まで作り切ります。空欄が残るなら、それは確認を飛ばした証拠として扱います。","deliverables":["品質チェックリスト（7カテゴリ・20項目以上・YES/NO判定文・致命／軽微の重みつき）","致命／軽微の振り分け基準文","判定記録シート（実素材1本への適用結果・判定者・判定日・所要時間）","納品技術仕様表（書き出しプリセット名・ラウドネス実測値つき）","表現の事実確認シート（カット別・根拠資料・確認者・確認日）","AI生成の開示に関する確認記録（顧客通知欄＋表示義務の確認URL・確認日＋モデル別の商用利用条件確認）","納品書テンプレート（修正回数の3点定義・媒体別二次利用可否表を含む）","納品物一式（`05_納品` に6点配置済み）"],"constraints":["チェックリストの全項目に「適切」「きれい」「違和感」「十分」といった判断語を使わない","項目数は20以上。1本への適用が15分以内に終わる構成にする","致命NOが1件以上ある状態で出荷可と記録しない","新規の映像生成は行わない。既存素材の判定と書類作成のみ","作業時間は90分以内"]},"success":["チェックリストが7カテゴリ・20項目以上で、全項目に致命／軽微の重みが付いている","全項目が YES/NO で答えられる文になっており、判断語が含まれていない","実素材1本への適用が完了し、判定者・判定日・所要時間が記録されている","表現の事実確認シートに pending が残っていないか、残っている場合は出荷停止として記録されている","納品書テンプレートに修正回数の3点と媒体別二次利用可否がすべて記載され、空欄がない"],"rubric":[{"axis":"映像の品質","pass":"3点＝映像破綻カテゴリの項目で実素材を判定し結果を記録している。5点＝破綻の発生箇所をカット単位で特定し、原因（モデル・プロンプト・参照）まで記録している。"},{"axis":"動きの自然さ","pass":"3点＝動きの破綻に関する判定項目が存在する。5点＝フレーム落ちや速度変換による不自然さを fps 記録と突き合わせて判定している。"},{"axis":"ブランド整合性","pass":"3点＝色・書体・ロゴ・禁止表現の項目が入っている。5点＝顧客のブランド規定文書と項目が1対1で対応しており、規定更新時にどの項目を直すかが分かる。"},{"axis":"マーケ目的整合性","pass":"3点＝CTA と冒頭2秒に関する判定項目がある。5点＝配信面ごとに判定値が変わる項目（尺上限・ラウドネス・字幕の扱い）を面別に持っている。"},{"axis":"再現性","pass":"3点＝チェックリストが単体で読める。5点＝初見の第三者が実行して同じ合否に到達する粒度で、致命／軽微の振り分け基準文があるため新項目も自力で分類できる。"},{"axis":"時間とコスト","pass":"3点＝チェックリスト適用の所要時間を実測している。5点＝適用時間を工数として原価に算入し、致命項目だけの簡易版と全項目版の2段運用を設計している。"}],"pitfalls":[{"problem":"チェックリストを作ったのに人によって合否が変わる","cause":"項目文に「適切」「違和感がない」といった評価者の判断を要求する語が残っている","fix":"全項目を数値・場所・確認方法を含む YES/NO 疑問文に書き換える。判断語を検索して1件も残っていないことを確認する。判定に迷った項目はその場で文を直し、版番号を上げる。"},{"problem":"軽微な指摘で出荷が止まり、締切に間に合わない","cause":"全項目を同じ重さで扱っている","fix":"顧客または顧客の顧客に不利益が生じるかを基準に致命／軽微を振り分け、致命のみを出荷停止条件にする。軽微NOは記録して出荷し、次案件の改善項目として持ち越す運用を明文化する。"},{"problem":"音量が面によって大きすぎたり小さすぎたりする","cause":"ラウドネスを測らずに耳で合わせている。SNSの面側で音量が正規化されることを考慮していない","fix":"統合ラウドネスとトゥルーピークを計測機能で測り、面ごとの推奨値を一次情報で確認して基準値を決める。許容幅±1LU を仕様表に書き、判定項目に組み込む。過度に大きく作ると圧縮されて痩せるため、基準値を超えない方向で合わせる。"},{"problem":"実在しない設備や景色を映した映像を納品してしまう","cause":"生成素材の説得力が高く、事実確認の工程が判定に組み込まれていない","fix":"映像に映る主張を1行1件で書き出す事実確認シートを作り、種別・根拠資料・確認者・確認日を埋める。pending が1件でも残っていれば出荷停止とする。確認は制作側で止め、顧客の目視確認だけに依存しない。"},{"problem":"修正が何度も続き、1本の原価が見積の数倍になる","cause":"納品書に修正回数を書いているが1回の範囲を定義していないため、解釈が分かれている","fix":"修正回数の定義を（a）含まれる回数（b）1回の範囲（指摘をまとめて1通で受ける・対象は文言・字幕・カット順・尺）（c）追加費用が発生する変更の例示（新規生成を伴う変更・訴求軸変更・比率追加・尺追加）の3点セットで書く。4日目の原価計算で修正対応時間を実測し、回数の妥当性を検証する。"},{"problem":"納品した映像が想定外の媒体で使われ、音源ライセンスの範囲を超える","cause":"二次利用範囲を口頭や曖昧な文言で済ませている","fix":"媒体別（自社SNS／自社サイト／OTA掲載／有料広告配信／店頭サイネージ／印刷物切り出し／第三者再提供）の可否表を納品書に添付し、不可の行に理由を書く。音源ライセンスの範囲を超える用途は不可と明記し、必要なら範囲の広いライセンスを買い直して価格に乗せる。"}],"resourceIds":["hf-terms","hf-blog-genjutsu"],"nextHint":"明日は数字です。今日測ったチェックリストの適用時間と、2日目の編集6工程の実測を入力にして、クレジット実費と人件時間から1本あたりの原価を算出します。","setup":{"tag":"生成なし","model":"—（品質チェックリストと納品仕様の作成）","seconds":"—","res":"—","aspect":"—","outputs":"—","cap":"生成なし","credits":"クレジット消費なし","unlimited":"—","save":"出荷判定の仕組みを作る日。チェックリストがないと、納品後に見つかった破綻を無償で作り直すことになり、それが最大の原価になる。"}},{"id":"w5d4","day":4,"title":"原価と時間の計算表を実測で完成させる","subtitle":"採用率と時給を入れて、1本あたりいくらで回っているかを確定する","why":"原価がわからない状態で受注するのは、仕入れ値を知らずにメニュー価格を決めるのと同じです。広告運用でROASを見てきたあなたなら、分母が曖昧な数字が意思決定に使えないことは分かるはずです。AI動画の原価は特に読みにくい構造をしています。生成は失敗するので採用率で割り増しになり、ツール代は固定費で本数に応じて単価が変わり、さらに自動化を進めると課金条件そのものが変わります。今日はこの3つを1枚の表に入れます。この表がないままWeek 6の価格設計に入ると、全部が推測になります。","goals":["クレジット実費を公開単価から計算し、採用率で割り戻した実質原価を算出できる","編集・修正・ディレクションの時間を自分の時間単価で金額化し、変動費に算入できる","ツール月額を固定費として配分し、月間本数による単価変動を計算できる","サイト上の生成とMCP・CLI・Canvas・Supercomputer 経由の生成で課金条件が変わることを計算表に反映できる","為替前提と算出日を明記し、損益分岐本数を自分の数字で出せる"],"duration":"85分","timeBreakdown":[{"label":"理解","min":25},{"label":"計算表の構築","min":40},{"label":"損益分岐の検証と記録","min":20}],"tools":["スプレッドシート（原価計算表）","Week 1 から蓄積した制作台帳（生成回数・採用可否・消費クレジット・所要時間）","Higgsfield（クレジット残量の推移、プラン画面での付与量の確認）","為替レートの参照元（算出日のレートを記録）"],"prereq":["Week 1 から運用している制作台帳に、生成回数と採用可否の記録が蓄積されていること","2日目の編集6工程の所要時間実測が存在すること","3日目のチェックリスト適用時間の実測が存在すること"],"theory":[{"heading":"クレジット実費は公開単価から積む","body":"執筆時点（確認日2026-10-11）の換算は **1ドル = 20クレジット、つまり1クレジット = $0.05** です。公開されている生成あたりの単価はこれです。\n\n| 生成物 | クレジット | 概算USD |\n|---|---|---|\n| Ads Studio 静止画広告 1点 | 4 | $0.20 |\n| Ads Stud
