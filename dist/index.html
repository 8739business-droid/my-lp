-10-11","duration":"10分","summary":"静止画広告に特化した新機能。ブランドキット（ロゴ・色・フォント・トーン・ターゲット・訴求軸）、商品カタログ取込、訴求軸ベースのコンセプト生成、1商品あたり最大20案の一括生成。静止画1点4クレジット、20点バッチ80クレジット。","useFor":"Week 4 のテスト設計。動画の前に静止画で訴求軸を安く多数テストする、という設計が可能になる。動画は Marketing Studio 側である点に注意。"},{"id":"hf-blog-ad-multiplier","category":"official-blog","title":"Ad Multiplier","provider":"Higgsfield ブログ","url":"https://higgsfield.ai/blog/ad-multiplier-ads-studio","lang":"en","status":"確認済み","checkedOn":"2026-10-11","duration":"10分","summary":"既存の動画広告の動き・構図・カット・尺を保ったまま、人物・商品・衣装・ロケーション・フック・スクリプト・CTAを差し替えた変種を生成する機能。入力は4〜30秒の動画と画像最大20点。フック＋CTA変更で最大140クレジット、CTAのみで最大35クレジット。","useFor":"Week 4 の中核。映像変数を固定してメッセージ変数だけを変えるという、広告テストとして正しい比較がこの機能で現実的になる。"},{"id":"hf-blog-genjutsu","category":"official-blog","title":"Higgsfield Genjutsu","provider":"Higgsfield ブログ","url":"https://higgsfield.ai/blog/higgsfield-genjutsu","lang":"en","status":"確認済み","checkedOn":"2026-10-11","duration":"8分","summary":"既存動画の部分編集。動きを別の対象に移す Motion Transfer と、物体を差し替える Object Swap。入力は4〜30秒、参照最大30点、出力は最大1080p。","useFor":"Week 5 の修正対応。全体を作り直さずに部分だけ直せるため、修正回数が原価に直結する受託業務では重要な機能。"},{"id":"hf-terms","category":"official-legal","title":"Higgsfield 利用規約","provider":"Higgsfield","url":"https://higgsfield.ai/terms-of-use-agreement","lang":"en","status":"確認済み","checkedOn":"2026-10-11","duration":"30分","summary":"出力の所有権を主張せず商用利用を制限しない旨が定められている（解約後も書き出し済み出力の権利は存続し、顧客への移転・サブライセンスが可能）。一方で、出力の唯一性は保証されない、権利処理は利用者の責任、アップロードする人物の肖像・音声には権利と同意が必要、法が求める場合はAI生成であることの開示が必要、来歴表示の除去は禁止、各モデル提供元の規約も適用され厳しい方が優先、といった条件が付く。","useFor":"Week 3 Day 4・Week 6 Day 4 で必読。顧客に納品する事業である以上、ここを読まずに契約条項は書けない。なお Soul のページと Sora 2 のページでは商用利用の記述が食い違っているため、使用するモデルごとに個別確認すること。法的判断が必要な場面では専門家に相談すること。"},{"id":"hf-privacy","category":"official-legal","title":"Higgsfield プライバシーポリシー","provider":"Higgsfield","url":"https://higgsfield.ai/privacy-policy","lang":"en","status":"確認済み","checkedOn":"2026-10-11","duration":"20分","summary":"入力・出力の取り扱い、モデル学習への利用に関する規定を含む。","useFor":"顧客から提供された写真・映像をアップロードする前に確認が必要。顧客の守秘情報を扱う場合は、事前に取り扱い条件を合意しておくこと。"},{"id":"hf-youtube","category":"official-doc","title":"Higgsfield 公式 YouTube","provider":"Higgsfield","url":"https://www.youtube.com/@HiggsfieldAI","lang":"en","status":"確認済み","checkedOn":"2026-10-11","duration":"—","summary":"公式チャンネル。新機能のデモや作例が中心。","useFor":"文字の説明で掴みにくい操作感を確認したいとき。"},{"id":"hf-discord","category":"official-doc","title":"Higgsfield Discord コミュニティ","provider":"Higgsfield","url":"https://discord.com/invite/higgsfield","lang":"en","status":"確認済み","checkedOn":"2026-10-11","duration":"—","summary":"ユーザーコミュニティ。不具合の発生状況や、プロンプトの実例が流れている。","useFor":"生成がうまくいかないとき、自分の環境の問題か仕様かを切り分ける。ただし書かれている内容は公式仕様ではない。"},{"lang":"en","status":"確認済み","checkedOn":"2026-10-11","id":"hf-prompt-bank","category":"official-doc","title":"Academy プロンプトバンク（カメラ移動46例）","provider":"Higgsfield Academy","url":"https://higgsfield.ai/academy/apps/prompt-bank","duration":"20分","summary":"カメラ移動のプロンプト例46件を分類して収録。静止1件、パン・ティルト8件、ズーム・フォーカス7件、ドリー・トラッキング17件、空撮・クレーン6件、特殊7件。ドリーズーム、ラックフォーカス、クレーンアップ、ドローンオービット、エアリアルプルバックなどを含む。照明と構図のカテゴリは存在しない。","useFor":"Week 1 Day 4 のカメラ語彙対照表を作るときの語彙源。日本語の演出意図を左列に置き、ここの英語表現を右列に転記していくと、顧客の要望を即座にプロンプトへ変換できる辞書になる。"},{"lang":"en","status":"確認済み","checkedOn":"2026-10-11","id":"sb-sizes","category":"craft","title":"ショットサイズの完全ガイド","provider":"StudioBinder（2026年3月更新）","url":"https://www.studiobinder.com/blog/types-of-camera-shots-sizes-in-film/","duration":"25分","summary":"ショットサイズだけを深く扱う。エスタブリッシング、エクストリームワイド、ワイド、フル、ミディアムワイド、カウボーイ、ミディアム、ミディアムクローズアップ、クローズアップ、エクストリームクローズアップを、実際の映画の例とともに解説。","useFor":"Week 1 Day 4 の最初に読む1本。ショットサイズの語彙はこの記事で揃う。英語だが図版が多く、用語と画の対応が目で追える。"},{"lang":"en","status":"確認済み","checkedOn":"2026-10-11","id":"sb-movement","category":"craft","title":"カメラムーブメントの種類","provider":"StudioBinder","url":"https://www.studiobinder.com/blog/different-types-of-camera-movements-in-film/","duration":"25分","summary":"静止、パン、ウィップパン、ティルト、プッシュイン、プルアウト、ズーム、ドリーズーム、ロール、トラッキング、トラック、ステディカム、アーク、ブーム、手持ちを整理。ズームは厳密にはカメラの移動ではないという区別も扱う。","useFor":"Academy のプロンプトバンクと対で使う。あちらは英語の言い回し、こちらは各移動が何を意味し何を伝えるかの理解。Week 1 Day 4。"},{"lang":"en","status":"確認済み","checkedOn":"2026-10-11","id":"sb-3point","category":"craft","title":"3点照明：キー・フィル・バックライト","provider":"StudioBinder","url":"https://www.studiobinder.com/blog/three-point-lighting/","duration":"20分","summary":"キーライト、フィルライト、バックライトの役割と、キーとフィルの比率が印象をどう変えるかを扱う。比率を変えるだけで、映画的な見え方と平板な商業写真的な見え方の間を移動できることが示される。","useFor":"Week 1 Day 5。「キーとフィルの比率」という概念を持つと、光をプロンプトで指定できるようになる。食品の半逆光構成を理解する下地になる。"},{"lang":"en","status":"確認済み","checkedOn":"2026-10-11","id":"sb-dof","category":"craft","title":"被写界深度とは","provider":"StudioBinder","url":"https://www.studiobinder.com/blog/what-is-depth-of-field/","duration":"15分","summary":"被写界深度の定義、浅い場合と深い場合の違い、それを決める4つの要因（絞り、被写体までの距離、焦点距離、センサーサイズ）とF値の挙動。","useFor":"Week 1 Day 4。料理は浅く、客室は深く、という業態別の初期設定がなぜそうなるかを物理で理解する。"},{"lang":"en","status":"確認済み","checkedOn":"2026-10-11","id":"sb-focal","category":"craft","title":"焦点距離とレンズの使い分け","provider":"StudioBinder","url":"https://www.studiobinder.com/blog/what-is-focal-length/","duration":"15分","summary":"広角・標準・望遠・魚眼の違い。望遠は空間を圧縮して親密さを作り、広角は空間を広げて被写体を孤立させる。ドリーズームも扱う。","useFor":"Week 1 Day 4。「もっと広く見せて」「もっと美味しそうに」という顧客の言葉を焦点距離に翻訳する根拠になる。"},{"lang":"en","status":"確認済み","checkedOn":"2026-10-11","id":"sb-thirds","category":"craft","title":"三分割法と構図","provider":"StudioBinder","url":"https://www.studiobinder.com/blog/rule-of-thirds/","duration":"15分","summary":"三分割のグリッド、中心を外した配置、余白、視線の先の空間と頭上の余白、そして三分割を崩したほうが機能する場合。","useFor":"Week 1 Day 4、Week 4 Day 2。縦型動画でテキストの居場所を確保する構図設計に直結する。"},{"lang":"en","status":"確認済み","checkedOn":"2026-10-11","id":"asc-ad","category":"craft","title":"Shot Craft：広告撮影の技法","provider":"American Society of Cinematographers（Jay Holben）","url":"https://theasc.com/article/shot-craft-the-art-of-the-ad/","duration":"30分","summary":"現役の撮影監督たちが、クライアントの言う「シネマティックに」が実際には何を指すのかを分解する。明るく硬い順光ではなく、ローキー寄りの照明、空気感、柔らかい逆光、広めまたはアナモルフィックのフレーミングであるという整理。1回の撮影から16:9・9:16・1:1を納品するための、中心を共有する入れ子構造のクロップにも触れている。","useFor":"本カリキュラムで最も価値の高い外部資料のひとつ。Week 2〜Week 5。多アスペクト比の設計思想はAI動画の制作にそのまま適用できる。撮影監督の職能団体による記事なので、記述の信頼性が高い。"},{"lang":"en","status":"確認済み","checkedOn":"2026-10-11","id":"asc-distortion","category":"craft","title":"レンズの歪みを理解する","provider":"American Society of Cinematographers（Jay Holben, 2024-09-20）","url":"https://theasc.com/article/understanding-lens-distortion/","duration":"25分","summary":"幾何学的な歪み（樽型・糸巻き型）と、遠近感の歪みを区別する。遠近の圧縮は焦点距離ではなくカメラと被写体の距離から生じる、という誤解されやすい点を正している。","useFor":"料理カットで皿が歪む、客室が不自然に広く見えるといった問題の原因特定に使える。Week 1 Day 4 とWeek 2。"},{"lang":"en","status":"確認済み","checkedOn":"2026-10-11","id":"nfs-cinematic","category":"craft","title":"構図・照明・カメラの動きの入門","provider":"No Film School","url":"https://nofilmschool.com/your-guide-cinematic-composition-lighting-and-movement","duration":"15分","summary":"構図の均衡、対称、頭上の余白、前景と背景、約45度のキーライト、機材がない状況での自然光・環境光の扱い、ゆっくりしたカメラの動き。3要素をまとめて概観できる短い入門。","useFor":"Week 1 の導入として、短時間で全体像を掴みたいときに。"},{"lang":"en","status":"確認済み","checkedOn":"2026-10-11","id":"ind-food-commercial","category":"industry","title":"食品コマーシャルの撮影手順","provider":"Manfrotto（Syrp Lab）","url":"https://www.manfrotto.com/global-en/stories/how-to-shoot-food-commercials-like-a-pro/","duration":"20分","summary":"実際の制作の分解。照明プランを実物の料理で検証すること、扱いやすさと厚みから被写体を選ぶというスタイリング起点の判断、料理とシロップの動きの同期、そして仕上げの除去作業。視聴者は食品の色がわずかに狂っただけで即座に気づく、という指摘を含む。","useFor":"Week 2 全体。最後の指摘はAI生成の食品カットへの直接的な警告として読むこと。色が少しでもおかしい食品映像は、きれいでも使えない。"},{"lang":"en","status":"確認済み","checkedOn":"2026-10-11","id":"ind-hotel-video","category":"industry","title":"ホテル動画を改善する11の要点","provider":"Cvent（2026年2月時点）","url":"https://www.cvent.com/en/blog/hospitality/hotel-video-tips","duration":"15分","summary":"宿泊施設に特化した実務の指針。尺を短く保つこと、対象（会議利用かレジャーか）に合わせて作り分けること、小さな要素は安定したパンで、外観は長めのショットで撮るというショットリストの考え方、ページ上部への配置と自動再生の回避、字幕、明確な行動喚起、360度ツアー、チャネル横断での再利用。そして、誇張を避け、実際の宿泊体験と動画が一致するようにすること。","useFor":"Week 3 と Week 4。最後の「誇張を避ける」という点は、英語圏では推奨事項だが、日本では景品表示法上の要請になる。jp-keihyo-menu と合わせて読むこと。"},{"lang":"ja","status":"確認済み","checkedOn":"2026-10-11","id":"jp-keihyo","category":"jp-law","title":"不当な表示（優良誤認表示・有利誤認表示）","provider":"消費者庁","url":"https://www.caa.go.jp/policies/policy/representation/fair_labeling/representation_regulation/","duration":"20分","summary":"景品表示法が禁じる不当表示の中核ページ。第5条第1号の優良誤認表示は、商品・サービスの内容や品質について実際より著しく優良であると誤認させる表示。第5条第2号の有利誤認表示は価格や取引条件について。第5条第3号は内閣総理大臣が指定する表示。優良誤認については、合理的な根拠の提出を求める不実証広告規制も定められている。","useFor":"Week 3 Day 4 の出発点。AI生成映像が実際の施設・料理と異なる場合に問題となるのは、まずこの優良誤認表示。所管は消費者庁 表示対策課。"},{"lang":"ja","status":"確認済み","checkedOn":"2026-10-11","id":"jp-keihyo-menu","category":"jp-law","title":"メニュー・料理等の食品表示に係る景品表示法上の考え方","provider":"消費者庁（2014-03-28策定 / 2016-04-01改定）","url":"https://www.caa.go.jp/policies/policy/representation/fair_labeling/guideline/pdf/140328premiums_5.pdf","duration":"40分","summary":"レストラン・ホテル・百貨店のメニューや料理の表示を明示的に対象とする公式文書。判断基準は、表示内容全体から一般消費者が受ける印象・認識であるとされ、故意かどうかは問われない。写真もメニュー全体の印象を構成する要素として扱われ、料理写真や風景写真が誤認を招くとされた事例が挙げられている。","useFor":"本カリキュラムで最重要の法令資料。飲食にも宿泊にも明示的に及ぶ、数少ない公式文書。Week 2 と Week 3 Day 4 で必読。AI生成した料理写真が実際の提供内容と異なる場合、この考え方に照らして判断される。"},{"lang":"ja","status":"確認済み","checkedOn":"2026-10-11","id":"jp-uchikeshi","category":"jp-law","title":"打消し表示に関する実態調査報告書","provider":"消費者庁（2017年7月）","url":"https://www.caa.go.jp/policies/policy/representation/fair_labeling/pdf/fair_labeling_180921_0001.pdf","duration":"40分","summary":"注意書き（打消し表示）が実際に読まれているかを調べた調査。動画広告については、打消し表示の画面表示時間が2秒以下のものが42.4%、文字のみのものが99.2%、本体の表示は音声なのに打消し表示には音声がないものが68.6%。ある検証動画では、6つの打消し表示のうち1つ以上を見落とした回答者が97.6%、すべて認識できた人は2.4%だった。読まなかった理由の最多は「読み終える時間がなかった」で49.8%。","useFor":"「注意書きを入れたから大丈夫」が通用しないことの根拠。Week 3 Day 4・Week 5 Day 3。最低表示秒数・文字サイズ・音声の有無・配置を、制作仕様として品質チェックリストに落とし込むこと。"},{"lang":"ja","status":"確認済み","checkedOn":"2026-10-11","id":"jp-stealth","category":"jp-law","title":"ステルスマーケティング規制","provider":"消費者庁（2023-10-01施行）","url":"https://www.caa.go.jp/policies/policy/representation/fair_labeling/stealth_marketing/","duration":"20分","summary":"一般消費者が事業者の表示であると判別することが困難な表示を、景品表示法第5条第3号の不当表示として指定したもの（内閣府告示第19号、2023-03-28告示）。インフルエンサーや第三者に依頼した内容、SNS投稿、口コミ、従来型メディアを含む。規制の対象となるのは広告主である事業者のみで、インフルエンサーや第三者は対象外。自発的な個人の感想や、明示された広告は対象外。","useFor":"Week 4・Week 6。制作した動画を第三者名義で出す場合、顧客側に表示義務が生じる。受託側として、その設計を提案に含められるかが差になる。"},{"lang":"ja","status":"確認済み","checkedOn":"2026-10-11","id":"jp-stealth-guide","category":"jp-law","title":"ステルスマーケティング規制 運用基準","provider":"消費者庁（2023-03-28）","url":"https://www.caa.go.jp/policies/policy/representation/fair_labeling/guideline/assets/representation_cms216_230328_03.pdf","duration":"30分","summary":"事業者が表示内容を決定していれば、第三者による投稿に見えても事業者の表示として扱われる。自社従業員による宣伝、依頼や対価を伴う投稿、宣伝を期待した商品提供が含まれる。不適切な例として、表示がない、一部にしかない、小さすぎる、動画で表示時間が短すぎる、末尾にのみ表示、ハッシュタグに埋没している、広告と読み取れない書き方、が列挙されている。「広告」「宣伝」「プロモーション」「PR」といった表記が挙げられているが、気づきやすく、周囲の記述と矛盾しないことが前提とされる。","useFor":"Week 4 Day 4・Week 6 Day 4。とくに「動画で表示時間が短すぎる」という例は、前掲の打消し表示調査と同じ論点。公式Q&Aでは、動画について冒頭のみの表示では足りない場合があり、継続的な画面表示が望ましいとされている。"},{"lang":"ja","status":"確認済み","checkedOn":"2026-10-11","id":"jp-otori","category":"jp-law","title":"おとり広告に関する表示","provider":"消費者庁 / 公正取引委員会告示第17号（1993年）","url":"https://www.caa.go.jp/policies/policy/representation/fair_labeling/representation_regulation/case_002/","duration":"15分","summary":"実際には購入できない商品・サービスについて、購入できるかのように示す表示を禁じるもの。取引に応じる準備がない場合、供給量が著しく限定されているのに明示しない場合、期間・対象者・数量の制限を明示しない場合、取引する意思がない場合の4類型。","useFor":"対象は在庫や取引可能性であり、映像の見栄えの問題ではない点に注意。満室のプランを広告に出し続ける、といった運用面の論点で関係する。Week 4 Day 4。"},{"lang":"ja","status":"確認済み","checkedOn":"2026-10-11","id":"jp-ryokan","category":"jp-law","title":"旅館業法（厚生労働省）","provider":"厚生労働省","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000110603.html","duration":"15分","summary":"旅館業の営業許可と公衆衛生に関する法律。旅館・ホテル営業、簡易宿所営業、下宿営業の範囲、2017年と2023年の改正、違法民泊への対応、宿泊者名簿、レジオネラ症対策などを扱う。","useFor":"宿泊施設を扱う以上、顧客の事業がどの許可で運営されているかは知っておくべき前提知識。ただし、この法律は広告表現を規律していない。施設の見せ方の問題は景品表示法の優良誤認表示として扱う。混同しないこと。"},{"lang":"ja","status":"確認済み","checkedOn":"2026-10-11","id":"jp-ai-guideline","category":"jp-law","title":"AI事業者ガイドライン（第1.2版）","provider":"総務省・経済産業省（2026-03-31）","url":"https://www.soumu.go.jp/main_sosiki/kenkyu/ai_network/02ryutsu20_04000019.html","duration":"60分","summary":"文書自身が非拘束的なソフトローであると明記しており、示される措置は任意で、それ自体が法的義務を生じさせるものではないとしている。技術的に可能な範囲で電子透かし等の来歴確認手段を整備することを求め、ラベルや注記を推奨している。透明性の項では、AIを利用している事実とその範囲について関係者に情報提供することを求めている。具体的な表示基準や、すべてのAI生成物への表示を求める普遍的なルールは定めていない。","useFor":"Week 3 Day 4。日本には現在、広告にAI生成であることを表示する法的義務は存在しない。存在するのはこの種の非拘束の指針のみ。義務があると顧客に説明するのは誤り。一方で、表示の有無にかかわらず実際と異なる印象を与えれば景品表示法が適用される、という整理で説明すること。版が頻繁に更新されるため、版数固定のPDFではなくこの掲載ページを参照すること。"},{"lang":"ja","status":"確認済み","checkedOn":"2026-10-11","id":"jp-bunka-ai","category":"jp-law","title":"AIと著作権について（文化庁）","provider":"文化庁","url":"https://www.bunka.go.jp/seisaku/chosakuken/aiandcopyright.html","duration":"20分","summary":"文化庁によるAIと著作権の情報ハブ。2024年3月の文化審議会「AIと著作権に関する考え方について」、その概要と英語版、チェックリスト、セミナー資料、意見募集の結果などがまとめられている。","useFor":"Week 3 Day 4 の著作権パートの入口。なお、これらの資料は著作権に限定されており、肖像権やパブリシティ権は扱っていない点に注意。"},{"lang":"ja","status":"確認済み","checkedOn":"2026-10-11","id":"jp-bunka-checklist","category":"jp-law","title":"AIと著作権に関するチェックリスト＆ガイダンス","provider":"文化庁著作権課（2024-07-31）","url":"https://www.bunka.go.jp/seisaku/chosakuken/pdf/94097701_01.pdf","duration":"40分","summary":"侵害の成立には、既存の著作物との類似性と、それに依拠したことの両方が必要とされる。生成AIの仕組み上、利用者が元の作品を知らなくても類似した出力が生じうるとされ、その場合でも生成や利用が侵害となりうるとしている。生成と利用は区別され、ネットでの公開や複製物の配布は私的使用の例外から外れることが多い。既存の作品名やキャラクター名を入力することは依拠の認定を支えうる。サービスの利用規約が入力や利用を独自に制限している場合がある。プロンプトと生成の記録を残すことが推奨されている。","useFor":"実務では上のハブよりこちらが有用。Week 3 Day 4・Week 5。プロンプトと生成記録を残すという推奨は、本カリキュラムの制作台帳とまったく同じ運用なので、台帳を法的な備えとしても位置づけられる。"},{"lang":"ja","status":"確認済み","checkedOn":"2026-10-11","id":"jp-miralab-hf","category":"tutorial-3p","title":"Higgsfield とは：料金・使い方の日本語解説","provider":"MiraLabAI（2026-09-11更新）","url":"https://miralab.co.jp/media/?p=40766","duration":"20分","summary":"日本語でHiggsfieldを扱った記事の中では最も詳しい部類。Soul 2.0、Kling / Veo / Seedance / Sora 2、Marketing Studio や Canvas を含む機能分類、プラン表（Starter / Plus / Ultra、Team / Scale / Enterprise）、税や自動更新、返金が原則受けられない点などに触れている。","useFor":"英語の公式資料を読む前の見取り図として。ただし一部にPR表記のある記事が含まれ、独自検証は行われていない。価格は必ず公式ページで確認すること。公式情報と食い違う場合は公式が正。"},{"lang":"en","status":"確認済み","checkedOn":"2026-10-11","id":"yt-hf-overview","category":"tutorial-3p","title":"Learn 98% of Higgsfield AI in 18 Minutes","provider":"Youri van Hofwegen（YouTube・第三者）","url":"https://www.youtube.com/watch?v=-vqocuhO1YE","duration":"約18分","summary":"プラットフォーム全体を短時間で概観する第三者の動画。機能の位置関係を掴むのに向く。","useFor":"Week 1 Day 1 の機能カテゴリのマッピングと並行して。公式ではないため、仕様の細部は必ずヘルプセンターで裏を取ること。AI関連の解説は数週間で古くなる。"},{"lang":"en","status":"確認済み","checkedOn":"2026-10-11","id":"yt-hf-beginner","category":"tutorial-3p","title":"The ONLY Higgsfield AI Tutorial You Need 2026","provider":"Joshua Mayo（YouTube・第三者）","url":"https://www.youtube.com/watch?v=R7GZjRMsrzM","duration":"不明","summary":"初心者向けに一通りの流れを追う第三者のチュートリアル。","useFor":"操作感を映像で確認したいとき。公式ではない点に注意。"},{"lang":"en","status":"確認済み","checkedOn":"2026-10-11","id":"hf-help-how-credits","category":"official-doc","title":"クレジットの仕組み","provider":"Higgsfield ヘルプセンター","url":"https://higgsfield.ai/creator-hub/help-center/credits/how-credits-work","duration":"8分","summary":"消費量はモデル・解像度・尺で決まり、生成ボタンに消費クレジットが表示され、設定を変えると数値も変わる。消費はサブスク分から先に減り、次に失効が近いものから使われる。無料生成の枠は購入時の一度きりで更新されない。失敗した生成はほとんどが自動返却されるが、一部のモデルは返却されない場合があると明記されている。","useFor":"Week 1 Day 1 で必読。押す前に生成ボタンの数値を読む習慣が、6週間の総額を最も大きく左右する。"},{"lang":"en","status":"確認済み","checkedOn":"2026-10-11","id":"hf-help-unlimited","category":"official-doc","title":"Unlimited モデルと対象プラン","provider":"Higgsfield ヘルプセンター","url":"https://higgsfield.ai/creator-hub/help-center/credits/what-are-unlimited-models-and-which-plans-include-them","duration":"10分","summary":"中位以上のプランに含まれ、上位ほど対象モデルが増える。対象モデルでは生成パネルに Unlimited のトグルが出る。オフにするとクレジットを消費する代わりに優先キューに入る。対象の一覧と期間は料金ページの各プランカードに表示される。多くは365日、最新の主力モデルは7日程度と短い場合がある。","useFor":"費用設計の中核。契約前に、自分が使うモデルが対象に入っているかを料金ページのカードで必ず確認すること。"},{"lang":"en","status":"確認済み","checkedOn":"2026-10-11","id":"hf-blog-credits-unlimited","category":"official-blog","title":"クレジットと Unlimited の比較","provider":"Higgsfield ブログ","url":"https://higgsfield.ai/blog/credits-vs-unlimited-ai-video-generation","duration":"12分","summary":"モデル別の実際の消費クレジットが掲載されている。Seedance 2.5 の8秒は 480p=24、720p=52、1080p=72。Kling 3.0 の8秒1080pは20。Marketplace の単品パスは1日1モデルの7ドル程度から、全モデル7日で1,035ドルまでの幅がある。","useFor":"本サイトの費用設計の主な根拠。解像度を1段下げるだけで費用が半分近くになることが、具体的な数値で確認できる。"},{"lang":"en","status":"確認済み","checkedOn":"2026-10-11","id":"hf-blog-trial","category":"official-blog","title":"1日の無料 Unlimited トライアル","provider":"Higgsfield ブログ","url":"https://higgsfield.ai/blog/free-unlimited-ai-video-generation-2026","duration":"8分","summary":"新規かつ無料プランの利用者向けに、24時間の All Unlimited トライアルがある。費用はゼロでカード登録が必要だが請求はされない。ウォーターマークなしで、解像度と尺は月額 Plus 相当。同時生成は1本。24時間後に自動で月額 Plus に移行するため、不要なら期間内に解約する。課金の6時間前に警告メールが届く。","useFor":"学習開始前に必ず読む。この24時間に Week 1 の Day 1〜3 を詰め込むのが、最も費用対効果の高い使い方。使い終えたら解約を忘れないこと。"},{"lang":"en","status":"確認済み","checkedOn":"2026-10-11","id":"hf-help-packs","category":"official-doc","title":"クレジットパックと追加購入","provider":"Higgsfield ヘルプセンター","url":"https://higgsfield.ai/creator-hub/help-center/credits/how-credit-packs-work","duration":"6分","summary":"パックは100から4,000までの固定枚数と、5,000以上の可変枚数がある。価格は購入画面で表示される。購入から90日で失効し、未使用なら7日以内は返金可。購入にはサブスクの契約が必要。","useFor":"Week 5 Day 4 の原価計算。追加購入は割高なので、月内に収まる使用量を設計するほうが安いという判断の根拠になる。"},{"lang":"en","status":"確認済み","checkedOn":"2026-10-11","id":"hf-help-watermark","category":"official-doc","title":"ウォーターマークと解除","provider":"Higgsfield ヘルプセンター","url":"https://higgsfield.ai/creator-hub/help-center/credits/watermark-and-how-to-remove","duration":"5分","summary":"無料アカウントの生成物にはすべてウォーターマークが入り、オフにする設定はない。解除するには有料プランへの加入が必要で、単体では販売されていない。すでに書き出した分は作り直しが必要。AI生成であることを示す不可視の来歴情報は、プランにかかわらず埋め込まれる。","useFor":"無料プランで作った素材は顧客に出せない。Week 6 のポートフォリオを作る前に、必ず有料プランで作り直すこと。"},{"lang":"en","status":"確認済み","checkedOn":"2026-10-11","id":"oai-images","category":"image-tools","title":"ChatGPT Images 2.5","provider":"OpenAI（2026-09-08）","url":"https://openai.com/index/introducing-chatgpt-images-2-5/","duration":"10分","summary":"ChatGPT の現行の画像生成。発表ページでは全ティアで利用できるとされている。参照写真からの生成が改善し、場面やスタイルを変えても被写体の特徴が保たれる。指示した箇所だけを変える精密な編集に対応し、複数回の編集でも前の修正が維持されやすい。複雑なレイアウトと透過背景も扱える。1日あたりの生成枚数の上限は公式に明記されていない。","useFor":"すでに契約しているなら、下書きの静止画はここで量産するのが最も安い。作った画像はそのまま Higgsfield にアップロードして動画化できる。"},{"lang":"en","status":"確認済み","checkedOn":"2026-10-11","id":"gemini-images","category":"image-tools","title":"Gemini の画像生成（Nano Banana）","provider":"Google","url":"https://gemini.google/overview/image-generation/","duration":"10分","summary":"現行の最上位は Nano Banana 2.1 で Google AI プランが必要。無料枠では Nano Banana 2 が使える。公式に、より明瞭で正確な文字を生成でき、多言語の文字も画像内に収められるとされている。キャラクターの一貫性にも対応。APIの仕様では、2.1 は物体参照10枚とキャラクター参照4枚を受け付け、1K・2K・4K から選べる。","useFor":"画像内に文字を入れたいときの有力な選択肢。ただし日本語の文字精度を検証した一次情報は見つからなかったため、本番で使う前に自分で比較すること。"},{"lang":"en","status":"確認済み","checkedOn":"2026-10-11","id":"hf-i2v-page","category":"official-doc","title":"Higgsfield の image-to-video","provider":"Higgsfield","url":"https://higgsfield.ai/image-to-video-ai","duration":"5分","summary":"写真・イラスト・商品写真をそのまま持ち込んで動画化できると明記されている。外部で作った画像のアップロードが前提の機能として案内されている。","useFor":"「画像は手持ちのツールで作り、動画化だけ Higgsfield」という本カリキュラムの方針の裏づけ。"},{"lang":"en","status":"確認済み","checkedOn":"2026-10-11","id":"hf-changelog","category":"official-doc","title":"Higgsfield 変更履歴","provider":"Higgsfield","url":"https://higgsfield.ai/creator-hub/changelog","duration":"—","summary":"機能追加とモデル更新の履歴。アップロードした画像・動画が名前つきの Element になること、Ideogram 4.5 がデザイン内の文字置換と翻訳に対応したことなどが記載されている。","useFor":"月1回確認する。本教材の記述と画面が食い違ったときは、まずここで何が変わったかを調べる。"},{"lang":"ja","status":"確認済み","checkedOn":"2026-10-11","category":"jp-law","id":"jp-fudosan-kiyaku","title":"不動産の表示に関する公正競争規約 施行規則","provider":"首都圏不動産公正取引協議会","url":"https://www.sfkoutori.or.jp/webkanri/kanri/wp-content/uploads/2019/01/h_sekoukisoku.pdf","duration":"60分","summary":"第9条第22号は、宅地又は建物の写真又は動画は取引するものを表示することと定めている。動画も条文に明記されている。例外は工事完了前などの事情がある場合に、取引する建物を施工する者が過去に施工した建物に限られ、外観は構造・階数・仕様が同一で規模・形状・色等が類似するもの、内部は写される部分の規模・仕様・形状等が同一のものに限定される。その場合は他の建物である旨を、写真は写真に接する位置に、動画は画像中に明示する。第9条第23号は、CG・見取図・完成図・完成予想図はその旨を明示して用い、周囲の状況を表示するときは現況に反する表示をしないことを定めている。","useFor":"不動産案件に着手する前に必読。AI生成画像を物件写真として使えない根拠がここにある。業種別プロンプト集の不動産パックは、この条文を前提に用途を5類型に限定して設計している。"},{"lang":"ja","status":"確認済み","checkedOn":"2026-10-11","category":"jp-law","id":"jp-takken-32","title":"宅地建物取引業法 第32条の解釈・運用の考え方","provider":"東京都（処分基準要綱に収録）","url":"https://www.juutakuseisaku.metro.tokyo.lg.jp/juutaku_seisaku/pdf/takken_syobunkijun_yoko2403.pdf","duration":"30分","summary":"誇大広告等の禁止の解釈。おとり広告や虚偽広告も本条の適用がある。媒体は問わず、インターネットのホームページ等も対象。対象となる8項目には形質（構造・材料・性能・経過年数等）と現在又は将来の環境（周囲の状況、静寂さ、快適さ、方位等の立地条件、周辺施設）が含まれる。著しく事実に相違する表示とは、一般購入者等が事実との相違を知っていれば当然に誘引されないものを指すとされている。","useFor":"不動産案件で、AI生成画像が触れやすい2項目（形質と環境）を把握するために読む。違反は業務停止処分の対象で、罰則も定められている。"},{"lang":"ja","status":"確認済み","checkedOn":"2026-10-11","category":"jp-law","id":"jp-shokuan-54","title":"求人等に関する情報の的確な表示（職業安定法）","provider":"厚生労働省","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000172497_00003.html","duration":"20分","summary":"2022年10月1日施行。求人等に関する情報について虚偽の表示又は誤解を生じさせる表示をしてはならず、正確かつ最新の内容に保つ義務がある。対象は求人情報、求職者情報、求人企業に関する情報、自社に関する情報、事業の実績に関する情報の5分類。公式Q&Aは、虚偽でなくとも一般的・客観的に誤解を生じさせる表示は該当するとしている。なおリーフレットとQ&Aに写真・映像への言及は見当たらない。","useFor":"採用案件の前提。写真や映像が法律上の対象と明記されてはいないが、除外もされていない。顧客に「写真も対象です」と断定せず、「該当しうるため確認が必要」と伝えること。"},{"lang":"ja","status":"確認済み","checkedOn":"2026-10-11","category":"jp-law","id":"jp-zenkyukyo","title":"倫理綱領と掲載基準","provider":"全国求人情報協会","url":"https://www.zenkyukyo.or.jp/jobmedia/ethics/","duration":"20分","summary":"求人広告は真実なものであるべきことを定める倫理綱領と、実際の労働条件と相違する内容を含むものは掲載を見合わせること、事実に基づかない誇大・虚偽の説明や表示を避けることを定めた掲載基準。写真・画像・映像・AI生成への言及は見当たらない。","useFor":"採用案件で、AI生成の人物を社員として出すことを直接規律する業界基準が存在しないことの確認に使う。一般規定の適用可能性は個別に判断すること。"},{"lang":"ja","status":"確認済み","checkedOn":"2026-10-11","category":"jp-law","id":"jp-shozoken","title":"肖像に関する最高裁判決（平成17年11月10日）","provider":"裁判所","url":"https://www.courts.go.jp/hanrei/52388/detail2/index.html","duration":"30分","summary":"人はみだりに自己の容ぼう・姿態を撮影されないということについて法律上保護されるべき人格的利益を有する、と判示した判決。無断撮影が違法となるかは社会生活上受忍の限度を超えるかを諸事情の総合考慮により判断するとしている。","useFor":"肖像権は判例法理であり、肖像権法という法律は存在しない。実在の従業員や顧客を扱う案件で、同意の範囲を書面で特定する必要性の根拠になる。"},{"lang":"ja","status":"確認済み","checkedOn":"2026-10-11","category":"jp-law","id":"jp-ppc-guideline","title":"個人情報保護法ガイドライン（通則編）","provider":"個人情報保護委員会","url":"https://www.ppc.go.jp/personalinfo/legal/guidelines_tsusoku/","duration":"40分","summary":"個人に関する情報は顔画像等個人を識別する情報に限られないと記載されており、顔画像は個人情報に該当しうる。本人の容貌は、電子計算機用に変換され本人認証ができる場合に限り個人識別符号に該当するとされている。","useFor":"従業員や顧客の顔が写る素材を扱うとき、利用目的の特定・通知などの取り扱いを確認するために読む。"},{"lang":"ja","status":"確認済み","checkedOn":"2026-10-11","category":"jp-law","id":"jp-ai-act","title":"AI推進法と適正性確保に関する指針","provider":"内閣府","url":"https://www8.cao.go.jp/cstp/ai/ai_act/ai_act.html","duration":"40分","summary":"人工知能関連技術の研究開発及び活用の推進に関する法律は2025年6月4日公布・一部施行、2025年9月1日全面施行。AI生成コンテンツの表示義務に関する記載も罰則の記載も確認できない。第13条に基づく適正性確保に関する指針（2025年12月19日本部決定）は、自主的かつ能動的な取組を促すためのものと自ら位置づけ、AIの生成物であることが判断できる技術の開発に努め必要に応じて実装するという努力的な記述にとどまる。","useFor":"Week 3 Day 4 と各業種パックの前提。日本には広告にAI生成である旨の表示を義務づける法令が確認できないこと、存在するのは非拘束のソフトローのみであることの根拠。ただし表示義務がないことは自由に使えることを意味しない。"}]},"meta":{"courseTitle":"AI動画マーケティング実践コース","courseLede":"Higgsfield を使った映像制作、広告クリエイティブとしての設計、そして継続契約型の事業化までを6週間・30レッスンで通します。東京の飲食と宿泊の現場で使える形に絞った実践課程です。","rubricAxes":["映像の品質","動きの自然さ","ブランド整合性","マーケ目的整合性","再現性","時間とコスト"],"rubricDefs":[{"axis":"映像の品質","def":"解像感、破綻の有無、ノイズ、質感の説得力。拡大して見たときに耐えるか。"},{"axis":"動きの自然さ","def":"カメラと被写体の動きが物理的に妥当か。形状が変化していないか、速度が不自然でないか。"},{"axis":"ブランド整合性","def":"色調とトーンが想定ブランドに合っているか。他のカットと並べたときに揃うか。"},{"axis":"マーケ目的整合性","def":"誰に何を伝える映像かが明確で、その目的に照らして適切か。きれいなだけの映像は合格にしない。"},{"axis":"再現性","def":"同じものをもう一度作れるか。条件と手順が他人に渡せる形で残っているか。"},{"axis":"時間とコスト","def":"所要時間と消費クレジットが想定内か。採用率を踏まえた実質原価を把握しているか。"}],"guide":[{"n":"01","heading":"1日1レッスン、週5日","body":"各レッスンは60〜90分で設計しています。内訳は「理解」「操作」「記録」の3つで、記録まで終えて1レッスン完了です。記録を飛ばすと、週末の総合課題で手が止まります。\n\n毎週 Day 5 がその週の総合課題の仕上げ日です。Day 1〜4 で作った部品を組み立てる日なので、ここだけは90分を確保してください。"},{"n":"02","heading":"作品ではなく、数字と手順を残す","body":"このコースの出力は、きれいな映像ではありません。**採用率・1カットあたりのクレジット・所要時間**という3つの実測値と、**他人に渡せる手順書**です。Week 6 の価格設計と収益シミュレーションは、この実測値の上に組み立てます。推測で価格を決めた受託事業は、受注が増えるほど苦しくなります。\n\nWeek 1 Day 1 で作る制作台帳を、6週間ずっと使い続けてください。"},{"n":"03","heading":"画像で決めて、動画で動かす","body":"全6週間の基本方針です。構図・被写体・色・質感は静止画の段階で確定させ、動画生成ではカメラの動きと被写体の動きだけを変数にします。静止画は動画より大幅に安く速いため、気に入らない方向に進んでいることを、高い動画生成を回す前に検知できます。\n\nこの方針が自分の環境でも正しいかは、Week 1 Day 2 で実際に比較して確かめます。"},{"n":"04","heading":"進捗の保存とバックアップ","body":"レッスンの完了状態、作業メモ、自己評価、ポートフォリオはすべて**このブラウザの保存領域にのみ**記録されます。サーバーには送信されません。したがって、別の端末やブラウザを開いても進捗は引き継がれず、ブラウザのデータを消去すると記録も消えます。\n\n端末を移すときや、念のため控えを取りたいときは、ダッシュボード下部の「データをコピー」でJSONをコピーし、移行先で「データを読み込む」から貼り付けてください。シークレットウィンドウでは保存されないことがあります。"},{"n":"05","heading":"ツールの仕様は変わる","body":"Higgsfield は更新頻度が高く、画面名・機能名・モデル名・価格はいずれも変わります。本教材の記載は**2026年10月11日時点で公式ヘルプセンターおよび公式ブログで確認した内容**に基づいています。\n\n教材では特定のボタン名の暗記ではなく、「どの機能カテゴリを探せばよいか」を身につける書き方にしています。記載と画面が食い違う場合は、画面のほうが正です。参考教材ページのリンクは月1回を目安に確認し、確認日を更新してください。"},{"n":"06","heading":"プロンプトはすべて未検証","body":"本教材に掲載しているプロンプトは、生成結果を検証していません。すべて「未検証」と表示しています。設計意図は説明していますが、実際の出力はモデル・バージョン・シードによって変わります。\n\n使ったら必ず結果を記録してください。自分の環境で採用率の高かったプロンプトだけが、Week 5 でライブラリとして資産になります。"},{"n":"07","heading":"プロンプトの工程記号","body":"各プロンプトの先頭に、何を入力して何が出てくるかを示す記号を付けています。ここを見れば、**新しく画像を作るのか、すでに作った画像を動かすのか、既存の動画を入力にするのか**が実行前に分かります。\n\n- **T2I** テキストから新しく静止画を作る\n- **I2I** 既存の画像を参照として渡し、新しい静止画を作る\n- **I2V** すでにある静止画を動かして動画にする。画像は新しく作らない\n- **T2V** 画像を経由せず文章から直接動画を作る\n- **V2V** 既存の動画を入力にして、変種や部分修正を作る\n- **SLOT** 単体では使わないプロンプトの部品。他のプロンプトの該当スロットに差し込む\n- **DOC** 生成AIに投げるものではなく、自分で埋める書類や表\n\n記号の下に「入力 / 出力 / 次に」の3行があります。工程が連続する場合は「工程1 / 2」のように番号が入り、次に使うプロンプト名が書かれています。"},{"n":"08","heading":"各レッスンの「本日の推奨設定」","body":"レッスンの冒頭に、使用モデル・尺・解像度・比率・出力数・本日の生成上限・目安コストをまとめた枠があります。**迷ったらこのとおりに設定してください。** 学習に必要な品質を保ちつつ、費用が最小になるように組んであります。\n\n「Unlimited適用時」の欄は、Unlimited のトグルが有効な場合に実際に減るクレジットです。ゼロと書かれている日は、Unlimited が効いていれば費用がかかりません。\n\n「本日の上限」は、学習として十分な回数の上限であって、使い切る目標ではありません。狙いどおりの結果が早く出たら、そこで止めるのが最も安い選択です。詳しい根拠は費用設計のページにまとめています。"},{"n":"09","heading":"画像はどのツールで作ってもよい","body":"本カリキュラムは、**静止画はツールを問わず、動画化は Higgsfield** という前提で組んでいます。\n\nHiggsfield の image-to-video は外部で作った画像をそのままアップロードして使えます。Soul ID の学習も手持ちの写真20〜80枚のアップロードで行い、アップロードした素材は Elements として登録できます。外部素材だから機能が制限されるということはありません。\n\n使い分けの目安は次のとおりです。\n\n- **下書きを大量に回す** → すでに契約している ChatGPT か Gemini。追加費用がかからない\n- **Higgsfield 内で安く作る** → Soul 2.0（1枚0.125クレジット、Unlimited 対象）\n- **画像内に文字を入れる** → Ideogram 4.5、GPT Image、Gemini の Nano Banana が候補。ただし**日本語の精度は未検証**なので、3つを同じプロンプトで比較してから決めること\n- **同一人物を複数カットで保つ** → Soul ID（写真20枚以上を学習させる。1つにつき1人）\n\nHiggsfield 公式が推奨する入力画像の条件は、**シャープで、構図が整っていて、照明が良いこと**です。ピクセル数の推奨値は公開されていませんが、出力したい動画の解像度以上で、目的のアスペクト比のまま入れるのが安全です。"}],"disclaimer":"本教材は制作と事業運営の実務ガイドであり、法務・税務・広告審査の専門的助言ではありません。景品表示法やステルスマーケティング規制、著作権・肖像権に関する記述は、公的機関の公開情報に基づく概要です。実際の広告表現や契約書については、弁護士・行政書士・各媒体の審査窓口など、専門家の確認を受けてください。また、動画制作によって予約数や売上が増えることを保証するものではありません。成果は季節、価格、競合、媒体のアルゴリズム、為替とインバウンド需要など複数の要因に左右されます。本コースが扱うのは、その中で検証可能な部分を設計し、測り、改善する方法です。","budget":{"lede":"Higgsfield の公表単価から、6週間でどのモデルを何秒・何本使い、いくらかかるかを算出しています。初期費用を最小にすることを優先し、学習の質を落とさずに済む範囲で安いモデルに寄せた構成です。","planHeadline":"Plus 相当を1〜2ヶ月","rules":[{"title":"静止画は手持ちのツールで作る。Higgsfield は動画化に使う","body":"Higgsfield の image-to-video は、外部で作った画像をそのままアップロードして使えます。公式ページでも、写真・イラスト・商品写真を持ち込む前提の機能として案内されています。\n\nつまり**静止画を ChatGPT や Gemini で作れば、その分の Higgsfield のクレジットはゼロ**です。すでに両方契約しているなら、追加費用なしで下書きを量産できます。Higgsfield のクレジットは、他で代替できない動画生成に集中させてください。\n\nHiggsfield 内で作る場合は **Soul 2.0 が1枚0.125クレジット**で最も安く、Unlimited の対象でもあります。画像内に文字を入れたい場合は Ideogram 4.5 や GPT Image、Gemini の Nano Banana が候補になりますが、**日本語の文字精度を検証した公開情報は見つかりませんでした。本番で使う前に、同じプロンプトで必ず自分で比較してください。**\n\nなお Soul ID の学習そのものが、手持ちの写真20〜80枚をアップロードして行うものです。アップロードした画像・動画は Elements としても登録できます。外部で作った素材が不利になる仕組みにはなっていません。"},{"title":"静止画で学べることは全部 Soul 2.0 で学ぶ","body":"Soul 2.0 は **1枚0.125クレジット（約0.6円）**。Seedance 2.0 の4秒動画1本（18クレジット）の約144分の1です。構図・光・プロンプト構造・ブランドトーンの学習は、ほぼ全部が静止画で完結します。\n本カリキュラムでは静止画を合計100枚以上生成しますが、その総額は動画1本分にも届きません。動画を回す前に静止画で納得するまで詰める、という方針は、品質の面だけでなく費用の面でも正解です。"},{"title":"Studio やテンプレート経由を避け、素のモデルをWebで使う","body":"Marketing Studio の8秒720p動画は **47.62クレジット**。同じ8秒720pを Kling 3.0 で作れば **16クレジット**、Wan 2.7 なら **約13クレジット**です。テンプレートを経由するだけで3〜4倍かかります。\nさらに重要な点として、**Marketing Studio などの Studio 系、MCP、CLI、Canvas、Supercomputer は Unlimited の対象外**で、常にクレジットを消費します。学習中は higgsfield.ai のサイト上で素のモデルを使ってください。"},{"title":"用途でモデルを使い分ける。常に最新・最上位を使わない","body":"5秒720pあたりの単価は **Wan 2.7 = 8 / Kling 3.0 = 10 / Seedance 2.0 Fast = 約18 / Seedance 2.0 = 約23 / Seedance 2.5 = 約33**。\n- **下書き・大量試行** → Seedance 2.0 Fast\n- **標準の検証** → Seedance 2.0（Unlimited対象、4Kも可）\n- **カメラ移動中心のb-roll、都市型ホテルの映像** → Kling 3.0（1080pでも5秒12.5クレジットと極端に安い）\n- **流体・湯気・液体** → Wan 2.7\n- **人物の動きや表情の質が要る最終カットだけ** → Seedance 2.5\n\nSeedance 2.5 は最も高く、しかも **Unlimited の対象外**です。本カリキュラムでは意図的に、6週間で十数本しか使いません。"},{"title":"解像度と尺は後から上げる","body":"費用は尺にほぼ比例し、解像度でほぼ倍になります（Seedance 2.0 の5秒：720p=23、1080p=45）。Seedance 2.5 の8秒では **480p=24 / 720p=52 / 1080p=72**。\n全カットをまず720pで作り、構成が確定してから採用分だけ解像度を上げる。これだけで、ボツカットにかかる費用が半分以下になります。公式ヘルプも同じ手順を推奨しています。"},{"title":"バッチ出力は必ず1枚・1本に設定する","body":"バッチで2〜4枚を同時に出すと、**各出力が個別に課金**されます（公式明記）。学習段階では1つずつ出して、1つずつ評価してください。まとめて出すと、評価もまとめて雑になります。"},{"title":"Unlimited トグルを必ず確認する","body":"対象モデルなら、トグルをONにすると**クレジットを消費しません**。OFFだと課金モード（優先キュー）になります。対象には **Soul 2.0・Seedance 2.0 / 2.0 Fast / 2.0 Mini・Kling 3.0・Wan 2.7** が含まれており、本カリキュラムで使うモデルのほとんどが入っています。\n代償は標準キューでの速度変動と、同時実行が種類ごとに1本までという制限だけです。学習用途では問題になりません。**対象外は Seedance 2.5、DoP、Veo、そして Studio 系すべて**です。"},{"title":"最初の24時間は無料トライアルに全部寄せる","body":"新規アカウント向けに **1日（24時間）の無料 All Unlimited トライアル**があります。費用は /bin/bash、カード登録は必要ですが請求はされません。**ウォーターマークなし**で、解像度と尺は月額 Plus 相当、対象23モデルすべてが使えます。\n**24時間後に自動で Plus へ移行する**ため、使い終えたら Manage Account → Subscription から解約してください（課金6時間前に警告メールが届き、解約してもトライアル終了までは使えます）。\nここに Week 1 の Day 1〜3 を一気に詰め込むのが、最も密度の高い学習24時間になります。"},{"title":"追加購入は常に割高。月内に収める設計にする","body":"サブスクのクレジットは毎サイクルでリセットされ、繰り越せません。一方、Auto-Refill は ** = 18クレジット**で、基準の20クレジット/$より約10%割高です。クレジットパックは90日で失効し、価格は購入画面まで表示されません。\nつまり、足りなくなってから買い足すのは常に損です。各レッスンの「本日の上限」を守り、月内に収まる使い方を設計してください。"}],"plans":[{"name":"無料プラン","price":"$0","credits":"0","verdict":"全出力にウォーターマークが入り、商用利用不可、使えるモデルも限られる。画面の下見用と考える。日次の無料生成数は公式に示されていない。"},{"name":"1日 All Unlimited トライアル","price":"$0（カード登録要）","credits":"—（Unlimited）","verdict":"最初に必ず使う。ウォーターマークなし、Plus 相当、23モデル対象。24時間後に自動でPlusに移行するので、使い終えたら即解約する。"},{"name":"Starter","price":"$15〜19/月","credits":"200〜270","verdict":"All Unlimited の対象外。静止画中心なら足りるが、動画を含む週（Week 2・3）は確実に不足する。本カリキュラムには向かない。"},{"name":"Plus","price":"$47〜59/月（年額で割引）","credits":"1,000〜1,200","verdict":"本命。All Unlimited の対象で、購入時に7日間のウィンドウが付く。この7日に動画の重い日（W2D5・W3D3・W3D5）を寄せると、実費を大きく下げられる。"},{"name":"Ultra","price":"$129/月（年額 $99/月）","credits":"3,000","verdict":"6週間の学習には過剰。受注が始まり、納品が重なってから検討する。"}],"assumptions":["クレジット単価は公式ブログに掲載された実測値から1秒あたりに換算したもの。生成ボタンに消費クレジットが表示されるため、押す前に必ず実数を確認すること。","Seedance 2.5 は10秒を超えると1秒あたりの単価が上がる（8秒720p=52、10秒720p=70）。本表は8秒以下を前提に換算している。","Higgsfield DoP の単価は一次・三次情報のいずれにも記載がない。使う場合は生成ボタンの表示で確認すること。","プランの価格とクレジット数は情報源によって食い違う。公式ブログは Starter $15/200・Plus $49/1,000、第三者2社は Starter $19/270・Plus $59（年額$47）/1,200 と報告している。契約前に料金ページを自分の目で確認すること。","「本日の上限」は学習として十分な回数の上限であり、必ず使い切る目標値ではない。狙いどおりの結果が早く出たら、そこで止めるのが最も安い。","失敗した生成はほとんどが自動で返却されるが、一部のモデルは返却されない場合があると公式に記載されている。Manage Account → Usage で返却を確認する習慣をつけること。"],"caution":"ここに掲載した単価・プラン・Unlimited の対象モデルは、2026年10月11日時点で公式ブログとヘルプセンターから確認した内容です。Higgsfield は更新頻度が高く、価格体系も対象モデルも変わります。契約前と、各週の着手前に、料金ページと生成ボタンの表示を必ず自分で確認してください。","weeks":[{"week":1,"stills":45,"videos":18,"credits":320,"paid":26,"note":"静止画はすべて Soul 2.0。動画は Seedance 2.0 が主役で、2.5 は Day 1 の単価比較に1本だけ"},{"week":2,"stills":42,"videos":27,"credits":451,"paid":104,"note":"料理の試行は Seedance 2.0 Fast、流体と湯気は Wan 2.7。15秒広告の採用4カットだけ Seedance 2.5 に上げる"},{"week":3,"stills":38,"videos":30,"credits":357,"paid":0,"note":"都市型ホテルのb-rollはカメラ移動中心なので Kling 3.0 が最適。1080pでも5秒12.5クレジットで、Seedance 2.5 の約4分の1"},{"week":4,"stills":14,"videos":14,"credits":291,"paid":105,"note":"映像は1本だけ作り、残りは Ad Multiplier で変種化。Ad Multiplier は Unlimited 対象外なので、ここだけは必ずクレジットを使う"},{"week":5,"stills":8,"videos":4,"credits":73,"paid":0,"note":"生成はほぼなし。不整合素材の差し替えと手順書の再現確認のみ"},{"week":6,"stills":8,"videos":8,"credits":101,"paid":0,"note":"既存素材の再編集が中心。不足分を Kling 3.0 の1080pで補う"}],"unitCosts":[{"item":"静止画 Soul 2.0（2Kまで）","cr":"0.125","usd":"$0.006","src":"公式ブログ（確認済み）／Unlimited対象"},{"item":"静止画 Nano Banana 2（1K・2K）","cr":"2","usd":"$0.10","src":"公式ブログ（確認済み）／4Kは4cr・Unlimited対象外"},{"item":"Wan 2.7　5秒 720p","cr":"8","usd":"$0.40","src":"公式ブログ（確認済み）／Unlimited対象"},{"item":"Kling 3.0　5秒 720p","cr":"10","usd":"$0.50","src":"公式ブログ（確認済み）／Unlimited対象"},{"item":"Kling 3.0　5秒 1080p","cr":"12.5","usd":"$0.63","src":"公式ブログ（確認済み）／1080pでも安い"},{"item":"Seedance 2.0 Fast　8秒 720p","cr":"28","usd":"$1.40","src":"公式ブログ（確認済み）／Unlimited対象"},{"item":"Seedance 2.0　8秒 720p","cr":"36","usd":"$1.80","src":"公式ブログ（確認済み）／Unlimited対象"},{"item":"Seedance 2.0　5秒 1080p","cr":"45","usd":"$2.25","src":"公式ブログ（確認済み）"},{"item":"Seedance 2.5　8秒 480p","cr":"24","usd":"$1.20","src":"公式ブログ（確認済み）／Unlimited対象外"},{"item":"Seedance 2.5　8秒 720p","cr":"52","usd":"$2.60","src":"公式ブログ（確認済み）／Unlimited対象外"},{"item":"Seedance 2.5　8秒 1080p","cr":"72","usd":"$3.60","src":"公式ブログ（確認済み）／Unlimited対象外"},{"item":"Marketing Studio　8秒 720p","cr":"47.62","usd":"$2.38","src":"公式ブログ（確認済み）／Studio系はUnlimited対象外"},{"item":"Marketing Studio　15秒 720p","cr":"89.2","usd":"$4.46","src":"公式ブログ（確認済み）／Studio系はUnlimited対象外"},{"item":"Ads Studio 静止画広告 1点","cr":"4","usd":"$0.20","src":"公式ブログ（確認済み）"},{"item":"Ad Multiplier（CTAのみ・720p）","cr":"最大35","usd":"約$1.75","src":"公式ブログ（確認済み）／Unlimited対象外"},{"item":"Ad Multiplier（フック＋CTA・720p）","cr":"最大140","usd":"約$7.00","src":"公式ブログ（確認済み）"},{"item":"Higgsfield DoP","cr":"未確認","usd":"—","src":"一次・三次情報とも単価の記載なし。生成ボタンの表示で確認すること"}]},"surfaces":{"lede":"Higgsfield には動画を作れる画面が複数あり、同じ長さ・同じ解像度でも費用が3〜4倍変わります。しかも Unlimited が効く画面と効かない画面があります。どこで作るかは、プロンプトの出来よりも先に効く判断です。","order":["まず「生成画面でモデルを選んで image-to-video」で作れないかを考える。本カリキュラムで作るカットの大半はこれで足ります。最も安く、Unlimited が効きます。","複数のカットを一貫した演出でまとめたい、カメラ・レンズ・絞り・照明・カラーを細かく指定したい場合だけ Cinema Studio を使う。","テンプレートの型を借りたい、Meta や Google の入稿サイズにそのまま合わせたい場合だけ Marketing Studio を使う。3〜4倍の費用を払う価値があるかを先に確認する。","すでにある動画の変種を作るなら Ad Multiplier、一部だけ直すなら Genjutsu。ゼロから作り直さない。"],"rows":[{"name":"生成画面でモデルを選ぶ（image-to-video）","what":"画像を1枚アップロードし、モデルを選んで動かす。本カリキュラムの既定。","use":"単発のカット全般。料理の湯気、商品の回り込み、客室や現場のb-roll、フックの冒頭カット。","limit":"モデル次第。Kling 3.0 は15秒・最大6カット、Wan 2.7 は15秒、Seedance 2.0 は4〜15秒、Seedance 2.5 は4〜30秒。","cost":"最安。Wan 2.7 が5秒720pで8クレジット、Kling 3.0 が10クレジット。","unlimited":"対象","verdict":"迷ったらここ。9割のカットはこれで足ります。"},{"name":"Higgsfield DoP","what":"画像を起点に、プリセット化されたカメラ動作を適用する。テキストからの動画生成はできない。","use":"カメラの挙動だけを確かめたいとき。プロンプトで書くより安定する場合がある。","limit":"尺は3秒または5秒のみ。","cost":"単価が公開されていない。生成ボタンの表示で確認すること。","unlimited":"対象外","verdict":"カメラワークの比較検証に使う。本番カットの主力にはしない。"},{"name":"Cinema Studio 4.0","what":"Director's Panel でジャンル・年代・テンポ・カメラボディ・レンズ・絞り・30以上の移動プリセット・6種の照明・50以上のカラーパレットを指定する。参照は最大50点。","use":"30秒のPR動画のように、複数カットを一貫した演出でまとめるとき。カメラと照明を細かく作り込みたいとき。","limit":"最長30秒。エンジンは Seedance 2.5。","cost":"高い。5秒720pで25クレジット、10秒1080pで100クレジット。","unlimited":"対象外","verdict":"演出を作り込む価値がある最終カットだけに使う。検証段階では使わない。"},{"name":"Marketing Studio","what":"1,500以上のテンプレートから作る。Product Shots、Ads（Meta・Google の入稿サイズ）、Marketplace、Posters、UGC Videos、Motion、Ref→Video。","use":"型を借りたいとき。入稿サイズにそのまま合わせたいとき。UGC風の決まった形式。","limit":"動画は最長15秒。バッチ機能なし。MCP や Supercomputer からは使えない。","cost":"高い。8秒720pで47.62クレジット。同じ条件を Kling 3.0 で作れば16クレジット前後。","unlimited":"対象外（常に課金）","verdict":"3〜4倍の差を払う理由があるときだけ。学習段階では原則使わない。"},{"name":"Ads Studio / Ad Multiplier","what":"静止画広告の生成（ブランドキット、1商品20案の一括生成）と、既存動画から変種を作る Ad Multiplier。","use":"訴求軸のA/Bテスト。映像を固定したままフックやCTAだけ差し替える。","limit":"静止画広告のみ生成可。Ad Multiplier の入力は4〜30秒の動画と画像最大20点。","cost":"静止画1点4クレジット。Ad Multiplier は CTAのみで最大35、フック＋CTAで最大140クレジット。","unlimited":"対象外","verdict":"Week 4 の中核。3本を一から作るより安く、しかもテストとして正しい比較になる。"},{"name":"Genjutsu","what":"既存動画の部分編集。動きを別の対象に移す Motion Transfer と、物体を差し替える Object Swap。","use":"納品後の修正。一部の要素だけ差し替えたいとき。","limit":"入力4〜30秒、参照最大30点、出力は最大1080p。","cost":"生成ボタンの表示で確認すること。","unlimited":"対象外","verdict":"全体を作り直すより安い。修正回数が原価に直結する受託では重要。"}],"caution":"Unlimited と無料生成が適用されるのは higgsfield.ai のサイト上だけです。MCP・CLI・Canvas・Supercomputer 経由の生成に加えて、Marketing Studio・Ads Studio などの Studio 系も対象外で、常にクレジットを消費します。自動化を進めるほどこの差が効いてくるので、Week 5 の原価計算に必ず織り込んでください。"}},"packs":[{"id":"food","label":"飲食","lede":"飲食店の素材は、料理の寄り・店内・手元の所作・季節のカットという4種類の組み合わせでほぼ説明がつきます。費用と信用が決まるのは、静止画を何枚作るかではなく、どの1枚を動かすかです。静止画は手持ちのツールで何枚でも試せますが、動画化は1本ごとにクレジットを消費し、液体・湯気・溶けるといった表現は破綻率が高いため、ここで回数を見込み損なうと予算が崩れます。だからこのパックは、T2I で構図と光を確定させてから I2V で動きだけを足す2工程を前提に、30本すべてをペアで設計しています。東京の飲食店の課題は「人が来ない」ではなく「見つけてもらえない」「選ばれない」です。路地裏の店やビルの地下・2階以上の空中階は通りから存在が伝わらず、競合密度が高いため同じ価格帯の隣の店に流れます。家賃が高く回転率を確保しなければならない以上、素材は雰囲気ではなく「何の店で、どこにあり、何が他店と違うか」を数秒で示すものになり、インバウンド客の比率が高い立地では写真だけで判断される前提も織り込む必要があります。","subcategories":[{"id":"dish","label":"料理・ドリンク"},{"id":"interior","label":"店内・外観"},{"id":"people","label":"スタッフ・手元の所作"},{"id":"seasonal","label":"季節・イベント・限定"},{"id":"takeout","label":"テイクアウト・物販・ギフト"},{"id":"ads","label":"広告用カット・フック"}],"prompts":[{"id":"food-01","sub":"dish","title":"麺を持ち上げた醤油ラーメン（半逆光の下地）","purpose":"麺類の主力カット。麺の束とスープの照りで食欲を喚起し、次の工程で湯気を動かすための下地にする。","model":"静止画。手持ちのツールで可（ChatGPT / Gemini / Higgsfield の Soul 2.0 など）。器と背景の色を先に決めてから書くと歩留まりが上がる","text":"A bowl of shoyu ramen with chashu, nori and spring onion, a bundle of thin noodles lifted about fifteen centimeters above the broth by chopsticks held from outside the frame, broth clinging to the noodles and one drop about to fall, on a dark walnut counter with a softly blurred warm wooden interior behind, medium close-up at a 40-degree angle slightly above the rim, 85mm equivalent, shallow depth of field with the noodle bundle in focus, backlight from behind and above with strong rim light along the wet noodles and a weak soft fill from the front left so the near side is not crushed, glossy broth surface with specular highlights, matte ceramic bowl, dry nori texture, photorealistic food photography, muted warm grade, slight film grain, no text, no logo","effect":"半逆光は湿った麺の表面で正反射を起こし、麺の輪郭を1本ずつ光らせる。弱い前方フィルを入れるのは、逆光だけでは手前が黒く潰れて麺の束が1枚の塊に見えてしまうためで、シズル感の物理的な正体はこの反射と後述の湯気の透過光にある。","caution":"箸を持つ手が入ると指の本数と関節が崩れやすいので、箸はフレーム外から入る指定を外さない。丼の外側の文字や店名は生成させず `no text, no logo` を維持し、実物は編集で合成する。トッピングの内容は実際の提供品と一致させること（実物と異なる表現は景品表示法上の問題になりうるため、必ず依頼主に確認する）。","status":"未検証","flow":{"code":"T2I","step":"工程1 / 2","input":"新規。参照画像は使わず文章だけで作る。麺の種類・トッピング・器の色を依頼主の実物に置き換えてから生成する","output":"9:16 の静止画1枚。構図・光の方向・麺の照り・器の質感がここで確定する","next":"気に入った1枚を「ラーメンの湯気を立ち上らせる（I2V）」に渡し、湯気と汁の滴りだけを足す"}},{"id":"food-02","sub":"dish","title":"ラーメンの湯気を立ち上らせる（工程2）","purpose":"確定済みの静止画に湯気と汁の滴りだけを足し、3〜5秒の寄りカットにする。広告の2カット目に置く主力素材。","model":"Higgsfield / Wan 2.7、5秒・720p（約8クレジット）。流体・湯気・重力表現に最も強く、Unlimited 対象で最安。試行回数を稼げる","text":"Steam rises from the broth in thin continuous columns and drifts slowly toward the upper right, one drop of broth falls from the lowest noodle and lands on the surface creating a single small ripple, the noodle bundle sways only slightly, the camera holds still with no movement, slow motion, constant speed, subtle, no cuts, no new objects entering the frame","effect":"湯気は後方からの光を透過して白く浮き上がるため、静止画で決めた半逆光がそのまま動きの見せ場になる。カメラを止めて動くものを湯気と滴の2つに限定すると、モデルが余計な要素を作り足す余地が減り破綻率が下がる。","caution":"湯気は量が増殖して画面が白く飛ぶ破綻が頻発するため `subtle` と `thin continuous columns` を外さない。滴が落ちる表現は液体のため成功率が低く、3回生成して使えなければ湯気だけに絞って作り直す。カメラ移動は足さず1カット1動作に留める。","status":"未検証","flow":{"code":"I2V","step":"工程2 / 2","input":"「麺を持ち上げた醤油ラーメン（T2I）」で作った静止画1枚。新しく画像は作らない。構図と光は触らない","output":"5秒・720p の動画1本。湯気と1滴の落下だけが動く寄りカット","next":"15秒広告の2カット目に置く。店内カットと季節カットの間に挟んで食欲の山を作る","where":"生成画面でモデルを選ぶ（image-to-video）","whereNote":"最も安く、Seedance 2.0 系・Kling 3.0・Wan 2.7 なら Unlimited 対象"}},{"id":"food-03","sub":"dish","title":"天丼の寄り（衣の凹凸と段差）","purpose":"丼ものの主力カット。天ぷらの段差と衣の質感で量感を伝え、次の工程でたれを垂らす下地にする。","model":"静止画。手持ちのツールで可（ChatGPT / Gemini / Higgsfield の Soul 2.0 など）。ネタの構成を先に書き出してから生成する","text":"A tempura rice bowl filled with [prawn, squid, white fish and green pepper] tempura leaning against each other with visible height differences between the pieces, a small ceramic pitcher of dark tendon sauce beside it, on a black lacquer tray over a dark walnut table with a blurred counter behind, close-up at a 30-degree low angle so the stacked pieces do not flatten, 85mm equivalent, shallow depth of field focused on the front piece, backlight from the upper rear with rim light along the ridges of the batter and a weak diffused fill from the front right, crisp uneven batter with visible fried ridges, glossy sauce in the pitcher, matte lacquer, photorealistic food photography, warm neutral grade with restrained saturation, no text, no logo","effect":"低いアングルを指定するのは、俯瞰にすると天ぷらの段差が完全に潰れて量感が消えるため。衣の凹凸は半逆光で細かい影を作るので、揚げ具合と軽さがリム光と影の粒として読める。","caution":"衣の揚げ色が均一になると作り物に見えるので `uneven batter` を外さない。ネタの種類と数は実際の提供内容と一致させること（実物と異なる表現は景品表示法上の問題になりうるため、必ず依頼主に確認する）。彩度を上げすぎると不自然な色になるので `restrained saturation` を維持する。","status":"未検証","flow":{"code":"T2I","step":"工程1 / 2","input":"新規。参照画像は使わない。[ ] のネタ構成を依頼主の実際の品書きに置き換えてから生成する","output":"9:16 の静止画1枚。アングル・段差の見え方・衣の質感が確定する","next":"この1枚を「天丼にたれを一筋垂らす（I2V）」に渡し、注ぐ動作だけを足して冒頭フックにする"}},{"id":"food-04","sub":"dish","title":"天丼にたれを一筋垂らす（工程2）","purpose":"注ぐ動作で視線を止める。天丼の静止画を、冒頭フックに使える3秒カットに変える。","model":"Higgsfield / Wan 2.7、5秒・720p（約8クレジット）。液体の落下と表面張力の表現が最も安定する。Unlimited 対象","text":"A thin continuous stream of dark tendon sauce is poured onto the tempura from just outside the top of the frame, the stream stays unbroken from start to end, the sauce soaks slowly into the batter where it lands and runs down one piece onto the rice, the camera holds still with no movement, slow motion, constant speed, subtle, no cuts, no splashing outside the bowl, no new objects entering the frame","effect":"落下する液体は画面内で最も速く動く要素になるため、視線が最初にそこへ固定される。これが冒頭1秒のフックとして機能する理屈で、流れが切れずに繋がっていることと、着地点で衣が濡れて反射が増えることの2点が成立すれば成功カットになる。","caution":"液体は現行モデルが最も苦手とする表現で、流れが途中で消える・逆流する・量が増えるといった破綻が頻発する。`unbroken` と `no splashing outside the bowl` の制約を外さず、3回生成して使えなければ諦めて静止画のまま使う（これ以上回すとクレジット ce 2.0 系・Kling 3.0・Wan 2.7 なら Unlimited 対象"}},{"id":"food-24","sub":"seasonal","title":"季節と時間帯の差し替えスロット","purpose":"同じ料理・同じ店内のプロンプトから、四季と時間帯だけを変えた版を作る。年間を通じて素材を作り分ける部品。","model":"単体では生成しない。T2I / I2I のプロンプト本文の環境スロットと光スロットに差し込む","text":"SPRING: pale afternoon light at 5000K entering through the window, blurred cherry blossom branches outside, the room set for a group of eight | RAINY JUNE: flat diffused 6500K light from a fully overcast sky, rain streaks on the window glass and wet asphalt outside reflecting the sign light | SUMMER DAY: bright diffused daylight at 5600K with soft open shadows, heavy condensation on cold glassware, the air shimmering faintly above the pavement outside | AUTUMN: warm low west sun at 3500K raking across the room at a shallow angle with long shadows, yellow ginkgo leaves on the pavement outside | WINTER NIGHT: interior lamps at 2700K as the only sources against a deep blue 8000K exterior, neon from the building opposite as faint colored points, condensation on the inside of the glass","effect":"料理と内装を固定したまま環境と光だけを入れ替えると、同じ店に見える素材が季節ごとに揃う。東京の需要は歓送迎会（3〜4月）、梅雨の客足減（6月）、夏のビールと冷たい麺、紅葉と行楽（11月）、忘年会・新年会（12〜1月）の順に動くため、各時期の2か月前に同じプロンプトから出せる状態にしておくと撮り直しの手間が減る。","caution":"窓の外の植生と路面の状態は、配信する時期の実際の状況と合わせること。花見の画を梅雨に配信すると実態と乖離する。5つを一度に全部作る必要はなく、配信計画で使う時期のものだけを生成してクレジットを節約する。","status":"未検証","flow":{"code":"SLOT","step":"部品","input":"差し込んで使う。既存のプロンプト本文の環境スロットと光スロットを、この5行のどれか1つに貼り替える","output":"それ自体は何も生成しない。差し込んだ先のカットの季節と時間帯が変わる","next":"被写体・カメラ・質感を固定したまま、ここだけを入れ替えて同一店舗の季節版を揃える"}},{"id":"food-25","sub":"takeout","title":"テイクアウトのコーヒーと焼き菓子（路地で持つ）","purpose":"テイクアウト需要の訴求。路地で持ち歩く場面を作り、通勤や散策の途中の客に用途を想起させる。","model":"静止画（参照画像つき）。手持ちのツールで可（ChatGPT / Gemini / Higgsfield の Soul 2.0 など）。実物のカップ形状を合わせるため参照画像を添付する","text":"Use the reference image as the source for the cup shape, lid type and paper bag proportions. Keep the packaging silhouette unchanged and leave all printed surfaces blank. A hand holds the takeaway coffee cup with a paper bag of baked goods in the ot he face out of shadow, matte coated board, glossy ribbon, polished stone with a soft reflection of the box, photorealistic product photography, low key grade with deep shadows and a dark background, no text, no logo","effect":"暗い背景と上後方からの大きな柔らかい光でパッケージの上縁に幅のあるハイライトが走り、箱の角の位置と厚みが読めるようになる。前方の弱い反射板は正面を影から持ち上げるためのもので、これがないと商品の正面が黒く沈んで情報が消える。","caution":"パッケージの文字は生成では必ず崩れるので全面を無地にしておき、実際の印刷面は編集工程で合成する。中身の個数や内容が実物と異なると通販で問題になるため、必ず依頼主に確認する（実物と異なる表現は景品表示法上の問題になりうる）。参照画像の形から外れたら採用せず作り直す。","status":"未検証","flow":{"code":"I2I","step":"単発","input":"既存素材を使う。依頼主の実際のパッケージを撮った写真1枚を参照に添付し、形と比率を固定して光だけ作り直す","output":"静止画1枚。形は実物のまま、暗背景のローキーで整えたパックショット","next":"印刷面を編集で合成し、15秒広告の締めのパックショットと商品ページの主画像に使う"}},{"id":"food-27","sub":"takeout","title":"1本の縦動画から正方形と横版を作る","purpose":"配信面ごとの比率違いを、撮り直しや再生成なしで揃える。制作費を増やさずに掲載面を広げるための工程。","model":"Higgsfield / 動画のリフレーム機能。元動画1本（4〜30秒）を入力にする。Studio 系の機能は Unlimited 対象外で常に課金されるため、変換本数を先に決めてから着手する","text":"Keep the motion, cut timing, total duration and color of the reference video exactly as they are. Reframe only: produce a 1:1 version and a 16:9 version of the same footage, keeping the main subject in the center third of the frame in every frame. Do not add new content at the edges beyond what is needed to fill the new aspect ratio. Do not change the speed. Do not add text or logos.","effect":"縦で作った素材は、中央3分の1に主要被写体を収めておけば比率を変えても情報が落ちない。比率を変えるだけなら動きとタイミングという最も壊れやすい部分に触らずに済むため、再生成よりも結果が安定する。","caution":"元動画の端に重要な情報（料理の端、看板）がある場合は切り落とされるため、変換前に中央3分の1に収まっているか確認する。横版に広げると左右に不足分が生成されて不自然な壁や床が出ることがあるので、横版は引きのカットだけに限る。文字は変換後に各比率でそれぞれ合成する。","status":"未検証","flow":{"code":"V2V","step":"単発","input":"既存素材を使う。すでに採用した縦動画1本（4〜30秒）を入力にする。新しく映像は作らない","output":"同じ映像の 1:1 と 16:9 の2本。動きと尺は元のまま","next":"比率ごとに文字を合成し、縦はリール、1:1 はフィード、16:9 はウェブサイトの掲載に割り振る","where":"生成画面でモデルを選ぶ（image-to-video）","whereNote":"最も安く、Seedance 2.0 系・Kling 3.0・Wan 2.7 なら Unlimited 対象"}},{"id":"food-28","sub":"ads","title":"冒頭1秒のフック：ビールを注ぐ（工程2）","purpose":"音なし視聴を前提に、最初の1秒で指を止める。15秒広告の1カット目に置く最重要素材。","model":"Higgsfield / Wan 2.7、5秒・720p（約8クレジット）。注ぐ・泡立つという液体表現で最も破綻が少なく、安いので試行を重ねられる。Unlimited 対象","text":"Pale amber beer is poured from outside the top of the frame into the mug in one unbroken stream, the foam head builds upward and stops level with the rim without overflowing, condensation drops continue to run down the outside of the glass, the camera holds still with no movement, slow motion, constant speed, subtle, no cuts, no splashing outside the glass, no hands visible, no new objects entering the frame","effect":"泡が縁まで立ち上がって止まるという上向きの動きは、画面内で最も目を引く変化になり、音がなくても視線を固定できる。泡が縁で止まる条件を明示するのは、あふれる絵は清潔感を損ない広告として使えないため。","caution":"液体は最も破綻しやすい表現で、流れが切れる・泡が無限に増える・あふれるといった失敗が頻発する。`unbroken` `stops level with the rim without overflowing` `no splashing` の3つを外さず、3回で使えなければ静止画のズームインに切り替える。アルコールの広告表現は配信面の規定を事前に確認する。","status":"未検証","flow":{"code":"I2V","step":"工程2 / 2","input":"「生ビールの泡と結露（T2I）」で作った静止画1枚。新しく画像は作らない。泡の上に余白がある1枚を選ぶ","output":"5秒・720p の動画1本。頭の1〜1.5秒が冒頭フックとして使える","next":"15秒広告の1カット目に置き、文字のフックを編集で重ねる。残りは中盤の繋ぎに回す","where":"生成画面でモデルを選ぶ（image-to-video）","whereNote":"最も安く、Seedance 2.0 系・Kling 3.0・Wan 2.7 なら Unlimited 対象"}},{"id":"food-29","sub":"ads","title":"フック文言だけを差し替えた比較版を作る","purpose":"映像を固定したまま訴求メッセージだけを変え、どの言い方が効くかを正しく比較する。","model":"Higgsfield / 動画の変種生成機能（Ad Multiplier 相当）。元動画1本（4〜30秒）を入力にする。Studio 系は Unlimited 対象外で常に課金されるため、検証本数とコストを先に見積もる","text":"Keep the motion, framing, cut timing, total duration, color and all visual content of the reference video exactly as they are. Replace only the opening hook line and the closing call to action. Do not change the order of the shots. Do not change the speed. Do not add or remove any shot.","effect":"映像という変数を完全に固定するため、差が出たときにそれが文言の効果だと言える。これを守らずに映像も一緒に変えると、どちらが効いたのか分からない結果しか残らない。競合密度の高い立地では「何の店か」「どこにあるか」「他店と何が違うか」のどれを先に言うかで反応が変わるため、この比較が訴求設計の根拠になる。","caution":"1回の検証で変える変数は1つに限定する。文言とCTAを同時に変えると切り分けができない。文言に価格・待ち時間・在庫といった変動する内容を入れると実態との乖離が起きやすいので、依頼主に現在の提供条件を確認してから作る。成果を断定する文言は使わない。","status":"未検証","flow":{"code":"V2V","step":"単発","input":"既存素材を使う。すでに配信した動画広告1本（4〜30秒）と、差し替える文言の案を2〜3種類用意する。映像は作らない","output":"映像が同一で文言だけが違う動画が2〜3本","next":"同一条件で配信して比較する。勝った文言を次の素材の標準にし、負けた版は破棄する","where":"Ads Studio の Ad Multiplier","whereNote":"Unlimited 対象外。常にクレジットを消費する"}},{"id":"food-30","sub":"ads","title":"15秒広告のカット割り表（生成前に埋める）","purpose":"生成を始める前にカット数・使うプロンプト・消費クレジットを確定させ、作りながら予算が膨らむのを防ぐ。","model":"生成AIには投げない。表計算ソフトかテキストで自分が埋める。埋め終わってから画像と動画の生成に着手する","text":"【15秒広告 カット割り表】\n案件名：　　　／　依頼主：　　　／　配信面（縦・1:1・横）：　　　／　音あり／なし：\n\n| # | 秒数 | 役割 | 使うプロンプトID | 工程 | 推奨モデル | 想定クレジット | 文字（編集で合成） | 再生成の上限 | 確認事項 |\n|---|---|---|---|---|---|---|---|---|---|\n| 1 | 0.0-1.5 | 冒頭フック | food-28 | 工程2（food-10の出力） | Wan 2.7 5秒720p | 8 | フック文言 | 3回 | 配信面のアルコール表現規定 |\n| 2 | 1.5-4.0 | 料理の寄り | food-02 | 工程2（food-01の出力） | Wan 2.7 5秒720p | 8 | なし | 3回 | トッピングが品書きと一致 |\n| 3 | 4.0-6.0 | 所作 | food-18 | 工程2（food-07の出力） | Wan 2.7 5秒720p | 8 | なし | 3回 | 指の本数を目視確認 |\n| 4 | 6.0-8.0 | 繋ぎ | food-23 | 単発 | Kling 3.0 5秒1080p | 12.5 | なし | 2回 | 配信時期と天候（雨・濡れた路面）が合うか |\n| 5 | 8.0-11.0 | 店内 | food-14 | 工程2（food-13の出力） | Kling 3.0 5秒1080p | 12.5 | なし | 2回 | 席数・設備が実物と一致 |\n| 6 | 11.0-13.0 | 外観・所在 | food-16 | 工程2（food-15の出力） | Kling 3.0 5秒1080p | 12.5 | 店名・階数・最寄駅 | 2回 | 看板・階段の位置と建物が実物と一致 |\n| 7 | 13.0-15.0 | 締めのパックショット | food-26 | 単発（静止画のまま） | 静止画のみ | 0 | 商品名・CTA | - | 内容量・個数が実物と一致 |\n\n静止画工程（T2I / I2I）の使用プロンプトID：food-01 / food-07 / food-10 / food-13 / food-15 / food-26\n動画の想定クレジット合計：　　　（1クレジット＝$0.05 で換算した金額：　　　）\n再生成の上限を全て使い切った場合の上限クレジット：\n依頼主の確認が済んだ日付：　　　／　確認した人：","effect":"カットごとに使うプロンプトID・モデル・再生成の上限クレジットを先に書き出すと、動画生成の総額が着手前に確定する。静止画は手持ちのツールで枚数を気にせず試せる一方、クレジットを使うのは動画工程だけなので、その行数と上限回数が見積もりのすべてになる。","caution":"再生成の上限を空欄にしたまま着手すると、液体や溶ける表現で無制限に回してしまい見積もりが崩れる。確認事項の列は必ず埋め、実際に提供していない料理・設備・内容量を描いていないか依頼主に確認した日付と担当者を残す（実物と異なる表現は景品表示法上の問題になりうる）。配信面ごとの比率違いは food-27 で後から作る前提で、ここでは1比率だけを設計する。","status":"未検証","flow":{"code":"DOC","step":"単発","input":"生成AIには入力しない。案件名・配信面・カット数を自分で決めてから、上の表の空欄を埋めていく","output":"カットごとのプロンプトID・モデル・上限クレジットが確定した1枚の表","next":"表の静止画工程のIDから順に生成し、確定した1枚ごとに対応する動画工程へ渡していく"}}],"legal":"飲食の広告表現で中心になるのは景品表示法です。以下は2026年10月11日に公的資料で確認した内容の整理であり、法的助言ではありません。個別の案件は弁護士または消費者庁の相談窓口に確認してください。\n\n**1. 飲食に明示的に及ぶ公式文書があります**\n消費者庁「メニュー・料理等の食品表示に係る景品表示法上の考え方」（2014年3月策定、2016年4月改定）は、**レストラン・ホテル・百貨店のメニューや料理の表示**を明示的に対象としています。判断基準は、表示上の特定の文言や写真から受ける印象ではなく、**表示内容全体から一般消費者が受ける印象・認識**であり、**故意かどうかは問われません。** 写真もメニュー全体の印象を構成する要素として扱われ、料理写真が誤認を招くとされた事例が挙げられています。\n\n**2. 実際に提供しているものと一致させること**\n景品表示法 第5条第1号の優良誤認表示は、商品の内容について実際のものより著しく優良であると示す表示を禁じています。AI生成の料理カットで特に危険なのは次の点です。\n- 実際には使っていない食材が写り込む\n- 量・サイズ・盛り付けが実物と大きく違う\n- 実際には提供していない品が画面に入る\n- 店内の設備や席数が実態と異なる\n生成後に**依頼主と一緒に実物と突き合わせる工程**を必ず入れてください。\n\n**3. 注意書きで打ち消せる前提にしないこと**\n消費者庁の打消し表示に関する実態調査（2017年）によれば、動画広告の打消し表示のうち**42.4%が画面表示2秒以下**、99.2%が文字のみで、ある検証動画では**6つの打消し表示のうち1つ以上を見落とした回答者が97.6%**でした。「写真はイメージです」と小さく出せば済む、という設計は実務上機能しません。表示するなら、読める大きさと読める時間を確保してください。\n\n**4. ステルスマーケティング規制（2023年10月1日施行）**\n事業者が表示内容を決定していれば、第三者による投稿に見えても事業者の表示として扱われます。規制の対象は広告主である事業者で、インフルエンサー等は対象外です。運用基準は不適切な例として、**動画で表示時間が短すぎる**、末尾にのみ表示、ハッシュタグに埋没している、小さすぎる、を挙げています。公式Q&Aは、動画について冒頭のみの表示では不十分な場合があり、継続的な画面表示が望ましいとしています。\n\n**5. AI生成であることの表示義務は、確認した範囲では存在しません**\n2026年10月時点で、広告にAI生成である旨の表示を義務づける日本の法令は確認できませんでした。存在するのは非拘束のソフトローのみです。ただし、表示の有無にかかわらず、実際の料理や店舗について誤認させれば景品表示法が適用されます。\n\n**出典**：消費者庁「メニュー・料理等の食品表示に係る景品表示法上の考え方」／同「不当な表示」／同「打消し表示に関する実態調査報告書」／同 ステルスマーケティング規制の運用基準およびQ&A"},{"id":"realestate","label":"不動産","lede":"不動産の素材は、空室期間と成約価格に直接効きます。東京の賃貸は1月から3月が繁忙期、夏が閑散期という年間サイクルがあり、繁忙期の初週で反応が取れなかった物件はそのまま夏まで動かないことが起きます。売買でも掲載画像の情報量が内見予約の歩留まりを左右します。ただしこの業種には、広告に使う写真は原則として取引しようとする物件そのものを撮影したものを使うという業界の規律があり、AI生成画像を「その物件の写真」として出すことはできません。したがってこのパックのプロンプトは、空室に家具を置くバーチャルステージング、未着工・工事前の完成予想、周辺環境の紹介、暮らしの情景、広告の装飾という五つの用途に限定して設計しています。東京では駅徒歩分数と沿線、採光と方角、隣棟間隔と視線の抜け、天井高と収納量、宅配ボックスやオートロックといった設備、二重サッシの遮音、在宅勤務用のスペースが価格以外の判断材料になり、築古物件はリノベーション後の姿を見せられるかどうかで売り方が変わります。費用は桜と新緑の時期にしか撮れないカットがあることに効き、信用は「イメージ」と「物件写真」を混ぜないという一点に効きます。","subcategories":[{"id":"exterior","label":"外観・アプローチ"},{"id":"interior","label":"室内・間取り"},{"id":"lifestyle","label":"暮らしの情景"},{"id":"area","label":"周辺環境・立地"},{"id":"commercial","label":"事業用・投資用"},{"id":"ads","label":"広告用カット・フック"}],"prompts":[{"id":"realestate-01","sub":"exterior","title":"未着工の低層マンション完成予想外観（ブルーアワー）","purpose":"用途は「完成予想のイメージ」。まだ建っていない新築賃貸や建て替え計画の外観を、図面と仕様書だけでは伝わらない形で示す。着工前の先行募集と事業計画の資料に使う。","model":"静止画。手持ちのツールで可（ChatGPT / Gemini / Higgsfield の Soul 2.0 など）。階数と開口の整合を優先するなら、同じプランの立面図を参照として添えると寸法感が安定する","text":"An architectural visualization of an unbuilt [five-story] low-rise rental apartment building planned for an inner-city Tokyo site, no people and no vehicles, a [matte light grey] tiled facade with flush aluminum sash windows, continuous steel balcony railings with frosted glass panels, a recessed ground-floor entrance with a glazed auto-lock door and a parcel locker bank set into the side wall, a narrow planted setback along the street with two [zelkova] street trees, neighbouring four-story buildings tight against both side boundaries, three-quarter view from standing eye level at about 1.5m on the opposite side of a narrow street, 24mm equivalent, deep focus so the parapet line and the entrance floor both stay sharp, blue hour with an 8000K deep blue sky and no direct sun, warm 2700K light from inside the dwelling windows and one 3000K downlight at the entrance soffit as the only warm sources, the glazed facade of the building across the street returning a faint cool reflection onto the near wall, matte ceramic tile, anodized aluminum sash, frosted glass, wet dark asphalt, photorealistic architectural visualization, restrained contrast, no text, no logo, no signage, no nameplate, no room numbers","effect":"ブルーアワーは空の青と室内の暖色という色温度差が生まれるため、窓の配置と住戸数が輝度の違いだけで読める。直射日光がない時間帯なので外壁面に強い影が落ちず、タイルの目地やサッシの納まりといった仕様の細部が潰れずに残る。","caution":"完成予想のイメージであることを図版の近くに明示し、既存物件の実際の外観写真と同じ並びに混在させない。実際のプランにない階数・バルコニー・植栽を足さないこと。階高、開口の位置、隣棟との離隔は立面図と必ず突き合わせる。仕様が設計図と異なると優良誤認につながるため、依頼主と図面で確認すること。","status":"未検証","flow":{"code":"T2I","step":"工程1 / 2","input":"新規。参照画像は使わず文章だけから作る。階数・外壁仕上げ・街路樹・隣棟の状況を実際のプランと敷地に書き換える。実在の建物は描かせない","output":"16:9 の静止画1枚。外観の立体、窓の配置、夕暮れの光がここで確定する","next":"図面と整合した1枚を「完成予想外観に街の時間を足す」に渡して動かす。開口位置や階数が図面と違う枚数は使わない"}},{"id":"realestate-02","sub":"exterior","title":"完成予想外観に街の時間を足す","purpose":"用途は「完成予想のイメージ」。静止画の完成予想を5秒の動画にして、その建物が建つ通りの時間帯の空気ごと伝える。先行募集ページの冒頭と事業計画の提示に使う。","model":"Higgsfield / Kling 3.0、5秒・1080p（約12.5クレジット）。建物の直線とカメラの安定性が両立し、外観カットの主力になる","text":"The warm light inside the dwelling windows holds steady without flickering, one window on an upper floor brightens slightly as if a light is switched on, the street trees sway very slightly as if from a weak breeze, a faint reflection moves slowly across the wet asphalt, the building geometry stays unchanged, the camera stays locked off with no movement, slow, subtle, constant speed, no cuts, no change to the framing, the lighting or the facade","effect":"窓の点灯という一点の輝度変化は、建物の輪郭や開口の形を保ったまま時間の流れだけを足せる。路面の反射が緩やかに動くことで、通りが使われている状態であることが動きだけで示される。","caution":"完成予想のイメージであることを動画内の静止テキストではなく、投稿文や資料側で明示する。窓の数が途中で増える、パラペットの線が歪む、バルコニーの手すりが消えるといった破綻が出た出力は破棄する。実際には存在しない階や設備が生えた枚数も使わない。等倍でパラペットと開口の輪郭を確認すること。","status":"未検証","flow":{"code":"I2V","step":"工程2 / 2","input":"「未着工の低層マンション完成予想外観（ブルーアワー）」（T2I）で作った静止画1枚。新しく画像は作らない。構図・光・仕様は静止画で確定済みのものを使う","output":"5秒の動画1本。窓の点灯、街路樹のわずかな揺れ、路面の反射だけが動く","next":"先行募集ページの冒頭ループに置く。3回試してパラペットの線が保たれなければ静止画のまま使い切る","where":"生成画面でモデルを選ぶ（image-to-video）","whereNote":"最も安く、Seedance 2.0 系・Kling 3.0・Wan 2.7 なら Unlimited 対象"}},{"id":"realestate-03","sub":"exterior","title":"築古木造アパートの外観リノベ完成予想","purpose":"用途は「リフォーム後のイメージ」。現況の外観写真を参照にして、外壁の張り替えと共用階段の更新、サイン計画を入れた工事後の状態を示す。オーナーへの改修提案と工事前の先行募集に使う。","model":"静止画。手持ちのツールで可（ChatGPT / Gemini / Higgsfield の Soul 2.0 など）。現況写真を参照として渡すこと自体が精度の条件になる","text":"Keep the building volume, the roof shape, the number of floors, the window and door positions and sizes, the exterior stair location, the lot boundaries and the camera viewpoint of the reference photograph exactly as they are. Change only the finishes and the e and the far wall corner inside the frame in every interior shot, keep the whole window opening inside the frame, keep the upper third of the vertical frame free of important subject matter so a caption can be added later, do not add or remove shots, do not change the color grade, do not crop into the subject so that the room looks narrower than the original, no text, no logo","effect":"尺とカット順を固定したまま画角だけを変えるため、横型で検証済みの構成がそのまま縦型に移る。床の線と奥の壁の角を必ず残す指定は、縦に切ったときに失われやすい奥行きの手がかりを保つためのもので、部屋の広さの印象が変わるのを防ぐ。","caution":"縦型に切ると部屋が実際より狭く見える、または窓が切れて採光と方角が判断できなくなるという変化が起きる。切り出し後に、元の横型と並べて広さの印象が変わっていないかを必ず確認し、変わったカットは使わない。実際の広さや眺望が誤認される切り方をしないこと。Studio 系は常に課金されるため、縦型を作る本数を先に決めてから着手する。","status":"未検証","flow":{"code":"V2V","step":"単発","input":"すでに完成している横型の物件紹介動画1本（15〜30秒）。新しく映像は作らない。縦型の配信先と本数を先に決めておく","output":"カット順と尺が同じ縦型（9:16）の動画1本","next":"Instagram のリールと賃貸ポータルの動画枠に出す。テキストは編集工程で上部三分の一に載せる","where":"Ads Studio の Ad Multiplier","whereNote":"Unlimited 対象外。常にクレジットを消費する"}},{"id":"realestate-27","sub":"ads","title":"内見動画の冒頭フックと締めを差し替える","purpose":"用途は「広告の装飾要素」としての再編集。物件カットには一切触れず、冒頭のフックと最後の締めだけを差し替えて、同じ素材から複数の訴求を作る。繁忙期の配信面ごとの出し分けとA/B検証に使う。","model":"Higgsfield の Studio 系（Ad Multiplier 相当）。Unlimited 対象外で常に課金されるため、作る本数を先に決めてから着手する","text":"Keep every property shot, the shot order and the color grade of the reference video exactly as they are. Replace only the first shot and the last shot: the opening becomes [a 1.5 second shot of sunlight moving across a plain pale floor with no property or window detail visible], the closing becomes [a 2 second shot of a matte dark surface with an even empty area in the upper two thirds for a caption], hold the total duration within [0.5 seconds] of the original, do not re-time or re-order the shots in between, do not change the color grade, do not alter any property shot, no text, no logo","effect":"物件カットを固定して前後だけを差し替えると、訴求の違いだけを変数にした比較ができ、どの入り方が止まるかを少ない本数で判断できる。最初の1.5秒に物件を出さないことで、同じ本編を違う層に向けて配信できる。","caution":"差し替えた冒頭と締めは生成物なので、物件の実写カットと視覚的に連続して見えないよう、質感か明るさを明確に変える。物件カットが1フレームでも変化した出力は破棄する。締めに載せる文字は生成させず編集工程で入れること。訴求文の内容が物件の実態と異なると優良誤認につながるため、依頼主に文面を確認する。Studio 系は常に課金されるため本数を先に決める。","status":"未検証","flow":{"code":"V2V","step":"単発","input":"すでに完成している内見動画1本（15〜30秒）。新しく物件映像は作らない。差し替える冒頭と締めの案を先に文章で決めておく","output":"本編が同一で冒頭と締めだけが違う動画が、案の数だけできる","next":"同一予算で同時に配信し、3秒視聴率で入り方を比較する。採用した組み合わせを以後の既定にする","where":"Ads Studio の Ad Multiplier","whereNote":"Unlimited 対象外。常にクレジットを消費する"}},{"id":"realestate-28","sub":"ads","title":"元写真の幾何を変えない必須記述（全I2Iに差し込む）","purpose":"用途を問わず、実際の物件写真を参照にするすべての生成に同じ文言を差し込み、間取り・開口・床材・窓外の抜けが勝手に変わる確率を下げる。このパックでもっとも重要な部品。","model":"参照画像を使う静止画・動画のプロンプト冒頭に共通で挿入する。他のスロットは変えない","text":"Keep the room or building geometry, the window and door positions, the ceiling height, the floor material, the wall finish, the sash and casing details, the tatami layout where present, the built-in closet positions, the lot boundaries and the camera viewpoint of the reference photograph exactly as they are. Keep the view outside every window exactly as the reference shows it, including the distance and height of the neighbouring buildings. Do not widen the room, do not raise the ceiling, do not straighten a sloping ceiling, do not add or move windows, skylights, balconies, storage, fixtures or equipment that are not in the reference, do not remove the air conditioner, the intercom panel or the switch plates. Add or change only what the instruction above lists, and nothing else. no text, no logo, no signage, no nameplate, no room numbers","effect":"変えてはいけない要素を個別の名詞として列挙すると、モデルが参照画像を雰囲気の手本として扱う余地が減り、幾何の情報として扱うようになる。隣棟の距離と高さまで名指しで固定するのは、窓外が置き換わって視線の抜けや採光が実際より良く見える破綻が、東京の賃貸と売買でもっとも重い誤認につながるため。","caution":"この文言を入れても指定どおりに出ない枚数が必ず混ざる。生成後は必ず元写真と並べて、間取り・窓の位置・建具・床材・窓外の景色が変わっていないかを等倍で確認し、変わった枚数は作り直さずに破棄する。実際には存在しない設備・眺望・広さを足した出力は、どれほど見栄えが良くても使わない。元の写真は加工なしの状態で必ず別に保管すること。","status":"未検証","flow":{"code":"SLOT","step":"部品","input":"参照画像を使うすべてのプロンプト（realestate-03 / 04 / 05 / 07 など）の冒頭に、この文言を差し込む。差し替えたい内容の記述はこの後ろに続ける","output":"それ自体は何も生成しない。差し込んだ先の出力が、元写真の幾何と窓外の状況を保つ確率が上がる","next":"不動産パックの全I2Iの既定値にする。検品は元写真との並べ比較で行い、満たさない枚は破棄する"}},{"id":"realestate-29","sub":"ads","title":"東京の光（曇天・西日・ブルーアワー・隣棟の影）","purpose":"東京の物件と街を東京の光で見せる。方角と階数、隣棟との関係という訴求軸が、光の条件として画面に出るようにする。室内と屋外のどちらにも使う部品。","model":"静止画・動画の両方で、光のスロットに共通で挿入する。4つのうち1つを選んで使う","text":"A — fully overcast: flat diffused 6500K light from a uniformly grey sky, no hard shadows, even illumination across the whole frame, exposure held so the sky keeps a faint tone instead of clipping to flat white | B — late-afternoon west light: direct 3400K sunlight from a low angle of about 15 degrees entering through one window only, a long hard-edged patch of light thrown across the floor and up the opposite wall, the rest of the room falling off into soft shadow that still holds detail, no ceiling fixture switched on | C — blue hour with city light: 8000K deep blue ambient with no direct sun, warm 2700K window light from the surrounding buildings and 4000K street lights as the only direct sources, dry or wet asphalt returning that light faintly upward | D — shaded lower floor: no direct sun at all, soft 6800K skylight entering from above the frame as the only source, a faint cool reflection bounced off the glazed facade of the building opposite filling the near surfaces, exposure held so the shaded wall keeps surface texture instead of crushing to flat grey","effect":"東京の光は空の明るさより、隣の建物に何が遮られ何が返ってくるかで決まる。Bの西日は床と壁に硬い光の帯を作るので方角が一目で読め、Dの天空光と向かいのガラス面からの反射は、直射が入らない低層階や北向き住戸の実際の明るさを正確に示す。どれを選ぶかで方角と階数、時刻が同時に決まる。","caution":"AとBを混ぜると、硬い光の帯がありながら影の輪郭がないという物理的に成立しない画になる。1カットにつき1つだけを選ぶこと。Bの西日は夏の暑さという負の要素とも結びつくので、使う物件と季節を選ぶ。Dを使うべき低層階や北向き住戸にBやCを当てると、実際には入らない光を見せることになるので、方角と階数を確認してから選ぶ。","status":"未検証","flow":{"code":"SLOT","step":"部品","input":"静止画または動画プロンプトの光のスロットに、A・B・C・D のうち1つだけを差し込む。他のスロットは変えない。物件の方角と階数を先に確認して選ぶ","output":"それ自体は何も生成しない。差し込んだ先の画の光が、その方角と階数で実際に起きる条件になる","next":"1物件の全カットで同じ記号を使い、方角と時刻を統一する。最終的なトーンの統一は編集のカラーグレーディングで担保する"}},{"id":"realestate-30","sub":"ads","title":"生成素材の用途区分・対応管理表","purpose":"生成した素材がどの用途で作られたか、どの元写真に対応するか、イメージ表記が付いているかを一元管理する。物件写真とイメージの混在事故を入力段階で止めるための帳票。","model":"生成AIに投げるものではない。表計算ソフトで作り、物件ごとに1シートで運用する","text":"【生成素材 用途区分・対応管理表】物件ごとに1シート。列は次の12項目。\n1. 素材ID（物件コード＋連番。例 SG2601-03）\n2. 用途区分（1 バーチャルステージング / 2 完成予想・リフォーム後 / 3 周辺環境・エリア紹介 / 4 暮らしの情景 / 5 広告の装飾。必須入力）\n3. 区分の根拠（用途2なら「未着工」または「工事前」のどちらかを記入。空欄の行は掲載しない）\n4. 種別（物件実写 / AI生成 / 物件実写をAIで加工）\n5. 元素材ID（参照に使った実写のID。種別が「加工」なら必須）\n6. 元素材の保管先（加工前の原本のファイルパス。必須）\n7. 使用プロンプトID（本パックのID。例 realestate-05）\n8. 幾何確認（元写真と並べて間取り・窓位置・建具・床材・窓外の抜けを確認した日と担当者。種別が「加工」なら必須）\n9. 実在性の確認（描かれた設備・広さ・眺望・採光が実際に存在するか。「実在 / 計画あり / 存在しない」。「存在しない」の行は掲載しない）\n10. 「イメージ」表記（用途1〜5すべてで必須。表記文と掲載位置を記入。空欄の行は掲載しない）\n11. 依頼主・所有者確認（未 / 送付済 / 承諾済。承諾日を記入）\n12. 掲載面（自社サイト / ポータル / 紙媒体 / 商談資料。面ごとに表記ルールが違うため個別に記録）\n\n運用の規則を表の上部に固定で書いておく。「種別が AI生成 または 物件実写をAIで加工 の素材は、物件実写と同じギャラリー・同じスライド順に置かない」「用途区分と『イメージ』表記のどちらかが空欄の素材は社外に出さない」「実在性の確認が『存在しない』の素材は破棄する」「加工前の原本を保管していない素材は使わない」。\n\n繁忙期の運用として、1月から3月に使う素材は前年の秋までに作って11列を埋めておく。桜や新緑のエリア紹介カットは撮影できる時期が限られるため、実写の有無をこの表で先に確認し、足りない分だけを生成に回す。","effect":"用途区分とイメージ表記を必須入力の列にすることで、物件実写との混在が掲載前の入力段階で検出できる。元素材IDと原本の保管先を必須にしておくと、後から幾何の確認をやり直せるため、問い合わせや指摘があったときに元写真と並べて即答できる。","caution":"この表を作らずにAI生成画像を物件ギャラリーに入れると、後から実写と区別できなくなり、全件の見直しが必要になる。用途区分と種別の2列だけは物件の受託時点で必須入力にすること。依頼主確認の列は承諾の記録を残すこと自体が目的なので、口頭了解で埋めない。掲載面ごとに表記の置き方が変わるため、面を増やすたびに行を複製して個別に管理する。","status":"未検証","flow":{"code":"DOC","step":"単発","input":"生成AIには投げない。既存の物件管理表に12列を足すか、受託時に新規シートを作る。自社の物件コード体系に合わせる","output":"物件ごとの素材一覧1シート。物件実写とAI生成の区別、用途区分、表記の有無がその場で判断できる状態","next":"ここで完結。制作着手の最初の作業にする。生成を始めてから作ると用途区分と原本の記録が抜ける"}}],"legal":"不動産広告は、本教材が扱う4業種のなかで**写真・動画の規制が突出して厳しい分野**です。着手前に必ず読んでください。以下は2026年10月11日に公的資料で確認した内容の整理であり、法的助言ではありません。個別の案件は所管の公正取引協議会または弁護士に確認してください。\n\n**1. 物件の写真・動画は、原則としてその物件そのものでなければなりません**\n不動産の表示に関する公正競争規約 施行規則 第9条第22号は、宅地又は建物の写真又は動画は取引するものを表示することと定めています。**動画も条文に明記されています。** 例外は、工事完了前などでその建物の写真・動画を用いることができない事情がある場合に限られ、しかも「取引する建物を施工する者が過去に施工した建物」でなければなりません。外観は構造・階数・仕様が同一で規模・形状・色等が類似するもの、内部は写される部分の規模・仕様・形状等が同一のものに限定されます。\nこの例外を使う場合は、他の建物である旨と、外観なら取引する建物と異なる部位を明示する必要があり、**明示する位置まで指定されています**（写真は写真に接する位置、動画は画像中）。さらに、大きく掲載するなど取引する建物であると誤認されるおそれのある表示は禁止されています。\n**実物に基づかないAI生成の建物外観・内観は、この実物要件を満たしません。** したがって本パックのプロンプトは、物件そのものの写真・動画として使う用途を想定していません。\n\n**2. CG・完成予想図として使うなら「その旨」の明示が必須です**\n同 施行規則 第9条第23号は、コンピュータグラフィックス、見取図、完成図、完成予想図はその旨を明示して用い、周囲の状況について表示するときは現況に反する表示をしないことと定めています。AIが隣地・街並み・眺望を創作していないか、生成後に必ず現況と突き合わせてください。\n\n**3. 規模・形状・構造と、眺望・景観は特に厳しく見られます**\n規約第23条(42)は、写真・動画・CG・完成予想図による表示で、物件の規模、形状、構造等について事実に相違する表示や実際より優良と誤認されるおそれのある表示を禁じています。同(43)は眺望・景観について同様に定めています。\n\n**4. 宅地建物取引業法 第32条（誇大広告等の禁止）**\n著しく事実に相違する表示、実際より著しく優良・有利と誤認させる表示が禁止されています。媒体は問わず、インターネットも対象です。対象となる8項目には**形質**（構造・材料・性能・経過年数等）と**現在又は将来の環境**（周囲の状況、静寂さ、快適さ、方位等の立地条件、周辺施設）が含まれており、AI生成画像が最も誤認を生みやすい領域です。違反は業務停止処分の対象となり、第81条により六月以下の懲役若しくは百万円以下の罰金、又はその併科と定められています。\n\n**5. AI生成であることの表示義務は、確認した範囲では存在しません**\n不動産の表示規約にも、AI生成物の表示を義務づける規定は見当たりませんでした。義務づけられているのは「他の建物である旨」「CG・完成予想図である旨」の明示です。**ただし表示義務がないことは、自由に使えることを意味しません。** 規律は「AI生成かどうか」ではなく「表示内容が実際と異なるか、優良と誤認させるか」で働きます。\n\n**出典**：不動産の表示に関する公正競争規約および施行規則（首都圏不動産公正取引協議会）／宅地建物取引業法の解釈・運用の考え方 第32条関係／消費者庁「不当な表示」"},{"id":"recruit","label":"採用","lede":"東京の採用素材は、受注用の素材とは評価軸が違います。求人倍率の高い市場では「人が来ない」ことより「応募は来るが他社に流れる」「面接に来ない」「入って三か月で辞める」ことが課題の中心にあり、素材の仕事は同じ沿線に並んだ他社の求人と比較されたときに選ばれることです。応募者が見ているのは商品の見栄えではなく「自分がここで働けるか」であり、判断材料になるのは最寄駅からの距離と通勤のしやすさ、シフトがどこまで融通するか、職場の広さと清潔さ、手元で何をしているか、教えてくれる人がいるかです。飲食、都市型ホテル、内装・設備工事、介護・保育、小売、物流倉庫、清掃・ビルメンテナンスでは、Wワーク可・週2から・扶養内といった働き方の幅、深夜手当とまかない、未経験歓迎と研修、正社員登用、残業の実態、スタッフの年齢構成、外国籍スタッフの受け入れとインバウンド客対応で語学が活きること、育児との両立が、そのまま比較の項目になります。費用は撮影の段取りに効き、信用は人物の扱い方に効きます。このパックで最も重要な制作上の原則は、AI生成の人物をその会社に実在する社員であるかのように見せないことです。求人情報には虚偽または誤解を生じさせる表示をしてはならないという考え方があるため、人物が写るカットは「顔を映さない構図」「イメージ素材として明示するもの」「実在社員の写真を入力にした I2I / I2V」の三つのいずれかに必ず当てはめ、手元・後ろ姿・シルエットを主軸にして運用してください。顔を映さない型は肖像の問題が生じにくく、どの会社でも使い回せるため、商品としての汎用性も同時に上がります。","subcategories":[{"id":"workplace","label":"職場の空気・環境"},{"id":"people","label":"働く人・手元の所作"},{"id":"process","label":"仕事の流れ・一日"},{"id":"culture","label":"文化・待遇・福利厚生"},{"id":"message","label":"メッセージ・訴求"},{"id":"ads","label":"求人広告用カット・フック"}],"prompts":[{"id":"recruit-01","sub":"workplace","title":"開店前の厨房・窓光の全景（無人）","purpose":"飲食店の厨房を、広さと清潔さが読める状態で見せる。同じ沿線の他店と比較されたときに「狭くて汚い厨房ではない」ことを一枚で示す基本素材で、人物を一切入れないため肖像の問題が生じない。","model":"静止画。手持ちのツールで可（ChatGPT / Gemini / Higgsfield の Soul 2.0 など）。設備の文字やメーカー名は生成させないので、後述の注意を参照","text":"The kitchen of a small restaurant in a Tokyo backstreet before opening, completely empty of people, a stainless steel prep counter wiped down and clear, a six-burner range and a griddle with the surfaces clean, knives seated in a magnetic rail, stock pots stacked upside down on a drying rack, a floor-standing fan and a rubber mat on a dry tiled floor, a large window on the left wall looking onto a narrow street with the tiled wall of the next building across it, wide interior shot at standing eye level from the doorway, 24mm equivalent, deep focus so the far wall, the range and the floor drain all stay sharp, daylight entering only from the left window at 4500K as the main source with a weak overhead fluorescent fill so the ceiling does not go dark, brushed stainless with faint directional grain, matte tile grout, dry floor with no standing water, photorealistic documentary interior photography, neutral grade, no text, no logo","effect":"窓光を主光源にすると光に方向が生まれ、ステンレスの面ごとに明暗が分かれて設備の立体が読める。天井照明だけの平板な絵では奥行きが消え、厨房の広さという応募判断の中心情報が伝わらない。deep focus で床の排水口まで解像させることで、清掃が行き届いている状態が根拠として写る。","caution":"人物を入れない構図なので肖像の問題は生じないが、実際の厨房より広く清潔に見える画は入社後の早期離職につながるため、設備の数と配置は依頼主の現場に合わせること。実在する店舗の紹介として使う場合は職場の雰囲気を伝えるイメージである旨を明示し、実写の店内写真と同じ並びに混在させない。設備のメーカー名、注意書きのラベル、メニューの貼り紙は高確率で崩れるため文字は生成させず、必要なら編集工程で合成する。","status":"未検証","flow":{"code":"T2I","step":"工程1 / 2","input":"新規。参照画像は使わず文章だけで作る。レンジの口数、作業台の数、窓の位置を依頼主の厨房に置き換える。人物は入れない","output":"16:9 の静止画1枚。厨房の広さ、窓光の方向、床と設備の清潔さがここで確定する","next":"床と設備が破綻していない1枚を「湯気と換気扇（始業前の厨房を動かす）」に渡して動かす"}},{"id":"recruit-02","sub":"workplace","title":"湯気と換気扇（始業前の厨房を動かす）","purpose":"無人の厨房に湯気とファンの回転だけを足し、人物を出さずに「稼働している職場」として読ませる。求人媒体の縦型枠や採用ページの背景ループに使い、一覧の中で止まる素材にする。","model":"Higgsfield / Wan 2.7、5秒・720p（約8クレジット）。湯気と流体の表現に強く、最安で試せる","text":"Steam rises slowly and thinly from one stock pot on the range and drifts to the right, the ceiling exhaust fan blades turn at a slow constant rate, the window light stays unchanged, no people enter the frame, the counters, the equipment and the camera all stay completely still, slow, subtle, constant speed, no cuts","effect":"湯気という一方向の上昇運動とファンの回転という定速の回転運動だけに動きを限定すると、ステンレスの直線や床のタイル目地が作り変えられるリスクが最小になる。無人のまま湯気が立つことで、人を写さずに職場が動いていることだけが伝わる。","caution":"湯気は増殖して画面を覆いやすいので thinly と slowly を外さず、量が増えた出力は捨てる。人物が画面に湧いた出力は、AI生成の人物を実在の社員として提示することになるため使わずに破棄する。タイル目地と作業台の直線が歪んでいないかを等倍で確認すること。","status":"未検証","flow":{"code":"I2V","step":"工程2 / 2","input":"「開店前の厨房・窓光の全景（無人）」（T2I）で作った静止画1枚。新しく画像は作らない。構図・光・設備は静止画で確定済みのものを使う","output":"5秒の動画1本。湯気の上昇と換気扇の回転だけが動く","next":"採用ページの冒頭ループ、または求人媒体の動画枠の1カット目に置く。縦型に切り出して SNS の採用発信にも回す","where":"生成画面でモデルを選ぶ（image-to-video）","whereNote":"最も安く、Seedance 2.0 系・Kling 3.0・Wan 2.7 なら Unlimited 対象"}},{"id":"recruit-03","sub":"workplace","title":"ホテルのバックヤードとリネン室（後ろ姿）","purpose":"都市型ホテルの裏方という、求人票では伝わりにくい仕事場を見せる。接客以外の持ち場があることを示して、応募の間口を広げるカット。人物は後ろ姿のみで顔を映さない構図なので、肖像の問題が生じにくく他の施設にも使い回せる。","model":"静止画。手持ちのツールで可（ChatGPT / Gemini / Higgsfield の Soul 2.0 など）。後ろ姿の指定を外すと顔が生成されるので必ず残す","text":"The linen room and back corridor of a city hotel in Tokyo, one staff member seen only from behind in a plain apron over long sleeves, shoulders and back visible with the head turned away so the face is not in frame, folding a white towel at a stainless work table, open shelving stacked with white sheets and towels in neat squared piles, a housekeeping cart parked against the wall, a mop and bucket stored upright in the corner, a corridor window at the end of the room looking onto the wall of the adjacent building, medium wide shot at standing eye level from behind the person, 35mm equivalent, deep focus so the shelf stacks at the far end stay readable, daylight from the corridor window at 4500K as the main source with a weak overhead fill so the shelving does not fall into shadow, soft cotton terry texture, brushed stainless table, scuffed vinyl floor, photorealistic documentary interior photography, neutral grade, no text, no logo","effect":"後方から撮ると顔が物理的に画面に入らないため、人物が写りながら特定の個人を提示しない構図が成立する。窓光を廊下の奥に置くことで視線が奥へ抜け、バックヤードの奥行きと棚の収納量が同時に読める。","caution":"AI生成の人物を実在の社員として提示しない。掲載時は職場の雰囲気を伝えるイメージである旨を明示すること。背中が写る構図でも、振り向いた顔が生成された出力は使わず破棄する。制服のワッペン、タグの文字、館内表示は崩れるので文字は生成させず、必要なら編集工程で合成する。棚の積み重ねとリネンの枚数は反復構造として破綻しやすいので等倍で確認すること。","status":"未検証","flow":{"code":"T2I","step":"工程1 / 2","input":"新規。参照画像は使わない。棚の規模、カートの有無、廊下の窓位置を依頼主の施設に置き換える。人物は後ろ姿のみで、顔が入る指定は加えない","output":"16:9 の静止画1枚。バックヤードの奥行き、収納量、後ろ姿の位置がここで確定する","next":"顔が入っていない1枚を「リネンを抱えた後ろ姿が通る（裏方の動線）」に渡して動かす"}},{"id":"recruit-04","sub":"workplace","title":"リネンを抱えた後ろ姿が通る（裏方の動線）","purpose":"バックヤードの静止画に歩行の動きだけを足し、仕事の流れを人物の顔なしで伝える。他社の求人画像が客室だけを見せている中で、実際の持ち場を見せて差をつけるカット。","model":"Higgsfield / Kling 3.0、5秒・1080p（約12.5クレジット）。人物の歩行は破綻しやすいため、カメラ移動が安定するモデルを選ぶ","text":"The staff member picks up the folded stack of towels and walks slowly away from the camera down the corridor at a natural pace, the back of the head and shoulders stay toward the camera throughout and the person never turns around, the folded stack stays the same size, the shelving, the cart and the camera all stay completely still, slow, subtle, constant speed, no cuts","effect":"カメラから遠ざかる歩行は顔が画面に入らない運動方向なので、後ろ姿という設計を動画でも維持できる。奥へ抜ける移動が廊下の長さを視差として示し、静止画では出ない施設の規模が伝わる。","caution":"歩行は脚の数と歩行周期が破綻しやすく、途中で振り向く挙動が混ざると顔が生成される。never turns around の指定を外さず、顔が写った出力は使わずに破棄する。AI生成の人物を実在の社員として提示しない。掲載時はイメージである旨を明示すること。抱えたリネンが増減していないかも等倍で確認する。","status":"未検証","flow":{"code":"I2V","step":"工程2 / 2","input":"「ホテルのバックヤードとリネン室（後ろ姿）」（T2I）で作った静止画1枚。新しく画像は作らない。顔が入っていない枚のみを入力にする","output":"5秒の動画1本。後ろ姿の歩行とリネンの移動だけが動く","next":"採用動画の中盤、または仕事の一日を追う構成の2カット目に置く","where":"生成画面でモデルを選ぶ（image-to-video）","whereNote":"最も安く、Seedance 2.0 系・Kling 3.0・Wan 2.7 なら Unlimited 対象"}},{"id":"recruit-05","sub":"workplace","title":"職場全景の差し替え型（事務所・休憩室・更衣室・売場・倉庫）","purpose":"業種と部屋だけを入れ替えて同じ構図で撮り揃えるための型。応募者が実際に過ごす場所を無人カットで並べ、人物を出さずに職場の実像を示す。比較されたときに情報量で負けないための素材。","model":"静止画。手持ちのツールで可（ChatGPT / Gemini / Higgsfield の Soul 2.0 など）。部屋だけを差し替えて同じ型で数点作る","text":"An empty [room: small company office with four desks facing a window / staff break room with a six-seat table and a kitchenette / changing room with a row of steel lockers and a bench / retail shop floor aisle with stocked shelving / logistics warehouse picking aisle with pallet racking] in a small business in Tokyo, completely empty of people, everything in use but tidy, [detail: monitors asleep and a wall clock / an electric kettle, mugs on a tray and a wall-mounted first-aid box / lockers closed with a folded apron on the bench / price rail strips left blank with no lettering / plain cardboard cartons and a hand pallet truck parked straight], a vinyl, carpet or sealed concrete floor swept clean, a window on one side looking onto a city street or an adjacent building wall, wide interior shot at standing eye level from the doorway, 24mm equivalent, deep focus so the far wall and the floor at the frame edge both stay sharp, daylight from the side window at 4500K as the main source with a weak overhead fill so the ceiling and the corners stay legible, matte laminate surfaces, powder-coated steel, worn but clean flooring, photorealistic documentary interior photography, neutral grade, no text, no logo","effect":"同じ焦点距離・同じ立ち位置・同じ光の条件で部屋だけを差し替えると、業種が違っても同じシリーズのカットとして横並びにできる。無人で deep focus にすることで、広さと清潔さという応募判断の中心情報だけが残り、個人の提示という問題が構造的に発生しない。","caution":"実際にない部屋や設備を描かないこと。休憩室、更衣室、ロッカーの有無と実物の状態は必ず依頼主に確認し、確認が取れない部屋はこの型から外す。実物より広く新しく見える画は入社後の早期離職につながる。掲載時は職場の雰囲気を伝えるイメージである旨を明示し、実写の社内写真と同じ並びに混在させない。値札、ロッカーの名札、掲示物、段ボールの印字は崩れるので文字は生成させず、空白のまま出して編集工程で合成する。","status":"未検証","flow":{"code":"T2I","step":"単発","input":"新規。参照画像は使わない。[room] と [detail] を依頼主に実在が確認できた部屋だけに差し替え、同じ
